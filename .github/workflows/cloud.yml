name: cloud
# Gates the SEPARATE Barkpark Cloud control-plane app at cloud/ (scaffolded in cloud-7).
# It is a distinct Elixir app from api/ (stores metadata about many Barkpark instances),
# so it needs its own compile + format + test gate — mirrors api/'s elixir.yml, scoped to cloud/.
# cloud-8 (identity) brought the FIRST tests, so the `test` job below adds a Postgres
# service + `mix test`, mirroring api/'s elixir.yml Test job. The `compile` job keeps
# the fast compile+format signal (no DB needed).
on:
  pull_request:
    paths:
      - "cloud/**"
      - ".github/workflows/cloud.yml"
  push:
    branches: [main]
    paths:
      - "cloud/**"
      - ".github/workflows/cloud.yml"

concurrency:
  group: cloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Cloud control-plane (compile + format)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    strategy:
      matrix:
        otp: ["27.0"]
        elixir: ["1.18.1"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            cloud/deps
            cloud/_build
          key: cloud-${{ runner.os }}-otp${{ matrix.otp }}-${{ hashFiles('cloud/mix.lock') }}
      - name: Fetch deps
        run: mix deps.get
      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors
      - name: Format check
        run: mix format --check-formatted

  test:
    name: Cloud control-plane (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: barkpark_cloud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      DATABASE_URL: ecto://postgres:postgres@localhost:5432/barkpark_cloud_test
    strategy:
      matrix:
        otp: ["27.0"]
        elixir: ["1.18.1"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            cloud/deps
            cloud/_build
          key: cloud-test-${{ runner.os }}-otp${{ matrix.otp }}-${{ hashFiles('cloud/mix.lock') }}
      - name: Fetch deps
        run: mix deps.get
      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors
      - name: DB setup
        run: |
          mix ecto.create
          mix ecto.migrate
      - name: Test
        run: mix test
