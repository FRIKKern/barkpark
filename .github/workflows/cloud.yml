name: cloud
# Gates the SEPARATE Barkpark Cloud control-plane app at cloud/ (scaffolded in cloud-7).
# It is a distinct Elixir app from api/ (stores metadata about many Barkpark instances),
# so it needs its own compile + format + test gate — mirrors api/'s elixir.yml, scoped to cloud/.
# cloud-8 (identity) brought the FIRST tests, so the `test` job below adds a Postgres
# service + `mix test`, mirroring api/'s elixir.yml Test job. The `compile` job keeps
# the fast compile+format signal (no DB needed).
#
# Jobs:
#   0. changes      — the DISPATCHER. Always runs. Computes the changed-path set and
#                     emits the one boolean the expensive jobs are gated on.
#   1. compile      — compile + format. Gated on the cloud path set.
#   2. test         — Postgres + `mix test`. Gated on the cloud path set.
#   3. census       — ONE test file. Gated on the CENSUS path set, and only when
#                     the cloud set did NOT select (`test` already runs it then).
#   4. path-escape  — the path ratchet + its harness. Unfiltered, blocking.
#   5. cloud-gate   — the AGGREGATOR. The one name that should be REQUIRED.
#
# ── WHY THERE IS NO `on: … paths:` FILTER HERE ANY MORE ──────────────────────
# This workflow carried one until wave 9. A WORKFLOW-LEVEL paths filter emits NO
# check run at all on a non-matching PR, so a required context pointing at this
# workflow would report "expected" forever and DEADLOCK every docs-only, api-only
# and js-only PR (honest-gates D18, re-measured as this epic's D89). The filter
# therefore moves DOWN: an always-running dispatcher computes the path verdict and
# the expensive jobs carry job-level `if:`. Every job still publishes a check run
# on every PR; the cheap ones are `skipped`, and the aggregator below decides
# whether a skip was legitimate. That is what makes `Cloud gate` registrable.
#
# The path set itself is declared ONCE, in scripts/cloud-path-escape-check.sh —
# the ratchet that proves it covers everything the suite reads. Nothing here may
# hand-write a path list; that is how the two drift apart.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # per-sha on main: a per-ref group evicts the PENDING main run when the next merge lands,
  # so the older sha never gets a verdict (same fix as security.yml; measured 2026-09-02).
  group: cloud-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # Cancel superseded PR runs, but NEVER cancel main: fast push cadence
  # otherwise starves the suite (2026-06-10: 19 consecutive main runs
  # cancelled, zero completions all day). Queued main runs collapse to one.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    # THE DISPATCHER. No `if:`, no matrix, no path filter — it runs on every
    # event, always, so the jobs behind it always have a defined answer.
    #
    # It never emits `false` when it cannot tell. On an unresolvable base, a
    # base with no common ancestor, or an uninterpretable verdict it FAILS; on
    # an empty diff — rare but legal — it dispatches TRUE. That polarity is the
    # whole point: a dispatcher that "couldn't tell" and emitted all-false would
    # skip the entire Cloud suite and publish a green required context.
    # Never a silent false: fail, or run everything.
    name: Dispatch (cloud paths)
    runs-on: ubuntu-latest
    outputs:
      cloud: ${{ steps.sets.outputs.cloud }}
      # THE SECOND, CHEAPER VERDICT (dr-w26-followup-reader-corpus-dispatch).
      # `cloud` says "run compile+test"; `census` says "re-run the reader-corpus
      # census". They are independent questions with independent prices — see
      # THE CENSUS TIER in scripts/cloud-path-escape-check.sh — and EVERY exit
      # from the step below must set BOTH, or a downstream `if:` reads an empty
      # string and the job silently never runs.
      census: ${{ steps.sets.outputs.census }}
    steps:
      - uses: actions/checkout@v4
        with:
          # THE PR HEAD, not the merge ref. With no `ref:`, checkout lands on
          # `refs/pull/N/merge` — a commit that already contains main's advance
          # — while `pull_request.base.sha` LAGS the base branch tip. The
          # three-dot diff below then sweeps in every commit main gained since
          # that stale base, and a one-file PR dispatches as if it touched ten
          # (honest-gates D34). Pinning the head sha makes the diff describe
          # THIS PR.
          #
          # This job ONLY. Every other job here deliberately keeps the merge
          # ref: they must test the merged result, not the head in isolation.
          # `github.sha` is the fallback for `push` events, which have no PR.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # FULL HISTORY, BLOBLESS. These two options are ORTHOGONAL and this
          # job needs both — DEPTH and FILTER are different axes, and confusing
          # them is exactly how this was first written and reverted (run
          # 33691239048, three of four dispatchers red on `PR base <sha> and
          # HEAD share NO common ancestor`).
          #
          # `fetch-depth: 0` — REQUIRED, do not drop it. The PR base sha must be
          # resolvable locally for the three-dot diff below, and a three-dot
          # diff resolves the MERGE BASE; a shallow history cannot compute one,
          # and this step treats an unresolvable base as a hard failure rather
          # than emit a verdict. Dropping this line does NOT leave "whatever the
          # filter gives you": actions/checkout then applies its DEFAULT depth
          # of 1, and a depth-1 clone — blobless or not — has no merge base.
          # `fetch-depth: 2` does not rescue it either; that trick works on jobs
          # sitting on `refs/pull/N/merge`, where HEAD^1 IS the base, and this
          # job deliberately is not one of those (see the `ref:` note above).
          #
          # `filter: blob:none` — the actual saving, and it is NOT shallowness.
          # A blobless partial clone fetches every commit and every tree and
          # omits only blob CONTENTS. `git diff --name-only` reads trees, not
          # blobs, so the commit graph, the merge base and the path set below
          # are unchanged BY CONSTRUCTION rather than by benchmark.
          #
          # THE DERIVATION, NOT A BARE NUMBER — a committed figure with no
          # command attached is exactly the thing that silently rots. Re-run it:
          #     bash scripts/dispatch-blobless-proof.sh
          # It clones this repo both ways at FULL depth, compares the three-dot
          # changed-path sets by SORTED CHECKSUM, and refuses to report a pass
          # if a sample is empty on both sides (two empty sets match, which
          # would be vacuous). Read 2026-09-03: full clone 138 s / .git 791 MB,
          # blobless 34 s / .git 189 MB, 5 sampled PRs IDENTICAL on both sides.
          fetch-depth: 0
          filter: blob:none

      - id: sets
        name: Compute the changed-path set
        run: |
          set -euo pipefail

          event="${{ github.event_name }}"
          if [ "$event" != "pull_request" ]; then
            # push-to-main (and anything else): NEVER skip. Main is the branch
            # every other run is compared against; a partial main is worse than
            # a slow one, and there is no reviewer left to notice.
            echo "event '$event' is not a pull_request — the path sets are true."
            echo "cloud=true" >> "$GITHUB_OUTPUT"
            echo "census=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            echo "::error::dispatcher: the PR carries no base sha. Refusing to guess — a guessed base skips the suite and reports green."
            exit 1
          fi

          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            # The base commit can be absent from this checkout during burst
            # merges. Try to fetch it once, then give up loudly.
            git fetch --no-tags --quiet origin "$base" 2>/dev/null || true
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::error::dispatcher: PR base sha ${base} is not resolvable in this checkout. Refusing to emit a path verdict from an unknown base."
            exit 1
          fi

          # A base with NO common ancestor makes the three-dot diff below exit
          # 128 with a raw `fatal: … no merge base` and ZERO annotation: under
          # `set -euo pipefail` the assignment dies and the author sees a red
          # dispatcher with no guidance. Name the condition instead. There is
          # deliberately NO two-dot fallback — measured, `base HEAD` sweeps in
          # the base's ENTIRE content and dispatches true for the wrong reason,
          # which is exactly the "verdict from an unknown base" this job refuses.
          if ! git merge-base "$base" HEAD >/dev/null 2>&1; then
            echo "::error::dispatcher: PR base ${base} and HEAD share NO common ancestor, so the three-dot diff is undefined. Refusing to emit a path verdict — and refusing a two-dot fallback, which would sweep in the base's entire content. Rebase the branch onto its base branch."
            exit 1
          fi

          echo "diff base: ${base} (three-dot against HEAD)"
          # `-z` + `--no-renames` are BOTH load-bearing; either alone certifies
          # a hole (measured, wave 10):
          #   * plain `--name-only` QUOTES and octal-escapes any path holding a
          #     non-ASCII byte, and keeps quoting `"`, `\` and newline even under
          #     core.quotepath=false — `cloud/lib/we"ird.ex` prints as
          #     `"cloud/lib/we\"ird.ex"`, the anchored ERE below misses it, and
          #     this job reports a GREEN required context over a suite that never
          #     ran. `-z` emits the raw bytes, which cannot be quoted; `tr`
          #     restores the line format the matcher reads.
          #   * rename detection (default-on since git 2.9) prints only the
          #     DESTINATION, so `git mv cloud/lib/a.ex docs/a.ex` yields
          #     cloud=false while cloud/** just lost a file. `--no-renames`
          #     prints both sides.
          changed="$(git -c core.quotepath=false diff -z --name-only --no-renames "${base}...HEAD" | tr '\0' '\n')"
          echo "changed files:"
          printf '%s\n' "$changed"

          if [ -z "$changed" ]; then
            # RARE BUT LEGAL: a revert pair inside one branch, or a branch-sync
            # PR, nets to nothing against the base. The old polarity failed here
            # — a permanently red required context on a legal PR, with no
            # self-service fix for the author. Run everything instead: expensive,
            # never wrong. Never `false`, which is the only truly unsafe answer.
            echo "::warning::dispatcher: the changed-file set is EMPTY (a revert pair or a branch-sync PR nets to nothing against ${base}). Dispatching cloud=true and running the WHOLE suite rather than skipping it — a skip here would green a required context nothing measured. Cost: the full Cloud compile + test suite."
            echo "cloud=true" >> "$GITHUB_OUTPUT"
            echo "census=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── THE SCRIPT MUST MATCH THE WORKFLOW (task-3a81e68f7027ca98) ───
          # GitHub takes the WORKFLOW FILE for a `pull_request` run from the
          # MERGE REF, while this job deliberately checks out the PR HEAD (the
          # D34 note on the checkout above). Those are two different commits, so
          # the invocation written here used to run against the BRANCH's copy of
          # scripts/cloud-path-escape-check.sh. Any head branched before a
          # change to that script's CLI surface then answered
          # `cloud-path-escape-check: unknown path set 'census' (want cloud)`
          # and exited 2 — a RED required `Cloud gate` with no defect in the PR.
          # Measured 2026-09-11 on PR #17575, job 103113143741, `changed files:
          # scripts/format-check.sh`. It is a CLASS, not a one-off: the same
          # skew fires for every future flag this step learns, against every PR
          # branched before it, until each one is update-branched.
          #
          # THE SPLIT. The DIFF still comes from the head checkout — D34 intact,
          # the changed-file set must describe THIS PR and not main's advance.
          # The SCRIPT is pinned to the commit the workflow file itself came
          # from, the merge ref, so flag and parser are matched BY CONSTRUCTION
          # rather than by rebase etiquette. A `git show` off a fetched ref; the
          # checkout is a blobless partial clone, so this costs one commit, its
          # trees and one blob, never a second working tree.
          #
          # The two DISPATCH_PIN_* hooks are how case 10 of
          # scripts/cloud-path-escape-check.test.sh drives this exact block
          # against a local fixture repo (it points them at a ref inside the
          # fixture). Actions sets neither; the defaults below are the real
          # values, so the tested path IS the shipped path.
          pin_remote="${DISPATCH_PIN_REMOTE:-origin}"
          pin_ref="${DISPATCH_PIN_REF:-refs/pull/${{ github.event.pull_request.number }}/merge}"
          pin_script="scripts/cloud-path-escape-check.sh"
          pin_src="the PR HEAD checkout — NOT the commit this workflow file came from"
          # A PIN *ROOT*, not a loose file. cloud-path-escape-check.sh resolves
          # its own DECL_ROOT as `dirname($0)/..`, and the census tier derives
          # its corpus from a declaration FILE under that root. A pinned copy
          # dropped straight into $RUNNER_TEMP therefore gets
          # DECL_ROOT=/home/runner/work, finds no declaration, and exits 2 on
          # EVERY `--match census` — which match_set below turns into a
          # permanent census=true. Measured 2026-09-11 in case 10 of
          # scripts/cloud-path-escape-check.test.sh: a docs-only fixture came
          # back census=true. So the pinned copy lands at <pinroot>/scripts/
          # and the declaration it NAMES is pinned beside it off the same ref —
          # parser and corpus move together or not at all.
          pinroot="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/dispatcher-pinroot"
          rm -rf "$pinroot"
          mkdir -p "$pinroot/scripts"
          pinned="$pinroot/scripts/cloud-path-escape-check.sh"

          if git fetch --no-tags --quiet "$pin_remote" "+${pin_ref}:refs/dispatcher/pinned" 2>/dev/null \
             && git show refs/dispatcher/pinned:scripts/cloud-path-escape-check.sh >"$pinned" 2>/dev/null \
             && [ -s "$pinned" ]; then
            pin_script="$pinned"
            pin_src="${pin_ref} ($(git rev-parse refs/dispatcher/pinned))"
            # The corpus declaration, from the SAME ref. The script names the
            # file itself (`--census-source`) so this follows a rename of it
            # instead of hard-coding a path here that goes quietly stale.
            # A failure here is NAMED and NOT fatal: `--match census` then
            # exits 2 and match_set dispatches census=true out loud — more
            # runs, never a silent skip.
            censrc="$(bash "$pin_script" --census-source 2>/dev/null || true)"
            case "$censrc" in
              */*)
                mkdir -p "$pinroot/$(dirname "$censrc")"
                git show "refs/dispatcher/pinned:${censrc}" >"$pinroot/$censrc" 2>/dev/null \
                  || echo "::warning::dispatcher: pinned the script from ${pin_ref} but could NOT pin its census declaration '${censrc}' from the same ref. The census verdict below falls back to true."
                ;;
              *)
                echo "::warning::dispatcher: the pinned script did not name a census declaration source (--census-source printed '${censrc}'). The census verdict below falls back to true."
                ;;
            esac
          else
            # NAMED, never silent — and deliberately NOT fatal. A merge ref is
            # absent for a PR with conflicts, and killing the dispatcher there
            # would leave the gated jobs with no answer at all, which is the
            # very failure this change exists to end.
            echo "::warning::dispatcher: could NOT read scripts/cloud-path-escape-check.sh out of ${pin_ref} on remote '${pin_remote}' (an absent merge ref — a conflicted PR — is the usual cause). Falling back to the PR HEAD's own copy, which may predate this workflow's CLI surface. A verdict this fallback cannot compute becomes true (the WHOLE suite runs) and says so by name below. Degraded read, not a green."
          fi
          echo "path-set script: ${pin_src}"

          # NEVER exit 2 on skew, and never a silent `false`. A refusal from the
          # script — exit 2 on an unknown set name, exit 127 on a head that has
          # no such file — says THIS STEP could not measure the question, not
          # that the answer is no. So the answer to "could not tell" is the
          # expensive one: dispatch TRUE, run everything, print a ::warning
          # naming the skew. Same polarity as the empty-diff branch above and as
          # the job header: fail, or run everything; never a silent false.
          # This does NOT hide a genuinely broken script — the `path-escape` job
          # below is DELIBERATELY UNFILTERED and runs `--selftest` and the
          # ratchet itself on every PR, off the merge ref, and reds the same
          # required context.
          #
          # A here-string for BOTH sets, never a pipe: `--match` answers through
          # `grep -Eq`, which exits the instant it matches, and a writer still
          # holding bytes then takes SIGPIPE that `set -o pipefail` promotes over
          # the match that DID occur (the house D37 rule). A here-string has no
          # writer process. The `cloud` call carried that pipe until this change.
          # THE `--match` STAYS AT THE CALL SITE, spelled out. scripts/which-gates.sh
          # discovers "which gate will this diff dispatch" by scraping the
          # dispatch call sites out of these workflows, and it keys on
          # `--match <set>` at command position. Hiding the flag inside the
          # helper made that scan find ZERO call sites repo-wide and print its
          # CANNOT READ (measured 2026-09-11, task-3a81e68f7027ca98) — so the
          # helper takes the flag verbatim and refuses anything else, and the
          # two calls below read exactly as the console and elixir ones do.
          match_set() {
            local flag="$1" want="$2" out rc=0
            if [ "$flag" != "--match" ]; then
              echo "::error::dispatcher: match_set takes '--match <set>' verbatim (got '${flag}')."
              exit 1
            fi
            out="$(bash "$pin_script" --match "$want" <<<"$changed")" || rc=$?
            case "$out" in
              true | false)
                printf '%s' "$out"
                return 0
                ;;
            esac
            echo "::warning::dispatcher: ${pin_script} could not answer '--match ${want}' (exit ${rc}, printed '${out}'). The script was read from ${pin_src}; a workflow/script VERSION SKEW is the usual cause — this head predates the flag this workflow calls with. Dispatching ${want}=true: running more, never a silent skip." >&2
            printf 'true'
          }

          cloud="$(match_set --match cloud)"
          census="$(match_set --match census)"

          # Belt and braces. `match_set` cannot return anything but true|false,
          # so this loop is unreachable TODAY — it is kept as the guard on a
          # future edit that computes a verdict without going through it.
          for pair in "cloud=${cloud}" "census=${census}"; do
            case "${pair#*=}" in
              true | false) ;;
              *)
                echo "::error::dispatcher: refusing to emit the uninterpretable verdict ${pair}."
                exit 1
                ;;
            esac
          done

          echo "verdict: cloud=${cloud} census=${census}"
          echo "cloud=${cloud}" >> "$GITHUB_OUTPUT"
          echo "census=${census}" >> "$GITHUB_OUTPUT"

  path-escape:
    # DELIBERATELY UNFILTERED — no `if:`, no dependency on the dispatcher. This
    # job proves the dispatcher's path set still covers everything the suite
    # reads, so gating it on that same set would let it go dark exactly when it
    # is needed (honest-gates D26: a harness nobody runs is not a ratchet). It
    # costs a few seconds of bash.
    name: Cloud path-escape ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: setup

      - name: Harness (the ratchet must be able to fail)
        run: bash scripts/cloud-path-escape-check.sh --selftest

      - name: Every repo-root read is dispatched on
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash scripts/cloud-path-escape-check.sh

      # ── the FailureCopy scrub/strip_ansi ORDER tripwire ──────────────────
      # Lives in THIS job, not a new one, and not in shell-harnesses.yml:
      #
      #   * `path-escape` is already in `cloud-gate`'s `needs:`, so a red here
      #     reds the REQUIRED `Cloud gate` context. A new job would have to be
      #     added to that needs set to mean anything, and a new WORKFLOW could
      #     not be required at all without a fresh branch-protection context.
      #   * `path-escape` is DELIBERATELY UNFILTERED (see the comment at the
      #     top of this job): no `if:`, no dependency on the dispatcher. The
      #     tripwire inherits that. A leak added on a PR that the cloud
      #     dispatcher happens not to fire on would otherwise skip the only
      #     gate that sees it — and the skip would report green.
      #   * shell-harnesses.yml states the rule for the other direction: a
      #     harness "already REACHED by a wired parent's --selftest" is
      #     deliberately NOT duplicated there, because that buys a second
      #     runner for the same assertions. The --selftest step below IS that
      #     wired parent, so this script has no row in that census by the
      #     census's own doctrine.
      #
      # Harness FIRST, subject second — the house selftest-first idiom. A gate
      # that cannot be shown to fail is not evidence that nothing failed.
      - name: Harness (the scrub-order tripwire must be able to fail)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          if [ -z "${BREAKER_CAPTURE_ARMED:-}" ] && [ -f "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" ]; then exec bash "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" "$0"; fi  # main-red breaker: capture this step's error block
          bash scripts/failure-copy-scrub-order-check.sh --selftest

      - name: No display boundary scrubs before it strips ANSI
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          if [ -z "${BREAKER_CAPTURE_ARMED:-}" ] && [ -f "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" ]; then exec bash "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" "$0"; fi  # main-red breaker: capture this step's error block
          bash scripts/failure-copy-scrub-order-check.sh

      # ── the DNS step VOCABULARY pin (dr-w22-bl-internal-cli-…-gates) ──────
      # Same job, and for the same three reasons the scrub-order tripwire above
      # gives — `path-escape` is in `cloud-gate`'s `needs:` so a red here reds
      # the REQUIRED `Cloud gate`; it is DELIBERATELY UNFILTERED so the pin
      # cannot go dark on the PR that breaks it; and a wired parent `--selftest`
      # is what keeps this script out of shell-harnesses.yml's census by that
      # census's own doctrine.
      #
      # WHAT IT BUYS THAT NOTHING ELSE DID. `FailureCopy.@dns_step` classifies a
      # DNS failure by VERB, and every verb in it is a transcription of a Go
      # `fmt.Errorf` prefix emitted by internal/cli/cloud/dns.go,
      # internal/cli/cloud/dns_cloud.go and internal/hetzner/dns.go. Before this
      # step, NO assertion anywhere read those Go bytes: `failure_copy_test.exs`
      # pins a HAND-TRANSCRIBED corpus, so it proves the clause matches its own
      # fixtures and nothing about what the readers emit — and that test's own
      # comment records the same defect one iteration back, three pinned strings
      # "no producer anywhere emits". Rename a verb on the Go side today and the
      # console silently starts calling a DOMAIN failure a SERVER-CAPACITY one,
      # with every gate green. This is the derivation that can lose.
      #
      # Harness FIRST, subject second — the house selftest-first idiom.
      - name: Harness (the DNS vocabulary pin must be able to fail)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          if [ -z "${BREAKER_CAPTURE_ARMED:-}" ] && [ -f "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" ]; then exec bash "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" "$0"; fi  # main-red breaker: capture this step's error block
          bash scripts/cli-dns-step-vocabulary-check.sh --selftest

      - name: Every DNS step verb the Go readers emit is classified
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          if [ -z "${BREAKER_CAPTURE_ARMED:-}" ] && [ -f "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" ]; then exec bash "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" "$0"; fi  # main-red breaker: capture this step's error block
          bash scripts/cli-dns-step-vocabulary-check.sh

  compile:
    name: Cloud control-plane (compile + format)
    needs: changes
    if: needs.changes.outputs.cloud == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    strategy:
      matrix:
        otp: ["27.0"]
        elixir: ["1.18.1"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            cloud/deps
            cloud/_build
          key: cloud-${{ runner.os }}-otp${{ matrix.otp }}-${{ hashFiles('cloud/mix.lock') }}
      - name: Fetch deps
        run: mix deps.get
      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors
      - name: Format check
        # THE VERSION IS PART OF THE VERDICT. This job formats with Elixir
        # ${{ matrix.elixir }}; dev checkouts run 1.19.x, and the two formatters
        # disagree — so a green local `mix format --check-formatted` is NOT this
        # gate (task-417026dfc4826971, PR #17482). Say so AT THE POINT OF
        # FAILURE, or the next agent spends a cycle re-running the green one.
        run: |
          if mix format --check-formatted; then exit 0; fi
          echo "::error title=Cloud format gate ran Elixir ${{ matrix.elixir }}::This job formatted with Elixir ${{ matrix.elixir }} (pinned in .github/workflows/cloud.yml). Dev checkouts run 1.19.x and the two formatters DISAGREE, so a green local 'cd cloud && mix format --check-formatted' does not measure this gate — and a local 'mix format' will rewrite gate-correct bytes into gate-red ones. Reproduce the gate locally with: make cloud-format-check"
          exit 1

  test:
    name: Cloud control-plane (test)
    needs: changes
    # Gated on the SAME set as compile. Note what rides in that set beyond
    # cloud/**: js/packages/create-barkpark-app/templates/** is here because
    # cloud/priv/templates/** is a COPY of those templates
    # (`make cloud-templates-sync`), guarded by AppFilesDriftTest in THIS job.
    # Editing the SOURCE must run that guard on THIS PR — else the sync is
    # skipped and drift lands (the #963→#969 class). That trigger used to live
    # in the workflow-level `on: paths:` filter deleted above; it now lives in
    # scripts/cloud-path-escape-check.sh's CLOUD_PATHS, which is what this
    # `if:` resolves through. Losing it would silently drop the drift guard.
    if: needs.changes.outputs.cloud == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: barkpark_cloud_test
        ports:
          - 5432:5432
        # --health-interval 2s, not the 10s default: `Waiting for all services
        # to be ready` was measured at 15.5 s (elixir Test) and 13.6 s (cloud
        # test) while pg_isready answers in ~3 s — that wait is poll
        # granularity, not postgres. Same health command, polled sooner.
        # (Comments cannot live inside the folded `>-` block below: they would
        # be passed to docker as literal arguments.)
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      DATABASE_URL: ecto://postgres:postgres@localhost:5432/barkpark_cloud_test
    strategy:
      matrix:
        otp: ["27.0"]
        elixir: ["1.18.1"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      # cch-w49-s3: the cross-layer mirror guard
      # (cloud/test/barkpark_cloud/billing_client_mirror_test.exs) reads the
      # CONSOLE's own plan catalog by RUNNING it — System.cmd("node", …) over
      # priv/static/__preview__/__plan_catalog_dump.mjs — and it ASSERTS on a
      # missing node rather than skipping. So node is a hard dependency of this
      # job, pinned here rather than inherited from whatever the runner image
      # happens to ship (the same discipline every other node-running workflow
      # in this repo already follows). ~5s.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            cloud/deps
            cloud/_build
          key: cloud-test-${{ runner.os }}-otp${{ matrix.otp }}-${{ hashFiles('cloud/mix.lock') }}
      - name: Fetch deps
        run: mix deps.get
      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors
      - name: DB setup
        run: |
          mix ecto.create
          mix ecto.migrate
      - name: Test
        run: mix test

  census:
    # ── THE CHEAP TIER (dr-w26-followup-reader-corpus-dispatch) ──────────────
    #
    # cloud/test/barkpark_cloud/reader_less_instrument_census_test.exs walks
    # FIVE trees of source — internal, cloud/priv/static, web, js, api — asking
    # which registered instruments have a reader. Two of those trees are inside
    # the cloud path set; api/, web/ and js/ are deliberately NOT, because
    # declaring them there was built and MEASURED at +2233 newly-dispatching
    # commits per 60 days (api/** alone 1438) — 33% -> 77% of all commits paying
    # for the whole Postgres-backed suite. So a reader ARRIVING in api/ — the
    # rot-clearing direction, the good one — did not re-run the census that
    # scores it, and the stale row's red landed on some later, innocent,
    # cloud-touching PR instead.
    #
    # This job is the honest price of that signal: the census needs ITSELF
    # dispatched, not the suite. One `mix test` of one file.
    #
    # THE `if:` IS THE WHOLE MECHANISM, and both halves are load-bearing:
    #   * `census == 'true'`  — the diff touched a tree ReaderScan walks. The
    #     roots are DERIVED from that test's own `@roots` declaration, so the
    #     corpus and the dispatch condition cannot drift (THE CENSUS TIER in
    #     scripts/cloud-path-escape-check.sh).
    #   * `cloud != 'true'`   — when the cloud set DID select, the `test` job
    #     above already runs this file as part of `mix test`. Running it here
    #     too would buy a second runner for the same assertions and nothing
    #     else. The aggregator knows this: a skip against cloud=true is in its
    #     allow-set, and the reason is written there too.
    #
    # NOT a workflow-level `on: … paths:` filter, and never one: that shape
    # emits no check run at all and deadlocks the required context (D18/D89 —
    # see the header of this file). The filter stays DOWN here, in a job-level
    # `if:` fed by the always-running dispatcher.
    name: Cloud reader-corpus census
    needs: changes
    if: needs.changes.outputs.census == 'true' && needs.changes.outputs.cloud != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    services:
      # The census module is `use ExUnit.Case, async: true` and touches no rows,
      # but cloud/test/test_helper.exs calls `Sandbox.mode(BarkparkCloud.Repo,
      # :manual)` on the way in — that is suite-wide setup, not this file's, and
      # it needs a live Repo. Same service block as `test`, deliberately: the
      # saving this job exists for is NOT running the other ~N thousand tests,
      # and buying it by starving the helper would just trade a green for a
      # crash on the first api-only PR.
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: barkpark_cloud_test
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      MIX_ENV: test
      DATABASE_URL: ecto://postgres:postgres@localhost:5432/barkpark_cloud_test
    strategy:
      matrix:
        # The same tuple as `compile`/`test`, so the deps cache key below is the
        # one those jobs already populated rather than a second cold cache.
        otp: ["27.0"]
        elixir: ["1.18.1"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            cloud/deps
            cloud/_build
          key: cloud-test-${{ runner.os }}-otp${{ matrix.otp }}-${{ hashFiles('cloud/mix.lock') }}
      - name: Fetch deps
        run: mix deps.get
      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors
      - name: Create the test database
        run: mix ecto.create
      - name: Migrate
        run: mix ecto.migrate
      # ONE FILE, NAMED ONCE. `scripts/cloud-path-escape-check.sh
      # --census-source` prints this same path — it is where the tier reads its
      # roots — and the path-escape harness asserts the two agree, so this job
      # can never end up dispatching on one census's corpus while running
      # another's file.
      - name: Reader-corpus census
        run: mix test test/barkpark_cloud/reader_less_instrument_census_test.exs

  cloud-gate:
    # ── THE AGGREGATOR — the one name that should carry branch protection ──
    #
    # Deliberate shape, every part of it load-bearing, and ported verbatim from
    # elixir.yml's `elixir-gate` because the hazards are identical:
    #
    #   * NO `strategy.matrix`. The published check-run name is then exactly the
    #     `name:` string below. `compile` and `test` ARE matrixed, so their
    #     published names either gain the matrix tuple (`… (27.0, 1.18.1)`) or,
    #     if they never STARTED, publish the literal uninterpolated
    #     `${{ matrix.x }}` — both unusable as a required context (D20). That is
    #     why this is a NEW job and never a rename of a leaf. This name is a
    #     constant.
    #
    #   * `if: always()`. Without it this job would itself be `skipped` whenever
    #     an upstream failed — publishing a PASSING required context out of a
    #     failed run.
    #
    #   * It ASSERTS on every upstream result instead of echoing them.
    #     `if: always()` buys the right to decide; it does not decide. A probe
    #     aggregator that merely printed `needs.will-fail.result` reported
    #     `success`, and a PR merged through it (honest-gates D19).
    #
    #   * EVERY job in this workflow is in `needs`. No job here carries
    #     `continue-on-error` (re-verified at wave 9), so none of them can
    #     launder a failure into `needs.<job>.result == success`. If one ever
    #     gains it, it must come OUT of this needs set in the same commit.
    #
    # Allow-set, exhaustively: `success` always; `skipped` ONLY when the
    # dispatcher output that gated that job was literally 'false'. Everything
    # else — `failure`, `cancelled`, an unrecognised value, an empty string —
    # is a FAILURE, including a failure of the dispatcher itself.
    name: Cloud gate
    if: always()
    needs: [changes, compile, test, census, path-escape]
    runs-on: ubuntu-latest
    steps:
      - name: Decide (fail-closed over every upstream result)
        env:
          R_CHANGES: ${{ needs.changes.result }}
          R_COMPILE: ${{ needs.compile.result }}
          R_TEST: ${{ needs.test.result }}
          R_CENSUS: ${{ needs.census.result }}
          R_ESCAPE: ${{ needs.path-escape.result }}
          O_CLOUD: ${{ needs.changes.outputs.cloud }}
          O_CENSUS: ${{ needs.changes.outputs.census }}
        run: |
          set -euo pipefail

          echo "dispatcher outputs: cloud='${O_CLOUD}' census='${O_CENSUS}'"
          echo

          bad=0

          # ── D770/D771 — `bad` SAYS THAT something is wrong, never WHICH ───
          # Measured by executing this very step body with one upstream =
          # failure: the step LOG names the offending job one line above, but
          # the `::error::` — the ONLY line the check-run API carries, and so
          # the only line a human at the merge button or the merge queue ever
          # reads — named NOTHING. `bad` is a bit; this is the set behind it.
          # It is appended at EVERY `bad=1` site, so it can never disagree with
          # the verdict: a job reaches this list through the same line that
          # reds the gate. DERIVED from `${job}` — never a hardcoded name, and
          # never a re-print of the step log.
          # Comma-joined, not space-joined: job names contain spaces
          # ("changes (dispatcher)", "path-escape ratchet"), so a space-joined
          # list cannot be read back as a set.
          reds=""

          # ── D377 tally: did anything SUBSTANTIVE actually run? ────────────
          # `bad` answers "is anything wrong"; it cannot answer "was anything
          # tested", and until wave 33 nothing did. These two answer it.
          # Only PATH-GATED jobs count: the dispatcher and the ratchet carry the
          # gate value NEVER and run on every head, so they are present in a
          # "nothing ran" run exactly as in a full one and can distinguish
          # nothing.
          dispatched=0
          not_dispatched=""

          # decide <job-name> <result> <gate-value>
          #   gate-value is the dispatcher output that gated the job, or the
          #   literal string NEVER for jobs that must always run. A skip is
          #   accepted only against a gate-value of exactly 'false'.
          decide() {
            local job="$1" result="$2" gate="$3"
            case "$result" in
              success)
                echo "  ok      ${job}: success"
                ;;
              skipped)
                if [ "$gate" = "false" ]; then
                  echo "  ok      ${job}: skipped — dispatcher said this path set was not touched (gate='false')"
                else
                  echo "  FAIL    ${job}: skipped, but its gate is '${gate}', not 'false'."
                  echo "          A skip here does NOT mean 'not needed'. It means the job never ran —"
                  echo "          most often because an upstream FAILED. Refusing to green a required"
                  echo "          context on it."
                  bad=1
                  reds="${reds:+${reds}, }${job}"
                fi
                ;;
              failure | cancelled)
                echo "  FAIL    ${job}: ${result}"
                bad=1
                reds="${reds:+${reds}, }${job}"
                ;;
              '')
                echo "  FAIL    ${job}: EMPTY result — this job is not in the aggregator's needs set,"
                echo "          or the run object is malformed. Cannot tell, therefore red."
                bad=1
                reds="${reds:+${reds}, }${job}"
                ;;
              *)
                echo "  FAIL    ${job}: unrecognised result '${result}'. Cannot tell, therefore red."
                bad=1
                reds="${reds:+${reds}, }${job}"
                ;;
            esac
            # Tally, for the D377 notice at the bottom of this step. NEVER-gated
            # jobs are excluded on purpose (see the declaration above).
            if [ "$gate" != "NEVER" ]; then
              case "$result" in
                success) dispatched=$((dispatched + 1)) ;;
                skipped) not_dispatched="${not_dispatched} ${job}" ;;
              esac
            fi
          }

          # The dispatcher itself may never skip: without it there are no gate
          # values, so nothing downstream can be judged.
          # ── the census job's gate is DERIVED, because it is a CONJUNCTION ──
          # `decide` accepts a skip only against the literal string 'false', and
          # the census job carries two conditions, not one. It legitimately does
          # not run in TWO different worlds and they must both resolve to
          # 'false' here, or the allow-set would red an honest skip:
          #   * the diff touched no tree the reader census walks (census=false);
          #   * the CLOUD set selected, so the `test` job above already ran that
          #     file inside `mix test` (cloud=true) — a skip here means covered,
          #     not unmeasured.
          # Anything else — an empty or garbage dispatcher output — falls
          # through UNCHANGED and is therefore not 'false', so a skip against it
          # reds exactly as it does for compile/test. Never a default of
          # 'false': that is the one value that licenses a silent skip.
          case "${O_CENSUS}:${O_CLOUD}" in
            false:*)    census_gate=false ;;
            true:true)  census_gate=false ;;
            true:false) census_gate=true ;;
            *)          census_gate="${O_CENSUS}" ;;
          esac
          echo "census job gate (derived from census='${O_CENSUS}' cloud='${O_CLOUD}'): ${census_gate}"
          echo

          decide "changes (dispatcher)"    "${R_CHANGES}" "NEVER"
          decide "path-escape ratchet"     "${R_ESCAPE}"  "NEVER"
          decide "compile"                 "${R_COMPILE}" "${O_CLOUD}"
          decide "test"                    "${R_TEST}"    "${O_CLOUD}"
          decide "census (reader corpus)"  "${R_CENSUS}"  "${census_gate}"

          echo
          if [ "$bad" -ne 0 ]; then
            echo "::error::Cloud gate: at least one upstream job is not in the allow-set (see above). This is the required context; it is RED on purpose. NOT IN THE ALLOW-SET: ${reds}"
            exit 1
          fi

          # ── D377/D378 — SAY IT WHERE A PERSON AND AN API CAN READ IT ──────
          # Measured on api-only PR #9529 (head 48d960092): this context read
          # `Cloud gate | success | ann=0 | summary=null` with BOTH substantive
          # jobs skipped — byte-identical to a run where `mix test` passed.
          # $GITHUB_STEP_SUMMARY does not reach the check-run API (0 of 32
          # check-runs returned a non-null summary), and renaming this frozen
          # required context would deadlock main; a bare ::notice:: does reach
          # it (probe/elixir-gate-annotation, run 31055317124).
          # ONE notice, never one per job — GitHub caps annotations at 10 per
          # level per step and truncates the rest silently.
          if [ "$dispatched" -eq 0 ]; then
            echo "::notice title=Cloud gate: green — nothing ran::NOTHING CLOUD RAN on this head.%0ACloud gate is green because this diff touched none of its declared path sets, NOT because anything was tested.%0ANot dispatched:${not_dispatched}%0AGreen here means NOT APPLICABLE to this diff. Read it as 'no Cloud job executed', never as 'the Cloud suite passed'."
          fi
          echo "Cloud gate: every upstream job either succeeded or was legitimately not dispatched."

  report-main-failure:
    # ── THE RED THAT REACHES A HUMAN ─────────────────────────────────────────
    #
    # Same defect, same fix, same reasoning as console-harness.yml's job of this
    # name: a post-merge red X on `main` is only visible to whoever thinks to
    # open the Actions tab, so main-push gate failures have been concluding into
    # the void — nine measured `Console gate` reds in the sampled window against
    # exactly TWO "CI failure" issues in the repository's entire history. This
    # job is the record for the Cloud control plane's half of that net.
    #
    #   * `needs: [cloud-gate]` — it reports the AGGREGATOR'S verdict, the name
    #     branch protection actually reads, never a single leaf.
    #
    #   * `failure()` is true only for a real FAILURE and is FALSE for
    #     `cancelled`. Deliberate: a cancelled main-push run (queue-depth-1
    #     displacement — charter D115's CADENCE class) ran zero substantive jobs
    #     and has nothing to report. Filing for those is the noise that trains
    #     people to ignore the real ones.
    #
    #   * `github.ref == 'refs/heads/main'` — a failing PR already has a human
    #     attached. Only main's post-merge red is ownerless.
    #
    #   * `permissions:` is JOB-LEVEL and must stay that way. The repository's
    #     `default_workflow_permissions` is "read", so the issue POST 403s
    #     without `issues: write` — but a WORKFLOW-level block would silently
    #     re-scope every other job's token in this file. The grant lives on the
    #     one job that needs it.
    #
    # scripts/file-ci-failure-issue.sh exits 1 when the alert was NOT delivered,
    # so this job cannot warn-and-pass. Its red never touches `Cloud gate`, which
    # has already published its verdict by the time this runs.
    name: Report main-push failure to a human
    needs: [cloud-gate]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # the ONLY reason this job carries a permissions block
    steps:
      - uses: actions/checkout@v4

      - name: File (or update) the CI failure issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_FAILURE_KEY: cloud-main
          CI_FAILURE_DETAIL: |
            The `Cloud gate` required context is RED on a push to `main`.
            This is POST-MERGE: the breakage is already on the default branch,
            and every PR branched from this tip inherits it.

            Read the aggregator's "Decide (fail-closed over every upstream
            result)" step first — it names which upstream job is outside the
            allow-set (`changes` dispatcher, `path-escape` ratchet, `compile`,
            `test`, `census`) and on which OTP/Elixir matrix leg.

            This issue is idempotent per key: an ongoing failure appends a
            comment rather than opening a new issue. CLOSE IT once main is green
            again — the next main-push failure opens a fresh one.
        run: bash scripts/file-ci-failure-issue.sh
