name: zz-alert-proof
# TEMPORARY. Proves the alerting step fires on red and stays silent on green
# with the real GITHUB_TOKEN. Deleted before this PR merges.
on:
  push:
    branches: [pt-w1-scheduled-gate-alerting]

permissions:
  contents: read
  issues: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The gate
        run: |
          echo "PROOF_SHOULD_FAIL=yes"
          exit 1
      - name: Report failure to a human
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_FAILURE_KEY: zz-alert-proof
          CI_FAILURE_DETAIL: |
            Temporary live proof for pt-w1-scheduled-gate-alerting. Safe to close.
        run: bash scripts/file-ci-failure-issue.sh
