name: Research-coverage suite

# tooling/research-coverage/ holds the ledger the research corpus is built on,
# and its write path had two data-loss defects that a successful command
# reported as success: entries were rebuilt from a fixed seven-key literal (so
# any field a newer writer added was silently dropped), and saveLedger was a
# bare writeFileSync (so two concurrent writers deterministically destroyed one
# whole contribution, both exiting 0). Both were proven by mutation before being
# fixed; the suite this workflow runs is the regression cover for both, and it
# is itself mutation-proven — removing the lock, the CAS, or the entry-merge
# each turns a named test red (see the PR body for the three red/green pairs).
#
# WIRED PR AND PUSH ALIKE, PATH-FILTERED. A PR-only filter would let a direct
# push to main go unre-checked forever; a push-only filter would red after the
# merge, on protected main, which is the shape nobody can land a fix through.
# The two `paths:` lists below are hand-maintained twins and must stay
# set-equal — the same discipline shell-harnesses.yml and doc-gates.yml follow.
#
# WHY A FILE FLOOR AND NOT A TEST TOTAL. `node --test <glob>` exits 0 with
# `# fail 0` when the glob expands to nothing, so a silently-shrunk glob is a
# green that ran zero tests. A LOWER BOUND on the file count closes that without
# turning the gate into a maintenance chore every time a test is added. The
# TOTAL is deliberately not pinned: it moves with every new case.
#
# `# skipped 0` is asserted, not incidental — this suite has no opt-in probes,
# and a skip appearing here would mean a test quietly stopped running.
#
# ADVISORY, NOT REQUIRED. This check's name is not in main's required-contexts
# set, so a red here does not block a merge on its own. The step summary
# re-derives that live on every run rather than trusting this comment to stay
# true.
#
# SECOND JOB: tooling/{aesthetics,ergonomics,risk} node --test suite. Five
# tooling regression suites were wired into zero CI workflow; this job wires
# the four that are GREEN (compare.test.mjs, spotlight-clutter.test.mjs,
# safety-classifier.test.mjs, fn-coverage.test.mjs) following this file's own
# floor+log-parse precedent below. tooling/pds/rerun-adjudicate.test.mjs is
# NOW WIRED TOO (2026-09-12, wbt-pds-grip-polarity-drift-2026-08-31), as its
# OWN step rather than a fifth entry in the glob: it is a script that counts its
# own checks, and `node --test` collapses it to one passing test that hides all
# 276 of them. The drift it was red on is triaged and fixed with ZERO weakened
# expectations — grip's screen briefly mis-read `git grep -c`'s sub-verb `-c` as
# a `git -c key=value` global (#13481) and grip itself fixed that (#17227); what
# stayed red afterwards was a PDS-side recipe still spelling an ABSENCE read
# with a `-c` whose printed count was never part of its claim, which pds's own
# UNCOMPARED-COUNT screen (#17224) correctly refuses. The recipe now uses the
# substitute that screen's own refusal text names.
#
# BOTH `paths:` TWINS CARRY tooling/pds/** AND tooling/grip/**. The pds gate
# imports grip's shipped screen READ-ONLY, and section 10 of the suite re-runs
# its probes through the LIVE screen — so a grip-side change can red this gate
# without touching a single pds byte. That is precisely the drift above, and a
# filter that did not watch grip would have let it land unseen a second time.
#
# The ergonomics safety-classifier suite imports ergonomics.mjs, which reads
# tooling/file-importance/file-signals.json (gitignored, generated) at module
# load — so the job runs the generator as a setup step before the suite.

on:
  pull_request:
    paths:
      - "tooling/research-coverage/**"
      - "tooling/aesthetics/compare.mjs"
      - "tooling/aesthetics/compare.test.mjs"
      - "tooling/aesthetics/aesthetics.mjs"
      - "tooling/aesthetics/spotlight-clutter.test.mjs"
      - "tooling/ergonomics/ergonomics.mjs"
      - "tooling/ergonomics/safety-classifier.test.mjs"
      - "tooling/risk/fn-coverage.mjs"
      - "tooling/risk/fn-coverage.test.mjs"
      - "tooling/file-importance/build-signals.mjs"
      - "tooling/pds/**"
      - "tooling/grip/**"
      - ".github/workflows/research-coverage-suite.yml"
  push:
    branches: [main]
    paths:
      - "tooling/research-coverage/**"
      - "tooling/aesthetics/compare.mjs"
      - "tooling/aesthetics/compare.test.mjs"
      - "tooling/aesthetics/aesthetics.mjs"
      - "tooling/aesthetics/spotlight-clutter.test.mjs"
      - "tooling/ergonomics/ergonomics.mjs"
      - "tooling/ergonomics/safety-classifier.test.mjs"
      - "tooling/risk/fn-coverage.mjs"
      - "tooling/risk/fn-coverage.test.mjs"
      - "tooling/file-importance/build-signals.mjs"
      - "tooling/pds/**"
      - "tooling/grip/**"
      - ".github/workflows/research-coverage-suite.yml"

permissions:
  contents: read
  issues: write # so a failed run on main can surface itself to a human

concurrency:
  group: research-coverage-suite-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # NEVER a literal `true`: on push-to-main that self-cancels the suite dark.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  research-coverage-suite:
    name: tooling/research-coverage node --test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: what this run does NOT certify (advisory status, re-derived live)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo "### Research-coverage suite — advisory, and what a green does not certify"
            echo
            prot_code=$(gh api -i repos/${{ github.repository }}/branches/main/protection 2>/dev/null | head -1 | awk '{print $2}')
            if [ "$prot_code" = "200" ]; then
              contexts=$(gh api repos/${{ github.repository }}/branches/main/protection --jq '.required_status_checks.contexts | join(", ")' 2>/dev/null)
              echo "- \`branches/main/protection\`: 200 — required contexts: ${contexts:-<unreadable>}"
              echo "  (this workflow's check is not among them — advisory only)"
            else
              echo "- \`branches/main/protection\`: ${prot_code:-<unreachable>} (no classic protection object)"
            fi
            echo
            echo "A green here means the checked-out source passed \`node --test\` on THIS"
            echo "runner. It says nothing about the ledger's CONTENT: research-ledger.json"
            echo "is gitignored and absent from every clone, so no coverage percentage is"
            echo "re-derivable here and none is asserted (see the open row"
            echo "tgw-bl-coverage-ledger-unreproducible)."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: test-file floor (a glob that expands to nothing exits 0)
        run: |
          set +e
          shopt -s nullglob
          files=(tooling/research-coverage/test/*.test.mjs)
          count=${#files[@]}
          printf '%s\n' "${files[@]}"
          echo "found $count tooling/research-coverage/test/*.test.mjs files"
          floor=2
          if [ "$count" -lt "$floor" ]; then
            echo "::error::expected at least $floor tooling/research-coverage/test/*.test.mjs files, found $count: ${files[*]}"
            exit 1
          fi

      - name: suite — exit 0 AND '# fail 0' AND '# skipped 0'
        run: |
          set +e
          set -o pipefail
          node --test tooling/research-coverage/test/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/rc-suite.log"
          run_rc=${PIPESTATUS[0]}

          fail=$(awk -F'# fail ' '/^# fail /{print $2}' "$RUNNER_TEMP/rc-suite.log")
          skipped=$(awk -F'# skipped ' '/^# skipped /{print $2}' "$RUNNER_TEMP/rc-suite.log")
          echo "parsed clauses: run_rc=$run_rc fail=$fail skipped=$skipped"

          status=0
          if [ "$run_rc" != "0" ]; then
            echo "::error::node --test exited $run_rc"
            status=1
          fi
          if [ "$fail" != "0" ]; then
            echo "::error::expected '# fail 0', got '# fail ${fail:-<none>}'"
            status=1
          fi
          if [ "$skipped" != "0" ]; then
            echo "::error::expected '# skipped 0' — this suite has no opt-in probes, so a skip means a test quietly stopped running; got '# skipped ${skipped:-<none>}'"
            status=1
          fi
          exit $status

      - name: report failure to a human
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_FAILURE_KEY: research-coverage-suite
          CI_FAILURE_DETAIL: |
            The tooling/research-coverage node --test suite failed (or its
            file-count floor tripped) on ${{ github.ref }} at ${{ github.sha }}.
            That suite guards the research-ledger write path against the two
            data-loss defects recorded in tooling/research-coverage/ledger-io.mjs
            (silent field strip, and a lost update between concurrent writers).
            This check is advisory, so a red run does not block anything on its
            own. Open the run's log for the failing test names.
        run: bash scripts/file-ci-failure-issue.sh

  tooling-regression-suite:
    name: "tooling/{aesthetics,ergonomics,risk} node --test suite + tooling/pds gate"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: generate file-importance signals (safety-classifier.test.mjs needs file-signals.json)
        run: node tooling/file-importance/build-signals.mjs

      - name: test-file floor (a glob that expands to nothing exits 0)
        run: |
          set +e
          shopt -s nullglob
          files=(tooling/aesthetics/*.test.mjs tooling/ergonomics/*.test.mjs tooling/risk/*.test.mjs)
          count=${#files[@]}
          printf '%s\n' "${files[@]}"
          echo "found $count tooling/{aesthetics,ergonomics,risk}/*.test.mjs files"
          floor=4
          if [ "$count" -lt "$floor" ]; then
            echo "::error::expected at least $floor tooling/{aesthetics,ergonomics,risk}/*.test.mjs files, found $count: ${files[*]}"
            exit 1
          fi

      - name: suite — exit 0 AND '# fail 0' AND '# skipped 0'
        run: |
          set +e
          set -o pipefail
          node --test --test-reporter=tap --test-reporter-destination=stdout tooling/aesthetics/*.test.mjs tooling/ergonomics/*.test.mjs tooling/risk/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/tooling-suite.log"
          run_rc=${PIPESTATUS[0]}

          fail=$(awk -F'# fail ' '/^# fail /{print $2}' "$RUNNER_TEMP/tooling-suite.log")
          skipped=$(awk -F'# skipped ' '/^# skipped /{print $2}' "$RUNNER_TEMP/tooling-suite.log")
          echo "parsed clauses: run_rc=$run_rc fail=$fail skipped=$skipped"

          status=0
          if [ "$run_rc" != "0" ]; then
            echo "::error::node --test exited $run_rc"
            status=1
          fi
          if [ "$fail" != "0" ]; then
            echo "::error::expected '# fail 0', got '# fail ${fail:-<none>}'"
            status=1
          fi
          if [ "$skipped" != "0" ]; then
            echo "::error::expected '# skipped 0' — a skip here means a test quietly stopped running; got '# skipped ${skipped:-<none>}'"
            status=1
          fi
          exit $status

      # ── tooling/pds/rerun-adjudicate.test.mjs — ITS OWN STEP, ON PURPOSE ────
      #
      # IT IS NOT A `node --test` FILE AND MUST NEVER BE RUN AS ONE. It is a
      # SCRIPT that counts its own checks and sets process.exitCode; its own
      # header says so, citing grip README:193. Handed to `node --test` it
      # collapses to ONE passing test — MEASURED 2026-09-12: `# tests 1`,
      # `# pass 1`, `# fail 0`, with all 276 of its checks invisible to the
      # clause-parser on the step above. Folding it into that glob would
      # therefore have wired A GREEN THAT PROVES NOTHING — the exact trap this
      # suite exists to refuse.
      #
      # So the run is direct, and three clauses must hold: the rc, the
      # "0 failed" its own summary line prints, and a CHECK-COUNT FLOOR. The
      # floor is the anti-vacuity half — an rc of 0 over a suite that silently
      # stopped building its board is the failure a pass/fail clause cannot see.
      - name: tooling/pds gate — rc 0 AND '0 failed' AND the check count is above its floor
        run: |
          set +e
          set -o pipefail
          node tooling/pds/rerun-adjudicate.test.mjs 2>&1 | tee "$RUNNER_TEMP/pds-suite.log"
          run_rc=${PIPESTATUS[0]}

          summary=$(grep -E '^pds/rerun-adjudicate: [0-9]+ checks, [0-9]+ failed$' "$RUNNER_TEMP/pds-suite.log" | tail -1)
          checks=$(printf '%s' "$summary" | sed -nE 's|^pds/rerun-adjudicate: ([0-9]+) checks, ([0-9]+) failed$|\1|p')
          failed=$(printf '%s' "$summary" | sed -nE 's|^pds/rerun-adjudicate: ([0-9]+) checks, ([0-9]+) failed$|\2|p')
          echo "parsed clauses: run_rc=$run_rc checks=${checks:-<none>} failed=${failed:-<none>}"

          floor=270
          status=0
          if [ "$run_rc" != "0" ]; then
            echo "::error::node tooling/pds/rerun-adjudicate.test.mjs exited $run_rc"
            status=1
          fi
          if [ -z "$summary" ]; then
            echo "::error::the suite printed no 'pds/rerun-adjudicate: N checks, M failed' summary line — it never finished, and an rc alone cannot tell that from a pass"
            status=1
          fi
          if [ -n "$failed" ] && [ "$failed" != "0" ]; then
            echo "::error::expected '0 failed', got '$failed failed'"
            status=1
          fi
          if [ -n "$checks" ] && [ "$checks" -lt "$floor" ]; then
            echo "::error::CHECK-COUNT FLOOR: expected at least $floor checks, the suite ran only $checks — a green over a shrunken board proves less than it claims"
            status=1
          fi
          exit $status

      - name: report failure to a human
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_FAILURE_KEY: tooling-regression-suite
          CI_FAILURE_DETAIL: |
            One of the tooling/{aesthetics,ergonomics,risk} node --test suites
            failed (or its file-count floor tripped) on ${{ github.ref }} at
            ${{ github.sha }}. These suites guard the aesthetics diff-summary
            (compare.mjs), the spotlight-clutter detector, the ergonomics
            safety classifier, and the per-function coverage parser (risk).
            tooling/pds/rerun-adjudicate.test.mjs IS now wired into this job
            (2026-09-12) and runs as its OWN DIRECT STEP — never under
            `node --test`, which collapses it to one passing test and hides
            every one of its checks. Its gate is three clauses: the rc, the
            "0 failed" in its own summary line, and a check-count floor.
            This check is advisory, so a red run does not block anything on
            its own. Open the run's log for the failing test names.
        run: bash scripts/file-ci-failure-issue.sh
