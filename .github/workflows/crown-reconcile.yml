# crown-reconcile — the crown stops self-certifying.
#
# WHAT IS ACTUALLY BROKEN
#
# `platform_deliveries` is the platform's own record of what was deployed, and
# every verdict about it is produced INSIDE the delivering run. `record-delivery`
# sets `delivered=true` from the rc of its OWN POST; `report-recorder-failure`
# fires only when THAT run's POST failed. Neither can see a run whose `if:` gated
# the recorder off, and neither can see a run that never reached the job. Both
# leave a delivered sha with no row and no signal anywhere.
#
# Measured 2026-08-09: barkpark.cloud reported it was SERVING
# a95bc7ca9747cb3d90a361c4d54eb2c068a24e32 while `GET /v1/deliveries?sha=a95bc…`
# answered `count: 0`. Production was running a commit the platform's own record
# had never heard of, and nothing in this repository said so.
#
# WHY THIS IS NOT A REQUIRED CONTEXT, AND MUST NEVER BECOME ONE
#
# main's required set is exactly ["Elixir gate", "PR references an active task",
# "Cloud gate", "Console gate"], and all four are PR-head gates over an ephemeral
# CI database. None of them can see a production row or a production Actions
# history, so this verdict is not expressible as a required context — it reds
# its own check-run and cannot stop a merge, because it is a LEVEL check over
# the live population rather than a verdict about one PR head. The product job
# is fenced with
# `if: github.event_name != 'pull_request'` so its name never renders on a PR
# head and can never be sampled into the required-check spec, and the
# `pull_request` trigger is paths-filtered to this slice's own three files so the
# harness below is not orphaned.
#
# WHY rc=2 NO LONGER EXITS 0 (charter D532)
#
# The rc=2 arm below used to print "That is a SILENCE, not a green" and then
# `exit 0` — a step whose own text says it is not a green, exiting green. Run
# 31321844876 (2026-08-09T15:42Z) granted a SERVING GRACE to
# 1d57725553b39db5feb38bf7d2517f429db1879b, exited rc=2, and published a run
# conclusion of SUCCESS. HONEST LIMIT, stated rather than overclaimed: that sha
# DID get its cp row 65 seconds later (platform_deliveries, 2026-08-09
# 15:44:03), so that particular discard cost nothing. The MECHANISM was broken;
# that instance was benign. It now exits 1, mirroring the shape #11319 landed at
# stale-verdict-watch.yml:136-137, where rc=6 UNREACHABLE and rc=7 DISTANCE
# UNREADABLE both exit 1 rather than being folded into a success.
#
# WHY THERE IS NO continue-on-error ANYWHERE IN THIS FILE
#
# Job-level `continue-on-error: true` still renders a RED check run but launders
# the WORKFLOW RUN to success — and the run conclusion is what notifications,
# `gh run list` and the rollup read. A scream nobody is paged for is not a
# scream. This run fails, and it files an issue.
#
# WHY A SCHEDULE
#
# A missing row is not an event. Nothing fires a webhook when a recorder is gated
# off; the row simply never appears. Only a level trigger can see that, so this
# asks every six hours and keeps asking.
#
# CREDENTIALS: NONE ARE ADDED. `DEPLOY_SSH_KEY` + `CP_HOST` are the repository
# secrets deploy.yml's own recorder already uses to reach the control plane, and
# the bearer is read on the box out of the running container. `gh secret list` is
# unchanged by this workflow.
#
# THE RESIDUALS, IN NUMBERS
#
#   * a ~6-hour observation window (GitHub queues cron under load, so read this
#     as "within ~6-7 hours", never "on the hour")
#   * silence during an Actions outage, and GitHub's 60-day auto-disable of
#     scheduled workflows in an inactive repo
#   * the run population is ONE page of 100 successful runs; when that page
#     fills, the population prints as `N+` rather than being rounded down — and
#     the run now SAYS the other half of that residual out loud: a delivering
#     run that fell off the page cannot be counted BEHIND at all, so a truncated
#     run's silence on those runs is a blind spot, not a clean reading. A ROW
#     naming a run below the page minimum is no longer accused on a truncated
#     page (it would be a ghost the truncation manufactured); it is an
#     UNREADABLE condition by name and lands in rc 2
#   * the reverse direction reads one bounded page of the newest rows, so a
#     ghost row older than that page is not seen this run

# THE TWO SIDES ARE SAMPLED APART IN TIME (task-7a85d1b5f471af8f)
#
# This job freezes the deploy.yml run list first, then asks the jobs API once
# per examined run (65 runs on a live window — minutes, not seconds), and only
# then reads the crown. A row written inside that gap names a run that was NOT
# TERMINAL when the run list was taken, so `.conclusion == "success"` could not
# have matched it, and the verdict accused a correct row. Run 32726853411
# printed `behind=0/65` — nothing was lost — beside `wrong=2/100`, both rows the
# same sha, written by runs 32726835915 and 32726853417, which started 13s
# before and in the SAME SECOND as this reconciler.
#
# The fix is a WATERMARK, not a tolerance: the run list's state at the instant
# it was sampled — which runs were non-terminal, and the highest run id that
# existed — decides whether a row's writer could have been judged at all. Such a
# row is printed as WRITTEN-IN-FLIGHT with its own count, excluded from BOTH
# sides, and judged NORMALLY by the next run, where a run that never delivered
# is WRONG. No accusation is forgiven; one run of latency is spent.

name: crown-reconcile

on:
  schedule:
    # Every six hours. GitHub queues cron under load — read this as "within
    # ~6-7 hours", never "at :05".
    - cron: "5 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    # Deliberately narrow: this trigger exists ONLY so the harness below is not
    # orphaned. Being paths-filtered also keeps every name in this file out of
    # the required set, belt and braces with the reconcile job's `if:`.
    paths:
      - "scripts/crown-reconcile.sh"
      - "scripts/crown-reconcile.test.sh"
      - "scripts/crown-waiver.test.sh"
      - ".github/workflows/crown-reconcile.yml"
      # An INPUT to the harness. crown-reconcile.test.sh reads this file and
      # fails if `crown-reconcile` ever appears in it — so an edit to the
      # required-check spec can break the harness while triggering nothing.
      # A file the harness reads has to be a file that fires it.
      - ".github/required-checks.json"
      # Also an INPUT. crown-reconcile.test.sh reads shell-harnesses.yml and
      # fails if this harness is WIRED there as well as here — so an edit to
      # shell-harnesses.yml can break the harness while triggering nothing.
      # #11703 was a shell-harnesses-only edit: it never fired this harness on
      # its own PR, landed green, and surfaced 6h later as a dark reconciler.
      # A file the harness reads has to be a file that fires it.
      - ".github/workflows/shell-harnesses.yml"

permissions:
  contents: read
  # The verdict lists deploy.yml runs and their jobs; GITHUB_TOKEN carries both
  # with `actions: read`. `issues: write` is what the scream needs to file.
  actions: read
  issues: write

concurrency:
  group: crown-reconcile-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # NEVER a literal `true`: on push-to-main that self-cancels the reconciler dark.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  crown-reconcile:
    name: Crown reconcile
    # Never on pull_request: a name that never renders on a PR head can never be
    # sampled into the required-check spec.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The scream's own tripwire. If the comparison stops being able to fail,
      # the verdict below is decoration — and this run says so first.
      - name: Prove the verdict can lose (crown-reconcile.test.sh)
        run: bash scripts/crown-reconcile.test.sh

      # The DATED WAIVER's own two-direction proof: before its expiry the one
      # named sha is not a red and says so out loud; after it, the accusation
      # returns with no code change; and a second unrecorded sha is never
      # covered. It also runs the whole thing under a GNU-shaped and a
      # BSD-shaped date(1), because a time-gated waiver parsed without a shape
      # check is inert on one platform and live on the other.
      - name: Prove the dated waiver expires (crown-waiver.test.sh)
        run: bash scripts/crown-waiver.test.sh

      # ── THE RE-ASK LIST HAS TO OUTLIVE THIS VM ────────────────────────────
      #
      # crown-reconcile.sh writes every granted serving grace to a re-ask list
      # so the NEXT run collects the deferred accusation. Nothing set
      # CROWN_STATE_FILE, so it defaulted under $TMPDIR on a fresh
      # ubuntu-latest VM that is destroyed at the end of the job:
      # GRACED-UNRECORDED was STRUCTURALLY UNABLE TO FIRE in production.
      #
      # WHY NOT actions/cache: its eviction (7 days idle, or the 10GB repo cap)
      # is SILENT, and a cache miss is indistinguishable from an empty list —
      # which is the exact defect being cured. The list instead lives on the
      # control plane, at /var/lib/crown-reconcile/, reached over the SSH key
      # this job ALREADY holds for the read. No new secret, no new dependency.
      #
      # A fetch that FAILS deliberately leaves no local file: the script then
      # says ABSENT and exits 2, which after the fix is a non-zero silence. A
      # failed fetch must never look like "the first run ever".
      #
      # AND THE FIRST RUN EVER IS A REAL, DIFFERENT WORLD (charter D545).
      # /var/lib/crown-reconcile/graced.txt has never been written on CP_HOST,
      # so "the file is not there" is the state this workflow is actually IN —
      # and the reconciler, which sees only a local absence, cannot tell it from
      # a memory that was destroyed. This step CAN: it is the thing holding the
      # store. So the remote command STATES which world it found, on its first
      # line, and only a remote command that SUCCEEDED may say `FIRST-RUN`. A
      # transport that fails says nothing, leaves no file, and still pages.
      - id: reask
        name: Re-ask list — fetch from the control plane
        env:
          CP_HOST: ${{ secrets.CP_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/crown"
          install -m 600 /dev/null "$RUNNER_TEMP/crown/key"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/crown/key"
          SSH="ssh -i $RUNNER_TEMP/crown/key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$RUNNER_TEMP/crown/known -o ConnectTimeout=20"
          echo "first_run=" >> "$GITHUB_OUTPUT"
          if $SSH "root@${CP_HOST}" 'mkdir -p /var/lib/crown-reconcile && if [ -e /var/lib/crown-reconcile/graced.txt ]; then echo CR_LIST=PRESENT; cat /var/lib/crown-reconcile/graced.txt; else echo CR_LIST=FIRST-RUN; fi' \
              > "$RUNNER_TEMP/crown/fetched.txt"; then
            marker="$(head -1 "$RUNNER_TEMP/crown/fetched.txt")"
            tail -n +2 "$RUNNER_TEMP/crown/fetched.txt" > "$RUNNER_TEMP/crown/graced.txt"
            if [ "$marker" = "CR_LIST=FIRST-RUN" ]; then
              rm -f "$RUNNER_TEMP/crown/graced.txt"
              echo "first_run=1" >> "$GITHUB_OUTPUT"
              echo "::notice::the control plane answered, and ${CP_HOST}:/var/lib/crown-reconcile/graced.txt does not exist yet — this is the FIRST RUN, not a destroyed memory. The reconciler is told so explicitly (CROWN_STATE_FIRST_RUN=1) and will not page over a list that has never been written."
            else
              echo "::notice::re-ask list fetched from ${CP_HOST}:/var/lib/crown-reconcile/graced.txt ($(wc -l < "$RUNNER_TEMP/crown/graced.txt" | tr -d ' ') line(s))"
            fi
          else
            rm -f "$RUNNER_TEMP/crown/graced.txt" "$RUNNER_TEMP/crown/fetched.txt"
            echo "::warning::the re-ask list could NOT be fetched from the control plane. No local file is left behind and no first-run claim is made on purpose — the reconciler will report the list as ABSENT rather than mistake a failed fetch for an empty memory OR for a first run."
          fi

      - id: reconcile
        name: Does the crown match what was actually deployed?
        env:
          GH_TOKEN: ${{ github.token }}
          CP_HOST: ${{ secrets.CP_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # INERT UNTIL A HUMAN MINTS IT, AND NEVER INERT-AND-SILENT.
          # `gh secret list` does not carry CROWN_API_TOKEN today, and a secret
          # that does not exist renders as the EMPTY STRING — indistinguishable
          # from one minted empty. crown-reconcile.sh treats a SET-BUT-EMPTY
          # token as a configuration fault (rc 3) precisely so an operator is
          # never silently downgraded, so this step must UNSET it rather than
          # hand the script an empty one and break the working CI reader.
          CROWN_API_TOKEN: ${{ secrets.CROWN_API_TOKEN }}
          CROWN_STATE_FILE: ${{ runner.temp }}/crown/graced.txt
          CROWN_STATE_STORAGE: "CP_HOST:/var/lib/crown-reconcile/graced.txt, fetched and written back over the deploy SSH key"
          # EMPTY unless the fetch step above REACHED the control plane and found
          # no list there. A failed fetch leaves this empty, so transport silence
          # is still ABSENT and still pages — the tolerance is for a store that
          # was read, never for one that could not be.
          CROWN_STATE_FIRST_RUN: ${{ steps.reask.outputs.first_run }}
        run: |
          set -uo pipefail
          if [ -z "${CROWN_API_TOKEN:-}" ]; then
            echo "::notice::CROWN_API_TOKEN is absent (a secret that does not exist and one minted empty are INDISTINGUISHABLE to a workflow, so both are treated as absent here). The reconciler falls through to the CP_HOST + DEPLOY_SSH_KEY reader deploy.yml already uses — this is the working path, not a fault."
            unset CROWN_API_TOKEN
          fi
          rc=0
          bash scripts/crown-reconcile.sh --repo "${{ github.repository }}" --window-hours 24 || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # The case table. A compute fault must NEVER be reported as a
          # credential fault, and a read that did not happen must never be
          # reported as a clean reconciliation.
          #
          # rc 0 carries TWO named shapes. RECONCILED is the real green. QUIET
          # WINDOW (charter D597) is a benign NAMED deferral: an EMPTY deploy
          # window on a VERIFIED crown — serving sha recorded, re-ask list
          # PRESENT-EMPTY, zero in-window rows — where the script prints its
          # own ::warning naming the class, so the deferral is SAID without
          # this table's help. Measured 2026-08-15T18:28Z..08-17: the
          # empty-population rc 2 filed on SIX consecutive scheduled runs on a
          # quiet repo (#11217 at 41 comments) — paging here is what mutes the
          # alarm for the one case that is not (the rc-4 precedent, dr-w31-s2).
          # Rows-exist-but-no-runs is NOT quiescence and STAYS rc 2: a row
          # with no run is an accusation source. STATED RESIDUAL, not code: a
          # repo quiet for 60 days trips GitHub's scheduled-workflow auto-disable,
          # and a quiescence-green run produces no failure heartbeat that would
          # notice the schedule going dark.
          case "$rc" in
            0) echo "::notice::the crown reconciles with what deploy.yml actually delivered over the last 24h — or the window was QUIET, and the script's own ::warning above named that deferral itself"; exit 0 ;;
            1) echo "::error::THE CROWN DOES NOT MATCH WHAT WAS DEPLOYED. A delivering run has no row, a row has no run, or production is serving a sha the record has never heard of — the counts and the population are in the log above. This cannot clear itself: the missing rows must be recorded, or the recorder's gate fixed."; exit 1 ;;
            2) echo "::error::SILENCE — the reconciler COULD NOT READ part of what it compares, the population was empty, or its re-ask list was ABSENT with no first-run statement (a destroyed memory, or a fetch that failed). Its own text has always said this is NOT a green, and it exited 0 until #11365. The named conditions are in the log above. A benign in-flight grace no longer lands here: that is rc 4. An empty window on a VERIFIED crown no longer lands here either: that is the rc-0 QUIET WINDOW deferral — landing here on an empty window means at least one quiescence condition failed."; exit 1 ;;
            3) echo "::error::CONFIGURATION FAULT — this run's credential cannot reach the control plane, or a flag is wrong. A reconciler that cannot read what it reconciles must not report success. This is NOT a statement about the crown's contents."; exit 1 ;;
            4) echo "::warning::NOT YET DUE — everything was read and nothing is accused, but a SERVING GRACE is open: the box is serving a sha whose recorder POST has not landed yet. The accusation is not dropped, it is DEFERRED — the sha is on the re-ask list, and the next run that still finds no row exits 1 as GRACED-UNRECORDED. Measured before this arm existed, rc=2 fired SIX times in this workflow's whole history and FIVE were exactly this benign grace, so paging here is what mutes the alarm for the one case that is not."; exit 0 ;;
            *) echo "::error::crown-reconcile.sh exited $rc, which is not a verdict it defines"; exit 1 ;;
          esac

      # ALWAYS, and especially after a RED: the run that just accused a sha is
      # exactly the run whose memory the next one needs. `if: always()` is what
      # makes the deferral survive the accusation.
      - name: Re-ask list — write back to the control plane
        if: always()
        env:
          CP_HOST: ${{ secrets.CP_HOST }}
        run: |
          set -uo pipefail
          if [ ! -f "$RUNNER_TEMP/crown/graced.txt" ] || [ ! -f "$RUNNER_TEMP/crown/key" ]; then
            echo "::warning::there is no re-ask list to write back — this run's graces (if any) are LOST, and the next run will report the list as ABSENT."
            exit 0
          fi
          SSH="ssh -i $RUNNER_TEMP/crown/key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$RUNNER_TEMP/crown/known -o ConnectTimeout=20"
          # WRITE-THEN-MOVE. `cat > graced.txt` truncates the remote file BEFORE
          # the first byte arrives, so an SSH stream that dies mid-write leaves a
          # SHORT list — and a short list is indistinguishable from one that
          # legitimately drained, which silently forgives every accusation past
          # the cut. The rename is atomic within /var/lib/crown-reconcile, so the
          # next run reads either the whole old list or the whole new one.
          if $SSH "root@${CP_HOST}" 'mkdir -p /var/lib/crown-reconcile && cat > /var/lib/crown-reconcile/graced.txt.tmp && mv -f /var/lib/crown-reconcile/graced.txt.tmp /var/lib/crown-reconcile/graced.txt' \
              < "$RUNNER_TEMP/crown/graced.txt"; then
            echo "::notice::re-ask list written back to ${CP_HOST}:/var/lib/crown-reconcile/graced.txt ($(wc -l < "$RUNNER_TEMP/crown/graced.txt" | tr -d ' ') line(s))"
          else
            echo "::error::the re-ask list could NOT be written back to the control plane. Every grace this run granted is LOST — the next run will load an empty list and cannot collect the deferred accusation."
            exit 1
          fi

      # The scream. file-ci-failure-issue.sh exits 1 when the alert was NOT
      # delivered, so a failure to page is itself a failure.
      #
      # THE VARIABLE NAME IS LOAD-BEARING. file-ci-failure-issue.sh reads
      # GITHUB_TOKEN, not GH_TOKEN. This step shipped with only GH_TOKEN set, so
      # the FIRST production run — 2026-08-09, run 31311406793 — died with
      # "GITHUB_TOKEN is empty … the failure that triggered this alert is
      # UNREPORTED". The reconciler screamed and nothing heard it. Every other
      # caller in this repository (deploy.yml ×2, paper-readers, renew-mail-cert,
      # codebase-intel) sets GITHUB_TOKEN; this one is now the same shape.
      - name: File the failure to a human
        # `failure()` is FALSE on a cancelled run, and this workflow has 13 of
        # them; without `cancelled()` a reconciler that never ran reads exactly
        # like a reconciler that reconciled.
        if: (failure() || cancelled()) && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          CI_FAILURE_KEY: crown-reconcile
          CI_FAILURE_DETAIL: |
            **The platform's delivery record does not match what was deployed.**

            `scripts/crown-reconcile.sh` compares every SUCCESSFUL, DELIVERING
            `deploy.yml` run over the last 24h against `GET /v1/deliveries?sha=`,
            in both directions, and also against the sha barkpark.cloud reports
            it is SERVING. It exited non-zero. Read the run log for the counts —
            every rate there is printed beside its population.

            Which exit code fired decides what to look at:

            - `1` — BEHIND (a run delivered a sha with no row), WRONG (a row
              names a sha no run delivered), or SERVING-UNRECORDED (production
              runs a commit the record has never heard of). The usual cause is
              deploy.yml's `record-delivery` job being gated off by its `if:`,
              or the run never reaching it. A row whose writing run was still
              IN FLIGHT when the run list was sampled is NOT this: it prints as
              WRITTEN-IN-FLIGHT, is excluded from both sides, and is judged by
              the next run — the reconciler no longer accuses its own
              concurrent writers (task-7a85d1b5f471af8f).
            - `2` — a SILENCE: part of what this compares could not be read, a
              row named a delivering run older than the truncated run page could
              see (TRUNCATED-UNJUDGEABLE — a run that fell off a bounded page is
              not a ghost), the population was empty, or the re-ask list was
              ABSENT (its memory
              did not survive the run boundary, or the fetch failed). Nothing
              here is a statement that the crown is correct. This arm used to
              `exit 0`. A benign in-flight SERVING GRACE is NOT this: that is
              rc 4, which warns and exits 0 and therefore never reaches this
              issue at all — its accusation is collected by the next run as
              GRACED-UNRECORDED (`1`). An empty window on a VERIFIED crown
              (serving sha recorded, re-ask list PRESENT-EMPTY, zero in-window
              rows) is NOT this either: that is the rc-0 QUIET WINDOW deferral
              and never reaches this issue — an empty window landing here means
              at least one quiescence condition failed.
            - `3` — a CONFIGURATION fault: the runner could not reach the control
              plane at all, or `CROWN_API_TOKEN` was set to an empty string.
              That says nothing about the crown's contents.

            This issue is idempotent per key (`crown-reconcile`): a continuing
            mismatch appends a comment rather than opening a new issue. CLOSE IT
            once a run reconciles — the next mismatch opens a fresh one.
        run: bash scripts/file-ci-failure-issue.sh

  crown-reconcile-harness:
    name: Crown reconcile harness
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n scripts/crown-reconcile.sh
      - name: Mutation proofs (crown-reconcile.test.sh)
        run: bash scripts/crown-reconcile.test.sh
