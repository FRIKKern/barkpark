# required-checks-drift — the required-check toolchain's own gate, plus the one
# workflow-shape ratchet that has to live somewhere path-unfiltered.
#
# Live protection, the committed .github/required-checks.json, and the check-run
# names a real PR head actually renders must agree. This workflow fails when they
# do not, and — the part that matters — it fails when it cannot SEE one of them.
#
# THE TOOLCHAIN'S TWO JOBS, SPLIT ON WHETHER THEY NEED A CREDENTIAL (wave 10)
#
#   `Required-check spec gate`          Hermetic: no network, no token, no
#                                       writes. Runs the mutation suite with
#                                       --hermetic (200 assertions, ~1min). The
#                                       count is maintained by hand and was
#                                       stale at 166 for several waves — if it
#                                       disagrees with the suite's own tally
#                                       line, the tally line is authoritative.
#   `Required-check spec drift (advisory)`  ADVISORY. Everything that reads the
#                                       GitHub API on a BREAKGLASS credential.
#
# A THIRD JOB THAT IS NOT ABOUT THE REQUIRED SET AT ALL, AND WHY IT IS HERE
#
#   `Every workflow job has runs-on+steps or uses`   Hermetic. Since wave 42 it
#                                       also enforces the same rule one level
#                                       down — every STEP carries exactly one of
#                                       `run:`/`uses:` — after two `name:`+`env:`
#                                       steps with no `run:` shipped green and
#                                       silently disabled the job that existed to
#                                       surface a red main push. The subject is
#                                       the whole .github/workflows tree, not
#                                       this workflow. It is here for ONE
#                                       property this file has and the repo's
#                                       other workflow-linting homes do not:
#                                       no `on:.paths` filter, so it renders on
#                                       every pull request. The defect it exists
#                                       to catch (a job left with only a `name:`
#                                       key, which makes GitHub refuse the WHOLE
#                                       file at parse time and render zero jobs)
#                                       arrived inside shell-harnesses.yml —
#                                       where every other workflow harness in
#                                       this repo is wired — and a broken file
#                                       cannot lint itself. It shares nothing
#                                       with the two jobs above but this home.
#
# WHAT THE SPEC GATE'S RED ACTUALLY DOES — AND THE HEADER USED TO OVERSTATE IT
#
# Until wave 53 this header labelled the spec-gate job BLOCKING. It is not, and
# saying so here was the epic's own defect class in the epic's own workflow.
# `.github/required-checks.json` holds the context out under `S7 EXCLUDED BY
# DECISION` (replacement trigger: cch-w37-bl-register-spec-gate-human-gate),
# and docs/ops/merge-gates.md already states the truth this header now
# matches rather than inventing a third phrasing: the job "is in no required
# aggregator's `needs:` and carries no required name, so it cannot block a
# merge." Its red is a signal a human must read, not a stop.
#
# Wave 10 did split the workflow on the credential boundary, and that split is
# what makes the hermetic half REGISTRABLE at all — but registering it is a
# branch-protection change and a lead call, not something this comment can
# assert into being.
#
# THE WORKFLOW IS DELIBERATELY UNFILTERED — THAT IS THE PAYMENT, AND IT IS THE
# PART THAT MATTERS MORE THAN WHETHER THE JOB IS REGISTERED
#
# There is no `on:.paths` key on either trigger, and adding one back would undo
# this change. A paths-filtered workflow emits NO check run on a PR that misses
# the paths, and an absent required context routes to `is expected.` forever —
# i.e. registering a filtered job's name deadlocks main. The filter also bought
# nothing here: the catch-all detector is a whole-directory scan of the REAL
# workflow tree that never consults the diff, so a name poisoned by an unrelated
# PR is invisible to any path glob. #8093 is the measured case — it DID trigger
# drift (`.github/workflows/**` had been in the glob list since 43fab05c9) and
# drift concluded success on both its head and its merge commit. It missed the
# poisoning because the detector did not exist yet, not because of a filter.
#
# Same precedent, same words as elixir.yml's `path-escape` job: it costs a few
# seconds of bash, and the alternative is a gate with a hole in it.
#
# WHY THE DRIFT JOB STAYS ADVISORY — AND THE REASON IS NOT "API BLIPS"
#
# The old header argued that "an API blip would stall the fleet." That is
# REFUTED by measurement: 67 of 67 non-cancelled runs concluded success on all
# three steps. Flakiness is not why this job cannot block.
#
# The real reason is CREDENTIAL LIFETIME AND SCOPE.
# `GET /repos/:o/:r/branches/:b/protection` requires ADMIN, and `administration`
# is not a scope a workflow `permissions:` block can grant to `github.token` —
# the key does not exist — so the runner's own token returns 403 there no matter
# what is listed below. The job therefore runs on `BREAKGLASS_TOKEN`, which is a
# broad `gh` OAuth USER token (`repo`, `workflow`): it belongs to a person, it
# rotates whenever that person re-logs in, and it can be revoked out from under
# CI without anyone touching this repo. A required context whose green depends on
# one human's session cookie is a gate that reds for a reason no PR author caused
# and no PR author can fix — which is the same disease, wearing the other mask.
# It is also far more scope than `administration: read` in a PUBLIC repository;
# secrets are not exposed to fork PRs, but any workflow change merged to main can
# read it. The fix is a fine-grained PAT scoped to this repo with
# Administration: Read-only and nothing else, mintable only in the web UI —
# filed as the human gate `hg-breakglass-token-fine-grained`. When that lands,
# the lifetime/scope argument expires and this job becomes registrable.
#
# `required-checks-verify.sh` hard-fails on a protection read it cannot make,
# deliberately: an unreadable input is a failure and never a skip. The
# `|| github.token` fallback keeps the job RUNNABLE if the secret is ever
# removed; it will then red on the protection read, which is the honest outcome
# and not a silent skip.
#
# `.github/required-checks.json` names the advisory job in its own exclusions,
# and that is enforced by the generator rather than by convention: a
# continue-on-error job cannot enter the required set (stage S2).

name: required-checks-drift

on:
  pull_request:
  push:
    branches: [main]
  # The required-set question is about the REPO's state, not about any one PR's
  # diff, so it wants a clock as well as a merge. Nightly catches a protection
  # change made in the GitHub UI, which no push to this repo would ever notice.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: required-checks-drift-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # Mirror elixir.yml: cancel superseded PR runs, never cancel main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── THE VENUE RULE, AND WHY IT IS A JOB-LEVEL `if:` AND NOT A PATHS FILTER ──
  #
  # MEASURED (20 recent pull_request runs, compute derived from job steps, not
  # from the job's wall clock which on a saturated queue is mostly waiting):
  #
  #     Required-check spec gate                       4.58 min/exec
  #     Required-check spec drift (advisory)           3.16 min/exec
  #     Every workflow job has runs-on+steps or uses   0.17 min/exec
  #
  # Across 1,227 PR pushes in 2026-08-30..09-02 that is on the order of 3,500
  # job-minutes for a question that does not change with the PR: "has the
  # required-checks roster moved?" is about the repo's state. Asking it 1,227
  # times a window gets the same answer 1,227 times.
  #
  # THE HEADER'S NO-FILTER RULE STANDS AND IS NOT BEING BROKEN. It says a
  # workflow-level `on:.paths` key emits NO check run on a PR that misses the
  # paths, and an absent context routes to `is expected.` forever. That is true,
  # and it is why there is still no `on:.paths` key here. A job-level `if:` is a
  # different mechanism: the job still RENDERS, with conclusion `skipped`, so
  # the name never goes absent and the deadlock the header warns about cannot
  # occur. That distinction is the whole reason this shape is legal.
  #
  # `workflow-job-shape` is deliberately NOT conditioned. It costs 0.17 min, it
  # is the reason this unfiltered home exists at all, and its subject is the
  # WHOLE workflow tree — a job poisoned by an unrelated PR is invisible to any
  # diff-derived condition. Conditioning it on its own inputs would be a
  # category error: its input IS every PR.
  changes:
    # No `if:`, no paths filter, no matrix — it runs on every event so the jobs
    # behind it always have a defined answer. Never a silent false: on an
    # unresolvable base it FAILS rather than dispatching false, because a
    # dispatcher that "could not tell" and emitted false would skip the gate
    # and publish a quiet green.
    name: Dispatch (required-checks inputs)
    runs-on: ubuntu-latest
    outputs:
      touched: ${{ steps.sets.outputs.touched }}
    steps:
      - uses: actions/checkout@v4
        with:
          # THE PR HEAD, not the merge ref — the same reason elixir.yml's
          # dispatcher documents: the merge ref already contains main's
          # advance, so a three-dot diff against a lagging base sweeps in
          # everything main gained and the condition never fires narrowly.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # FULL HISTORY, BLOBLESS. These two options are ORTHOGONAL and this
          # job needs both — DEPTH and FILTER are different axes, and confusing
          # them is exactly how this was first written and reverted (run
          # 33691239048, three of four dispatchers red on `PR base <sha> and
          # HEAD share NO common ancestor`).
          #
          # `fetch-depth: 0` — REQUIRED, do not drop it. The PR base sha must be
          # resolvable locally for the three-dot diff below, and a three-dot
          # diff resolves the MERGE BASE; a shallow history cannot compute one,
          # and this step treats an unresolvable base as a hard failure rather
          # than emit a verdict. Dropping this line does NOT leave "whatever the
          # filter gives you": actions/checkout then applies its DEFAULT depth
          # of 1, and a depth-1 clone — blobless or not — has no merge base.
          # `fetch-depth: 2` does not rescue it either; that trick works on jobs
          # sitting on `refs/pull/N/merge`, where HEAD^1 IS the base, and this
          # job deliberately is not one of those (see the `ref:` note above).
          #
          # `filter: blob:none` — the actual saving, and it is NOT shallowness.
          # A blobless partial clone fetches every commit and every tree and
          # omits only blob CONTENTS. `git diff --name-only` reads trees, not
          # blobs, so the commit graph, the merge base and the path set below
          # are unchanged BY CONSTRUCTION rather than by benchmark.
          #
          # THE DERIVATION, NOT A BARE NUMBER — a committed figure with no
          # command attached is exactly the thing that silently rots. Re-run it:
          #     bash scripts/dispatch-blobless-proof.sh
          # It clones this repo both ways at FULL depth, compares the three-dot
          # changed-path sets by SORTED CHECKSUM, and refuses to report a pass
          # if a sample is empty on both sides (two empty sets match, which
          # would be vacuous). Read 2026-09-03: full clone 138 s / .git 791 MB,
          # blobless 34 s / .git 189 MB, 5 sampled PRs IDENTICAL on both sides.
          fetch-depth: 0
          filter: blob:none
      - id: sets
        name: Does this PR touch what this workflow tests?
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
            echo "not a pull_request event — the gate runs unconditionally"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "base sha $base is not resolvable locally — REFUSING to guess" >&2
            exit 1
          fi
          files="$(git diff --name-only "$base"...HEAD)"
          if [ -z "$files" ]; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
            echo "empty diff — dispatching TRUE rather than skipping a gate"
            exit 0
          fi
          if printf '%s\n' "$files" | grep -qE '^(\.github/required-checks\.json|scripts/required-checks[.-].*|\.github/workflows/required-checks-drift\.yml)$'; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
            echo "this PR edits the required-checks spec or its scripts — running the gate"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
            echo "no required-checks input touched — the gate is skipped on this PR"
          fi
          printf '%s\n' "$files" | head -50

  # ── the hermetic half (see the header: not a required context today) ────────
  # Unmatrixed (one job, one rendered name — no `(27.0, 1.18.1)` tuple to pin),
  # path-unfiltered, and it depends on NO dispatcher job: a `needs:` on a
  # dispatch job would reintroduce exactly the conditional-absence shape the
  # paths filter had. It renders on every PR, always, and its name is stable.
  spec-gate:
    name: Required-check spec gate
    needs: changes
    if: needs.changes.outputs.touched == 'true'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout is REQUIRED, not incidental: §13's prose ratchet runs
      # `git ls-files` from the repo root and §3c/§3d scan the real workflow
      # tree. Without a git index §13 produces a spurious FAIL.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The whole hermetic suite: the poison filter's five rejections each
      # disarmed and watched failing to fire, the catch-all job-name refusal
      # (the #8093 specimen) asserted against a COPY of the real workflow tree
      # with one poison planted, the deadlock detector, the superset floor, and
      # verify's own 16 mutation clauses via §9. No network, no token.
      - name: Prove the toolchain by mutation (hermetic)
        run: bash scripts/required-checks.test.sh --hermetic

      # THE COMMIT PATH. apply.sh floors the WRITE path — it runs the floor
      # before the protection PUT and is fail-closed on every rc — but nothing
      # floored the COMMIT: `git grep -n required-checks-floor origin/main --
      # .github` returns exactly one hit and it is PROSE inside
      # required-checks.json's own _readme. So a PR that rewrote the spec —
      # dropping a required context, dropping a hand-authored _readme paragraph,
      # or flipping enforced back to false, all three of which the floor now
      # refuses — reddened nothing until someone ran apply by hand afterwards.
      #
      # THIS JOB AND NOT THE ADVISORY ONE. `Required-check spec drift
      # (advisory)` carries `continue-on-error: true`, so a floor breach there
      # prints and the job still concludes SUCCESS — a guard whose red is
      # swallowed is the defect class this workflow exists to delete. `spec-gate`
      # is hermetic (the floor makes no API call and needs no credential),
      # deliberately path-unfiltered so it renders on EVERY pull request rather
      # than only on ones that look like CI changes, and its failure is a real
      # red X. It is not a REQUIRED context today — registering it is a
      # branch-protection change and a lead call — so this is an unswallowed red
      # a human must read, which is strictly more than the advisory job can offer,
      # and it becomes blocking for free the day that name is registered.
      #
      # The reference is fetched explicitly: `fetch-depth: 1` leaves no
      # `origin/main` for the floor's default `git show origin/main:…` to
      # resolve, and the floor treats an unreadable reference as a REFUSAL, so
      # without this step the job reds for the wrong reason. On `pull_request`
      # actions/checkout gives the MERGE commit, so the candidate is the spec as
      # it would exist on main — a branch that is merely behind main cannot red
      # this.
      #
      # `+main:` (a FORCED ref update), and it is load-bearing on the push arm.
      # On push:main the shallow checkout already carries refs/remotes/origin/main
      # at the pushed sha; when main has moved on by the time this step runs (three
      # merges landed inside one minute on 2026-09-03 17:26Z, runs 33784608224 /
      # 33784621285 / 33784689210) an unforced fetch answers
      # `! [rejected] main -> origin/main (non-fast-forward)` and the job reds one
      # step AFTER the hermetic suite went green — a red that reads exactly like a
      # spec-gate failure and is not one. The floor then compares the candidate
      # against the NEWEST main, which is the reference it wants.
      - name: Fetch the floor's reference (origin/main's committed spec)
        run: git fetch --depth=1 origin +main:refs/remotes/origin/main

      - name: The committed spec holds the floor (contexts, _readme, enforced)
        run: |
          set -euo pipefail
          rc=0
          bash scripts/required-checks-floor.sh .github/required-checks.json || rc=$?
          case "$rc" in
            0) ;;
            1) echo "::error::FLOOR BREACH — this PR's .github/required-checks.json loses a required context, an _readme entry, or the enforced flag. The floor's own output above names each loss."; exit 1 ;;
            2) echo "::error::FLOOR GROWTH — this PR ADDS required context(s). Every PR in this repo must render them forever, and a job that is green today and paths-filtered tomorrow deadlocks main (D69). CI never passes --acknowledge-growth on its own: a human decides each added name belongs, and says so in the PR."; exit 1 ;;
            *) echo "::error::the floor could not be evaluated (exit $rc) — an unreadable reference is a refusal, never a pass."; exit 1 ;;
          esac

  # ── the workflow-file shape ratchet ─────────────────────────────────────────
  # WHY IT LIVES HERE AND NOT IN shell-harnesses.yml, where every other
  # workflow-linting harness in this repo is wired. A PR spliced a job block
  # between compose-smoke-dispatcher's `name:` line and its `runs-on:`/`steps:`,
  # leaving that job with nothing but a name. The file stayed valid YAML, so no
  # parser in the repo objected; GitHub refused the whole file at parse time
  # ("This run likely failed because of a workflow file issue", zero jobs, 0s)
  # on every push to main for nine hours, and all 25 shell harnesses went
  # silently unexecuted. A checker wired only inside shell-harnesses.yml would
  # have been dead alongside its subject — a broken file cannot lint itself.
  #
  # This workflow is the home because it is deliberately path-unfiltered (see
  # the header: adding an `on:.paths` key back would undo that) and so it
  # renders on EVERY pull request. A paths-filtered home would skip exactly the
  # PR that does not look like it touches CI.
  #
  # It is its own job on purpose: not a step appended to spec-gate (whose red
  # would then be ambiguous between two unrelated subjects) and not in any
  # required aggregator's `needs:`. It publishes a new, unregistered check-run
  # name; registering it is a branch-protection change and a lead call.
  workflow-job-shape:
    name: Every workflow job has runs-on+steps or uses
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The harness proves itself before it judges the tree: it plants a
      # name-only job, a runs-on-without-steps job, an unparseable file and a
      # legal `uses:` job in mktemp fixtures and asserts red/red/red/green, plus
      # the coverage floor (an empty scan exits 2, never a vacuous green) and an
      # unknown flag exiting 2 rather than 0.
      #
      # It also proves the STEP clause, and it does that on a COPY OF THIS FILE:
      # the plant deletes the `run:` line from the step directly below, leaving
      # the `name:`-only shape that ships green through every YAML parser in the
      # repo, and asserts the red names the file, the job id and the step index.
      # So the step below is both the check and the checked.
      - name: Prove the shape checker on planted fixtures (--selftest)
        run: bash scripts/workflow-job-shape-check.sh --selftest

      # PyYAML ships on ubuntu-latest; no install step, no network.
      - name: Every job in .github/workflows has a legal shape
        run: bash scripts/workflow-job-shape-check.sh --dir .github/workflows

  # ── the advisory half ───────────────────────────────────────────────────────
  required-checks-drift:
    name: Required-check spec drift (advisory)
    needs: changes
    if: needs.changes.outputs.touched == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The API stage, §10 and §11: the committed spec's `enforced` flag against
      # whether the branch is REALLY protected, and full-mode verify against live
      # protection — including the phantom-context mutation, which now has to
      # NAME the phantom rather than merely exit non-zero. (The bare run is the
      # hermetic suite PLUS these; there is no third home for --selftest, which
      # §9 runs internally.)
      - name: Prove the toolchain against the live API (§10, §11)
        env:
          GH_TOKEN: ${{ secrets.BREAKGLASS_TOKEN || github.token }}
        run: bash scripts/required-checks.test.sh

      - name: Three-way drift check (spec ↔ live protection ↔ rendered names)
        env:
          GH_TOKEN: ${{ secrets.BREAKGLASS_TOKEN || github.token }}
        run: |
          set -euo pipefail
          rc=0
          # No --sha: the guard picks a SETTLED head (a recently merged PR) on
          # purpose. This PR's own head is mid-flight, and a required context
          # that has not reported YET is not a deadlock.
          bash scripts/required-checks-verify.sh --ci || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "::error::DEADLOCK — the committed spec requires a context this head never rendered. Merging with protection on would brick the branch."
            exit 1
          fi
          exit "$rc"
