  tooling-harnesses:
    needs: [changes]
    if: needs.changes.outputs.tooling-harnesses == 'true'
    name: reland-check / fleet-run-verdict / paper-reader-audit harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: python3 is present (reland_check.py is the classifier)
        run: |
          command -v python3 >/dev/null || {
            echo "python3 missing on the runner image — add actions/setup-python" >&2
            exit 1
          }
          python3 --version
      - name: reland_check damper matrix
        # reland-check.yml runs reland_check.py in anger (and swallows its
        # stderr with `|| true`); its harness ran nowhere.
        run: bash tooling/task-obsession/reland_check.test.sh
      - name: reland-check loud-fail matrix (HTTP error, truncation, zero digest)
        # The re-land job is `continue-on-error: true`, so its green conclusion
        # carries NO information — these fixtures are the only thing that proves
        # it can still tell an error envelope, a 16%-of-the-corpus scan, and a
        # signal-less ledger apart from a clean scan. RELAND_REQUIRE_YAML makes a
        # missing PyYAML a failure instead of a silently skipped section.
        env:
          RELAND_REQUIRE_YAML: "1"
        run: |
          # The sim reads reland-check.yml itself, so PyYAML is load-bearing here.
          python3 -c 'import yaml' 2>/dev/null || pip3 install --quiet pyyaml
          bash tooling/task-obsession/reland_loudfail.test.sh
      - name: go-path-escape-check.test.sh syntax check
        run: bash -n scripts/go-path-escape-check.test.sh
      - name: "go-tests' Dispatch job gives a stale head a path verdict and NAMES the missing ratchet"
        # The ratchet step body is EXTRACTED from go-tests.yml and EXECUTED
        # against two heads: one without scripts/go-path-escape-check.sh (the
        # shape that died exit 127 in 5 of the last 100 PR runs — the dispatcher
        # must still emit a verdict and must NAME the absence) and this tree,
        # which has it (unchanged: selftest count line, then the check verdict).
        # Case 4 restores the pre-fix two-liner on a copy and proves 127 comes
        # back — the harness has been shown to lose. PyYAML is load-bearing: the
        # harness exits 2 (HARNESS-UNAVAILABLE, never a pass) without it.
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip3 install --quiet pyyaml
          bash scripts/go-path-escape-check.test.sh
      - name: relandcheck-diff-producer.test.sh syntax check
        run: bash -n scripts/relandcheck-diff-producer.test.sh
      - name: reland-check.yml's changed-file producer keeps quote-bearing paths and rename sources
        # The step body is EXTRACTED from reland-check.yml and EXECUTED against
        # real git fixtures, so this cannot drift into a paraphrase of what CI
        # runs. Case 4 restores the PRE-FIX producer on a copy and proves both
        # false-green shapes reappear — the harness has been shown to lose.
        # PyYAML is load-bearing: the harness exits 2 (HARNESS-UNAVAILABLE,
        # never a pass) without it, so install rather than skip.
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip3 install --quiet pyyaml
          bash scripts/relandcheck-diff-producer.test.sh
      - name: main-red-breaker.sh syntax + harness (stub curl + fixtures, no network)
        run: |
          bash -n scripts/main-red-breaker.sh
          bash scripts/main-red-breaker.test.sh
      - name: "stale-tree CI wiring (job, job-level if, concurrency, breaker arm, Decide step)"
        # The `Head does not silently revert main (stale tree)` job in
        # required-checks-drift.yml is a six-place change and five of those
        # places fail SILENTLY — a deleted Decide step over three
        # continue-on-error gate steps is a job that cannot go red. The harness
        # mutates a COPY of the workflow for each clause and asserts the red.
        # PyYAML is load-bearing: without it the harness exits 2
        # (HARNESS-UNAVAILABLE, never a pass), so install rather than skip.
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip3 install --quiet pyyaml
          bash -n scripts/stale-tree-regression-check.sh
          bash scripts/stale-tree-ci-wiring.test.sh
      - name: fleet-run verdict matrix
        run: bash tooling/fleet/fleet-run-verdict-test.sh
      - name: audit-paper-readers.sh syntax check
        run: bash -n scripts/audit-paper-readers.sh
      - name: "gate-map: the composed slice gate still finds __css_check over breakpoint-sweep.mjs"
        # The wave-16 red this composer exists for. Its selftest is built to
        # LOSE — a planted map entry, a removed instrument, a narrowed scan set,
        # an empty population glob and a collapsed population each red it — so a
        # green here is evidence, not a tally.
        #
        # THERE IS NO COMMITTED SNAPSHOT (task-294d79c9345d59dd). There was, and
        # it was a treadmill: any merge adding a file under POPULATION_GLOBS
        # staled tooling/gate-map/gate-map.json, so two PRs each green apart —
        # one adding an instrument, one holding a fresh snapshot — reded MAIN
        # together and every open PR inherited the refusal. Measured three times
        # in 24 h. The map is now derived on every run (~1 s), and `--verify`
        # checks the DERIVATION instead: every population glob still matches,
        # the population clears a floor, nothing is dropped, and the wave-16
        # edge still resolves. Each of those can only be broken by a diff that
        # REMOVES something — i.e. always by the PR that is red.
        run: |
          node --check tooling/gate-map/gate-map.mjs
          node tooling/gate-map/gate-map.mjs --verify
          node --test tooling/gate-map/gate-map.test.mjs

      - name: paper-reader audit fixture
        # paper-readers.yml executes audit-paper-readers.sh on every run; its
        # fixture harness — the only thing that proves the audit can report a
        # miss — executed nowhere.
        run: bash scripts/audit-paper-readers-test.sh

  launcher-boot-selftest:
    needs: [changes]
    if: needs.changes.outputs.launcher-boot-selftest == 'true'
    name: bin/barkpark up/stop differential selftest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # MANDATORY. The selftest is DIFFERENTIAL against a PINNED pre-fix
          # blob (0bff57e4f500e9c9fc99424fa2635ca9988be725:bin/barkpark, an
          # ancestor of main). On a shallow checkout that object is absent and
          # the script exits 2 on every run forever — a gate that can only lose.
          fetch-depth: 0
      - name: the pinned pre-fix reference blob is readable
        # Fail by NAME if history ever stops carrying the pin, rather than as an
        # opaque exit 2 from the selftest itself.
        run: git cat-file -e 0bff57e4f500e9c9fc99424fa2635ca9988be725:bin/barkpark
      - name: bin/barkpark syntax check
        run: bash -n bin/barkpark
      - name: up/stop selftest (6 differential fixtures, 2 controls, no postgres)
        # Hermetic: temp BARKPARK_HOME, a probed-free port, curl/mix stubs, and
        # only pids the harness itself spawned are ever signalled.
        run: bash scripts/barkpark-boot-selftest.sh

  workflow-portability:
    needs: [changes]
    if: needs.changes.outputs.workflow-portability == 'true'
    name: .claude/workflows engines load on a machine that is not this one
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        # The DEFAULT depth is correct here. Clause G asks `git cat-file -e
        # HEAD:<path>`, which needs HEAD's tree and nothing older, and the
        # harness builds its own fixture repos from mktemp. No history required.
      - name: node is present (clauses P/M1/M2/C/W are node-parsed)
        # The tripwire turns a missing node into a RED by design (clause N: a
        # blind check must never skip). That is correct but illegible; fail by
        # NAME here instead, matching the python3/jq name-checks above.
        run: |
          command -v node >/dev/null || {
            echo "node missing on the runner image — the workflow engines are parsed with it" >&2
            exit 1
          }
          node --version
      - name: workflow-portability-check.sh syntax check
        run: bash -n scripts/workflow-portability-check.sh
      - name: workflow-portability-check.test.sh syntax check
        run: bash -n scripts/workflow-portability-check.test.sh
      - name: the tripwire can still LOSE (19 mutation cases, hermetic git fixtures)
        # THE FAIL-BEFORE PROOF, and it lives here rather than in a chartered
        # before/after because a guard and its fixes cannot co-merge and still
        # demonstrate the red. Case 2 mutates an engine into a syntax error that
        # `node --check` reports GREEN; case 6 plants a reference that exists on
        # disk and is untracked — the vacuous pass a working-tree oracle gives.
        # No `continue-on-error` anywhere in this file: it launders a red into a
        # green JOB conclusion, which is the only thing the fleet reads.
        run: bash scripts/workflow-portability-check.test.sh
      - name: workflow-module-exec-smoke.sh syntax check
        run: bash -n scripts/workflow-module-exec-smoke.sh
      - name: workflow-module-exec-smoke.test.sh syntax check
        run: bash -n scripts/workflow-module-exec-smoke.test.sh
      - name: the EXECUTION gate can still LOSE (TDZ + schema-tripwire mutants)
        # The fail-before proof for the module-scope execution gate. Every gate
        # this repo had for these engines only PARSES them, which is structurally
        # blind to a temporal-dead-zone crash (a runtime ReferenceError) and
        # leaves the engines' own module-scope tripwires as dead code. Cases 2
        # and 3 each run BOTH gates on the same mutant and assert the split:
        # parse-only GREEN, execution RED. Commit f8977af85c is the time this
        # class actually took the epic-cycle engine out.
        run: bash scripts/workflow-module-exec-smoke.test.sh
      - name: the live corpus LOADS (module scope executes, fenced at first spend)
        # Complements "is portable" rather than replacing it: portability parses,
        # this one RUNS module scope with stub globals and stops at the first
        # agent/parallel/pipeline call, so nothing is ever spawned or billed.
        run: bash scripts/workflow-module-exec-smoke.sh
      - name: the live corpus is portable
        # The ratchet proper. ADVISORY by decision D4 — this workflow is not one
        # of main's required contexts (those are exactly: Elixir gate, PR
        # references an active task, Cloud gate, Console gate), so wiring makes
        # this RUN, not BLOCK. Promotion is a separate evidence-gated decision,
        # filed as ecd-bl-tripwire-promotion.
        run: bash scripts/workflow-portability-check.sh .claude/workflows

      # ── .github/workflows run: bodies are shell nothing ever parsed ─────────
      # STEPS IN AN EXISTING JOB, deliberately: a new blocking job is a
      # seven-place change (job, needs, decide binding, every `env -i`
      # simulator, the spec-authority marker, the merge-authority claim count,
      # the hermetic suite's --expect-unrendered acknowledgement). Steps cost
      # none of them, and this job is already the home for "harnesses that read
      # workflow files".
      - name: workflow-run-shell-check.sh syntax check
        # Runs on the runner's bash 5, but the script is ALSO required to parse
        # under macOS bash 3.2 — see the header. That constraint is why its
        # embedded python block carries no apostrophes.
        run: bash -n scripts/workflow-run-shell-check.sh
      - name: the run-body gate can still LOSE (13 arms, hermetic fixtures)
        # THE FAIL-BEFORE PROOF. Arm (a) is the defect that motivated the gate,
        # reproduced verbatim: an apostrophe inside a single-quoted `node -e`
        # body truncates the program, node dies with SyntaxError, and the step
        # exits 1 — ci-boundary.mjs's REGRESSION code, so a step that could not
        # START was indistinguishable from one that had found architectural
        # debt. Arms (e) and (f) are the ones that keep this gate honest rather
        # than merely present: an unparseable workflow REFUSES by name instead
        # of being silently skipped, and a run over zero bodies FAILS instead of
        # reporting the success that any gate over no inputs reports.
        run: bash scripts/workflow-run-shell-check.sh --selftest
      # Quoted: an unquoted plain scalar cannot contain ": " — it is read as a
      # mapping and the whole workflow stops parsing. Caught by this very gate.
      - name: "every workflow run: body parses as shell, and no piped script exits mid-write"
        # TWO ARMS, both clean-tree and both measured before they were written.
        #
        # ARM A — all 447 shell bodies across the corpus parse (2 more declare a
        # non-shell `shell:` and are skipped by name).
        #
        # ARM B — no script a workflow PIPES calls process.exit(). Node does not
        # flush a pending stdout write before exit, so into a pipe that can
        # truncate the payload silently while the exit status still looks fine.
        # The 21 sites that existed across 5 piped scripts were adjudicated in
        # the PR that added this arm: terminal-after-stdout ones converted to
        # process.exitCode, guards that must abort kept as exit() with a
        # greppable `pipe-exit-ok:` marker and a stated reason.
        #
        # Neither arm has a baseline, and no baseline is a baseline that cannot
        # rot. Both fail on zero inputs rather than reporting the success any
        # gate over nothing reports.
        run: bash scripts/workflow-run-shell-check.sh

  exit-runner-guard:
    needs: [changes]
    if: needs.changes.outputs.exit-runner-guard == 'true'
    name: deploy-reliability-exit-run.sh mutation matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        # The DEFAULT depth is correct here. The harness builds every fixture with
        # `git init` in mktemp (and its shallow case from a `--depth 1` file://
        # clone), so it needs no history of this repository. The single probe that
        # would use `origin/main` — seal-run.sh byte identity — refuses to fake a
        # verdict when the ref is unresolvable and reports the skip BY NAME.
      - name: python3 is present (the census stub's envelope is python3-shaped)
        # scripts/deploy-reliability-exit-run.test.sh:48 hard-refuses with exit 2
        # when python3 is missing — correctly red, but illegibly so. Fail by NAME,
        # matching the python3/jq/node name-checks above.
        run: |
          command -v python3 >/dev/null || {
            echo "python3 missing on the runner image — add actions/setup-python" >&2
            exit 1
          }
          python3 --version
      - name: deploy-reliability-exit-run.sh syntax check
        run: bash -n scripts/deploy-reliability-exit-run.sh
      - name: deploy-reliability-exit-run.test.sh syntax check
        run: bash -n scripts/deploy-reliability-exit-run.test.sh
      - name: the exit runner's refusals can still LOSE (96 assertions, offline)
        # THE REASON THIS LANE EXISTS: `grep -rln deploy-reliability-exit-run
        # .github/` matched nothing, so the epic's headline instrument — the one
        # that re-derives the never-covered number — had 96 assertions guarding
        # it and no runner to execute them. Every refusal here is proven by
        # MUTATION: the guard's `if` is neutralised by its `# MUT:` anchor and the
        # refusal is watched disappearing, and the mutation step asserts the sed
        # changed a line, so a renamed anchor reds instead of no-opping.
        # No `continue-on-error` here or anywhere in this file — it launders a red
        # into the green JOB conclusion the fleet reads.
        run: bash scripts/deploy-reliability-exit-run.test.sh

  # ── ORPHAN SWEEP II (CI gate-wiring + spec-generator wave, cgsiw-s3) ────────
  #
  # Two guards that were already WRITTEN, already GREEN, and already carried a
  # mutation-proven selftest — and that no workflow in .github/workflows/ ever
  # invoked. `grep -rln cloud-static-gz-guard .github/` and `grep -rln
  # pds-live-hetzner-placement-group .github/` both matched NOTHING. That is the
  # wave's premise in its purest form: a guard can be perfectly written and
  # still vacuous AS A GATE, because the wiring never runs it on the PR that
  # breaks the thing it guards. Wiring is the whole fix.
  #
  # Each rides the house selftest-first idiom — two bare lines in one `run: |`
  # block, no `&&` (a multi-line GitHub `run:` is `bash -e`, so line one failing
  # already stops the step; `&&` would only make a two-line chain harder to
  # read), exactly as doc-gates.yml does for never-cancel-main-check.sh. The
  # selftest goes FIRST on purpose: if the guard has lost the ability to fail,
  # that is reported before its verdict on the live tree is believed.

  cloud-static-gz:
    needs: [changes]
    if: needs.changes.outputs.cloud-static-gz == 'true'
    name: cloud-static-gz-guard.sh (uncommitted siblings, both halves wired)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        # The DEFAULT depth is correct. Check 1 asks `git ls-files`, which reads
        # the index, and the selftest builds its own `git init` repo in mktemp.
        # No history of this repository is required.
      - name: cloud-static-gz-guard.sh syntax check
        run: bash -n scripts/cloud-static-gz-guard.sh
      - name: the gz guard can still LOSE, then the live tree passes
        # The selftest builds a throwaway repo from the REAL files and breaks
        # each invariant in turn — the `*.gz` ignore rule deleted, the Dockerfile
        # gzip step deleted, that step reordered ABOVE `COPY priv priv` (the
        # ordering is what makes source and sibling born together), and the
        # router losing `gzip: true` — asserting a red on each. Baseline on
        # origin/main: `10 passed, 0 failed`. Hermetic: git + bash, no network,
        # no `bp`, and it plants nothing in the tree.
        run: |
          bash scripts/cloud-static-gz-guard.sh --selftest
          bash scripts/cloud-static-gz-guard.sh

  pds-hetzner-offline:
    needs: [changes]
    if: needs.changes.outputs.pds-hetzner-offline == 'true'
    name: pds-live-hetzner-placement-group.sh --selftest-offline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: python3 is present (the manifest emitter and its validators are python3)
        # Matching the python3/jq/node name-checks above: an image change that
        # drops python3 should fail BY NAME here rather than as a mysterious
        # refusal from inside the offline arm.
        run: |
          command -v python3 >/dev/null || {
            echo "python3 missing on the runner image — the manifest emitter is python3" >&2
            exit 1
          }
          python3 --version
      - name: pds-live-hetzner-placement-group.sh syntax check
        run: bash -n scripts/pds-live-hetzner-placement-group.sh
      - name: the credential-free arm (ONLY --selftest-offline is CI-able)
        # ONE ARM, DELIBERATELY. Per the script's own usage block, `--selftest`
        # HARD-REFUSES at exit 3 without a Hetzner credential — two of its four
        # credential states are PROCEED states and would pass vacuously with
        # none — and `--harvest-only` keeps the credential fence too. Wiring
        # either here would manufacture a permanent red that says nothing.
        # `--selftest-offline` is the arm the script itself names as "the
        # CREDENTIAL-FREE arm and the CI-able gate": it scrubs every
        # HCLOUD_*/HETZNER_* variable out of its own environment, re-execs,
        # COUNTS what survived (must be zero), then runs four mutation blocks
        # plus the harvest validators — including a proof that the committed
        # fixture manifest is byte-identical to what this script's own emitter
        # produces. There is no bare run to pair it with: the bare script is the
        # LIVE arm and needs the credential.
        run: bash scripts/pds-live-hetzner-placement-group.sh --selftest-offline

  # ── TASK LEASE RENEW (task-16e56d05b809dd39) ───────────────────────────────
  # scripts/task-lease-renew.sh is the CI half of the ledger lease extension: it
  # POSTs /v1/tasks/:doc_id/renew so a claim does not lapse underneath its own
  # open pull request while it waits out a 60-90 minute queue. The API half
  # (Barkpark.Tasks.Renew) shipped INERT — nothing called it — and this is the
  # caller.
  #
  # ADVISORY BY CONSTRUCTION, not by a flag. The subject exits 0 on EVERY ledger
  # state it can meet (row gone, no live claim, cap spent, ledger down), because
  # a red for a ledger state is the confusion the row was filed against. Exactly
  # ONE arm is non-zero: 401/403, a refused BARKPARK_TASK_TOKEN, which would
  # otherwise make every future run a silent no-op. The harness drives both
  # directions rather than reading the table.
  #
  # Hermetic: a stub `curl` on PATH answers with canned codes and bodies and
  # logs its argv, so the REAL request the subject builds is asserted rather
  # than assumed. No network, no token, no bp — it cannot rot into a skip.
  task-lease-renew:
    needs: [changes]
    if: needs.changes.outputs.task-lease-renew == 'true'
    name: task-lease-renew response classification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: python3 is present (the response reader is python3)
        # The subject turns a missing python3 into exit 2 CANNOT MEASURE —
        # correctly refusing rather than skipping, but illegibly so. Resolve it
        # by NAME here, matching this file's idiom.
        run: |
          command -v python3 >/dev/null || {
            echo "python3 missing on the runner image — task-lease-renew's response reader needs it" >&2
            exit 1
          }
          python3 --version
      - name: task-lease-renew.sh + harness syntax check
        run: |
          bash -n scripts/task-lease-renew.sh
          bash -n scripts/task-lease-renew.test.sh
          bash -n scripts/task-lease-sweep.sh
          bash -n scripts/task-lease-sweep.test.sh
      - name: every response class lands on its verdict (stub curl, no network)
        run: bash scripts/task-lease-renew.test.sh
      - name: the 20-min sweep drives the whole chain per open PR (stub curl + stub gh, no network)
        run: bash scripts/task-lease-sweep.test.sh

  landed-mark:
    needs: [changes]
    if: needs.changes.outputs.landed-mark == 'true'
    name: landed-mark.sh selftest + idempotency mutation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        # DEFAULT depth is enough and is deliberate: every git repo the selftest
        # walks is built with `git init` under mktemp. Nothing here reads this
        # repo's history, so a shallow checkout cannot make it lie.
      - name: python3 is present (the row reader and patch builder are python3)
        # The script turns a missing python3 into exit 2 CANNOT MEASURE —
        # correctly refusing rather than skipping, but illegibly so. Resolve it
        # by NAME here, matching this file's idiom for jq and PyYAML.
        run: |
          command -v python3 >/dev/null || {
            echo "python3 missing on the runner image — landed-mark's row reader needs it" >&2
            exit 1
          }
          python3 --version
      - name: landed-mark.sh + harness syntax check
        run: |
          bash -n scripts/landed-mark.sh
          bash -n scripts/landed-mark.test.sh
      - name: the selftest is green, then its idempotency arm is DISARMED and reds
        # The harness runs the 41-assertion selftest armed, then replaces the
        # MUT-IDEMPOTENT condition with an unconditional false in a scratch copy
        # and requires exactly the three re-run assertions to go red while three
        # unrelated arms stay green. It asserts the anchor matched EXACTLY ONCE
        # and that the copy really differs before executing the mutant — a
        # mutation that did not apply is not a catch.
        #
        # Hermetic: mktemp git repos, mktemp fixture ledgers, no network, no
        # token, no bp. There is no live arm to skip into.
        run: bash scripts/landed-mark.test.sh
      - name: the instrument reproduces the 2026-09-01 finding from its fixture
        # Criterion 1 of task-2e16f1390ffc064f. The three rows lead-reconcile
        # named were sealed BY HAND hours after the measurement, so a live read
        # correctly returns nothing and would be misread as "no defect". The
        # frozen capture is the only way to re-run the original measurement;
        # scripts/fixtures/landed-mark/2026-09-01T2000Z/PROVENANCE.txt records
        # exactly which bytes are captured and which are reconstructed.
        run: |
          set -uo pipefail
          out="$(bash scripts/landed-mark.sh --list-open \
            --fixture scripts/fixtures/landed-mark/2026-09-01T2000Z)"
          echo "$out"
          for want in task-b68092d5bac508e0 task-9009e2e4f0e5b5b6 task-076ca42e29836029; do
            grep -q "$want" <<<"$out" || { echo "the fixture no longer reproduces $want" >&2; exit 1; }
          done
          # The negative direction. A listing that only ever lists is not a
          # measurement: this row was sealed and must be WITHHELD.
          if grep -q task-a4ad081d07a2e203 <<<"$out"; then
            echo "a SEALED row was listed — the instrument stopped discriminating" >&2
            exit 1
          fi
          grep -q "scanned 5 commit(s); 3 row(s)" <<<"$out" || {
            echo "the scan count moved — the fixture and the instrument disagree" >&2; exit 1; }
      - name: landed-open-report.sh + harness syntax check
        run: |
          bash -n scripts/landed-open-report.sh
          bash -n scripts/landed-open-report.test.sh
          bash -n scripts/landed-open-report-schedule.sh
          bash -n scripts/landed-open-report-schedule.test.sh
          python3 -c "import ast,sys; ast.parse(open('scripts/lib/landed_open_report.py').read())"
      - name: the READER's selftest is green, then nine arms are DISARMED and red
        # The consumer for the back-link this job's writer produces. Its own
        # selftest proves it SEES (a live landed row present, a done one and an
        # unlabelled one absent, PARENT and GATE? rows listed AND flagged) and
        # that a failed read never prints like a zero. The mutation harness
        # then breaks nine arms one at a time in scratch copies and requires
        # the selftest to go red for each — a guard whose selftest survives the
        # guard being deleted is theatre.
        #
        # Hermetic: fixture pages on disk, no network, no token, no bp. There
        # is no live arm to skip into, so this cannot rot into a green skip.
        run: |
          bash scripts/landed-open-report.sh --selftest
          bash scripts/landed-open-report.test.sh

      - name: the CONSUMER refuses a failed read, and that refusal is load-bearing
        # scripts/landed-open-report-schedule.sh is the step body of
        # .github/workflows/landed-open-report.yml — the thing that finally
        # RUNS the reader (task-f5be1a6dbf914096). It lives in scripts/ so this
        # harness can execute the same bytes CI executes; the alternative, a
        # predicate inside a YAML `run:` block, is how pr-task-gate silently
        # dropped every backtick-wrapped trailer for weeks.
        #
        # Hermetic: a STUB `bp` on LANDED_REPORT_BP, no token, no network. It
        # proves the 401 arm exits non-zero carrying the reader's own CANNOT
        # READ line, that an unset token is a failure and not a skip, that the
        # population floor refuses a thin read, and that [PARENT] / [GATE?]
        # reach $GITHUB_STEP_SUMMARY — then deletes each of those refusals in a
        # scratch tree and requires the run to stop refusing.
        run: bash scripts/landed-open-report-schedule.test.sh

  doc-gates-paths-parity:
    needs: [changes]
    if: needs.changes.outputs.doc-gates-paths-parity == 'true'
    name: doc-gates.yml push.paths == pull_request.paths
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        # DEFAULT depth. The guard reads one file out of the working tree and
        # builds every fixture under mktemp.
      - name: python3 + PyYAML are present (the workflow is yaml-PARSED, not grepped)
        # The guard turns a missing python3/PyYAML into exit 2
        # HARNESS-UNAVAILABLE — correctly refusing rather than skipping, but
        # illegibly so. Resolve it by NAME here instead. PyYAML is INSTALLED
        # rather than demanded, matching this file's own idiom at the
        # reland-check step above: whether the runner image happens to ship it
        # is an image fact, not a finding about this repo, and a red that says
        # `ModuleNotFoundError: yaml` teaches a reader nothing about doc-gates'
        # paths lists. A missing python3 is still a hard, named failure — pip3
        # cannot repair that.
        run: |
          command -v python3 >/dev/null || {
            echo "python3 missing on the runner image" >&2
            exit 1
          }
          python3 -c 'import yaml' 2>/dev/null || pip3 install --quiet pyyaml
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"
      - name: doc-gates-paths-parity-check.sh syntax check
        run: bash -n scripts/doc-gates-paths-parity-check.sh
      - name: the parity guard can still LOSE, then the live doc-gates.yml passes
        # doc-gates.yml hosts ~14 guards behind a hand-enumerated `paths:`
        # filter, and behind it TWICE — push and pull_request each carry their
        # own ~70-entry copy. They have ALREADY drifted (70 vs 69). The 22-case
        # selftest proves BOTH directions (a matched pair passes, a one-sided
        # pair reds), the fail-closed arm (a zero-entry or unparseable block is
        # exit 2 HARNESS-UNAVAILABLE, never a pass — `[] == []` is the vacuous
        # green this refuses), and the terminal unknown-argument refusal. The
        # comparison itself was disarmed in a scratch copy and the selftest went
        # 11 passed / 4 FAILED; that proof is recorded in the guard's header.
        run: |
          bash scripts/doc-gates-paths-parity-check.sh --selftest
          bash scripts/doc-gates-paths-parity-check.sh
      # THIS FILE'S OWN twin lists, through the same guard. The 2026-09-01
      # measurement found them drifted 94 vs 85 — nine entries wired on
      # pull_request and missing from push, every one added by hand and never
      # mirrored, so the autostamp-bridge and weekly-changelog lanes stopped
      # running the moment code landed on main — the one event they exist to
      # observe. The nine were adjudicated
      # (all mirrored, none PR-only by design) and PINS is empty on purpose —
      # this run is CLEAN-TREE, and a new one-sided entry reds the PR that adds
      # it instead of going dark for weeks. The job NAME still says doc-gates;
      # renaming a job renames its check-run context, which is wiring, not
      # cosmetics — the step name and this comment carry the wider truth
      # instead. Self-watching is not self-certifying: the guard parses the
      # YAML it is defined in, and an edit that breaks that parse is a
      # HARNESS-UNAVAILABLE exit 2, never a silent pass.
      - name: shell-harnesses.yml push.paths == pull_request.paths (same guard, second target)
        env:
          DOC_GATES_PATHS_PARITY_TARGET: .github/workflows/shell-harnesses.yml
          DOC_GATES_PATHS_PARITY_PINS: ""
        run: bash scripts/doc-gates-paths-parity-check.sh

  # ── MERGE-GATE AUTOSTAMP BRIDGE (task-8fb6aa7b6d57f737) ────────────────────
  # #5742 shipped a `pull_request` consumer with five green unit tests and no
  # subscription for the event, so the handler was never invoked once in 29 days
  # and 9 merge-gated tasks went unstamped by hand while CI stayed green. Both
  # harnesses below exist because a unit test on a handler cannot see a delivery
  # that never happens.
  merge-gate-bridge:
    needs: [changes]
    if: needs.changes.outputs.merge-gate-bridge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: subscription-parity syntax check
        run: bash -n scripts/github-webhook-subscription-parity.sh
      - name: liveness syntax check
        run: bash -n scripts/merge-gate-autostamp-liveness.sh
      - name: consumed events are subscribed events (code vs App manifest vs runbook)
        # NO `continue-on-error`. This is the check whose absence let the bridge
        # ship dead; laundering its red into a green job conclusion would rebuild
        # exactly the condition it was written to end.
        run: bash scripts/github-webhook-subscription-parity.sh
      - name: parity tripwire mutation proofs (incl. the real pre-fix tree)
        run: bash scripts/github-webhook-subscription-parity.test.sh
      - name: liveness detector proofs (hermetic fixtures, no gh/bp/network)
        # ONLY the hermetic half. The LIVE verdict shells `gh` and `bp` against
        # the real ledger; `bp` is not on runners and the live path is currently
        # BROKEN pending a human GitHub-App change, so a wired live job would
        # exit 1 forever — a watch that can only lose. It is a runbook command
        # plus the named open human gate (see the script header and
        # docs/ops/github-sync.md §1).
        run: bash scripts/merge-gate-autostamp-liveness.test.sh

  # ── FLEET COORDINATION HARNESSES (task-f89c2aed221d9fdb) ───────────────────
  # Three subjects and three harnesses that no workflow named until now. Every
  # one of the six was absent from this file, from .githooks/, from the Makefile
  # and from docs/, so each self-test was unreachable: it could not fire and it
  # could not lose. The logic underneath is live fleet tooling, not a prototype.
  #
  # already-fixed.sh answers "is this on origin/main?" by CONTENT — git show,
  # git grep, git log -S — and structurally refuses to read a PR's `merged`
  # flag in any mode, using `gh` only as an enumerator. That refusal is the
  # whole point: a squash rewrites the commit, so `--is-ancestor` on a PR head
  # is always false, and a stacked PR reports merged:true while its code sits
  # in the parent branch, absent from main. Harness case 13 pins exactly that.
  #
  # branch-owner.sh reads a bp claim FLAT at `.claim` and carries a measured
  # BSD-date fix: `date -j` accepted a trailing Z, reinterpreted the stamp as
  # local time, exited 0 silently, and on a CEST host aged every claim by 120
  # minutes — turning a live owner into POSSIBLY-STALE.
  #
  # pr-overlap.sh exits 2 HOLD and prints no map when any `gh` call fails,
  # because an empty overlap map is indistinguishable from "none found".
  #
  # All three harnesses stub git, gh and bp; nothing reaches the network, a
  # credential, or the real repo. python3 is the sole unstubbed dependency.
  fleet-coordination-harnesses:
    needs: [changes]
    if: needs.changes.outputs.fleet-coordination-harnesses == 'true'
    name: already-fixed / branch-owner / pr-overlap harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: python3 is present (two subjects exit 2 without it)
        # pr-overlap.sh:105 hard-refuses without python3, and branch-owner.sh
        # uses it for iso_to_epoch and claim_fields. Both turn absence into a
        # correct but illegible exit 2. ubuntu-latest ships python3; this step
        # makes the dependency fail BY NAME if an image change removes it.
        run: |
          command -v python3 >/dev/null || {
            echo "python3 missing on the runner image — pr-overlap and branch-owner parse timestamps with it" >&2
            exit 1
          }
          python3 --version
      - name: already-fixed.sh syntax check
        run: bash -n scripts/already-fixed.sh
      - name: already-fixed.test.sh syntax check
        run: bash -n scripts/already-fixed.test.sh
      - name: content beats a merged flag (hermetic, git and gh stubbed)
        # NO `continue-on-error` here or anywhere in this file. It launders a
        # red into a green job conclusion, which is the one signal the fleet
        # and branch protection actually read.
        run: bash scripts/already-fixed.test.sh
      - name: branch-owner.sh syntax check
        run: bash -n scripts/branch-owner.sh
      - name: branch-owner.test.sh syntax check
        run: bash -n scripts/branch-owner.test.sh
      - name: claim-freshness matrix (hermetic, git and gh and bp stubbed)
        run: bash scripts/branch-owner.test.sh
      - name: pr-overlap.sh syntax check
        run: bash -n scripts/pr-overlap.sh
      - name: pr-overlap.test.sh syntax check
        run: bash -n scripts/pr-overlap.test.sh
      - name: a failed gh call must HOLD and print no map
        run: bash scripts/pr-overlap.test.sh

  # ── COMPOSE-SMOKE DISPATCHER (task-d6c8da73955e4820) ───────────────────────
  # compose-smoke.yml decides smoke=true|false from a hand-written grep over the
  # changed-file set. That predicate was anchored to the repo root plus ^api/,
  # while the job it gates runs env-census over BOTH runtime roots. So the gate
  # censused cloud/ and no cloud/ change could start it — present, and blind to
  # half its own subject.
  #
  # The harness EXTRACTS the predicate from compose-smoke.yml rather than
  # copying it, and re-derives the census's roots from env-census.py's own
  # --root choices, so a third root or a re-narrowed filter reds by name.
  compose-smoke-dispatcher:
    needs: [changes]
    if: needs.changes.outputs.compose-smoke-dispatcher == 'true'
    name: compose-smoke dispatcher covers the census roots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: harness syntax check
        run: bash -n scripts/compose-smoke-dispatch.test.sh
      - name: the dispatcher can fire on every root the census reads
        run: bash scripts/compose-smoke-dispatch.test.sh
      # GREEN-ARM CAUSE ATTRIBUTION (task-98b3df6eab045a78, PR #16509). The
      # harness ships a fake `docker` on PATH, so it needs no daemon and no
      # image build. It refuses to pass vacuously: 27 unconditional cases with
      # an internal count floor of 22, and its mutation proof asserts the
      # anchor matched exactly three times before it can read as a catch.
      - name: Syntax-check the green-arm cause harness
        run: bash -n scripts/compose-smoke.test.sh
      - name: Green-arm cause attribution
        run: bash scripts/compose-smoke.test.sh
  # ── WORKFLOW TRIGGER COVERAGE (task-8556d43c305b2747) ──────────────────────
  # A path filter alternative that matches nothing can never fire, and the
  # workflow still reads as gated. twoslash.yml gated on apps/docs/** — zero of
  # 10,490 files — while the docs app is js/docs/. The repo already recorded
  # that the path was fictional and nobody changed the filter.
  #
  # Clean-tree, not never-worse: this was the ONLY dead alternative across 630
  # globs in 58 workflows, so there is no debt to grandfather and no baseline
  # that can rot. If it ever reds, a filter really is pointing at nothing.
  workflow-trigger-coverage:
    needs: [changes]
    if: needs.changes.outputs.workflow-trigger-coverage == 'true'
    name: every workflow path filter matches something
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: subject syntax check
        run: bash -n scripts/workflow-trigger-coverage.sh
      - name: harness syntax check
        run: bash -n scripts/workflow-trigger-coverage.test.sh
      - name: prove the check can lose (hermetic, synthetic trees)
        run: bash scripts/workflow-trigger-coverage.test.sh
      - name: no declared path alternative is dead
        run: bash scripts/workflow-trigger-coverage.sh

  # ── DISPATCHER SELFTEST ──────────────────────────────────────────────────
  # The `changes` job above partitions this workflow's paths list per harness.
  # Two lists that must agree and nothing making them is the defect class this
  # whole file keeps finding in other workflows, so the partition is guarded:
  # every roster row is a verbatim workflow-level entry (SUBSET), every
  # workflow-level entry has a row (UNION == list), every job except `changes`
  # is gated on its own output and has an output to be gated on, and the
  # dispatcher body itself is EXTRACTED and RUN over mktemp git fixtures —
  # push, empty diff, the measured router.ex case, the unresolvable base — with
  # the unresolvable-base refusal proven load-bearing by mutation. Gated on its
  # own inputs like every other job here; this file is in every set.
  dispatch-selftest:
    name: shell-harnesses dispatcher partition + fixture matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.dispatch-selftest == 'true'
    steps:
      - uses: actions/checkout@v4
        # DEFAULT depth. The harness reads this file from the working tree and
        # builds every git fixture under mktemp.
      - name: python3 + PyYAML are present (the workflow is yaml-PARSED, not grepped)
        run: |
          command -v python3 >/dev/null || {
            echo "python3 missing on the runner image" >&2
            exit 1
          }
          python3 -c 'import yaml' 2>/dev/null || pip3 install --quiet pyyaml
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"
      - name: harness syntax check
        run: bash -n scripts/shell-harnesses-dispatch.test.sh
      - name: partition invariants + dispatcher fixture matrix (incl. mutation arm)
        run: bash scripts/shell-harnesses-dispatch.test.sh

  orphan-harnesses:
    needs: [changes]
    if: needs.changes.outputs.orphan-harnesses == 'true'
    # ORPHAN SWEEP III (task-8780f3b465edea5b). Three harnesses that no workflow
    # executed, each RUN before being wired rather than wired on inspection —
    # the row that filed this asked for exactly that, and two of its own guesses
    # were wrong: local-update.test.sh was recorded as "exceeded a 90 s cap, NOT
    # verified" (it is 0 s, 18/18) and pdf-efficiency-proof.test.sh as a
    # "live-journey harness" out of budget (it is hermetic — a python3 stub on
    # 127.0.0.1 — and 1 s, 22/22).
    #
    # The last step runs the GATE, not its selftest. That is the point of the
    # tenant: scripts/refute-on-absence-capture-log-check.sh appears in no
    # workflow, no Makefile and no script, yet
    # api/test/barkpark/tenancy/auth_principal_kind_test.exs:45 says it "pins the
    # combination". A PIN NOTHING RUNS IS NOT A PIN. This makes the sentence
    # true for edits to the gate itself; making it true for edits to api/test/**
    # needs a step in elixir.yml beside unreachable-assert-message-check.sh
    # (elixir.yml:940), which is the api lane's call, not this one's.
    name: orphan harnesses (local-update · pdf-efficiency-proof · refute-on-absence)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: "local-update.test.sh (measured 0 s / 18 assertions)"
        run: bash scripts/local-update.test.sh

      - name: "pdf-efficiency-proof.test.sh (measured 1 s / 22 assertions, hermetic stub)"
        run: bash scripts/pdf-efficiency-proof.test.sh

      - name: "refute-on-absence-capture-log-check.test.sh (measured 4 s / 9 arms)"
        run: bash scripts/refute-on-absence-capture-log-check.test.sh

      - name: "the GATE itself, over the real api/test tree"
        run: bash scripts/refute-on-absence-capture-log-check.sh

  which-gates:
    needs: [changes]
    if: needs.changes.outputs.which-gates == 'true'
    # THE GATE-LIST DERIVER (task-cb42bf8ab0539891). which-gates.sh answers
    # "which CI gates does this change dispatch?" by SHELLING the very
    # `*-path-escape-check.sh --match` primitives the dispatchers shell, and it
    # discovers those call sites by scanning .github/workflows/*.yml. Both
    # halves rot if nothing runs them: a renamed primitive, a rewritten
    # dispatcher, or a new `--match` call site all change its answer, and the
    # measured failure it exists to prevent (#16608: two REQUIRED contexts red
    # because the gate list came from the LANE, not the workflows) returns the
    # day it starts lying quietly.
    #
    # Harness FIRST, subject second — the harness's case 4 renames a primitive
    # away in a scratch copy of the tree and requires a CANNOT READ line and a
    # non-zero exit, so the subject step below cannot pass by swallowing a
    # missing primitive as `false`.
    name: which-gates.sh gate-list deriver
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: which-gates.sh syntax check
        run: bash -n scripts/which-gates.sh

      - name: "which-gates.test.sh (both file sets + the renamed-primitive mutation)"
        run: bash scripts/which-gates.test.sh


  selftest-wiring-census:
    needs: [changes]
    if: needs.changes.outputs.selftest-wiring-census == 'true'
    # THE DURABLE ARM (task-8780f3b465edea5b c0/c1): every scripts/ self-test is
    # executed by CI or carries a machine-readable exemption, and a harness added
    # tomorrow with neither reds HERE rather than accumulating in silence. The
    # census resolves execution over four routes (direct, glob, a wired parent's
    # --selftest, an ExUnit door) because the hand-run basename grep that filed
    # this row was wrong in BOTH directions — the script's own header carries the
    # list of faults.
    name: selftest wiring census
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The selftest FIRST: it plants an unlisted, unexempted harness in a
      # scratch copy and requires the census to red and to name it, then adds
      # the exemption marker and requires green. A census that cannot lose would
      # pass the step below over any tree at all.
      - name: Prove the census can fail (--selftest)
        run: bash scripts/selftest-wiring-census.sh --selftest

      - name: The census over this tree
        run: bash scripts/selftest-wiring-census.sh --list

  deploy-receipt-honesty:
    needs: [changes]
    if: needs.changes.outputs.deploy-receipt-honesty == 'true'
    name: deploy receipts descend from a measurement (or refuse)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: the three subjects parse
        run: |
          bash -n Makefile 2>/dev/null || true
          bash -n .githooks/post-merge
          bash -n scripts/deploy-rebuild.sh
      - name: deploy-receipt-failure.test.sh syntax check
        run: bash -n scripts/deploy-receipt-failure.test.sh
      - name: "make deploy / post-merge / deploy-rebuild.sh receipt matrix (hermetic: stub PATH, no network, no build, no service)"
        # 54 checks, ~2s. POLARITY: every assertion names a REFUSAL or a
        # measured green, so this matrix is RED against the pre-repair sources
        # (35 of 54 failed there, the build-fail and migrate-fail arms being the
        # controls green in both directions) and GREEN against the repair.
        # It is also the tripwire for the impurity it closed: deploy-rebuild.sh
        # prepends /usr/local/go/bin to PATH, and on a runner with Go installed
        # the pre-repair script reached a REAL `make wasm` around the stubs —
        # four arms assert the escape log is empty.
        run: bash scripts/deploy-receipt-failure.test.sh
