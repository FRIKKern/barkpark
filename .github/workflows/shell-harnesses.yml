  deploy-convergence:
    needs: [changes]
    if: needs.changes.outputs.deploy-convergence == 'true'
    name: deploy-convergence-check.sh ancestry + strand matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: deploy-convergence-check.sh syntax check
        run: bash -n scripts/deploy-convergence-check.sh
      - name: the real deploy.yml still yields BOTH per-target filters
        # The script derives relevance from deploy.yml rather than copying it —
        # the whole defect class here is two lists that must agree and nothing
        # making them. That derivation is silent when it breaks: an empty filter
        # would make every box read converged for free. `filters` prints what it
        # derived and exits 2 when a set is empty, so a rename inside the
        # `changes` job reds on the PR that does it rather than months later.
        run: bash scripts/deploy-convergence-check.sh filters
      - name: ancestry beats wall clock, and a real strand still reds
        # 11 cases over real git repos in mktemp — no network, no gh, no box, so
        # it cannot rot into a skip. The load-bearing pair is 6 and 7: 6 proves
        # the not-yet-owed guard suppresses a merge-race false red, 7 proves that
        # same guard did NOT blind the instrument to a strand that is genuinely
        # owed. A guard with only the first half trades a false positive for a
        # false negative, which on this axis means a silent stale production.
        run: bash scripts/deploy-convergence-check.sh --selftest
      - name: the convergence job CONCLUDES on its verdict (task-103b5cc5ec4a8ccd)
        # 20 cases: `adjudicate` in both directions (stranded+nothing-coming
        # reds, stranded+in-flight stays green) and the deploy.yml wiring
        # EXTRACTED by a YAML parser — B6 asserts the check step's LAST
        # statement exits the adjudicated rc, and B7 proves B6 loses on the
        # pre-fix `exit 0`. deploy.yml is in this job's paths for that reason.
        run: bash scripts/deploy-convergence-check.test.sh

  # ── DEPLOY STARVATION (task-8e5eae5c71635a5e) ──────────────────────────────
  # deploy-convergence above answers "did the box end up on the right commit?".
  # This one answers the question upstream of it: can a queued deploy REACH a
  # runner at all? Measured 2026-09-02 — one concurrency group for every push,
  # so each merge evicted the pending run and the survivor was re-queued at the
  # BACK of a 390-run FIFO. Six consecutive push runs were cancelled before
  # starting and production sat 1.5 h behind main, with nothing red anywhere:
  # a cancelled-before-start run reports no failure to report.
  deploy-concurrency:
    needs: [changes]
    if: needs.changes.outputs.deploy-concurrency == 'true'
    name: a queued deploy or main gate run cannot be evicted (per-sha groups + already-covered exit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        # DEFAULT depth. Every git object this harness needs it creates itself,
        # in a throwaway repo under mktemp.
      - name: python3 + PyYAML are present (both subjects are yaml-PARSED, not grepped)
        # Same idiom as the doc-gates parity job below: INSTALL rather than
        # demand. Whether the runner image ships PyYAML is an image fact, and a
        # red reading `ModuleNotFoundError: yaml` teaches nothing about this
        # repo. A missing python3 stays a hard, named failure.
        run: |
          command -v python3 >/dev/null || {
            echo "python3 missing on the runner image" >&2
            exit 1
          }
          python3 -c 'import yaml' 2>/dev/null || pip3 install --quiet pyyaml
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"
      - name: deploy-concurrency-check.sh syntax check
        run: bash -n scripts/deploy-concurrency-check.sh
      - name: deploy-concurrency-check.test.sh syntax check
        run: bash -n scripts/deploy-concurrency-check.test.sh
      - name: the gate can still LOSE (16 cases incl. the verbatim pre-fix stanza)
        # The harness drives the gate END-TO-END on exit codes, not scan text,
        # and its part B EXTRACTS the `changes` job's detect step from the real
        # deploy.yml and dry-runs it over planted shas with a stubbed `gh`. Both
        # halves refuse rather than pass when they cannot measure: an
        # unsubstituted `${{ }}` left in the extracted body, a missing
        # already-covered arm, or zero cases run are all exit 2. Disarming the
        # arm in a scratch copy took it to 14 passed / 2 FAILED.
        run: bash scripts/deploy-concurrency-check.test.sh
      - name: then the live deploy.yml stanza itself
        # Harness FIRST, subject second — the house selftest-first idiom. A gate
        # that has lost the ability to fail must red before its green is read.
        run: bash scripts/deploy-concurrency-check.sh
      # The same eviction shape on the MAIN runs of the gate workflows
      # (task-b04364c216f877e6): 37 of 40 main elixir runs since 10:27Z on
      # 2026-09-02 were cancelled by the next merge. Per-sha group on main.
      #
      # Harness FIRST, subject second. The selftest matters more here than it
      # looks: this gate USED to read a hardcoded two-file corpus and reported
      # "2 workflow(s) keep one group per main sha" while go-tests.yml carried
      # the pre-fix stanza on main (13 of its last 20 main runs cancelled). It
      # now DISCOVERS its corpus, and the selftest is what proves the discovery
      # still reds on a workflow nobody added to a list.
      - name: the main-run gate can still LOSE (discovery, both directions)
        run: bash scripts/main-run-concurrency-check.sh --selftest
      - name: every main-triggered workflow keeps one group per main sha
        run: bash scripts/main-run-concurrency-check.sh

  console-path-ratchet:
    needs: [changes]
    if: needs.changes.outputs.console-path-ratchet == 'true'
    name: console-path-escape-check.sh classification matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: console-path-escape-check.sh syntax check
        run: bash -n scripts/console-path-escape-check.sh
      - name: console path classification + console-harness.yml skip-shim invariants
        # Its four appearances in console-harness.yml and elixir.yml are all
        # COMMENTS — mention is not execution. The cloud and elixir siblings are
        # deliberately absent from this file: they are already REACHED by a wired
        # parent's --selftest (cloud.yml:175, elixir.yml:241), and wiring them
        # twice would buy a second runner for the same assertions.
        run: bash scripts/console-path-escape-check.test.sh

