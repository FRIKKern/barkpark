      # THIS: FOR A FAMILY WHOSE MEMBERSHIP IS A PREDICATE, THE GLOB IS THE
      # HONEST ENTRY AND THE ENUMERATION IS THE DISHONEST ONE — an enumeration
      # is a snapshot of the corpus on the day it was written, a glob is the
      # rule the corpus is actually defined by, and the next scripts/pds-*.sh
      # file is covered by the rule and missed by the snapshot.
