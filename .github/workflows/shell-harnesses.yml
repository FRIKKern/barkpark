permissions:
  contents: read

concurrency:
  # main-collapse: harness-ok — publishes no context in
  # .github/required-checks.json, performs no action, watches nothing.
  # task-e376642d6d69fa3f; the long form is in
  # scripts/main-run-concurrency-check.sh, § THE MAIN-COLLAPSE MARKER.
  #
  # Every main push shares ONE group. GitHub holds at most one pending plus one
  # running run per group, so each merge evicts only the PENDING intermediate —
  # the newest sha always holds that slot, and a RUNNING main run always
  # completes (cancel-in-progress keeps the never-cancel-main guard; D12 is not
  # waived here). The queue therefore holds at most one run of this workflow
  # instead of one per merge; main-push runs were 40%->52%->67%->57% of the
  # whole Actions queue across four samples on 2026-09-06, in front of every PR
  # run. THE RESIDUAL: an intermediate sha gets no verdict from this workflow.
  # Sound only because no job name here appears in .github/required-checks.json —
  # for a context that spec DOES list, or
  # anything that deploys/releases/renews/watches, the marker is REFUSED by
  # scripts/main-run-concurrency-check.sh, which re-derives both facts.
  #
  # PRs are unchanged: their own per-ref group, and they still supersede.
  #
  # THE DISPATCH LANE (task-bd8bd3dbff7b75aa). A workflow_dispatch run gets its
  # own group keyed by run_id, so it is NEVER the pending run a main push
  # evicts. Without this branch a manual run on main lands in the shared
  # `-main` slot and the next merge cancels it while it waits — the operator
  # asks for a verdict and gets `cancelled`, which is the exact hole this
  # trigger exists to close. It costs one run's worth of runners, not one per
  # merge, so the collapse's queue saving is untouched. cancel-in-progress is
  # unchanged and still the VERBATIM never-cancel-main guard (a dispatch on
  # main evaluates it false and so is never cancelled either); the marker's
  # collapsed shape `'refs/heads/main' && 'main'` is still present verbatim,
  # which is what scripts/main-run-concurrency-check.sh re-derives.
  group: shell-harnesses-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || (github.ref == 'refs/heads/main' && 'main' || github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  changes:
    # THE DISPATCHER. No `if:`, no path filter — it runs on every event this
    # workflow fires for, so every job behind it always has a defined answer.
    # Same shape as security.yml's `changes` job, and the same polarity: it
    # NEVER emits a silent false. An unresolvable base, a base with no common
    # ancestor, or a missing base sha FAILS the job; an empty diff dispatches
    # TRUE for everything; a push (or any non-pull_request event) dispatches
    # TRUE for everything. A dispatcher that "couldn't tell" and said false
    # would skip a harness and publish a green check run over nothing.
    #
    # WHY IT EXISTS, measured on PR #15631 (head cbbe4a63, three files, all
    # under cloud/lib/): 55 check runs, 28 of them from this workflow, because
    # the workflow-level `paths:` is an OR over the inputs of every harness and
    # cloud/lib/barkpark_cloud/web/router.ex is in it for ONE job
    # (cloud-static-gz). All 28 ran; 27 measured nothing and held runners the
    # required gates were queued behind. The workflow-level list stays as it
    # is — it decides whether the RUN starts — and this job decides which
    # harness inside the run has a reason to.
    #
    # THE ROSTER below is the per-job partition of that same list: one row per
    # (job, path), every path a verbatim entry of on.pull_request.paths, and
    # this workflow file itself in every set by construction. Two invariants
    # are enforced by scripts/shell-harnesses-dispatch.test.sh on every PR that
    # touches either file: each job's rows are a SUBSET of the workflow-level
    # list, and the UNION of all rows EQUALS it — so a path added above without
    # a row here (a harness that would never fire) reds, and so does a row here
    # that names a path the workflow does not even trigger on.
    name: Dispatch (shell-harness paths)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # THE TWO OUTPUTS THE COLLAPSE ADDED. `matrix` is the leg list the
      # `harness` job fans out over; `any` exists because an EMPTY matrix does
      # not skip a job, it DELETES it — a job that renders no check run at all
      # is indistinguishable from a workflow that never started, so the
      # zero-selection case is gated into an explicit skip instead.
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
      task-dup-sweep: ${{ steps.sets.outputs.task-dup-sweep }}
      node-test-floor: ${{ steps.sets.outputs.node-test-floor }}
      doctor-matrix: ${{ steps.sets.outputs.doctor-matrix }}
      merge-verb-table: ${{ steps.sets.outputs.merge-verb-table }}
      release-scan-verdict: ${{ steps.sets.outputs.release-scan-verdict }}
      release-curator-draft-guard: ${{ steps.sets.outputs.release-curator-draft-guard }}
      zero-criteria-census: ${{ steps.sets.outputs.zero-criteria-census }}
      webhook-fanout-guard: ${{ steps.sets.outputs.webhook-fanout-guard }}
      seal-run-guard: ${{ steps.sets.outputs.seal-run-guard }}
      registration-sample-bar: ${{ steps.sets.outputs.registration-sample-bar }}
      deploy-convergence: ${{ steps.sets.outputs.deploy-convergence }}
      deploy-concurrency: ${{ steps.sets.outputs.deploy-concurrency }}
      console-path-ratchet: ${{ steps.sets.outputs.console-path-ratchet }}
      console-harness-pin: ${{ steps.sets.outputs.console-harness-pin }}
      console-refusal-capture: ${{ steps.sets.outputs.console-refusal-capture }}
      weekly-changelog-backfill-guard: ${{ steps.sets.outputs.weekly-changelog-backfill-guard }}
      pds-harnesses: ${{ steps.sets.outputs.pds-harnesses }}
      ci-failure-issue-filer: ${{ steps.sets.outputs.ci-failure-issue-filer }}
      distribution-harnesses: ${{ steps.sets.outputs.distribution-harnesses }}
      tooling-harnesses: ${{ steps.sets.outputs.tooling-harnesses }}
      launcher-boot-selftest: ${{ steps.sets.outputs.launcher-boot-selftest }}
      workflow-portability: ${{ steps.sets.outputs.workflow-portability }}
      breaker-measure-precondition: ${{ steps.sets.outputs.breaker-measure-precondition }}
      exit-runner-guard: ${{ steps.sets.outputs.exit-runner-guard }}
      cloud-static-gz: ${{ steps.sets.outputs.cloud-static-gz }}
      pds-hetzner-offline: ${{ steps.sets.outputs.pds-hetzner-offline }}
      task-lease-renew: ${{ steps.sets.outputs.task-lease-renew }}
      merge-sweep-review-hold: ${{ steps.sets.outputs.merge-sweep-review-hold }}
      landed-mark: ${{ steps.sets.outputs.landed-mark }}
      doc-gates-paths-parity: ${{ steps.sets.outputs.doc-gates-paths-parity }}
      merge-gate-bridge: ${{ steps.sets.outputs.merge-gate-bridge }}
      fleet-coordination-harnesses: ${{ steps.sets.outputs.fleet-coordination-harnesses }}
      principal-gate-harnesses: ${{ steps.sets.outputs.principal-gate-harnesses }}
      compose-smoke-dispatcher: ${{ steps.sets.outputs.compose-smoke-dispatcher }}
      workflow-trigger-coverage: ${{ steps.sets.outputs.workflow-trigger-coverage }}
      undispatched-target: ${{ steps.sets.outputs.undispatched-target }}
      orphan-harnesses: ${{ steps.sets.outputs.orphan-harnesses }}
      selftest-wiring-census: ${{ steps.sets.outputs.selftest-wiring-census }}
      registry-impact-check: ${{ steps.sets.outputs.registry-impact-check }}
      claim-health: ${{ steps.sets.outputs.claim-health }}
      exit-laundering-sweep: ${{ steps.sets.outputs.exit-laundering-sweep }}
      dispatch-selftest: ${{ steps.sets.outputs.dispatch-selftest }}
      deploy-receipt-honesty: ${{ steps.sets.outputs.deploy-receipt-honesty }}
      which-gates: ${{ steps.sets.outputs.which-gates }}
      workflow-owner: ${{ steps.sets.outputs.workflow-owner }}
      bp-curl: ${{ steps.sets.outputs.bp-curl }}
      migration-version-collision: ${{ steps.sets.outputs.migration-version-collision }}
      orchestrate-launch-recipe: ${{ steps.sets.outputs.orchestrate-launch-recipe }}
      sunset-route-consumers: ${{ steps.sets.outputs.sunset-route-consumers }}
      mix-test-strict: ${{ steps.sets.outputs.mix-test-strict }}
      main-workflow-rollup: ${{ steps.sets.outputs.main-workflow-rollup }}
      scheduled-arm-health: ${{ steps.sets.outputs.scheduled-arm-health }}
      place-directory-install: ${{ steps.sets.outputs.place-directory-install }}
      scratchpad-reaper: ${{ steps.sets.outputs.scratchpad-reaper }}
      echo-json-parse: ${{ steps.sets.outputs.echo-json-parse }}
    steps:
      - uses: actions/checkout@v4
        with:
          # THE PR HEAD, not the merge ref. Without `ref:` checkout lands on
          # refs/pull/N/merge, which already contains main's advance, while
          # pull_request.base.sha LAGS the base tip — the three-dot diff then
          # sweeps in everything main gained and the skip never fires.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history: the three-dot diff needs the merge base, and the PR
          # base sha must resolve locally. A shallow checkout makes
          # `git cat-file -e` miss it, which the step below treats as a hard
          # failure, never as "nothing changed".
          fetch-depth: 0
          # `filter: blob:none` — a BLOBLESS partial clone, and it is NOT
          # shallowness. It fetches every commit and every tree and omits only
          # blob CONTENTS; `git cat-file -e <base>^{commit}`, `git merge-base`
          # and `git diff --name-only` read commits and trees, so this job's
          # verdict is bit-identical. `fetch-depth: 0` above STAYS: drop it and
          # actions/checkout falls back to depth 1, which has no merge base
          # whether blobless or not. Equivalence is provable, not asserted:
          #     bash scripts/dispatch-blobless-proof.sh
          # MEASURED on merged head b71d22875b (2026-09-17): this checkout step
          # took 36s here, while the already-blobless dispatchers on the
          # same head (elixir/cloud/ci/console/compose) took 13-15s.
          filter: blob:none

      - id: sets
        name: Compute the changed-path set per harness
        # THE BODY IS A FILE, NOT A SCALAR (task-ca50ed283930706a). It used to
        # live here, roster and all, and it carried the two `${{ }}` values
        # below inline. That made GitHub compile the WHOLE scalar into ONE
        # expression and measure it against the 21000-character max expression
        # length: at 19968 bytes on main it sat 32 bytes under
        # scripts/workflow-run-block-length-check.sh's 20000 fail floor, and
        # over GitHub's cap the failure is a STARTUP FAILURE with ZERO jobs —
        # every harness in this file dark at once, invisible to every local
        # YAML gate because the file is valid YAML (#19291, 2026-09-18).
        #
        # The roster is a partition that grows every wave, so the cap had
        # started deciding dispatch policy: #19227, #19291 and #19317 each
        # traded per-file rows for globs to stay under it, and #19446 BACKED
        # OUT two rows it needed (98 bytes against 32 available). Passing the
        # two GitHub values as `env:` leaves this scalar a LITERAL — no `${{`,
        # so the expression parser never sees it — and the roster can grow.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # THE ABSENT-FILE FALLBACK (task-ecb7fc56b5868bfc). The checkout above is
        # the PR HEAD; the workflow FILE comes from the merge ref. So a head
        # whose merge base predates befc8cbbf — the commit that created this
        # script — carries the new `run:` line and NOT the script:
        # `bash: scripts/shell-harness-dispatch.sh: No such file or directory`,
        # exit 127. And because this job feeds the matrix, the failure is not a
        # red leg, it is NO LEG AT ALL: every harness check run is ABSENT, which
        # reads exactly like "nothing to run". MEASURED on run 35517160933 job
        # 106094923976 (head 1badf9dc5, 42 open PRs affected at 18:35Z).
        # So: the head's OWN copy when it has one — a PR that edits the
        # dispatcher must test its edit — else the base branch's copy.
        run: |
          set -euo pipefail
          src=scripts/shell-harness-dispatch.sh
          if [ -f "$src" ]; then
            echo "dispatcher: HEAD copy ($src)"
          else
            base="${GITHUB_BASE_REF:-main}"
            echo "dispatcher: this head has no $src (it predates befc8cbbf) — running origin/$base's copy"
            src="$RUNNER_TEMP/shell-harness-dispatch.sh"
            git show "origin/$base:scripts/shell-harness-dispatch.sh" >"$src" || {
              git fetch --depth=1 origin "$base"
              git show "FETCH_HEAD:scripts/shell-harness-dispatch.sh" >"$src"
            }
          fi
          bash "$src"
      - name: Emit the harness matrix
        id: matrix
        # The verdicts the step above wrote are read back as ONE object rather
        # than re-derived, so the matrix cannot disagree with the outputs the
        # roster guard checks. scripts/shell-harness-matrix.py REFUSES (exit 2)
        # if any leg in .github/shell-harness-legs.json got no verdict — a leg
        # silently dropped from dispatch is the failure this collapse could
        # introduce, and it is the one thing an empty matrix would hide.
        env:
          SELECTION: ${{ toJSON(steps.sets.outputs) }}
        # Same absent-file fallback as the step above, for the same reason: a
        # head that predates this script would exit 127 here and delete the
        # matrix just as silently.
        run: |
          set -euo pipefail
          src=scripts/shell-harness-matrix.py
          if [ -f "$src" ]; then
            echo "matrix: HEAD copy ($src)"
          else
            base="${GITHUB_BASE_REF:-main}"
            echo "matrix: this head has no $src — running origin/$base's copy"
            src="$RUNNER_TEMP/shell-harness-matrix.py"
            git show "origin/$base:scripts/shell-harness-matrix.py" >"$src" || {
              git fetch --depth=1 origin "$base"
              git show "FETCH_HEAD:scripts/shell-harness-matrix.py" >"$src"
            }
          fi
          python3 "$src" "$SELECTION" >> "$GITHUB_OUTPUT"

  # ── THE HARNESS MATRIX ───────────────────────────────────────────────────────
  # 53 sibling jobs, each gated by one uniform
  # `if: needs.changes.outputs.<slug> == 'true'`, collapsed into ONE matrix job.
  #
  # WHAT IT BUYS, measured. GitHub renders a check run for a job it SKIPS, so
  # the old shape published 54 names on every head that started this workflow —
  # and on a head whose diff hit a broad path all 53 BOOTED. PR #18915:
  # 0 skipped / 54 success, 09:02:10Z -> 09:17:21Z, more real runner compute than
  # all four REQUIRED workflows combined, while PR #18922 on the same day ran
  # 47 skipped / 7 success off the same file. A matrix leg that is not in the
  # matrix renders NOTHING, so N selected harnesses now cost N+1 check-run
  # names, not 54.
  #
  # THE NAMES DID NOT MOVE, and that is the load-bearing claim. An explicit
  # `name:` on a matrix job is rendered VERBATIM — GitHub appends the `(leg)`
  # suffix only to a matrix job that has no name of its own — so every one of
  # the 53 names is byte-identical to what its sibling job published.
  # `.github/shell-harness-check-runs.txt` is the committed set and
  # `scripts/shell-harness-name-census.sh --compare-file` proves the workflow
  # still publishes exactly it, offline, on a shallow checkout, in the
  # `dispatch-selftest` leg of this very workflow.
  #
  # WHAT IS NOT REQUIRED HERE: .github/required-checks.json requires exactly
  # Cloud gate / Console gate / Elixir gate / PR references an active task.
  # This workflow publishes none of them and is upstream `needs:` of none, so a
  # name that stops rendering here cannot deadlock main. Checked, not assumed.
  #
  # ARM SEMANTICS ARE PRESERVED BY scripts/shell-harness-run.sh, not by luck.
  # Each old job's `run:` steps carried
  # `if: ${{ !cancelled() && steps.setup.outcome == 'success' }}`: every arm ran
  # even after an earlier arm failed. The runner reproduces that exactly — each
  # arm under its own `bash`, statuses OR-ed, every failing arm named — where a
  # naive `set -e` over the same commands would stop at the first red and hide
  # the rest.
  harness:
    needs: [changes]
    # `any`, and not a comparison against the matrix JSON: see the dispatcher's
    # outputs above for why an empty matrix must never reach this job.
    if: needs.changes.outputs.any == 'true'
    # WHERE THE LEG NAMES COME FROM, for scripts/required-checks-generate.sh.
    # A `name:` that is nothing but `${{ … }}` can only become the regex `^.+$`,
    # and that generator refuses such a template outright — a pattern matching
    # every rendered name would hand this job's provenance to other workflows'
    # checks. This line is the finite answer: the 53 rendered names are the
    # `name` field of every leg in the committed legs file, so the generator
    # expands ONE index row per literal name instead of one wildcard row. Take
    # this comment away and the generator refuses again, by design.
    # required-checks: matrix-name-legs .github/shell-harness-legs.json .[].name
    name: ${{ matrix.leg.name }}
    strategy:
      # fail-fast would CANCEL sibling harnesses on the first red, inverting the
      # old shape: 53 independent jobs never cancelled one another, and a
      # cancelled harness reports nothing and reads as "did not run".
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.leg.timeout }}
    steps:
      - uses: actions/checkout@v4
        id: setup
        with:
          # Per-leg, because five legs genuinely need a full clone (they build
          # fixture repos and diff against a real merge-base) and the rest do
          # not. Carried as data in .github/shell-harness-legs.json.
          fetch-depth: ${{ matrix.leg.fetch_depth }}
      - uses: actions/setup-node@v4
        id: node
        if: ${{ matrix.leg.node != '' }}
        with:
          node-version: ${{ matrix.leg.node }}
      - name: harness arms
        # steps.node.outcome is 'skipped' for every leg that declares no node,
        # so this admits them; it excludes only a node setup that actually FAILED.
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.node.outcome != 'failure' }}
        env:
          LEG: ${{ matrix.leg.slug }}
        run: bash scripts/shell-harness-run.sh "$LEG"
