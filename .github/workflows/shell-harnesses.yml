          deploy-receipt-honesty Makefile
          deploy-receipt-honesty .githooks/post-merge
          deploy-receipt-honesty scripts/deploy-rebuild.sh
          '
          self=".github/workflows/shell-harnesses.yml"

          refuse() {
            echo "::error::dispatcher: $1"
            exit 1
          }

          # The job list is DERIVED from the roster, in first-appearance order,
          # so a job cannot be dispatched without at least one row.
          jobs="$(printf '%s\n' "$roster" | awk 'NF { print $1 }' | awk '!seen[$0]++')"
          [ -n "$jobs" ] || refuse "the roster is empty — nothing to dispatch."

          emit_all() {
            for j in $jobs; do
              echo "${j}=$1" >> "$GITHUB_OUTPUT"
            done
            echo "verdict: every harness=$1"
          }

          event="${{ github.event_name }}"
          if [ "$event" != "pull_request" ]; then
            # push-to-main (and anything else): NEVER skip. Main is what every
            # PR is compared against and there is no reviewer left to notice a
            # partial main.
            echo "event '$event' is not a pull_request — every harness set is true."
            emit_all true
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          [ -n "$base" ] || refuse "the PR carries no base sha. Refusing to guess — a guessed base skips harnesses and reports green."

          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            # Absent during burst merges. Try once, then give up LOUDLY.
            git fetch --no-tags --quiet origin "$base" 2>/dev/null || true
          fi
          git cat-file -e "${base}^{commit}" 2>/dev/null || refuse "PR base sha ${base} is not resolvable in this checkout. Refusing to emit a path verdict from an unknown base." # MUT: unresolvable-base

          # No common ancestor makes the three-dot diff exit 128 with a raw
          # `fatal:` and no annotation. Name it, and refuse a two-dot fallback,
          # which sweeps in the base's ENTIRE content and dispatches true for
          # the wrong reason.
          git merge-base "$base" HEAD >/dev/null 2>&1 || refuse "PR base ${base} and HEAD share NO common ancestor, so the three-dot diff is undefined. Rebase the branch onto its base branch."

          echo "diff base: ${base} (three-dot against HEAD)"
          # `-z` + `--no-renames` are both load-bearing (measured in
          # security.yml): plain --name-only QUOTES odd paths so they miss the
          # match, and rename detection prints only the destination.
          changed="$(git -c core.quotepath=false diff -z --name-only --no-renames "${base}...HEAD" | tr '\0' '\n')"
          echo "changed files:"
          printf '%s\n' "$changed"

          if [ -z "$changed" ]; then
            # RARE BUT LEGAL: a revert pair or a branch-sync PR nets to nothing.
            # Run everything: expensive, never wrong. Never false.
            echo "::warning::dispatcher: the changed-file set is EMPTY against ${base}. Dispatching every harness rather than skipping any — a skip here would green a check nothing measured."
            emit_all true
            exit 0
          fi

          hits=" "
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ "$f" = "$self" ]; then
              # This file is in EVERY set: an edit to the roster, the gating or
              # a step changes what every harness means.
              echo "$f changed — every harness set is true."
              emit_all true
              exit 0
            fi
            while read -r job pat; do
              [ -n "$job" ] || continue
              # The roster entry IS a glob (cloud/priv/static/**, *.yml) and
              # must match as one; quoting it would match literally. SC2254.
              # shellcheck disable=SC2254
              case "$f" in
                $pat)
                  case "$hits" in
                    *" $job "*) ;;
                    *) hits="${hits}${job} " ;;
                  esac
                  ;;
              esac
            done <<EOF
          $roster
          EOF
          done <<EOF
          $changed
          EOF

          for j in $jobs; do
            case "$hits" in
              *" $j "*) v=true ;;
              *) v=false ;;
            esac
            echo "verdict: ${j}=${v}"
            echo "${j}=${v}" >> "$GITHUB_OUTPUT"
          done
  node-test-floor:
    needs: [changes]
    if: needs.changes.outputs.node-test-floor == 'true'
    name: node-test-floor.mjs mutation matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        # fs.globSync needs node >= 22; the runner refuses BY NAME below that
        # rather than throwing a TypeError that reads like a bug in the suite.
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node-test-floor.test.sh syntax check
        run: bash -n scripts/node-test-floor.test.sh
      - name: "node-test-floor mutation matrix (hermetic mktemp fixtures, no network)"
        # Thirty-eight assertions; the ones that matter prove the runner can
        # FAIL: a zero-match pattern, a file registering zero tests (node
        # reports that file as `# tests 1` -- the FILE counted as its own
        # passing test, which defeats a naive tests>0 floor and defeated the
        # first version of this one), a missing path beside a real one, a
        # forwarded --test-reporter, a suite that SHRANK below its committed
        # `--floor N` literal, and the per-file TAP blocks staying whole and in
        # FILE order under the pool. The shrink pair is the load-bearing one:
        # case 8 runs a gutted tree WITHOUT a floor and asserts GREEN, case 10
        # runs the same shape WITH one and asserts RED, so the only variable is
        # the literal -- every other assertion this runner makes is derived from
        # the tree it measures and therefore agrees with a gutted tree. The
        # ordering case is not decoration either: streaming the pool instead of
        # buffering keeps the SUM correct while scrambling the order, so a
        # position-keyed consumer breaks silently -- verified by mutation.
        run: bash scripts/node-test-floor.test.sh
  doctor-matrix:
    needs: [changes]
    if: needs.changes.outputs.doctor-matrix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The harness builds fixture repos and diffs merge-base(bp, origin/main);
          # nothing here reaches the real origin/main, but a full checkout keeps
          # git operations unsurprising (no shallow-clone edge cases).
          fetch-depth: 0
      - name: doctor.sh syntax check
        run: bash -n scripts/doctor.sh
      - name: doctor.sh section-2 verdict matrix
        run: bash scripts/doctor.test.sh

  merge-verb-table:
    needs: [changes]
    if: needs.changes.outputs.merge-verb-table == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: bp-merge.sh syntax check
        run: bash -n scripts/bp-merge.sh
      - name: bp-merge refusal-string table (captured fixtures, no live GitHub)
        run: bash scripts/bp-merge.test.sh
      - name: required-checks-verify selftest (every clause mutation-proven)
        # The merge verb's pre-flight IS this script, so its own selftest rides
