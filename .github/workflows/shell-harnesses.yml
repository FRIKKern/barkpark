name: Shell harnesses

# Runs the repo's behavioral shell harnesses (scripts/*.test.sh) that no other
# CI lane executes — a zero-`run:`-hit gap confirmed repo-wide. First tenant:
# scripts/doctor.test.sh, the 8-cell verdict matrix for scripts/doctor.sh
# section 2 (installed-bp staleness). doctor.sh false-greened TWICE in one week
# (regex #5935, then compare-target) — a patch without a harness is how this
# file regresses, so the harness rides its own required lane.
#
# Second tenant: scripts/bp-merge.test.sh, the refusal-string table behind the
# fleet's merge verb (honest-gates D54). GitHub owns those strings; the day one
# changes, the table must red HERE rather than mis-classify a blocked PR in a
# builder's terminal. It runs the classifier over CAPTURED fixtures — no token,
# no network — so it cannot rot into a skip. The paths list below is EXPLICIT
# per file: D26's finding was that a `pr-task-gate.sh` edit did not even trigger
# this workflow, so every script a job here executes gets its own entry.
#
# D26 HAS EXACTLY ONE AMENDED EXCEPTION, and it is stated where it applies (the
# pds-* block in the pull_request list): for a family whose membership is a
# PREDICATE rather than a list, the glob is the honest entry, because an
# enumeration is a snapshot and the corpus is a rule. That exception is earned
# by arm B2 of scripts/shell-harnesses-dispatch.test.sh, which re-derives the
# corpus from the tree and reds if any member is untriggered or unrostered. It
# is NOT a budget: the 21000-char expression cap that used to force globs here
# stopped applying when the dispatcher body moved to
# scripts/shell-harness-dispatch.sh (task-ca50ed283930706a).
#
# Third tenant: scripts/release-scan.test.sh, the verdict-derivation matrix for
# scripts/release-scan.sh — the one machine reader of CI state the
# release-curation agent trusts. NOTHING in .github/workflows/** invoked
# release-scan.sh at all before this: no syntax check, no test, no caller, while
# it classified advisory jobs by a NAME REGEX and counted `cancelled` as
# failure. Same lesson as doctor.sh — an unguarded reader drifts silently.
#
# Fourth tenant: scripts/epic-zero-criteria-census.sh, which had ZERO callers of
# ANY kind — six repo-wide grep hits, every one inside the script itself. No
# workflow, no Makefile target, no hook: break the census outright and nothing
# reds. Only its `--self-test` rides this lane, and the split is deliberate.
# `--self-test` is hermetic (mktemp fixtures through an in-script python3
# classifier, 26 named assertions over 9 arms, no bp, no network). The census's LIVE
# ratchet shells `bp task get`, and `bp` is not on GitHub runners — it would
# print `UNKNOWN: bp is not on PATH` and exit 2 on every PR forever, so it is
# deliberately NOT wired here. Note this workflow is NOT one of main's required
# contexts (those are exactly: Elixir gate, PR references an active task, Cloud
# gate, Console gate) — wiring the census makes it RUN, not BLOCK.
#
# Fifth tenant: scripts/webhook-fanout-watch.test.sh, the mutation matrix for
# scripts/webhook-fanout-watch.sh — the LEVEL check over live `site-autodeploy-*`
# webhook rows. `Registry.content_webhook_types/1` fails OPEN (a blank doc_type
# yields `[]`, the box's match-everything sentinel), so a single edit re-arms the
# fan-out the 2026-08-07 repair closed and nothing re-asserts it. Only the
# HERMETIC half rides here: fixtures through the classifier, no `bp`, no network,
# so it cannot rot into a skip. The LIVE verdict is a runbook command plus a
# named open human gate (a control-plane read token, unarmed) — wiring a
# scheduled live job today would exit 3 on every run forever, which is a watch
# that can only lose. NOT a Cloud tenant: the script is deliberately absent from
# cloud-path-escape-check.sh's CLOUD_PATHS (see that file, lines 115-127, on why
# widening the set publishes green contexts over jobs that never ran).
#
# ── Sixth through thirteenth tenants: the ORPHAN SWEEP (deploy-reliability W30)
# A census of all 32 behavioural shell harnesses on origin/main found exactly 16
# that NO workflow executes — over a thousand mutation assertions guarding
# nothing between waves. `scripts/seal-run.sh` and its harness did not appear in
# any of the 48 workflow files at all: the runner itself was uninvoked, not just
# its test. The proof that this is not theoretical: #11082 widened CLOUD_PATHS
# with `internal/**`, which silently invalidated
# `scripts/registration-sample.test.sh` (40 pass / 3 fail on origin/main, green
# on the parent commit) and NOTHING reported it. That harness is fixed and wired
# in the same change, and the two ratchets it delegates classification to are in
# the paths list below. Be exact about what that buys: the next path-set edit
# RE-RUNS this lane on the PR that makes it, and the harness's expectations are
# DERIVED from those ratchets, so a reclassification MOVES the derived numbers
# rather than rotting into stale literals. It is not a promise of a red —
# deriving is precisely what stops a reclassification from redding. Measured by
# planted narrowing (`internal/**` deleted from CLOUD_PATHS, semantically
# verified): 60 pass / 0 fail, with the derived assertion text tracking the edit.
# The lane REDS only when an edit leaves the fixture's classification coverage
# UNEXERCISED, and each boundary is asserted by name: no NEITHER-shape qualifier
# left among the control's qualifying heads ("the shape clause is UNEXERCISED"),
# no BOTH-shape head ("path classification is not being exercised"), or a
# plant-B reshape the ratchets no longer score zero-NEITHER ("plant B's reshape
# has decayed"). Re-running on the edit is what beats rotting in silence; the
# red is a narrower event with those three named triggers.
#
# MENTION IS NOT EXECUTION, and absence of mention is not proof of orphanhood.
# `console-path-escape-check.test.sh` appears four times across
# console-harness.yml and elixir.yml and every one is a COMMENT — it is wired
# here. `cloud-path-escape-check.test.sh` and `elixir-path-escape-check.test.sh`
# are already REACHED by a wired parent's `--selftest` (cloud.yml:175,
# elixir.yml:241) and are deliberately NOT duplicated here.
#
# Two harnesses read OTHER workflow files as fixtures — seal-run.test.sh copies
# `.github/workflows/cloud.yml` plus the real seal predicate into its e2e
# fixture, and console-path-escape-check.test.sh extracts and executes
# console-harness.yml's own skip-shim steps. Both are in the paths list, so this
# lane runs on edits to them. That is deliberately wider than "the script and its
# test": an input that can break a harness must be able to trigger it.
#
# A further tenant (deploy-reliability W35): the 96-assertion
# mutation matrix behind scripts/deploy-reliability-exit-run.sh — the exit
# artefact's headline instrument, the one thing that re-derives the epic's
# never-covered number on demand. `grep -rln deploy-reliability-exit-run
# .github/` returned NOTHING before this: 96 assertions that neutralise each
# refusal guard by its `# MUT:` anchor and watch the refusal disappear were a
# document, not a gate, so an edit to the runner broke them in silence.
# crown-reconcile.test.sh, the comparable instrument, is gated twice. The harness
# is fixture-driven and offline — `git init` repos in mktemp, a stub producer, a
# `--depth 1` file:// clone for the shallow case, git identity passed with
# `git -c` so a runner without a configured user still commits — so no secret and
# no network is involved. The last four paths entries are INPUTS, not the
# harness: its closing probes bind the runner's printed 90s cap and flag set to
# the real client and census command, and the artefact's own invariants to
# check-doc-budgets.sh. An input that can break a harness must be able to trigger
# it (same reason cloud.yml is in this list for seal-run). Default checkout depth
# is deliberate: the one probe that wants `origin/main` (seal-run byte identity)
# refuses to fake a verdict when the ref is unresolvable and says so by name.
#
# The honest limit, stated once for every tenant here: this workflow is NOT
# one of main's required contexts (those are exactly: Elixir gate, PR references
# an active task, Cloud gate, Console gate). Wiring makes a harness RUN, not
# BLOCK. Running is the prerequisite; registering is a separate, evidence-gated
# decision that scripts/registration-sample.sh exists to adjudicate.

on:
  # MANUAL LANE (task-bd8bd3dbff7b75aa). An operator can produce a COMPLETED
  # harness verdict on main on demand. This is the answer to the residual the
  # concurrency comment below names: main pushes share one group, so an
  # intermediate sha's run is evicted while pending and main's harness state is
  # ABSENT, not green. Before this trigger existed `gh workflow run
  # shell-harnesses.yml --ref main` returned HTTP 422 and there was no way to
  # ask for one. workflow_dispatch takes NO `paths:` filter (GitHub does not
  # accept one on this event), so the twin on.pull_request.paths /
  # on.push.paths lists below stay set-equal — adding this trigger adds no path.
  # The `changes` dispatcher already handles it: its `event != pull_request`
  # arm dispatches TRUE for every harness set, so a dispatched run measures
  # everything, exactly like a push.
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/doctor.sh"
      - "scripts/doctor.test.sh"
      # doctor.sh section 2 sources its staleness ladder from this library,
      # and scripts/local-update.sh — the FIXER doctor points at — calls the
      # same function. An edit here can flip BOTH harnesses below, so it must
      # be able to trigger this workflow.
      - "scripts/lib/bp-staleness.sh"
      # TASK DUP SWEEP (task-a8eec40f9ae36364). The fixture is a SUBJECT, not an
      # input: its 243 frozen rows and its pinned ledger IDF table ARE the
      # calibration, so an edit there changes what the known pairs score without
      # touching the script.
      - "scripts/task-dup-sweep.mjs"
      - "scripts/fixtures/task-dup-sweep-selftest.json"
      # DEPLOY CONVERGENCE (task-0c3069135d1b4bfd). The last entry is an INPUT,
      # not the harness: the check reads deploy.yml's own on.push.paths and the
      # `changes` job's per-target filters rather than copying them, so an edit
      # to that workflow can invalidate this matrix without touching the script.
      - "scripts/deploy-convergence-check.sh"
      - "scripts/deploy-convergence-check.test.sh"
      # DEPLOY STARVATION (task-8e5eae5c71635a5e). Same INPUT relationship:
      # the concurrency gate reads deploy.yml's own stanza and its harness
      # EXTRACTS the changes/f step body, so an edit to that workflow can
      # invalidate this matrix without touching either script.
      - "scripts/deploy-concurrency-check.sh"
      - "scripts/deploy-concurrency-check.test.sh"
      - "scripts/main-run-concurrency-check.sh"
      - "scripts/deploy-supersede-exit.sh"
      - "scripts/deploy-supersede-exit.test.sh"
      - ".github/workflows/deploy.yml"
      - "scripts/bp-merge.sh"
      - "scripts/bp-merge.test.sh"
      # MERGE-CHECK (task-73d2dc0989787be9, 2026-09-17). Its `--selftest` had NO
      # caller of any kind — no workflow, no Makefile target — while it carried
      # the arm that let #18497 merge under a live `hold` label. It rides the
      # merge-verb job because it is the same claim read by the same operators:
      # merge-check prints the verdict, bp-merge.sh acts on it, and the two must
      # not disagree about what a hold is.
      - "scripts/merge-check.sh"
      - "scripts/required-checks-verify.sh"
      - "scripts/release-scan.sh"
      - "scripts/release-scan.test.sh"
      # RELEASE CURATOR DRAFT (task-f2bdc01d54559e1a c2, orchestrator ruling
      # 2026-09-13T08:10Z). scripts/release-curator-draft.sh is the job body of
      # .github/workflows/release-curator-draft.yml, and its harness reads THAT
      # WORKFLOW FILE as a fixture (the static arm parses its `on:` keys and
      # step bodies) — which is why the dispatcher roster below gives this job
      # a `.github/workflows/*.yml` row as well.
      - "scripts/release-curator-draft.sh"
      - "scripts/release-curator-draft.test.sh"
      - ".github/workflows/release-curator-draft.yml"
      - "scripts/epic-zero-criteria-census.sh"
      - "scripts/ledger-epic-roster.sh"
      - "scripts/webhook-fanout-watch.sh"
      - "scripts/webhook-fanout-watch.test.sh"
      # ORPHAN SWEEP (W30). Per file, never a directory glob — D26.
      - "scripts/seal-run.sh"
      - "scripts/seal-run.test.sh"
      - "cloud/priv/static/__preview__/seal-predicate.mjs"
      - ".github/workflows/cloud.yml"
      - "scripts/registration-sample.sh"
      - "scripts/registration-sample.test.sh"
      - "scripts/lib/check-runs.sh"
      - "scripts/lib/check-runs.test.sh"
      - "scripts/cloud-path-escape-check.sh"
      - "scripts/console-path-escape-check.sh"
      - "scripts/console-path-escape-check.test.sh"
      - ".github/workflows/console-harness.yml"
      # THE LOCAL GATE'S PIN (task-561ac06ea4ebb607). console-harness.sh
      # READS the test-count pin out of console-harness.yml instead of
      # carrying a second literal that can drift from CI's. The .yml is
      # already an entry above as the ratchet's subject; these two are the
      # SCRIPT and its harness, so an edit to either re-runs the pair.
      - "scripts/console-harness.sh"
      - "scripts/console-harness-pin.test.sh"
      # THE CLOUD/CONSOLE AGGREGATOR SHAPE RATCHET
      # (cch-w11-bl-aggregator-decide-shape-ratchet). It reads all THREE
      # aggregator workflows — cloud.yml and console-harness.yml as subjects,
      # elixir.yml as the reference `decide()` — so an edit to ANY of the three
      # must run it. cloud.yml is already an entry above (seal-run-guard);
      # elixir.yml is not, and is added here.
      - "scripts/cloud-console-gate-shape.test.sh"
      - ".github/workflows/elixir.yml"
      # CONSOLE REFUSAL CAPTURE (task-1cea7edd271d588b). The SUBJECT, not the
      # harness: scripts/console-refusal-capture.test.mjs is already reached by
      # the `scripts/*.test.mjs` entry below, but an edit to the capture module
      # it imports could invalidate the 9 controls without touching the test.
      - "scripts/console-refusal-capture.mjs"
      # ── THE FENCE ITSELF, AS THREE GLOBS (task-ea44d7b4a12eaf38) ──────────
      # The two entries above are the harness and the module it imports. They
      # are NOT what breaks this check. The test's DERIVED arms enumerate a
      # POPULATION from the tree — scripts/console-refusal-capture.mjs's
      # FENCE_GLOBS, which is literally
      #     cloud/priv/static/*.mjs
      #     cloud/priv/static/__preview__/*.mjs
      #     scripts/console-*.mjs
      # — and red when a file with an exit-2 path lands in it and no manifest
      # row names it. That red therefore belongs to the PR that ADDED the file,
      # and until now it could not reach one: the leg dispatched on the harness
      # and the module only, so #19654 (which added
      # cloud/priv/static/__preview__/accent-role-separation.mjs) ran none of
      # these 13 tests, merged clean, and reddened MAIN'S TIP for 18h24m until
      # a THIRD row (task-3f76bb5b8bcc15f8) closed the same instance again.
      #
      # THIS IS THE D26 AMENDED EXCEPTION, not a convenience glob. The fence is
      # a PREDICATE, not a list: the file whose arrival this check exists to
      # catch does not exist yet, so an enumeration of today's 28 emitters would
      # go dark on exactly the PR that matters. The three globs below are a
      # verbatim transcription of FENCE_GLOBS, so the trigger and the corpus are
      # the same set BY CONSTRUCTION, and the derived arms themselves red if the
      # two ever disagree.
      #
      # THE FIRST TWO WIDEN NOTHING AT THE WORKFLOW LEVEL: `cloud/priv/static/**`
      # is already an entry (the cloud-static-gz guard), so these are strict
      # subsets of a trigger that already fires. They exist so the per-leg
      # dispatcher in scripts/shell-harness-dispatch.sh can name them under
      # clause A (a roster row must be a verbatim entry here) WITHOUT billing
      # this leg for every app.js / app.css / image edit under that directory.
      - "cloud/priv/static/*.mjs"
      - "cloud/priv/static/__preview__/*.mjs"
      # The third DOES add one file to the workflow-level trigger —
      # scripts/console-tdz-order-check.mjs, the only scripts/console-*.mjs not
      # already listed (the capture module above and console-slice-gate.mjs are
      # both entries). MEASURED over the last 500 first-parent commits of
      # origin/main: ZERO touched it.
      - "scripts/console-*.mjs"
      - "scripts/pds-ledger-census.sh"
      - "scripts/pds-ledger-census_test.sh"
      - "scripts/pds-record-parity.sh"
      - "scripts/pds-record-parity.test.sh"
      - "scripts/pds-secret-scan.sh"
      - "scripts/pds-secret-scan_test.sh"
      # THE TWO PURE-TREE INPUTS OF THE D-NUMBER ARBITER (task-6fd11672fdeefd0b).
      # `--check-alloc` reads the charter AND the reservation ledger; `--axis a`
      # reads the charter AND this checkout's git log. An edit to either FILE can
      # flip either verdict without touching a single script, so both are inputs
      # of the pds-harnesses job in exactly the way scripts/pds-record-parity.sh is.
      - ".claude/workflows/bp-pds-charter.md"
      - "tooling/pds/d-number-reservations.tsv"
      # THE DEPLOY CHARTER'S ARBITER INPUTS (task-8f908f721d054032). Exactly the
      # same three-file shape as the PDS rows above, for the SECOND charter the
      # one arbiter now serves. `deploy/d-number-arbiter.sh --check-alloc` reads
      # .claude/workflows/bp-deploy-reliability-charter.md AND
      # deploy/d-number-reservations.tsv; the wrapper itself is the third input
      # because it binds WHICH two (three variable bindings, no logic), so an
      # edit there can flip the verdict without touching either data file.
      # MEASURED, AND NARROWER THAN THE FILING SAID. The row that produced this
      # (and D616's own "WHAT IS NOT DONE HERE") states the charter "appears in
      # no workflow path filter anywhere". IT DOES NOT: doc-gates.yml matches it
      # on BOTH `**/*.md` and `.claude/workflows/**`, on both the pull_request
      # and push arms, and pr-task-gate.yml / task-lease-renew.yml are unfiltered
      # entirely. Re-measured against origin/main's .github/workflows by
      # translating each `paths:` list to a regex -- doc-gates fired there too.
      # WHAT WAS ACTUALLY TRUE, and is the defect this fixes: no workflow ran the
      # ARBITER, and shell-harnesses.yml -- the one workflow that owns
      # scripts/pds-record-parity.sh -- did not trigger on the charter at all.
      # A guard that does not watch the file it guards is not a guard; a charter
      # watched only by the doc-budget lane is not watched by its own arbiter.
      - ".claude/workflows/bp-deploy-reliability-charter.md"
      - "deploy/d-number-reservations.tsv"
      - "deploy/d-number-arbiter.sh"
      # AXIS D'S CORPUS. `--axis d` resolves every PDS-D literal carried in the
      # PDS scripts against the charter, so ANY of them is an input: the PR that
      # produced this axis edited only scripts/pds-secret-scan.sh, which was not
      # on this list and therefore ran no pds-harnesses job at all. A guard whose
      # corpus cannot trigger it is a guard that watches the wrong PRs.
      - "scripts/pds-*.sh"
      - "tooling/pds/**"
      - "scripts/pds-scratch-target.sh"
      - "scripts/pds-scratch-target_test.sh"
      - "scripts/pds-read-preflight-audit.sh"
      - "scripts/pds-read-preflight-audit_test.sh"
      # BUDGET-LITERAL MOVE GUARD (pds-bl-w49-budget-literal-moved-by-its-own-pr).
      # BOTH files, and the guard itself is the load-bearing half: its WATCHED
      # roster and its extractors live in the guard, so an edit there can void
      # every arm of the harness without touching the harness. A filter that
      # listed only the _test.sh would let exactly that edit skip this job.
      - "scripts/pds-threshold-move-guard.sh"
      - "scripts/pds-threshold-move-guard_test.sh"
      - "scripts/pds-crown-stamp.sh"
      # THE COLD-READER SMOKE (pds-bl-personal-local-doc-staleness). Its
      # --dry-run arm resolves eleven LITERAL anchors in the setup guide, so an
      # edit to the DOC can red it without touching a line of shell — the doc is
      # an INPUT of this job exactly as bp-pds-charter.md is above.
      - "scripts/pds-personal-local-smoke_test.sh"
      - "docs/setup/personal-local.md"
      - "scripts/file-ci-failure-issue.sh"
      - "scripts/file-ci-failure-issue.test.sh"
      - "scripts/install-cli.sh"
      - "scripts/install-cli.test.sh"
      - "scripts/fetch-prebuilt.sh"
      - "scripts/fetch-prebuilt.test.sh"
      - "scripts/deploy-rebuild.sh"
      - "scripts/deploy-rebuild.test.sh"
      - "deploy/site-runtime-install.sh"
      - "deploy/site-runtime-install_test.sh"
      - "tooling/task-obsession/reland_check.py"
      - "tooling/task-obsession/reland_check.test.sh"
      - "tooling/task-obsession/reland_fetch.py"
      - "tooling/task-obsession/reland_workflow_sim.py"
      - "tooling/task-obsession/reland_loudfail.test.sh"
      - "tooling/task-obsession/fixtures/*.json"
      - ".github/workflows/reland-check.yml"
      - "scripts/relandcheck-diff-producer.test.sh"
      # The go-tests dispatcher's ratchet-absence guard (task-1ea38e8e7fe44e09).
      # go-path-escape-check.test.sh EXTRACTS the ratchet step out of go-tests.yml
      # and executes it, so all three files are its inputs.
      - ".github/workflows/go-tests.yml"
      - "scripts/go-path-escape-check.sh"
      - "scripts/go-path-escape-check.test.sh"
      # which-gates.sh DISCOVERS the `--match` dispatch call sites by scanning
      # .github/workflows/*.yml and then SHELLS the primitives it found, so the
      # primitives and the workflows that dispatch on them are its inputs — and
      # those are already entries above (cloud.yml, console-harness.yml,
      # go-tests.yml, the four *-path-escape-check.sh). Only the two new files
      # need naming (task-cb42bf8ab0539891).
      - "scripts/which-gates.sh"
      - "scripts/which-gates.test.sh"
      # bp-curl (task-ca8fffa7ca885413): the ONE 429 backoff every shell/CI curl
      # consumer of the BP API sources. Its harness runs a fake loopback server.
      - "scripts/lib/bp-curl.sh"
      - "scripts/lib/bp-curl.test.sh"
      # MIGRATION VERSION COLLISION (task-ac34d17c2aba4458). Detector A needs no
      # database, so it rides here; the Cloud gate runs the same script with
      # --require-db before `mix test`. cloud.yml is already a path entry above
      # (seal-run), and it is an INPUT here too: the harness's contract is that
      # the gate step exists, so an edit there must be able to red this lane.
      - "scripts/migration-version-collision-check.sh"
      # MAIN WORKFLOW ROLL-UP (task-b4aa15924d214156). The roll-up whose roster
      # is the TREE, not a watched set: every .github/workflows/ file, its
      # newest completed conclusion on main, and REQUIRED vs ADVISORY derived
      # from .github/required-checks.json. The last entry is an INPUT, not the
      # harness: the harness reads the committed spec live to prove the four
      # required contexts label their four workflows and that no context name
      # is spelled out in the script body, so a spec edit can invalidate this
      # matrix without touching either script.
      - "scripts/main-workflow-rollup.sh"
      - "scripts/main-workflow-rollup.test.sh"
      - ".github/required-checks.json"
      # SCHEDULED ARM HEALTH (task-2c762aa7dfca5bd8). The never-succeeded /
      # staleness reader over every cron'd workflow in the tree, taken with
      # `event=schedule` — the split that stops a push-green arm from vouching
      # for a scheduled arm that has never once worked. The workflow file is an
      # INPUT, not the harness: it is the subject that carried 47 consecutive
      # scheduled failures, and an edit to its cron or its job conditions must be
      # able to re-run this pair.
      - "scripts/scheduled-arm-health.sh"
      - "scripts/scheduled-arm-health.test.sh"
      - ".github/workflows/studio-journey-smoke.yml"
      # task-5ddbd0702c213aec: which-gates.test.sh cases 6-8 build their scratch
      # trees out of the Elixir census that greps the Go package AND out of the
      # package itself, then mutate both. Same rule as seal-run.test.sh above —
      # an input that can break a harness must be able to trigger it — so a
      # census rename, a pin rename, or a Go edit that leaves the harness with
      # no derived anchor reds HERE instead of rotting between waves.
      - "cloud/test/barkpark_cloud/payload_key_set_census_test.exs"
      - "internal/cloudclient/**"
      - "scripts/main-red-breaker.sh"
      - "scripts/main-red-breaker.test.sh"
      - "scripts/main-red-breaker.runner-local.json"
      - "scripts/breaker-capture.sh"
      - "scripts/stale-tree-regression-check.sh"
      - "scripts/stale-tree-ci-wiring.test.sh"
      - "scripts/breaker-step-names-drift.test.sh"
      - ".github/workflows/required-checks-drift.yml"
      - ".github/workflows/security.yml"
      - ".github/workflows/go-format.yml"
      - "tooling/fleet/fleet-run.sh"
      - "tooling/fleet/fleet-run-verdict-test.sh"
      - "tooling/fleet/spend-aggregate.py"
      - "tooling/fleet/spend-aggregate.test.sh"
