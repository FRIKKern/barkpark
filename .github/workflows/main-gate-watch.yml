# main-gate-watch — the second scream. It reds for as long as main's TIP does
# not carry a green verdict on every post-merge-reproducible required context,
# and it reds just as loudly when the tip carries NO verdict at all.
#
# WHY THIS EXISTS AT ALL
#
# main's required `Cloud gate` was `failure` across three consecutive commits
# with clean PRs blocked behind it, and nothing in this repo said so: zero
# `workflow_run` triggers across all 40 workflows, zero notification egress in
# CI, zero check-run consumers in cloud/lib or internal/, and `gh run list`
# laundering a job-level red into a run-level `success`. Of the 15 main commits
# in the window before it, TWELVE concluded `cancelled` — 3 red / 12 UNMEASURED
# / 0 green. This workflow is the level trigger that keeps asking.
#
# WHY THERE IS NO continue-on-error ANYWHERE IN THIS FILE
#
# Job-level `continue-on-error: true` still renders a RED check run, but it
# launders the WORKFLOW RUN to success — and the run conclusion is what
# notifications, `gh run list` and the rollup read. A scream nobody is paged for
# is not a scream. This run fails. (Same argument, verbatim in spirit, as
# breakglass-watch.yml, which this file is modelled on.)
#
# WHY A SCHEDULE AND NOT `workflow_run`
#
# `workflow_run` is an EDGE trigger tied to one upstream workflow: it fires when
# THAT workflow finishes and is silent about a workflow that never ran — which
# is precisely the `cancelled`/MISSING case that dominates the measurement. A
# tip left without a verdict needs a LEVEL trigger. Residual, stated rather than
# papered over: a ~30-minute observation window, silence during an Actions
# outage, and GitHub's 60-day auto-disable of scheduled workflows in an inactive
# repo.
#
# THAT RESIDUAL WAS REAL, IT FIRED, AND IT IS NOW FIXED (wave 61)
#
# Wave 60 predicted the shape wrongly: it said a young tip would carry ZERO rows
# and proposed an age threshold. What actually happened, on the */30 arm, is
# PARTIAL rows. Scheduled run 31312071143 (2026-08-09T11:57:21Z) red on tip
# 2e72d2948 with `MISSING Elixir gate` while `Cloud gate` and `Console gate` were
# both green: the tip was 5m02s old and carried THIRTY-SIX check-run rows. The
# `elixir` run on it (31311871968) was created 11:52:33Z, went terminal only at
# 11:59:07Z, and had produced NO JOBS (`/jobs` -> total_count: 0), so no
# `Elixir gate` row could exist yet.
#
# THE DISCRIMINATOR IS THE RUN STATUS, NOT THE AGE. scripts/main-gate-watch.sh
# now reads a third authority, `actions/runs?head_sha=<tip>`: an absent required
# row while ANY run on the tip is not `completed` is WAITING (exit 2); an absent
# row with every run terminal stays MISSING (exit 1), so the never-judged sha
# a5260f609 (all 9 runs completed) screams exactly as before. It is threshold-
# free, so it cannot go stale. An age threshold was measured and REJECTED: over
# 51 simulated */30 ticks, a 28m grace leaves 35 ticks judged but SEVEN of the 17
# distinct tips a tick landed on judged NEVER, because a newer commit supersedes
# them first — it trades a false red for a never-measured tip. Proofs live in
# scripts/main-gate-watch.test.sh §3b/§3c/§3d. Owner:
# cchi-w61-main-gate-watch-missing-conflates-young-tip.
#
# WHY ITS NAME CAN NEVER ENTER THE REQUIRED SET
#
# This job reads two GitHub endpoints. Requiring an API-reading check gates every
# merge on GitHub's availability, which this repo refuses. Two independent
# structural guards, belt and braces: the watch job carries
# `if: github.event_name != 'pull_request'` so the name never renders on a PR
# head the required-checks generator samples, and the pull_request trigger below
# is paths-filtered besides (generator stage S4).

name: main-gate-watch

on:
  schedule:
    # Declared every 30 minutes. DELIVERED every 2.1-4.7 HOURS: measured
    # 2026-09-05T07:48Z..2026-09-06T08:02Z over 14 consecutive scheduled runs
    # (33953540483 .. 34020746620), never once at the declared cadence. This is
    # GitHub's cron delivery for this repo, not queueing under load — the
    # sibling .github/workflows/task-lease-renew.yml measured the same 2-5 h on
    # 2026-09-03 for its */20 arm. So a verdict here is 2-5 h stale by
    # construction, and "the schedule did not fire" is NOT this workflow being
    # broken. What to do with a stale verdict: read the newest COMPLETED run on
    # the newest sha (gh run list --workflow main-gate-watch.yml --limit 1), or
    # fire workflow_dispatch; do NOT add a push: arm — see below. A bare number
    # re-rots: if you re-measure, replace the figures AND the date.
    - cron: "*/30 * * * *"
  workflow_dispatch:
  # THERE IS NO `push:` TRIGGER, AND ADDING ONE IS A REGRESSION (wave 60, D721).
  # It fired ~15-20s after a merge, when GitHub had created NO check-run rows on
  # the new tip at all. WAITING (exit 2) is keyed on the `.status` of an EXISTING
  # row, so an empty payload falls through to MISSING — exit 1 by construction.
  # Production record: 2 of 2 push runs FAILED on tip 026c5b1d78 (MISSING x3)
  # while main was in fact green; the byte-identical script on the SAME sha 36
  # minutes later printed ok/ok/ok, rc=0. The schedule arm IS the trigger, and the
  # header above already accepts a multi-hour verdict lag (measured 2.1-4.7 h;
  # the lease-renew sibling compensates with push: because ITS job is safe on an
  # empty payload — this one is not, for the reason stated in this paragraph).
  # `scripts/main-gate-watch.test.sh` §11 reds if a push: trigger comes back, and
  # §3b carries the empty-payload fixture — which since wave 61 reports WAITING
  # while a run on the tip is in flight, and MISSING once every run is terminal.
  pull_request:
    # Deliberately narrow: this trigger exists ONLY so the harness below is not
    # orphaned. Being paths-filtered also keeps every name in this file out of
    # the required set (generator stage S4).
    paths:
      - "scripts/main-gate-watch.sh"
      - "scripts/main-gate-watch.test.sh"
      - "scripts/main-gate-watch-route.sh"
      - "scripts/main-verdict-presence.sh"
      - "scripts/main-verdict-presence.test.sh"
      - ".github/main-push-workflows.txt"
      - ".github/workflows/main-gate-watch.yml"

permissions:
  contents: read
  checks: read
  # `actions: read` is what lets the watch read the WORKFLOW RUNS on the tip
  # (repos/<repo>/actions/runs?head_sha=…) — the authority that separates "no
  # check-run row has been created YET" from "this commit was never judged".
  # Without it that read 403s and the watch reds as a CONFIGURATION FAULT rather
  # than guessing, which is correct but useless: grant it.
  actions: read
  # NOTE, and it is load-bearing: `administration` is NOT a scope the workflow
  # `permissions:` key accepts — naming it makes GitHub reject the whole file
  # and the workflow NEVER RUNS. So GITHUB_TOKEN cannot read branch protection
  # (that read needs repo-admin scope) and will 403. The watch derives its
  # required set LIVE from protection on purpose — reading the committed spec
  # would go stale against the live rule with nobody the wiser — so it runs with
  # `secrets.BREAKGLASS_TOKEN` when present and falls back to `github.token`.
  # If that secret is removed, rotated or revoked, the fallback keeps the job
  # RUNNABLE and it then reds on every scheduled run on the protection read (exit 3).
  # That red is the honest state of a watch that cannot read what it watches. It
  # is not a false alarm to silence, and the fix is to restore the secret, never
  # to soften the classification.

concurrency:
  group: main-gate-watch-${{ github.ref }}
  # NEVER a literal `true`: on the main ref (schedule and workflow_dispatch both
  # run there) that self-cancels the watch dark — which is the exact failure mode
  # (a collapsed run leaving no verdict) this workflow was built to report.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ══ TWO JOBS, BECAUSE THERE ARE TWO FAILURE CLASSES ════════════════════════
  #
  # cch-w59-bl-main-gate-watch-has-no-notification-egress, residual 1. Until this
  # split, ONE step of ONE job named `Main gate watch` mapped BOTH rc 1 ("main's
  # tip is not green") and rc 3 ("this watch could not read branch protection")
  # to `exit 1`. Those are different facts with different owners, and a fleet
  # that sees the second often enough learns to read the first as noise.
  #
  # Now: `main-gate-watch-fault` runs the watch and owns rc 3 (and any rc the
  # script does not define). `main-gate-watch` owns rc 0/1/2 and is SKIPPED on a
  # fault — skipped, never green, because "this watch has no authority" must not
  # render as "main is fine". The workflow RUN still fails on a fault (the fault
  # job carries the red), so nothing here is a `|| true`: the split changes WHICH
  # NAME screams, never WHETHER one does.
  #
  # The rc→outcome table is scripts/main-gate-watch-route.sh, not a `case` inline
  # here, for one reason: a routing table living in a `run:` block cannot be
  # driven offline. scripts/main-gate-watch.test.sh §14 runs that script once per
  # (role, rc) pair and asserts exactly which role reds — the forced-both-ways
  # proof this residual asks for, with no GitHub in the loop.
  #
  # ACCEPTED COST, STATED RATHER THAN HIDDEN: the control-plane convergence step
  # rides the `main-gate-watch` job, so a tick that ends in a CONFIGURATION FAULT
  # makes no control-plane observation. A fault is a red that must be fixed, not
  # a steady state, and the observation resumes on the next tick.
  main-gate-watch-fault:
    name: Main gate watch configuration fault
    # Never on pull_request: a name that never renders on a PR head can never be
    # sampled into the required-check spec. Same fence as its two siblings, and
    # it is why this new name needs no row in .github/required-checks.json.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      # The sibling job below reads this instead of re-running the watch: a
      # second read is a second API round-trip that can disagree with the first,
      # and then the two check runs would be judging different moments.
      rc: ${{ steps.watch.outputs.rc }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The scream's own tripwire, first. If the read stops being able to fail —
      # on a RED tip AND on a tip with no verdict at all — the watch below is
      # decoration, and this run says so before it says anything about main. It
      # sits in THIS job on purpose: a tripwire that cannot lose is a fault of
      # the instrument, which is exactly this job's subject.
      - name: Prove the watch can lose both ways (main-gate-watch.test.sh)
        run: bash scripts/main-gate-watch.test.sh

      - name: Does main's tip carry a verdict?
        id: watch
        env:
          GH_TOKEN: ${{ secrets.BREAKGLASS_TOKEN || github.token }}
        run: |
          set -uo pipefail
          rc=0
          bash scripts/main-gate-watch.sh --repo "${{ github.repository }}" --branch main || rc=$?
          # Published BEFORE the routing call: the sibling job must learn the rc
          # even when this step is about to red on it.
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          bash scripts/main-gate-watch-route.sh fault "$rc"

  main-gate-watch:
    name: Main gate watch
    needs: main-gate-watch-fault
    # `always()` so a rc=1 red on the sibling (there is none by construction —
    # the fault job is green on rc 0/1/2 — but a checkout or tripwire failure
    # there also leaves rc empty) does not silently skip this job as "dependency
    # failed" without saying why. The two rc tests below are the real fence:
    #   rc == ''  -> the upstream died before publishing one. Unknown, not green.
    #   rc == '3' -> CONFIGURATION FAULT. The sibling carries that scream under
    #                its own name; this job must not render a verdict about main
    #                it does not have.
    if: >-
      always()
      && github.event_name != 'pull_request'
      && needs.main-gate-watch-fault.outputs.rc != ''
      && needs.main-gate-watch-fault.outputs.rc != '3'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The convergence step below resolves the sha the control plane SERVES,
          # which is behind main's tip whenever a deploy is late — exactly the
          # case the step exists to catch. A depth-1 clone cannot resolve it, and
          # deploy-convergence-check.sh then refuses HARNESS-UNAVAILABLE (exit 2)
          # instead of answering. Measured 2026-09-06 run 34008234523: served
          # 92c45fc17 'is not a commit in this clone' — six of eight runs since
          # 2026-09-05T07:48Z died there, alternating with green whenever the box
          # happened to serve the exact tip. deploy.yml's own convergence job
          # sets the same depth for the same reason.
          fetch-depth: 0

      # Interpretation only — the read itself happened once, in the sibling job.
      # rc 0 green, rc 1 scream, rc 2 WAITING (neither a pass nor a scream: a
      # context is still in flight, and reddening on it would false-red every
      # fresh push to main for as long as CI takes, which is how a watch gets
      # muted). rc 3 cannot arrive here — the job `if:` above excludes it — and
      # the router reds as a ROUTING ERROR if it ever does.
      - name: Is main's tip green on every watched required context?
        run: bash scripts/main-gate-watch-route.sh verdict "${{ needs.main-gate-watch-fault.outputs.rc }}"

      # ── task-6f18e71a351f8081 A: a stale control plane is a RED CHECK, not an output ──
      # deploy.yml's convergence job deliberately exits 0 and leaves the scream to
      # report-convergence-failure (an issue). The census of 2026-09-03 showed the
      # control plane 49 commits behind main for a day with every check green. This
      # step asks the live box what it serves and reds when it is STRANDED behind
      # the newest deploy-relevant commit on main. ~2 s, one curl, one git fetch.
      - name: Does the control plane serve the newest deploy-relevant main?
        if: always()
        run: |
          set -uo pipefail
          # shellcheck disable=SC1091
          . scripts/lib/bp-curl.sh   # 429 backoff, shared (task-c2f96f8121c64601)
          git fetch --no-tags --quiet origin main || { echo "::warning::could not fetch origin/main — UNCHECKED, not green"; exit 0; }
          tip="$(git rev-parse --verify --quiet FETCH_HEAD^{commit})" || tip=""
          body="$(bp_curl_body -sS --max-time 15 https://barkpark.cloud/health 2>/dev/null)" || body=""
          served="$(printf '%s' "$body" | jq -r '.git_sha // empty' 2>/dev/null)" || served=""
          if [ -z "$tip" ] || [ -z "$served" ]; then
            echo "::warning::the control plane did not say what it serves (or main was unreadable) — UNCHECKED, not green"; exit 0
          fi
          # rc captured on the same line: GitHub's default `run:` shell is
          # `bash -e {0}`, and `set -uo pipefail` does not switch -e off, so a
          # bare non-zero exit killed this step BEFORE the case below ever ran —
          # the refusal arm (exit 2) reddened the job as an unexplained failure,
          # and the same shape would have hidden a real STRANDED verdict's
          # message. Same idiom as the watch step above.
          rc=0
          bash scripts/deploy-convergence-check.sh converged --label "control plane (barkpark.cloud)" --target cp \
            --served "$served" --tip "$tip" --grace-seconds 900 || rc=$?
          case "$rc" in
            0) echo "control plane: converged (serves ${served:0:10}, main tip ${tip:0:10})" ;;
            1) echo "::error::CONTROL PLANE STRANDED — barkpark.cloud serves ${served:0:10}, main's newest deploy-relevant commit is newer (tip ${tip:0:10}). Every merge since is not in production."; exit 1 ;;
            *) echo "::warning::the convergence comparison refused — UNCHECKED, not green" ;;
          esac

  main-verdict-presence:
    name: Main verdict presence
    # task-6cd940f66125a079. The sibling job above asks whether main's tip is
    # GREEN on the four contexts branch protection names. This one asks a
    # different question that nothing in this repository asked before: did every
    # workflow whose push arm reaches main actually PUBLISH an answer on that
    # sha? A run collapsed by the next merge's cancel-in-progress publishes no
    # context at all, and an absent context is not a red one, so the sibling has
    # nothing to look at. Measured on main shas 0097c711f and 3b5d07ca6, which
    # each took five cancelled runs (go-tests among them) and raised nothing.
    #
    # This job has NO authority over any pull request and nothing waits on it:
    # it is fenced off pull_request exactly as its sibling is, so its name is
    # never sampled onto a PR head, and it is deliberately NOT in the protected
    # set — promoting a cancellable workflow into that set is the wrong remedy
    # and is refused here. spec-authority: advisory-ok — an observer of main's
    # tip that renders no PR context and blocks no merge.
    #
    # It runs as its own job rather than as a step of the sibling so the two
    # limbs are reported apart: fusing an absence report into a redness report
    # is how a true positive stays invisible.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The tripwire first: if the read has stopped being able to lose, whatever
      # it says about main below is decoration.
      - name: Prove the read can lose both ways (main-verdict-presence.test.sh)
        run: bash scripts/main-verdict-presence.test.sh

      - name: Did every workflow that guards main publish a verdict on its tip?
        env:
          GH_TOKEN: ${{ secrets.BREAKGLASS_TOKEN || github.token }}
        run: |
          set -uo pipefail
          rc=0
          bash scripts/main-verdict-presence.sh --repo "${{ github.repository }}" --branch main || rc=$?
          case "$rc" in
            0) exit 0 ;;
            1) echo "::error::MAIN'S TIP TOOK NO VERDICT from a workflow whose push arm reaches main — a cancelled, never-created or startup_failure run publishes no context, and an absent context is not a red one. Re-run the named workflows on that sha."; exit 1 ;;
            2) echo "::notice::WAITING — the tip is still being judged (a run is not terminal, or no run exists yet). Absences on it are premature; the next scheduled run decides."; exit 0 ;;
            3) echo "::error::CONFIGURATION FAULT — the main-push workflow set could not be derived, drifted from .github/main-push-workflows.txt, or the runs feed was unreadable. See scripts/main-verdict-presence.sh."; exit 1 ;;
            *) echo "::error::main-verdict-presence.sh exited $rc, which is not a verdict it defines"; exit 1 ;;
          esac

  main-gate-watch-harness:
    name: Main gate watch harness
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n scripts/main-gate-watch.sh
      - name: Shell syntax (main-gate-watch-route.sh)
        run: bash -n scripts/main-gate-watch-route.sh
      - name: Both-ways proofs (main-gate-watch.test.sh)
        run: bash scripts/main-gate-watch.test.sh
      - name: Shell syntax (main-verdict-presence.sh)
        run: bash -n scripts/main-verdict-presence.sh
      - name: Both-ways proofs (main-verdict-presence.test.sh)
        run: bash scripts/main-verdict-presence.test.sh
