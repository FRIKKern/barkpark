name: go-tests

# ADVISORY, NOT REQUIRED (recorded 2026-09-02, row pds-bl-go-tests-not-required).
# The `go vet + test` context is absent from .github/required-checks.json's
# required set and from its exclusions list, so a red here is a signal a human
# must read — it does not stop anything from landing. "Gate it on every Go
# change" below describes WHEN this runs, not what its red can do. Registration
# is deliberately sequenced (orchestrator ruling 2026-09-02), not skipped:
#   1. the PR-workflow fan-out diet (pr-meta.yml) lands, so the runner pool has
#      headroom for a fifth context on every PR;
#   2. this workflow gets a path filter with a skip-as-success shim, so a PR
#      that touches no Go reports green without consuming a runner;
#   3. ONE atomic PR adds the context to the required set with the
#      required-checks-drift guard updated in the same commit.
# Until step 3 lands, any doc or fixture that calls this context blocking is
# wrong; scripts/required-checks-generate.sh is the authority on the set.

# The Go test suite — the `bp` CLI + TUI, manifest, apiclient, pdrender, cloud
# clients, provisioner/runtime, … (170+ *_test.go files). Before this,
# `go test ./...` ran ONLY in cli-release.yml (on cli-v* tags), so a broken Go
# test or build could land on main and only surface when cutting a CLI release.
# Gate it on every Go change. `go vet` compiles every package (catching build
# breaks in the no-test cmd/* mains too) and runs the static checks; `go test
# -race` runs the suite under the data-race detector — the daemons (runtime,
# provisioner) and apiclient spawn goroutines over shared state, and CI's
# plain build would miss a race that only the detector catches. -race needs cgo
# (auto-enabled; the runner has a C toolchain) and ~2× the runtime; the suite is
# small so it stays well under a minute.

on:
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go-tests.yml"
      # Vendored-template drift tripwire: internal/provisioner/catalog/templates/**
      # is an embedded COPY of the repo-root templates/** JSON source, guarded by
      # TestEmbeddedCatalogMatchesRepoRoot. Editing the SOURCE (no .go change) must
      # run the Go suite on THIS PR so the guard catches un-synced drift (the
      # #963→#969 class). Mirrors vendored-assets.yml.
      - "templates/**"
      # Cross-surface paper-component golden fixtures (internal/pdrender/testdata/
      # *.golden.json). component_golden_test.go asserts the TUI renderer realizes
      # the committed projection; a fixture REGEN (emitter/manifest edit) can change
      # these JSON mirrors with NO .go source change, so the Go realization leg must
      # run on THIS PR to catch a TUI divergence from the new projection.
      - "internal/pdrender/testdata/**"
      # Taskboard TUI golden frames (internal/taskboard/testdata/*.txt). The
      # compose/render/glyph-budget suites assert the committed frames byte-for-byte
      # and inventory every glyph in them; a golden REGEN (or a hand-added fixture)
      # carries NO .go diff, so without this the Go suite runs on ZERO taskboard
      # fixture-only PRs — the same #963->#969-class gap the pdrender carve-out above
      # closes, which whitelisted its testdata but not the board's.
      - "internal/taskboard/testdata/**"
      # Hetzner live-proof fixtures (internal/cli/testdata/pds_live_hetzner_*.json).
      # TestPDSLiveFixturesRecordTheirOwnKindAndLength pins every harvested body to
      # the byte count its manifest records, TestPDSLiveManifestIsMachineEmitted pins
      # each body's sha256_chunked and the chain folded over all of them, and
      # scripts/pds-live-hetzner-placement-group.sh --selftest-offline re-emits the
      # manifest and diffs it against the committed one. A fixture REGEN carries NO
      # .go diff, so without this carve-out all three pins are unreachable on the very
      # PR that edits them — the same #963->#969-class gap as the carve-outs above.
      - "internal/cli/testdata/**"
      # CLI manifest fixtures (docs/cli/fixtures/*.json). The capsbrief protective
      # kit (ratio tripwire, invoke-completeness) and the mcp/tickets/cli suites all
      # pin behaviour against full-manifest.json; a fixture regen carries NO .go
      # diff, so the suite must run on THIS PR — same #963→#969-class gap as the
      # templates/** carve-out above.
      - "docs/cli/fixtures/**"
      # Cloud attention/deploy-health fixtures (cloud/priv/static/__fixtures__/*.json).
      # Six Go tests read five fixtures under this directory, so a FIXTURE-ONLY
      # edit changes what the Go suite asserts with no .go diff — and today that
      # edit runs no Go job at all (merged PR #10521 touched only cloud/ +
      # scripts/ and rendered 32 check names, none of them `go vet + test`).
      # Same #963->#969-class gap as the carve-outs above; amends charter D57,
      # which prescribed a manual workaround instead.
      - "cloud/priv/static/__fixtures__/**"
      # Scaffy census trap: scaffy/** PRs skip the Go gate, so a catalog- or
      # fixture-only edit runs NO Go job today. corpus_test.go corpus guards read
      # the catalog in place (D30) and the lint/parse/format/apply/jsassert suites
      # read the testdata fixtures, so those edits change what the Go suite asserts
      # with no .go diff — same #963->#969-class gap as the carve-outs above. Closes
      # it at the trigger. scaffy/seed/** carries main_test.go (fetch retry +
      # drift-table statuses), but every file it tests is *.go and is therefore
      # already caught by the "**/*.go" glob above — it is listed here anyway so
      # a non-.go edit under scaffy/seed (README, repair.sh, the mock fixture)
      # still runs the suite that asserts against them.
      - "scaffy/commands/**"
      - "scaffy/seed/**"
      - "internal/scaffy/testdata/**"
      # Onramp teach-block parity (docs/setup/CODEX.md, docs/setup/AGENTS-MD.md).
      # TestOnrampAgentsMdWrapperParity reads CODEX.md from DISK and asserts it
      # embeds the canonical AGENTS.md body verbatim — but an md-only edit
      # carries NO .go diff, so before this carve-out no md-triggered workflow
      # ran the Go suite and the parity gate was vacuously green on the exact
      # PRs it exists to catch (paper-excellence charter D42). Same
      # #963->#969-class gap as above.
      - "docs/setup/CODEX.md"
      - "docs/setup/AGENTS-MD.md"
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go-tests.yml"
      - "templates/**"
      - "internal/pdrender/testdata/**"
      - "internal/taskboard/testdata/**"
      # Hetzner live-proof fixtures (mirrors the push list): the byte-count,
      # sha256_chunked and --selftest-offline pins are unreachable on a
      # fixture-only PR without it.
      - "internal/cli/testdata/**"
      - "docs/cli/fixtures/**"
      - "cloud/priv/static/__fixtures__/**"
      # Scaffy census trap (mirrors the push list): catalog + testdata fixtures
      # gate the Go suite though scaffy/** PRs otherwise skip it. seed/** is now
      # INCLUDED — it has Go tests as of scaffy/seed/main_test.go.
      - "scaffy/commands/**"
      - "scaffy/seed/**"
      - "internal/scaffy/testdata/**"
      - "docs/setup/CODEX.md"
      - "docs/setup/AGENTS-MD.md"

concurrency:
  # Never cancel main (the 2026-06-10 starvation lesson); collapse superseded
  # PR runs.
  group: go-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: go vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # honors the pinned toolchain

      - name: go vet
        run: go vet ./...

      - name: go test (race detector)
        run: go test -race ./...
