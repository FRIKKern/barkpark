name: paper-editor

# Gate for the Studio rich-text editor (api/assets/paper-editor). Before
# 2026-06-23 NOTHING ran its converter round-trip smoke suite, and nothing
# checked the committed IIFE bundle (api/priv/static/assets/bp-paper-editor
# .bundle.js — the artifact the LiveView editor actually loads) for staleness.
# A source edit that wasn't rebuilt shipped a stale bundle once already
# (strike/underline round-trip was inert in Studio because convert.js changed
# but the bundle didn't). This workflow catches both classes:
#   1. convert.js round-trip regressions  -> npm run smoke
#   2. any stale Barkpark sink            -> npm run sync:barkpark:check
#   3. @portable-doc/editor package     -> npm run pack:check
# `npm run build` emits seven files into the package's own dist/ and writes no
# Barkpark file. scripts/sync-barkpark.mjs is the one path out: --check builds
# fresh in a temporary directory and compares the raw surface and code tokens,
# six browser assets, two web/public copies and host-profile/surface.json, naming
# each stale one. The set includes bp-paper-surface.css (task-7fb8088ab39c7a36:
# built from the package's surface fragments so an external host can load the
# task/fleet block styles GET /v1/papers/:slug/fleet-blocks renders, the way it
# already loads bp-paper-editor.css for the canvas). The editor css was ungated
# until 2026-09-01 and went stale once (#11816 added framed rules to
# src/styles.css that the committed css never got) -- every sink is compared
# here, and each is a trigger path below or under the package.
# The freshness check is deterministic: `npm ci` pins esbuild via the
# lockfile, and esbuild's minified output is reproducible per version.
#
# WHY paper-surface/** IS A TRIGGER PATH. Several suites under src/ do not test
# the editor at all — they read api/assets/paper-surface/paper-surface.css, the
# synced sink of src/paper-surface/, and assert things about the reading surface
# (the narrow-viewport wrap guards, for one). While this workflow triggered only on paper-editor/**, those gates could
# never see the file they gate: a change to paper-surface.css alone ran the
# Elixir suite (elixir.yml has no path filter) but not one of them, so a
# regression to the very declarations they pin would ship green. A gate whose
# subject cannot trigger it is not a gate.

on:
  push:
    branches: [main]
    paths:
      - "api/assets/paper-editor/**"
      - "api/assets/paper-editor-host-tests/**"
      # Every file a step of this workflow reads from outside the folder above.
      # DERIVED, not hand-kept: paper-editor-host-tests/path-filter-workflow.test.mjs
      # walks every entry point this workflow runs, collects each path literal
      # they read, and reds when one is not matched here, or when an entry
      # here matches nothing they read. Both arms must stay identical.
      # (#16022: a sink moved without this list and main was red for 14 h.)
      - "api/assets/paper-surface/**"
      - "design/paper-editor-mirror.mjs"
      # __modal_focus_guard.test.mjs scans every script in this folder, so a
      # new one must trigger too; it also holds the built bundle and css.
      - "api/priv/static/assets/*"
      - "api/priv/portable_doc/goldens/ops/**"
      - "api/lib/barkpark/portable_doc/render/**"
      # Host profiles (host-profile/*.json): each folder a Barkpark host embeds the
      # editor from, so a new use there runs host-profiles.test.mjs.
      - "api/lib/barkpark_web/components/**"
      - "api/lib/barkpark_web/layouts/bulldocs.html.heex"
      - "api/lib/barkpark_web/layouts/root.html.heex"
      - "api/lib/barkpark_web/live/studio/**"
      - "api/lib/barkpark_web/live/bulldocs_live.ex"
      - "api/lib/barkpark_web/live/bulldocs_live/**"
      - "web/components/**"
      - "web/app/**"
      - "api/test/support/fixtures/nested-list-carriers.json"
      - "api/test/support/fixtures/paper-editor/**"
      - "api/test/support/fixtures/pd-parity/**"
      - "api/test/fixtures/portable_doc/old_client_replay/**"
      - "api/priv/portable_doc/**"
      - "js/packages/react/**"
      - "web/public/bp-paper-editor.bundle.js"
      - "web/public/assets/bp-paper-editor.css"
      - ".github/workflows/paper-editor.yml"
  pull_request:
    paths:
      - "api/assets/paper-editor/**"
      - "api/assets/paper-editor-host-tests/**"
      # Every file a step of this workflow reads from outside the folder above.
      # DERIVED, not hand-kept: paper-editor-host-tests/path-filter-workflow.test.mjs
      # walks every entry point this workflow runs, collects each path literal
      # they read, and reds when one is not matched here, or when an entry
      # here matches nothing they read. Both arms must stay identical.
      # (#16022: a sink moved without this list and main was red for 14 h.)
      - "api/assets/paper-surface/**"
      - "design/paper-editor-mirror.mjs"
      # __modal_focus_guard.test.mjs scans every script in this folder, so a
      # new one must trigger too; it also holds the built bundle and css.
      - "api/priv/static/assets/*"
      - "api/priv/portable_doc/goldens/ops/**"
      - "api/lib/barkpark/portable_doc/render/**"
      # Host profiles (host-profile/*.json): each folder a Barkpark host embeds the
      # editor from, so a new use there runs host-profiles.test.mjs.
      - "api/lib/barkpark_web/components/**"
      - "api/lib/barkpark_web/layouts/bulldocs.html.heex"
      - "api/lib/barkpark_web/layouts/root.html.heex"
      - "api/lib/barkpark_web/live/studio/**"
      - "api/lib/barkpark_web/live/bulldocs_live.ex"
      - "api/lib/barkpark_web/live/bulldocs_live/**"
      - "web/components/**"
      - "web/app/**"
      - "api/test/support/fixtures/nested-list-carriers.json"
      - "api/test/support/fixtures/paper-editor/**"
      - "api/test/support/fixtures/pd-parity/**"
      - "api/test/fixtures/portable_doc/old_client_replay/**"
      - "api/priv/portable_doc/**"
      - "js/packages/react/**"
      - "web/public/bp-paper-editor.bundle.js"
      - "web/public/assets/bp-paper-editor.css"
      - ".github/workflows/paper-editor.yml"

concurrency:
  # main-collapse: harness-ok — publishes no context in
  # .github/required-checks.json, performs no action, watches nothing.
  # task-e7e988deee1d2b56; the long form is in
  # scripts/main-run-concurrency-check.sh, § THE MAIN-COLLAPSE MARKER.
  #
  # Every main push shares ONE group: a merge evicts only the PENDING run, the
  # running one completes. An evicted sha gets no verdict from this workflow;
  # the next completed main run covers it, because every job here reads the
  # tree as it stands. PRs keep their own per-ref group and still supersede.
  group: paper-editor-${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}
  # Never cancel main; collapse superseded PR runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  smoke-and-bundle:
    name: Round-trip smoke + bundle freshness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/assets/paper-editor
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          # No npm cache on purpose: with it (#15747) the median run went 45 s -> 76 s
          # over 10 runs each; restoring+saving ~/.npm costs more than this one-dep npm ci.

      - name: Install (pinned via lockfile)
        run: npm ci

      - name: Smoke + unit suites
        run: npm test

      - name: Barkpark host-only editor assertions
