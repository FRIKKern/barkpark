name: paper-editor

# Gate for the Studio rich-text editor (api/assets/paper-editor). Before
# 2026-06-23 NOTHING ran its converter round-trip smoke suite, and nothing
# checked the committed IIFE bundle (api/priv/static/assets/bp-paper-editor
# .bundle.js — the artifact the LiveView editor actually loads) for staleness.
# A source edit that wasn't rebuilt shipped a stale bundle once already
# (strike/underline round-trip was inert in Studio because convert.js changed
# but the bundle didn't). This workflow catches both classes:
#   1. convert.js round-trip regressions  -> npm run smoke
#   2. stale committed bundle             -> rebuild + git diff --exit-code
#   3. stale committed stylesheet         -> rebuild + git diff --exit-code
# `npm run build` emits TWO artifacts from src/ -- the IIFE bundle and
# bp-paper-editor.css (the stylesheet the LiveView editor and the web demo
# load). The css was ungated until 2026-09-01 and went stale once (#11816
# added framed rules to src/styles.css that the committed css never got).
# Both artifacts are diffed here, and both are trigger paths below.
# The freshness check is deterministic: `npm ci` pins esbuild via the
# lockfile, and esbuild's minified output is reproducible per version.
#
# WHY paper-surface/** IS A TRIGGER PATH. Several suites under src/ do not test
# the editor at all — they read api/assets/paper-surface/paper-surface.css and
# assert things about the reading surface (the narrow-viewport wrap guards, for
# one). While this workflow triggered only on paper-editor/**, those gates could
# never see the file they gate: a change to paper-surface.css alone ran the
# Elixir suite (elixir.yml has no path filter) but not one of them, so a
# regression to the very declarations they pin would ship green. A gate whose
# subject cannot trigger it is not a gate.

on:
  push:
    branches: [main]
    paths:
      - "api/assets/paper-editor/**"
      # the reading surface several src/ suites assert against — see the header
      - "api/assets/paper-surface/**"
      - "api/priv/static/assets/bp-paper-editor.bundle.js"
      - "api/priv/static/assets/bp-paper-editor.css"
      # Files the unit tests READ from outside api/assets/paper-editor. A move of a
      # sink without this line goes blind: #16022 lifted the Studio inline CSS out
      # of root.html.heex and main was red for 14 h with no run to say so.
      - "api/priv/static/assets/bp-paper-editor-shell.css"
      - "api/lib/barkpark_web/layouts/root.html.heex"
      # corpus 1 of the rendered sweep below — a golden fixture added or
      # re-frozen here is a new block this workflow must render, and without
      # this line the job that renders it cannot see it.
      - "js/packages/react/tests/fixtures/pd-golden/**"
      - ".github/workflows/paper-editor.yml"
  pull_request:
    paths:
      - "api/assets/paper-editor/**"
      - "api/assets/paper-surface/**"
      - "api/priv/static/assets/bp-paper-editor.bundle.js"
      - "api/priv/static/assets/bp-paper-editor.css"
      # Files the unit tests READ from outside api/assets/paper-editor. A move of a
      # sink without this line goes blind: #16022 lifted the Studio inline CSS out
      # of root.html.heex and main was red for 14 h with no run to say so.
      - "api/priv/static/assets/bp-paper-editor-shell.css"
      - "api/lib/barkpark_web/layouts/root.html.heex"
      # corpus 1 of the rendered sweep below — a golden fixture added or
      # re-frozen here is a new block this workflow must render, and without
      # this line the job that renders it cannot see it.
      - "js/packages/react/tests/fixtures/pd-golden/**"
      - ".github/workflows/paper-editor.yml"

concurrency:
  group: paper-editor-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # Never cancel main; collapse superseded PR runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  smoke-and-bundle:
    name: Round-trip smoke + bundle freshness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/assets/paper-editor
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          # No npm cache on purpose: with it (#15747) the median run went 45 s -> 76 s
          # over 10 runs each; restoring+saving ~/.npm costs more than this one-dep npm ci.

      - name: Install (pinned via lockfile)
        run: npm ci

      - name: Smoke + unit suites
        run: npm test

      - name: Rebuild bundle
        run: npm run build

      - name: Assert committed bundle and stylesheet are fresh
        run: |
          stale=0
          if ! git diff --exit-code ../../priv/static/assets/bp-paper-editor.bundle.js; then
            echo "::error file=api/priv/static/assets/bp-paper-editor.bundle.js::Committed bundle is stale — run 'npm run build' in api/assets/paper-editor and commit the result."
            stale=1
          fi
          if ! git diff --exit-code ../../priv/static/assets/bp-paper-editor.css; then
            echo "::error file=api/priv/static/assets/bp-paper-editor.css::Committed stylesheet is stale — run 'npm run build' in api/assets/paper-editor and commit the result."
            stale=1
          fi
          exit "$stale"

  # ── the RENDERED half of the narrow-viewport sweep ──────────────────────────
  #
  # `npm test` above runs four `__narrow_*_guards.test.mjs` suites, and all four
  # are SOURCE guards: they read api/assets/paper-surface/paper-surface.css and
  # regex-match declarations out of it. That catches a deleted declaration. It
  # cannot tell you whether the page actually scrolls sideways on a phone, and
  # it cannot find a block whose overflow nobody has thought about yet.
  # `src/__narrow_render.mjs` is the half that measures — it renders every
  # golden fixture, plus long unbreakable author tokens injected one field at a
  # time, in headless Chromium and asserts documentElement.scrollWidth against
  # the viewport at 390px and 320px.
  #
  # WHY IT IS ITS OWN JOB. The harness needs a browser; `npm test` must stay
  # runnable on a machine that has none, which is why the harness is not in the
  # `test` script (its own header: "a gate that cannot run everywhere is a gate
  # people learn to ignore"). Here a browser is installed on purpose, so the
  # measurement runs where it can.
  #
  # NO CHROMIUM, NO FAILURE — AND THAT IS THE TRAP THIS JOB DISARMS. Run with no
  # browser, the harness prints SKIP and exits 0. A job that let that through
  # would be green for the rest of its life having measured nothing. So the run
  # step below asserts on the OUTPUT, not just the exit code: a SKIP line fails
  # the job, and so does any run that did not print all four measured
  # assertions (two corpora x two widths). Green here means it measured.
  #
  # NOT IN THE REQUIRED SET (.github/required-checks.json), and no
  # continue-on-error: it reds its own check run honestly and cannot block a
  # merge. That is the same advisory shape as the doc-budget job.
  narrow-render:
    name: Narrow-viewport rendered sweep
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/assets/paper-editor
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Cache chrome-headless-shell
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-chrome-headless-shell-stable

      # chrome-headless-shell, not full Chrome: the harness only dumps the DOM
      # after a virtual-time budget, so it needs no window server and no codecs.
      # `install` prints "<browser>@<buildId> <absolute path>", and pinning
      # BP_CHROME from that path is exact — it does not depend on the harness
      # guessing a cache directory layout.
      - name: Install chrome-headless-shell
        run: |
          set -euo pipefail
          npx --yes @puppeteer/browsers install chrome-headless-shell@stable \
            --path "$HOME/.cache/puppeteer" | tee "$RUNNER_TEMP/chrome-install.txt"
          # The last line is "chrome-headless-shell@<buildId> <absolute path>".
          bin="$(tail -1 "$RUNNER_TEMP/chrome-install.txt")"
          bin="${bin##* }"
          if [ ! -x "$bin" ]; then
            echo "::error::chrome-headless-shell reported '$bin', which is not an executable. Refusing to run the sweep without a browser — it would SKIP and pass vacuously."
            exit 1
          fi
          echo "BP_CHROME=$bin" >> "$GITHUB_ENV"

      - name: Render the sweep at 390px and 320px
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/narrow-render.txt"
          status=0
          BP_NARROW_WIDTHS=390,320 BP_NARROW_VERBOSE=1 \
            node src/__narrow_render.mjs > "$out" 2>&1 || status=$?
          cat "$out"

          # PROVE IT MEASURED. Everything below fails a run that produced a
          # green exit code without rendering anything.
          if grep -q '^SKIP  __narrow_render.mjs' "$out"; then
            echo "::error::the harness found no browser and skipped. A skipped sweep is not a passing sweep."
            exit 1
          fi
          if grep -q '^SKIP  golden corpus' "$out"; then
            echo "::error::the golden corpus (js/packages/react/tests/fixtures/pd-golden) was absent, so corpus 1 measured nothing."
            exit 1
          fi
          golden=$(grep -c '^\(PASS\|FAIL\)  no golden fixture scrolls the page sideways at ' "$out" || true)
          blocks=$(grep -c '^\(PASS\|FAIL\)  no block overflows on a token plain prose survives, at ' "$out" || true)
          if [ "$golden" -ne 2 ] || [ "$blocks" -ne 2 ]; then
            echo "::error::expected 2 golden-corpus and 2 hostile-token assertions (one per width in BP_NARROW_WIDTHS=390,320); got $golden and $blocks. The run did not measure what this job claims to measure."
            exit 1
          fi

          exit "$status"
