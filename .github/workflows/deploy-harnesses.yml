name: Deploy harnesses

# VENUE, AMENDED 2026-09-06 (task-037c3c1494f0d59e; amends the 2026-09-05 ruling
# in task-33742276cf0a35b1). The earlier line here read "push-to-main + nightly,
# NOT pull_request — 3.8 min per execution on a harness that does not test the
# PR's own code". Its premise was right for the PR fleet at large and WRONG for
# the only PRs this workflow can ever see: on a PR that touches `deploy/**` the
# harness tests EXACTLY the PR's own code. The consequence was measured
# (task-037c3c1494f0d59e, 2026-09-06): the 184-check cp-deploy harness is green
# on every push to main and HAS NEVER GATED A SINGLE PR. main IS the deploy, so
# a post-merge red arrives after the box has already pulled — the harness could
# only ever answer "did we already break it", never "would this break it".
#
# The amendment is a PATH FILTER, not an exception. The CI-policy rule as
# written ("a PR runs only what can block it, or finishes under 60 s") has no
# clause for work that is cheap IN AGGREGATE because it almost never fires; the
# third clause proposed alongside this change is "...**or is PATH-FILTERED to
# paths the PR actually changes**". Blast radius, measured: of the newest 400
# merged PRs since 2026-08-07 (a `gh pr list -L 400` sample — a FLOOR on the
# denominator; the true 30-day count is higher), 10 touched `deploy/**` or this
# file — about 2.3 per week, <=2.5% of merges. The arm therefore costs roughly
# 10 x 3.8 min per MONTH, not 3.8 min per push.
#
# VENUE IS DECIDED PER JOB, never per file:
#   * offline-deploy-harnesses  — push + schedule + pull_request. It reads only
#     deploy/** and this file; on a matching PR it IS the PR's own code.
#   * git-2-34-fetch            — push/schedule only (`if:` below). It pulls the
#     real remote's main inside an ubuntu:22.04 container; on a PR head that
#     probe measures main, not the PR, and would be a 8-min container per PR for
#     a verdict the PR cannot change.
#   * report-main-failure       — push/schedule only. It FILES GITHUB ISSUES; a
#     per-PR issue-filer is a spam machine. A PR red is read on the PR.
#
# WHY THIS CONTEXT STAYS ADVISORY AND CAN NEVER BE REQUIRED. A workflow-level
# `paths:` filter emits NO check run at all on a non-matching PR, so a required
# context pointing here would report "expected" forever and DEADLOCK every
# unrelated PR (honest-gates D18; docs/ops/merge-gates.md, the S4 PATHS-FILTERED
# exclusion and its note that a paths-filtered workflow "is invisible to that
# census by construction"). Absence-on-non-matching-PRs is FINE for an advisory
# check and is exactly what disqualifies it from the required set. The filter is
# kept at workflow level here — and NOT pushed down into a dispatcher job the way
# compose-smoke.yml and cloud.yml do it — precisely because those two publish
# required names and this one must not. `scripts/shim-trigger-filter-check.sh`
# forbids a workflow-level pull_request paths filter only on SHIMMED workflows
# (6 of 62; this file is not one of them) — verified before this change landed.
on:
  pull_request:
    # Mirrors the push list below, entry for entry, including the
    # deploy_runner.ex entry and its @stage_names reasoning.
    paths:
      - "deploy/**"
      - ".github/workflows/deploy-harnesses.yml"
      - "api/lib/barkpark/sites/deploy_runner.ex"
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - ".github/workflows/deploy-harnesses.yml"
      # Both site engines' self-tests assert on THIS file — the @stage_names
      # whitelist that decides which BPSTAGE lines become a verdict (ROUTE must
      # stay out of it, charter D327/D346). Without this entry a PR that adds
      # ROUTE to @stage_names touches no deploy/** path, so the only shell
      # assertion protecting that doctrine never fires on the exact change it
      # exists to catch.
      #
      # BELT-AND-BRACES, NOT THE FIX: this workflow is not a required status
      # check (the required set is "Elixir gate", "PR references an active
      # task", "Cloud gate", "Console gate"), so it cannot block a merge no
      # matter what it runs. The blocking guard is
      # api/test/barkpark/sites/deploy_runner_stage_names_test.exs, which rides
      # the required Elixir lane. This line just makes the shell half reachable.
      - "api/lib/barkpark/sites/deploy_runner.ex"
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-deploy-harnesses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and assert Caddy
        # From the OFFICIAL Caddy repo, never Ubuntu's — universe ships 2.6.2,
        # which predates Caddy's heredoc syntax (>= 2.7). The maintenance block
        # in instance-deploy.sh uses a heredoc (`body <<BARKPARK_MAINTENANCE`),
        # so a 2.6 `caddy validate` REJECTS it — and arm_caddy_maintenance then
        # silently reverts (it never fails a deploy), leaving the box to serve
        # raw 502s during a deploy instead of the maintenance page. This harness
        # exists to do REAL caddy validation, so it must validate against a Caddy
        # that can actually parse the config we ship. Assert the floor, loudly.
        run: |
          sudo apt-get update
          sudo apt-get install -y debian-keyring debian-archive-keyring apt-transport-https curl
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' \
            | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' \
            | sudo tee /etc/apt/sources.list.d/caddy-stable.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y caddy
          command -v caddy
          caddy version
          # Heredoc floor (>= 2.7): fail LOUDLY here rather than let the deploy
          # script's silent revert turn into a green harness on a broken config.
          ver="$(caddy version | grep -oE 'v[0-9]+\.[0-9]+' | head -1 | tr -d v)"
          major="${ver%%.*}"; minor="${ver##*.}"
          if [ "$major" -lt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -lt 7 ]; }; then
            echo "::error title=Caddy too old::caddy $ver cannot parse the heredoc maintenance block (needs >= 2.7)"
            exit 1
          fi
      - name: Every deploy/*.sh parses and passes shellcheck -S warning (task-6f18e71a351f8081 D)
        # 17 files / 14k lines had ONE bash -n and zero shellcheck in CI. Zero-findings
        # gate: the two warnings that existed (SC2034 x2) were fixed in the same change,
        # so any NEW finding is a regression, not a baseline. Measured 14 s on run
        # 34100289398 - the authoring estimate of "~1-3 s" was 5-14x optimistic.
        #
        # THE TWO WAYS THIS STEP COULD GREEN WITHOUT MEASURING ANYTHING, both closed
        # below. A ZERO-FINDINGS gate is the shape that goes vacuous silently: it looks
        # identical whether it scanned seventeen files or none, and unlike a baselined
        # gate there is no file here whose growth would give the drift away.
        #
        #   1. THE CORPUS EVAPORATES. If deploy/*.sh matched one file - a rename, a
        #      move, a bad merge - "no shellcheck warning" is still true and this step
        #      is still green. .go-format-drift-ceiling already refuses that class with
        #      a MIN_FILES plausibility floor; this step had no floor at all. Lower
        #      MIN_FILES DELIBERATELY if deploy/ really shrinks - do not let a green be
        #      how you find out.
        #
        #   2. THE INSTRUMENT GOES BLIND. shellcheck present but declawed - a wrapper on
        #      PATH, a severity default that demotes SC2034 - produces exactly this
        #      step's green over exactly this step's corpus. So the step now PROVES IT
        #      CAN FAIL on every run: it plants a deliberate SC2034 in a COPY of a real
        #      deploy script in a tmpdir and requires shellcheck to red on it. The copy
        #      is the point - no tracked file is ever touched, so the control cannot
        #      leak into the tree it guards. If the planted defect does NOT red, this
        #      step FAILS rather than passing, because at that moment the clean green
        #      above has stopped meaning anything. Same anti-vacuity grammar the repo
        #      already uses at scripts/pds-pull-proof.sh (PDS_STEP5_FAILDEMO /
        #      PDS_STEP6_GUARD_DEMO): it turns "no findings" into "no findings, and I
        #      would have seen one".
        #
        # The control is ON BY DEFAULT and takes no environment variable - a knob that
        # can disable it re-opens the hole for whoever sets the knob.
        run: |
          set -euo pipefail
          MIN_FILES=15
          n="$(ls deploy/*.sh | wc -l | tr -d " ")"
          if [ "$n" -lt "$MIN_FILES" ]; then
            echo "::error title=deploy shellcheck corpus below its floor::deploy/*.sh matched only $n file(s); the floor is $MIN_FILES. A zero-findings lint gate over a corpus that shrank is not a pass, it is a gate that stopped looking. Restore the files, or lower MIN_FILES deliberately in this step."
            exit 1
          fi
          for f in deploy/*.sh; do bash -n "$f"; done
          shellcheck --version | grep -m1 version:
          shellcheck -S warning deploy/*.sh
          echo "deploy/*.sh: $n files parse and carry no shellcheck warning"

          # -- the firing control (task-6f18e71a351f8081 D): prove the step CAN red --
          ctl="$(mktemp -d)"
          trap 'rm -rf "$ctl"' EXIT
          victim="$(ls deploy/*.sh | head -1)"
          cp "$victim" "$ctl/planted.sh"
          # SC2034: assigned and never used. -S warning must catch this.
          printf '\nbp_planted_unused_variable="task-6f18e71a351f8081 D control"\n' >> "$ctl/planted.sh"
          ctl_out="$(shellcheck -S warning "$ctl/planted.sh" 2>&1)" && ctl_rc=0 || ctl_rc=$?
          if [ "$ctl_rc" -eq 0 ]; then
            echo "::error title=shellcheck control DID NOT FIRE::A deliberate SC2034 was planted in a copy of $victim and shellcheck -S warning still returned 0. The clean green printed above therefore proves NOTHING about deploy/*.sh - this instrument is not discriminating. Do not re-run hoping for a different answer: find out why shellcheck stopped reporting SC2034 (a wrapper on PATH, a disable directive inherited from the copied file, a severity default change)."
            exit 1
          fi
          # HERE-STRING, never `printf … | grep -q` (D37, and scripts/pipefail-sigpipe-scan.sh
          # documents this exact shape). `grep -q` exits on the FIRST match without
          # draining, the producer takes SIGPIPE and dies 141, `pipefail` propagates 141
          # as the pipeline's status, and the `!` inverts it — so this control would
          # report "fired for the WRONG REASON" at precisely the moment it fired
          # correctly. MEASURED on this shape: correct at 384 bytes (0 inversions in 200
          # trials, which is today's real $ctl_out), 58 of 60 inverted at ~1 KB, 60 of 60
          # at ~2 KB. So it is LATENT, not currently firing — and one extra shellcheck
          # finding, a longer temp path or a chattier shellcheck release carries it over.
          # A here-string has no producer process to kill.
          if ! grep -q "SC2034" <<<"$ctl_out"; then
            echo "::error title=shellcheck control fired for the WRONG REASON::The planted copy was rejected (exit $ctl_rc) but the output names no SC2034, so the control is not measuring what it claims to measure. Output follows."
            printf '%s\n' "$ctl_out"
            exit 1
          fi
          echo "control: a planted SC2034 in a copy of $victim reds shellcheck -S warning (exit $ctl_rc, SC2034 named) - the clean result above is a measurement, not an absence of one"
      - name: Instance deploy harness
        run: bash deploy/instance-deploy_test.sh
      - name: Control-plane deploy harness
        run: bash deploy/cp-deploy_test.sh
      # The four-leg public /mcp matrix smoke (connectors-mcp-live-reachability-smoke,
      # PR #15117): the script landed with that PR; this advisory workflow is where
      # its harness runs on every deploy/** change (asked for by lead-deploy).
      - name: MCP reachability smoke harness
        run: bash deploy/mcp-reachability-smoke_test.sh
      # The site-spawner deploy engine ships its own offline proof (--self-test:
      # fixture release dirs in a tmpdir, no npm/caddy/systemd needed). It is
      # worthless unless it actually RUNS — an untested deploy engine is the
      # weakest link in the deploy path, so gate it here alongside its siblings.
      # BARKPARK_SELFTEST_REQUIRE_E2E=1: the engine-e2e block (stage protocol,
      # content-truth HEALTH gate, "the box ran no npm" on a prebuilt deploy)
      # SKIPS itself when python3/curl are absent — and the run then prints PASS
      # and exits 0 with this engine's central claims untested. In CI that skip
      # is a green vacuum, so make it a hard failure here. The SAME flag also
      # hard-fails the fleet build admission gate proof (one box, one build) when
      # flock(1) is missing: that block drives two concurrent deploys against a
      # REAL flock, and a gate "proven" against the e2e's exit-0 flock stub proves
      # the stub. ubuntu-latest ships util-linux, so this only ever fires on a
      # runner image change — loudly, which is the point.
      - name: Site deploy engine self-test
        env:
          BARKPARK_SELFTEST_REQUIRE_E2E: "1"
        run: bash deploy/site-deploy.sh --self-test
      # The Node-engine deploy path ships its own offline proof (--self-test:
      # fixture release dirs in a tmpdir, no npm/caddy/systemd needed) covering
      # basePath arming, standalone runtime, rollback preflight and more. Same
      # reasoning as its static sibling above: an untested deploy engine is the
      # weakest link, so gate it here. The script self-gates and exits non-zero
      # on any failure, and since #15813 (2026-09-03) it also refuses below a
      # literal, committed check floor (SELFTEST_FLOOR_FULL in the script) so a
      # run that silently lost a block cannot read as green.
      # BARKPARK_SELFTEST_REQUIRE_E2E=1 for the same reason it is set above: this
      # engine's gate block proves that the slot process HEALTH boots does not
      # inherit the box's only build slot (a permanent fleet-wide deny), and that
      # proof needs a REAL flock(1) — without the flag it would skip itself and
      # still print PASS.
      - name: Site deploy engine (Node) self-test
        env:
          BARKPARK_SELFTEST_REQUIRE_E2E: "1"
        run: bash deploy/site-deploy-node.sh --self-test

  git-2-34-fetch:
    # task-6f18e71a351f8081 B. The control-plane box is Ubuntu 22.04 with the
    # distro git 2.34.1, which cannot speak protocol v2 to GitHub ("could not
    # read Username" on a PUBLIC repo; evidence 2026-09-02, fix #15634 pins
    # protocol.version=0 in deploy/cp-deploy.sh). Nothing in CI ran the box's
    # git against origin, so the pin could be deleted as cargo cult and nobody
    # would know until the next deploy.
    #
    # The probe runs INSIDE an ubuntu:22.04 container with apt's git, because
    # GitHub's ubuntu-22.04 runner image ships a newer git from a PPA (the first
    # version of this job asserted 2.34 on the runner itself and reddened on
    # main, 2026-09-03 06:3xZ). It runs the EXACT pull form cp-deploy.sh uses,
    # against the real remote; reds if the pinned form stops working on 2.34 or
    # if cp-deploy.sh loses the pin. deploy/** only.
    name: cp-deploy.sh's pull form works on the box's git 2.34 (ubuntu:22.04 container)
    # PUSH/SCHEDULE ONLY (venue note at the top of this file). It clones and
    # pulls the REAL remote's main inside a container: on a PR head it measures
    # main, not the PR, so it is 8 minutes for a verdict the PR cannot change.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: cp-deploy.sh still carries the protocol pin
        run: grep -nE 'git .*-c protocol\.version=0 .*pull --ff-only origin main' deploy/cp-deploy.sh
      - name: In ubuntu:22.04 with apt git — the pinned pull form succeeds; the v2 form is recorded, not gated
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          docker run --rm -e REPO_URL ubuntu:22.04 bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq >/dev/null && apt-get install -y -qq git ca-certificates >/dev/null
            git --version
            git --version | grep -qE "git version 2\.34\." || { echo "::error::apt git on ubuntu:22.04 is no longer 2.34 — this probe no longer models the box; re-point it"; exit 1; }
            git clone --quiet --depth 1 --branch main "$REPO_URL" /repo && cd /repo
            git -c core.hooksPath=/dev/null -c protocol.version=0 pull --ff-only origin main
            echo "pinned form (protocol.version=0): OK on $(git --version)"
            if git -c core.hooksPath=/dev/null -c protocol.version=2 pull --ff-only origin main 2>/tmp/v2.err; then
              echo "::notice::protocol v2 works from this container on git 2.34 — the box refusal is environmental (proxy/curl); the pin still stands as measured on the box"
            else
              echo "::notice::protocol v2 REFUSED on git 2.34 here too: $(head -c 200 /tmp/v2.err) — the pin is load-bearing everywhere"
            fi
          '

  report-main-failure:
    name: Report main-push failure to a human
    needs: [offline-deploy-harnesses, git-2-34-fetch]
    # PUSH/SCHEDULE ONLY, and belt-and-braces: this job FILES GITHUB ISSUES, so
    # a per-PR arm would be a spam machine. The `github.ref` half already
    # excludes pull_request (its ref is refs/pull/N/merge), the event_name half
    # says so out loud so the venue is readable without knowing that.
    if: failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # the ONLY reason this job carries a permissions block
    steps:
      - uses: actions/checkout@v4
      - name: File (or update) the CI failure issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_FAILURE_KEY: deploy-harnesses-main
          CI_FAILURE_DETAIL: |
            `deploy-harnesses` is RED on main. Since 2026-09-06 the
            `offline-deploy-harnesses` job ALSO runs on pull requests that touch
            `deploy/**`, this workflow, or `deploy_runner.ex`
            (task-037c3c1494f0d59e, amending task-33742276cf0a35b1) — so a red
            here means either the change reached main without a matching PR arm
            (a non-`deploy/**` cause, or a merge queue race), or the push-only
            `git-2-34-fetch` container job reds, which no PR ever runs. This
            issue remains the ONLY reader for those two cases.
            Read the failed job's log, fix or revert on main, and close this issue
            once the next main-push or nightly run is green.
        run: bash scripts/file-ci-failure-issue.sh
