name: search-template-gates

# Arms the three fail-closed search-template tripwires that shipped to main but
# were wired into ZERO of 50 workflows (search-template epic, charter D88/D93,
# §278(3); wave 12 slice stw12-arm-tripwires). Each tripwire already ships its
# own `--selftest` whose NEGATIVE half must red — a gate that cannot fail proves
# nothing — so this workflow runs the fail-closed form of each on every PR that
# touches the starter templates or a gate's own source.
#
#   1. check-vendor-blocks.mjs   — the vendored renderer must paint every block
#                                  type the repo teaches; --selftest (16/16).
#   2. templates-literal-check.sh — no light-mode palette text literal and no
#                                  hardcoded focus ring in the starter .tsx;
#                                  --selftest (17 cases) + the real scan.
#   3. check-vendor-freshness.mjs — the vendored @barkpark/core and
#                                  @barkpark/react tarballs must correspond to
#                                  the CURRENT js/packages source. The block
#                                  gate above covers only the RENDERER, and only
#                                  the block-type axis; it is blind to
#                                  @barkpark/core entirely. --selftest (20/20)
#                                  plus the real content comparison.
#   4. verify-bp-commands.mjs    — every `bp …` command PRINTED in the flagship
#                                  template docs must PARSE against the CLI's own
#                                  sources. Run over the template docs with
#                                  repo-RELATIVE paths (the resolver concatenates
#                                  join(root, rel), so an absolute path 404s to a
#                                  false exit-2) and --offline (accepted only when
#                                  every target is under templates/**).
#
# FAIL-CLOSED, by design: the bp-command job REDS whenever a flagship doc prints
# a command the CLI cannot parse. That is the gate catching real dishonesty, not
# a broken workflow — the fix is to correct (or cut) the offending doc copy, not
# to loosen the gate. It stays fail-closed on unproven commands on purpose.
#
# NOTE: this workflow is ADVISORY. It reds its own check-run on failure; it
# cannot stop a merge, because branch protection's required set on main is
# exactly ["Elixir gate", "PR references an active task", "Cloud gate",
# "Console gate"] and nothing here is among them.
#
# WHY THERE IS A push:main ARM (added 2026-09-05, task-bc9fe6dc29d0b979).
# Until now this file declared `on: pull_request` ONLY, so `gh run list
# --workflow=search-template-gates.yml --branch main` returned an EMPTY list:
# main was never measured. That is not a small gap for `Vendored SDK
# freshness` in particular — #16174 was merged at 12:20Z while that job was
# red, and main then shipped a stale vendored barkpark-core.tgz to every user
# who scaffolded from these templates. A gate that has never once run on the
# branch it protects reports nothing, and reads exactly like a gate that ran
# and found nothing.
#
# WHERE A STALE TARBALL ON MAIN NOW SURFACES. Two places, both on the push
# arm: (1) the `Vendored SDK freshness` check-run on the main commit reds —
# visible on the commit, in the Actions tab, and in `gh run list --workflow=
# search-template-gates.yml --branch main`; and (2) the `report-main-failure`
# job below files (or comments on) ONE idempotent GitHub issue under the key
# `search-template-gates-main` via scripts/file-ci-failure-issue.sh, assigned
# and @mentioned, because nobody opens the Actions tab unprompted. Close that
# issue when a main run is green again; the next failure opens a fresh one.
#
# THE push ARM IS PATH-UNFILTERED, ON PURPOSE. The pull_request arm below is
# keyed to the paths that can make the tarballs stale, which is right for a PR
# — but a paths: filter on the main arm would only move the vacuous green one
# hop over, from "main is never measured" to "main is not measured when
# untouched". The tarballs are a FROZEN artifact: they rot relative to a
# source tree that keeps moving, and the run that proves they are still fresh
# is exactly the run on the commit that did not touch them.
#
# IF THIS IS EVER PROMOTED TO REQUIRED, register an AGGREGATOR context that
# always emits — never one of the paths-filtered leaf job names below. A
# required context that emits no check run on a filtered-out PR routes to
# `Expected — Waiting for status to be reported` forever and deadlocks the
# merge; registering the leaf reproduces the same defect it is meant to end.
#
# FENCE COLLISION — THE GATE AND ITS REMEDY LIVE IN DIFFERENT TREES. The
# freshness job fires on `js/packages/{core,react}/**` changes, but its ONLY
# remedy writes to `templates/**`: you fix a red here by running
# `scripts/recut-vendor-tarballs.sh` and committing the re-cut
# `templates/*/vendor/*.tgz` plus `templates/VENDOR-STAMP.json`. So the SDK
# lane must run that script IN THE SAME PR as the js/packages change — a lane
# fenced out of `templates/**` cannot green this gate and will conclude,
# wrongly, that the gate is broken. See docs/ops/ci-workflow-verdicts.md.

on:
  # PATH-UNFILTERED BY DESIGN — see "THE push ARM IS PATH-UNFILTERED" above.
  push:
    branches: [main]
  pull_request:
    paths:
      - "templates/**"
      # THE SOURCE SIDE OF THE DRIFT check-vendor-blocks.mjs EXISTS TO CATCH.
      # The gate derives its expected block-type set by reading
      # js/packages/react/src/blocks/registry.ts and every emitter map that
      # file spreads in (./core, ./dataviz, ./forms, ./chat, ./table, ./sheet,
      # ./taskboard, ./math — all siblings in that directory), then asserts the
      # vendored templates/*/vendor/barkpark-react.tgz paints all of them.
      # Registering a new block type there is EXACTLY the edit that makes the
      # frozen tarballs stale — and until this entry existed, that edit matched
      # NO pattern in this list, so the gate never ran on it. MEASURED: a diff
      # touching only registry.ts fired architecture, js-tests, mobile,
      # twoslash, typedoc, doc-gates and pr-task-gate, and NOT this workflow;
      # the gate that owns the invariant was the one workflow blind to it. A
      # gate that never fires on the change it guards reports green forever and
      # is indistinguishable from one that ran and found nothing.
      - "js/packages/react/src/blocks/**"
      # THE SOURCE SIDE check-vendor-freshness.mjs EXISTS TO CATCH. Its digest
      # covers the PACK INPUTS of both vendored packages — src/**, package.json
      # and the build config — so those are exactly the paths that must wake
      # this workflow. `js/packages/core/**` matched NO pattern here before
      # (measured: `git grep barkpark-core -- scripts .github/workflows`
      # returned nothing repo-wide), so 24 core commits landed after the last
      # re-cut with no workflow anywhere noticing.
      - "js/packages/core/src/**"
      - "js/packages/core/package.json"
      - "js/packages/core/tsup.config.ts"
      - "js/packages/core/tsconfig.json"
      - "js/packages/react/src/**"
      - "js/packages/react/package.json"
      - "js/packages/react/tsup.config.ts"
      - "js/packages/react/tsconfig.json"
      - "scripts/check-vendor-blocks.mjs"
      - "scripts/check-vendor-freshness.mjs"
      - "scripts/recut-vendor-tarballs.sh"
      - "scripts/templates-literal-check.sh"
      - "tooling/doc-truth/verify-bp-commands.mjs"
      - "tooling/doc-truth/bp-cli-sources.mjs"
      - "tooling/doc-truth/verify-docs.mjs"
      - ".github/workflows/search-template-gates.yml"

permissions:
  contents: read

concurrency:
  # One group PER MAIN SHA, so a later push never evicts an earlier main run
  # and leaves that commit unmeasured; PRs keep grouping by ref as before.
  group: search-template-gates-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # NEVER a literal `true`: on push-to-main that self-cancels this suite dark
  # (never-cancel-main-check.sh / honest-gates D12). A no-op on PRs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  vendor-block-coverage:
    name: Vendored renderer block coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Self-test the tripwire (its negative half must red)
        run: node scripts/check-vendor-blocks.mjs --selftest

  vendor-sdk-freshness:
    name: Vendored SDK freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Self-test the tripwire (its negative half must red)
        run: node scripts/check-vendor-freshness.mjs --selftest
      # Unlike vendor-block-coverage above, the REAL gate runs here too: it
      # needs no npm install, only the checkout and the system tar, so there is
      # no reason to ship only the selftest. Never piped — a gate piped through
      # tail or grep -q reports the PIPE's exit code, and under load pipefail
      # plus SIGPIPE turns a red into a 141 that reads as a flake.
      - name: Compare the vendored tarballs against js/packages source
        run: node scripts/check-vendor-freshness.mjs

  contrast-focus-literals:
    name: Starter-template contrast/focus literals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the tripwire (its negative half must red)
        run: bash scripts/templates-literal-check.sh --selftest
      - name: Scan the starter templates
        run: bash scripts/templates-literal-check.sh

  bp-command-truth:
    name: Flagship template bp-command parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Repo-RELATIVE paths ONLY: the resolver does join(root, rel) which
      # concatenates, so an absolute path resolves to a non-existent file and
      # exits 2 (a false "target not found") instead of adjudicating. --offline
      # drops the manifest source and is accepted because every target is under
      # templates/**.
      - name: Verify every printed bp command parses
        run: >-
          node tooling/doc-truth/verify-bp-commands.mjs --offline
          templates/DEPLOYING.md
          templates/MANIFEST.md
          templates/astro-search-starter/README.md
          templates/search-starter/DEPLOYING.md
          templates/search-starter/README.md

  # THE READER FOR THE push:main ARM. Without this, a red on main lands in the
  # Actions tab that nobody opens — and this workflow was PR-only precisely
  # because a red with no reader is indistinguishable from no red at all.
  # Copied from deploy-harnesses.yml / grip-suite.yml (#16127): one idempotent
  # issue per key, assigned and @mentioned, commented on for repeat firings.
  report-main-failure:
    name: Report main-push failure to a human
    needs:
      [
        vendor-block-coverage,
        vendor-sdk-freshness,
        contrast-focus-literals,
        bp-command-truth,
      ]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # the ONLY reason this job carries a permissions block
    steps:
      - uses: actions/checkout@v4
      - name: File (or update) the CI failure issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_FAILURE_KEY: search-template-gates-main
          CI_FAILURE_DETAIL: |
            `search-template-gates` is RED on main. This workflow is ADVISORY —
            it reds its own check-run and cannot stop a merge — so this issue is
            how a red on main reaches a human at all.

            If `Vendored SDK freshness` is the failing job, the vendored
            barkpark-core / barkpark-react tarballs under `templates/*/vendor/`
            no longer match `js/packages/{core,react}` source, and every user who
            scaffolds from these templates is getting the stale SDK. THE REMEDY
            LIVES IN A DIFFERENT TREE FROM THE TRIGGER: run
            `bash scripts/recut-vendor-tarballs.sh` and commit the re-cut
            `templates/*/vendor/*.tgz` plus `templates/VENDOR-STAMP.json`.

            Close this issue once a main-push run is green; the next failure
            opens a fresh one.
        run: bash scripts/file-ci-failure-issue.sh
