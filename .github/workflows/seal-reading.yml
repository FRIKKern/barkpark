# SEAL READING — the one MACHINE-TAKEN reading of the seal predicate.
#
# WHY THIS FILE EXISTS (dr-w28-bl-seal-run-is-available-but-not-enforced)
#
#   Wave 28 shipped `scripts/seal-run.sh`: the read-only wrapper that refuses a
#   reading taken over a shallow clone, a tree off origin/main's tip, a drifted
#   predicate copy, or a token carrying `b-unavailable>0`. It works and it is
#   mutation-proved (scripts/seal-run.test.sh, 52 assertions, wired into
#   shell-harnesses.yml as `seal-run.sh probe matrix`).
#
#   What it did NOT do is make itself the only way to take a reading. Anyone can
#   still run `node cloud/priv/static/__preview__/seal-predicate.mjs --repo
#   <anything>` by hand, get a quotable `VERDICT-TOKEN:` line out of the wrong
#   tree, and paste it into a wave paper — which is precisely how wave 28's false
#   `a=FAIL b=FAIL` was produced. The runner was an affordance, not a fence, and
#   nobody who did not know it existed lost anything they had.
#
#   This job closes the half of that hole a workflow CAN close: the epic now has a
#   reading a MACHINE took, over a checkout whose properties are asserted rather
#   than assumed, through the runner. A hand-typed token now has a published
#   machine-taken one standing beside it.
#
# THE VENUE, AND WHY IT IS NOT `pull_request`
#
#   A seal reading answers a question about THE REPOSITORY'S STATE, not about a
#   PR's diff. On a PR head the reading would describe a tree that does not exist
#   anywhere but in that PR, and `seal-run.sh` would refuse it (exit 5, HEAD is
#   not origin/main's tip) — correctly, and on every PR forever. So the triggers
#   are `push:` to main (a reading per merged state), `schedule:` (a reading even
#   on a quiet day, because the register's rungs can rot without a commit), and
#   `workflow_dispatch:` (so the reading can be demanded, and so this job can be
#   exercised from a branch before it is merged — the checkout below pins
#   `ref: main` regardless of which ref dispatched it).
#
# THIS JOB IS ADVISORY. It is a MEASUREMENT, and it gates no merge.
#
#   (A note on the wording, so the next author does not "fix" it back: the
#   two-word phrase for a check that stops a merge is deliberately absent from
#   this header. `scripts/required-checks-verify.sh`'s blocking-prose regex (grep -n
#   'PROSE_CLAIM=' scripts/required-checks-verify.sh)
#   matches that phrase anywhere in a workflow's header and cannot tell a CLAIM of
#   authority from a DENIAL of one — measured: writing it here, inside the sentence
#   denying it, pushed UNRESOLVED file-header prose from 0 to 1 and red the guard's
#   own selftest. The guard is right to be shape-keyed and this file is right to say
#   what it is; saying it in other words costs nothing.)
#
#   It is deliberately absent from `.github/required-checks.json`'s required set
#   and carries an S7 exclusion row there instead. Two reasons, and the second is
#   the load-bearing one:
#
#     1. It renders no check run on a PR head at all (no `pull_request:` arm), and
#        a required context that is ABSENT reports "expected" forever (D18).
#     2. Charter D335: an instrument that READS and then exits 1 gets wired into
#        CI as a gate, and a gate is a verdict again. The clause-(b) ladder exits 0
#        on a clean read EVEN WITH rung-3 entries, on purpose, and this job
#        preserves that: a reading's CONTENT never reds this job. What reds it is
#        a refusal (the checkout could not support a reading) or an infra fault
#        (nothing was read). Those are facts about the RUNNER, never about the epic.
#
# WHY THIS IS THE EXCEPTION TO console-harness.yml's "never a live seal run"
#
#   `console-harness.yml`'s seal-predicate step says outright that it runs the
#   predicate's TESTS and never a live seal run, and it is right to: it checks out
#   at actions/checkout@v4's depth-1 default, clause (b) decides ancestry with
#   `git merge-base --is-ancestor`, and under a shallow clone that exits 128 —
#   which the predicate catches as "not an ancestor" and would publish as a false
#   NO SEAL manufactured out of a checkout. That is a statement about DEPTH-1
#   CHECKOUTS, not about live runs.
#
#   This job is the exception because it removes the premise: `fetch-depth: 0`, a
#   tree detached exactly at origin/main, and `seal-run.sh` in front of the
#   predicate REFUSING to hand over a reading if either of those is untrue. The
#   two jobs are not in tension — console-harness declines a reading its checkout
#   cannot support, and this one builds the checkout that can.
#
# WHY THE READING IS `--ladder-only`, AND WHY THAT IS NOT A DODGE
#
#   A FULL verdict needs two things a workflow must not supply unattended:
#
#     * THE LEDGER. Clause (a) fetches the epic's child roster and bucket (c)
#       resolves gate rows over HTTP against ${BP_SERVER}. Unauthenticated, that
#       is an availability dependency on a host this repo does not own; the
#       predicate's own answer to an unreachable ledger is exit 2 INFRA FAULT.
#     * A SUCCESSOR. Clause (a) refuses without `--successor` (NO-SUCCESSOR,
#       predicate exit 3), and naming one from a YAML file is exactly the
#       "manufacture a forwarding address so the run can print SEAL" that charter
#       D83 forbids. A successor is a human claim about where residue goes.
#
#   `--ladder-only` manufactures neither: it names no successor, fetches no
#   roster, makes NO network call, and evaluates neither clause (a) nor bucket
#   (c) — its token says so in its own letters (`a=NOT-READ c=NOT-READ`), and
#   `seal-run.sh` prints `NOT A VERDICT — this is a PARTIAL READING` rather than
#   the word SEAL, so nothing here can be quoted as the seal.
#
#   And it is the reading the full-history checkout actually BUYS. `b-unavailable`
#   is the field wave 28 had in front of it and did not read, it is emitted on the
#   LADDER-ONLY token, and it is non-zero exactly when the checkout is the problem.
#   A depth-1 runner reads `b-unavailable=M/M`; this one is asked to read `0/M`.
#
# THE EVIDENCE THIS JOB PUBLISHES is the token line plus `seal-run.sh`'s own
# closing line, which quotes `head=` and `b-unavailable=` beside the verdict. Both
# go to the step summary so the reading is citable without opening the log.
#
# Related: scripts/seal-run.sh (the runner and its four refusals),
# scripts/seal-run.test.sh (52 mutation proofs, run by shell-harnesses.yml).
#
# SECOND TENANT (task-8390f73ced655243): the last step of the job reads the
# console charter's file:line citation drift against a committed floor. It is
# advisory by the same contract and never touches the seal reading — see the
# comment above that step.

name: Seal reading

on:
  push:
    branches: [main]
  schedule:
    # 06:20 UTC daily. Off the hour on purpose — the top of the hour is the
    # busiest slot on GitHub's shared cron pool and the most likely to be delayed.
    - cron: '20 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One reading at a time. A queued second reading of the SAME main tip adds
  # nothing; cancel-in-progress is false so a reading already under way is never
  # replaced by one of a newer tip mid-flight — a half-taken reading is not a
  # reading, and the newer tip gets its own run.
  #
  # PER MAIN SHA, not one global group. GitHub keeps ONE not-yet-started run per
  # group, so under merge cadence a single `seal-reading` group let each merge
  # evict the PENDING reading before a runner picked it up — the reading per
  # merged state this file exists to take. scripts/main-run-concurrency-check.sh
  # names exactly that (measured 2026-09-13, run 34753745582, step "every
  # main-triggered workflow keeps one group per main sha"). Splitting by sha
  # preserves the intent above verbatim: cancel-in-progress stays FALSE on main,
  # and two readings of the SAME tip still cannot queue behind each other.
  group: seal-reading-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  reading:
    name: Seal reading (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # `ref: main` and NOT the dispatching ref: this job reads the repository's
      # state, so a dispatch from a branch must still read main. `fetch-depth: 0`
      # is the whole point — a shallow clone is refusal 8 and clause (b) cannot
      # evaluate ancestry over one.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # THE GUARDS' DECLARED RUNTIME (task-88edd0348e6f703d). Clause (b) runs
      # each guard on the Node major declared in the __node-version file beside
      # it; cloud/priv/static/__node-version says 20. The ubuntu-24.04 image
      # ships Node 22 on PATH and caches NO Node 20 (setup-node elsewhere in this
      # repo logs "Attempting to download 20..." on these images, a cache miss),
      # so without this step the predicate honestly reports that guard
      # RUNTIME-UNAVAILABLE, b-unavailable=1/6, and seal-run.sh refuses (exit 6).
      # The version is READ from that declaration file, not retyped here, so the
      # guard's pin and this job cannot drift apart.
      - uses: actions/setup-node@v7
        with:
          node-version-file: cloud/priv/static/__node-version

      - name: node is present (the predicate is a node program)
        run: |
          set -uo pipefail
          if ! command -v node >/dev/null 2>&1; then
            echo "CANNOT READ: node is not on this runner. seal-predicate.mjs is a node program, so no reading was taken and none is being reported as clean." >&2
            echo "::error title=Seal reading CANNOT READ::node missing on the runner image"
            exit 1
          fi
          node --version

      # Park the tree EXACTLY at origin/main's tip and prove it here, before
      # seal-run.sh is asked to. actions/checkout leaves HEAD at whatever main was
      # when it fetched; a merge landing in that window would make HEAD stale
      # against a re-fetched origin/main and seal-run would refuse (exit 5) for a
      # reason that is this job's fault and not the repository's. So: fetch the
      # remote-tracking ref, detach onto it, and let the reading describe that.
      # Every failure here is a loud CANNOT READ, never a quiet green.
      - name: park at origin/main tip
        id: park
        run: |
          set -uo pipefail
          if ! git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main; then
            echo "CANNOT READ: could not fetch origin/main. No reading was taken." >&2
            echo "::error title=Seal reading CANNOT READ::git fetch of origin/main failed"
            exit 1
          fi
          sha="$(git rev-parse --verify --quiet origin/main || true)"
          if [ -z "$sha" ]; then
            echo "CANNOT READ: origin/main does not resolve in this checkout. No reading was taken." >&2
            echo "::error title=Seal reading CANNOT READ::origin/main unresolvable"
            exit 1
          fi
          git checkout --quiet --detach "$sha"
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "CANNOT READ: this checkout is SHALLOW despite fetch-depth: 0. Clause (b) ancestry is unaskable here." >&2
            echo "::error title=Seal reading CANNOT READ::shallow checkout"
            exit 1
          fi
          echo "origin_main=$sha" >> "$GITHUB_OUTPUT"
          echo "parked at $sha"

      # THE READING. `set -uo pipefail` WITHOUT `-e` so the case below gets to
      # read `rc` — the same reason console-harness.yml's verdict wrappers give.
      # The output is NOT piped: a pipe would publish the exit code of `tee`'s
      # partner and a gate piped to `tail` reports tail's exit code. It is
      # redirected to a file, the file is `cat`ted, and `rc` is the runner's own.
      - name: take ONE seal reading through scripts/seal-run.sh
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/seal-reading.txt"
          rc=0
          bash scripts/seal-run.sh --repo . -- --ladder-only >"$out" 2>&1 || rc=$?
          cat "$out"

          token="$(grep -m1 '^VERDICT-TOKEN: SEAL-PREDICATE' "$out" || true)"
          closing="$(grep -m1 '^seal-run: read over ' "$out" || true)"
          verdict="$(grep -m1 -E '^seal-run: (VOUCHED|NOT A VERDICT|REFUSED|the )' "$out" || true)"

          # The exit vocabulary is PRESERVED, not collapsed into "the job failed".
          # 0-3 are the PREDICATE's (a reading happened); 4-8 are the RUNNER's
          # refusals (no reading happened, and the cause is the checkout). Only
          # the second kind, plus an infra fault, reds this advisory job — a
          # reading's CONTENT never does (charter D335).
          case "$rc" in
            0) status="READING COMPLETE"; red=0 ;;
            1) status="NO SEAL (measured by the predicate — a reading, not a job failure)"; red=0 ;;
            3) status="PREDICATE REFUSED — it measured nothing"; red=0 ;;
            2) status="INFRA FAULT — nothing was read"; red=1 ;;
            4|5|6|7|8) status="RUNNER REFUSED (exit $rc) — the checkout could not support a quotable reading"; red=1 ;;
            *) status="UNINTERPRETABLE seal-run exit $rc"; red=1 ;;
          esac

          {
            echo "## Seal reading — advisory"
            echo
            echo "- runner exit: \`$rc\` — $status"
            echo "- taken at origin/main tip: \`${{ steps.park.outputs.origin_main }}\`"
            echo
            echo '```'
            [ -n "$token" ] && echo "$token"
            [ -n "$verdict" ] && echo "$verdict"
            [ -n "$closing" ] && echo "$closing"
            [ -z "$token$closing" ] && echo "(no VERDICT-TOKEN and no closing line — see the step log)"
            echo '```'
            echo
            echo "This job is ADVISORY and this reading is \`--ladder-only\`: clause (a) and bucket (c)"
            echo "were NOT read, so nothing here is a seal verdict. See the header of this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$red" -eq 1 ]; then
            echo "::error title=Seal reading — $status::seal-run.sh exited $rc; this is a fact about the RUNNER or the checkout, never a finding about the epic."
            exit 1
          fi
          echo "::notice title=Seal reading — $status::${closing:-no closing line}"

      # ── SECOND TENANT: charter file:line citation drift (owner: lead-console) ──
      #
      # task-8390f73ced655243, child of task-b881189fa7f7395d. The console
      # hardening charter cites `app.js:N`, `app.css:N`, `index.html:N` and
      # `__app.test.mjs:N`; every merge above line N walks the citation off its
      # subject and nothing noticed. scripts/file-line-citation-check.mjs
      # measures that, and this step runs it per target on every main push, on
      # the daily schedule, and on dispatch.
      #
      # WHY IT LIVES IN THIS JOB. It asks the same kind of question this job
      # already asks — one about the REPOSITORY'S STATE, not a PR diff — on the
      # same triggers, and it is console's. A step here renders no new
      # check-run name, so `.github/required-checks.json` needs no new row.
      #
      # ADVISORY, BY CONTRACT: this step NEVER exits non-zero and never changes
      # the seal reading above. `if: !cancelled()` so a seal refusal above does
      # not skip it; `set +e` step-wide because a red here would red the SEAL
      # job, which would make a citation count look like a finding about the
      # epic. Every fault is a ::warning:: CANNOT READ plus a summary line, never
      # a quiet pass. Turning drift into a red is a separate later change, after
      # the hand-repair slices land — and it will be its own job, not this step.
      #
      # THE FLOOR is scripts/file-line-citation-check.floor.json: per target,
      # the `unresolved` count at `derived_at`, with its date and derivation.
      #   now > floor  -> ::warning:: per target, and the NEW misses are named:
      #                   the same checker is re-run over the tree at
      #                   `derived_at` and the two miss sets are diffed by
      #                   `cite [anchors]` (charter line numbers shift, keys
      #                   do not). Each new miss is also annotated on its
      #                   charter line.
      #   now < floor  -> ::notice:: repairs landed; lower the floor in the
      #                   repair's own PR.
      #
      # WHICH TREE IS READ: `github.sha` — the pushed commit on push, main's
      # head on schedule, the dispatching ref's head on workflow_dispatch. NOT
      # the parked origin/main tip above: that park is the seal reading's
      # contract, and reading the dispatched ref is what lets a branch dispatch
      # prove this step on a planted citation before it merges.
      #
      # NEVER PIPE THE CHECKER'S --json. It calls process.exit() before a piped
      # stdout drains and truncates at 65536 bytes (measured: app.js's JSON is
      # ~184 KB; `| wc -c` reads 65536). Every call below redirects to a file.
      # The citation CLASSIFIER's own arms (task-d4448021560b99c5). Unlike the
      # drift step below, this one CAN go red: a failing arm means the
      # classifier's dating or pin search regressed. The job is advisory and
      # gates no merge, and a step adds no check-run name.
      - name: citation classifier self-test (owner lead-console)
        if: ${{ !cancelled() }}
        run: node scripts/file-line-citation-classify.mjs --selftest

      - name: charter file:line citation drift (advisory, owner lead-console)
        if: ${{ !cancelled() }}
        env:
          CITE_SHA: ${{ github.sha }}
        run: |
          set +e
          set -o pipefail
          FLOOR_REL="scripts/file-line-citation-check.floor.json"
          CHECKER_REL="scripts/file-line-citation-check.mjs"
          tree="$RUNNER_TEMP/cite-tree"
          ftree="$RUNNER_TEMP/cite-floor-tree"
          work="$RUNNER_TEMP/cite-work"
          mkdir -p "$work"

          cannot_read() {
            echo "CITATION DRIFT CANNOT READ: $1" >&2
            echo "::warning title=Citation drift CANNOT READ::$1 — no citation reading was taken; this is NOT a clean result."
            {
              echo "## Charter file:line citation drift — advisory (owner: lead-console)"
              echo
              echo "- **CANNOT READ**: $1"
              echo "- nothing was measured; this is not a pass."
            } >> "$GITHUB_STEP_SUMMARY"
            git worktree remove --force "$tree" >/dev/null 2>&1
            git worktree remove --force "$ftree" >/dev/null 2>&1
            exit 0
          }

          command -v node >/dev/null 2>&1 || cannot_read "node is not on this runner"
          command -v jq >/dev/null 2>&1 || cannot_read "jq is not on this runner"
          if ! git cat-file -e "${CITE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --quiet origin "$CITE_SHA" || cannot_read "could not fetch the triggering commit $CITE_SHA"
          fi
          git worktree add --detach --quiet "$tree" "$CITE_SHA" || cannot_read "could not materialise the tree at $CITE_SHA"
          [ -f "$tree/$CHECKER_REL" ] || cannot_read "$CHECKER_REL is absent at $CITE_SHA"
          [ -f "$tree/$FLOOR_REL" ] || cannot_read "$FLOOR_REL is absent at $CITE_SHA"

          floor="$tree/$FLOOR_REL"
          checker="$tree/$CHECKER_REL"
          charter="$(jq -r '.charter // empty' "$floor")"
          fsha="$(jq -r '.derived_at // empty' "$floor")"
          fdate="$(jq -r '.derived_on // empty' "$floor")"
          owner="$(jq -r '.owner // empty' "$floor")"
          ntgt="$(jq -r '.targets | length' "$floor")"
          [ -n "$charter" ] && [ -n "$fsha" ] || cannot_read "$FLOOR_REL has no charter or no derived_at"
          case "$ntgt" in ''|0|*[!0-9]*) cannot_read "$FLOOR_REL lists no targets" ;; esac
          if ! git cat-file -e "${fsha}^{commit}" 2>/dev/null; then
            git fetch --no-tags --quiet origin "$fsha" || cannot_read "the floor's derived_at $fsha is not in this clone"
          fi
          git worktree add --detach --quiet "$ftree" "$fsha" || cannot_read "could not materialise the floor tree at $fsha"

          echo "reading $charter at $CITE_SHA against the floor derived at $fsha ($fdate), owner $owner"
          rows=""; above=0; below=0; faults=0; newlist=""
          i=0
          while [ "$i" -lt "$ntgt" ]; do
            base="$(jq -r ".targets[$i].base" "$floor")"
            tpath="$(jq -r ".targets[$i].path" "$floor")"
            fl="$(jq -r ".targets[$i].unresolved" "$floor")"
            out="$work/now-$i.json"; err="$work/now-$i.err"
            rc=0
            node "$checker" --root "$tree" --charter "$charter" --map "$base=$tpath" --json >"$out" 2>"$err" || rc=$?
            now="$(jq -r '.unresolved // empty' "$out" 2>/dev/null)"
            dec="$(jq -r '.decidable // empty' "$out" 2>/dev/null)"
            if { [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; } || [ -z "$now" ]; then
              faults=$((faults + 1))
              msg="$(head -c 300 "$err" | tr '\n' ' ')"
              echo "::warning title=Citation drift CANNOT READ ${base}::checker exit $rc — ${msg:-no JSON produced}"
              rows="${rows}| \`${base}\` | ${fl} | — | — | CANNOT READ (exit ${rc}) |"$'\n'
              i=$((i + 1)); continue
            fi
            delta=$((now - fl))
            if [ "$now" -gt "$fl" ]; then
              above=$((above + 1)); verdict="**ABOVE FLOOR (+${delta})**"
              # Name the new misses: same checker, the floor's tree, diff by key.
              fout="$work/floor-$i.json"
              node "$checker" --root "$ftree" --charter "$charter" --map "$base=$tpath" --json >"$fout" 2>/dev/null || :
              jq -r '.misses[] | "\(.cite) [\(.anchors | join(","))]"' "$fout" 2>/dev/null | LC_ALL=C sort >"$work/fk-$i"
              jq -r '.misses[] | "\(.cite) [\(.anchors | join(","))]"' "$out" | LC_ALL=C sort >"$work/nk-$i"
              LC_ALL=C comm -13 "$work/fk-$i" "$work/nk-$i" >"$work/new-$i"
              nnew="$(wc -l <"$work/new-$i" | tr -d ' ')"
              echo "::warning title=Citation drift ABOVE FLOOR ${base}::${now} unresolved > floor ${fl} (+${delta}); ${nnew} miss(es) not present at the floor's ${fsha:0:9} — named below and in the step summary. Advisory: this job stays green."
              # One annotation per new miss, on its charter line (first 20).
              jq -r --slurpfile keys <(jq -R . "$work/new-$i" | jq -s .) \
                'limit(20; .misses[] | select(("\(.cite) [\(.anchors | join(","))]") as $k | $keys[0] | index($k))) | "\(.charterLine)\t\(.cite)\t\(.anchors | join(", "))"' \
                "$out" >"$work/ann-$i"
              while IFS=$'\t' read -r cl cite anchors; do
                [ -n "$cl" ] || continue
                echo "::warning file=${charter},line=${cl},title=New stale citation ${cite}::${cite} at charter line ${cl} — none of [${anchors}] lands within +/-3 lines of it in ${tpath}"
                newlist="${newlist}- \`${cite}\` — charter line ${cl}, anchors: ${anchors}"$'\n'
              done <"$work/ann-$i"
            elif [ "$now" -lt "$fl" ]; then
              below=$((below + 1)); verdict="below floor (${delta}) — lower the floor"
              echo "::notice title=Citation drift BELOW FLOOR ${base}::${now} unresolved < floor ${fl} (${delta}): repairs landed. Lower ${FLOOR_REL} in the repair's own PR."
            else
              verdict="at floor"
            fi
            echo "  ${base}: unresolved ${now}/${dec} decidable, floor ${fl} -> ${verdict}"
            rows="${rows}| \`${base}\` | ${fl} | ${now} | ${delta} | ${verdict} |"$'\n'
            i=$((i + 1))
          done

          {
            echo "## Charter file:line citation drift — advisory (owner: ${owner})"
            echo
            echo "- charter: \`${charter}\`, read at \`${CITE_SHA}\`"
            echo "- floor: \`${FLOOR_REL}\`, derived at \`${fsha}\` on ${fdate}"
            echo "- targets above floor: **${above}** · below floor: ${below} · cannot read: ${faults}"
            echo
            echo "| target | floor (unresolved) | now | delta | verdict |"
            echo "|---|---|---|---|---|"
            printf '%s' "$rows"
            if [ -n "$newlist" ]; then
              echo
              echo "### New unresolved citations (not present at the floor's commit)"
              echo
              printf '%s' "$newlist"
            fi
            echo
            echo "Advisory: this step never fails the job. A count is a directional floor on drift, not a census"
            echo "(see the checker's header for its over-credit and over-flag biases)."
          } >> "$GITHUB_STEP_SUMMARY"
          git worktree remove --force "$tree" >/dev/null 2>&1
          git worktree remove --force "$ftree" >/dev/null 2>&1
          exit 0
