name: architecture

# The never-worse gate, pointed at architecture (cqv8).
#
# Rebuilds the symbol graph and runs tooling/concept-map/ci-boundary.mjs, which
# fails on REGRESSION versus tooling/concept-map/boundary-baseline.json — a NEW
# feature→feature sideways edge, a NEW kernel→feature edge, or a NEW feature
# cycle. Existing known debt is grandfathered by the baseline, so it never
# breaks CI; only NEW debt does.
#
# ADVISORY AT FIRST (continue-on-error: true), matching the format-gate
# precedent in ci.yml — the job reports the regression to the PR summary but
# does not block the merge. Flip continue-on-error to false to make it a hard
# gate once the signal has proven stable on real PRs.

on:
  pull_request:
    paths:
      - "api/**"
      - "internal/**"
      - "js/**"
      - "apps/**"
      - "tooling/concept-map/**"
      - "tooling/symbol-graph/**"
      - ".github/workflows/architecture.yml"

permissions:
  contents: read

concurrency:
  group: architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary-gate:
    name: Boundary gate (advisory)
    runs-on: ubuntu-latest
    # Advisory at first — report, don't block. Matches ci.yml's format gate.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # THE PREDICATE'S OWN SELFTEST, BEFORE THE INSTRUMENT IT GOVERNS.
      #
      # ci-boundary.mjs compares only the BASELINE-KNOWN SUBGRAPH and reports
      # growth apart (see the "growth partition" block in that file). That rule is
      # the difference between a gate that reported 108 regressions and meant 8,
      # and one that names the 8. It is a pure function over two JSON shapes, so
      # it is pinned here on synthetic baselines — no symbol graph, no mix, no
      # network, seconds not minutes.
      #
      # DELIBERATELY BEFORE the warm-graph and gate steps: a red here SKIPS them,
      # and that is the intent. A predicate that fails its own both-directions
      # cases must not go on to publish a verdict about the repo.
      #
      # Run through node-test-floor.mjs, not bare `node --test`: a bare run exits
      # 0 on a zero-match glob, on a silently-dropped path, and on a file that
      # registers no tests. The floor asserts a non-zero tally and prints it.
      - name: Boundary predicate selftest
        run: |
          set -euo pipefail
          node scripts/node-test-floor.mjs tooling/concept-map/ci-boundary.test.mjs

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.0"
          elixir-version: "1.18.1"

      # `build-index.mjs` (next step) runs `mix compile` + `mix xref graph` to
      # produce the EXACT module graph. It does NOT fetch deps, so fetch them
      # here first, same as codebase-intel.yml. build-symbols.mjs never compiles
      # anything — it only READS the index build-index.mjs writes.
      - name: Fetch Elixir deps (for mix xref warming)
        working-directory: api
        env:
          MIX_ENV: dev
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      # WARM THE EXACT MODULE GRAPH BEFORE THE GATE READS IT.
      #
      # PROVEN NECESSARY, not assumed: rebuilt at the baseline's own commit
      # 46038fef57 WITH this graph warm, boundary-baseline.json reproduces
      # EXACTLY — 78/13/3, kernel ["content","tenancy"], and all three edge sets
      # byte-identical with zero diff in either direction. Rebuilt COLD at that
      # same commit it gives 56/10/3 with kernel ["content"] only.
      #
      # build-symbols.mjs only READS tooling/blast-radius/index.json; it never
      # builds it, and nothing else in this workflow did either. So until this
      # step existed the gate compared HEURISTIC edges against an EXACT-edge
      # baseline and printed its own confession every run ("no mix-xref graph in
      # index.json — EXACT module edges unavailable ... Proceeding with
      # static/heuristic edges"). Heuristic edges are a strict SUBSET, so the
      # gate UNDERSTATED the debt: 247 sideways on the comparable graph versus
      # the 115 it was reporting. See task-b92f06da17f9fd7e.
      - name: Warm the mix-xref module graph
        run: |
          set -euo pipefail
          START=$(date +%s)
          node tooling/blast-radius/build-index.mjs
          echo "warm-graph-seconds=$(( $(date +%s) - START ))" | tee -a "$GITHUB_ENV"

      # build-index.mjs is BEST-EFFORT BY DESIGN: it catches a failed `mix
      # compile` or `mix xref` and returns null, writing an index with no elixir
      # forward graph and exiting 0. A silent fall-back to cold would restore the
      # exact defect this step exists to remove — and this time with everyone
      # believing it fixed. So assert on the CONTENT, never on the exit code.
      #
      # Faults with exit 2, never 1: 1 is ci-boundary.mjs's REGRESSION code, and
      # an instrument that cannot be warmed has found no architectural debt.
      - name: Assert the warm graph is present
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const P = "tooling/blast-radius/index.json";
            function check() {
              if (!fs.existsSync(P)) return P + " was not written";
              const raw = fs.readFileSync(P, "utf8");
              if (!raw.trim()) return P + " is empty";
              let j;
              try { j = JSON.parse(raw); }
              catch (e) { return P + " is not parseable JSON: " + e.message; }
              const fwd = j.elixir && j.elixir.forward;
              if (!fwd || typeof fwd !== "object")
                return "index.json carries NO elixir.forward graph — mix compile or mix xref failed and build-index.mjs fell back silently";
              const n = Object.keys(fwd).length;
              if (n === 0)
                return "index.json elixir.forward is EMPTY — the xref graph did not build";
              // TWO DIFFERENT COUNTS, DELIBERATELY LABELLED APART.
              // build-index.mjs prints Object.keys(elixir.reverse).length and calls
              // it "files with dependents" — files that ARE depended upon. This step
              // counts elixir.forward — files that HAVE dependencies. Both are
              // correct and they answer different questions, but this line used to
              // reuse that exact wording, so a SINGLE run printed "754 files with
              // dependents" and "657 files with dependents" two steps apart and read
              // as one measurement disagreeing with itself. It cost a real
              // investigation. Print both, name both.
              //
              // NO APOSTROPHES BELOW THIS POINT. The whole script is one
              // single-quoted shell word (node -e '...'); an apostrophe closes it
              // early and truncates the JS mid-comment. That failure is silent in
              // any test that extracts this block and runs it as a FILE — the
              // extraction never applies shell quoting. Exercise it through a shell.
              const rev = (j.elixir && j.elixir.reverse) || {};
              console.log(
                "warm graph OK: " + n + " elixir files WITH DEPENDENCIES (forward edges), " +
                Object.keys(rev).length + " files WITH DEPENDENTS (reverse edges)"
              );
              return null;
            }
            const err = check();
            if (err) {
              console.error("FAULT: " + err);
              console.error("The boundary gate must compare EXACT edges against an exact-edge baseline.");
              console.error("Refusing to run it cold — a cold run silently UNDERSTATES the debt.");
              process.exitCode = 2;
            }
          '

      - name: Run boundary gate
        run: |
          # `set -euo pipefail` is LOAD-BEARING. Actions' unspecified-shell
          # default is `bash -e {0}` — WITHOUT pipefail — and the pipeline below
          # is this step's LAST command, so without pipefail the step's status is
          # always tee's 0. ci-boundary.mjs exits 1 on a boundary REGRESSION and
          # 2 on its own fault; both were being discarded, which left this job's
          # red channel structurally dead and would have made the documented
          # promotion path in the header ("flip continue-on-error to false")
          # mint a gate that cannot fail. The summary step below is `if:
          # always()`, so it still reports when this step reds.
          set -euo pipefail
          node tooling/concept-map/ci-boundary.mjs --json 2>&1 | tee /tmp/boundary-gate.txt

      - name: Report to PR summary
        if: always()
        run: |
          {
            echo "## cqv8 — architecture boundary gate"
            echo ""
            echo "The never-worse gate, pointed at architecture. Fails on NEW"
            echo "feature→feature, kernel→feature, or cycle debt vs the committed"
            echo "baseline. Advisory at first — does not block the merge."
            echo ""
            echo '```'
            if [ -s /tmp/boundary-gate.txt ]; then
              tail -40 /tmp/boundary-gate.txt
            else
              echo "(the gate did not run — see the warm-graph steps above)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
