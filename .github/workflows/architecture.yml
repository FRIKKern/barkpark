name: architecture

# The never-worse gate, pointed at architecture (cqv8).
#
# Rebuilds the symbol graph and runs tooling/concept-map/ci-boundary.mjs, which
# fails on REGRESSION versus tooling/concept-map/boundary-baseline.json — a NEW
# feature→feature sideways edge, a NEW kernel→feature edge, or a NEW feature
# cycle. Existing known debt is grandfathered by the baseline, so it never
# breaks CI; only NEW debt does.
#
# BLOCKING, as of 2026-09-05 (task-6891e8f620c1bdea). It was advisory
# (continue-on-error: true) for its whole life, and the promotion path this
# header documented — "flip continue-on-error to false" — is now taken.
#
# BLOCKING, NOT REQUIRED, and the difference matters. "Boundary gate" reds the
# PR check and is meant to be read as a stop sign, but it is NOT in the required
# set: .github/required-checks.json requires only Cloud gate / Console gate /
# Elixir gate / "PR references an active task", and this change does not touch
# that file or those four context names.
#
# WHAT MAKES BLOCKING POSSIBLE AT ALL is tooling/concept-map/accepted-until-fixed.json:
# today's tree carries real regressions, so a bare flip would have reddened every
# PR for debt nobody on that PR added. That file names each tolerated identity
# WITH THE bp TASK ROW THAT OWES THE FIX, and ci-boundary.mjs runs three arms
# over it so the list decays instead of accumulating: anything unlisted still
# reds; a listed row that is closed while its debt is still present reds; a
# listed identity that has healed reds with "HEALED: delete entry X". An
# unreadable ledger REFUSES (exit 2) rather than passing. It is a TRIPWIRE, not
# an allowlist, and the durable fix is a SHORTER list — never a longer one.

on:
  # THE push:main ARM. Without it this workflow never produces a main-scoped
  # result and never writes a main-scoped Actions cache — which is exactly what
  # the devbuild cache block below records ("this workflow has no `push:` arm,
  # so no main-scoped entry is ever written and a branch can only ever restore
  # its own"). A blocking gate needs both: a verdict for main that is not
  # anybody's PR, and a warm cache every branch can restore from.
  #
  # NO paths: FILTER ON THE push ARM, deliberately. The PR arm filters because a
  # PR that touches nothing architectural need not pay for the graph; main wants
  # the cache warmed and the verdict recorded on every commit that lands.
  push:
    branches: [main]
  pull_request:
    paths:
      - "api/**"
      - "internal/**"
      - "js/**"
      - "apps/**"
      - "tooling/concept-map/**"
      - "tooling/symbol-graph/**"
      - ".github/workflows/architecture.yml"

permissions:
  contents: read

concurrency:
  group: architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundary-gate:
    name: Boundary gate
    runs-on: ubuntu-latest
    # NO continue-on-error. It is gone from the job AND from every step, which is
    # the whole point of this workflow's promotion: while it was set, the
    # Boundary predicate selftest died on every run, "Run boundary gate" was
    # SKIPPED in every run, and the corpse read as green for 1,404 runs
    # (task-6891e8f620c1bdea). A gate that cannot red is not a gate.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22, not 20: scripts/node-test-floor.mjs imports globSync from node:fs
          # (Node 22+, since #14004 on 2026-08-24). On 20 the selftest died with a
          # SyntaxError on every run, every later step was skipped, and the job-level
          # continue-on-error read the corpse as green (task-6891e8f620c1bdea).
          node-version: "22"

      # THE PREDICATE'S OWN SELFTEST, BEFORE THE INSTRUMENT IT GOVERNS.
      #
      # ci-boundary.mjs compares only the BASELINE-KNOWN SUBGRAPH and reports
      # growth apart (see the "growth partition" block in that file). That rule is
      # the difference between a gate that reported 108 regressions and meant 8,
      # and one that names the 8. It is a pure function over two JSON shapes, so
      # it is pinned here on synthetic baselines — no symbol graph, no mix, no
      # network, seconds not minutes.
      #
      # DELIBERATELY BEFORE the warm-graph and gate steps: a red here SKIPS them,
      # and that is the intent. A predicate that fails its own both-directions
      # cases must not go on to publish a verdict about the repo.
      #
      # Run through node-test-floor.mjs, not bare `node --test`: a bare run exits
      # 0 on a zero-match glob, on a silently-dropped path, and on a file that
      # registers no tests. The floor asserts a non-zero tally and prints it.
      - name: Boundary predicate selftest
        run: |
          set -euo pipefail
          node scripts/node-test-floor.mjs tooling/concept-map/ci-boundary.test.mjs

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.0"
          elixir-version: "1.18.1"

      # ── THE api/_build/dev CACHE, AND WHY IT MAY HOLD OUR OWN .beam FILES ──
      #
      # MEASURED, run 33438876591: "Warm the mix-xref module graph" took 125 s
      # of a 177 s job, and effectively all of it is a cold `mix compile` of the
      # ~825 api .ex files. build-index.mjs compiles only when api/_build is
      # ABSENT, and on a fresh runner it always is, so every PR touching api/,
      # internal/, js/, apps/, tooling/concept-map/ or tooling/symbol-graph/
      # paid a full cold compile for an ADVISORY number.
      #
      # TWO CACHE SHAPES WERE AVAILABLE. The dependency-only shape used by
      # elixir.yml's prod-compile job (see "THE DEPENDENCY BUILD CACHE" there)
      # restores `_build/<env>/lib/<dep>` and nothing of ours, which is
      # unimpeachable but buys only the dependency half of the compile. This job
      # needs the other half — our own ~825 modules — so this cache DOES carry
      # first-party .beam files, and that choice has to earn itself:
      #
      #   * The key is runner OS + OTP + Elixir + api/mix.lock, and NOTHING
      #     ELSE — one entry per mix.lock lifetime, exact, no `restore-keys:`.
      #     It deliberately does NOT hash the api sources. It did, through v1,
      #     and that key was WRONG FOR THE SHARED RESOURCE: every api-touching
      #     PR head misses it, recompiles, and writes a BRAND-NEW archive.
      #     MEASURED on run 33739862034: api/_build/dev is 38 MB (39,338,156 B)
      #     and api/deps 6 MB (6,160,722 B). At the 100+ runs/day this workflow
      #     actually sees, a per-push key pushes multiple GB/day through the
      #     repo-wide 10 GB Actions cache, which is LRU — and the things it
      #     would evict are the dependency caches of the REQUIRED Elixir gate.
      #     This job's cache churn must never evict a required job's cache.
      #     Keyed on the lock, a branch writes ONE archive no matter how many
      #     times it is pushed.
      #   * A restored tree can therefore be arbitrarily stale in SOURCES, and
      #     that is the intended, bounded staleness: it can never be stale in
      #     toolchain or in dependency versions, which is the near-miss that
      #     made a prefix match unacceptable in elixir.yml. Note that Actions
      #     cache scoping makes cross-PR reuse impossible here anyway — this
      #     workflow has no `push:` arm, so no main-scoped entry is ever
      #     written and a branch can only ever restore its own.
      #   * A source-only difference is precisely what an incremental
      #     `mix compile` is for, and it is the WHOLE justification for the
      #     lock-only key: mix's compile.elixir manifest records each
      #     source with its digest plus the module-to-module dependencies, and
      #     recompiles every changed file and everything that depends on it.
      #     That is the same guarantee every developer relies on locally against
      #     a build tree far staler than a day-old cache. The workflow runs that
      #     compile EXPLICITLY below rather than leaving it to build-index.mjs,
      #     whose rule is "compile only if _build is absent" — with a restored
      #     _build that rule would skip the compile entirely and hand the graph
      #     builder a stale tree.
      #   * The residue the manifest does not cover — a node that should have
      #     DISAPPEARED because its source was deleted or renamed — is caught by
      #     scripts/boundary-build-cache-tripwire.mjs after the graph is built,
      #     which also refuses to pass over a graph below a node floor. Its own
      #     --selftest runs first, so the tripwire is proven able to fail on
      #     every run of the gate it protects.
      #   * The save is an explicit `actions/cache/save` AFTER the tripwire has
      #     passed, not a post-job hook: a tree the tripwire condemned never
      #     becomes the next run's starting point. A post-job hook would also be
      #     DEAD here — `actions/cache` is `post-if: success()` and this job's
      #     last step exits 1 on every real finding, so nothing would ever be
      #     saved. That was measured, not reasoned: attempt 1 of run
      #     33738585565 skipped every post-job cache save.
      #
      # MIX_ENV IS dev, EVERYWHERE HERE, and that is load-bearing rather than
      # incidental: build-index.mjs runs both `mix compile` and `mix xref graph`
      # with MIX_ENV=dev, so a cache of any other env restores into a tree the
      # warm step never reads and buys exactly nothing.
      #
      # THE ONE THING THIS MUST NEVER BECOME is a reason to drop back to
      # heuristic edges (removing the warm step, or --no-elixir-compile). That
      # was the state that understated the debt for the gate's whole life: 115
      # sideways reported where the comparable figure was 247. A cheap wrong
      # number is worse than a slow right one; the cache exists so the right
      # number gets cheaper, not so a wrong one comes back.
      # RESTORE/SAVE, NOT `actions/cache`, AND THAT IS NOT STYLE. MEASURED on
      # attempt 1 of run 33738585565: `actions/cache` declares
      # `post-if: success()`, and this job's LAST step — the advisory boundary
      # gate — exits 1 whenever it finds architectural debt, which on today's
      # tree it does every run. So the post-job save was SKIPPED, and the next
      # run re-fetched api/deps with fresh mtimes; mix then rebuilt every
      # dependency into the restored `_build/dev`, which is where 93 s of the
      # 98 s warm-run compile went. An explicit save runs before the gate can
      # red. The dependency SOURCES are unconditionally safe to cache: they are
      # exactly what mix.lock names, and the key is that lock.
      - name: Restore Elixir dependency sources
        id: depsrc
        uses: actions/cache/restore@v4
        with:
          path: api/deps
          key: ${{ runner.os }}-boundary-deps-otp27.0-ex1.18.1-${{ hashFiles('api/mix.lock') }}

      - name: Restore the api dev build tree
        id: devbuild
        uses: actions/cache/restore@v4
        with:
          path: api/_build/dev
          key: ${{ runner.os }}-boundary-devbuild-v2-otp27.0-ex1.18.1-${{ hashFiles('api/mix.lock') }}

      # `build-index.mjs` (next step) runs `mix compile` + `mix xref graph` to
      # produce the EXACT module graph. It does NOT fetch deps, so fetch them
      # here first, same as codebase-intel.yml. build-symbols.mjs never compiles
      # anything — it only READS the index build-index.mjs writes.
      - name: Fetch Elixir deps (for mix xref warming)
        working-directory: api
        env:
          MIX_ENV: dev
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      # SAVED HERE, before anything compiles: api/deps holds dependency SOURCES
      # and nothing of ours, and restoring it with its mtimes intact is what
      # stops the next run from recompiling every dependency into the restored
      # build tree.
      - name: Save Elixir dependency sources
        if: steps.depsrc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: api/deps
          key: ${{ runner.os }}-boundary-deps-otp27.0-ex1.18.1-${{ hashFiles('api/mix.lock') }}

      # COMPILE EXPLICITLY, over whatever the cache restored. build-index.mjs
      # compiles ONLY when api/_build is absent, so with a restored tree its own
      # compile branch is dead — this step is what makes an incremental
      # recompile happen at all, and it is the step whose cost the cache is
      # meant to collapse. Same cwd, same MIX_ENV, same command build-index.mjs
      # would have run, so on a cache MISS the work simply moves here and the
      # job costs what it always did.
      #
      # NOT --warnings-as-errors: this is an advisory architecture job, not the
      # compile gate. elixir.yml owns that verdict and must keep owning it.
      - name: Compile the api tree (incremental over the restored cache)
        working-directory: api
        env:
          MIX_ENV: dev
        run: |
          set -euo pipefail
          START=$(date +%s)
          mix compile
          echo "api-compile-seconds=$(( $(date +%s) - START ))" | tee -a "$GITHUB_ENV"
          echo "devbuild-cache-hit=${{ steps.devbuild.outputs.cache-hit }}" | tee -a "$GITHUB_ENV"

      # WARM THE EXACT MODULE GRAPH BEFORE THE GATE READS IT.
      #
      # PROVEN NECESSARY, not assumed: rebuilt at the baseline's own commit
      # 46038fef57 WITH this graph warm, boundary-baseline.json reproduces
      # EXACTLY — 78/13/3, kernel ["content","tenancy"], and all three edge sets
      # byte-identical with zero diff in either direction. Rebuilt COLD at that
      # same commit it gives 56/10/3 with kernel ["content"] only.
      #
      # build-symbols.mjs only READS tooling/blast-radius/index.json; it never
      # builds it, and nothing else in this workflow did either. So until this
      # step existed the gate compared HEURISTIC edges against an EXACT-edge
      # baseline and printed its own confession every run ("no mix-xref graph in
      # index.json — EXACT module edges unavailable ... Proceeding with
      # static/heuristic edges"). Heuristic edges are a strict SUBSET, so the
      # gate UNDERSTATED the debt: 247 sideways on the comparable graph versus
      # the 115 it was reporting. See task-b92f06da17f9fd7e.
      - name: Warm the mix-xref module graph
        run: |
          set -euo pipefail
          START=$(date +%s)
          node tooling/blast-radius/build-index.mjs
          echo "warm-graph-seconds=$(( $(date +%s) - START ))" | tee -a "$GITHUB_ENV"

      # build-index.mjs is BEST-EFFORT BY DESIGN: it catches a failed `mix
      # compile` or `mix xref` and returns null, writing an index with no elixir
      # forward graph and exiting 0. A silent fall-back to cold would restore the
      # exact defect this step exists to remove — and this time with everyone
      # believing it fixed. So assert on the CONTENT, never on the exit code.
      #
      # Faults with exit 2, never 1: 1 is ci-boundary.mjs's REGRESSION code, and
      # an instrument that cannot be warmed has found no architectural debt.
      - name: Assert the warm graph is present
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const P = "tooling/blast-radius/index.json";
            function check() {
              if (!fs.existsSync(P)) return P + " was not written";
              const raw = fs.readFileSync(P, "utf8");
              if (!raw.trim()) return P + " is empty";
              let j;
              try { j = JSON.parse(raw); }
              catch (e) { return P + " is not parseable JSON: " + e.message; }
              const fwd = j.elixir && j.elixir.forward;
              if (!fwd || typeof fwd !== "object")
                return "index.json carries NO elixir.forward graph — mix compile or mix xref failed and build-index.mjs fell back silently";
              const n = Object.keys(fwd).length;
              if (n === 0)
                return "index.json elixir.forward is EMPTY — the xref graph did not build";
              // TWO DIFFERENT COUNTS, DELIBERATELY LABELLED APART.
              // build-index.mjs prints Object.keys(elixir.reverse).length and calls
              // it "files with dependents" — files that ARE depended upon. This step
              // counts elixir.forward — files that HAVE dependencies. Both are
              // correct and they answer different questions, but this line used to
              // reuse that exact wording, so a SINGLE run printed "754 files with
              // dependents" and "657 files with dependents" two steps apart and read
              // as one measurement disagreeing with itself. It cost a real
              // investigation. Print both, name both.
              //
              // NO APOSTROPHES BELOW THIS POINT. The whole script is one
              // single-quoted shell word (node -e '...'); an apostrophe closes it
              // early and truncates the JS mid-comment. That failure is silent in
              // any test that extracts this block and runs it as a FILE — the
              // extraction never applies shell quoting. Exercise it through a shell.
              const rev = (j.elixir && j.elixir.reverse) || {};
              console.log(
                "warm graph OK: " + n + " elixir files WITH DEPENDENCIES (forward edges), " +
                Object.keys(rev).length + " files WITH DEPENDENTS (reverse edges)"
              );
              return null;
            }
            const err = check();
            if (err) {
              console.error("FAULT: " + err);
              console.error("The boundary gate must compare EXACT edges against an exact-edge baseline.");
              console.error("Refusing to run it cold — a cold run silently UNDERSTATES the debt.");
              process.exitCode = 2;
            }
          '

      # THE CACHE TRIPWIRE, and its own mutation harness first. The assert step
      # above proves the graph EXISTS and is non-empty; it cannot tell a graph
      # of today's sources from a graph of yesterday's. This one checks that
      # every api/ file the graph names still exists in the working tree — the
      # one staleness the incremental compile manifest does not make obvious —
      # and faults rather than passing when the graph is below its node floor.
      #
      # --selftest runs FIRST and in-process (5 cases, milliseconds): it plants
      # a ghost path as a graph key and as an edge target and asserts a RED both
      # times, and shrinks the graph to nothing and asserts that cannot buy a
      # pass. A tripwire proven only once at authoring time is not a tripwire.
      - name: Prove the cache tripwire can fail (--selftest)
        run: node scripts/boundary-build-cache-tripwire.mjs --selftest

      - name: Audit the warm graph against the working tree
        run: node scripts/boundary-build-cache-tripwire.mjs tooling/blast-radius/index.json

      # SAVED ONLY AFTER THE TRIPWIRE PASSED, and only when the exact key was
      # not already a hit (a hit means this exact tree is already the cache).
      # A post-job save would archive whatever the job ended with, tripwire
      # verdict or not; this shape means a condemned tree is never what the
      # next run starts from.
      - name: Save the api dev build tree
        if: steps.devbuild.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: api/_build/dev
          key: ${{ runner.os }}-boundary-devbuild-v2-otp27.0-ex1.18.1-${{ hashFiles('api/mix.lock') }}

      - name: Run boundary gate
        env:
          # ARM (b) of the accepted-until-fixed tripwire reads each listed row's
          # lifecycle off the ledger — the SAME door and the SAME secret
          # scripts/pr-task-gate.sh reads (/v1/data/doc/<dataset>/task/<id>). A
          # read it cannot complete is a REFUSAL (exit 2), never a green: an
          # acceptance whose justification could not be checked is an allowlist.
          # Fork PRs receive no secrets, so they refuse rather than pass.
          LEDGER_BASE: ${{ vars.BARKPARK_LEDGER_BASE || 'https://guerrilla.barkpark.cloud' }}
          LEDGER_TOKEN: ${{ secrets.BARKPARK_TASK_TOKEN }}
        run: |
          if [ -z "${BREAKER_CAPTURE_ARMED:-}" ] && [ -f "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" ]; then exec bash "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" "$0"; fi  # main-red breaker: capture this step's error block
          # `set -euo pipefail` is LOAD-BEARING. Actions' unspecified-shell
          # default is `bash -e {0}` — WITHOUT pipefail — and the pipeline below
          # is this step's LAST command, so without pipefail the step's status is
          # always tee's 0. ci-boundary.mjs exits 1 on a boundary REGRESSION and
          # 2 on its own fault; both were being discarded, which left this job's
          # red channel structurally dead and would have made the documented
          # promotion path in the header ("flip continue-on-error to false")
          # mint a gate that cannot fail. The summary step below is `if:
          # always()`, so it still reports when this step reds.
          set -euo pipefail
          node tooling/concept-map/ci-boundary.mjs --json 2>&1 | tee /tmp/boundary-gate.txt

      - name: Report to PR summary
        if: always()
        run: |
          {
            echo "## cqv8 — architecture boundary gate"
            echo ""
            echo "The never-worse gate, pointed at architecture. Fails on NEW"
            echo "feature→feature, kernel→feature, or cycle debt vs the committed"
            echo "baseline."
            echo ""
            echo "BLOCKING, NOT REQUIRED: this check reds the PR, and it is not in"
            echo "the required set (Cloud gate / Console gate / Elixir gate / PR"
            echo "references an active task). Known debt is tolerated only by a"
            echo "named, row-backed entry in tooling/concept-map/accepted-until-fixed.json."
            echo ""
            echo '```'
            if [ -s /tmp/boundary-gate.txt ]; then
              tail -40 /tmp/boundary-gate.txt
            else
              echo "(the gate did not run — see the warm-graph steps above)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
