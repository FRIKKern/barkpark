# Go formatting gate — the gofmt counterpart to elixir.yml's `format` job.
#
# Closes a real gap: the Go CLI/TUI (cmd/, internal/) had NO format enforcement,
# so gofmt drift accumulated silently (12/117 files were dirty when this landed).
# Unlike `mix format` (pinned across skewing Elixir versions, hence advisory),
# gofmt is deterministic. The `gofmt` job below stays ADVISORY as a whole-tree
# WARNING; the honest counter-ratchet is the `gofmt-ceiling` job — a job of its
# OWN (never a step inside the advisory job, or continue-on-error would
# neutralise it too) that reds by name on any NEW off-roster gofmt drift and
# fails closed on a vacuous/zero scan. It reds its own check-run and cannot stop
# a merge: its name is a committed S4 PATHS-FILTERED exclusion in
# .github/required-checks.json, and the token in that name means blocking
# WITHIN this workflow — see the annotation on its job key below.
# See scripts/go-format-drift-ceiling.sh.
name: Go format
#
# TRIGGERS. `pull_request` gates the change; `push: branches: [main]` measures
# the result. Without the push arm the blocking ceiling below had NEVER executed
# on main, so its "green on main" was UNMEASURED and a post-merge gofmt
# regression stayed invisible until the next Go PR happened to arrive.
#
# THE PUSH ARM BUYS MAIN-VISIBILITY, NOT REQUIRABILITY (charter D18). The paths
# filter here is at the WORKFLOW level, so on any head that touches no matching
# path this workflow does not run at all and its check names are ABSENT, not
# skipped — and a required context that is absent never reports, which deadlocks
# every non-matching PR. That is why `gofmt drift ceiling (blocking)` is a
# committed S4 PATHS-FILTERED exclusion in .github/required-checks.json and
# cannot be added to any required-by-name list as written. Making it requirable
# needs the skip-shim treatment elixir.yml uses (job-level `if:` behind a
# dispatcher, workflow-level filter removed), which is a separate slice.
on:
  pull_request:
    paths:
      - "**.go"
      - ".github/workflows/go-format.yml"
      - "scripts/go-format-drift-ceiling.sh"
      - ".go-format-drift-ceiling"
  push:
    branches: [main]
    paths:
      - "**.go"
      - ".github/workflows/go-format.yml"
      - "scripts/go-format-drift-ceiling.sh"
      - ".go-format-drift-ceiling"
permissions:
  contents: read
concurrency:
  # main-collapse: harness-ok — publishes no context in
  # .github/required-checks.json, performs no action, watches nothing.
  # task-e376642d6d69fa3f; the long form is in
  # scripts/main-run-concurrency-check.sh, § THE MAIN-COLLAPSE MARKER.
  #
  # Every main push shares ONE group. GitHub holds at most one pending plus one
  # running run per group, so each merge evicts only the PENDING intermediate —
  # the newest sha always holds that slot, and a RUNNING main run always
  # completes (cancel-in-progress keeps the never-cancel-main guard; D12 is not
  # waived here). The queue therefore holds at most one run of this workflow
  # instead of one per merge; main-push runs were 40%->52%->67%->57% of the
  # whole Actions queue across four samples on 2026-09-06, in front of every PR
  # run. THE RESIDUAL: an intermediate sha gets no verdict from this workflow.
  # Sound only because no job name here appears in .github/required-checks.json —
  # for a context that spec DOES list, or
  # anything that deploys/releases/renews/watches, the marker is REFUSED by
  # scripts/main-run-concurrency-check.sh, which re-derives both facts.
  #
  # PRs are unchanged: their own per-ref group, and they still supersede.
  group: go-format-${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gofmt:
    name: gofmt -l (advisory)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check gofmt
        id: s1
        continue-on-error: true  # main-red breaker: the Decide step below owns the verdict
        run: |
          if [ -z "${BREAKER_CAPTURE_ARMED:-}" ] && [ -f "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" ]; then exec bash "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" "$0"; fi  # main-red breaker: capture this step's error block
          dirty=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))
          if [ -n "$dirty" ]; then
            echo "::warning::gofmt drift in:"; echo "$dirty"
            echo "Run: gofmt -w <files>"; exit 1
          fi
          echo "all Go files gofmt-clean"

      # ── main-red circuit breaker (task-e638b950726fea51) ─────────────────
      # Every gate step above ran with continue-on-error; this step owns the
      # job's verdict. A red that main's newest completed run already carries
      # on the SAME step is INHERITED-FROM-MAIN (exit 0 + notice); any other
      # red stands (exit 1). Never on push to main; never a required context.
      - name: Decide (main-red breaker — inherited reds are neutral, own reds fail)
        if: always()
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
          STEP_NAMES: "{\"s1\": \"Check gofmt\"}"
          JOB_NAME: "gofmt -l (advisory)"
          WORKFLOW_FILE: go-format.yml
          GITHUB_TOKEN: ${{ github.token }}
        # absolute path: jobs with defaults.run.working-directory (api/) ran the
        # relative form from api/ and exited 127 on main 0f6c9937 (2026-09-03).
        run: bash "$GITHUB_WORKSPACE/scripts/main-red-breaker.sh"

  # spec-authority: advisory-ok — the `(blocking)` token is inside the JOB name,
  # which IS this job's rendered check-run context and IS a committed exclusion
  # row (S4 PATHS-FILTERED) in .github/required-checks.json. Renaming it here
  # would silently invalidate that ledger row, which is worse than the
  # overclaim: the row's own reason is a 2000-word account of how this exact
  # name went missing from the merge-authority census once already. The token
  # means "blocking WITHIN this workflow" — the point of the sentence below —
  # and the honest correction belongs in the ledger row's wording, not in a
  # rename that breaks it.
  # BLOCKING — its OWN job (NOT a step in the advisory `gofmt` job, whose
  # continue-on-error would silently declaw it). Shrink-only gofmt drift ceiling:
  # reds by name on any Go file that is gofmt-dirty and NOT on the committed
  # roster (.go-format-drift-ceiling, currently empty = zero tolerance), and
  # fails closed if gofmt is missing or the scan is implausibly small — an empty
  # `gofmt -l` is never accepted as clean without confirming files were scanned.
  gofmt-ceiling:
    name: gofmt drift ceiling (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Enforce the gofmt drift ceiling
        id: s1
        continue-on-error: true  # main-red breaker: the Decide step below owns the verdict
        run: |
          if [ -z "${BREAKER_CAPTURE_ARMED:-}" ] && [ -f "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" ]; then exec bash "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" "$0"; fi  # main-red breaker: capture this step's error block
          bash scripts/go-format-drift-ceiling.sh
      - name: Ceiling self-test (tripwire — prove the gate can fail)
        id: s2
        continue-on-error: true  # main-red breaker: the Decide step below owns the verdict
        run: |
          if [ -z "${BREAKER_CAPTURE_ARMED:-}" ] && [ -f "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" ]; then exec bash "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" "$0"; fi  # main-red breaker: capture this step's error block
          bash scripts/go-format-drift-ceiling.sh --selftest
      # ── main-red circuit breaker (task-e638b950726fea51) ─────────────────
      # Every gate step above ran with continue-on-error; this step owns the
      # job's verdict. A red that main's newest completed run already carries
      # on the SAME step is INHERITED-FROM-MAIN (exit 0 + notice); any other
      # red stands (exit 1). Never on push to main; never a required context.
      - name: Decide (main-red breaker — inherited reds are neutral, own reds fail)
        if: always()
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
          STEP_NAMES: "{\"s1\": \"Enforce the gofmt drift ceiling\", \"s2\": \"Ceiling self-test (tripwire \u2014 prove the gate can fail)\"}"
          JOB_NAME: "gofmt drift ceiling (blocking)"
          WORKFLOW_FILE: go-format.yml
          GITHUB_TOKEN: ${{ github.token }}
        # absolute path: jobs with defaults.run.working-directory (api/) ran the
        # relative form from api/ and exited 127 on main 0f6c9937 (2026-09-03).
        run: bash "$GITHUB_WORKSPACE/scripts/main-red-breaker.sh"

