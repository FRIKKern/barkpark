name: committed-symlink-gate

# NO SYMLINK IS EVER COMMITTED TO THIS REPO.
#
# PR #2907 committed api/deps as mode 120000 pointing at /opt/barkpark/api/deps:
# self-referential on the prod box, DANGLING on every other checkout, where it
# stops `mix` from running at all. The only thing that kept it out of main was a
# LOCAL, UNCOMMITTED .git/info/exclude line on one machine.
#
# PR #12736 fixed the PATTERN (`api/deps/` with a trailing slash cannot match a
# non-directory, so the slashless form was added). That closed one path, not the
# class: .gitignore is not a gate — `git add -f` walks past it — and 30 of the
# 31 trailing-slash patterns in the committed ignore files still fail to match a
# symlink at the same path. This guards the OUTCOME instead.
#
# WHY NO `paths:` FILTER
# ---------------------
# A symlink can be added anywhere, so a paths-filtered lane would only fire when
# the guard's own files changed — which is the shape of a check that is green
# because it never ran. This runs on every pull request. It costs about a second:
# one `git ls-tree` and an awk.
#
# WHY THE SELFTEST RUNS FIRST, IN CI, ON EVERY RUN
# ------------------------------------------------
# A guard against a SILENT defect must not itself be silent-capable. main carries
# zero committed symlinks, so this gate's expected output is "clean" forever —
# exactly the condition under which a broken scanner is indistinguishable from a
# clean tree. --selftest plants symlinks in throwaway repos and proves the gate
# BITES, proves it stays silent without one, and proves it REFUSES TO MEASURE
# (exit 2) rather than reporting a false clean when there is no readable tree.
# It runs before the gate on every invocation, so it cannot rot unexecuted.
#
# NOT one of main's required contexts (those are exactly: Elixir gate, PR
# references an active task, Cloud gate, Console gate). Wiring it here makes it
# RUN, not BLOCK.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: committed-symlink-gate-${{ github.ref }}
  # never cancel a main run — a cancelled run on main leaves no verdict at all,
  # which reads identically to a clean one.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  committed-symlink-gate:
    name: No committed symlinks
    runs-on: ubuntu-latest
    steps:
      # Default checkout is enough BY DESIGN: this reads HEAD's own tree, so it
      # needs no base ref, no merge-base and no history depth — the three ways a
      # diff-based reading goes green on a tree it never saw. On a pull_request
      # the checked-out HEAD is the MERGE commit, so a symlink arriving through
      # the merge is caught too, not just one the branch adds.
      - uses: actions/checkout@v4

      - name: Prove the gate can fail (--selftest)
        run: bash scripts/committed-symlink-check.sh --selftest

      - name: No symlink is committed to this repo
        run: bash scripts/committed-symlink-check.sh
