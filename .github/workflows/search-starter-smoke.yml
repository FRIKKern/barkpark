name: search-starter-smoke

# Browser-level coverage for the search-starter journey (search-template charter
# D59). Before this workflow the Next edition of the template was certified
# EXCLUSIVELY by HTTP status codes and source greps — which is how a red "Search
# failed." banner at first paint, a dead live-search websocket, and 100%
# soft-404 detail routes all shipped and sat live for nine days. Every one of
# them returns HTTP 200.
#
# TWO JOBS, TWO DIFFERENT QUESTIONS, DELIBERATELY NOT MERGED:
#
#   harness-self-test  — "is the smoke harness itself sound?" Runs on every PR
#     that touches the template or the harness. Boots headless Chrome against
#     three IN-PROCESS fixtures (healthy / rotten / dead-socket-but-pretty) with
#     no network at all, and asserts the harness reports green on the first and
#     the exact expected red on the other two. It certifies the INSTRUMENT.
#     Path-filtered, fast, and safe to make a required check.
#
#   live-journey       — "is the deployed demo actually working right now?"
#     Scheduled + manually dispatchable, REPORT MODE, never on a PR. It reaches
#     a live URL, so it can never be a merge gate: a deploy outage is not a
#     property of anybody's diff. Its exit code is always 0 by design; its
#     OUTPUT is the signal. This job IS the rot alarm — the thing whose absence
#     let a broken demo sit unnoticed for nine days.
#
# Two more jobs joined them since: `finder-unit` (dep-free specs over the pure
# helpers the journey depends on) and `graph-smoke` (the corpus graph's own eye —
# is it RENDERED on a desktop, and is a phone sent none of its ~131 KB? — see
# that job's own header for why it is a sibling here and not a new workflow).
#
# The strict live run (`--strict`, exit 1 on any non-PASS beat) is deliberately
# NOT wired here. It is the wave-seal evidence, run by hand after a redeploy;
# scheduling it would red the repo daily for as long as any known defect is
# knowingly in flight, and a gate that cries wolf is disabled within a wave.

on:
  push:
    branches: [main]
    paths:
      - "templates/search-starter/**"
      - "tooling/search-smoke/**"
      - ".github/workflows/search-starter-smoke.yml"
  pull_request:
    paths:
      - "templates/search-starter/**"
      - "tooling/search-smoke/**"
      - ".github/workflows/search-starter-smoke.yml"
  schedule:
    # 06:20 UTC daily — after the nightly content churn, before the working day,
    # so a demo that rotted overnight is named before anyone shows it to anyone.
    - cron: "20 6 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Site base URL to smoke (report mode)"
        required: false
        default: "https://guerrilla.barkpark.cloud/sites/search-ember/"

concurrency:
  group: search-starter-smoke-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  harness-self-test:
    name: Journey smoke — self-test (fixtures, no network)
    # Skip on the schedule: there is no diff to certify at 06:20, and the live
    # job below is the only thing that run exists for.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22: the harness speaks CDP over a bare global WebSocket, which is
      # stable-by-default only from 22. Under 20 it refuses on the GUARD path
      # (exit 2) rather than reporting an environment failure as a site defect.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Syntax-check the harness
        run: node --check tooling/search-smoke/journey-smoke.mjs

      # No setup-chrome action: ubuntu-latest already ships Google Chrome, and
      # findChrome() honours CHROME first. Pinning it explicitly means a future
      # runner image that drops the binary exits 2 as a GUARD naming the missing
      # path, instead of silently falling through to some other browser.
      - name: Self-test (healthy + rotten + dead-socket fixtures)
        env:
          CHROME: /usr/bin/google-chrome
        run: node tooling/search-smoke/journey-smoke.mjs --self-test

  finder-unit:
    name: Finder unit specs (dep-free, no browser)
    # Same reason the astro twin has `astro-search-finder-test`: the browser
    # smoke certifies the JOURNEY, not the pure helpers the journey depends on.
    # `curatePopularQueries` decides what the Popular chip row promises, and the
    # only way to prove "an all-noise pool renders NO row" is to feed it one.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 strips TypeScript types natively — no npm ci, no build step, so
      # this job stays seconds-fast and cannot be broken by a dependency.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Through the floor, never bare `node --test`: a bare run whose glob
      # matches nothing prints "# tests 0" and exits 0, so this job would go
      # green having proven nothing at all.
      #
      # `--floor 12` is a COMMITTED literal, not a derived one. Everything else
      # the runner checks comes out of this same glob, so a partial deletion --
      # 11 of the 12 spec files removed -- shrinks the expectation with the tree
      # and stays green. Twelve cannot shrink without an edit to this line.
      # Adding a spec reds with `raise the floor to 13`; bump it here.
      # Raised 4 -> 12 (measured 2026-09-18: 12 files, 93 tests). The stale 4
      # let 8 files and 51 tests be deleted with this job still green.
      - name: Run the finder unit specs
        working-directory: templates/search-starter
        run: node ../../scripts/node-test-floor.mjs --floor 12 'lib/**/*.test.ts'

  graph-smoke:
    name: Corpus graph renders, and a phone gets none of it (headless chromium)
    # THE GAP THIS CLOSES (task-9f431629b01a4024). templates/search-starter/
    # scripts/graph-smoke.mjs landed in #18895 PROVEN TO MEASURE — its own header
    # records both mutation arms (remove the desktop graph → GDESK fails; drop
    # <DesktopOnly> → GPHONE and GMOUNT fail) — and then fired on nothing,
    # because no workflow invoked it. `git grep graph-smoke origin/main --
    # .github/workflows` was empty. The Astro twin has had its eye since #18872
    # (astro-finder-render-smoke.yml); this is the Next edition's.
    #
    # WHY A SIBLING JOB HERE AND NOT A NEW WORKFLOW FILE. This workflow's
    # triggers already fit: its `on.*.paths:` are templates/search-starter/**,
    # tooling/search-smoke/** and this file — a strict SUPERSET of the graph
    # surface below, so no path this job cares about can be filtered away from
    # it. A new file would buy nothing the filter does not already give and
    # would cost a new row in the shared .github/required-checks.json registry
    # plus a fresh entry in scripts/unaccounted-workflow-ratchet.sh's baseline
    # population. The Next starter's browser coverage belongs next to the
    # journey self-test that is already here.
    #
    # WHY THE SURFACE IS A STEP-LEVEL DECISION, NOT A SECOND `surface` JOB.
    # astro-finder-render-smoke.yml splits surface/smoke across two jobs for a
    # property it buys with its deliberate ABSENCE of any `on.*.paths:` key: the
    # `surface` check renders on EVERY PR, so a reader always sees the gate
    # answer. This workflow is paths-filtered at the workflow level (three other
    # jobs and four rows in .github/required-checks.json already depend on that),
    # so a second job here would be just as absent on a non-matching PR as this
    # one is — it would buy the cost of the split without the visibility. The
    # skip is therefore a named `::notice::` from a step, inside a check that
    # renders wherever the filter lets anything render at all.
    #
    # ADVISORY. `.github/required-checks.json`'s required set is Cloud gate /
    # Console gate / Elixir gate / PR references an active task; this name is in
    # none of them and in no required aggregator's `needs:`, so a red here reds
    # the PR page and blocks no merge.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history a three-dot diff against the base needs. A shallow
          # clone makes `merge-base` unresolvable and the decision below would
          # silently degrade to "everything changed".
          fetch-depth: 0
          # BLOBLESS, not shallow: every commit and tree, blob CONTENTS omitted.
          # `git merge-base` and `git diff --name-only` read commits and trees,
          # so the verdict is bit-identical — and the later steps need real
          # blobs, which a partial clone fetches on demand when they are read.
          filter: blob:none

      - name: Does this diff touch the corpus-graph surface?
        id: decide
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ]; then
            files=$(git diff --name-only "$BASE_SHA...HEAD")
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          else
            # workflow_dispatch, or a first push with no `before`: run it.
            files=""
          fi

          # THE SURFACE. Every path whose change can break what the graph
          # delivers or withholds: the page and the components that mount it
          # (<DesktopOnly>/<GraphLanding>/<GraphView>), the lib the page reads
          # its corpus through, the harness itself and its stub API, `public/`
          # (bp-graph.js, the ~131 KB renderer whose delivery IS the phone
          # claim), the build config, the lockfile pair, and `vendor/*.tgz` —
          # a re-vendored @barkpark tarball is client code wearing a binary's
          # face. Plus this workflow, so editing the job re-runs the job.
          pattern='^templates/search-starter/(app|components|lib|scripts|public|next\.config\.mjs|package(-lock)?\.json|vendor/)|^\.github/workflows/search-starter-smoke\.yml$'

          if [ -z "$files" ]; then
            echo "no base to diff against — running the smoke"
            echo "touched=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed files considered:"
          echo "$files" | sed 's/^/  /'

          # `grep -c` through a pipe returns grep's code, not the pipeline's,
          # and under `set -o pipefail` a legitimate no-match would fail the
          # step. Capture first, test second.
          hits=$(printf '%s\n' "$files" | grep -E "$pattern" || true)
          if [ -n "$hits" ]; then
            echo "graph surface touched:"
            echo "$hits" | sed 's/^/  /'
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "no corpus-graph surface path in this diff — the smoke is skipped, deliberately"
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi

      # D377/D378: a job that concludes success having measured nothing must SAY
      # SO on a surface an API can read. A `::notice::` from a succeeding step is
      # the one thing that reaches the annotations endpoint.
      - name: Announce a skip
        if: steps.decide.outputs.touched != 'true'
        run: echo "::notice title=search-starter graph-smoke::SKIPPED — this diff touches no corpus-graph surface path. Nothing was rendered."

      # Node 22: the template's `engines` pins >=22, and graph-smoke.mjs boots
      # the BUILT `.next/standalone/server.js` that Next 16 emits.
      - uses: actions/setup-node@v7
        if: steps.decide.outputs.touched == 'true'
        with:
          node-version: "22"

      - name: Install the template
        if: steps.decide.outputs.touched == 'true'
        working-directory: templates/search-starter
        # `npm ci`, not `npm install`: the lockfile is committed and the
        # @barkpark/* dependencies are committed tarballs under vendor/, so this
        # resolves without reaching npm for them and cannot drift the lockfile.
        run: npm ci

      # Same cache path, shape and pin the astro twin and paper-rig.yml use.
      # Keyed on the version pinned in the next step rather than on a lockfile:
      # playwright is installed OUTSIDE any package.json (see below), so the pin
      # IS the dependency declaration.
      - name: Cache Playwright browsers
        if: steps.decide.outputs.touched == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.59.1
          restore-keys: |
            ${{ runner.os }}-playwright-

      # GLOBAL, deliberately. templates/search-starter/package.json is the file
      # a user copies to start their own search site; a browser-automation
      # devDependency in it would hand every one of them a ~100MB download in
      # order to gate a defect in THIS repo. graph-smoke.mjs's loadPlaywright()
      # resolves BP_PLAYWRIGHT → js/node_modules → bare specifier → the global
      # root, so a global install is a supported route and the template's own
      # tree is untouched.
      - name: Install Playwright + chromium
        if: steps.decide.outputs.touched == 'true'
        run: |
          set -eu
          npm install --global playwright@1.59.1
          npx playwright install --with-deps chromium
          # The global root is NOT a fixed path under actions/setup-node (it
          # moves with the toolcache). Ask npm where it put the package.
          echo "BP_PLAYWRIGHT=$(npm root -g)/playwright" >> "$GITHUB_ENV"

      # Exit 1 = a beat FAILED, the finding. Exit 2 = CANNOT MEASURE (no
      # playwright, no chromium, the build failed, a port was taken) — ALSO a
      # red, and that is the load-bearing half: a gate that could not run must
      # never read as a pass. No `|| true`, no pipe to `tee`/`head` — either
      # would hand this step the pipeline's last exit code and launder both
      # codes into a green.
      - name: Graph smoke (build → serve → chromium at 1440px and 390px)
        if: steps.decide.outputs.touched == 'true'
        working-directory: templates/search-starter
        run: node scripts/graph-smoke.mjs

  live-journey:
    name: Journey smoke — live demo (report mode, never gates)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # JOB-LEVEL, not workflow-level (cloud.yml's "Report main-push failure"
    # comment explains why): the repo's default_workflow_permissions is read,
    # so the escalation step's issue POST 403s without issues: write — but a
    # workflow-level block would silently re-scope harness-self-test and
    # finder-unit's tokens too. The grant lives on the one job that needs it.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # REPORT MODE. Exit 0 even when beats fail — read the step's output, not
      # its exit code. `|| true` is NOT used and must not be added: the harness
      # already distinguishes a site failure (which it reports and swallows)
      # from an environment failure (exit 2), and `|| true` would erase the
      # second, turning "Chrome is missing" into a silent green forever.
      #
      # The stdout+stderr tee below exists so the NEXT step can read the beats
      # without re-running the journey. `set -o pipefail` is required, not
      # decorative: without it the pipeline's exit status is `tee`'s (always
      # 0), which would silently erase the GUARD exit-2 signal the comment
      # above forbids erasing — that would be `|| true` wearing a tee disguise.
      - name: Live journey report
        id: journey
        env:
          CHROME: /usr/bin/google-chrome
          SMOKE_URL: ${{ github.event.inputs.url || 'https://guerrilla.barkpark.cloud/sites/search-ember/' }}
        run: |
          set -o pipefail
          node tooling/search-smoke/journey-smoke.mjs --url "$SMOKE_URL" 2>&1 | tee "$RUNNER_TEMP/journey-report.txt"

      # THE ALARM. journey-smoke.mjs prints PASS/FAIL beats (from its `report`
      # function) but, by design, always exits 0 for a site failure — so
      # nothing upstream of this step ever goes red for one. This step is what
      # reads the beats instead of the exit code, which is the whole point of
      # running this job at all (see the file header: the rot alarm for the
      # blind spot that let a broken demo sit live for nine days).
      #
      # `always()`: this step itself must run whether the previous one
      # succeeded (every site-failure case — report mode is always exit 0) or
      # failed (a GUARD, exit 2 — an environment failure, not a site defect,
      # and still worth a human). `steps.journey.outcome == 'failure'` is how
      # exit 2 is detected without re-parsing stderr for the word GUARD.
      #
      # Beat detection matches the `report()` line shape exactly:
      # `   ✗ FAIL    NAME    detail` — the mark+FAIL pair appears ONLY on a
      # beat's own line, never on its indented sub-checks (those print a mark
      # and a label with no status word), so this can't double-count.
      - name: Escalate a failing beat to a human
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_FAILURE_KEY: search-starter-live-journey
          SMOKE_URL: ${{ github.event.inputs.url || 'https://guerrilla.barkpark.cloud/sites/search-ember/' }}
          JOURNEY_OUTCOME: ${{ steps.journey.outcome }}
        run: |
          # The run shell here is Actions' UNSPECIFIED default, `bash -e {0}`
          # — errexit ON, pipefail OFF. (Only an explicit `shell: bash` gets
          # `--noprofile --norc -eo pipefail`; this file sets no `shell:` key
          # anywhere.) Do not carry "-eo pipefail" out of here into a new
          # workflow as if pipefail came for free: a `cmd | tee log` written on
          # that belief takes tee's 0 as the step status and launders the real
          # failure. So `+o pipefail` below is a no-op belt; `set +e` is the
          # load-bearing half, and it is deliberate, not a stray habit: a
          # clean all-PASS transcript makes the `grep -E '✗ +FAIL'` below
          # match NOTHING, which exits 1 — and under that -e it
          # would abort this step right there, before it ever reaches the
          # "nothing to escalate" branch below. "no FAIL beat found" is this
          # step's expected happy path, not a script error, so errexit is
          # turned off for exactly this reason (no `|| true` anywhere: the
          # exit code this step ultimately returns is still whatever its own
          # last command returns, same as always).
          set +e +o pipefail
          report_file="$RUNNER_TEMP/journey-report.txt"
          report_text="$(cat "$report_file" 2>/dev/null)"
          # `paste -sd ', ' -` is NOT used: BSD paste (macOS/Darwin runners
          # would be unaffected either way here, but GNU vs BSD semantics
          # differ) treats a multi-char -d as a CYCLING set of single-char
          # delimiters, not one literal separator, so two beat names would
          # join as "TYPE,ENGINE" with the space silently dropped. Join with a
          # bare comma, then widen every comma to ", " — portable either way.
          failing_beats="$(printf '%s\n' "$report_text" | grep -E '✗ +FAIL' | awk '{print $3}' | paste -sd, - | sed 's/,/, /g')"

          if [ "$JOURNEY_OUTCOME" != "failure" ] && [ -z "$failing_beats" ]; then
            echo "journey clean (outcome=$JOURNEY_OUTCOME, no FAIL beats) — nothing to escalate"
            exit 0
          fi

          if [ "$JOURNEY_OUTCOME" = "failure" ]; then
            reason="the harness GUARD-failed before completing the journey (environment failure, exit 2) — see the 'Live journey report' step's own log"
          else
            reason="failing beat(s): $failing_beats"
          fi
          echo "::error title=Live journey smoke is not clean::$reason"

          export CI_FAILURE_DETAIL="$(printf 'The live search-starter journey smoke against %s is not clean.\n\n%s\n\nFull report:\n\n```\n%s\n```\n' "$SMOKE_URL" "$reason" "${report_text:-(no report captured)}")"
          bash scripts/file-ci-failure-issue.sh
