# absent-context-census — dates an ABSENCE, and enumerates the queue behind it.
#
# WHAT WAS SILENT BEFORE THIS FILE, measured 2026-08-07. One open pull request
# had been unmergeable for more than twelve hours with ZERO red checks on it:
# 27 check runs on its head, every one success or skipped, and one member of the
# committed required set rendering nowhere at all because its producing run was
# created and never dispatched (queued, run_attempt 1, jobs.total_count 0). In
# the same sweep a run had been sitting queued since 2026-07-23 at attempt 9 —
# fifteen days — on a branch that will never push again. Nothing in this
# repository reported either fact to anyone.
#
# WHY THIS IS A SCHEDULE, AND ONLY A SCHEDULE
#
# 1. A LEVEL TRIGGER IS THE ONLY ONE THAT FITS THE SUBJECT. A run that never
#    dispatched emits no event. `push` and `pull_request` are edge triggers on
#    somebody else's action, and the fifteen-day specimen above sits on a branch
#    nobody will ever push again — no edge will ever arrive for it. A schedule
#    keeps asking, which is the shape honest-gates D61 settled on for the
#    break-glass scream; .github/workflows/breakglass-watch.yml is the live
#    precedent this file follows.
#
# 2. A `pull_request` TRIGGER WOULD MAKE THIS FILE PART OF THE THING IT WATCHES.
#    scripts/required-checks-generate.sh samples the check-run names rendered on
#    real pull-request heads, so any name emitted there becomes a candidate for
#    branch protection. A census that reads three GitHub endpoints must never
#    become eligible to gate a merge — that is exactly the shape the honest-gates
#    epic refuses. With no `pull_request` trigger this file renders no name on
#    any pull-request head and the generator cannot see it. Verified by running
#    the generator over the whole workflow tree with this file present: the spec
#    it emits is byte-identical to the one it emits without it.
#
# 3. THE JOB NAME BELOW IS A STATIC LITERAL, deliberately. A name carrying a
#    `${{ … }}` expression is refused outright by the blocking required-check
#    spec gate, which reads an uninterpolated name as a catch-all that would
#    claim every context it resembles.
#
# WHY THERE IS NO `continue-on-error` ANYWHERE IN THIS FILE
#
# Job-level `continue-on-error: true` still renders a red check run, but it
# launders the WORKFLOW RUN to success — and the run conclusion is what
# notifications, `gh run list` and the rollup read. This whole file exists
# because a failure that nobody is paged for is indistinguishable from health.
# When the census finds something, this run fails.
#
# THE HARNESS RUNS FIRST, EVERY TIME. scripts/absent-context-census.test.sh is a
# hermetic mutation suite: it disarms each verdict and watches the census go
# green, so an instrument that has quietly lost the ability to report says so
# before it reports. No other lane executes it — this file is its only caller,
# which is precisely why it runs here rather than being trusted.
#
# RESIDUALS, STATED IN NUMBERS RATHER THAN DISCOVERED LATER
#   · a six-hour observation window: an absence can exist for up to six hours
#     before this run names it. The subject rots over days, so that is the
#     trade bought against six API-reading runs a day.
#   · silence during a GitHub Actions outage, which is also when the queue is
#     worst. Nothing here can fix that; it is why the age column is anchored on
#     the queued run's own created_at rather than on this run's clock.
#   · GitHub disables scheduled workflows in a repository with 60 days of no
#     activity. In an idle repository this watch stops without saying so.

name: absent-context-census

on:
  schedule:
    # Four times a day, offset off the hour because GitHub queues cron under
    # load — treat this as "within ~6-7 hours", never "at :17".
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # `checks: read` and `actions: read` are what the three reads need. They are
  # implied by `contents: read` on a public repository, and are named here so a
  # future move to a stricter default token does not silently blind this census.
  checks: read
  actions: read
  pull-requests: read
  # The ONLY write. The final step files this census's red as a GitHub issue
  # through scripts/file-ci-failure-issue.sh, and that needs `issues: write`.
  # Granted at workflow level because this file has exactly one job and the
  # filer runs in it (scheduled-arm-health.yml is the same shape).
  issues: write

concurrency:
  group: absent-context-census
  # NEVER a literal `true`: a schedule that self-cancels under load goes dark
  # exactly when the queue it watches is longest.
  cancel-in-progress: false

jobs:
  absent-context-census:
    name: Absent required-context census
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The instrument's own tripwire. If the census can no longer report, this
      # step says so before any verdict below is believed.
      - name: Prove the census can still fail (hermetic mutation suite)
        run: bash scripts/absent-context-census.test.sh

      - name: Census every open head, and the queue behind them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          rc=0
          bash scripts/absent-context-census.sh || rc=$?

          # One retry, and only for the UNKNOWN verdict. A feed that could not
          # be read is never reported as "found nothing" — but a single 5xx is
          # transport, not a finding, and reddening on it four times a day is
          # how a watch trains the fleet to ignore it.
          if [ "$rc" = "2" ]; then
            echo "::notice::a feed could not be read; retrying once in 60s before calling it"
            sleep 60
            rc=0
            bash scripts/absent-context-census.sh || rc=$?
          fi

          case "$rc" in
            0) echo "every required context renders on every open head, and no run has been queued past the threshold"; exit 0 ;;
            1) echo "::error::A required context renders NOWHERE on an open head, and/or a run has been queued for longer than the threshold. Neither shows up as a red check anywhere else, which is the whole reason this run fails."; exit 1 ;;
            2) echo "::error::The census could not read a feed twice in a row. An unread feed is UNKNOWN, and reporting UNKNOWN as health is the failure this workflow exists to abolish."; exit 1 ;;
            3) echo "::error::CONFIGURATION FAULT — this run's credential cannot read the Actions and check-run endpoints. A census with no authority is not a clean census."; exit 1 ;;
            *) echo "::error::absent-context-census.sh exited $rc, which is not a verdict it defines"; exit 1 ;;
          esac

      # ── THE CARRIER. A RED HERE MUST REACH A HUMAN ─────────────────────────
      #
      # dr-w33-bl-carrier-less-watches-get-a-carrier-or-go. Until this step the
      # header above argued that "a failure that nobody is paged for is
      # indistinguishable from health" and then paged nobody: this file invoked
      # no notifier, carried no push arm (section 7 of the test FORBIDS one),
      # and scripts/cron-scream-coverage.sh scored it UNREAD with a ledger row
      # that read "R3 is the open remedy and is a one-step change". This is
      # that step. Measured before it landed: run 35892264098 (2026-09-23
      # 16:56Z) SCREAMED that PR #16709 had "PR references an active task"
      # rendering nowhere (class NAME_NOT_IN_RUN), failed, and reached no one.
      #
      # THE GUARD IS `failure() || cancelled()` FROM THE START. `failure()` is
      # FALSE on a cancelled run, so a census that was cancelled mid-read would
      # otherwise look exactly like one that read clean — the one confusion this
      # file exists to abolish (dr-w33-s4-alarm-reaches-a-human widened the five
      # older alert steps for the same reason). The ref conjunct keeps a
      # workflow_dispatch debug run on a topic branch from minting a public
      # issue; the schedule arm only ever runs on the default branch.
      #
      # ITS OWN KEY. file-ci-failure-issue.sh dedupes on CI_FAILURE_KEY, so a
      # standing absence appends to ONE issue (and escalates once after
      # ESCALATE_AFTER repeats) instead of opening four a day. The filer exits 1
      # when the alert was NOT delivered, so a failure to file is itself red.
      - name: File the census red to a human
        if: (failure() || cancelled()) && github.ref == 'refs/heads/main'
        env:
          # The filer reads GITHUB_TOKEN, never GH_TOKEN (crown-reconcile's
          # first production scream died on exactly that slip).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_FAILURE_KEY: absent-context-census
          CI_FAILURE_DETAIL: |
            **A required context renders nowhere on an open pull request, and/or
            a workflow run has sat queued past the threshold.** Neither shows up
            as a red check anywhere else, which is why this census exists.

            Read the run log: every ABSENT row names the PR, the context, its
            CLASS and a remedy line; the queue limb names each stale run.

            - `NAME_NOT_IN_RUN` — the producing run executed and carried no job
              of that name (a head predating the context, a renamed job).
              Rebase the PR, or fix the spec. Never re-dispatch.
            - `NO_RUN` — no producing run exists for the head. Push, or close.
            - `ZOMBIED` / stale-queued — a run was created and never
              dispatched. Cancel it or re-run it.
            - exit 2 — a feed could not be read twice in a row (UNKNOWN, not
              clean). exit 3 — the token cannot read the Actions/check-run
              endpoints (CONFIGURATION FAULT).
            - a CANCELLED run files here too: a census that never finished is
              not a clean census.

            Idempotent per key: a standing condition appends a comment rather
            than opening a new issue. CLOSE IT once a run concludes success;
            the next red opens a fresh one.
        run: bash scripts/file-ci-failure-issue.sh
