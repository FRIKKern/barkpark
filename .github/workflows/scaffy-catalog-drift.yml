name: scaffy-catalog-drift

# ACTING drift gate for the served scaffy catalog (scaffy epic W8, charter D100).
#
# SUPERSESSION (D100). This header previously recorded the advisory doctrine
# from the CLI-reliability wave (D6-D7): "drift is a serve-side condition,
# remediation is a HUMAN re-seed, never a CI mutation", enforced with
# `continue-on-error: true`. That doctrine is REFUTED BY ITS OWN HISTORY: the
# tripwire fired on the very merge that introduced it (#11134, run
# 31316266670 — step AND job failed) and on every daily run for ~8 days
# afterwards, while continue-on-error rolled every one of those runs up
# green. An alarm nobody can hear is not advisory — it is silent. Charter
# D100 flips this workflow to an acting gate: it reds the suite hard, and
# when a credential is present it repairs the drift itself. Do not "fix"
# this back to advisory without overturning D100.
#
# HONEST FRAMING. On push-to-main, the daily cron and dispatch this is a
# post-merge WATCHER that reds main's own suite. It ALSO runs on
# pull_request (task dr-w31-bl-served-catalog-drift-is-red-and-unowned), and
# there it is a PRE-MERGE NOTICE, never a gate on the merge: no context this file
# publishes is in .github/required-checks.json, and it must never be — the
# pull_request arm is paths-filtered, and a required name from a
# paths-filtered workflow is never reported on a PR that misses the paths,
# which deadlocks that PR (see the SKIP SHIM warning in go-tests.yml).
#
# WHAT THE PULL_REQUEST ARM ANSWERS. The served catalog is re-seeded from
# main, so it lags any PR that edits a command BY CONSTRUCTION. Two questions
# are therefore kept apart, because a signal that is red on every scaffy PR
# while main is drifted teaches people to ignore it:
#   * "does THIS PR put commands behind the served catalog?" — answered by
#     `seed --impact` over the PR's own changed-file list (scaffy/seed/
#     impact.go attributes each non-MATCH row to a touched corpus file or a
#     touched deriver file, and counts the rest as pre-existing). A NOTICE
#     reds this check and names the commands to re-seed after the merge.
#   * "was main already drifted?" — the full audit still runs and prints the
#     whole table, but on a PR pre-existing drift is a ::warning::, not a
#     red: the PR did not cause it and cannot fix it.
#
# THE PULL_REQUEST ARM CANNOT WRITE. Three independent locks, any one of
# which suffices: (1) the repair step's `if:` excludes pull_request, so on a
# PR it never runs; (2) REPAIR_AUTHORIZED is true only on workflow_dispatch
# with repair=true; (3) the step's BARKPARK_SEED_TOKEN expression yields the
# secret only on workflow_dispatch, so no PR-event step env ever holds it.
# GitHub also withholds repo secrets from fork pull_request runs, and
# `permissions: contents: read` leaves the GITHUB_TOKEN read-only. Skipping
# the repair step on a PR does not green a drifted run by skipping (the trap
# the AUTHORIZATION note below forbids): on a PR the verdict belongs to the
# PR-verdict step, which always runs there.
#
# FAILURE SEMANTICS — the job reds on exactly five conditions:
#   1. SELF-TEST FAILURE (detection) — the hermetic fixture cannot prove the
#      check both passes on a clean corpus and fires on a broken one.
#   2. SELF-TEST FAILURE (repair) — repair-selftest.sh cannot prove
#      scaffy/seed/repair.sh posts the right mutations, clears the E3
#      unknown_tag wall, reds on a refused write, and refuses an empty run.
#   3. UNREACHABLE — the served catalog could not be fetched. A check that
#      cannot check never reports clean; distinguished from DRIFT (no table).
#   4. DRIFT this run is not authorized to repair — either the run is
#      unattended (push/cron) or the operator did not opt in, or repair WAS
#      authorized but no BARKPARK_SEED_TOKEN is present.
#   5. DRIFT, repair ran, and the re-check did not come back green.
# Green means: in sync, or drifted-and-repaired-to-green this run.
#
# WHO MAY WRITE (D100 amendment). Detection runs everywhere; REPAIR runs only
# on a workflow_dispatch carrying repair=true. The repair arm had executed
# ZERO times in this workflow's first 12 runs — every red took the credential
# guard, every green skipped the step — so installing BARKPARK_SEED_TOKEN
# under the old shape would have promoted never-executed shell to an
# UNATTENDED CRON WRITER against production content, with first execution and
# first evidence in the same 06:17 UTC event. Two independent changes fix
# that: the write now needs a human present AND opting in, and the logic
# itself is exercised against a local fixture on EVERY run. This narrows who
# may WRITE, never what the gate SEES — cron and push still detect drift and
# still red hard on it, exactly as D100 requires.
#
# THE AUTHORIZATION CHECK LIVES IN THE STEP BODY, NOT IN ITS `if:`. A step
# skipped by its `if:` concludes SUCCESS; gating authorization there would
# turn every unauthorized DRIFT run GREEN on a drifted catalog. Do not
# "simplify" it into the `if:`.
#
# TOKEN. BARKPARK_SEED_TOKEN is a guerrilla API token; permissions ["write"]
# suffices — /v1/data/mutate rides the require_write gate and publish is a
# plain mutation clause (api/lib/barkpark/content/mutations.ex:203). Minting
# and installing it is the separate human-gated task
# scaffy-backlog-seed-token-mint; until then any DRIFT reds this suite
# honestly instead of pretending health.
#
# HERMETIC SELF-TEST. `seed --check` resolves its host from the `server`
# field of ${XDG_CONFIG_HOME}/barkpark/config.json (scaffy/seed/main.go
# serverURL). The self-test exploits that seam STEP-SCOPED: it derives the
# corpus payloads, assembles the exact query envelope guerrilla would serve,
# serves it from a localhost python http.server, and asserts the check goes
# green on the full corpus AND red (exit 1 + a DRIFT/MISSING table row) on
# the same fixture minus one doc. Zero guerrilla egress, so it can never be
# INCONCLUSIVE for network reasons — and the real audit below runs without
# the override, resolving guerrilla as normal. make-the-check-able-to-fail,
# proven both ways, every run.

on:
  push:
    branches: [main]
    paths:
      - "scaffy/commands/**"
      - "scaffy/seed/**"
      - "internal/scaffy/**"
      - ".github/workflows/scaffy-catalog-drift.yml"
  # PRE-MERGE NOTICE — the SAME paths as push. Never required (see header):
  # a paths-filtered name in the required set deadlocks every PR that misses
  # the paths. Keep this list identical to push's.
  pull_request:
    paths:
      - "scaffy/commands/**"
      - "scaffy/seed/**"
      - "internal/scaffy/**"
      - ".github/workflows/scaffy-catalog-drift.yml"
  schedule:
    # Daily at 06:17 UTC — catches drift introduced out-of-band (a manual
    # server edit, a reverted re-seed) with no corresponding push.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      repair:
        description: "Re-seed drifted commands into the served catalog (WRITES to production content)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: scaffy-catalog-drift-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # LITERAL false — strictly never-cancel. A daily audit has no reason to
  # cancel an in-flight run, and a literal `true` here reds
  # never-cancel-main-check.sh via doc-gates' .github/workflows/** glob
  # (this workflow fires on push-to-main). Keep it false.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  drift:
    name: served-catalog drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request checks out the merge commit; depth 2 brings its first
          # parent (the base tip), so HEAD^1..HEAD is exactly what merging adds.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # honors the pinned toolchain

      # ── Hermetic self-test: prove the check can PASS and can FAIL ─────────
      # Local fixture only — no guerrilla egress. Green path: the full derived
      # corpus audits clean. Red path: the same fixture minus one doc must
      # exit 1 WITH a DRIFT/MISSING table row (not merely a nonzero exit — a
      # fetch failure also exits 1, but prints no table).
      - name: Self-test — hermetic fixture, green and red both proven
        run: |
          set -uo pipefail
          # shellcheck disable=SC1091
          . scripts/lib/bp-curl.sh   # 429 backoff, shared (task-c2f96f8121c64601)
          tmp="$RUNNER_TEMP/scaffy-drift-selftest"
          rm -rf "$tmp"
          mkdir -p "$tmp/fixture/v1/data/query/production" "$tmp/xdg/barkpark" "$tmp/payloads"

          # Derive the corpus payloads (derived artifacts; dir never committed).
          go run ./scaffy/seed --out "$tmp/payloads"

          # Full-corpus fixture: the exact envelope guerrilla would serve if
          # perfectly in sync. It carries EVERY field seeding writes, because
          # that is what fetchServed now decodes and compares: a fixture holding
          # only {_id, source} would green this self-test while proving nothing
          # about the seven derived fields (task-7c037e523ccac6ee).
          jq -s '{result: {documents: map({_id, source, title, description, concept, variant, domain, direction, tags})}}' \
            "$tmp"/payloads/*.json > "$tmp/fixture/v1/data/query/production/command"

          # python3 http.server strips the query string (?limit=100) when
          # mapping the request to a file, so the plain file above serves the
          # exact URL fetchServed builds.
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$tmp/fixture" >/dev/null 2>&1 &
          srv=$!
          trap 'kill "$srv" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            bp_curl_body -sS -o /dev/null "http://127.0.0.1:8765/v1/data/query/production/command" >/dev/null 2>&1 && break
            sleep 0.2
          done

          # STEP-SCOPED server override: only this step's runs resolve the
          # fixture; the real audit below has no override and hits guerrilla.
          printf '{"server":"http://127.0.0.1:8765"}' > "$tmp/xdg/barkpark/config.json"

          # GREEN path — the check must be able to pass.
          # `|| code=$?`, never `; code=$?`: Actions' default run shell is
          # `bash -e {0}`, so a bare failing substitution aborts the step
          # before code is captured.
          code=0
          out="$(XDG_CONFIG_HOME="$tmp/xdg" go run ./scaffy/seed --check 2>&1)" || code=$?
          echo "$out"
          if [ "$code" -ne 0 ] || ! grep -q 'MATCH — catalog in sync' <<<"$out"; then
            echo "::error::SELF-TEST FAILED (green path) — the full-corpus fixture did not audit clean (exit $code); a green from this check cannot be trusted."
            exit 1
          fi

          # RED path — the tripwire must fire on a fixture minus one doc.
          jq 'del(.result.documents[0])' \
            "$tmp/fixture/v1/data/query/production/command" > "$tmp/minus-one.json"
          mv "$tmp/minus-one.json" "$tmp/fixture/v1/data/query/production/command"
          code=0
          out="$(XDG_CONFIG_HOME="$tmp/xdg" go run ./scaffy/seed --check 2>&1)" || code=$?
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "::error::SELF-TEST FAILED (red path) — a fixture missing one doc did NOT red seed --check (the tripwire is blind)."
            exit 1
          fi
          if ! grep -qE '[[:space:]](DRIFT|MISSING)$' <<<"$out"; then
            echo "::error::SELF-TEST FAILED (red path) — exit $code with no DRIFT/MISSING table row; the red was not a drift verdict."
            exit 1
          fi
          echo "self-test OK — hermetic fixture green on the full corpus, red (exit $code + DRIFT/MISSING row) minus one doc; zero guerrilla egress."

      # ── Self-test: prove the REPAIR arm works, before it ever writes ──────
      # The repair logic had executed ZERO times across this workflow's first
      # 12 runs — nine reds took the credential guard above it, three greens
      # skipped the step entirely. That left ~60 lines of never-executed shell
      # one repo secret away from mutating production content, where its first
      # execution would also be its first evidence. repair-selftest.sh drives
      # scaffy/seed/repair.sh against a local fixture server every run and
      # asserts four arms: the happy path posts one atomic
      # createOrReplace+publish batch per id, the E3 unknown_tag 422 wall is
      # cleared by registering tag docs and the retry SUCCEEDS, a refused
      # write REDS instead of being swallowed, and an empty drifted-id list is
      # an ERROR rather than a silent success. Zero egress, zero credentials.
      - name: Self-test — repair arm proven against a local fixture
        run: bash scaffy/seed/repair-selftest.sh

      # ── Real audit: served catalog vs main corpus ─────────────────────────
      # Same audit `make seed-check` runs locally. Verdicts: in sync → green
      # here; UNREACHABLE → hard red here (distinguished from drift: the fetch
      # failed and no table printed); DRIFT → verdict passes to the auto-seed
      # step below, which repairs or reds — it never soft-passes.
      - name: Audit served catalog vs main
        id: audit
        run: |
          set -uo pipefail
          code=0
          out="$(go run ./scaffy/seed --check 2>&1)" || code=$?
          echo "$out"

          summary() { printf '%s\n' "$@" >>"$GITHUB_STEP_SUMMARY"; }
          summary "## scaffy catalog drift gate" ""

          if [ "$code" -eq 0 ] && grep -q 'MATCH — catalog in sync' <<<"$out"; then
            summary "**In sync** — every served command matches the main corpus." \
                    "" '```' "$(grep -E 'MATCH,|MATCH —|catalog drift check' <<<"$out")" '```'
            echo "status=sync" >>"$GITHUB_OUTPUT"
            echo "catalog in sync"
            exit 0
          fi

          if grep -qE '[[:space:]](DRIFT|MISSING|EXTRA)$' <<<"$out"; then
            # Re-seedable ids (DRIFT/MISSING have a local payload; EXTRA has
            # none — only a human retire clears it, so it reds the re-check).
            awk '/[[:space:]](DRIFT|MISSING)$/ {print $1}' <<<"$out" > "$RUNNER_TEMP/drifted-ids.txt"
            summary "**DRIFT** — the served catalog is behind main; the auto-seed step decides the verdict (repair-to-green or hard red)." \
                    "" '```' "$out" '```'
            echo "status=drift" >>"$GITHUB_OUTPUT"
            echo "drift_count=$(awk '/[[:space:]](DRIFT|MISSING|EXTRA)$/ {n++} END {print n+0}' <<<"$out")" >>"$GITHUB_OUTPUT"
            echo "drift detected — the auto-seed step repairs or reds; this exit 0 is a handoff, not a pass."
            exit 0
          fi

          # Nonzero exit and no table row: the audit could not fetch the
          # served catalog. NOT clean and NOT drift — hard red, honestly named.
          summary "**UNREACHABLE** — could not fetch the served catalog (no table printed)." \
                  "A check that cannot check never reports clean. Likely no runner egress to guerrilla.barkpark.cloud." \
                  "" '```' "$out" '```'
          echo "status=unreachable" >>"$GITHUB_OUTPUT"
          echo "::error::scaffy catalog audit UNREACHABLE — served catalog fetch failed; drift status unknown; failing hard."
          exit 1

      # ── Repair (dispatch-only, opt-in, secret-gated) or hard red ──────────
      # DRIFT verdicts land here. The repair itself lives in
      # scaffy/seed/repair.sh and is proven by the self-test above; this step
      # decides only WHETHER it is allowed to run, then judges convergence.
      #
      # DISPATCH-ONLY AND OPT-IN (D100 amendment). Installing
      # BARKPARK_SEED_TOKEN under the old shape would have made never-executed
      # shell an UNATTENDED CRON WRITER against production content — firing at
      # 06:17 UTC with nobody watching. Repair now requires BOTH a
      # human-triggered run (workflow_dispatch) AND an explicit repair=true
      # opt-in, so a person is present and has said the word "write". The cron
      # and push arms still DETECT drift and still red on it; they simply no
      # longer mutate. This narrows who may WRITE, never what the gate SEES —
      # the detection arm is untouched, and D100's hard-red degrade stands.
      #
      # NEVER ON pull_request: the `if:` below excludes it and the secret
      # expression yields '' off workflow_dispatch. A PR's drift verdict is
      # decided by the PR-verdict step after this one, which always runs on a
      # PR — so this skip cannot green a drifted PR.
      - name: Repair drifted commands (dispatch-only, opt-in) or red honestly
        if: steps.audit.outputs.status == 'drift' && github.event_name != 'pull_request'
        env:
          BARKPARK_SEED_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.BARKPARK_SEED_TOKEN || '' }}
          REPAIR_AUTHORIZED: ${{ github.event_name == 'workflow_dispatch' && inputs.repair }}
        run: |
          set -uo pipefail
          summary() { printf '%s\n' "$@" >>"$GITHUB_STEP_SUMMARY"; }

          # AUTHORIZATION IS CHECKED INSIDE THIS STEP, NEVER IN ITS `if:`.
          # A step skipped by its `if:` concludes SUCCESS, so gating
          # authorization there would turn every unauthorized DRIFT run GREEN
          # on a drifted catalog — the exact "satisfiable by skipping" shape
          # this gate exists to refuse. The step must always be REACHED on a
          # DRIFT verdict so that it can red. Keep this check in the body.
          if [ "${REPAIR_AUTHORIZED}" != "true" ]; then
            summary "**DRIFT — not repaired**" \
                    "The served catalog is behind main. Repair is dispatch-only and opt-in, and this run (event \`${GITHUB_EVENT_NAME}\`) is not authorized to write." \
                    "" "To repair: Actions → scaffy-catalog-drift → Run workflow, with **repair = true**."
            echo "::error::DRIFT — the served catalog is behind main and this run is NOT authorized to repair it (event=${GITHUB_EVENT_NAME}; repair opt-in absent). Detection is working; the write is deliberately withheld from unattended runs. Failing hard. To repair: dispatch this workflow manually with repair=true."
            exit 1
          fi

          if [ -z "${BARKPARK_SEED_TOKEN:-}" ]; then
            echo "::error::DRIFT — repair was authorized for this run, but the runner holds no credential (BARKPARK_SEED_TOKEN absent; minting is task scaffy-backlog-seed-token-mint). Failing hard."
            exit 1
          fi

          # Matches seed --check's defaultServer — the runner has no
          # barkpark/config.json, so the audit above resolved the same host.
          server="https://guerrilla.barkpark.cloud"

          # Fresh payloads for the re-seed (scaffy/seed/out is gitignored).
          go run ./scaffy/seed

          SERVER="$server" \
          BARKPARK_SEED_TOKEN="$BARKPARK_SEED_TOKEN" \
          DRIFTED_IDS_FILE="$RUNNER_TEMP/drifted-ids.txt" \
          PAYLOAD_DIR="scaffy/seed/out" \
          WORK_DIR="$RUNNER_TEMP/repair-work" \
            bash scaffy/seed/repair.sh || exit 1

          # The repair only counts if the audit itself comes back green.
          code=0
          out="$(go run ./scaffy/seed --check 2>&1)" || code=$?
          echo "$out"
          if [ "$code" -eq 0 ] && grep -q 'MATCH — catalog in sync' <<<"$out"; then
            summary "**Repaired** — drift re-seeded on an operator-dispatched run and the re-check is green." \
                    "" '```' "$(grep -E 'MATCH,|MATCH —|catalog drift check' <<<"$out")" '```'
            echo "repair converged — served catalog back in sync."
            exit 0
          fi
          summary "**NOT CONVERGED** — repair ran but the re-check is still red (EXTRA rows need a human retire; see scaffy/seed/README.md)." \
                  "" '```' "$out" '```'
          echo "::error::repair did not converge to green (re-check exit $code) — failing hard."
          exit 1

      # ── PR verdict: drift THIS PR adds vs drift main already has ──────────
      # pull_request only; no secret in env, nothing written anywhere but the
      # step summary. `seed --impact` reads the PR's changed-file list and
      # bills a non-MATCH row to the PR only when a touched corpus file backs
      # it or a touched deriver file can explain its fields (scaffy/seed/
      # impact.go). Exit codes are its contract: 0 QUIET, 2 CANNOT READ,
      # 3 NOTICE. Built to a binary first because `go run` collapses every
      # nonzero child exit to 1, which would erase 2-vs-3.
      - name: PR verdict — drift this PR adds vs drift main already has
        if: github.event_name == 'pull_request'
        env:
          AUDIT_STATUS: ${{ steps.audit.outputs.status }}
          AUDIT_DRIFT: ${{ steps.audit.outputs.drift_count || 0 }}
        run: |
          set -uo pipefail
          summary() { printf '%s\n' "$@" >>"$GITHUB_STEP_SUMMARY"; }
          summary "" "## PR verdict (pull_request arm)"

          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          if [ ! -s "$RUNNER_TEMP/changed.txt" ]; then
            echo "::error::PR verdict CANNOT READ — empty changed-file list for HEAD^1..HEAD; refusing to call it quiet."
            exit 1
          fi
          echo "changed paths:"; cat "$RUNNER_TEMP/changed.txt"

          go build -o "$RUNNER_TEMP/seed" ./scaffy/seed || exit 1
          code=0
          out="$("$RUNNER_TEMP/seed" --impact --changed-files "$RUNNER_TEMP/changed.txt" 2>&1)" || code=$?
          echo "$out"

          # Rows the notice bills to THIS PR (0 unless NOTICE); everything else
          # the merge-tree audit found is drift main already carried.
          billed=0
          if [ "$code" -eq 3 ]; then
            billed="$(awk '$2 ~ /^(DRIFT|MISSING|EXTRA)$/ && /^  [^ ]/ {n++} END {print n+0}' <<<"$out")"
          fi
          pre=$(( AUDIT_DRIFT - billed ))
          if [ "$pre" -gt 0 ]; then
            echo "::warning::PRE-EXISTING DRIFT — ${pre} served command(s) were already behind main before this PR (the audit step's table names them). Not billed to this PR; a re-seed from main clears them (dispatch repair=true)."
            summary "**Pre-existing drift: ${pre}** — already behind main before this PR; not billed to it."
          fi

          case "$code" in
            0)
              echo "PR verdict: QUIET — this PR adds 0 drifted command(s); ${pre} pre-existing on main (merge-tree audit: ${AUDIT_STATUS:-unknown}, ${AUDIT_DRIFT} non-MATCH)."
              summary "**QUIET** — this PR adds no served-catalog drift."
              exit 0 ;;
            3)
              summary "**NOTICE** — merging this PR puts commands behind the served catalog." "" '```' "$out" '```'
              echo "::error::PR verdict: NOTICE — merging this PR puts ${billed} command(s) (named above) behind the served catalog. Not a merge gate (this check is not required); after the merge, dispatch scaffy-catalog-drift with repair=true, or main's push run reds on the same drift."
              exit 1 ;;
            *)
              summary "**CANNOT READ** (exit $code) — not a clean bill of health." "" '```' "$out" '```'
              echo "::error::PR verdict: CANNOT READ (seed --impact exit $code) — the check could not decide; this is NOT \"no drift\"."
              exit 1 ;;
          esac
