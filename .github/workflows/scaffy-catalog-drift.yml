name: scaffy-catalog-drift

# ADVISORY tripwire for served-catalog drift (CLI-reliability wave, charter D6-D7).
#
# THE GAP THIS CLOSES. The served scaffy catalog on guerrilla.barkpark.cloud is
# seeded by a HUMAN running the two bp verbs after amending a scaffy/commands/*
# file — no deploy path and no CI job runs `go run ./scaffy/seed --check`. So a
# merged .scaffy edit that skips the re-seed leaves the served catalog silently
# behind main (it happened: #5787/#5788 left `seed --check` RED on main for days
# until a manual re-seed on 2026-07-23 13:56Z). This workflow makes that drift
# VISIBLE on every corpus change and once a day.
#
# WHY ADVISORY (never a gate). Drift is a SERVE-SIDE condition, not a defect in
# the pushed diff — a correct commit is exactly what CANNOT clear it (the fix is
# a human re-seed, never a CI mutation). So the job carries
# `continue-on-error: true`: it reports, it never blocks a merge. And it is
# TOKENLESS by design — `seed --check` reads the PUBLISHED perspective with a
# plain unauthenticated GET, so no guerrilla credential is ever provisioned into
# CI.
#
# WHY THE SELF-TEST. `seed --check` exits 1 on drift AND on a network failure
# (a check that cannot check must never report clean). To trust a GREEN we must
# first see the tripwire actually FIRE this run: the self-test mutates one
# corpus file in the ephemeral checkout, asserts exit 1 AND a DRIFT table row
# (not merely the exit code — a fetch failure exits 1 with no table), then
# restores it. make-the-check-able-to-fail, proven every run.

on:
  push:
    branches: [main]
    paths:
      - "scaffy/commands/**"
      - "scaffy/seed/**"
      - "internal/scaffy/**"
      - ".github/workflows/scaffy-catalog-drift.yml"
  schedule:
    # Daily at 06:17 UTC — catches drift introduced out-of-band (a manual
    # server edit, a reverted re-seed) with no corresponding push.
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: scaffy-catalog-drift-${{ github.ref }}
  # LITERAL false — strictly never-cancel. A daily/advisory audit has no reason
  # to cancel an in-flight run, and a literal `true` here reds
  # never-cancel-main-check.sh via doc-gates' .github/workflows/** glob
  # (this workflow fires on push-to-main). Keep it false.
  cancel-in-progress: false

jobs:
  drift:
    name: served-catalog drift audit (advisory)
    runs-on: ubuntu-latest
    # ADVISORY: this job reports drift, it NEVER gates a merge. Drift is a
    # serve-side condition remediated by a human re-seed, not by the diff.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # honors the pinned toolchain

      # ── Self-test: prove the tripwire CAN fail, this run ──────────────────
      # Mutate one corpus file, assert `seed --check` reds with a DRIFT row,
      # then restore. A trap guarantees restoration even if an assertion aborts.
      - name: Self-test — drift must red with a DRIFT row
        run: |
          set -uo pipefail
          target="$(ls scaffy/commands/*.scaffy | sort | head -n1)"
          echo "self-test target: $target"
          restore() { git checkout -- scaffy/commands/ 2>/dev/null || true; }
          trap restore EXIT

          printf '\n# scaffy-catalog-drift self-test marker\n' >> "$target"
          out="$(go run ./scaffy/seed --check 2>&1)"; code=$?
          restore; trap - EXIT
          echo "$out"

          if [ "$code" -eq 0 ]; then
            echo "::error::SELF-TEST FAILED — a mutated corpus file did NOT red seed --check (the tripwire is blind)."
            exit 1
          fi
          if ! grep -qE '[[:space:]]DRIFT$' <<<"$out"; then
            # exit 1 but no DRIFT row = the served catalog was UNREACHABLE, not
            # drift. We cannot prove the tripwire fires this run; surface it,
            # but the advisory job continues (continue-on-error).
            echo "::warning::SELF-TEST INCONCLUSIVE — seed --check exited $code with no DRIFT table row; the served catalog was likely UNREACHABLE (no Actions egress to guerrilla.barkpark.cloud). Tripwire fire not proven this run."
            exit 1
          fi
          echo "self-test OK — mutation produced exit $code and a DRIFT row; tripwire proven able to fail."

      # ── Real check: served catalog vs main corpus ────────────────────────
      # Runs the same audit `make seed-check` runs locally. The summary
      # distinguishes UNREACHABLE (fetch failed, no table) from DRIFT DETECTED
      # (table rows) from in-sync, so an advisory red is never ambiguous noise.
      - name: Audit served catalog vs main
        run: |
          set -uo pipefail
          out="$(make seed-check 2>&1)"; code=$?
          echo "$out"

          summary() { printf '%s\n' "$@" >>"$GITHUB_STEP_SUMMARY"; }
          summary "## scaffy catalog drift audit" ""

          if grep -qE 'MATCH — catalog in sync' <<<"$out" && [ "$code" -eq 0 ]; then
            summary "**In sync** — every served command matches the main corpus." \
                    "" '```' "$(grep -E 'MATCH,|MATCH —|catalog drift check' <<<"$out")" '```'
            echo "catalog in sync"
            exit 0
          fi

          if grep -qE '[[:space:]](DRIFT|MISSING|EXTRA)$' <<<"$out"; then
            summary "**DRIFT DETECTED (advisory)** — the served catalog is behind main." \
                    "Remediation is a HUMAN re-seed of the touched commands — see \`scaffy/seed/README.md\`. Never a CI mutation." \
                    "" '```' "$out" '```'
            echo "::warning::scaffy catalog drift detected — re-seed the touched commands per scaffy/seed/README.md (advisory; does not block merges)."
            exit 1
          fi

          # exit != 0 and no drift table = the audit could not reach the served
          # catalog. Honest UNREACHABLE, not a clean bill and not drift.
          summary "**UNREACHABLE (advisory)** — could not fetch the served catalog (no table printed)." \
                  "This is NOT a clean result and NOT drift — the audit could not run. Likely no Actions-runner egress to guerrilla.barkpark.cloud." \
                  "" '```' "$out" '```'
          echo "::warning::scaffy catalog audit UNREACHABLE — served catalog fetch failed; drift status unknown this run."
          exit 1
