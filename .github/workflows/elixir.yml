name: elixir

# Phase 2 / WI4 — Elixir CI gate.
#
# Jobs:
#   0. changes          — the DISPATCHER. Always runs. Computes the changed-path
#                         set against the PR base and emits the two booleans the
#                         expensive jobs are gated on. (Honest Gates D18/D31.)
#   1. format           — `mix format --check-formatted`. ADVISORY (see the
#                         continue-on-error note on the job). Runs first so
#                         drift is visible in <60s without spinning up
#                         Postgres or compiling. (Task #29 — see PR #58/#59
#                         mix-format hotfixes.)
#   2. mix-test         — dev-mode compile + test suite. Blocking gate.
#   3. mix-prod-compile — repeats compile with MIX_ENV=prod and a clean
#                         _build/prod, --warnings-as-errors enforced.
#   4. validation-perf  — the cross-field validation perf bench. Blocking.
#   5. path-escape      — the path ratchet + its harness. Unfiltered, blocking.
#                         The JOB is unfiltered; the harness STEP alone is
#                         conditioned on the diff reaching it (see there).
#   6. elixir-gate      — the AGGREGATOR. The one name that should be REQUIRED.
#
# ── THE SKIP SHIM (Honest Gates wave 2, charter D18/D19/D31) ────────────────
#
# THIS WORKFLOW MUST NEVER GAIN A WORKFLOW-LEVEL `on: … paths:` KEY.
#
# Measured on live GitHub: a paths-filtered workflow emits NO workflow run and
# NO check run at all. A branch-protection rule requiring a name from such a
# workflow leaves the PR `BLOCKED` forever — and even `gh pr merge --admin` is
# refused, with a message that differs from a real red:
#     Required status check "X" is expected.   <- never reported: deadlock
#     Required status check "X" is failing.    <- an actual red
# A docs-only PR would deadlock the repo permanently. So path decisions are
# made at JOB level, behind the always-running `changes` dispatcher.
#
# A job skipped by a job-level `if:` DOES publish a check run, with conclusion
# `skipped`, and GitHub counts `skipped` as PASSING for a required context.
# That is what makes the shim work — and it is also the trap: a job whose
# `needs` dependency FAILED reports `skipped` too, so a naive needs-chain
# converts an upstream FAILURE into a green required context. `if: always()`
# alone does not save you either; a probe aggregator ran with a failed
# dependency and reported `success` because it merely echoed the result instead
# of asserting on it. `if: always()` buys the RIGHT TO DECIDE; it does not
# decide. Hence `elixir-gate` below, which enumerates every upstream result and
# fails on anything outside an explicit allow-set.
#
# The path sets themselves live in scripts/elixir-path-escape-check.sh, not
# here, for one reason: that script is also the RATCHET that re-derives the
# suite's real cross-tree reads from the working tree and fails when one is not
# dispatched on. One declaration, so the filter and its proof cannot drift.
#
# Why a dedicated `format` job? The format check used to live inside
# `mix-test`, which was `continue-on-error: true` while the test suite was
# being remediated (mix-test is a blocking gate today). That meant
# unformatted code merged twice (PR #58, PR #59) and required follow-up
# "mix format pass" PRs. Splitting format out into its own fast job — the
# standard Elixir/Phoenix CI pattern — closed that hole.
#
# Why a separate prod-compile job?
# PR #42 (Phase 1) introduced a `runtime.exs` `when`-guard that referenced a
# macro. The construct is legal in :dev but rejected only by the prod compiler,
# so static review and `mix test` both passed; production compile failed and
# required the PR #43 hotfix. From this slice forward every PR must clear a
# clean MIX_ENV=prod compile before merge. See docs/ops/merge-gates.md and
# CLAUDE.md "Past Mistakes" for the full post-mortem.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # One group per PUSH SHA on main, per REF everywhere else. GitHub keeps ONE
  # not-yet-started run per group, so a shared main group meant every merge
  # evicted the previous main run before a runner picked it up — measured
  # 2026-09-02: 37 of 40 main runs since 10:27Z cancelled, 1 completed. A
  # per-sha group lets every main run complete; the cost is one run per merge,
  # which is what this workflow already intends. PR refs keep superseding.
  group: elixir-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # Cancel superseded PR runs, but NEVER cancel main: fast push cadence
  # otherwise starves the suite (2026-06-10: 19 consecutive main runs
  # cancelled, zero completions all day).
  #
  # WHAT THIS GUARD DOES NOT BUY, MEASURED 2026-08-23 (hg-pending-run-collapse).
  # `cancel-in-progress: false` suppresses ACTIVE cancellation of a main run
  # that has STARTED. It does not stop GitHub collapsing the PENDING queue:
  # a concurrency group holds at most one running plus one pending run, and the
  # arrival of a newer push evicts the older pending one, which is recorded as
  # `cancelled`. That is a NON-PASS (charter D12) on a run nobody cancelled.
  #
  # PROVEN PENDING, NOT IN-PROGRESS — this is the discriminating evidence, and
  # the earlier comment ("Queued main runs collapse to one") asserted the
  # mechanism without it:
  #   * 36 of the last 100 elixir.yml runs on main concluded `cancelled`, and
  #     36 of 36 materialized ZERO jobs (`/actions/runs/<id>/jobs` total_count
  #     = 0) — they never started.
  #   * 35 of 35 of those with a successor in the window died within 5 seconds
  #     of the NEXT run's created_at. Eviction by arrival, not by a signal.
  #   * CONTROL, same query: non-main cancelled runs, where cancel-in-progress
  #     is true, report 7 jobs with all 7 started. The instrument can tell the
  #     two shapes apart, and an impossible run id 404s rather than reading 0.
  #
  # AND IT IS NOT A MERGE BLOCK. A collapsed run publishes NO check-run at all,
  # so `Elixir gate` is ABSENT on that sha, never `failure` — verified on five
  # collapsed shas. The cost is a VERIFICATION HOLE, not an unexplainable red:
  # those main commits were never Elixir-verified at their own sha. The newest
  # push in a burst always survives (collapse only evicts OLDER pending runs)
  # and it verifies the cumulative tree, so main's CURRENT health is still
  # measured; what is lost is per-commit granularity for bisection.
  #
  # THE REMEDY IS DELIBERATELY NOT TAKEN, and the reasoning is recorded here so
  # the next reader does not re-litigate it. `group: elixir-${{ github.sha }}`
  # removes collapse entirely, but it is the wrong trade at this cadence: the
  # bursts that cause collapse are 3-4 pushes inside 60 seconds, so it would put
  # 3-4 concurrent 7-job suites (21-28 jobs) against an account concurrency cap,
  # where they queue at the ACCOUNT level instead — reproducing the 2026-04-26
  # "queued forever" condition that cancel-in-progress used to mask, and risking
  # the 2026-06-10 starvation this guard exists to prevent. Queue-with-no-
  # collapse is not expressible in GitHub concurrency today. Collapse is
  # load-shedding that keeps the newest tree verified; per-sha grouping buys
  # bisection granularity at the price of the suite completing at all.
  #
  # scripts/never-cancel-main-check.sh forbids the ACTIVE-cancel shape and
  # cannot see this one — do not read its green as covering collapse.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    # THE DISPATCHER. No `if:`, no matrix, no path filter — it runs on every
    # event, always, so the jobs behind it always have a defined answer.
    #
    # It never emits `false` when it cannot tell. On an unresolvable base, a
    # base with no common ancestor, or an uninterpretable verdict it FAILS; on
    # an empty diff — rare but legal — it dispatches TRUE. That polarity is the
    # whole point: a dispatcher that "couldn't tell" and emitted all-false would
    # skip the entire Elixir suite and publish a green required context.
    # Never a silent false: fail, or run everything.
    name: Dispatch (changed-path sets)
    runs-on: ubuntu-latest
    outputs:
      compile: ${{ steps.sets.outputs.compile }}
      test: ${{ steps.sets.outputs.test }}
    steps:
      - uses: actions/checkout@v4
        with:
          # THE PR HEAD, not the merge ref. With no `ref:`, checkout lands on
          # `refs/pull/N/merge` — a commit that already contains main's advance
          # — while `pull_request.base.sha` LAGS the base branch tip. The
          # three-dot diff below then sweeps in every commit main gained since
          # that stale base: PR #6427 changed ONE docs file and this dispatcher
          # printed TEN, so the docs-only skip had never once fired (charter
          # D34). Pinning the head sha makes the diff describe THIS PR.
          #
          # This job ONLY. Every other job here deliberately keeps the merge
          # ref: they must test the merged result, not the head in isolation.
          # `github.sha` is the fallback for `push` events, which have no PR.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # FULL HISTORY, BLOBLESS. These two options are ORTHOGONAL and this
          # job needs both — DEPTH and FILTER are different axes, and confusing
          # them is exactly how this was first written and reverted on the four
          # sibling dispatchers (run 33691239048, three of four red on `PR base
          # <sha> and HEAD share NO common ancestor`).
          #
          # `fetch-depth: 0` — REQUIRED, do not drop it. The PR base sha must be
          # resolvable locally for the three-dot diff below, and a three-dot
          # diff resolves the MERGE BASE; a shallow history cannot compute one,
          # and this step treats an unresolvable base as a hard failure rather
          # than emit a verdict. Dropping this line does NOT leave "whatever the
          # filter gives you": actions/checkout then applies its DEFAULT depth
          # of 1, and a depth-1 clone — blobless or not — has no merge base.
          # `fetch-depth: 2` does not rescue it either; that trick works on jobs
          # sitting on `refs/pull/N/merge`, where HEAD^1 IS the base, and this
          # job deliberately is not one of those (see the `ref:` note above).
          #
          # `filter: blob:none` — the actual saving, and it is NOT shallowness.
          # A blobless partial clone fetches every commit and every tree and
          # omits only blob CONTENTS. `git diff --name-only` reads trees, not
          # blobs, so the commit graph, the merge base and the path sets below
          # are unchanged BY CONSTRUCTION rather than by benchmark.
          #
          # THE DERIVATION, NOT A BARE NUMBER — this comment already rotted once
          # exactly that way. It used to claim "Measured cost of depth 0 over
          # depth 1 in this repo: ~3 seconds"; by 2026-09-02 this Dispatch job's
          # own checkout was 22 s (of which "Fetching the repository" 21 s)
          # against 5-9 s for a default shallow one, so the repo grew ~6x past
          # the number and the number did not move. Replacing it with a fresher
          # BARE number would just restart the same clock. So: the command, the
          # figures, and the date. Re-run it:
          #     bash scripts/dispatch-blobless-proof.sh
          # It clones this repo both ways at FULL depth, compares the three-dot
          # changed-path sets by SORTED CHECKSUM, and refuses to report a pass
          # if a sample is empty on both sides (two empty sets match, which
          # would be vacuous). Read here 2026-09-03, re-running it rather than
          # copying #15700's line: full clone 130 s / .git 695 MB, blobless 36 s
          # / .git 189 MB, 5 sampled PRs (#14874 #15372 #15453 #15234 #15572)
          # IDENTICAL on both sides. #15700's four files record 138 s / 791 MB
          # and 34 s / 189 MB from the same day — the spread between two honest
          # runs is the reason this comment ships a COMMAND and not a constant.
          fetch-depth: 0
          filter: blob:none

      - id: sets
        name: Compute the changed-path sets
        run: |
          set -euo pipefail

          event="${{ github.event_name }}"
          if [ "$event" != "pull_request" ]; then
            # push-to-main (and anything else): NEVER skip. Main is the branch
            # every other run is compared against; a partial main is worse than
            # a slow one, and there is no reviewer left to notice.
            echo "event '$event' is not a pull_request — every path set is true."
            {
              echo "compile=true"
              echo "test=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            echo "::error::dispatcher: the PR carries no base sha. Refusing to guess — a guessed base skips the suite and reports green."
            exit 1
          fi

          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            # Same hazard deploy.yml:53-64 documents for burst merges: the base
            # commit can be absent from this checkout. Try to fetch it once,
            # then give up loudly.
            git fetch --no-tags --quiet origin "$base" 2>/dev/null || true
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::error::dispatcher: PR base sha ${base} is not resolvable in this checkout. Refusing to emit a path verdict from an unknown base."
            exit 1
          fi

          # A base with NO common ancestor makes the three-dot diff below exit
          # 128 with a raw `fatal: … no merge base` and ZERO annotation: under
          # `set -euo pipefail` the assignment dies and the author sees a red
          # dispatcher with no guidance. Name the condition instead. There is
          # deliberately NO two-dot fallback — measured, `base HEAD` sweeps in
          # the base's ENTIRE content and dispatches true for the wrong reason,
          # which is exactly the "verdict from an unknown base" this job refuses.
          if ! git merge-base "$base" HEAD >/dev/null 2>&1; then
            echo "::error::dispatcher: PR base ${base} and HEAD share NO common ancestor, so the three-dot diff is undefined. Refusing to emit a path verdict — and refusing a two-dot fallback, which would sweep in the base's entire content. Rebase the branch onto its base branch."
            exit 1
          fi

          echo "diff base: ${base} (three-dot against HEAD)"
          # `-z` + `--no-renames` are BOTH load-bearing; either alone certifies
          # a hole (measured, wave 10). `Elixir gate` is a REGISTERED required
          # context, so this line is the one that decides whether the suite runs
          # at all:
          #   * plain `--name-only` QUOTES and octal-escapes any path holding a
          #     non-ASCII byte, and keeps quoting `"`, `\` and newline even under
          #     core.quotepath=false — `api/lib/we"ird.ex` prints as
          #     `"api/lib/we\"ird.ex"`, the anchored ERE below misses it, and the
          #     ENTIRE suite is skipped under a green required context. `-z`
          #     emits the raw bytes, which cannot be quoted; `tr` restores the
          #     line format the matcher reads.
          #   * rename detection (default-on since git 2.9) prints only the
          #     DESTINATION, so `git mv api/lib/a.ex docs/a.ex` yields
          #     compile=false test=false while compiled code just left the tree.
          #     `--no-renames` prints both sides.
          changed="$(git -c core.quotepath=false diff -z --name-only --no-renames "${base}...HEAD" | tr '\0' '\n')"
          echo "changed files:"
          printf '%s\n' "$changed"

          if [ -z "$changed" ]; then
            # RARE BUT LEGAL: a revert pair inside one branch, or a branch-sync
            # PR, nets to nothing against the base. The old polarity failed here
            # — a permanently red required context on a legal PR, with no
            # self-service fix for the author. Run everything instead: expensive,
            # never wrong. Never `false`, which is the only truly unsafe answer.
            echo "::warning::dispatcher: the changed-file set is EMPTY (a revert pair or a branch-sync PR nets to nothing against ${base}). Dispatching compile=true test=true and running the WHOLE suite rather than skipping it — a skip here would green a required context nothing measured. Cost, and it is real: the full Elixir suite, measured 9m31s-16m29s."
            {
              echo "compile=true"
              echo "test=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The path sets are declared ONCE, in the ratchet that proves them.
          compile="$(printf '%s\n' "$changed" | bash scripts/elixir-path-escape-check.sh --match compile)"
          test="$(printf '%s\n' "$changed" | bash scripts/elixir-path-escape-check.sh --match test)"

          # Containment invariant: compile ⊆ test, by construction of the two
          # path sets — every path that recompiles the app is also a path the
          # test suite reads. compile=true with test=false therefore does not
          # describe a real change; it means the two matchers in
          # scripts/elixir-path-escape-check.sh have drifted apart, and the
          # consequence is that a change to compiled code sails through with the
          # ENTIRE test suite skipped — legitimately, as far as the aggregator
          # can see, because it accepts a skip whose gate is literally 'false'.
          # The case statement below refuses that verdict too; this assertion
          # exists to name the cause. (It once cited `mix-prod-compile needs:
          # mix-test` — that edge was cut, the invariant was never about it.)
          if [ "$compile" = "true" ] && [ "$test" != "true" ]; then
            echo "::error::dispatcher: compile=true but test=${test}. The compile path set is not a subset of the test set — fix scripts/elixir-path-escape-check.sh."
            exit 1
          fi

          case "${compile}/${test}" in
            true/true | false/true | false/false) ;;
            *)
              echo "::error::dispatcher: refusing to emit the uninterpretable verdict compile=${compile} test=${test}."
              exit 1
              ;;
          esac

          echo "verdict: compile=${compile} test=${test}"
          {
            echo "compile=${compile}"
            echo "test=${test}"
          } >> "$GITHUB_OUTPUT"

  path-escape:
    # DELIBERATELY UNFILTERED — no `if:`, no dependency on the dispatcher. This
    # job proves the dispatcher's path sets still cover everything the suite
    # reads, so gating it on those same sets would let it go dark exactly when
    # it is needed (charter D26: scripts/pr-task-gate.test.sh was 30 green
    # fixtures executed by nothing). It costs a few seconds of bash.
    name: Elixir path-escape ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # depth 2, not 0. On a pull_request the checked-out ref is the merge
          # commit, so HEAD^1 IS the base sha and `git diff HEAD^1 HEAD` is
          # exactly the PR's file set — one extra commit object, no extra fetch
          # step, and no `needs: changes`. MEASURED, two alternating clones of
          # this repo from GitHub: depth 1 = 28.4s then 25.1s, depth 2 = 29.3s
          # then 22.9s — the second pass has depth 2 FASTER, so the added cost
          # is inside run-to-run variance and is not resolvable at all. Both
          # working trees are 464M; depth 2 carries one extra commit object.
          # And the MECHANISM is measured, not assumed: `git fetch --depth 2
          # origin refs/pull/15568/merge` into an empty repo resolves both
          # HEAD^1 and HEAD^2, and `git diff --name-only HEAD^1 HEAD` printed
          # the same four paths, in the same order, as `gh pr view 15568
          # --json files`.
          # The whole point of the step below is to buy back ~114 seconds, so a
          # base fetch that cost real time would eat the saving; it is bought
          # at the checkout rather than paid for again in a step of its own.
          fetch-depth: 2

      # ── the harness runs when the diff can reach it, and otherwise not ────
      # MEASURED on four successful main runs (2026-09-01): this job averages
      # 2m35s, of which the `--selftest` harness below is 114s and the actual
      # ratchet 15-17s, the remaining three steps 12s. 74% of an unfiltered,
      # every-single-PR job is the harness proving the ratchet CAN fail —
      # ~84 job-minutes over 60 runs, nearly all of it re-proving a mutation
      # matrix over two files the PR did not touch.
      #
      # SO ONLY THE HARNESS IS CONDITIONED. `Every repo-root read is dispatched
      # on` — the ratchet itself, the thing that catches a real uncovered read —
      # keeps running on every single PR, unfiltered, exactly as before, and the
      # JOB keeps its no-`if:`/no-continue-on-error/no-`needs` shape (charter
      # D26, asserted by merge-authority-claim-check.test.sh §B6 and by
      # elixir-path-escape-check.test.sh's `escape_if`/`escape_needs` facts).
      # Conditioning the harness narrows WHEN a proof-of-proof is re-run; it
      # does not narrow what the gate sees.
      #
      # There is in-tree precedent for retiring a `--selftest` step from a
      # workflow once something else is its home: scripts/required-checks.test.sh
      # §9 records that `verify --selftest` is run there and that
      # required-checks-drift.yml "no longer runs it as a step of its own".
      # The condition below is the same trade, one notch weaker — the harness
      # keeps this job as its home, it is simply not re-run on diffs that cannot
      # move it.
      #
      # FAIL-SAFE DIRECTION, and it is the whole design: a skip happens ONLY on
      # a positive, successful determination that none of the three paths
      # changed. Anything else — a non-pull_request event, an unresolvable
      # HEAD^1, a `git diff` that errors, an empty file list — falls through to
      # `run`. The failure mode of running is 114 wasted seconds; the failure
      # mode of skipping wrongly is a mutation matrix nobody ever watched fail,
      # which is the exact disease (D26) this job exists to treat. So the
      # default is `run` and only one branch can ever write `skip`, and this
      # step is written to always exit 0 so that a broken condition cannot even
      # red the job — an unwritten output reads as "not skip", i.e. run.
      - name: Does this diff reach the harness?
        id: harness-scope
        run: |
          decision=run
          why="not a pull_request — the harness always runs on push to main"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            why="could not determine the diff — failing toward running"
            if base="$(git rev-parse --verify --quiet HEAD^1)" && [ -n "$base" ]; then
              if changed="$(git diff --name-only "$base" HEAD)" && [ -n "$changed" ]; then
                # D37: never `printf … | grep -q`. Under pipefail a matching
                # grep exits 0, printf dies of SIGPIPE, 141 wins, and the match
                # reads as a miss. A here-string has no writer to kill.
                if grep -qxF \
                     -e scripts/elixir-path-escape-check.sh \
                     -e scripts/elixir-path-escape-check.test.sh \
                     -e .github/workflows/elixir.yml <<<"$changed"; then
                  why="the diff touches the ratchet, its harness, or this workflow"
                else
                  decision=skip
                  why="the diff touches none of the ratchet, its harness, or this workflow"
                fi
              fi
            fi
          fi
          echo "harness ${decision}: ${why}"
          echo "decision=${decision}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Harness (the ratchet must be able to fail)
        # `!= 'skip'`, never `== 'run'`: a missing or garbled output must RUN.
        if: steps.harness-scope.outputs.decision != 'skip'
        run: bash scripts/elixir-path-escape-check.sh --selftest

      - name: Every repo-root read is dispatched on
        run: bash scripts/elixir-path-escape-check.sh

      # ── the wave-33 skip-disclosure ratchet, riding this job ─────────────
      # Same wiring intent as security.yml's `Security gate shape ratchet`
      # (unfiltered, blocking, a few seconds of python + bash) but as a STEP of
      # this already-unfiltered job rather than a job of its own, for two
      # measured reasons:
      #   * A NEW job in any of the four workflows breaks a sibling ratchet this
      #     slice may not touch: each of security-gate-shape.test.sh,
      #     elixir/cloud/console-path-escape-check.test.sh derives
      #     `blocking_not_in_needs` FROM the YAML and demands the new job be
      #     added to the aggregator's `needs` — and adding it there leaves their
      #     `env -i` gate exercises without the new `R_*` var, which dies on
      #     `set -u`. Correct ratchets, both directions; the answer is not to
      #     add a job.
      #   * A step adds no rendered check name, so required-checks-verify.sh's
      #     roster is unchanged.
      # This job is in the aggregator's needs with gate value NEVER, so the
      # ratchet blocks the merge — strictly stronger placement than its sibling,
      # which hangs off a context branch protection does not require.
      - name: The four gates announce their skips (the ratchet must be able to fail)
        run: bash scripts/gate-announces-skips.test.sh

      # ── the merge-authority claim guard, riding this job for one reason ───
      # The repo's existing merge-authority guard, `blocking_authority_check`
      # in scripts/required-checks-verify.sh, is invoked in the real tree from
      # exactly one workflow: required-checks-drift.yml, inside the job
      # `Required-check spec drift (advisory)`, which carries
      # continue-on-error: true. .github/required-checks.json holds that context
      # out under S2 ADVISORY. So the cure for a merge-authority phantom sat on
      # a context that cannot stop a merge — the same disease, one level up.
      #
      # This job is the strongest venue available for it, and every part of that
      # is checked rather than asserted (scripts/merge-authority-claim-check.test.sh
      # §B): `path-escape` carries no `if:` and no continue-on-error, it is in
      # `elixir-gate`'s `needs` with the gate value NEVER — so it can never be
      # skipped into a green — and `Elixir gate` is one of the four required
      # contexts. A red in these steps reds a REQUIRED context.
      #
      # A STEP and not a job, for the two reasons written above the
      # skip-disclosure ratchet: a new job here reds the sibling path-escape
      # harnesses via `blocking_not_in_needs`, and a step adds no rendered check
      # name, so required-checks-verify.sh's roster is unchanged.
      - name: The merge-authority claim guard must be able to fail
        run: bash scripts/merge-authority-claim-check.test.sh

      - name: No workflow or card claims merge authority the spec denies
        run: bash scripts/merge-authority-claim-check.sh

      # ── the vips hedge, now a tripwire instead of a 39-second bill ────────
      # mix-prod-compile below used to `apt-get install libvips-dev` purely as
      # insurance against a future VIX_COMPILATION_MODE=PLATFORM_PROVIDED_LIBVIPS
      # switch. The setting is unset, so the install bought nothing and cost 39 s
      # of a 112 s required gate; the insurance moved here, where it costs
      # milliseconds and reds only when the hypothetical becomes real.
      #
      # A STEP of this job and not a job of its own, for the two reasons written
      # above the skip-disclosure ratchet: a new job here reds the sibling
      # path-escape harnesses via `blocking_not_in_needs`, and a step adds no
      # rendered check name, so required-checks-verify.sh's roster is unchanged.
      - name: The vips hedge tripwire must be able to fail
        run: bash scripts/vips-hedge-tripwire.sh --selftest

      # NAME THIS STEP WITHOUT THE MODE TOKEN. A `name:` is not a comment, so
      # the tripwire's own step name counted as a live selection and reddened it
      # on the first real run — the guard catching its own wiring, which is the
      # correct behaviour and the reason the name reads around the token.
      - name: A platform-provided vips mode is never selected bare
        run: bash scripts/vips-hedge-tripwire.sh

      # ── the diff-scoped format verdict, end to end ───────────────────────
      # It rides HERE and not in the `format` job, deliberately: `format`
      # carries `if: needs.changes.outputs.compile == 'true'`, so on a docs-only
      # diff it skips — and a harness that goes dark exactly when someone edits
      # this workflow's wiring is not a guard. This job carries no `if:`, so the
      # harness runs on EVERY head, and it is in the aggregator's `needs` with
      # the gate value NEVER, so its red is a red on a REQUIRED context.
      #
      # A STEP and not a job, for the two reasons written above the
      # skip-disclosure ratchet: a new job here reds the sibling path-escape
      # harnesses via `blocking_not_in_needs`, and a step adds no rendered check
      # name, so required-checks-verify.sh's roster is unchanged.
      - name: A touched unformatted file reds the gate, an untouched one does not
        run: bash scripts/format-diff-scope.test.sh

  format:
    # ADVISORY format signal — NOT a merge gate. This job pins THE FORMATTER
    # DEVELOPERS RUN, not the Elixir production compiles with. `mix format`
    # output is decided by the Elixir that types it, and everyone (and every
    # agent) who runs `mix format` before pushing is on 1.19.5 — so that is
    # what this job measures. Pinning it to anything else does not make the
    # tree prod-formatted, it just makes the job a treadmill: see the matrix
    # comment below for the measurement that settled it. Production's
    # toolchain is a SEPARATE question with a separate owner — .tool-versions,
    # and the mix-test / mix-prod-compile matrices further down this file,
    # which this job does not speak for and does not touch.
    #
    # IT RUNS THE SAME INSTRUMENT A DEVELOPER RUNS (scripts/format-check.sh,
    # format-gate-is-elixir-version-contaminated). `mix format --check-formatted`
    # reds for THREE reasons — formatting, Elixir version, and unfetched deps —
    # and until that script existed all three exited non-zero identically. That
    # is how this repo published an unformatted count of "1", corrected it to
    # "91", corrected it to "92", and was wrong all three times: every figure
    # came from a local 1.19.x formatter describing a population this job never
    # evaluates (measured 2026-07-20: 1.18.1 saw ONE unformatted file, 1.19.5
    # saw 97, and the two sets overlapped in ZERO).
    #
    # Using one script on both sides is what makes local and CI answer the SAME
    # question. Here the version check is a tautology — the matrix below IS what
    # the script reads — and that is the point: it PRINTS the version it judged
    # under, so no future reader has to re-derive which formatter produced the
    # verdict, and a matrix bump can never silently change the answer.
    #
    # ── SINCE task-e31b816b4b416db6 IT IS DIFF-SCOPED, NOT ADVISORY ──────────
    # It used to carry `continue-on-error: true` and nothing read it. So
    # unformatted Elixir merged (measured on main run 33843359350, 2026-09-04
    # 06:12Z: three files), and from then on this job was RED ON EVERY PULL
    # REQUEST for drift the author never touched. A permanently-red advisory
    # gate teaches the fleet to skip the one red that is real.
    #
    # Simply making it blocking is the same disease with a merge button: it
    # would refuse every PR in the fleet over someone else's merge. So the
    # verdict is SCOPED TO THE DIFF, in scripts/format-diff-scope.sh:
    #   * a file THIS DIFF TOUCHES that the formatter objects to -> the job
    #     FAILS, and `Elixir gate` reds naming the file;
    #   * the same unformatted state in a file the diff never touched ->
    #     PRINTED, and neutral. Not this pull request's red.
    #   * a REFUSAL from the guard (wrong Elixir, unfetched deps, unreadable
    #     pin, formatter never ran) -> neutral. No claim was made, so none is
    #     enforced.
    #   * on push:main there is NO PR diff, so nothing can be diff-scoped: the
    #     standing debt is printed and this job is green. Main is where the
    #     debt is VISIBLE, never where it is enforced — enforcement happens on
    #     the PR that touches the file.
    #
    # NO NEW REQUIRED CONTEXT, and this job's own rendered name is still not
    # one: `Elixir gate` is the only name branch protection reads, and it reds
    # through `needs` + a `decide` line like every other upstream. The
    # continue-on-error had to go for that: a coe job may never enter the
    # aggregator's `needs` (`needs.<job>.result` reads `success` for a FAILED
    # coe job), which scripts/elixir-path-escape-check.test.sh asserts as
    # `coe_in_needs = ""` — and without `needs` the aggregator can read neither
    # this job's result nor its outputs. That harness named this slice in
    # advance ("S4's format ceiling is the next one").
    name: Format (mix format --check-formatted, diff-scoped)
    needs: changes
    if: needs.changes.outputs.compile == 'true'
    runs-on: ubuntu-latest
    # Read by `elixir-gate`'s Decide step so the ::error:: the check-run API
    # publishes NAMES THE FILES rather than saying only "format failed" — the
    # D770/D771 lesson ("`bad` says THAT something is wrong, never WHICH")
    # applied to this arm. Job outputs survive a failing job, which is the only
    # case that matters here.
    outputs:
      unformatted_in_diff: ${{ steps.scope.outputs.unformatted_in_diff }}
      unformatted_total: ${{ steps.scope.outputs.unformatted_total }}
    strategy:
      fail-fast: false
      matrix:
        otp: ["27.0"]
        # THE FORMATTER THE FLEET ACTUALLY RUNS, measured — not the declared
        # toolchain, and deliberately not production's. `elixir --version` on
        # this repo's dev Mac and on every ephemeral agent box, 2026-09-02:
        # 1.19.5. `.tool-versions` says `elixir 1.18.4-otp-27` and asdf is not
        # installed on those boxes, so nobody lands on the pin — bare
        # `mix format` is 1.19.5 every time.
        #
        # The two formatters DISAGREE on line breaking, and the tell is
        # DIRECTIONAL — read it the right way round, because the filing had it
        # backwards. The `{:fires, "calls …"}` tuple in
        # api/test/barkpark_web/plugin_live_session_scope_opts_guard_test.exs is
        # EXACTLY 98 columns, which is the default `line_length`. 1.19.5 keeps
        # it on one line; 1.18.4 splits it across two. Commit 670ab4659b
        # ("style(test): format …") is a 1.19.5 box JOINING that tuple, and main
        # run 33639424802 (e7e3df5b0b) is the 1.18.4 gate immediately asking for
        # it back on two lines. A boundary disagreement at the width limit, so
        # it fires on whatever happens to sit at 98 and no listing of affected
        # files stays true.
        #
        # That is a treadmill in both directions: every 1.18-shaped repair
        # (#14963, #15308) is undone by the next local `mix format`, and every
        # local `mix format` re-reds this job. A permanently-red advisory gate
        # teaches the fleet to skip the one red that is real.
        #
        # WHICH PIN MOVES IS THE WHOLE DECISION (orchestrator ruling 2026-09-02,
        # task-9a08c27d897f38e6). Not this one: forcing ~30 ephemeral worktree
        # agents onto an asdf install nothing checks is unenforceable, and it was
        # tried — .tool-versions has said 1.18.4-otp-27 for months and the fleet
        # has never once honoured it. Not .tool-versions either, for the same
        # reason it was not moved when this pin last changed: it has consumers
        # OUTSIDE CI (release-artifact.yml builds the prebuilt with
        # `version-file: .tool-versions`; deploy/azure-base-install.sh pins every
        # box's asdf to it), so moving it would change what production installs
        # to settle a formatter disagreement. This matrix has no consumer but
        # this job and scripts/format-check.sh. THE FORMAT JOB MEASURES THE
        # FORMATTER; production's Elixir is the mix-test / mix-prod-compile
        # matrices' business (still 1.18.1, untouched here) and the deploy row's.
        #
        # OTP STAYS 27.0 and did not have to move: erlef/setup-beam resolves
        # elixir-version 1.19.5 against otp-version 27.0 to the published
        # `elixir-otp-27` build (1.19.5 ships otp-26/27/28 artifacts). Formatter
        # output is an Elixir-level rule — the fleet's own 1.19.5 sits on OTP 28
        # and emits the same bytes — and OTP is the wider blast radius, so it
        # stays where the rest of this file has it.
        elixir: ["1.19.5"]
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Cache deps (formatter only needs deps for import_deps)
        uses: actions/cache@v4
        with:
          path: api/deps
          key: ${{ runner.os }}-mix-format-deps-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('api/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-format-deps-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Fetch deps (required by .formatter.exs import_deps)
        run: mix deps.get

      # Proves the guard's own refusals can still fire. It drives temp trees, so
      # it needs no toolchain swap and makes no claim about this tree.
      - name: The format guard must be able to refuse
        working-directory: .
        run: bash scripts/format-check.sh --selftest

      # The scope reader carries its own refusals, so it proves them here — same
      # contract as the guard's --selftest above, and it needs no toolchain.
      - name: The diff scope must be able to refuse, to red, and to stay neutral
        working-directory: .
        run: bash scripts/format-diff-scope.sh --selftest

      # CAPTURED, NOT DECIDED ON. This step is deliberately the last one in this
      # job that may not fail: `mix format --check-formatted` answers "is the
      # WHOLE TREE formatted", which is a question nobody on a pull request can
      # be held to. The step-level continue-on-error keeps its output and its
      # exit code as DATA; `scope` below turns that data into the verdict.
      #
      # continue-on-error here and NOT at the job level: at job level it would
      # also swallow a scope red, and `needs.format.result` would read `success`
      # for a failed job — the exact laundering the aggregator refuses.
      - name: mix format --check-formatted (via the version-aware guard)
        id: guard
        continue-on-error: true
        working-directory: .
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP:-/tmp}/format-verdict.log"
          bash scripts/format-check.sh > "$log" 2>&1
          rc=$?
          cat "$log"
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Which unformatted files does THIS diff touch?
        id: scope
        # always(): the guard step above is expected to "fail" whenever main
        # carries inherited drift, and that must not skip the step that decides
        # whether the drift is this PR's problem.
        if: always()
        working-directory: .
        env:
          GUARD_RC: ${{ steps.guard.outputs.rc }}
        run: |
          set -uo pipefail
          tmp="${RUNNER_TEMP:-/tmp}"
          changed="${tmp}/changed.txt"
          : > "$changed"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            # actions/checkout checks out refs/pull/N/merge on a pull_request,
            # so HEAD^1 IS the base tip and `HEAD^1..HEAD` IS the merge-base
            # diff — no extra fetch, and the same derivation the path-escape
            # job above already uses. If it cannot be computed the file stays
            # EMPTY, which the scope reader reports as "no PR diff" and scores
            # NEUTRAL: an unreadable diff must never manufacture a red.
            if base="$(git rev-parse --verify --quiet 'HEAD^1')" && [ -n "$base" ]; then
              git diff --name-only "$base" HEAD > "$changed" || : > "$changed"
            fi
          fi
          echo "PR diff: $(wc -l < "$changed" | tr -d ' ') changed path(s) (empty = push, or no computable diff)"
          bash scripts/format-diff-scope.sh \
            --verdict-log "${tmp}/format-verdict.log" \
            --guard-rc "${GUARD_RC:-2}" \
            --changed "$changed"

  mix-test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    needs: changes
    # The TEST path set: compile-affecting paths PLUS the fixture/mirror trees
    # the suite reads across the repo (internal/taskboard/**,
    # internal/chat/testdata/**, .codex/skills/epic-cycle/scripts/**, …). Two
    # sets, not one — charter D31. Declared in, and proven by,
    # scripts/elixir-path-escape-check.sh.
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    # BLOCKING since 2026-06-10: the remediation this job waited on is done —
    # suite de-flaked at the root (CompactorTest serialization, DateTime
    # structural sort, Registry baseline, cold-DB token tier) and the first
    # green CI run since 2026-04-26 proved it. A failure here is real.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: barkpark_test
        ports:
          - 5432:5432
        # --health-interval 2s, not the 10s default: `Waiting for all services
        # to be ready` was measured at 15.5 s (elixir Test) and 13.6 s (cloud
        # test) while pg_isready answers in ~3 s — that wait is poll
        # granularity, not postgres. Same health command, polled sooner.
        # (Comments cannot live inside the folded `>-` block below: they would
        # be passed to docker as literal arguments.)
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      DATABASE_URL: ecto://postgres:postgres@localhost:5432/barkpark_test
      SECRET_KEY_BASE: ci-secret-key-base-not-used-in-test-env-just-needs-64-chars-padding
      BARKPARK_CLOAK_KEY: ci-cloak-key-32-chars-padding-aaa
      PREVIEW_JWT_SECRET: ci-preview-jwt-secret-not-used-padding
    strategy:
      fail-fast: false
      matrix:
        # THE PROD PIN. api/mix.exs requires `~> 1.15`, but the number that
        # matters is what guerrilla runs: measured 2026-09-02 on the box,
        # `asdf current` in /opt/barkpark resolves elixir 1.18.4-otp-27 +
        # erlang 27.3.4 FROM the repo-root `.tool-versions` it checked out,
        # and the running BEAM is erts-15.2.7 under
        # /root/.asdf/installs/elixir/1.18.4-otp-27. This job sat at 1.18.1,
        # one patch below both the declaration and the box, so a green here
        # never meant "runs on the box". `.tool-versions` is NOT changed by
        # the PR that moved this line — it already equalled prod.
        #
        # OTP stays "27.0" against the box's 27.3.4, matching the `format`
        # job's ruling above: an OTP move is a wider blast radius than an
        # Elixir move and is not settled by a CI-alignment PR. Recorded as a
        # known residual in docs/ops/PROD_OPS.md.
        otp: ["27.0"]
        elixir: ["1.18.4"]
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
        # fetch-depth: 0 pulls full history + tags. Barkpark.BuildInfo derives
        # the version from `git describe --tags --match 'v[0-9]*'` at COMPILE
        # time; a shallow (depth-1, tagless) checkout makes it degrade to
        # "unknown", which fails BuildInfoTest ("version derives from git … v0.2.23
        # exists") and the git-tag-dependent SelfUpdate.CheckerTest suite. Only
        # this Test job asserts on the derived version, so only it needs the tags.
        with:
          fetch-depth: 0

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      # Node is a TEST DEPENDENCY of this job, not a convenience: the required
      # ExUnit case api/test/barkpark_web/live/studio/sheet_grid/js_harness_test.exs
      # shells `node` over the four api/assets/sheet-grid/__*.test.mjs harnesses
      # (PR #15196) and FLUNKS — never skips — when node is absent. Until this
      # step existed the case passed only because ubuntu-latest happens to ship
      # node; a required gate must not depend on the runner image's luck. Same
      # pinned action + major cloud.yml uses for its console plan-catalog mirror.
      - name: Setup Node (js_harness_test.exs shells node over api/assets/sheet-grid)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── unreachable-assert-message ratchet, riding this job ──────────────
      # A STEP, not a job, and deliberately so. The path-escape job's own
      # comment records why: each of security-gate-shape.test.sh and the three
      # *-path-escape-check.test.sh derive `blocking_not_in_needs` FROM this
      # YAML and demand a new blocking job be added to the aggregator's
      # `needs` — and adding it there leaves their `env -i` exercises without
      # the new R_* var, which dies on `set -u`. Correct ratchets, both
      # directions; the answer is not to add a job.
      #
      # It rides mix-test because that is the blocking job that already has
      # Elixir on PATH, and this gate parses with Code.string_to_quoted/2. It
      # runs BEFORE deps/compile: the scanner needs neither, so a defective
      # assert reds in seconds instead of after a full compile + DB setup.
      #
      # --selftest FIRST (distrust vacuous green). Five arms in a temp tree,
      # including one that proves a CLEAN tree passes — without it a scanner
      # that always reports "clean" would satisfy a can-it-red test while
      # measuring nothing.
      - name: The unreachable-assert-message guard must be able to fail
        working-directory: .
        run: bash scripts/unreachable-assert-message-check.sh --selftest

      - name: No NEW unreachable assert messages (never-worse ratchet)
        working-directory: .
        run: bash scripts/unreachable-assert-message-check.sh

      # ── client-ip trust-boundary ratchet, riding this job ────────────────
      # Same STEP-not-a-job reasoning as the ratchet above: adding a blocking
      # job would trip the aggregator `needs` checks in the path-escape suite.
      #
      # This one needs neither Elixir nor deps (it is grep + awk), so it rides
      # here purely to sit beside the ratchet it mirrors, and runs before
      # compile so a reintroduced one-liner reds in seconds.
      #
      # WHY IT EXISTS: five modules reimplemented `client_ip/1` past a resolver
      # that was already marked @canonical, and every one of them recorded the
      # proxy instead of the actor. The marker's aka: list contains `client_ip`
      # precisely so a grep lands on the right one; it did not route them. A
      # marker nobody follows is decoration, so this makes it load-bearing.
      #
      # --selftest FIRST (distrust vacuous green). It plants the defect in the
      # exact words of the removed code AND proves a clean tree still passes —
      # without the second arm a scanner that reports "clean" unconditionally
      # would satisfy a can-it-red test while measuring nothing.
      - name: The client-ip resolver guard must be able to fail
        working-directory: .
        run: bash scripts/client-ip-resolver-check.sh --selftest

      - name: No conn.remote_ip read outside the canonical resolver
        working-directory: .
        run: bash scripts/client-ip-resolver-check.sh

      # ── test-env-leak ratchet, riding this job ───────────────────────────
      # STEPS, not a job — the same reasoning the two ratchets above record.
      # Adding a blocking job is a six-place change (job · needs · the
      # aggregator's decide binding · the `env -i` simulators · the
      # spec-authority marker · the merge-authority claim count), and each of
      # those places has its own correct ratchet that would red. Nothing here
      # changes a job name, a `needs:`, or a blocking status.
      #
      # WHY IT EXISTS: a test that calls `Application.put_env` and never puts
      # the value back does not fail. It makes some OTHER test fail, later, at
      # random. `write_hotpath_telemetry_test.exs` set `:plugins` to
      # `[SlowGatePlugin]` in two tests with no `on_exit`; DataCase resets
      # `:plugins` in its own setup — BEFORE its own tests — so it protected
      # DataCase and nobody else, and any bare `use ExUnit.Case` module the
      # scheduler ran next inherited the value and died on `declared == []`. CI
      # pins no `--seed`, so it fired at random and cost the fleet a full
      # diagnosis. Cheap to SEE statically, expensive to DEBUG dynamically.
      #
      # It rides mix-test because that is the blocking job that already has
      # Elixir on PATH (the scanner parses with `Code.string_to_quoted/2`), and
      # it runs BEFORE deps/compile: it needs neither, so a new leak reds in
      # seconds instead of after a full compile + DB setup.
      #
      # The HARNESS runs FIRST, and it is not decoration: its case 12 guts the
      # detector in a copy of the gate and requires that copy to come back GREEN
      # on the leak fixture. Without that, all 22 other cases could pass
      # over a gate that had been deleted.
      #
      # THE 22 IS RE-DERIVABLE, so re-derive it rather than trusting this line:
      #   grep -cE '^[[:space:]]*ok "'   scripts/test-env-leak-gate.test.sh  # 25 arms total
      #   grep -cE '^[[:space:]]*ok "12' scripts/test-env-leak-gate.test.sh  #  3 are case 12
      # 25 - 3 = 22. Count ARMS, not case numbers: there are 15 numbered cases
      # but 25 assertion arms, because 12 splits into 12a/12b/12c and it is the
      # arms the harness tallies in its own "PASSED: n of n cases" line.
      - name: The test-env-leak guard must be able to fail
        working-directory: .
        run: bash scripts/test-env-leak-gate.test.sh

      - name: No NEW unrestored global-state mutation in api/test (never-worse ratchet)
        working-directory: .
        run: bash scripts/test-env-leak-gate.sh

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            api/deps
            api/_build
          key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('api/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Fetch deps
        run: mix deps.get

      # Format check now lives in the dedicated `format` job above (Task
      # #29). It used to run here but was non-blocking because mix-test
      # carried continue-on-error: true at the time (it no longer does).

      # NO apt libvips-dev HERE, and the `:image` dep STAYS. The repo sets no
      # VIX_COMPILATION_MODE, so vix (0.38) runs in its default
      # PRECOMPILED_NIF_AND_LIBVIPS mode: the NIF arrives prebuilt with libvips
      # bundled, and the system libvips-dev this step used to install was never
      # consumed by this job (measured 40-64s of apt on the critical path,
      # buying nothing). Only `:requires_vips`-tagged tests need the system
      # `vips` BINARY on PATH, and those are default-excluded here
      # (api/test/test_helper.exs).
      #
      # DO NOT reach for BARKPARK_SKIP_IMAGE=1 instead — that removes the
      # `Image` MODULE, which plain (untagged) integration tests exercise at
      # runtime: run 32641485143 reds v1_media_processing_test.exs:93 and
      # media_delivery_test.exs:71 with `Image.open/1 is undefined` raised from
      # Barkpark.Plugins.Media.after_media_upload/1. The dep was never the
      # cost; the apt install was.
      # If system libvips is ever genuinely needed here, prefer apt caching
      # over re-adding a cold `apt-get update && install` to the critical path.

      - name: Install libxml2-utils for ONIX XSD validation (Phase 6 WI5)
        # The :validator-tagged tests under
        # api/test/barkpark/plugins/onixedit/export/ shell to xmllint to validate
        # exported ONIX 3.0 XML against the EDItEUR XSD vendored at
        # api/priv/onix/onix-3.0/. Without this binary the gate would skip on CI.
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
        working-directory: .

      - name: Compile (dev, --warnings-as-errors)
        id: build
        run: mix compile --warnings-as-errors

      - name: DB setup
        id: db
        run: |
          mix ecto.create
          mix ecto.migrate

      - name: Test
        # CI-BLOCKING GATES ride this default `mix test` — no separate/advisory
        # job. Among them: the canvas⇄reader render-parity gate
        # (test/barkpark/portable_doc/render/canvas_reader_parity_gate_test.exs,
        # pd-doctrine rule 3 / D8) and the View↔Edit tripwire alongside it. A
        # divergence between the Beta canvas paint and the /papers reader render
        # fails the merge here.
        #
        # Phase 7 WI7 added a
        # `:bokbasen_integration`-tagged end-to-end suite at
        # api/test/barkpark/plugins/onixedit/bokbasen/e2e_test.exs that is
        # excluded by default via api/test/test_helper.exs. CI does NOT run
        # the tagged suite because it is a self-contained Bypass-mock
        # contributor sanity test, not a CI gate; the WI3 client_test and
        # WI4 publish_worker_test already cover the same lifecycle paths
        # and run on every PR.
        #
        # To run the integration suite locally with the Bypass mock:
        #
        #     cd api && mix test --include bokbasen_integration
        #
        # See README "Phase 7: Bokbasen integration" and
        # docs/spec/bokbasen-api-contract.md "How to test" for details.
        # Do NOT add a CI job that requires real Bokbasen credentials.
        # `--slowest 50` is OUTPUT ONLY (ExUnit prints the 50 slowest tests
        # after the run; it changes no selection, no exit code, no timing).
        # It exists because the per-module cost of this 900 s suite is
        # UNMEASURED: the 43 stalls >=5 s that make up ~56% of the wall time
        # are today located only by log timestamps, with the owning test
        # inferred from adjacent lines. This names them.
        run: mix test --slowest 50

      - name: OpenAPI drift check (docs/openapi.json must match the manifest)
        # Regenerates the spec from the live capabilities manifest and fails if
        # the checked-in docs/openapi.json is stale — the "the doc never drifts
        # from the routes" guarantee. `git add -N` first so an accidentally
        # untracked artifact is caught too (a new file is invisible to
        # `git diff --exit-code`, which is how the drift gate can pass
        # vacuously). Runs from the repo root because the artifact lives at
        # docs/openapi.json (one level above api/).
        #
        # GATE ORDER — task-openapi-drift-chronic. This step used to sit BEFORE
        # `mix test`. One stale byte on main therefore aborted the job before a
        # single test executed: every open PR reported ZERO substantive test
        # results, and a generated-file nit masked real failures. It now runs
        # AFTER `mix test`, and its `if:` deliberately ignores the TEST result
        # while still requiring a usable build — so a red suite and a stale
        # descriptor are reported INDEPENDENTLY and neither hides the other,
        # but a broken compile does not cascade into a bogus "stale artifact"
        # red that says nothing true. The gate is unchanged in strength — only
        # its position moved. Do NOT move it back above `mix test`.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.db.outcome == 'success' }}
        run: |
          mix barkpark.openapi
          cd ..
          git add -N docs/openapi.json
          if git diff --exit-code docs/openapi.json; then
            exit 0
          fi
          echo ""
          echo "================================================================"
          echo "docs/openapi.json is STALE."
          echo ""
          echo "The diff printed above is what YOUR change did to the public API"
          echo "surface but never committed. It is not noise, and it is not"
          echo "someone else's drift: generation is byte-deterministic (proved by"
          echo "the determinism test in api/test/barkpark/api/openapi_test.exs),"
          echo "so the same tree always produces the same bytes. Read the diff --"
          echo "it is your own descriptor change."
          echo ""
          echo "Fix it from the repo root, in one line:"
          echo ""
          echo "    cd api && mix barkpark.openapi && cd .. && git add docs/openapi.json"
          echo ""
          echo "Then commit (or amend) and push. Regenerating is PART OF the"
          echo "change, not a follow-up PR."
          echo "================================================================"
          echo "::error file=docs/openapi.json,title=OpenAPI descriptor is stale::Run 'cd api && mix barkpark.openapi' from the repo root and commit docs/openapi.json. The exact diff is printed in this step's log."
          exit 1

      - name: Paper-component golden-parity freshness (3 mirrors must match the emitter)
        # Same drift-gate shape as the OpenAPI check above, for the cross-surface
        # PAPER-COMPONENT parity spine (Unified Aesthetic W5.c). Regenerates the
        # structural-projection fixtures from the View emitter + shared status
        # manifest and fails if ANY of the three committed mirrors drifted:
        #   api/test/support/fixtures/*.golden.json
        #   web/__tests__/fixtures/*.golden.json
        #   internal/pdrender/testdata/*.golden.json
        # A `Render.Components` emitter or design/status-manifest.json glyph/role
        # edit that shipped WITHOUT a regen reds HERE (byte-level), complementing the
        # term-level freshness + realization asserts in
        # test/barkpark/portable_doc/render/component_golden_parity_test.exs. The gen
        # writes byte-identically to all three trees; `git add -N` first so a
        # brand-new untracked mirror is caught too. Runs from the repo root — the web
        # + internal/pdrender mirrors live one level above api/.
        #
        # Same gate-order fix as the OpenAPI step above
        # (task-openapi-drift-chronic): runs AFTER `mix test`, on the same
        # build-succeeded-but-ignore-the-test-result condition, so a red suite
        # does not hide stale fixtures.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.db.outcome == 'success' }}
        run: |
          mix barkpark.paper_components.gen_golden_parity
          cd ..
          git add -N 'api/test/support/fixtures/*.golden.json' \
                     'web/__tests__/fixtures/*.golden.json' \
                     'internal/pdrender/testdata/*.golden.json'
          git diff --exit-code -- \
            'api/test/support/fixtures/*.golden.json' \
            'web/__tests__/fixtures/*.golden.json' \
            'internal/pdrender/testdata/*.golden.json' \
            || (echo "::error::paper-component golden fixtures are stale — run 'cd api && mix barkpark.paper_components.gen_golden_parity' and commit all three mirrors" && exit 1)

      - name: Plugins-off boot invariant (boot_test — separate step, NOT in `mix test`)
        # Goal barkpark-G1 / authoring-excellence ae-boot-gate-ci. The
        # fresh-install invariant bar (test/barkpark/plugin_free_boot_test.exs)
        # is tagged `:boot_test` and EXCLUDED from the default `mix test` above
        # (api/test/test_helper.exs). It cannot ride the bare invocation: its
        # `setup_all` STOPS and RESTARTS the whole :barkpark OTP app with
        # `:plugins` forced to `[]` — incompatible with the async suite sharing
        # that application. So it runs here as its OWN step, after the default
        # suite, reusing the same compiled build, DB, and Postgres service.
        #
        # This is the CI wire-in for a bar that was RED on main for weeks
        # without anyone noticing (4 pre-existing failures found 2026-07-10,
        # repaired in wave 2 / D12) precisely BECAUSE nothing ran it. A red
        # boot bar now blocks merge for api/** changes — the plugins-off
        # promise ("Barkpark boots + serves Studio + /api/schemas with every
        # plugin off") is verified on every PR, not just asserted.
        #
        # GATE SIGNAL = exit code, NOT log scraping. After the 8 tests pass
        # (0 failures), ExUnit prints a noisy async Postgrex/DBConnection
        # teardown warning — `Barkpark.Plugins.Indx.Auth` still holds a sandbox
        # connection at `on_exit` when the app restarts — that begins with
        # `[error]` but does NOT fail the run (`mix test` still exits 0). This
        # step must key off the process exit status (which GitHub Actions does
        # by default), never grep the log for the word "error".
        #
        # Budget: ~30-60s (local wall 30.75s / 13.3s ExUnit sync; CI runners
        # slower). Measured job-step duration is recorded in the PR body.
        #
        # Guarded like the two freshness gates above (task-openapi-drift-chronic):
        # this is SUBSTANTIVE test evidence, and a stale generated artifact must
        # never be able to suppress it. Unguarded, a one-byte docs/openapi.json
        # drift would skip the boot bar entirely — a fresh instance of the exact
        # failure mode that left this bar red on main for weeks (see above).
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.db.outcome == 'success' }}
        run: mix test --only boot_test test/barkpark/plugin_free_boot_test.exs

  mix-prod-compile:
    # The merge gate. See docs/ops/merge-gates.md.
    name: Prod compile gate (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    needs: [changes]
    # The COMPILE path set — api/** plus design/** (design/status-manifest.json
    # is an @external_resource of portable_doc/render/status_vocab.ex:20, so
    # editing it recompiles). Strictly narrower than the test set.
    #
    # NO `needs: mix-test`. There was never a correctness edge — own checkout,
    # own build tree in a disjoint cache namespace, no artifact hand-off
    # (`validation-perf` is the live precedent) — it only serialised 177s onto
    # the critical path (16m36s → 13m39s) and MANUFACTURED hazard (3) of charter
    # D19: a skip meaning "upstream died" rather than "not needed". With the
    # edge gone this job can no longer be skipped-by-upstream-death, so the
    # aggregator's rule for it — accept a skip ONLY when the dispatcher's
    # compile output was literally 'false' — degrades from load-bearing to
    # belt-and-braces. It stays: the aggregator must not depend on the shape of
    # the `needs` graph to stay fail-closed.
    if: needs.changes.outputs.compile == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # THE PROD PIN — this is the job whose green is supposed to mean
        # "compiles on the box". Equal to what guerrilla runs (measured
        # 2026-09-02: elixir 1.18.4-otp-27 / erlang 27.3.4, resolved by asdf
        # from the repo-root `.tool-versions`). See the mix-test matrix for
        # the measurement and for why OTP stays at "27.0".
        otp: ["27.0"]
        elixir: ["1.18.4"]
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Cache deps (dependency SOURCES)
        uses: actions/cache@v4
        with:
          path: api/deps
          key: ${{ runner.os }}-mix-prod-deps-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('api/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-prod-deps-${{ matrix.otp }}-${{ matrix.elixir }}-

      # ── THE DEPENDENCY BUILD CACHE, AND WHY IT IS NOT PAST MISTAKE #1 ──
      #
      # Read the CLAUDE.md rules this looks like it breaks before touching it.
      # Golden Rule #1 says never compile without cleaning `_build/prod` first;
      # Past Mistake #1 records a partial clean that left stale HEEx in the
      # Layouts module and served old HTML for hours; Past Mistake #2 records a
      # missing `mix deps.compile --force` that left `Plug.Exception` undefined
      # at runtime. Every one of those describes the production SERVER, where a
      # stale module was SERVED to users. This is a CI runner whose only output
      # is an exit code, and — the part that actually matters — the thing that
      # went stale in Past Mistake #1 was OUR OWN module, which this cache never
      # restores. The application still compiles from nothing on every run
      # (`mix compile --warnings-as-errors` below sees an empty tree for
      # `barkpark`); only `_build/prod/lib/<dep>` comes back, and a dependency's
      # compiled output is a pure function of runner OS, OTP, Elixir and
      # mix.lock — which is exactly this key. The rules stay; this is not the
      # case they are about, and the two claims in that sentence are ENFORCED by
      # scripts/prod-build-cache-guard.sh a few steps down rather than promised
      # here. Do not "fix" this back to an unconditional full rebuild. MEASURED
      # 2026-09-02 from step timestamps, medians: 176.5s over the 10 most recent
      # completed main runs before this change, 112.0s over 10 replica jobs on
      # the cached path, with `mix deps.compile` falling 83.5s -> 11.0s. The
      # fallback path was measured on the same instrument and costs nothing:
      # 177.0s over 10 cache-MISS replicas, i.e. within noise of the 176.5s it
      # replaces, so a cold cache is never a regression.
      #
      # NO `restore-keys:`, unlike the sources cache above. A prefix match would
      # hand this job dependency BEAM compiled from a DIFFERENT mix.lock; the
      # completeness arm of the guard would still pass (all the names are there)
      # and `mix deps.compile` would trust the manifests. Exact key or nothing.
      - name: Restore compiled dependency artifacts (prod)
        id: prod_dep_build
        uses: actions/cache/restore@v4
        with:
          path: api/_build/prod/lib
          key: ${{ runner.os }}-mix-prod-depbuild-v1-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('api/mix.lock') }}

      - name: Fetch deps (prod)
        run: mix deps.get
        env:
          MIX_ENV: prod

      # DISTRUST VACUOUS GREEN — run the tripwire's own mutation harness
      # BEFORE trusting the verdict it hands this job. 11 cases, ~0.2s: it
      # plants an `Elixir.Barkpark.Stale.beam` inside an allowlisted
      # dependency's ebin and asserts the guard REDS, deletes one dependency's
      # directory and asserts it FALLS BACK rather than passing, and shrinks
      # each input list to nothing and asserts neither shrink can produce a
      # pass. A tripwire nobody has watched fail is not a tripwire, and one
      # proven only once at authoring time is not one either — so it is proven
      # on every run of the gate it protects.
      - name: Prove the tripwire can fail (guard --selftest)
        run: bash "$GITHUB_WORKSPACE/scripts/prod-build-cache-guard.sh" --selftest
        working-directory: .

      # THE TRIPWIRE. Two arms, and the job is not allowed to proceed on a
      # tree that fails either:
      #   * contamination — a directory not named in mix.lock, or ANY
      #     `Elixir.Barkpark*.beam` anywhere under the restored tree. HARD FAIL,
      #     never a silent clean-up: a tree that can hold one of our modules can
      #     hold a STALE one, and that is Past Mistake #1 exactly.
      #   * completeness — every dependency `MIX_ENV=prod mix deps` names must
      #     have a non-empty ebin. Anything short and we throw the whole tree
      #     away and take the original `rm -rf _build/prod` + `--force` path,
      #     saying so in the log. That fallback is what keeps Past Mistake #2
      #     closed; without it a partial cache silently yields a half-built
      #     prod tree.
      # Both input lists are re-derived here on every run and both carry a floor
      # inside the guard, because a `mix deps` that errored into an empty pipe
      # would make the completeness check pass over nothing.
      - name: Audit the restored dependency build tree
        id: depbuild_audit
        run: |
          set -uo pipefail
          sed -n 's/^  "\([a-z0-9_][a-z0-9_]*\)".*/\1/p' mix.lock | sort -u > "$RUNNER_TEMP/dep-allowlist.txt"
          # `|| true`: a `mix deps` that fails leaves the required list EMPTY,
          # which the guard's floor turns into a fallback — never into a
          # completeness check that passes over nothing.
          (MIX_ENV=prod mix deps 2>/dev/null || true) \
            | sed -n 's/^\* \([a-z0-9_][a-z0-9_]*\) .*/\1/p' | sort -u > "$RUNNER_TEMP/dep-required.txt"
          echo "mix.lock names: $(wc -l < "$RUNNER_TEMP/dep-allowlist.txt")   prod deps: $(wc -l < "$RUNNER_TEMP/dep-required.txt")"
          # `set +e` is load-bearing: GitHub runs `run:` blocks under
          # `bash -e`, so without it the guard's non-zero verdicts (3 = fall
          # back, 1 = contaminated) would kill the step before this script can
          # tell them apart, and BOTH would surface as the same opaque red.
          set +e
          bash "$GITHUB_WORKSPACE/scripts/prod-build-cache-guard.sh" \
            _build/prod/lib "$RUNNER_TEMP/dep-allowlist.txt" "$RUNNER_TEMP/dep-required.txt"
          verdict=$?
          set -e
          case "$verdict" in
            0)
              echo "mode=cached" >> "$GITHUB_OUTPUT"
              ;;
            3)
              echo "FALLBACK: no usable dependency build cache — taking the full 'rm -rf _build/prod' + 'mix deps.compile --force' path (Past Mistake #2)."
              rm -rf _build/prod
              echo "mode=rebuild" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::prod dependency build cache is CONTAMINATED (guard exit $verdict) — see the CONTAMINANT lines above"
              exit 1
              ;;
          esac

      # NO apt libvips-dev HERE ANY MORE — THE HEDGE BECAME A CHECK. This step
      # ran `apt-get update && apt-get install -y libvips-dev` and was justified
      # as insurance: keep a system libvips where the prod artifact is compiled,
      # so a future switch to VIX_COMPILATION_MODE=PLATFORM_PROVIDED_LIBVIPS (or
      # a vix bump falling back to a source build) is exercised here rather than
      # discovered in prod. The premise was true; the price was not. The repo
      # sets no VIX_COMPILATION_MODE, so vix (0.38) runs in its default
      # PRECOMPILED_NIF_AND_LIBVIPS mode — the NIF arrives prebuilt with libvips
      # bundled — and this job never linked or ran the system libvips it
      # installed. MEASURED 2026-09-02, 39 s median over 10 completed replica
      # jobs, i.e. a third of a 112 s REQUIRED gate, spent on a hypothetical.
      # Insurance against a hypothetical does not get a third of a required
      # gate's runtime; it gets a tripwire — `scripts/vips-hedge-tripwire.sh`,
      # wired as a step of the `path-escape` job above, reds the moment
      # PLATFORM_PROVIDED_LIBVIPS is selected anywhere in api/config, api/mix.exs
      # or a workflow while no CI lane installs a system libvips. The insurance
      # survives; the 39 s does not.
      #
      # THE PRICE HISTORY, KEPT so nobody re-derives it. Four candidate cheaper
      # installs were measured on branch gates/prod-compile-bench before the
      # step was deleted outright:
      #
      #   apt-get update + install ............ 9s + 23s = 32s   passed
      #   install only, no update ............. 25s              passed
      #   install --no-install-recommends ..... 7s               FAILED
      #   download debs to a cache + dpkg -i .. 18s + 21s        FAILED
      #
      # Skipping `apt-get update` works only while the runner image's package
      # index is no older than the archive. The --no-install-recommends job
      # 404'd on `libblkid-dev_2.39.3-9ubuntu6.5_amd64.deb` — apt's own advice
      # being "maybe run apt-get update" — because it landed on image
      # ubuntu24/20260823.283 while the job that passed landed on 20260831.293:
      # same run, same minute, two images. A "try without the refresh, fall back
      # to it" shape was then run across 20 jobs: 20 of 20 took the fallback,
      # 0 of 20 found a fresh index. There was no cheap install to find, which
      # is why the answer was to stop installing.
      #
      # If system libvips is ever genuinely needed here, the tripwire will say
      # so by name; restore a step then, and prefer apt caching over a cold
      # `apt-get update && install` on the critical path.

      - name: Compile deps (prod)
        # Two paths, one step, so the before/after step timings stay comparable.
        # `--force` is NOT gone: it is what the fallback runs, and the fallback
        # is what the audit step selects whenever the restored tree is anything
        # less than complete.
        run: |
          if [ "${{ steps.depbuild_audit.outputs.mode }}" = "cached" ]; then
            echo "Dependency build tree restored and audited dependency-only + complete."
            mix deps.compile
          else
            echo "No usable dependency build cache — full forced rebuild."
            mix deps.compile --force
          fi
        env:
          MIX_ENV: prod

      # SAVED HERE, BEFORE `mix compile`, ON PURPOSE. This is the one moment in
      # the job at which the tree provably holds dependency artifacts and
      # nothing else — our application has not been compiled yet. Saving in a
      # post-job hook instead would archive `_build/prod/lib/barkpark` along
      # with everything else and poison the next run's cache; the tripwire above
      # would catch it, but catching it every run is not a design.
      - name: Drop our own application's build dir before saving
        if: steps.depbuild_audit.outputs.mode == 'rebuild'
        # `mix deps.compile` creates the app's own (empty) build dir as a side
        # effect. It is not a dependency, so it must not enter the cache.
        run: rm -rf _build/prod/lib/barkpark

      - name: Save compiled dependency artifacts (prod)
        if: steps.depbuild_audit.outputs.mode == 'rebuild'
        uses: actions/cache/save@v4
        with:
          path: api/_build/prod/lib
          key: ${{ runner.os }}-mix-prod-depbuild-v1-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('api/mix.lock') }}

      - name: Prod compile (--warnings-as-errors)
        # The gate. If this fails, the PR must be fixed before merge.
        run: mix compile --warnings-as-errors
        env:
          MIX_ENV: prod

  validation-perf:
    # Phase 3 WI4 — cross-field validation perf gate. Independent of mix-test
    # (which is advisory) so a perf regression blocks merge even while the
    # test suite is being remediated, and a flaky test does not mask perf
    # drift. Runs the synthetic 200-field / 100-rule bench, takes the median
    # of 5 timed runs, fails the job if median > 100ms.
    name: Validation perf bench (median-of-5, alarm >100ms)
    needs: changes
    # Pure api/** compute (bench/validation_perf.exs against the rule
    # evaluator), so it rides the COMPILE set. NOTE for the aggregator: this job
    # does NOT carry continue-on-error, so it is a genuine blocking gate.
    if: needs.changes.outputs.compile == 'true'
    # ubuntu-latest-4-core is a PAID larger-runner label — on this personal
    # account it never gets a runner, so every run containing this job sat
    # queued forever (no completed elixir run since 2026-04-26, masked by
    # cancel-in-progress until that was fixed). Standard runner + the bench's
    # median-of-5 absorbs the slower hardware; threshold unchanged.
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    strategy:
      fail-fast: false
      matrix:
        otp: ["27.0"]
        elixir: ["1.18.1"]
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            api/deps
            api/_build
          key: ${{ runner.os }}-mix-perf-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('api/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-perf-${{ matrix.otp }}-${{ matrix.elixir }}-

      - name: Fetch deps
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run validation perf bench (median-of-5, fail if >100ms)
        # --no-start skips OTP app boot. The bench is pure-compute; we don't
        # need Postgres just to time the rule evaluator.
        run: mix run --no-start bench/validation_perf.exs

  elixir-gate:
    # ── THE AGGREGATOR — the one name that should carry branch protection ──
    #
    # Deliberate shape, every part of it load-bearing:
    #
    #   * NO `strategy.matrix`. The published check-run name is then exactly the
    #     `name:` string below. A matrixed job's name either gains the full
    #     matrix tuple (`… (27.0, 1.18.1)`) or, if it never STARTED, publishes
    #     the literal uninterpolated `${{ matrix.x }}` — both unusable as a
    #     required context (charter D20). This name is a constant.
    #
    #   * `if: always()`. Without it this job would itself be `skipped` whenever
    #     an upstream failed — publishing a PASSING required context out of a
    #     failed run. This is the repo's first job-level `if: always()`.
    #
    #   * It ASSERTS on every upstream result instead of echoing them.
    #     `if: always()` buys the right to decide; it does not decide. A probe
    #     aggregator that merely printed `needs.will-fail.result` reported
    #     `success`, and a PR merged through it (charter D19).
    #
    #   * `format` IS in `needs` since task-e31b816b4b416db6 — and it is in
    #     `needs` BECAUSE it stopped being `continue-on-error`. That order is
    #     the whole rule, and it is not negotiable: for a coe job
    #     `needs.<job>.result` reads `success` EVEN WHEN IT FAILED, so adding
    #     one here launders a run-level lie straight into the required context.
    #     scripts/elixir-path-escape-check.test.sh asserts `coe_in_needs = ""`.
    #     The separate slice that comment used to point at is this one.
    #
    #     What it now judges is NOT "is the tree formatted" — nobody on a pull
    #     request can be held to that. The `format` job only fails when a file
    #     THE DIFF TOUCHES is unformatted (scripts/format-diff-scope.sh);
    #     inherited drift is printed and the job stays green. So the arm below
    #     is diff-scoped by construction, and on push:main — where there is no
    #     PR diff — it is neutral by construction.
    #
    # Allow-set, exhaustively: `success` always; `skipped` ONLY when the
    # dispatcher output that gated that job was literally 'false'. Everything
    # else — `failure`, `cancelled`, an unrecognised value, an empty string —
    # is a FAILURE, including a failure of the dispatcher itself.
    name: Elixir gate
    if: always()
    needs: [changes, mix-test, mix-prod-compile, validation-perf, path-escape, format]
    runs-on: ubuntu-latest
    steps:
      - name: Decide (fail-closed over every upstream result)
        env:
          R_CHANGES: ${{ needs.changes.result }}
          R_TEST: ${{ needs.mix-test.result }}
          R_PROD: ${{ needs.mix-prod-compile.result }}
          R_PERF: ${{ needs.validation-perf.result }}
          R_ESCAPE: ${{ needs.path-escape.result }}
          R_FORMAT: ${{ needs.format.result }}
          O_COMPILE: ${{ needs.changes.outputs.compile }}
          O_TEST: ${{ needs.changes.outputs.test }}
          # NOT a second verdict — R_FORMAT above is the verdict. This is the
          # NAMES, so the ::error:: (the only line the check-run API carries)
          # says WHICH file, per D770/D771. Empty on every green path.
          F_IN_DIFF: ${{ needs.format.outputs.unformatted_in_diff }}
        run: |
          set -euo pipefail

          echo "dispatcher outputs: compile='${O_COMPILE}' test='${O_TEST}'"
          echo

          bad=0

          # ── D377 tally: did anything SUBSTANTIVE actually run? ────────────
          # `bad` answers "is anything wrong"; it cannot answer "was anything
          # tested", and until wave 33 nothing did. These two answer it.
          # Only PATH-GATED jobs count: the dispatcher and the ratchet carry the
          # gate value NEVER and run on every head, so they are present in a
          # "nothing ran" run exactly as in a full one and can distinguish
          # nothing.
          dispatched=0
          not_dispatched=""

          # ── D770/D771 — `bad` SAYS THAT something is wrong, never WHICH ───
          # Measured by executing this very step body with one upstream =
          # failure: the step LOG names the offending job one line above, but
          # the `::error::` — the ONLY line the check-run API carries, and so
          # the only line a human at the merge button or the merge queue ever
          # reads — named NOTHING. `bad` is a bit; this is the set behind it.
          # It is appended at EVERY `bad=1` site, so it can never disagree with
          # the verdict: a job reaches this list through the same line that
          # reds the gate. DERIVED from `${job}` — never a hardcoded name, and
          # never a re-print of the step log.
          # Comma-joined, not space-joined: job names contain spaces
          # ("changes (dispatcher)", "path-escape ratchet"), so a space-joined
          # list cannot be read back as a set.
          reds=""

          # decide <job-name> <result> <gate-value>
          #   gate-value is the dispatcher output that gated the job, or the
          #   literal string NEVER for jobs that must always run. A skip is
          #   accepted only against a gate-value of exactly 'false'.
          decide() {
            local job="$1" result="$2" gate="$3"
            case "$result" in
              success)
                echo "  ok      ${job}: success"
                ;;
              skipped)
                if [ "$gate" = "false" ]; then
                  echo "  ok      ${job}: skipped — dispatcher said this path set was not touched (gate='false')"
                else
                  echo "  FAIL    ${job}: skipped, but its gate is '${gate}', not 'false'."
                  echo "          A skip here does NOT mean 'not needed'. It means the job never ran —"
                  echo "          most often because an upstream FAILED. Refusing to green a required"
                  echo "          context on it."
                  bad=1
                  reds="${reds:+${reds}, }${job}"
                fi
                ;;
              failure)
                echo "  FAIL    ${job}: failure"
                bad=1
                reds="${reds:+${reds}, }${job}"
                ;;
              cancelled)
                # SPLIT OUT OF THE `failure` ARM (charter D57). Both are RED and
                # both stay red — a cancelled upstream tested nothing, and D12
                # says a non-pass is a non-pass. What changed is that the gate
                # now SAYS WHICH.
                #
                # WHY THIS IS NOT COSMETIC. This fleet force-pushes stacked
                # branches daily and this workflow cancels in-progress runs on
                # non-main refs, so a superseded head is the COMMON way an
                # upstream ends up cancelled. Before this arm, a superseded run
                # and a genuine code failure were byte-identical at the required
                # -context level: MEASURED on sha 6539d929 after `gh run cancel`,
                # five upstream jobs read completed|cancelled while `Elixir gate`
                # read completed|failure and the merge refused with
                #   Required status check "Elixir gate" is failing.
                # — not `is cancelled.` The natural response to `is failing.` is
                # to go read a diff that is fine, on a branch nobody is on.
                #
                # The re-run prescription is the whole point: a cancelled
                # upstream is cleared by producing a NEW run, never by reading
                # code. Note the D102 trap while doing so — RE-RUNNING a workflow
                # DELETES its existing check-runs, so the required context goes
                # ABSENT (which never reports) before it goes green. Pushing a
                # fresh head sha mints new runs and is the safer move.
                echo "  FAIL    ${job}: CANCELLED — this job did not fail, it never finished."
                echo "          Nothing was tested, so this gate is RED (charter D12): a"
                echo "          non-pass is a non-pass and will not be laundered into green."
                echo "          But do NOT go read the diff — a cancellation is almost always"
                echo "          a SUPERSEDED HEAD (this workflow sets cancel-in-progress on"
                echo "          non-main refs), not a defect in your code."
                echo "          FIX: produce a NEW run. Push a fresh head sha. Re-running the"
                echo "          workflow instead DELETES its check-runs, so the required"
                echo "          context reads ABSENT rather than red until the re-run finishes"
                echo "          (charter D102)."
                bad=1
                reds="${reds:+${reds}, }${job} (cancelled, not failed)"
                ;;
              '')
                echo "  FAIL    ${job}: EMPTY result — this job is not in the aggregator's needs set,"
                echo "          or the run object is malformed. Cannot tell, therefore red."
                bad=1
                reds="${reds:+${reds}, }${job}"
                ;;
              *)
                echo "  FAIL    ${job}: unrecognised result '${result}'. Cannot tell, therefore red."
                bad=1
                reds="${reds:+${reds}, }${job}"
                ;;
            esac
            # Tally, for the D377 notice at the bottom of this step. NEVER-gated
            # jobs are excluded on purpose (see the declaration above).
            if [ "$gate" != "NEVER" ]; then
              case "$result" in
                success) dispatched=$((dispatched + 1)) ;;
                skipped) not_dispatched="${not_dispatched} ${job}" ;;
              esac
            fi
          }

          # The dispatcher itself may never skip: without it there are no gate
          # values, so nothing downstream can be judged.
          decide "changes (dispatcher)"    "${R_CHANGES}" "NEVER"
          decide "path-escape ratchet"     "${R_ESCAPE}"  "NEVER"
          decide "mix-test"                "${R_TEST}"    "${O_TEST}"
          decide "mix-prod-compile"        "${R_PROD}"    "${O_COMPILE}"
          decide "validation-perf"         "${R_PERF}"    "${O_COMPILE}"
          # DIFF-SCOPED. This job fails only when a file the PR TOUCHES is
          # unformatted; inherited main drift leaves it green. See the format
          # job's header for why the arm lives there and not in this step: the
          # diff is only computable where the checkout is.
          decide "format (diff-scoped)"    "${R_FORMAT}" "${O_COMPILE}"

          echo
          # The format arm is the one upstream whose red has a NAMEABLE cause
          # the aggregator can carry, so it carries it. Appended to `reds`
          # rather than printed separately: `reds` is what the ::error:: emits,
          # and a second channel is a second thing to go quiet.
          if [ -n "${F_IN_DIFF:-}" ]; then
            echo "  files this diff touches that are unformatted: ${F_IN_DIFF}"
            reds="${reds:+${reds} — }unformatted in this diff: ${F_IN_DIFF}"
          fi

          if [ "$bad" -ne 0 ]; then
            echo "::error::Elixir gate: at least one upstream job is not in the allow-set (see above). This is the required context; it is RED on purpose. NOT IN THE ALLOW-SET: ${reds}"
            exit 1
          fi

          # ── D377/D378 — SAY IT WHERE A PERSON AND AN API CAN READ IT ──────
          # A green here means one of two very different things and, until wave
          # 33, published byte-identical evidence for both: conclusion=success,
          # annotations=0, output.title=null, output.summary=null. Measured on
          # real heads — cloud-only PR #9656 and docs-only #9637 both greened
          # this context with every substantive job skipped, and the honest
          # sentence printed just below goes only to stdout, six clicks deep.
          #
          # Two mechanisms are RULED OUT BY MEASUREMENT, do not substitute one:
          #   * $GITHUB_STEP_SUMMARY does NOT populate the check-run API — eight
          #     workflows write it and 0 of 32 check-runs on that sha returned a
          #     non-null summary, pr-task-gate (which writes one) included.
          #   * Renaming this check is forbidden: `Elixir gate` is a frozen
          #     required context under enforce_admins=true, and a rename
          #     deadlocks main.
          # A bare ::notice:: DOES reach the annotations endpoint from a
          # succeeding, checkout-less, unmatrixed job — measured on probe branch
          # probe/elixir-gate-annotation, commit e9be79a8d, run 31055317124.
          #
          # ONE notice, never one per skipped job: GitHub caps annotations at 10
          # per level per step, so an N-per-job emitter truncates silently — the
          # same class of quiet lie this line exists to remove.
          if [ "$dispatched" -eq 0 ]; then
            echo "::notice title=Elixir gate: green — nothing ran::NOTHING ELIXIR RAN on this head.%0AElixir gate is green because this diff touched none of its declared path sets, NOT because anything was tested.%0ANot dispatched:${not_dispatched}%0AGreen here means NOT APPLICABLE to this diff. Read it as 'no Elixir job executed', never as 'the Elixir suite passed'."
          fi
          echo "Elixir gate: every upstream job either succeeded or was legitimately not dispatched."
