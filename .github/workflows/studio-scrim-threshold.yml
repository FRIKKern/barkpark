# Studio scrim abolition — the Studio inspector overlay does not dim the
# document it covers, and this workflow is what keeps that true.
#
# WHAT IT RUNS, and it is one command with no browser:
#
#   node scripts/studio-scrim-abolition-check.mjs --self-test
#
# The check parses api/lib/barkpark_web/layouts/root.html.heex and reds if ANY
# style rule attaches a `::after`/`::before` to `.editor-with-preview`. The
# `--self-test` half plants four scrim shapes and asserts each is caught, two
# near-misses and asserts each is ignored, and three unreadable sheets and
# asserts each is REFUSED rather than passed — because for an absence
# assertion "found nothing" is the PASS, so a broken parser passes for free.
#
# ── WHAT THIS REPLACED (task scrim-control-uncied-and-fixture-drift, then
#    the retirement that followed it) ─────────────────────────────────────────
# Until 2026-09-22 this job ran two commands against a five-rule scrim cascade:
# a drift check tying scripts/fixtures/studio-scrim-threshold.html back to
# root.html.heex BY SELECTOR, and then a playwright control that forced
# .editor-panel across the 860px container threshold and read `::after` content
# in all four width buckets x user-opened.
#
# That control is what MEASURED the retirement: with the whole family present
# it read `none` at 861px AND at 860px in 8 cells of 8. The generator painted
# nowhere — four suppressors (b29, D170, D155, D175/D187) had covered every
# shipped cell between them — so the generator and all four cancellations were
# deleted together and D127's ruling is now expressed by absence.
#
# THE APPARATUS RETIRED WITH ITS SUBJECT, and the reason is worth keeping: its
# ability to fail was PARASITIC ON THE DEAD GENERATOR. The self-test had to
# delete a suppressor first so the generator had a cell to itself and the probe
# had a scrim to see. With the generator gone that arm cannot fire, and the
# instrument would have gone quietly vacuous while still printing a confident
# eight-row table. A guard that can only ever read `none` is not a guard.
#
# The replacement is cheaper and reaches further: no browser, no fixture, no
# copy to drift, and it refuses shapes the matrix could not express — a scrim
# written without `:has()`, on `::before`, or under a class nobody anticipated.
#
# ── THE VENUE IS THIS JOB, NOT THIS FILE ─────────────────────────────────────
# There is deliberately NO `on: paths:` key. A paths-filtered workflow emits no
# check run on a non-matching PR, which makes it permanently unrequireable
# (docs/ops/merge-gates.md) and indistinguishable from a workflow that never
# started. Instead the `changes` job runs on every event and the `scrim` job
# carries a job-level `if:`, so a PR that touches nothing here still renders a
# SKIPPED check run with this job's name on it. Same polarity as
# shell-harnesses.yml's dispatcher: it never emits a silent false — an
# unresolvable base dispatches TRUE.
#
# ── THE COST ─────────────────────────────────────────────────────────────────
# Node 22 and nothing else. The playwright install, the ~253 MB chromium cache
# shared with paper-rig.yml and the 12-minute budget all went with the control;
# what is left is a checkout, a setup-node and one dependency-free script.
name: Studio scrim abolition

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # One group per PUSH SHA on main, per REF everywhere else — the shape every
  # main-triggered workflow in this repo carries, and the one
  # scripts/main-run-concurrency-check.sh keys on.
  group: studio-scrim-abolition-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    # THE DISPATCHER. No `if:`, no path filter — it runs on every event this
    # workflow fires for, so the job behind it always has a defined answer.
    # It NEVER emits a silent false: a missing base sha, an unresolvable base,
    # or any non-pull_request event all dispatch TRUE. A dispatcher that
    # "couldn't tell" and said false would skip the control and publish a green
    # check run over nothing — which is the exact species of failure this
    # workflow was created to end.
    name: Dispatch (scrim paths)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scrim: ${{ steps.set.outputs.scrim }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR HEAD, not the merge ref, and full history so the base sha is
          # resolvable for the diff below.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - id: set
        name: Does this head touch the scrim cascade or its instruments?
        # No `${{ }}` in this body: GitHub compiles an interpolated `run:`
        # scalar into ONE expression and measures it against a 21000-character
        # cap, and going over is a STARTUP FAILURE with zero jobs. The two
        # GitHub values arrive as env instead, leaving this a literal.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "event=$EVENT_NAME — dispatching TRUE (not a PR, nothing to diff against)"
            echo "scrim=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Unresolvable base, or a base with no common ancestor: TRUE, never a
          # guess. `git diff A...B` FAILS outright without a merge base, and
          # under `set -e` that would be a red dispatcher rather than a silent
          # false — survivable, but a needless red on a force-pushed or
          # re-parented head, so it is answered here instead.
          if [ -z "${BASE_SHA:-}" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "base sha '${BASE_SHA:-}' is unresolvable — dispatching TRUE rather than guessing"
            echo "scrim=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base "$BASE_SHA" HEAD >/dev/null 2>&1; then
            echo "no common ancestor with $BASE_SHA — dispatching TRUE rather than guessing"
            echo "scrim=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          echo "changed files:"
          printf '%s\n' "$changed" | sed 's/^/  /'
          verdict=false
          while IFS= read -r f; do
            case "$f" in
              api/lib/barkpark_web/layouts/root.html.heex) verdict=true ;;
              scripts/studio-scrim-abolition-check.mjs) verdict=true ;;
              .github/workflows/studio-scrim-threshold.yml) verdict=true ;;
            esac
          done <<EOF
          $changed
          EOF
          echo "scrim=$verdict"
          echo "scrim=$verdict" >>"$GITHUB_OUTPUT"

  scrim:
    needs: changes
    if: needs.changes.outputs.scrim == 'true'
    name: Studio scrim abolition check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          # 22: the script is ESM and uses node:fs / node:path / node:url only.
          node-version: "22"

      # THE GATE. Not piped to anything: a gate piped to `tail` reports tail's
      # exit code, and under load pipefail + SIGPIPE returns 141 and lies.
      #
      # --self-test, never the bare verdict. The bare run's pass condition is
      # "found no scrim", which a parser that stopped parsing satisfies
      # perfectly. The self-test arms are what make a green mean the check is
      # still able to go red.
      - name: Scrim abolition check (no browser)
        run: node scripts/studio-scrim-abolition-check.mjs --self-test
