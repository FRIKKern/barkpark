name: astro-search-finder-test

# Render-contract gate for the astro-search flagship finder. The vendored finder
# is byte-identity-gated (astro-finder-drift.yml), but the Astro GLUE that feeds
# it — `FinderIsland` + `shape-seed` — had NO gate, and a shape mismatch there
# shipped the "everything disappears on keystroke" bug green (the parity harness
# only compares query results, never renders/exercises the seam). This job runs
# the React-free `node --test` contract specs that assert the baked `SeedDoc[]`
# seed becomes a real `PrefixSeed` and `lookupPrefix` never throws — the exact
# regression, caught at the seam. Dep-free: no `npm ci`, no browser.
#
# It also carries the BUILD-GUARD contract for BOTH search-starter editions: the
# configs bake BARKPARK_TOKEN into browser JS, so each one must verify the token's
# auth_tier first and hard-fail on a privileged token. The path filter was scoped
# to `src/**` only, which meant it never saw EITHER config — a guard deletion
# shipped completely unwatched. Both config files are now in the filter and the
# guard test runs on any change to them. That was true and was not the whole
# subject: the same test file also walks the ENTIRE search-starter template
# (see the filter entry below), so the filter now names the whole template.
#
# Gates a PR only once registered as a required check in branch protection
# (a human GitHub step); until then it still reds the PR page on failure.

on:
  push:
    branches: [main]
    paths:
      # Kept in lockstep with the pull_request list below — GitHub Actions does
      # not expand YAML anchors, so the two lists are duplicated by necessity.
      - "templates/astro-search-starter/src/**"
      - "templates/astro-search-starter/astro.config.mjs"
      - "templates/search-starter/next.config.mjs"
      - "templates/search-starter/token-guard.test.mjs"
      # THE REST OF THE TEMPLATE THE token-guard JOB ACTUALLY READS. The two
      # config entries above are only two of `token-guard.test.mjs`'s subjects.
      # Its `no control in this template spends the public-read token on a
      # privileged mutation` suite WALKS THE WHOLE TEMPLATE — it asserts
      # `app/api/admin/reindex/route.ts` stays deleted, that no `.ts/.tsx/.mjs/
      # .js/.json` file anywhere under the template references `admin/reindex`,
      # that no `route.ts` builds an upstream `/reindex` URL, and that README.md
      # still carries the two honesty paragraphs; a separate floor asserts the
      # walk found >=50 source / >=20 code files so an emptied scan cannot pass
      # vacuously. NONE of those paths matched this list. MEASURED 2026-09-18 on
      # origin/main b73585c3f: restoring the deleted route (from 3ad3696c5^)
      # reds the suite 2 of 21 tests, exit 1 — and a diff consisting of exactly
      # that one file matched NO pattern here, so CI ran the guard on zero of
      # its own regressions. The header above says "Both config files are now in
      # the filter", which was true and was not the whole subject.
      - "templates/search-starter/**"
      - ".github/workflows/astro-search-finder-test.yml"
  pull_request:
    paths:
      - "templates/astro-search-starter/src/**"
      - "templates/astro-search-starter/astro.config.mjs"
      - "templates/search-starter/next.config.mjs"
      - "templates/search-starter/token-guard.test.mjs"
      # THE REST OF THE TEMPLATE THE token-guard JOB ACTUALLY READS. The two
      # config entries above are only two of `token-guard.test.mjs`'s subjects.
      # Its `no control in this template spends the public-read token on a
      # privileged mutation` suite WALKS THE WHOLE TEMPLATE — it asserts
      # `app/api/admin/reindex/route.ts` stays deleted, that no `.ts/.tsx/.mjs/
      # .js/.json` file anywhere under the template references `admin/reindex`,
      # that no `route.ts` builds an upstream `/reindex` URL, and that README.md
      # still carries the two honesty paragraphs; a separate floor asserts the
      # walk found >=50 source / >=20 code files so an emptied scan cannot pass
      # vacuously. NONE of those paths matched this list. MEASURED 2026-09-18 on
      # origin/main b73585c3f: restoring the deleted route (from 3ad3696c5^)
      # reds the suite 2 of 21 tests, exit 1 — and a diff consisting of exactly
      # that one file matched NO pattern here, so CI ran the guard on zero of
      # its own regressions. The header above says "Both config files are now in
      # the filter", which was true and was not the whole subject.
      - "templates/search-starter/**"
      - ".github/workflows/astro-search-finder-test.yml"

concurrency:
  group: astro-search-finder-test-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  finder-contract:
    name: Finder seed-shape contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Run through the floor, never bare `node --test`: a bare run whose glob
      # matches nothing prints "# tests 0" and exits 0, so this job would go
      # green having proven nothing at all. The floor reds on a zero-match
      # pattern, on a file that registers no tests, and prints the test count.
      #
      # `--floor 6` IS THE POINT OF THE LITERAL. Every other assertion the
      # runner makes is derived from this same glob, so deleting 4 of the 5
      # spec files shrinks the expectation along with the tree and the job
      # stays green. Six is a committed number: it cannot shrink unless a
      # human edits this line, which is what makes a partial deletion visible.
      # Adding a spec reds this with `raise the floor to N+1` -- bump it here.
      # Raised 5 -> 6 for src/lib/browse-request.test.ts (the build-time browse
      # seed's route-and-bearer decision).
      - name: Run the finder contract tests
        working-directory: templates/astro-search-starter
        run: node ../../scripts/node-test-floor.mjs --floor 6 'src/**/*.test.ts'

  token-guard:
    name: Browser-token build guard (both editions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Asserts BOTH build configs refuse a non-public-read BARKPARK_TOKEN:
      # astro.config.mjs (guard extracted from source — it cannot be imported
      # without astro's node_modules) and next.config.mjs (imported for real and
      # its async config factory invoked). Dep-free: no npm ci, fetch is stubbed.
      # Removing either guard reds this job.
      #
      # `--floor 1` on an EXPLICIT path is deliberately weak in the downward
      # direction -- a named path that disappears already reds on its own (the
      # runner's defect-2 clause), so the below-branch here is unreachable
      # today. It is committed for the upward one: the day this argument
      # becomes a glob, or a second guard file joins it, the floor says
      # `raise the floor to 2` instead of silently widening what this job
      # certifies.
      - name: Run the token-guard contract tests
        working-directory: templates/search-starter
        run: node ../../scripts/node-test-floor.mjs --floor 1 token-guard.test.mjs
