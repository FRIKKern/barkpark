# cp-ops — operator commands on the control plane, from a workflow_dispatch.
#
# The control plane's operator surface (mix barkpark_cloud.grant_forever, IEx
# rpc) lives on the CP box, but operator SSH is deliberately narrow: CI is the
# one place that already holds DEPLOY_SSH_KEY + CP_HOST (deploy.yml). This
# workflow reuses exactly those secrets to run a NAMED operator command — never
# a free-form remote shell. Each operation is an explicit case arm with its own
# validation in scripts/cp-ops.sh; adding one is a reviewed diff (a choice
# option below + an arm there + a golden row), not an input string.
name: cp-ops

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operator command to run"
        type: choice
        required: true
        options:
          - grant-forever
          - cp-app-logs
          - guerrilla-logs-grep
          - guerrilla-db-probe
          - site-runtime-install
          - site-artifact-fetch
          - box-logs
          - box-file-tail
          - caddy-repair
          - box-probe
          - box-prune
          - box-unit-repair
          - box-migrate
      team:
        description: "grant-forever: team UUID (as shown by bp whoami / bp teams)"
        required: false
      needle:
        description: "guerrilla-logs-grep / cp-app-logs: request id or token to grep (cp-app-logs: optional — omit for a plain tail)"
        required: false
      box_ip:
        description: "site-runtime-install / site-artifact-fetch: managed-box IPv4"
        required: false
      artifact_repo:
        description: "site-artifact-fetch: GitHub owner/repo whose tarball to stage"
        required: false
      artifact_ref:
        description: "site-artifact-fetch: git ref (branch or 40-hex sha) to stage"
        required: false
      unit:
        description: "box-logs: systemd unit (barkpark-builder | barkpark-runtime | barkpark-agent)"
        required: false
      file_path:
        description: "box-file-tail: file under /var/log/barkpark-builder/ to tail (200 lines)"
        required: false

jobs:
  run:
    # STATIC on purpose. A job `name:` that is nothing but an input
    # interpolation renders as a different check-run name on every dispatch, and
    # scripts/required-checks-generate.sh reads job names as TEMPLATES: an
    # all-interpolation template regexes to `^.+$` and claims EVERY rendered
    # name in the repo, erasing the continue-on-error/paths-filter/needs
    # provenance the selection stage excludes on. The operation still shows in
    # the UI — on the step below, where it cannot enter the workflow index.
    name: cp-ops operator command
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ${{ inputs.operation }} on the control plane
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          CP_HOST: ${{ secrets.CP_HOST }}
          GUERRILLA_HOST: ${{ secrets.GUERRILLA_HOST }}
          TEAM: ${{ inputs.team }}
          NEEDLE: ${{ inputs.needle }}
          BOX_IP: ${{ inputs.box_ip }}
          ARTIFACT_REPO: ${{ inputs.artifact_repo }}
          ARTIFACT_REF: ${{ inputs.artifact_ref }}
          UNIT: ${{ inputs.unit }}
          FILE_PATH: ${{ inputs.file_path }}
          OP: ${{ inputs.operation }}
        # The arms live in scripts/cp-ops.sh (task-2ea65cb8f1c71a2a): inline they
        # were a 22,389-byte scalar, one interpolation away from GitHub's 21,000-char
        # expression cap failing the whole workflow at startup. Every input stays
        # step env above — never interpolate one into this line.
        # scripts/cp-ops.test.sh holds the choice list above and the script's
        # case arms equal, both ways, and pins each arm's ssh argv to a golden.
        run: bash scripts/cp-ops.sh "$OP"
