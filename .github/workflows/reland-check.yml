name: reland-check

# Task-obsession layer 3 (CI half): does this PR touch files a recently-closed
# task already landed? Reads each closed task's content.landed.files (written at
# close by the land-digest close path) and flags overlap with the PR's changed
# files. ADVISORY ONLY — emits a ::warning:: + job summary, never blocks: reverts
# and follow-ups legitimately touch the same files.
#
# Dampers (see tooling/task-obsession/reland_check.py): hot files (frequency-
# derived + a seed list) carry no signal and are excluded; a finding against a
# task the PR's own task DEPENDS ON is suppressed (best-effort — needs a read
# token to fetch edges; without one, dependency findings are shown, still
# advisory).
#
# ADVISORY ≠ SILENT (arpss-w2, 2026-08-17). This job used to report "0 findings"
# for three DIFFERENT realities: a clean scan, a 404 error envelope read as an
# empty ledger (`curl -sS` has no `--fail`), and a 16%-of-the-corpus scan
# (limit=1000, no offset walk, 6212 live tasks). The fetch now runs through
# tooling/task-obsession/reland_fetch.py, which captures the HTTP status code,
# and whose 401/403-with-a-token note is now surfaced as its OWN advisory
# warning naming BARKPARK_TASK_TOKEN rather than as a generic "did not run"
# (2026-09-01: the shared secret was a revoked admin token, and every surface
# that read it reported an outage),
# offset-walks to exhaustion under a page cap, asks for ?count=true so `total` is
# known, and prints a tri-state `status=ok|infra|skipped`. NOTHING here reads
# `findings` without first reading `status`. `continue-on-error: true` stays —
# every loud state is a ::warning/::notice plus an always() summary, NEVER an
# ::error, because reverts and follow-ups legitimately re-touch landed files.
# Mutation proof: bash tooling/task-obsession/reland_loudfail.test.sh.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: reland-check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  reland-check:
    name: Re-land advisory (already-landed overlap)
    runs-on: ubuntu-latest
    continue-on-error: true # advisory — report, never block
    steps:
      # PINNED TO THE PR HEAD SHA, not the default merge ref (charter D34).
      # actions/checkout's default on a pull_request is refs/pull/N/merge — the
      # PR head ALREADY MERGED with the current base tip. Diffing that against
      # `base.sha` therefore reports every file anyone else landed on main since
      # this PR branched, not this PR's own files. Measured: `Re-land advisory`
      # concluded FAILURE on a probe PR whose only change was one docs file.
      # This is the same one-line fix the Elixir dispatcher took; this workflow
      # has exactly ONE checkout, so nothing else moves off the merge ref.
      # Still advisory today — it becomes a BLOCKING false red the moment any
      # name from this workflow is pinned into .github/required-checks.json.
      - name: Checkout (PR head, full history for the base diff)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Compute changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          # NOT --depth=1. The checkout above has full HEAD history, but
          # BASE_SHA (the base tip at event time) is usually NOT an ancestor of
          # HEAD, and a depth-1 fetch of it brings no ancestry — so the
          # three-dot diff below died `fatal: no merge base` on EVERY PR and the
          # old silent two-dot fallback re-inflated the set with every file main
          # gained since the branch point, reversed: the exact inflation the
          # head-sha checkout pin (charter D34) was supposed to remove.
          # MEASURED 2026-08-23: run 32643489947 counted 3 files for a 2-file
          # PR, run 32643498138 counted 9 for an 8-file PR, both logs carrying
          # `fatal: ...: no merge base` one line above the count.
          git fetch --no-tags origin "$BASE_SHA" 2>/dev/null || true
          if ! git merge-base "$BASE_SHA" HEAD >/dev/null 2>&1; then
            # NO two-dot fallback — measured above, `BASE_SHA HEAD` sweeps in
            # other people's commits. Same refusal the Elixir dispatcher
            # documents (elixir.yml `changes` job): a verdict from an unknown
            # base is worse than no verdict. This job is advisory
            # (continue-on-error at the job level), so this red reports
            # without blocking the PR.
            echo "::error::reland-check: no merge base between BASE_SHA ${BASE_SHA} and HEAD — refusing the two-dot fallback, which scores every file main gained since the branch point. This advisory cannot compute THIS PR's own file set."
            exit 1
          fi
          # THREE false-greens in one producer line, all of them SILENT:
          #   • `--name-only` QUOTES a path containing `"` (octal-escapes it too
          #     without core.quotepath=false), so `docs/we"ird.md` reaches the
          #     scanner as a quoted literal that matches no real file and the
          #     re-land scan simply never considers it;
          #   • rename detection prints only the DESTINATION, so a file renamed
          #     OUT of a watched tree vanishes from the changed set entirely;
          #   • a newline in a path splits one entry into two.
          # -z + --no-renames + core.quotepath=false close all three. Same
          # producer elixir.yml, cloud.yml, console-harness.yml, security.yml and
          # go-tests.yml carry — ONE shape, not six dialects. pipefail is set
          # above, so a failure in EITHER half still reaches the refusal below.
          git -c core.quotepath=false diff -z --name-only --no-renames "${BASE_SHA}...HEAD" \
            | tr '\0' '\n' > /tmp/changed.txt || {
            echo "::error::reland-check: three-dot diff against ${BASE_SHA} failed despite a resolvable merge base — refusing to score an empty or partial file set."
            exit 1
          }
          echo "Changed files: $(wc -l < /tmp/changed.txt)"

      - name: Extract the PR's task id (for self/edge suppression)
        id: ref
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -uo pipefail
          # ONE GRAMMAR, ONE TEST SUITE. This step used to carry its own copy of
          # the trailer regex, and the copy drifted from the gate's in three
          # measurable ways — so a PR could satisfy pr-task-gate and still be
          # mis-suppressed here, which is the quiet half of the same
          # instrument-honesty defect:
          #   • a trailer quoted INSIDE A FENCED CODE BLOCK matched, because the
          #     copy allowed leading whitespace. On this fleet's bodies — which
          #     quote real claimed ids constantly — the example won and the PR's
          #     OWN task went unsuppressed, so the PR could be reported as
          #     re-landing its own work while a bystander task was silenced.
          #   • TWO distinct trailers were resolved BY POSITION (head -1). The
          #     gate refuses instead, because picking is guessing.
          #   • a quote-wrapped id was accepted here and rejected by the gate.
          # The grammar now lives in exactly one place, scripts/pr-task-gate.sh,
          # where the hermetic harness can reach it. reland-check.yml runs after
          # actions/checkout, so the script is on disk.
          #
          # NEVER LET A PARSE MISS END THE STEP. GitHub runs `run:` bodies under
          # `bash -e`; an unguarded non-zero would kill this step BEFORE the
          # overlap check, rendering the job red with nothing checked. rc is
          # captured, never propagated.
          # $GITHUB_WORKSPACE, not a bare relative path: the runner sets it to
          # the checkout root, and tooling/task-obsession/reland_loudfail.test.sh
          # executes this very body from ITS own directory to prove the step
          # cannot die. A cwd-relative path would resolve in CI and vanish under
          # the harness — the extractor would be "missing" in exactly the place
          # that is supposed to catch it going missing.
          rc=0
          task_id="$(bash "${GITHUB_WORKSPACE:-.}/scripts/pr-task-gate.sh" --extract-task-id 2>/tmp/ref.err)" || rc=$?
          if [ "$rc" != "0" ]; then task_id=""; fi
          if [ -z "$task_id" ]; then
            # THE DISTINCTION THIS STEP EXISTS TO MAKE. "I could not parse the
            # body" and "this PR re-lands landed work" were the same red, which
            # is how a parse failure got read as a real overlap finding and sent
            # someone chasing a phantom. They are now different lines.
            echo "RELAND_TASK_ID_PARSED=0"
            if [ "$rc" = "4" ]; then
              # Exit 4 = the extractor found two or more DISTINCT column-0 ids
              # and refused to pick. The author DID name a task, so do not tell
              # them to add a trailer they already wrote.
              echo "::notice title=reland-check: ambiguous task reference::$(tr '\n' ' ' </tmp/ref.err) Self/edge suppression is OFF for this run and the overlap scan still runs below. THIS IS NOT AN OVERLAP FINDING."
            else
              echo "::notice title=reland-check: no task id parsed::No line matching '^Task: <id>' at column 0 could be parsed from this PR body. Self/edge suppression is OFF for this run and the overlap scan still runs below. THIS IS NOT AN OVERLAP FINDING and says nothing about whether this PR re-lands landed work."
            fi
          else
            echo "RELAND_TASK_ID_PARSED=1"
            echo "Task id: ${task_id}"
          fi
          echo "task_id=${task_id}" >> "$GITHUB_OUTPUT"

      - name: Fetch the ledger + run the re-land check
        id: check
        env:
          LEDGER_BASE: ${{ vars.BARKPARK_LEDGER_BASE || 'https://guerrilla.barkpark.cloud' }}
          LEDGER_TOKEN: ${{ secrets.BARKPARK_TASK_TOKEN }}
          PR_TASK: ${{ steps.ref.outputs.task_id }}
        run: |
          set -uo pipefail
          # The ledger read is anonymous-capable, but authenticate it anyway: the
          # token is already in this step's env, and an authenticated read is the
          # one that survives the task/paper visibility ruling either way.
          fetch_out="$(python3 tooling/task-obsession/reland_fetch.py \
            --base "$LEDGER_BASE" --out /tmp/tasks.json \
            --limit 1000 --max-pages 20 --timeout 20 --token "${LEDGER_TOKEN:-}")"
          printf '%s\n' "$fetch_out"
          get() { printf '%s\n' "$fetch_out" | sed -n "s/^$1=//p" | head -1; }
          status="$(get RELAND_STATUS)"; pages="$(get RELAND_PAGES)"
          docs="$(get RELAND_DOCS)";     total="$(get RELAND_TOTAL)"
          truncated="$(get RELAND_TRUNCATED)"; auth="$(get RELAND_AUTH)"
          note="$(get RELAND_NOTE)"
          {
            echo "status=${status:-infra}"
            echo "pages=${pages:-0}"
            echo "docs=${docs:-0}"
            echo "total=${total}"
            echo "truncated=${truncated:-0}"
            echo "auth=${auth:-anon}"
            echo "note=${note}"
          } >> "$GITHUB_OUTPUT"

          # A fork PR gets no secrets, so the ledger was read anonymously: the
          # scan is real but its COVERAGE is whatever an unauthenticated reader
          # sees. Said BEFORE the status gates so a fork is never silent about it.
          # Distinct from a rotated token, which 401s and lands in `infra` below.
          if [ "$auth" = "anon" ]; then
            echo "::notice title=Re-land check read the ledger ANONYMOUSLY::No BARKPARK_TASK_TOKEN (fork PRs get no secrets) — coverage is limited to publicly readable ledger rows, so this scan may be incomplete."
          fi

          # STATUS FIRST — a fetch that did not happen must never render as a
          # clean scan. Loud, but still advisory: ::warning, never ::error.
          #
          # AND A REFUSED CREDENTIAL GETS ITS OWN SENTENCE. This job reads the
          # SAME secret the pr-task-gate required check reads, and on
          # 2026-09-01T20:26Z that secret — then an instance admin token — was
          # revoked. reland_fetch.py already classifies the answer correctly
          # (`HTTP 401 from the ledger on page N — the token may have been
          # rotated`), but that note was then poured into the generic
          # `DID NOT RUN` warning alongside genuine outages, so the one class of
          # failure a re-run can never clear read identically to the one a
          # re-run always clears. This job is ADVISORY, so the remedy is a loud
          # ::warning that NAMES the secret — never an ::error, which would turn
          # a rotated token into a blocking red on an advisory check.
          # Matched with `case`, not grep: this step runs under GitHub's
          # `bash -e {0}` and a non-matching grep would abort it outright.
          if [ "$status" = "infra" ]; then
            case "$note" in
              *"HTTP 401 from the ledger"*|*"HTTP 403 from the ledger"*)
                echo "::warning title=BARKPARK_TASK_TOKEN was REFUSED — the re-land scan did not run::The ledger ANSWERED and rejected this job's credential (${note}). This is NOT a ledger outage and re-running will not clear it: fix the repository secret BARKPARK_TASK_TOKEN, which must be a least-privilege app token scoped read,write — never the instance admin token (one was set there and revoked 2026-09-01T20:26Z). No overlap was evaluated; this is advisory and non-blocking either way."
                ;;
              *)
                echo "::warning title=Re-land check DID NOT RUN::${note:-the ledger fetch failed}. This is NOT a clean scan — overlap was not evaluated (advisory, non-blocking)."
                ;;
            esac
            echo "findings=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$status" = "skipped" ]; then
            echo "::notice title=Re-land check skipped::${note:-not evaluated}."
            echo "findings=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$truncated" = "1" ]; then
            echo "::warning title=Re-land check scanned a PARTIAL ledger::walked ${pages} page(s) / ${docs} of ${total:-unknown} tasks — ${note:-page cap reached}. Findings below are incomplete (advisory)."
          fi

          # Best-effort dependency-edge suppression: needs a read token.
          deps=()
          if [ -n "${LEDGER_TOKEN:-}" ] && [ -n "${PR_TASK:-}" ]; then
            if curl -sS -m 20 -H "Authorization: Bearer ${LEDGER_TOKEN}" -o /tmp/edges.json \
                "${LEDGER_BASE%/}/v1/tasks/${PR_TASK}/edges" 2>/dev/null; then
              while IFS= read -r dep; do
                [ -n "$dep" ] && deps+=(--dep "$dep")
              done < <(python3 -c "import json;[print(e) for e in (lambda d:[x.get('to_id') or x.get('doc_id') for x in (d.get('dependencies') or d.get('edges') or [])])(json.load(open('/tmp/edges.json'))) if e]" 2>/dev/null || true)
            fi
          fi

          args=(--files /tmp/changed.txt --tasks /tmp/tasks.json --out /tmp/findings.json --strict)
          [ -n "${PR_TASK:-}" ] && args+=(--pr-task "$PR_TASK")
          # `${deps[@]+…}` not `"${deps[@]}"`: an EMPTY array is an unbound
          # variable under `set -u` on bash < 4.4, which aborts this whole step —
          # and `continue-on-error` would render that abort as a green check with
          # no findings written. Same silent-green class this job is fixing.
          python3 tooling/task-obsession/reland_check.py \
            "${args[@]}" ${deps[@]+"${deps[@]}"} 2>/tmp/reland.err || true
          cat /tmp/reland.err
          # Re-read STATUS from the check itself: `|| true` above means a crash
          # would otherwise leave the fetch's `ok` standing over an empty result.
          cstatus="$(sed -n 's/^RELAND_STATUS=//p' /tmp/reland.err | head -1)"
          digests="$(sed -n 's/^RELAND_DIGESTS_SCANNED=//p' /tmp/reland.err | head -1)"
          zero="$(sed -n 's/^RELAND_ZERO_DIGEST=//p' /tmp/reland.err | head -1)"
          n="$(sed -n 's/^RELAND_FINDINGS=//p' /tmp/reland.err | head -1)"
          echo "digests=${digests:-0}" >> "$GITHUB_OUTPUT"
          if [ -z "$cstatus" ]; then
            echo "status=infra" >> "$GITHUB_OUTPUT"
            echo "::warning title=Re-land check DID NOT RUN::reland_check.py printed no status (it crashed). This is NOT a clean scan (advisory, non-blocking)."
            echo "findings=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$cstatus" != "ok" ]; then
            echo "status=${cstatus}" >> "$GITHUB_OUTPUT"
            echo "::warning title=Re-land check DID NOT RUN::the fetched payload carried no task ledger. This is NOT a clean scan (advisory, non-blocking)."
            echo "findings=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$zero" = "1" ]; then
            echo "::warning title=Re-land check has NO SIGNAL to read::scanned ${docs} task(s) and not one carries a content.landed digest, so 0 findings means 'nothing to compare against', not 'no overlap'. ROOT CAUSE: content.landed is written only when a closer passes a 'landed' map at close time (close.ex merge_landed) and no closer does — the CLI close sends no such key; the repo also has no merge webhook wired, so the reconcile path never fires either. Fix tracked as arpss-reland-teach-closer-landed; signal gap as arpss-reland-check-zero-landed-signal (advisory)."
          fi
          echo "findings=${n:-0}" >> "$GITHUB_OUTPUT"

      - name: Post the advisory (non-blocking)
        # STATUS before FINDINGS: an infra/skipped run has no findings to post.
        if: steps.check.outputs.status == 'ok' && steps.check.outputs.findings != '0' && steps.check.outputs.findings != ''
        env:
          AUTH: ${{ steps.check.outputs.auth }}
        run: |
          set -uo pipefail
          {
            echo "## ⚠️ Re-land advisory"
            echo ""
            echo "This PR changes files that recently-closed tasks already landed. This is **advisory** — reverts and follow-ups legitimately touch the same files. If this is intentional, add a \`blocks\` dependency edge to the prior task to silence it."
            echo ""
            python3 -c 'import json; d=json.load(open("/tmp/findings.json")); [print("- task **%s** already landed: %s" % (f["task"], ", ".join("`%s`" % x for x in f["overlap"]))) for f in d["findings"]]'
            if [ "${AUTH:-}" = "anon" ]; then
              echo ""
              echo "> **Read ANONYMOUSLY — this list may be incomplete.** \`BARKPARK_TASK_TOKEN\` was not available (fork PRs get no secrets), so only ledger rows visible to an unauthenticated reader were scanned. Re-run this check on a branch in the base repo for the full picture."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Re-land advisory::${{ steps.check.outputs.findings }} recently-closed task(s) already landed files this PR changes. Advisory only — see the job summary."

      - name: What this check actually did (always)
        if: always()
        env:
          STATUS: ${{ steps.check.outputs.status }}
          PAGES: ${{ steps.check.outputs.pages }}
          DOCS: ${{ steps.check.outputs.docs }}
          TOTAL: ${{ steps.check.outputs.total }}
          TRUNCATED: ${{ steps.check.outputs.truncated }}
          DIGESTS: ${{ steps.check.outputs.digests }}
          FINDINGS: ${{ steps.check.outputs.findings }}
          AUTH: ${{ steps.check.outputs.auth }}
          NOTE: ${{ steps.check.outputs.note }}
        run: |
          set -uo pipefail
          # The honest states, spelled out: this job is advisory, so its green
          # conclusion carries no information — this table is the signal.
          case "${STATUS:-infra}" in
            ok) verdict="scanned the ledger" ;;
            infra) verdict="**DID NOT RUN** — this is not a clean scan" ;;
            skipped) verdict="deliberately not evaluated" ;;
            *) verdict="**unknown** (the check printed no status)" ;;
          esac
          {
            echo "### Re-land check: ${verdict}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| status | \`${STATUS:-infra}\` |"
            echo "| ledger pages walked | ${PAGES:-0} |"
            echo "| tasks scanned | ${DOCS:-0}${TOTAL:+ of ${TOTAL}} |"
            echo "| truncated | ${TRUNCATED:-0} |"
            echo "| land digests found | ${DIGESTS:-0} |"
            echo "| findings | ${FINDINGS:-0} |"
            echo "| ledger read as | \`${AUTH:-anon}\` |"
            echo "| changed files | $(wc -l < /tmp/changed.txt 2>/dev/null || echo '?') |"
            [ -n "${NOTE:-}" ] && echo "| note | ${NOTE} |"
            if [ "${DIGESTS:-0}" = "0" ] && [ "${STATUS:-}" = "ok" ] && [ "${DOCS:-0}" != "0" ]; then
              echo ""
              echo "> **0 findings here means \"nothing to compare against\"**, not \"no overlap\": no scanned task carries a \`content.landed\` digest. **Root cause (dominant):** \`content.landed\` is written only by the close-path \`merge_landed\` (\`close.ex\`) when the closer supplies a \`landed\` map at close time — and no closer does (the \`bp\` CLI close sends no \`landed\` key). **Secondary:** the repo has no merge webhook wired, so the \`reconcile_merge_gate\` path never fires to backfill one either. Teaching a closer to compute and pass \`landed.files\` is tracked as \`arpss-reland-teach-closer-landed\`; this signal gap as \`arpss-reland-check-zero-landed-signal\`."
            fi
            if [ "${AUTH:-}" = "anon" ]; then
              echo ""
              echo "> Read **anonymously** — \`BARKPARK_TASK_TOKEN\` was unavailable (fork PRs get no secrets), so coverage is whatever an unauthenticated reader can see."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
