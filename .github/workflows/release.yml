name: release

# Phase 8 slice 8.0 preflight — Changesets publish pipeline.
#
# CRITICAL: `dry_run` input defaults to `true`. Until slice 8.2 opens the first
# real @preview publish, every run of this workflow MUST go through the dry-run
# path. The operator must explicitly flip `dry_run=false` via workflow_dispatch
# to produce a real npm publish.
#
# DIST-TAG OWNERSHIP. Two steps decide where a publish lands, and between them
# they cover both modes:
#   * NOT in pre-mode — `--tag "<dist_tag>"` is passed to the publish CLI, so the
#     `dist_tag` input below decides the channel directly.
#   * IN pre-mode — the publish CLI REFUSES --tag, and changesets' getReleaseTag
#     silently routes every "only-pre" package to `latest` instead of the
#     pre-tag. So `Point the channel dist-tag at the published versions` runs an
#     explicit `npm dist-tag add` afterwards, derived from the publish output.
# Before both existed, `dist_tag` decided nothing at all and the `preview`
# channel was maintained by no mechanism — see those steps for the measurement.
#
# Reference: .doey/plans/masterplan-phase8-20260418-190403-refined.v2.md §8.0
# (deliverable 3 — wire release.yml default tag to `preview`) and §13.C B4
# (OIDC provenance + unscoped `create-barkpark-app` compatibility concern).

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        # Consumed, not decorative: passed as `--tag` to the publish CLI outside
        # pre-mode, and reconciled against .changeset/pre.json inside it (a
        # disagreement is a hard failure, never a silent publish under another
        # name). See "Resolve the channel dist-tag" below.
        description: "npm dist-tag to publish under (in pre-mode must equal .changeset/pre.json tag)"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - next
          - latest
      dry_run:
        description: "If true, run `changeset publish --dry-run` only (no npm writes)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    tags:
      # Auto-trigger only on 1.x semver tags produced by the release cycle.
      # Slice 8.0 does not push any tags, so this branch is dormant until 8.2.
      - "v1.*"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Changesets publish
    runs-on: ubuntu-latest

    permissions:
      # Required for npm provenance via OIDC (Sigstore).
      id-token: write
      # Read-only on source; changesets itself may open version PRs via a
      # separate job in a follow-up slice (not this slice).
      contents: read

    # The publish command runs inside js/; that's where pnpm-workspace.yaml +
    # .changeset/ live.
    defaults:
      run:
        working-directory: js

    steps:
      - name: Resolve effective dist-tag + dry-run
        id: mode
        working-directory: ${{ github.workspace }}
        run: |
          # push-tag triggers use slice 8.10 semantics (latest, real publish).
          # workflow_dispatch uses operator-supplied inputs.
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=${{ github.event.inputs.dist_tag }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=${{ github.event.inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail loudly if NPM_TOKEN is missing
        # PRESENCE ONLY. This step proves the secret is set; it proves NOTHING
        # about whether the registry still accepts it. A revoked, expired or
        # typo'd token passes this check unchanged — the byte count is a
        # measurement of a string, not of authorization. The real measurement
        # is the `npm whoami` preflight below; do not treat this step as one.
        working-directory: ${{ github.workspace }}
        env:
          # Intentionally reference the secret here — GitHub masks it in logs;
          # we only test whether the env var is non-empty, never echo it.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error title=Missing NPM_TOKEN::repository secret NPM_TOKEN is not set — release cannot proceed"
            exit 1
          fi
          echo "NPM_TOKEN present ($(printf %s "${NPM_TOKEN}" | wc -c) bytes) — presence only, NOT proof of authorization."

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure main ref exists locally
        # changesets CLI (config.baseBranch = "main") requires a local `main`
        # ref to diff against on feature-branch runs. actions/checkout leaves
        # only `origin/main`; materialize a local branch pointing at it.
        working-directory: ${{ github.workspace }}
        run: |
          if ! git rev-parse --verify main >/dev/null 2>&1; then
            git branch main origin/main
          fi
          git rev-parse --short main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Resolve the channel dist-tag (pre.json is the authority in pre-mode)
        id: channel
        # THE CHANNEL THE `preview` TAG NEVER HAD. In pre-mode, changesets'
        # getReleaseTag (@changesets/cli 2.31.0, changesets-cli.cjs.js:1002-1007)
        # returns preState.tag ONLY when the package has already published
        # something that is not a prerelease. Every @barkpark package has
        # published nothing but prereleases ("only-pre"), so `changeset publish`
        # sends them to `latest` and NOTHING ever moves `preview`. Measured on
        # the live registry 2026-09-11: `npm view @barkpark/core dist-tags`
        # -> {latest: 1.0.0-preview.3, preview: 1.0.0-preview.2}; identical for
        # @barkpark/nextjs. Both preview.3 versions were published by run
        # 25019649888 (2026-04-27T21:09:39Z) whose own summary says
        # "dist-tag: `preview`" — the input asserted a choice nothing consumed.
        # This step decides the channel; the "Point the channel dist-tag at the
        # published versions" step at the end of the job applies it.
        run: |
          set -euo pipefail
          PRE_MODE=none
          PRE_TAG=""
          if [ -f .changeset/pre.json ]; then
            PRE_MODE="$(node -p 'JSON.parse(require("fs").readFileSync(".changeset/pre.json","utf8")).mode || "none"')"
            PRE_TAG="$(node -p 'JSON.parse(require("fs").readFileSync(".changeset/pre.json","utf8")).tag || ""')"
          fi
          CHANNEL="${DIST_TAG_INPUT}"
          if [ "${PRE_MODE}" = "pre" ]; then
            if [ "${CHANNEL}" != "${PRE_TAG}" ]; then
              # A dispatch is an operator ASSERTING a channel. In pre-mode the
              # publish CLI cannot honour it (--tag is rejected outright), so
              # the only honest outcomes are: refuse, or — on the tag-push leg,
              # where nobody chose anything — say out loud that pre.json wins.
              if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
                echo "::error title=dist_tag disagrees with pre.json::dispatch asked for '${CHANNEL}' but .changeset/pre.json tag is '${PRE_TAG}'. Pre-mode forbids --tag, so pre.json is the channel: dispatch with dist_tag=${PRE_TAG}, or run 'changeset pre exit' first."
                exit 1
              fi
              echo "::warning title=Channel overridden by pre-mode::pre.json tag '${PRE_TAG}' overrides the '${CHANNEL}' default on this ${EVENT_NAME} trigger"
            fi
            CHANNEL="${PRE_TAG}"
          fi
          echo "pre_mode=${PRE_MODE}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "pre_mode=${PRE_MODE} pre_tag=${PRE_TAG:-(none)} dist_tag input=${DIST_TAG_INPUT} -> channel=${CHANNEL}"
        env:
          DIST_TAG_INPUT: ${{ steps.mode.outputs.dist_tag }}
          EVENT_NAME: ${{ github.event_name }}

      - name: npm identity preflight (MEASURES the token)
        # WHY THIS EXISTS. Until this step landed, both of the workflow's green
        # receipts about NPM_TOKEN survived a revoked token:
        #   1. the "NPM_TOKEN present (N bytes)" step above measures a string;
        #   2. the dry-run publish does not touch auth at all — measured
        #      2026-08-05 in a scratch dir with
        #      `//registry.npmjs.org/:_authToken=npm_BOGUSBOGUS`,
        #      `npm publish --dry-run --access public --tag preview` exited 0
        #      and printed `+ @barkpark/react@1.0.0-preview.99`, while
        #      `npm whoami` in that SAME directory returned E401 Unauthorized.
        # `npm whoami` is therefore the cheapest call that actually asks the
        # registry whether this credential is still alive, and it fails closed.
        #
        # DO NOT substitute `npm access list packages @barkpark` here: it prints
        # a read-write map to an entirely unauthenticated caller (the same bytes
        # `curl -s https://registry.npmjs.org/-/org/barkpark/package` returns
        # with zero credentials), so it is a receipt that descends from nothing.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if ! WHO="$(npm whoami 2>&1)"; then
            echo "$WHO"
            echo "::error title=NPM_TOKEN rejected by the registry::npm whoami failed — the token is missing, expired or revoked. Rotate NPM_TOKEN before releasing."
            exit 1
          fi
          echo "npm whoami -> ${WHO} (registry accepted the token)"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture pre-release workspace versions
        # First half of the publish-set assertion (see "Assert the published set
        # equals the release plan" below). Snapshot every publishable package's
        # version BEFORE `changeset version` rewrites them, so the plan can be
        # derived by difference rather than asserted by hand.
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/scan-versions.cjs" <<'EOF'
          const fs = require("fs");
          const dirs = ["docs", ...fs.readdirSync("packages").map((d) => "packages/" + d)];
          const out = {};
          for (const d of dirs) {
            const p = d + "/package.json";
            if (!fs.existsSync(p)) continue;
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            if (j.private || !j.name || !j.version) continue;
            out[j.name] = j.version;
          }
          fs.writeFileSync(process.env.OUT, JSON.stringify(out, null, 2));
          EOF
          OUT="${RUNNER_TEMP}/versions-before.json" node "${RUNNER_TEMP}/scan-versions.cjs"
          cat "${RUNNER_TEMP}/versions-before.json"

      - name: Changesets version
        # Consume pending .changeset/*.md files into package.json version bumps
        # (and, in pre-mode, append their ids to .changeset/pre.json.changesets).
        # Skipping this step is the root of the "publish skipped every package
        # because versions were already published" misfire — see Task #8 and
        # Boss msg 144 PATH B. Safe to run when no changesets are pending:
        # `changeset version` is a no-op if .changeset/ has no unconsumed
        # entries. Lockfile is refreshed in --lockfile-only mode so the next
        # step sees the new versions without a full re-resolve.
        #
        # GITHUB_TOKEN is required by @changesets/get-github-info to fetch PR
        # and commit metadata used in generated changelog entries. Without it,
        # the version step aborts and publish never runs (Task #14 regression
        # from PR #32 / Task #8).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm changeset version
          pnpm install --lockfile-only

      - name: Derive the release plan
        # Second half of the publish-set assertion. The plan is exactly the set
        # of packages whose version `changeset version` just moved — derived,
        # never hand-listed.
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/versions-after.json" node "${RUNNER_TEMP}/scan-versions.cjs"
          node -e '
            const fs = require("fs");
            const before = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/versions-before.json", "utf8"));
            const after = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/versions-after.json", "utf8"));
            const plan = {};
            for (const [name, version] of Object.entries(after)) {
              if (before[name] !== version) plan[name] = version;
            }
            fs.writeFileSync(process.env.RUNNER_TEMP + "/release-plan.json", JSON.stringify(plan, null, 2));
            const entries = Object.entries(plan);
            console.log("release plan (" + entries.length + " package(s)):");
            for (const [n, v] of entries) console.log("  " + n + "@" + v);
          '

      - name: Build all packages
        run: pnpm -r build

      - name: Changesets status (informational)
        # In pre-mode, after `changeset version` has consumed a changeset into
        # pre.json.changesets, the local tree shows version-bumped packages
        # with no pending .changeset/*.md — which makes `status` exit 1 with
        # "Some packages have been changed but no changesets were found."
        # This is expected for a publish-only run: the real gate is the
        # `changeset publish` invocation below (which prints "No unreleased
        # changesets found" and exits 0 when there is nothing to publish).
        # Run as informational only.
        continue-on-error: true
        run: pnpm changeset status --verbose

      - name: Publish (dry-run)
        if: steps.mode.outputs.dry_run == 'true'
        env:
          # Auth is provided for parity with the real leg only. It is NOT
          # exercised here: `npm publish --dry-run` never contacts the auth
          # path — measured 2026-08-05, a bogus token dry-runs green (see the
          # "npm identity preflight" step, which is where the token is actually
          # measured).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          PRE_MODE: ${{ steps.channel.outputs.pre_mode }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          set -euo pipefail
          echo "::notice title=Dry-run mode::no npm writes will occur"
          # `changeset publish` does not support --dry-run. pnpm's recursive
          # publish does: it resolves workspace:* / workspace:^ protocols in
          # the published tarball and walks each publishable package exactly
          # as the real publish would. --no-git-checks skips the "must be on
          # clean main" gate (we're on a feature branch by design).
          # --tag ONLY outside pre-mode: pre-mode rejects an explicit tag with
          # "Releasing under custom tag is not allowed in pre mode". Inside
          # pre-mode the channel is applied afterwards by the explicit
          # `npm dist-tag add` step, because changesets routes "only-pre"
          # packages to `latest` and would otherwise leave the channel frozen.
          TAG_ARGS=()
          if [ "${PRE_MODE}" != "pre" ]; then
            TAG_ARGS=(--tag "${CHANNEL}")
          fi
          echo "publish argv tail: ${TAG_ARGS[*]:-(no --tag; pre-mode)}"
          pnpm publish -r --dry-run --access public --no-git-checks "${TAG_ARGS[@]}" 2>&1 | tee "${RUNNER_TEMP}/publish.log"

      - name: Publish (REAL — emits to npm)
        if: steps.mode.outputs.dry_run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # NPM_CONFIG_PROVENANCE enables --provenance on every internal
          # `npm publish` invoked by changesets. Equivalent to passing
          # --provenance as a flag; per npm docs both forms are accepted.
          NPM_CONFIG_PROVENANCE: "true"
          PRE_MODE: ${{ steps.channel.outputs.pre_mode }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          # `set -euo pipefail` is LOAD-BEARING, not decoration, and matches the
          # dry-run sibling above. Actions' unspecified-shell default is
          # `bash -e {0}` — WITHOUT pipefail — so `pnpm changeset publish | tee`
          # would take tee's 0 as the step status and a real npm refusal (E401,
          # OTP required, provenance rejected) would exit this step GREEN. The
          # red then landed one step later in "Assert the published set equals
          # the release plan", describing a plan/log mismatch instead of naming
          # pnpm's actual refusal. Keep this line: an npm refusal must red the
          # step that caused it.
          set -euo pipefail
          echo "::warning title=Real publish::channel=${CHANNEL} (pre_mode=${PRE_MODE}) — writes to npm"
          # TODO(B4): npm provenance for unscoped `create-barkpark-app` has
          # historically been less well-tested than for scoped packages.
          # If this step fails specifically on `create-barkpark-app` while
          # `@barkpark/*` packages succeed, fall back to publishing that one
          # package without provenance (documented rescue path in
          # .doey/plans/masterplan-phase8-20260418-190403-refined.v2.md §13.C B4).
          # --tag ONLY outside pre-mode (pre-mode fails with "Releasing under
          # custom tag is not allowed in pre mode"). In pre-mode the channel is
          # applied by the explicit `npm dist-tag add` step below — pre.json's
          # tag does NOT reach the registry on its own for "only-pre" packages.
          TAG_ARGS=()
          if [ "${PRE_MODE}" != "pre" ]; then
            TAG_ARGS=(--tag "${CHANNEL}")
          fi
          echo "publish argv tail: ${TAG_ARGS[*]:-(no --tag; pre-mode)}"
          pnpm changeset publish "${TAG_ARGS[@]}" 2>&1 | tee "${RUNNER_TEMP}/publish.log"

      - name: Assert the published set equals the release plan
        # WHY THIS EXISTS. `changeset publish` SKIPS a package whose version is
        # already on npm and still exits 0, and the pnpm dry-run leg does not
        # even name it. Measured 2026-08-05 on a versioned tree: the exact
        # dry-run command above returned rc=0 across 67 lines with three
        # `+ pkg@version` lines and ZERO occurrences of "nextjs" or
        # "create-barkpark" anywhere in the output, while the release plan had
        # bumped five packages. A green release that shipped 3 of 5 is exactly
        # the receipt this step refuses to hand out: the plan is the
        # measurement, and the publish output must match it in BOTH directions.
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const tmp = process.env.RUNNER_TEMP;
            const plan = JSON.parse(fs.readFileSync(tmp + "/release-plan.json", "utf8"));
            const log = fs.readFileSync(tmp + "/publish.log", "utf8");
            // Both publish surfaces announce one package per line:
            //   pnpm publish -r --dry-run  ->  "+ @barkpark/core@1.0.0-preview.4"
            //   changeset publish          ->  "🦋  @barkpark/core@1.0.0-preview.4"
            // Anything with extra words on the line (warnings, "info npm info
            // <pkg>") is deliberately NOT matched.
            const published = new Set();
            for (const raw of log.split("\n")) {
              const line = raw.replace(/\r/g, "").trim();
              const m = line.match(/^(?:\+|🦋)\s+(@[^@\s\/]+\/[^@\s]+|[^@\s\/]+)@(\S+)$/u);
              if (m) published.add(m[1] + "@" + m[2]);
            }
            const planned = new Set(Object.entries(plan).map(([n, v]) => n + "@" + v));
            // The published set is also the input to the channel dist-tag step
            // below: the versions npm actually took, never a hand-typed list.
            fs.writeFileSync(tmp + "/published.json", JSON.stringify([...published].sort(), null, 2));
            const missing = [...planned].filter((x) => !published.has(x)).sort();
            const extra = [...published].filter((x) => !planned.has(x)).sort();
            console.log("planned:   " + ([...planned].sort().join(", ") || "(none)"));
            console.log("published: " + ([...published].sort().join(", ") || "(none)"));
            if (missing.length === 0 && extra.length === 0) {
              console.log("published set == release plan (" + planned.size + " package(s))");
              process.exit(0);
            }
            if (missing.length) {
              console.log("::error title=Packages the plan bumped but publish never reported::" + missing.join(", "));
            }
            if (extra.length) {
              console.log("::error title=Packages published that the plan did not bump::" + extra.join(", "));
            }
            process.exit(1);
          '

      - name: Point the channel dist-tag at the published versions
        # THE MECHANISM. Outside pre-mode `--tag` on the publish itself already
        # placed the channel, so this step is pre-mode only — which is exactly
        # the case changesets does not handle: getReleaseTag returns `latest`
        # for every "only-pre" package, so without this step `preview` moves
        # only when a human runs `npm dist-tag add` by hand, and re-freezes one
        # version later. That is the state this repo shipped for three months.
        #
        # It is not a one-off: it reads ${RUNNER_TEMP}/published.json — written
        # by the publish-set assertion above from the `+ pkg@ver` (pnpm) and
        # `🦋  pkg@ver` (changesets) lines of the publish output that just ran —
        # so the argv is derived from what npm actually took. On the dry-run leg
        # the argv is PRINTED and nothing is executed, which makes every dry run
        # a rehearsal of the next real publish's tag.
        if: steps.channel.outputs.pre_mode == 'pre'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const specs = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/published.json", "utf8"));
            process.stdout.write(specs.join("\n") + (specs.length ? "\n" : ""));
          ' > "${RUNNER_TEMP}/channel-specs.txt"
          if [ ! -s "${RUNNER_TEMP}/channel-specs.txt" ]; then
            echo "::notice title=Nothing published::no package to point '${CHANNEL}' at"
            exit 0
          fi
          RC=0
          while read -r SPEC; do
            [ -n "${SPEC}" ] || continue
            echo "npm dist-tag add ${SPEC} ${CHANNEL}"
            if [ "${DRY_RUN}" != "true" ]; then
              npm dist-tag add "${SPEC}" "${CHANNEL}" || RC=1
            fi
          done < "${RUNNER_TEMP}/channel-specs.txt"
          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice title=Dry run::the argv above was printed, not executed"
            exit 0
          fi
          if [ "${RC}" -ne 0 ]; then
            echo "::error title=dist-tag add failed::'${CHANNEL}' does not point at everything this run published — the channel is now split. Re-run, or remediate with the retag workflow."
            exit 1
          fi
          echo "'${CHANNEL}' now points at every package this run published"

      - name: Summary
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          {
            echo "## Release run summary"
            echo ""
            echo "- trigger: \`${{ github.event_name }}\`"
            echo "- dist_tag input: \`${{ steps.mode.outputs.dist_tag }}\`"
            echo "- effective channel: \`${{ steps.channel.outputs.channel }}\` (pre_mode: \`${{ steps.channel.outputs.pre_mode }}\`)"
            echo "- dry_run: \`${{ steps.mode.outputs.dry_run }}\`"
            echo "- commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
