concurrency:
  # One group per PUSH SHA on main, per REF everywhere else. GitHub keeps ONE
  # not-yet-started run per group, so a shared main group meant every merge
  # evicted the previous main run before a runner picked it up — measured
  # 2026-09-02: 37 of 40 main runs since 10:27Z cancelled, 1 completed. A
  # per-sha group lets every main run complete; the cost is one run per merge,
  # which is what this workflow already intends. PR refs keep superseding.
  group: doc-gates-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # Cancel superseded PR runs, but NEVER cancel main: fast push cadence
  # otherwise starves the suite (2026-06-10: 19 consecutive main runs
  # cancelled, zero completions all day). Queued main runs collapse to one.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  doc-gates:
    name: Doc budgets + anchors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the NEW-lineref gate below can reach the PR base and
          # diff against the MERGE BASE. At the default depth of 1 there is no
          # base commit in the clone, and that gate would exit 2
          # (HARNESS-UNAVAILABLE) on every PR — honest, but it would never
          # actually check anything. Every other step here reads the worktree
          # and is indifferent to depth.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # EVERY GATE STEP BELOW CARRIES `if: ${{ !cancelled() }}` — a red gate
      # must not disarm its neighbours (task-9c2cd9e440f8ebac). These steps are
      # INDEPENDENT: each runs its own scanner over the committed tree and
      # consumes nothing from any other gate; only Checkout / Set up Node /
      # Set up Go are real dependencies. Without conditions the steps are
      # sequential, so the first failure aborted the job and GitHub stamped
      # every later step `skipped` — measured on run 33499694026 (main): one
      # red citation guard silently skipped TEN steps, among them the tenant
      # fail-open baseline gate, the nil-polarity fail-closed gate, the
      # preview-env isolation gate and the scaffy anchor-drift gate, plus
      # three of their tripwires. A skipped gate does not report, and does not
      # report that it did not report — the job already says `failure` for the
      # other reason, so the silence reads as noise. The same shape was
      # recorded in July behind spd-w19-literal-gate-entity and recurred five
      # weeks later behind a new red step; the condition fixes the structure,
      # not the incident.
      #
      # `!cancelled()`, NEVER `always()`: always() also runs the step on
      # CANCELLATION, and this repo cancels superseded runs constantly (21 of
      # 60 recent main runs) — always() would burn runner minutes on dead
      # trees and emit verdicts nobody should read. The job still reds when
      # any gate reds: a step condition changes when a step RUNS, never how
      # its failure counts.
      #
      # Set up Go carries the condition too, so the scaffy gates behind it can
      # execute after an unrelated earlier red. If setup itself fails, the
      # gates below fail loudly on the missing toolchain — loud is the point;
      # `skipped` is the only outcome this job must never produce for a gate.

      # --selftest FIRST (distrust vacuous green). The 13-arm harness plants a
      # real violation and re-invokes the shipping script for each one; it had
      # NO CI caller, so it was rotting unexecuted — a harness nothing runs is
      # indistinguishable from no harness, and worse, because its presence is
      # what stops anyone writing one.
      #
      # Arms (j0)-(j2) are new and cover the half CI actually runs this script
      # for. Every pre-existing arm exercises --span-only, which SKIPS the
      # fixed-caps loop: measured 2026-08-20, blinding the CAPS heredoc dropped
      # the gate from 35 size verdicts to 7 — CLAUDE.md, docs/api-v1.md and every
      # contract doc unchecked — and it still printed PASS while the 11-arm
      # selftest passed straight through. The gate now pins the row count against
      # a committed literal and the harness proves that ratchet bites in both
      # directions.
      - name: Doc byte budgets (fails this job)
        id: s1
        continue-on-error: true  # main-red breaker: the Decide step below owns the verdict
        if: ${{ !cancelled() }}
        run: |
          if [ -z "${BREAKER_CAPTURE_ARMED:-}" ] && [ -f "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" ]; then exec bash "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" "$0"; fi  # main-red breaker: capture this step's error block
          # UNREACHABLE REPORTER (task-1c8165ef0ada4fcd). The runner runs a `run:`
          # body as `/usr/bin/bash -e {0}`, so a bare `--selftest` that exits
          # non-zero ABORTS THE STEP and the shipping gate below it never runs —
          # its per-finding lines never reach the log, and main-red-breaker.sh
          # then reads the step as OPAQUE-RED / OWNERSHIP-UNDETERMINED because the
          # selftest sentence names nothing. Capture both statuses, run BOTH,
          # adjudicate after. The step still fails when either one fails.
          st_rc=0; bash scripts/check-doc-budgets.sh --selftest || st_rc=$?
          gate_rc=0; bash scripts/check-doc-budgets.sh || gate_rc=$?
          echo "selftest exit=$st_rc  gate exit=$gate_rc"
          if [ "$st_rc" -ne 0 ] || [ "$gate_rc" -ne 0 ]; then exit 1; fi

      # --selftest FIRST (distrust vacuous green). The harness landed in #12561
      # with 18 cases — including §8's three: a duplicate capability slug, a
      # marker over a private defp, and a dangling doc: backlink — and NO CI
      # caller, so it had been rotting unexecuted. Every case plants ONE
      # violation in a throwaway 4-file repo and re-invokes THIS script against
      # it via DOCS_ANCHORS_ROOT, so the assertions drive the shipping gate
      # rather than a copy. It plants nothing in this repo and takes ~4s.
      #
      # §8 is the section that most needs it: both its arms print `ok:` when the
      # scan finds nothing to complain about, and a scan that returns NOTHING AT
      # ALL prints exactly the same `ok:`. It must never grow a -z assertion —
      # CLAUDE.md says @canonical markers are demand-driven and get REMOVED as
      # dedup lands, so zero is a legitimate tree. The selftest is what makes a
      # zero here mean "the repo has none" instead of "the scanner went blind".
      - name: Doc anchors + headers (fails this job)
        id: s2
        continue-on-error: true  # main-red breaker: the Decide step below owns the verdict
        if: ${{ !cancelled() }}
        run: |
          if [ -z "${BREAKER_CAPTURE_ARMED:-}" ] && [ -f "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" ]; then exec bash "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" "$0"; fi  # main-red breaker: capture this step's error block
          # UNREACHABLE REPORTER (task-1c8165ef0ada4fcd). The runner runs a `run:`
          # body as `/usr/bin/bash -e {0}`, so a bare `--selftest` that exits
          # non-zero ABORTS THE STEP and the shipping gate below it never runs —
          # its per-finding lines never reach the log, and main-red-breaker.sh
          # then reads the step as OPAQUE-RED / OWNERSHIP-UNDETERMINED because the
          # selftest sentence names nothing. Capture both statuses, run BOTH,
          # adjudicate after. The step still fails when either one fails.
          st_rc=0; bash scripts/docs-anchors-check.sh --selftest || st_rc=$?
          gate_rc=0; bash scripts/docs-anchors-check.sh || gate_rc=$?
          echo "selftest exit=$st_rc  gate exit=$gate_rc"
          if [ "$st_rc" -ne 0 ] || [ "$gate_rc" -ne 0 ]; then exit 1; fi

      # Connectors chat_bridge DDL drift gate (connectors D54). The bridge OWNS
      # the chat_bridge.connector_installs DDL (charter D28: no Ecto migration),
      # but Elixir READS it via an @schema_prefix schema, so api/test/test_helper.exs
      # TRANSCRIBES the SQL — a second source of truth that has ALREADY drifted
      # once. This DB-free static check reds when connectors/src/db/schema.ts and
      # test_helper.exs disagree on the connector_installs column set (a .ts-only
      # OR a .exs-only change rides the **/*.ts + **/*.exs triggers above and trips
      # it). The bundled --selftest is a durable tripwire (distrust vacuous green):
      # it proves the gate REDs on a planted one-column drift, plants nothing.
      - name: Connectors DDL drift gate (fails this job)
        id: s3
        continue-on-error: true  # main-red breaker: the Decide step below owns the verdict
        if: ${{ !cancelled() }}
        run: |
          if [ -z "${BREAKER_CAPTURE_ARMED:-}" ] && [ -f "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" ]; then exec bash "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" "$0"; fi  # main-red breaker: capture this step's error block
          # UNREACHABLE REPORTER (task-1c8165ef0ada4fcd). The runner runs a `run:`
          # body as `/usr/bin/bash -e {0}`, so a bare `--selftest` that exits
          # non-zero ABORTS THE STEP and the shipping gate below it never runs —
          # its per-finding lines never reach the log, and main-red-breaker.sh
          # then reads the step as OPAQUE-RED / OWNERSHIP-UNDETERMINED because the
          # selftest sentence names nothing. Capture both statuses, run BOTH,
          # adjudicate after. The step still fails when either one fails.
          st_rc=0; bash scripts/connectors-ddl-drift-check.sh --selftest || st_rc=$?
          gate_rc=0; bash scripts/connectors-ddl-drift-check.sh || gate_rc=$?
          echo "selftest exit=$st_rc  gate exit=$gate_rc"
          if [ "$st_rc" -ne 0 ] || [ "$gate_rc" -ne 0 ]; then exit 1; fi

      # Connectors catalog connectable-drift gate (connectors D75). There is
      # deliberately NO catalog endpoint on the connect wire (catalog.ex moduledoc
      # defends this), so Barkpark.Connectors.Catalog DECLARES each provider's
      # connect_mode statically — a hand-mirror of the bridge registry. This
      # DB-free static check reds when catalog.ex's connectable set (connect_mode
      # :paste|:oauth) disagrees with the bridge's actual connect capability
      # (a `connect: {` member in connectors/src/connectors/<p>.ts for paste, a
      # <p>-oauth.ts callback for oauth), so a provider can never show a button
      # the bridge can't honor nor hide one it can. Sources ride the **/*.ex +
      # **/*.ts triggers above; the .sh has its own trigger. The bundled
      # --selftest is a durable tripwire (distrust vacuous green): it proves the
      # gate REDs on a dropped connect member and plants nothing in the tree. The
      # static list in catalog.ex stays the fail-closed runtime fallback.
      - name: Connectors catalog drift gate (fails this job)
        id: s4
        continue-on-error: true  # main-red breaker: the Decide step below owns the verdict
        if: ${{ !cancelled() }}
        run: |
          if [ -z "${BREAKER_CAPTURE_ARMED:-}" ] && [ -f "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" ]; then exec bash "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" "$0"; fi  # main-red breaker: capture this step's error block
          # UNREACHABLE REPORTER (task-1c8165ef0ada4fcd). The runner runs a `run:`
          # body as `/usr/bin/bash -e {0}`, so a bare `--selftest` that exits
          # non-zero ABORTS THE STEP and the shipping gate below it never runs —
          # its per-finding lines never reach the log, and main-red-breaker.sh
          # then reads the step as OPAQUE-RED / OWNERSHIP-UNDETERMINED because the
          # selftest sentence names nothing. Capture both statuses, run BOTH,
          # adjudicate after. The step still fails when either one fails.
          st_rc=0; bash scripts/connectors-catalog-drift-check.sh --selftest || st_rc=$?
          gate_rc=0; bash scripts/connectors-catalog-drift-check.sh || gate_rc=$?
          echo "selftest exit=$st_rc  gate exit=$gate_rc"
          if [ "$st_rc" -ne 0 ] || [ "$gate_rc" -ne 0 ]; then exit 1; fi

      # Never-cancel-main ratchet (honest-gates D12). `cancelled` is a NON-PASS:
      # a workflow that runs on push-to-main with `cancel-in-progress: true`
      # cancels its own main runs under a fast push cadence (2026-06-10: 19
      # consecutive main runs cancelled, zero completions all day). Commit
      # a547ff75a fixed that with the `github.ref != 'refs/heads/main'` guard —
      # but at SAMPLE scope: five workflows got it, cloud.yml and doc-gates.yml
      # were missed and kept a bare `true` for 40 days. This gate forbids the
      # regrowth. It reds ONLY on push-to-main + bare `true`; a pull_request-only
      # workflow's bare `true` is behaviourally identical to the guard and is
      # reported as NOTE, never as a failure. The bundled --selftest is a durable
      # tripwire (distrust vacuous green): it proves the gate REDs on the
      # hazardous shape and greens on each safe one, and plants nothing.
      - name: Never-cancel-main concurrency ratchet (fails this job)
        id: s5
        continue-on-error: true  # main-red breaker: the Decide step below owns the verdict
        if: ${{ !cancelled() }}
        run: |
          if [ -z "${BREAKER_CAPTURE_ARMED:-}" ] && [ -f "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" ]; then exec bash "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" "$0"; fi  # main-red breaker: capture this step's error block
          # UNREACHABLE REPORTER (task-1c8165ef0ada4fcd). The runner runs a `run:`
          # body as `/usr/bin/bash -e {0}`, so a bare `--selftest` that exits
          # non-zero ABORTS THE STEP and the shipping gate below it never runs —
          # its per-finding lines never reach the log, and main-red-breaker.sh
          # then reads the step as OPAQUE-RED / OWNERSHIP-UNDETERMINED because the
          # selftest sentence names nothing. Capture both statuses, run BOTH,
          # adjudicate after. The step still fails when either one fails.
          st_rc=0; bash scripts/never-cancel-main-check.sh --selftest || st_rc=$?
          gate_rc=0; bash scripts/never-cancel-main-check.sh || gate_rc=$?
          echo "selftest exit=$st_rc  gate exit=$gate_rc"
          if [ "$st_rc" -ne 0 ] || [ "$gate_rc" -ne 0 ]; then exit 1; fi

      # ── the two deploy.yml gates get their FIRST CI caller ──────────────────
      #
      # Both gates over .github/workflows/deploy.yml ran in exactly ONE place:
      # deploy.yml's own `changes` job, on push-to-main. So a PR that edited
      # deploy.yml was never checked by them BEFORE merge, and neither
      # --selftest had a caller at all — the tripwires proving the tripwires can
      # lose were never run by anything. Both were disarmable by the job they
      # police (wave 25, proven by mutation): a new job's own single-quoted
      # `grep -qE '^(...)/'` was harvested as a dispatch filter, and an UNNAMED
      # trailing `- run:` step was absorbed into the control-plane Smoke test
      # step. This job already triggers on `.github/workflows/**` — the exact
      # glob added for the never-cancel-main ratchet, and the same reasoning:
      # the subject of these gates IS the workflow tree, so the file that
      # reintroduces the hazard must run them. --selftest first (distrust
      # vacuous green), then the real assertion.
      - name: Deploy paths↔filters drift gate (fails this job)
        id: s6
        continue-on-error: true  # main-red breaker: the Decide step below owns the verdict
        if: ${{ !cancelled() }}
        run: |
          if [ -z "${BREAKER_CAPTURE_ARMED:-}" ] && [ -f "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" ]; then exec bash "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" "$0"; fi  # main-red breaker: capture this step's error block
          # UNREACHABLE REPORTER (task-1c8165ef0ada4fcd). The runner runs a `run:`
          # body as `/usr/bin/bash -e {0}`, so a bare `--selftest` that exits
          # non-zero ABORTS THE STEP and the shipping gate below it never runs —
          # its per-finding lines never reach the log, and main-red-breaker.sh
          # then reads the step as OPAQUE-RED / OWNERSHIP-UNDETERMINED because the
          # selftest sentence names nothing. Capture both statuses, run BOTH,
          # adjudicate after. The step still fails when either one fails.
          st_rc=0; bash scripts/check-deployyml-filters.sh --selftest || st_rc=$?
          gate_rc=0; bash scripts/check-deployyml-filters.sh || gate_rc=$?
          echo "selftest exit=$st_rc  gate exit=$gate_rc"
          if [ "$st_rc" -ne 0 ] || [ "$gate_rc" -ne 0 ]; then exit 1; fi

      - name: Control-plane smoke can-fail gate (fails this job)
        id: s7
        continue-on-error: true  # main-red breaker: the Decide step below owns the verdict
        if: ${{ !cancelled() }}
        run: |
          if [ -z "${BREAKER_CAPTURE_ARMED:-}" ] && [ -f "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" ]; then exec bash "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" "$0"; fi  # main-red breaker: capture this step's error block
          # UNREACHABLE REPORTER (task-1c8165ef0ada4fcd). The runner runs a `run:`
          # body as `/usr/bin/bash -e {0}`, so a bare `--selftest` that exits
          # non-zero ABORTS THE STEP and the shipping gate below it never runs —
          # its per-finding lines never reach the log, and main-red-breaker.sh
          # then reads the step as OPAQUE-RED / OWNERSHIP-UNDETERMINED because the
          # selftest sentence names nothing. Capture both statuses, run BOTH,
          # adjudicate after. The step still fails when either one fails.
          st_rc=0; bash scripts/check-deploy-smoke.sh --selftest || st_rc=$?
          gate_rc=0; bash scripts/check-deploy-smoke.sh || gate_rc=$?
          echo "selftest exit=$st_rc  gate exit=$gate_rc"
          if [ "$st_rc" -ne 0 ] || [ "$gate_rc" -ne 0 ]; then exit 1; fi

      # --selftest FIRST (distrust vacuous green). Part 1/2 compares two SETS of
      # .bp-canvas-* classes and used to fail only on set DIFFERENCE, so an
      # allowlist entry deleted from its own mirror kept printing "+1
      # allowlisted heex-only" at exit 0. The 10-arm harness plants throwaway
      # mirrors and re-invokes THIS script against them via
      # PAPER_EDITOR_MIRROR_HEEX/_BUNDLE — empty corpora, disjoint corpora, a
      # stale allowlist entry, an unknown argument — so a comparator that stops
      # discriminating reds here instead of certifying a green about nothing.
      # It plants nothing in this repo.
      - name: Paper-editor style mirror lockstep (fails this job)
        id: s8
        continue-on-error: true  # main-red breaker: the Decide step below owns the verdict
        if: ${{ !cancelled() }}
        run: |
          if [ -z "${BREAKER_CAPTURE_ARMED:-}" ] && [ -f "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" ]; then exec bash "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" "$0"; fi  # main-red breaker: capture this step's error block
          # UNREACHABLE REPORTER (task-1c8165ef0ada4fcd). The runner runs a `run:`
          # body as `/usr/bin/bash -e {0}`, so a bare `--selftest` that exits
          # non-zero ABORTS THE STEP and the shipping gate below it never runs —
          # its per-finding lines never reach the log, and main-red-breaker.sh
          # then reads the step as OPAQUE-RED / OWNERSHIP-UNDETERMINED because the
          # selftest sentence names nothing. Capture both statuses, run BOTH,
          # adjudicate after. The step still fails when either one fails.
          st_rc=0; bash scripts/paper-editor-mirror-check.sh --selftest || st_rc=$?
          gate_rc=0; bash scripts/paper-editor-mirror-check.sh || gate_rc=$?
          echo "selftest exit=$st_rc  gate exit=$gate_rc"
          if [ "$st_rc" -ne 0 ] || [ "$gate_rc" -ne 0 ]; then exit 1; fi

      # Status vocabulary single-source (parity §2/§7). design/status-manifest.json
      # is the ONE source of the white ladder; the Elixir emitters read it at
      # compile time, and the --st-* CSS tone tokens are GENERATED from it. This
      # gate fails if any surface hand-drifts a tone or a glyph role away from it.
      #
      # --selftest runs FIRST, IN THIS SAME STEP (cgsi-s8 idiom; the selftest
      # itself is cgsi-bl-status-manifest-no-selftest). This gate was wired BARE
      # here — it had no --selftest to run, so none of its parts had ever
      # been shown to RED and CI could never catch a weakened one. The 13-arm
      # harness copies the gate and the six files it reads into a throwaway
      # tree, plants one violation per part in turn (a drifted tone value, an
      # orphan .bp-g--<role> class, a missing one, a drifted Go roleGlyph, a
      # drifted Go roleLabel, a drifted mobile ROLE_LABEL), asserts the REAL gate
      # exits 1 naming that part, and
      # restores the planted file to prove it greens again. It plants nothing in
      # this repo. Same step, not a later one: Actions skips a job's remaining
      # steps once one fails, so a trailing tripwire never runs on exactly the
      # runs where the gate reddened.
      - name: Status manifest drift gate (fails this job)
        id: s9
        continue-on-error: true  # main-red breaker: the Decide step below owns the verdict
        if: ${{ !cancelled() }}
        run: |
          if [ -z "${BREAKER_CAPTURE_ARMED:-}" ] && [ -f "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" ]; then exec bash "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" "$0"; fi  # main-red breaker: capture this step's error block
          # UNREACHABLE REPORTER (task-1c8165ef0ada4fcd). The runner runs a `run:`
          # body as `/usr/bin/bash -e {0}`, so a bare `--selftest` that exits
          # non-zero ABORTS THE STEP and the shipping gate below it never runs —
          # its per-finding lines never reach the log, and main-red-breaker.sh
          # then reads the step as OPAQUE-RED / OWNERSHIP-UNDETERMINED because the
          # selftest sentence names nothing. Capture both statuses, run BOTH,
          # adjudicate after. The step still fails when either one fails.
          st_rc=0; bash scripts/status-manifest-check.sh --selftest || st_rc=$?
          gate_rc=0; bash scripts/status-manifest-check.sh || gate_rc=$?
          echo "selftest exit=$st_rc  gate exit=$gate_rc"
          if [ "$st_rc" -ne 0 ] || [ "$gate_rc" -ne 0 ]; then exit 1; fi

      # Preview-contract cross-surface parity tripwire (preview-contract W4,
      # charter D20 Layer 2). Field parity is proven by the golden-fixture tests
      # (api/web/Go, one shared mirror); this structural gate guards the
      # invariants a fixture can't see: the web finder never resurrects the
      # per-type excerpt fork (docDescription/paperExcerpt), the detail fetch
      # carries no fields= projection that would strip `preview` off the wire
      # (D22), and D10 stays executable law — grep -ri oembed over the source
      # tree is ZERO, anywhere, ever.
      # --selftest FIRST (distrust vacuous green). Part 3's expected hit count is
      # ZERO forever, which is also what a wrong cwd, a dropped --include or a
      # renamed extension return — so the gate's clean line proves nothing on its
      # own. The selftest plants oEmbed in a throwaway tree (once per scanned
      # extension), re-invokes THIS script against it via PREVIEW_PARITY_SCAN_ROOT
      # and requires the real gate to catch each one, then requires it to stay
      # silent on a clean corpus, on vendored code and on unscanned extensions,
      # and to exit 2 REFUSED TO MEASURE rather than report a clean tree it never
      # read. It plants nothing in this repo and runs in about a second.
      - name: Preview parity + D10 no-oEmbed gate (fails this job)
        id: s10
        continue-on-error: true  # main-red breaker: the Decide step below owns the verdict
        if: ${{ !cancelled() }}
        run: |
          if [ -z "${BREAKER_CAPTURE_ARMED:-}" ] && [ -f "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" ]; then exec bash "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" "$0"; fi  # main-red breaker: capture this step's error block
          # UNREACHABLE REPORTER (task-1c8165ef0ada4fcd). The runner runs a `run:`
          # body as `/usr/bin/bash -e {0}`, so a bare `--selftest` that exits
          # non-zero ABORTS THE STEP and the shipping gate below it never runs —
          # its per-finding lines never reach the log, and main-red-breaker.sh
          # then reads the step as OPAQUE-RED / OWNERSHIP-UNDETERMINED because the
          # selftest sentence names nothing. Capture both statuses, run BOTH,
          # adjudicate after. The step still fails when either one fails.
          st_rc=0; bash scripts/preview-parity-check.sh --selftest || st_rc=$?
          gate_rc=0; bash scripts/preview-parity-check.sh || gate_rc=$?
          echo "selftest exit=$st_rc  gate exit=$gate_rc"
          if [ "$st_rc" -ne 0 ] || [ "$gate_rc" -ne 0 ]; then exit 1; fi

      # Unified-aesthetic design-token drift gate (unified-aesthetic W1.2).
      # design/tokens.json is the ONE source of the Barkpark design language; the
      # emitter regenerates every per-surface artifact (Cloud/Studio/web CSS,
      # paper-surface, Go taskboard + pdrender) from it. validate proves the source
      # is well-formed; check re-emits into memory and byte-compares each committed
      # artifact, plus a §6 cross-surface parity assertion (Go lifecycle literals ==
      # CSS glyph tones == tokens) so a GUI/TUI divergence cannot slip through.
      - name: Design-token drift gate (fails this job)
        id: s11
        continue-on-error: true  # main-red breaker: the Decide step below owns the verdict
        if: ${{ !cancelled() }}
        run: |
          if [ -z "${BREAKER_CAPTURE_ARMED:-}" ] && [ -f "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" ]; then exec bash "$GITHUB_WORKSPACE/scripts/breaker-capture.sh" "$0"; fi  # main-red breaker: capture this step's error block
          node design/validate.mjs

          # task-d95c3e66b9177c8f (agency closeout): the EXIT drift gate. The
          # design engagement is over and its package is archived at
          # design/handover/ui-review-9/design/tokens.json, read by no gate at
          # all. validate.mjs above SHAPE-gates cloudChrome and check.mjs Part F
          # proves derive(theme) is self-consistent, so a retint of evergreen's
          # accent or a revert of the fg4 legibility fix (light #76818f) is a
          # GREEN PR under every existing gate while the provenance the exit
