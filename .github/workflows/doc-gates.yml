name: doc-gates

# Documentation spine enforcement (docs-refactor wave 5).
# Enforces: byte budgets + 7-card cap, routing/INDEX/anchor resolution,
# G1 doc-tier headers, canonical-for uniqueness, ARCHIVED banners.
#
# WHAT THIS WORKFLOW'S RED ACTUALLY DOES, said plainly because this header used
# to say "Blocking:" and that was a claim of authority the committed spec
# denies. This file publishes ONE check-run context, the job name `Doc budgets
# + anchors` below, and that context is not in
# .github/required-checks.json's required set — it carries an S4 exclusion row
# there (paths-filtered, so a PR touching none of the filtered paths never
# renders it at all). Every step below fails THIS JOB when it trips, and the
# job's red is visible on the PR; none of it stops a merge. The step names say
# "(fails this job)" for exactly that reason — they said "(blocking)" for
# twenty-one steps, which is the inverse of the rot advisory-prose guards catch.
# See docs/ops/merge-gates.md §"Documentation review rules".

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      # code triggers — @canonical capability markers live in source; a code-only
      # rename must re-run docs-anchors-check.sh §8 or the marker rots silently.
      - "**/*.ex"
      - "**/*.exs"
      - "**/*.go"
      - "**/*.ts"
      - "**/*.tsx"
      - "scripts/check-doc-budgets.sh"
      - "scripts/docs-anchors-check.sh"
      - ".github/workflows/doc-gates.yml"
      # never-cancel-main ratchet (honest-gates D12) — its subject IS the
      # workflow tree, so it must trigger on ANY workflow edit. Without the
      # `**` glob the gate could never see the file that reintroduces the
      # hazard (only doc-gates.yml itself was triggered before), which is
      # exactly how the 2026-06-10 guard stayed at sample scope for 40 days.
      - ".github/workflows/**"
      - "scripts/never-cancel-main-check.sh"
      # the doc-truth sweeps — same reasoning as never-cancel-main above: their
      # SUBJECT includes their own scanner and frozen baselines, and .mjs is not
      # in the extension triggers, so without this a PR could weaken the sweep or
      # rewrite lineref-baseline.json without this gate ever running.
      - "tooling/doc-truth/**"
      # the two deploy.yml gates — their SUBJECT (.github/workflows/deploy.yml)
      # already rides the `**` glob above; these two lines cover an edit to the
      # gate scripts themselves, which no other glob matches.
      - "scripts/check-deployyml-filters.sh"
      - "scripts/check-deploy-smoke.sh"
      # connectors chat_bridge DDL drift gate — the .sh itself (the DDL sources
      # ride the **/*.ts + **/*.exs globs, but a .sh edit isn't covered by any).
      - "scripts/connectors-ddl-drift-check.sh"
      # connectors catalog connectable-drift gate — the .sh itself (its sources,
      # catalog.ex + connectors/src/**/*.ts, ride the **/*.ex + **/*.ts globs).
      - "scripts/connectors-catalog-drift-check.sh"
      # paper-editor style mirror tripwire — the mirrors + the generated
      # paper-surface token layer (bundle) must not drift from the ONE source.
      - "api/lib/barkpark_web/layouts/root.html.heex"
      - "api/assets/paper-surface/paper-surface.css"
      - "api/assets/paper-editor/src/styles.css"
      - "scripts/paper-editor-mirror-check.sh"
      # status vocabulary single-source — the manifest + its drift gate.
      - "design/status-manifest.json"
      - "scripts/status-manifest-check.sh"
      # preview-contract cross-surface parity tripwire — the fixture mirrors, the
      # structural gate, and the preview emitters every surface consumes.
      - "scripts/preview-parity-check.sh"
      - "api/test/support/fixtures/preview-parity.json"
      - "web/__tests__/fixtures/preview-parity.json"
      - "cmd/barkpark/testdata/preview-parity.json"
      - "web/app/(finder)/d/[type]/[slug]/page.tsx"
      - "web/lib/preview-metadata.ts"
      - "web/lib/get-document.ts"
      - "api/lib/barkpark_web/components/share_meta.ex"
      # unified-aesthetic design tokens — the source, the emitter/gate, and every
      # generated per-surface artifact (W1.2). Any drift trips design/check.mjs.
      - "design/tokens.json"
      - "design/tokens.schema.json"
      - "design/validate.mjs"
      - "design/emit.mjs"
      - "design/check.mjs"
      # theme-system compiler (Wave 2 D17) — the zero-dep OKLCH derive core, its
      # unit tests, and the per-theme spec files. Without these globs Part F is a
      # script nobody runs (doc-gates has no broad **/*.mjs / **/*.json trigger).
      - "design/derive.mjs"
      - "design/derive.test.mjs"
      - "design/themes/**"
      # theme-system Wave 4 (D24) — the N-theme emission proof + its fixture theme.
      - "design/theme-emit.test.mjs"
      # cloud-console-hardening wave-5 (D41): the standing regression test for the
      # emit --write attribution fence. Rides the design/emit.mjs + design/check.mjs
      # dispensation (narrow wave-5 grant) so a change to emit.mjs re-proves the
      # fence can still REFUSE an unattributed write.
      - "design/emit-fence.test.mjs"
      # cloud-console-hardening D21/D41: the SAME fence, proved on the OTHER two
      # writers of the paper-editor mirror region. It shipped in #15455 executed by
      # no workflow at all — a regression test nobody runs is a comment with a
      # process cost, so it is wired here beside its emit-fence sibling.
      - "design/mirror-fence.test.mjs"
      # the attribution ledger itself (cch wave 68). A manifest-only edit — a
      # hand-tampered digest, a dropped slot — matched NO glob here, so the one
      # file the fence's memory lives in could change without the gate that
      # reads it ever running.
      - "design/emit-manifest.json"
      # the Part E ratchet's OWN baseline, and the one ledger entry that matched no
      # glob either (gate-red-dtoken). design/check.mjs is the only thing in the repo
      # that reads design/exemptions.json, and that file matched ZERO globs in both
      # `on:` blocks — so a PR editing the baseline ALONE never ran the gate the
      # baseline governs. That is the documented defeat in
      # tooling/grip/ledger/exemptions-ratchet-memory-refuted-2026-08-19.md: raise a
      # count in PR-1 (no glob matches, doc-gates never runs, green), then spend the
      # slack in PR-2 (Part E compares against the raised ceiling and passes) — two
      # ordinary PRs, ratchet defeated. api/priv/static/assets/bp-graph.js is the
      # same shape: a ledger entry whose only other trigger, bp-graph-drift.yml, is
      # named "(advisory)".
      - "design/exemptions.json"
      - "api/priv/static/assets/bp-graph.js"
      # the audit verb table (cch-w65; moved into the image by cch-w69-s1 — its
      # Elixir consumer compile-time-reads it inside the cloud image build, which
      # only sees cloud/, so the design/ home broke every cp deploy) — the SOLE
      # authority for BOTH the closed Elixir @actions vocabulary and the console's
      # ACTION_LABELS region. Its two consumers ride globs above (audit_event.ex
      # on **/*.ex, app.js on its own line below), but a JSON-ONLY edit — a new
      # verb, a label reworded, a null's rationale deleted — matched nothing here,
      # so the one file both vocabularies read could change without
      # design/check.mjs Part 0 ever running.
      - "cloud/priv/audit-actions.json"
      - "design/paper-editor-mirror.mjs"
      - "design/fixtures/**"
      - "cloud/priv/static/app.css"
      - "web/app/globals.css"
      - "internal/taskboard/tokens_gen.go"
      - "internal/pdrender/tokens_gen.go"
      - "api/lib/barkpark_web/layouts/bulldocs.html.heex"
      # Studio literal-color gate — Studio chrome must consume emitted tokens.
      - "api/lib/barkpark_web/**/*.ex"
      - "api/lib/barkpark_web/**/*.heex"
      - "scripts/studio-literal-check.sh"
      # Studio link/path gate — every Studio destination has ONE canonical path
      # built through Paths; a hand-built scope/dataset URL literal reds this.
      - "scripts/studio-link-lint.sh"
      # Web literal-color gate — the web/ demo must consume emitted tokens.
      - "web/**"
      - "scripts/web-literal-check.sh"
      # Go (CLI/TUI) literal-color gate — the bp CLI/TUI must resolve semantic
      # colours through internal/semrole off the generated token artifact.
      - "cmd/barkpark/**"
      - "internal/cli/**"
      - "internal/taskboard/theme.go"
      - "scripts/go-literal-check.sh"
      # Tenant fail-open read baseline gate — a NEW scope_to_workspace_or_global /
      # by-PK Repo.get(Document) tenant read must carry a reviewed `# global-read:`
      # justification or update the baseline (barkpark-w9dg scar class).
      - "api/lib/**/*.ex"
      - "scripts/tenant-scope-check.sh"
      - "scripts/tenant-scope-baseline.txt"
      # NEW-lineref gate. No baseline file to list: it is diff-scoped, so the
      # script is the whole input surface.
      - "scripts/new-lineref-check.sh"
      # Nil-polarity fail-CLOSED gate (ctx-compression W1 s3). A caller-less/nil
      # principal must be the MOST RESTRICTIVE anonymous one — never a bypass. This
      # gate reds if a fail-OPEN nil/catch-all clause of Envelope.field_readable?/3
      # or ListenController.redacted_result/4 reappears. Its sources ride the
      # api/lib/**/*.ex glob above; the .sh itself needs its own trigger.
      - "scripts/nil-polarity-check.sh"
      # Preview-env isolation gate — a NEW test that mutates the process-global
      # Application.put_env(:barkpark, :preview, …) must declare `async: false`
      # + an `on_exit` restore (preview-route pollution tripwire).
      - "api/test/**/*.exs"
      - "scripts/preview-env-isolation-check.sh"
      # Site templates (search-template epic D12) — a standalone template tree
      # (its own package.json, vendored CSS/theme slice + bp-graph snapshot). Its
      # files ride none of the app-scoped globs above (web/**, api/lib/**), so a
      # template-only CSS/theme PR would never run the design gate. This trigger
      # opens the frontier to templates/** so those PRs at least run doc-gates.
      - "templates/**"
      # PortableDoc render-parity completeness guard (render-unification D8/D45).
      # The guard greps compose.ex's dispatched block types, subtracts the 14
      # excluded field/embed types, and reds if any in-scope type lacks a golden
      # fixture. compose.ex + gen_pd_parity.ex ride the **/*.ex glob; the .sh
      # itself and the golden mirror need their own triggers (a seeded/removed
      # fixture is a .json, covered by no glob above).
      - "scripts/pd-parity-completeness.sh"
      - "api/test/support/fixtures/pd-parity/**"
      # Scaffy anchor-drift gate (scaffy epic W6 leap 3, charter D71 L3). The
      # command files themselves, plus the only two anchored target surfaces NOT
      # already covered by a glob above: cloud/priv/static/app.js + __app.test.mjs
      # (there is no **/*.js / **/*.mjs trigger, and app.css is triggered but the
      # .js/.mjs pair is not). Every OTHER anchored surface in the corpus rides a
      # trigger above (.ex/.exs/.go/.ts/.tsx/.md ride the code globs; root.html.heex
      # rides api/lib/barkpark_web/**/*.heex; pd-parity-completeness.sh has its own
      # trigger), so an anchor drift there already runs this job.
      - "scaffy/commands/**"
      - "cloud/priv/static/app.js"
      - "cloud/priv/static/__app.test.mjs"
