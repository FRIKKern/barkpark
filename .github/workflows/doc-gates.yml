          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/repo" "$tmp/cmds"
          printf 'first real line\nsecond real line\n' > "$tmp/repo/target.txt"
          printf '%s\n' \
            'COMMAND "Tripwire drift fixture" DESCRIPTION "A deliberately drifted anchor for the anchor-drift gate self-test: its fenced anchor is absent from target.txt, so RepoCheck must report R-002. Plants nothing in the real tree." LAST_UPDATED "18-07-2026-00-00-00" DOMAIN "barkpark" TAGS "scaffy" CONCEPT "tripwire-drift" VARIANT "text" DIRECTION "add" VARIABLES' \
            '' \
            'IN "target.txt"' \
            '### drift the anchor on purpose' \
            'INSERT AFTER FIRST' \
            '::: deliberately absent anchor :::' \
            'this anchor line is deliberately absent from target.txt' \
            '::: deliberately absent anchor :::' \
            'WITH' \
            '::: tripwire injected block :::' \
            'never planted MARK:tripwire-drift-block' \
            '::: tripwire injected block :::' \
            'MARK "tripwire-drift-block"' \
            'ASLONG FILE DONT CONTAIN "never planted MARK:tripwire-drift-block"' \
