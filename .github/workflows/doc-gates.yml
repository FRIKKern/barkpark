name: doc-gates

# Documentation spine enforcement (docs-refactor wave 5).
# Blocking: byte budgets + 7-card cap, routing/INDEX/anchor resolution,
# G1 doc-tier headers, canonical-for uniqueness, ARCHIVED banners.
# See docs/ops/merge-gates.md §"Documentation review rules".

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      # code triggers — @canonical capability markers live in source; a code-only
      # rename must re-run docs-anchors-check.sh §8 or the marker rots silently.
      - "**/*.ex"
      - "**/*.exs"
      - "**/*.go"
      - "**/*.ts"
      - "**/*.tsx"
      - "scripts/check-doc-budgets.sh"
      - "scripts/docs-anchors-check.sh"
      - ".github/workflows/doc-gates.yml"
      # paper-editor style mirror tripwire — the mirrors + the generated
      # paper-surface token layer (bundle) must not drift from the ONE source.
      - "api/lib/barkpark_web/layouts/root.html.heex"
      - "api/assets/paper-surface/paper-surface.css"
      - "api/assets/paper-editor/src/styles.css"
      - "scripts/paper-editor-mirror-check.sh"
      # status vocabulary single-source — the manifest + its drift gate.
      - "design/status-manifest.json"
      - "scripts/status-manifest-check.sh"
      # unified-aesthetic design tokens — the source, the emitter/gate, and every
      # generated per-surface artifact (W1.2). Any drift trips design/check.mjs.
      - "design/tokens.json"
      - "design/tokens.schema.json"
      - "design/validate.mjs"
      - "design/emit.mjs"
      - "design/check.mjs"
      # theme-system compiler (Wave 2 D17) — the zero-dep OKLCH derive core, its
      # unit tests, and the per-theme spec files. Without these globs Part F is a
      # script nobody runs (doc-gates has no broad **/*.mjs / **/*.json trigger).
      - "design/derive.mjs"
      - "design/derive.test.mjs"
      - "design/themes/**"
      # theme-system Wave 4 (D24) — the N-theme emission proof + its fixture theme.
      - "design/theme-emit.test.mjs"
      - "design/paper-editor-mirror.mjs"
      - "design/fixtures/**"
      - "cloud/priv/static/app.css"
      - "web/app/globals.css"
      - "internal/taskboard/tokens_gen.go"
      - "internal/pdrender/tokens_gen.go"
      - "api/lib/barkpark_web/layouts/bulldocs.html.heex"
      # Studio literal-color gate — Studio chrome must consume emitted tokens.
      - "api/lib/barkpark_web/**/*.ex"
      - "api/lib/barkpark_web/**/*.heex"
      - "scripts/studio-literal-check.sh"
      # Web literal-color gate — the web/ demo must consume emitted tokens.
      - "web/**"
      - "scripts/web-literal-check.sh"
      # Go (CLI/TUI) literal-color gate — the bp CLI/TUI must resolve semantic
      # colours through internal/semrole off the generated token artifact.
      - "cmd/barkpark/**"
      - "internal/cli/**"
      - "internal/taskboard/theme.go"
      - "scripts/go-literal-check.sh"
  pull_request:
    paths:
      - "**/*.md"
      # code triggers — @canonical capability markers live in source; a code-only
      # rename must re-run docs-anchors-check.sh §8 or the marker rots silently.
      - "**/*.ex"
      - "**/*.exs"
      - "**/*.go"
      - "**/*.ts"
      - "**/*.tsx"
      - "scripts/check-doc-budgets.sh"
      - "scripts/docs-anchors-check.sh"
      - ".github/workflows/doc-gates.yml"
      # paper-editor style mirror tripwire — the mirrors + the generated
      # paper-surface token layer (bundle) must not drift from the ONE source.
      - "api/lib/barkpark_web/layouts/root.html.heex"
      - "api/assets/paper-surface/paper-surface.css"
      - "api/assets/paper-editor/src/styles.css"
      - "scripts/paper-editor-mirror-check.sh"
      # status vocabulary single-source — the manifest + its drift gate.
      - "design/status-manifest.json"
      - "scripts/status-manifest-check.sh"
      # unified-aesthetic design tokens — the source, the emitter/gate, and every
      # generated per-surface artifact (W1.2). Any drift trips design/check.mjs.
      - "design/tokens.json"
      - "design/tokens.schema.json"
      - "design/validate.mjs"
      - "design/emit.mjs"
      - "design/check.mjs"
      # theme-system compiler (Wave 2 D17) — the zero-dep OKLCH derive core, its
      # unit tests, and the per-theme spec files. Without these globs Part F is a
      # script nobody runs (doc-gates has no broad **/*.mjs / **/*.json trigger).
      - "design/derive.mjs"
      - "design/derive.test.mjs"
      - "design/themes/**"
      # theme-system Wave 4 (D24) — the N-theme emission proof + its fixture theme.
      - "design/theme-emit.test.mjs"
      - "design/paper-editor-mirror.mjs"
      - "design/fixtures/**"
      - "cloud/priv/static/app.css"
      - "web/app/globals.css"
      - "internal/taskboard/tokens_gen.go"
      - "internal/pdrender/tokens_gen.go"
      - "api/lib/barkpark_web/layouts/bulldocs.html.heex"
      # Studio literal-color gate — Studio chrome must consume emitted tokens.
      - "api/lib/barkpark_web/**/*.ex"
      - "api/lib/barkpark_web/**/*.heex"
      - "scripts/studio-literal-check.sh"
      # Web literal-color gate — the web/ demo must consume emitted tokens.
      - "web/**"
      - "scripts/web-literal-check.sh"
      # Go (CLI/TUI) literal-color gate — the bp CLI/TUI must resolve semantic
      # colours through internal/semrole off the generated token artifact.
      - "cmd/barkpark/**"
      - "internal/cli/**"
      - "internal/taskboard/theme.go"
      - "scripts/go-literal-check.sh"

concurrency:
  group: doc-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doc-gates:
    name: Doc budgets + anchors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Doc byte budgets (blocking)
        run: bash scripts/check-doc-budgets.sh

      - name: Doc anchors + headers (blocking)
        run: bash scripts/docs-anchors-check.sh

      - name: Paper-editor style mirror lockstep (blocking)
        run: bash scripts/paper-editor-mirror-check.sh

      # Status vocabulary single-source (parity §2/§7). design/status-manifest.json
      # is the ONE source of the white ladder; the Elixir emitters read it at
      # compile time, and the --st-* CSS tone tokens are GENERATED from it. This
      # gate fails if any surface hand-drifts a tone or a glyph role away from it.
      - name: Status manifest drift gate (blocking)
        run: bash scripts/status-manifest-check.sh

      # Unified-aesthetic design-token drift gate (unified-aesthetic W1.2).
      # design/tokens.json is the ONE source of the Barkpark design language; the
      # emitter regenerates every per-surface artifact (Cloud/Studio/web CSS,
      # paper-surface, Go taskboard + pdrender) from it. validate proves the source
      # is well-formed; check re-emits into memory and byte-compares each committed
      # artifact, plus a §6 cross-surface parity assertion (Go lifecycle literals ==
      # CSS glyph tones == tokens) so a GUI/TUI divergence cannot slip through.
      - name: Design-token drift gate (blocking)
        run: |
          node design/validate.mjs
          node design/check.mjs
          # theme-system Wave 2 (D17): the zero-dep OKLCH compiler core's unit
          # tests. Runs here so a change to design/derive.mjs re-proves the colour
          # math / serializer byte-formats / AA-walk + on-accent contracts.
          node design/derive.test.mjs
          # theme-system Wave 4 (D24/D27): the N-theme [data-bp-theme] emission +
          # paper-editor mirror-scoping proofs, driven by a fixture theme OUTSIDE
          # design/themes/ so a second theme is exercised without a shipped skin.
          node design/theme-emit.test.mjs

      # Studio literal-color gate (unified-aesthetic W2.6). Studio chrome
      # (api/lib/barkpark_web/ heex + ex) must consume the emitted design tokens
      # via var(--…) — never a copied hex / hsl() channel literal. Fails on any
      # NEW inline color literal outside the lead-approved allowlist (the GENERATED
      # block, rgb() shadows, the paper-surface/Sheets skip region, and annotated
      # per-line resisters). See scripts/studio-literal-check.sh for the full list.
      - name: Studio literal-color gate (blocking)
        run: bash scripts/studio-literal-check.sh

      # Web literal-color gate (unified-aesthetic W3.9). The web/ demo
      # (web/app/** + web/components/** — .tsx/.ts/.css) must consume the emitted
      # design tokens via var(--color-…) / Tailwind token utilities — never a
      # copied hex / hsl() literal. The web-scoped twin of the Studio gate: fails
      # on any NEW inline color literal outside the lead-approved allowlist (the
      # GENERATED block, rgb()/rgba() overlay tints, and annotated per-line
      # resisters). See scripts/web-literal-check.sh for the full list.
      - name: Web literal-color gate (blocking)
        run: bash scripts/web-literal-check.sh

      # Go (CLI/TUI) literal-color gate (unified-aesthetic W4.10). The bp CLI/TUI
      # (cmd/barkpark/** + internal/cli/** + internal/taskboard/theme.go)
      # must resolve semantic status/lifecycle/priority colours through
      # internal/semrole off the generated token artifact (tokens_gen.go, from
      # design/tokens.json) — never an inline lipgloss color literal at a call
      # site. The Go-scoped twin of the Studio/web gates: fails on any NEW inline
      # #hex color literal outside the lead-approved chrome allowlist (annotated
      # per-line resisters earmarking au-w4-cli-chrome-tokens). See
      # scripts/go-literal-check.sh for the full list.
      - name: Go literal-color gate (blocking)
        run: bash scripts/go-literal-check.sh

      # Durable tripwire (au-w4-cli-ratchet, AC5): prove the gate actually REDs on
      # a planted literal — a temp-dir self-test that plants #ff0000, asserts the
      # REAL scanner exits non-zero naming the file:line, then asserts clean +
      # commented-hex files pass. Plants nothing in the tree; guards the gate
      # against a future edit that silently weakens the lexer/LITERAL/allow logic.
      - name: Go literal-color gate self-test (tripwire)
        run: bash scripts/go-literal-check.sh --selftest

      # Citation-truth guard (citation-truth epic). Extends the doc-truth verifier
      # to @moduledoc/// /doc-comment PROSE so a drifted code-comment lineref, a
      # resurrected dead-dependency citation, or a live-asserted retired technology
      # is caught automatically. Fail-closed:
      #   · acceptance-code-comments.mjs — the 29-defect fail-before corpus + the
      #     never-cry-wolf control + the plant-catch checks (exit 1 on any miss).
      #   · retired-terms.mjs — never-worse vs the frozen baseline (exit 1 on any
      #     NOVEL dead-tech / live-assertion beyond the known backlog).
      - name: Code-comment citation guard (blocking)
        run: |
          node tooling/doc-truth/acceptance-code-comments.mjs
          node tooling/doc-truth/retired-terms.mjs
