name: doc-gates

# Documentation spine enforcement (docs-refactor wave 5).
# Enforces: byte budgets + 7-card cap, routing/INDEX/anchor resolution,
# G1 doc-tier headers, canonical-for uniqueness, ARCHIVED banners.
#
# WHAT THIS WORKFLOW'S RED ACTUALLY DOES, said plainly because this header used
# to say "Blocking:" and that was a claim of authority the committed spec
# denies. This file publishes ONE check-run context, the job name `Doc budgets
# + anchors` below, and that context is not in
# .github/required-checks.json's required set — it carries an S4 exclusion row
# there (paths-filtered, so a PR touching none of the filtered paths never
# renders it at all). Every step below fails THIS JOB when it trips, and the
# job's red is visible on the PR; none of it stops a merge. The step names say
# "(fails this job)" for exactly that reason — they said "(blocking)" for
# twenty-one steps, which is the inverse of the rot advisory-prose guards catch.
# See docs/ops/merge-gates.md §"Documentation review rules".

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      # code triggers — @canonical capability markers live in source; a code-only
      # rename must re-run docs-anchors-check.sh §8 or the marker rots silently.
      - "**/*.ex"
      - "**/*.exs"
      - "**/*.go"
      - "**/*.ts"
      - "**/*.tsx"
      # .mjs/.js added with the §13 @boundary registry: docs-anchors-check.sh's
      # marker scan has always included them (§8's CANON_INCLUDES), but this
      # workflow had no **/*.mjs or **/*.js trigger, so a rename inside
      # cloud/priv/static/*.mjs — the exact surface the Cloud Console
      # boundaries live on — never re-ran the scan here. The BLOCKING venue for
      # §13 is elixir.yml's unfiltered path-escape job; this widening only keeps
      # the advisory copy from going dark on the surface it audits.
      - "**/*.mjs"
      - "**/*.js"
      - "scripts/check-doc-budgets.sh"
      - "scripts/docs-anchors-check.sh"
      - "scripts/doc-drift-check.sh"
      - "scripts/doc-drift-check.test.sh"
      - "scripts/doc-drift-extract.py"
      # charter-corpus marker hygiene (docs/decisions/0008): its SUBJECT is the
      # charter tree, which no other glob here reaches, plus its own script.
      - "scripts/charter-corpus-hygiene-check.sh"
      - ".claude/workflows/**"
      - ".github/workflows/doc-gates.yml"
      # never-cancel-main ratchet (honest-gates D12) — its subject IS the
      # workflow tree, so it must trigger on ANY workflow edit. Without the
      # `**` glob the gate could never see the file that reintroduces the
      # hazard (only doc-gates.yml itself was triggered before), which is
      # exactly how the 2026-06-10 guard stayed at sample scope for 40 days.
      - ".github/workflows/**"
      - "scripts/never-cancel-main-check.sh"
      # the doc-truth sweeps — same reasoning as never-cancel-main above: their
      # SUBJECT includes their own scanner and frozen baselines, and .mjs is not
      # in the extension triggers, so without this a PR could weaken the sweep or
      # rewrite lineref-baseline.json without this gate ever running.
      - "tooling/doc-truth/**"
      # the two deploy.yml gates — their SUBJECT (.github/workflows/deploy.yml)
      # already rides the `**` glob above; these two lines cover an edit to the
      # gate scripts themselves, which no other glob matches.
      - "scripts/check-deployyml-filters.sh"
      - "scripts/check-deploy-smoke.sh"
      # connectors chat_bridge DDL drift gate — the .sh itself (the DDL sources
      # ride the **/*.ts + **/*.exs globs, but a .sh edit isn't covered by any).
      - "scripts/connectors-ddl-drift-check.sh"
      # connectors catalog connectable-drift gate — the .sh itself (its sources,
      # catalog.ex + connectors/src/**/*.ts, ride the **/*.ex + **/*.ts globs).
      - "scripts/connectors-catalog-drift-check.sh"
      # paper-editor style mirror tripwire — the mirrors + the generated
      # paper-surface token layer (bundle) must not drift from the ONE source.
      - "api/lib/barkpark_web/layouts/root.html.heex"
      - "api/priv/static/assets/bp-paper-editor-shell.css"
      - "api/assets/paper-surface/paper-surface.css"
      - "api/assets/paper-editor/src/styles.css"
      - "scripts/paper-editor-mirror-check.sh"
      # status vocabulary single-source — the manifest + its drift gate.
      - "design/status-manifest.json"
      - "scripts/status-manifest-check.sh"
      # preview-contract cross-surface parity tripwire — the fixture mirrors, the
      # structural gate, and the preview emitters every surface consumes.
      - "scripts/preview-parity-check.sh"
      - "api/test/support/fixtures/preview-parity.json"
      - "web/__tests__/fixtures/preview-parity.json"
      - "cmd/barkpark/testdata/preview-parity.json"
      - "web/app/(finder)/d/[type]/[slug]/page.tsx"
      - "web/lib/preview-metadata.ts"
      - "web/lib/get-document.ts"
      - "api/lib/barkpark_web/components/share_meta.ex"
      # unified-aesthetic design tokens — the source, the emitter/gate, and every
      # generated per-surface artifact (W1.2). Any drift trips design/check.mjs.
      - "design/tokens.json"
      - "design/tokens.schema.json"
      - "design/validate.mjs"
      - "design/emit.mjs"
      - "design/check.mjs"
      # the ONE Part A artifact no other glob here reaches. check.mjs Part A
      # adjudicates 28 generated artifacts; 27 are matched by a pattern in this
      # list, but doc-gates carries no **/*.html glob, so a PR whose diff is only
      # a hand-edit inside styleguide.html's BEGIN/END GENERATED swatch region
      # dispatched this workflow on NEITHER arm — the byte-parity/attribution
      # check never ran on the one change it exists to catch.
      - "cloud/priv/static/styleguide.html"
      # check.mjs's own negative half. Without this glob a change that breaks the
      # selftest — or the selftest itself — never runs the step that executes it.
      - "design/check-selftest.mjs"
      # ledger backfill enumerator + its offline selftest. Without this glob
      # a change to the pager never runs the arms that prove it cannot skip.
      - "scripts/merge-gate-backfill.mjs"
      # theme-system compiler (Wave 2 D17) — the zero-dep OKLCH derive core, its
      # unit tests, and the per-theme spec files. Without these globs Part F is a
      # script nobody runs (doc-gates has no broad **/*.mjs / **/*.json trigger).
      - "design/derive.mjs"
      - "design/derive.test.mjs"
      - "design/themes/**"
      # theme-system Wave 4 (D24) — the N-theme emission proof + its fixture theme.
      - "design/theme-emit.test.mjs"
      # stw-backlog-theme-matrix c0: the RUNTIME half of the theme matrix — every
      # supported search template stamps one documented data-bp-theme default and
      # reacts to bp:themechange. Its subjects ride the `templates/**` glob below,
      # but the test itself matched nothing, so an edit that guts the gate would
      # never have run it (the design/mirror-fence.test.mjs shape).
      - "design/template-theme-contract.test.mjs"
      - "design/preview-inventory.json"
      # stw-backlog-catalog-family: the CATALOG half of the same family — every
      # barkpark.template.json in the repo conforms to the manifest schema, and
      # every create-barkpark-app starter tree is enrolled in AVAILABLE_TEMPLATES
      # and mirrored into cloud/priv/templates. Its subjects ride `templates/**`
      # and the js/cloud globs, but the test itself matched nothing — the
      # design/mirror-fence.test.mjs shape, again.
      - "design/template-manifest-contract.test.mjs"
      # stw-backlog-theme-matrix c2 (partial): the AUTHORITY half — the emitted
      # bp-graph palette is the SOLE source of concrete colour in bp-graph.js.
      # Its four subjects already ride the globs above; the test itself matched
      # nothing, the design/mirror-fence.test.mjs shape again.
      - "design/graph-palette-authority.test.mjs"
      # stw-backlog-theme-matrix c2 (partial): the LIGHT/DARK half — runs the
      # renderer and records what it paints, so a swapped light/dark arm cannot
      # hide behind three static gates. Its four subjects ride the globs above.
      - "design/graph-theme-runtime.test.mjs"
      - "templates/barkpark.template.schema.json"
      - "js/packages/create-barkpark-app/src/constants.ts"
      # cloud-console-hardening wave-5 (D41): the standing regression test for the
      # emit --write attribution fence. Rides the design/emit.mjs + design/check.mjs
      # dispensation (narrow wave-5 grant) so a change to emit.mjs re-proves the
      # fence can still REFUSE an unattributed write.
      - "design/emit-fence.test.mjs"
      # cloud-console-hardening D21/D41: the SAME fence, proved on the OTHER two
      # writers of the paper-editor mirror region. It shipped in #15455 executed by
      # no workflow at all — a regression test nobody runs is a comment with a
      # process cost, so it is wired here beside its emit-fence sibling.
      - "design/mirror-fence.test.mjs"
      # task-833f347eaa78a2a5: the ladder-refusal CONFORMANCE TABLE and the one
      # fixture of malformed families it drives all three implementations of the
      # type-ladder derivation against. Both need a glob of their own: the
      # fixture is the gate's INPUT, so an edit that guts it (a case deleted, the
      # sentinel changed) must re-run the gate that reads it, and the test itself
      # is not matched by any other glob here — doc-gates has no broad **/*.mjs
      # trigger, which is how design/mirror-fence.test.mjs shipped unrun.
      - "design/ladder-refusal-conformance.test.mjs"
      - "design/ladder-refusal-fixture.json"
      # tlv: the mutation proof that validate.mjs' lifecycle gate DERIVES its
      # required-state set from design/status-manifest.json. The manifest is the
      # gate's new input, so an edit to it must re-run the gate that reads it —
      # otherwise adding a state is exactly the silent skip this slice removed.
      - "design/validate-life-fence.test.mjs"
      - "design/status-manifest.json"
      # the attribution ledger itself (cch wave 68). A manifest-only edit — a
      # hand-tampered digest, a dropped slot — matched NO glob here, so the one
      # file the fence's memory lives in could change without the gate that
      # reads it ever running.
      - "design/emit-manifest.json"
      # the Part E ratchet's OWN baseline, and the one ledger entry that matched no
      # glob either (gate-red-dtoken). design/check.mjs is the only thing in the repo
      # that reads design/exemptions.json, and that file matched ZERO globs in both
      # `on:` blocks — so a PR editing the baseline ALONE never ran the gate the
      # baseline governs. That is the documented defeat in
      # tooling/grip/ledger/exemptions-ratchet-memory-refuted-2026-08-19.md: raise a
      # count in PR-1 (no glob matches, doc-gates never runs, green), then spend the
      # slack in PR-2 (Part E compares against the raised ceiling and passes) — two
      # ordinary PRs, ratchet defeated. api/priv/static/assets/bp-graph.js is the
      # same shape: a ledger entry whose only other trigger, bp-graph-drift.yml, is
      # named "(advisory)".
      - "design/exemptions.json"
      # task-d95c3e66b9177c8f: the design engagement's EXIT drift gate — the one
      # thing in the repo that reads the archived agency handover and compares a
      # canonical byte against the source it was copied from. Three globs, because
      # the gate has three subjects and all three are already-existing files that
      # would otherwise change without it running: the test itself (matched by no
      # other glob here — doc-gates has no broad **/*.mjs trigger, which is how
      # design/mirror-fence.test.mjs shipped unrun), and the agency handover, which
      # is the gate's INPUT — an edit to the archive is exactly the silent
      # re-baselining this gate exists to refuse. design/tokens.json and
      # design/themes/** (the canonical side) already ride the globs above.
      - "design/agency-provenance.test.mjs"
      - "design/handover/ui-review-9/design/tokens.json"
      - "api/priv/static/assets/bp-graph.js"
      # the audit verb table (cch-w65; moved into the image by cch-w69-s1 — its
      # Elixir consumer compile-time-reads it inside the cloud image build, which
      # only sees cloud/, so the design/ home broke every cp deploy) — the SOLE
      # authority for BOTH the closed Elixir @actions vocabulary and the console's
      # ACTION_LABELS region. Its two consumers ride globs above (audit_event.ex
      # on **/*.ex, app.js on its own line below), but a JSON-ONLY edit — a new
      # verb, a label reworded, a null's rationale deleted — matched nothing here,
      # so the one file both vocabularies read could change without
      # design/check.mjs Part 0 ever running.
      - "cloud/priv/audit-actions.json"
      - "design/paper-editor-mirror.mjs"
      - "design/fixtures/**"
      - "cloud/priv/static/app.css"
      - "web/app/globals.css"
      - "internal/taskboard/tokens_gen.go"
      - "internal/pdrender/tokens_gen.go"
      # tlv-bl-js-vocab-generator: the two JS/TS status-vocabulary artifacts now
      # emitted from design/status-manifest.json (they replaced the hand copies
      # status-manifest-check.sh Part 5 used to byte-check). The web one rides
      # `web/**` below, but js/packages/** matched NO glob in this workflow — so a
      # hand-edit of the react generated file would never have run design/check.mjs
      # Part A, the ONE gate that now catches it. Named explicitly, both of them,
      # so neither depends on a broader glob staying broad.
      - "js/packages/react/src/status-vocab.gen.ts"
      - "web/lib/status-ladder.gen.ts"
      # the THIRD of the same family (task-76f7830182282c6d): apps/mobile's
      # taskboard.tsx was the last hand copy and is now a consumer of this
      # artifact. apps/mobile/** matches NO glob in this workflow — the `**/*.ts`
      # trigger above covers it today, but the react line right above exists for
      # exactly the reason this one does: a generated file must not depend on a
      # broader glob staying broad to reach the ONE gate that byte-checks it.
      - "apps/mobile/src/papers/portabledoc/blocks/status-vocab.gen.ts"
      - "api/lib/barkpark_web/layouts/bulldocs.html.heex"
      # Studio literal-color gate — Studio chrome must consume emitted tokens.
      - "api/lib/barkpark_web/**/*.ex"
      - "api/lib/barkpark_web/**/*.heex"
      - "scripts/studio-literal-check.sh"
      # Studio link/path gate — every Studio destination has ONE canonical path
      # built through Paths; a hand-built scope/dataset URL literal reds this.
      - "scripts/studio-link-lint.sh"
      # Web literal-color gate — the web/ demo must consume emitted tokens.
      - "web/**"
      - "scripts/web-literal-check.sh"
      # Go (CLI/TUI) literal-color gate — the bp CLI/TUI must resolve semantic
      # colours through internal/semrole off the generated token artifact.
      - "cmd/barkpark/**"
      - "internal/cli/**"
      - "internal/taskboard/theme.go"
      - "scripts/go-literal-check.sh"
      # Tenant fail-open read baseline gate — a NEW scope_to_workspace_or_global /
      # by-PK Repo.get(Document) tenant read must carry a reviewed `# global-read:`
      # justification or update the baseline (barkpark-w9dg scar class).
      - "api/lib/**/*.ex"
      - "scripts/tenant-scope-check.sh"
      - "scripts/tenant-scope-baseline.txt"
      # NEW-lineref gate. No baseline file to list: it is diff-scoped, so the
      # script is the whole input surface.
      - "scripts/new-lineref-check.sh"
      # Nil-polarity fail-CLOSED gate (ctx-compression W1 s3). A caller-less/nil
      # principal must be the MOST RESTRICTIVE anonymous one — never a bypass. This
      # gate reds if a fail-OPEN nil/catch-all clause of Envelope.field_readable?/3
      # or ListenController.redacted_result/4 reappears. Its sources ride the
      # api/lib/**/*.ex glob above; the .sh itself needs its own trigger.
      - "scripts/nil-polarity-check.sh"
      # Preview-env isolation gate — a NEW test that mutates the process-global
      # Application.put_env(:barkpark, :preview, …) must declare `async: false`
      # + an `on_exit` restore (preview-route pollution tripwire).
      - "api/test/**/*.exs"
      - "scripts/preview-env-isolation-check.sh"
      # Site templates (search-template epic D12) — a standalone template tree
      # (its own package.json, vendored CSS/theme slice + bp-graph snapshot). Its
      # files ride none of the app-scoped globs above (web/**, api/lib/**), so a
      # template-only CSS/theme PR would never run the design gate. This trigger
      # opens the frontier to templates/** so those PRs at least run doc-gates.
      - "templates/**"
      # PortableDoc render-parity completeness guard (render-unification D8/D45).
      # The guard greps compose.ex's dispatched block types, subtracts the 14
      # excluded field/embed types, and reds if any in-scope type lacks a golden
      # fixture. compose.ex + gen_pd_parity.ex ride the **/*.ex glob; the .sh
      # itself and the golden mirror need their own triggers (a seeded/removed
      # fixture is a .json, covered by no glob above).
      - "scripts/pd-parity-completeness.sh"
      - "scripts/pd-parity-completeness.test.sh"
      - "api/test/support/fixtures/pd-parity/**"
      # Scaffy anchor-drift gate (scaffy epic W6 leap 3, charter D71 L3). The
      # command files themselves, plus the only two anchored target surfaces NOT
      # already covered by a glob above: cloud/priv/static/app.js + __app.test.mjs
      # (there is no **/*.js / **/*.mjs trigger, and app.css is triggered but the
      # .js/.mjs pair is not).
      #
      # BOUNDED 2026-09-05 (cgsiw-s5). The sentence that stood here — "Every
      # OTHER anchored surface in the corpus rides a trigger above" — was a
      # STANDING, unqualified claim over an OPEN-ENDED corpus, and nothing
      # enforces it. Re-derived: the scaffy `IN` targets are 40 distinct paths
      # across scaffy/commands/, 2 of them templated (`{{.TargetFile}}` and
      # `api/lib/barkpark/plugins/{{.plugin}}.ex`); all 38 literal ones matched
      # at least one glob in this list on 2026-09-05. That is a MEASUREMENT WITH
      # A DATE, not an invariant: scaffy/commands/** is a hot corpus and a new
      # command anchoring into a .py/.css/.json target reopens the gap the day
      # it lands. The claim was ALSO too broad about the docs-anchors corpus,
      # which it did not measure — 15 of that corpus's 95 targets matched no
      # glob at all. Those are handled by the anchor-TARGET block at the very
      # end of this list; do not restate a whole-corpus claim here.
      - "scaffy/commands/**"
      - "cloud/priv/static/app.js"
      - "cloud/priv/static/__app.test.mjs"
      # DEPENDABOT ROOT DRIFT (task-c33fee1e82700787). The last three entries
      # are INPUTS, not the gate: scripts/dependabot-roots-check.sh re-derives
      # the root set from the LOCKFILES in the tree, so ADDING or DELETING a
      # lockfile anywhere is exactly the event that can invalidate
      # .github/dependabot.yml — and .github/dependabot.yml is NOT covered by
      # the ".github/workflows/**" entry above.
      - ".github/dependabot.yml"
      - "scripts/dependabot-roots-check.sh"
      - "**/package-lock.json"
      - "**/pnpm-lock.yaml"
      - "**/go.mod"
      # SILENCER GROWTH RATCHET (cgsi-bl-baseline-laundering-estate). The two
      # entries below are INPUTS the broader globs above genuinely miss:
      # `scripts/**` does not match a dotfile, so scripts/.silencer-counts — the
      # roster the whole gate compares against — matched NOTHING, and
      # api/.sobelow-skips matched nothing either. A silencer whose edit does not
      # trigger the gate that ratchets it is the exemptions.json defeat over
      # again: raise the count in a PR the gate never runs on, spend it later.
      # (The other four measured silencers already ride globs above:
      # scripts/tenant-scope-baseline.txt and design/status-manifest.json are
      # named; the lit-allow populations ride "**/*.go" and "**/*.ex".)
      - "scripts/.silencer-counts"
      - "api/.sobelow-skips"
      # PAPER DIALECT RATCHET (pe-w2-bl-hollow-corpus-repair). Same dotfile hole
      # as the two entries above: `scripts/**` does not match
      # scripts/.paper-dialect-baseline, the pinned-count file the whole ratchet
      # compares against, so raising a number in it triggered NOTHING. The
      # script itself rides `scripts/**`; of its three measured corpora
      # (scripts/paper-dialect-ratchet.sh DEFAULT_SOURCES) `cmd/barkpark/testdata`
      # already rides "cmd/barkpark/**" above — the two under
      # tooling/paper-excellence/ ride no glob in either block, so a new dirty
      # fixture landed without the gate that counts it ever running.
      - "scripts/.paper-dialect-baseline"
      - "tooling/paper-excellence/rig/fixtures/**"
      - "tooling/paper-excellence/twin/**"
      # ── the code-comment citation guard's .eex corpus (cgsiw-s5). The step
      # below runs tooling/doc-truth/retired-terms.mjs, whose TERM_EXTS includes
      # `.eex` and whose TERM_EXCLUDE covers node_modules/_build/deps/vendor/
      # priv/static/.git — NOT api/priv/templates/ or api/rel/. Five live
      # specimens on origin/main today (api/rel/env.sh.eex and four under
      # api/priv/templates/plugin_new/), and `.eex` matched NO glob in either
      # block. PR SHAPE CLOSED: a retired term reintroduced into the plugin
      # scaffold templates — so every plugin generated from then on carries dead
      # vocabulary — fired nothing at all. (The guard's other input surface,
      # tooling/doc-truth/**, already has its own trigger above.)
      - "**/*.eex"
      # ── .heex tree-wide, and this one is PROSPECTIVE — say so rather than
      # inflate it. `git ls-tree -r origin/main | grep '\.heex$' |
      # grep -v '^api/lib/barkpark_web/'` is EMPTY (0 of 13), so every live
      # .heex already rides api/lib/barkpark_web/**/*.heex above. But two
      # guards' SUBJECT SETS are broader than that path: preview-parity-check.sh
      # part 3 scans .heex tree-wide, and studio-literal-check.sh walks
      # api/lib/barkpark/plugins for .heex as well as .ex. PR SHAPE CLOSED: the
      # first plugin-owned .html.heex, or any .heex under cloud/, would land
      # invisible to both. One line retires the class before the specimen
      # exists; it costs nothing while the count is zero.
      - "**/*.heex"
      # ── anchor-TARGET existence: docs-anchors-check.sh §3 (cards) and §3b
      # (non-card agent docs) resolve every `## Code anchors` bullet's path and
      # red when it no longer exists — the docs/media/DISCOVERY.md scar §3b was
      # written for. That guard's subject set is the ANCHOR CORPUS, which is
      # open-ended and NOT extension-shaped, so the code globs above do not
      # bound it. PR SHAPE CLOSED: `git mv scripts/pdrender-dump.sh
      # scripts/pdrender-render.sh` as a ONE-FILE PR matched no glob here, so
      # docs/cards/tui.md kept pointing at a deleted path and the next unrelated
      # .md PR ate the red.
      #
      # WHICH OPTION, AND WHY NOT THE OTHER. The two honest fixes were (a)
      # enumerate the corpus's surfaces here, or (b) split §3/§3b onto its own
      # job with `paths: ['**']`, which retires the CLASS instead of the
      # instances. (b) is the better shape and is deliberately NOT taken: the
      # workflow-trigger freeze (task-33742276cf0a35b1) forbids adding a job or
      # a trigger, and this slice may widen an existing `paths:` arm and nothing
      # else. So (a) is instance-scoped BY CONSTRUCTION and the class stays
      # open — an anchor into a surface none of the globs below cover reopens
      # it. If the freeze lifts, prefer (b).
      #
      # DERIVED 2026-09-05 against the live corpus: 95 distinct anchor targets
      # across docs/cards/*.md plus the non-card agent docs, of which 15 matched
      # no glob in either block. The globs below cover all TWELVE file
      # specimens. The other three are DIRECTORY anchors
      # (api/lib/barkpark_web/components/fields,
      # api/lib/barkpark/plugins/onixedit/bokbasen,
      # js/packages/create-barkpark-app/templates/blog-starter/) and need no
      # glob: renaming a directory necessarily moves the .ex/.md/.tsx files
      # inside it, and those ride the code globs at the top of this list.
      # scripts/media-smoke.sh, scripts/pdrender-dump.sh
      - "scripts/**"
      # api/scripts/prod-postcheck.sh
      - "api/scripts/**"
      - "api/start.sh"
      - "Makefile"
      # .githooks/post-merge
      - ".githooks/**"
      # api/assets/paper-editor/src/convert.js
      - "api/assets/**"
      # bp-asset-explorer.js, bp-rich-text-editor.js, bp-search-intel.js
      - "api/priv/static/assets/**"
      # ONIX_BookProduct_3.0_reference.xsd
      - "api/priv/onix/**"
      # docs/cli/manifest.schema.json — a .json, so **/*.md misses it
      - "docs/**"
      # repo-papers freshness gate — the SNAPSHOT half of its pair. The doc half
      # rides **/*.md and the gate itself rides scripts/**, but a PR that edits
      # only .demo-content/repo-papers/*.json would otherwise never render this
      # job, and editing a snapshot is exactly when its agreement changes. Added
      # to the EXISTING paths list on purpose: a workflow-level paths: key on a
      # new file would make the context ABSENT, not green.
      - ".demo-content/repo-papers/**"
      # `scripts/**` subsumes the twelve named scripts/*.sh lines above and
      # `api/priv/static/assets/**` subsumes two named files. Those lines STAY:
      # each records WHICH guard needs it and WHY, and that reasoning is what
