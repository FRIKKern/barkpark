name: scheduled-arm-health

# THE READER'S OWN OWNER (task-c1148783a9ee36e7).
#
# scripts/scheduled-arm-health.sh reads every cron'd workflow in the tree against
# its real scheduled-run history. Until this file existed, CI only `bash -n`'d it
# and ran its hermetic .test.sh — both gated on its own paths changing — so
# NOTHING anywhere ever ran it against this repository. A reader with no caller is
# a reader nobody reads: the same shape as the cron'd job that gates nothing,
# which is the defect the script was written to find. It reproduced its own
# disease one level up, and this file is the fix.
#
# WHY ITS OWN FILE AND NOT A JOB IN shell-harnesses.yml. That was tried first and
# is wrong twice over. (1) scripts/shell-harnesses-dispatch.test.sh requires every
# job there to carry EXACTLY `if: needs.changes.outputs.<job id> == 'true'` — no
# other condition — so a job that must run on `schedule` and on NO other event
# cannot be expressed under that contract without either widening the partition
# (disabling the guard) or letting the sweep fire on every PR. (2) Adding a cron
# to shell-harnesses.yml would put all 52 of its paths-partitioned harness jobs on
# a nightly, because the dispatcher dispatches TRUE for every set on any non-PR
# event. A schedule-only reader belongs in a schedule-only file.
#
# NO push OR pull_request ARM, DELIBERATELY. The sweep costs ~90 `gh api` calls
# over ~30 cron'd workflows and its subject is GitHub's run history, which no
# diff changes. It would be pure noise on a PR, and a PR green would say nothing
# about it. The script's own hermetic harness is what guards the code; this is
# what guards the repository. workflow_dispatch is here so a human can take the
# reading on demand rather than waiting for 07:20Z.
#
# 07:20 UTC is chosen to sit AFTER the smoke crons it measures (search-starter
# 12:50, studio-journey 13:20 the previous day), so it always reads a settled
# history rather than a run still in flight.
#
# IT FAILS ON A RED, AND THE RED IS EXPECTED TO BE NON-EMPTY TODAY.
# studio-journey-smoke's scheduled arm is 47-of-47 failed and has never once
# succeeded; that row is the open finding, not noise. A job that printed it while
# exiting 0 would be exactly the report-mode shape this lane objects to. Exit 2
# (CANNOT MEASURE) fails too: a sweep that could not read a row must never be
# mistaken for a sweep that found nothing.
#
# `github.token` carries actions:read on this repository, which is every scope
# the reader needs. It creates nothing and writes nothing.

on:
  schedule:
    - cron: "20 7 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  # so a failed sweep can surface itself to a human (task-e6fe244ece2b5d27).
  # Until this line existed the notifier below could not have filed anything.
  issues: write

concurrency:
  group: scheduled-arm-health
  cancel-in-progress: false

jobs:
  sweep:
    name: every cron'd workflow in this tree, read against its real run history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        id: setup
      - name: read every declared cron against its real scheduled runs
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # KEEPING `-e` OFF THIS PIPELINE IS LOAD-BEARING (task-3b5edb3d1f5990e3).
          # A `run:` block's shell is `/usr/bin/bash -e {0}`, and `set -o pipefail`
          # makes this pipeline carry the SCRIPT's status, so `-e` aborted the step
          # the moment scheduled-arm-health.sh exited 1 (at least one red arm) or 2
          # (cannot measure) — which are this script's two INTERESTING outcomes. The
          # step summary below was therefore written only when there was nothing to
          # report.
          #
          # BUT `|| :` WAS THE WRONG WAY TO DO IT, AND IT MADE THIS WORKFLOW LIE
          # (task-0a48c7b64d5ab0f1, 2026-09-17). `:` is itself a pipeline, so
          # running it on the right of `||` REPLACES PIPESTATUS with its own
          # status: `(exit 1) | tee f || :` then reads `${PIPESTATUS[0]}` as 0.
          # The capture below was not merely reachable, it was DEAD — always 0 —
          # so `exit "$rc"` concluded SUCCESS on a red arm and on cannot-measure
          # alike. The comment above claimed "`exit "$rc"` still fails the step
          # exactly as before"; it did not, and had not since the `|| :` landed.
          # `set +e` is the form grip-suite.yml and research-coverage-suite.yml
          # already use: `-e` cannot steal the diagnosis, and nothing runs between
          # the pipeline and the capture to overwrite PIPESTATUS. Do NOT put the
          # `|| :` back — scripts/workflow-errexit-capture-check.sh now refuses it.
          set -o pipefail
          set +e
          bash scripts/scheduled-arm-health.sh 2>&1 | tee "$RUNNER_TEMP/arm-health.txt"
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo '## scheduled-arm-health'
            echo
            echo '```'
            cat "$RUNNER_TEMP/arm-health.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # ── THE READER THIS FILE DID NOT HAVE (task-e6fe244ece2b5d27) ─────────
      # MEASURED: this workflow was red on 5 of its 5 most recent runs and
      # nobody was told — and by construction nobody COULD have been. It
      # declares no `push:` arm and no `pull_request:` arm, both deliberately
      # (see the header). That is not merely "no check run on a PR": it puts
      # this file OUTSIDE the population of scripts/main-red-predicate.sh,
      # which enumerates workflows by `grep -qE '^[[:space:]]*push:'` over the
      # tree — its enumeration loop, under the banner comment
      # `--- enumerate workflows carrying a push: arm ---`, is
      # `grep -qE '^[[:space:]]*push:' "$f" || continue` — and is the input to
      # main-red-owner.yml
      # — the one mechanism in this repo that gives a red on main's tip an
      # owner. A schedule-only workflow is structurally invisible to it.
      #
      # So the instrument that tells this repo whether its crons DISPATCH and
      # CONCLUDE was itself the loudest instance of the disease it reports.
      # This step closes that, and it is the only reader available to a file
      # that may not have the other one.
      #
      # `failure() || cancelled()`, NOT a bare `failure()`. `failure()`
      # evaluates FALSE on a cancelled run, and cancelled is the dominant
      # non-success conclusion on this repository's scheduled workflows — a
      # sweep that stopped running is the same silence as a sweep that ran red,
      # and worse, because a stale issue keeps sitting there looking current.
      # The same reasoning is written above the equivalent steps in
      # paper-readers.yml and codebase-intel.yml.
      #
      # THIS WILL FILE AN ISSUE ON ITS NEXT RUN, AND THAT IS THE POINT, NOT A
      # REGRESSION. The red it reports is real and six weeks old
      # (studio-journey-smoke's scheduled arm, 47-of-47 failed). It is ONE
      # deduped issue, not one per night: file-ci-failure-issue.sh keys on
      # CI_FAILURE_KEY, appends to the open issue rather than minting a new
      # one, and after ESCALATE_AFTER repeats stops appending and escalates
      # ONCE. A finding that has been invisible for six weeks becoming one
      # issue is the intended state change.
      - name: Report failure to a human
        if: failure() || cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_FAILURE_KEY: scheduled-arm-health
          CI_FAILURE_DETAIL: |
            The daily scheduled-arm-health sweep did not come back clean.

            It reads every cron-declaring workflow in this tree against its
            real run history, SCOPED `event=schedule`, and reds on five
            shapes: NEVER SUCCEEDED, LAUNDERED (green on another event only),
            STALE, VACUOUS CRON (the cron executes nothing the push/PR arm
            does not) and ASSERTED NOTHING (every job in the run skipped).

            Exit 2 is CANNOT MEASURE and fails too, deliberately: a sweep that
            could not read a row must never be mistaken for a sweep that found
            nothing.

            The per-workflow verdict table is in this run's STEP SUMMARY.
        run: bash scripts/file-ci-failure-issue.sh
