# stale-verdict-watch — the second scream. It reds for as long as a CONFLICTING
# pull request keeps asserting a green required verdict it can no longer earn
# (deploy-reliability D474).
#
# WHAT IS ACTUALLY BROKEN
#
# A conflicted PR re-dispatches NOTHING. Measured on #10944: every workflow run
# on its head was created at the push instant 2026-08-08T14:31:22Z with
# run_attempt=1, and 49 commits have landed on main since. #10129's twelve runs
# are all from 2026-08-07T05:57:05Z with 100+ commits since — and the checks API
# still answers SUCCESS for all four required contexts. Nothing in this repo
# says so out loud, which is the whole defect: the verdict next to the merge
# button describes a tree that no longer exists, and it will describe it forever
# unless somebody pushes.
#
# WHY THIS IS A NEW FILE AND NOT AN EDIT TO main-gate-watch.yml
#
# Two reasons, and the second alone would be enough. (1) That file is CONTENDED:
# cchi-w60-main-gate-watch-push-arm-cannot-win is in flight against its push arm
# right now, and two branches editing one workflow is the co-scoped-fixes trap —
# whichever merges second silently loses half a fix. (2) Its permissions are
# `contents: read` + `checks: read` with NO `pull-requests: read`, and this
# verdict is a pull-request read. Widening a contended file's token scope from a
# second branch is the worst version of that collision. Ordering, stated so it
# can be checked: this file can merge in any order relative to cchi-w60 because
# the two share no line.
#
# WHY THERE IS NO continue-on-error ANYWHERE IN THIS FILE
#
# Job-level `continue-on-error: true` still renders a RED check run, but it
# launders the WORKFLOW RUN to success — and the run conclusion is what
# notifications, `gh run list` and the rollup read. A scream nobody is paged for
# is not a scream. This run fails.
#
# WHY A SCHEDULE
#
# Staleness is not an event. No webhook fires when main moves past a conflicted
# PR's last verdict; the PR simply sits there, greener by the hour and less
# true. A LEVEL trigger is the only shape that can see it, so this asks every 30
# minutes and keeps asking.
#
# THE RESIDUALS, IN NUMBERS
#
#   * a ~30-45 minute observation window (GitHub queues cron under load)
#   * silence during an Actions outage, and GitHub's 60-day auto-disable of
#     scheduled workflows in an inactive repo
#   * `mergeable` is LAZILY COMPUTED. On 2026-08-09 the FIRST poll answered 39
#     UNKNOWN of 40 open and the second, 12s later, answered 22 CONFLICTING / 18
#     MERGEABLE. The script re-polls and prints any surviving UNKNOWN as a
#     WARNING ROW — it is never dropped and never counted clean. A run that ends
#     with rows still UNKNOWN reports a warning, not a green claim about them.
#     A run that classified NOT ONE row is a stronger case still: it exits 5 and
#     FAILS (arm 5 below), because the warning arm concludes success and for one
#     release a run that classified 0 of 39 rows concluded success through it.
#   * the staleness distance is measured over a bounded window of main commits
#     (3 pages, 300); a distance that fills the window prints as `N+`.

name: stale-verdict-watch

on:
  schedule:
    # Every 30 minutes. GitHub queues cron under load, so read this as "within
    # ~30-45 minutes", never "at :00 and :30".
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    # Deliberately narrow: this trigger exists ONLY so the harness below is not
    # orphaned. Being paths-filtered also keeps every name in this file out of
    # the required set, belt and braces with the watch job's `if:`.
    paths:
      - "scripts/stale-verdict-watch.sh"
      - "scripts/stale-verdict-watch.test.sh"
      - "scripts/stale-verdict-watch-route.sh"
      - "scripts/stale-verdict-watch.baseline"
      - ".github/workflows/stale-verdict-watch.yml"
      - ".github/required-checks.json"
      - "docs/ops/merge-gates.md"

permissions:
  contents: read
  # The verdict reads open pull requests and their check rollup. GITHUB_TOKEN
  # carries both with these two scopes — no PAT, no secret, no human gate.
  pull-requests: read
  checks: read

concurrency:
  group: stale-verdict-watch-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # NEVER a literal `true`: on push-to-main that self-cancels the watch dark.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ══ TWO JOBS, BECAUSE THERE ARE TWO FAILURE CLASSES ════════════════════════
  #
  # task-bc902e08cdfd2ee7. Until this split, ONE step of ONE job named `Stale
  # verdict watch` mapped EIGHT of this script's outcomes to `exit 1`: rc 1 ("a
  # conflicted PR is asserting a stale green — go rebase or close #N") and the
  # read faults 3/4/5/6/7/9 ("this run could not look, and names no pull
  # request"). MEASURED: run 34589487018 (2026-09-11T10:29:43Z, main) exited 6
  # UNREACHABLE and rendered in `gh run list` as the name `Stale verdict watch`,
  # conclusion `failure` — character for character what an rc-1 verdict renders.
  # Opposite remedies, one name, and a fleet that sees the second often enough
  # learns to read the first as noise.
  #
  # Now: `stale-verdict-watch-fault` runs the watch and owns 3/4/5/6/7/9 (and any
  # rc the script does not define). `stale-verdict-watch` owns 0/1/2/8 and is
  # SKIPPED on a read fault — skipped, never green, because "this run has no
  # population" must not render as "nothing is asserting a stale green". The
  # workflow RUN still fails on a fault (the fault job carries the red), so
  # nothing here is a `|| true`: the split changes WHICH NAME screams, never
  # WHETHER one does.
  #
  # The rc→outcome table is scripts/stale-verdict-watch-route.sh, not a `case`
  # inline here, for one reason: a routing table living in a `run:` block cannot
  # be driven offline. scripts/stale-verdict-watch.test.sh section (m) runs that
  # script once per (role, rc) pair and asserts exactly which role reds — the
  # forced-both-ways proof, with no GitHub in the loop.
  #
  # The trend store rides THIS job because this job is the one that runs the
  # watch; the sibling only interprets the rc it published.
  stale-verdict-watch-fault:
    name: Stale verdict watch read fault
    # Never on pull_request: a name that never renders on a PR head can never be
    # sampled into the required-check spec.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      # The sibling job below reads this instead of re-running the watch: a
      # second read is a second API round-trip that can disagree with the
      # first, and then the two check runs would be judging different moments.
      rc: ${{ steps.watch.outputs.rc }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The scream's own tripwire. If the harness stops being able to fail, the
      # watch below is decoration — and this run says so first.
      - name: Prove the verdict can be shown wrong (stale-verdict-watch.test.sh)
        run: bash scripts/stale-verdict-watch.test.sh

      # ── THE TREND STORE (dr-w29) ──────────────────────────────────────────
      # The watch appends START/READ lines to a state file so a red can say how
      # the reported count MOVED since the last run that actually READ — and so
      # a cancelled or BLIND run is counted UNREAD, never as unchanged (its
      # dangling START is the evidence). actions/cache is DELIBERATE here where
      # crown-reconcile rejected it: eviction is silent, but the script's own
      # "no baseline — the store evicted it" arm STATES the absence rather than
      # mistaking it for an unchanged count, and a lost trend is advisory
      # context on a verdict, never the verdict. The save key is per-run-id
      # (a fixed key would never re-save — cache entries are immutable) and the
      # restore falls back to the newest svw-state-* entry. STATED RESIDUAL: a
      # cancellation that kills the VM before the always() save loses that
      # run's START line, and that run goes uncounted.
      - name: Restore the trend state (best effort)
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/svw-state.txt
          key: svw-state-${{ github.run_id }}
          restore-keys: |
            svw-state-

      - name: Is a conflicted PR still asserting a green it cannot earn?
        id: watch
        env:
          GH_TOKEN: ${{ github.token }}
          SVW_STATE_FILE: ${{ runner.temp }}/svw-state.txt
        run: |
          set -uo pipefail
          rc=0
          bash scripts/stale-verdict-watch.sh --repo "${{ github.repository }}" || rc=$?
          # Published BEFORE the routing call: the sibling job must learn the rc
          # even when this step is about to red on it.
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          bash scripts/stale-verdict-watch-route.sh fault "$rc"

      # always(): the save must run on the red paths above (a red IS the run
      # whose START/READ the next trend needs) and on most cancellations.
      - name: Save the trend state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/svw-state.txt
          key: svw-state-${{ github.run_id }}
  stale-verdict-watch:
    name: Stale verdict watch
    needs: stale-verdict-watch-fault
    # `always()` so a red on the sibling does not silently skip this job as
    # "dependency failed" without saying why. The rc tests below are the real
    # fence:
    #   rc == ''            -> the upstream died before publishing one. Unknown,
    #                          not green.
    #   rc in 3 4 5 6 7 9   -> a READ FAULT. The sibling carries that scream under
    #                          its own name; this job must not render a verdict
    #                          about pull requests it never adjudicated.
    # Never a workflow-level `paths:` and never a rename: `Stale verdict watch`
    # keeps the name it has always published, and the fault name is NEW.
    if: >-
      always()
      && github.event_name != 'pull_request'
      && needs.stale-verdict-watch-fault.outputs.rc != ''
      && needs.stale-verdict-watch-fault.outputs.rc != '3'
      && needs.stale-verdict-watch-fault.outputs.rc != '4'
      && needs.stale-verdict-watch-fault.outputs.rc != '5'
      && needs.stale-verdict-watch-fault.outputs.rc != '6'
      && needs.stale-verdict-watch-fault.outputs.rc != '7'
      && needs.stale-verdict-watch-fault.outputs.rc != '9'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Interpretation only — the read itself happened once, in the sibling job.
      # rc 0 clean, rc 1 scream, rc 2 PARTIAL warning, rc 8 BASELINE DRIFT. A
      # read-fault rc cannot arrive here — the job `if:` above excludes every one
      # — and the router reds as a ROUTING ERROR if the wiring ever drifts.
      - name: Does the population carry a stale green?
        run: bash scripts/stale-verdict-watch-route.sh verdict "${{ needs.stale-verdict-watch-fault.outputs.rc }}"


  stale-verdict-harness:
    name: Stale verdict harness
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n scripts/stale-verdict-watch.sh
      - name: Shell syntax (stale-verdict-watch-route.sh)
        run: bash -n scripts/stale-verdict-watch-route.sh
      - name: Mutation proofs (stale-verdict-watch.test.sh)
        run: bash scripts/stale-verdict-watch.test.sh
