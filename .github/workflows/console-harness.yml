      # THE CENSUS'S FIXTURE CONTROL (cch-w40-s3, charter D452).
      #
      # The step above is the gate. Until this one landed, nothing showed that
      # gate LOSING. Its only committed control was (2d), which proves the census
      # can SEE the decisive POST /v1/providers pair — not that the ADD/REMOVE
      # set diff, the arm that actually reds a merge, can fire at all. A gate
      # never observed losing is a gate being trusted.
