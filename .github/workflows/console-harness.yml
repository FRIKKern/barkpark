      # AND (2d) is SPLIT in the same commit, because ONE of its two directional
      # verdict sub-clauses froze a live defect: `bp.predicate !== null` required
      # submitProviderCred to stay UNPREDICATED forever, so the fix the census
      # exists to motivate red its own instrument (measured: predicating that PIN
      # row and correctly moving EXPECT in the same commit still exited 2). That
      # term is retired and replaced by (2d-ii), the non-directional rule that the
      # pair may not go BOTH unpredicated — and the add fixture's
      # VERDICT-COLLAPSE must-flag row is what proves THAT arm can lose.
      #
      # THE OTHER directional term is KEPT, as (2d-iii). `gp.predicate === null`
      # requires submitInlineProviderCred to stay predicated, and that direction
      # freezes nothing: the fix touches the BARE row. Retiring it too — the
      # first draft of this slice — measurably dropped a guard main was running:
      # predicating the bare row AND nulling the gated row's pin predicate in one
      # commit exited 0 under (2d-i)+(2d-ii) alone where main exits 2. Both
      # directions are re-measured at rescue time; neither the unfreezing nor the
      # retained guard is asserted from reading.
      #
      # SEPARATE STEPS, NOT CASES IN __app.test.mjs — the same reason the census
      # step above states in its own comment, and it is true again this wave:
      # other slices are editing that file, and a census that has to merge with
      # them is a census that gets weakened to land.
      #
      # THE FULL 2x2, NOT JUST THE TWO FIRING CELLS. Each fixture is also run
      # through the OTHER flag and must exit 0. Without those two cells the pair
      # would only show the control shouting; with them it shows the control
      # telling the two arms apart. `set -e` is on by default, so each `test`
      # below is itself the assertion — an exit code that drifts fails the step
      # by name rather than being swallowed by a pipeline.
      - name: Binding census fixture control — ADD arm fires (exit 1)
        run: |
          node cloud/priv/static/__binding_census.mjs --add-check \
            cloud/priv/static/__binding_census.add.fixture.js && rc=0 || rc=$?
          echo "rc=$rc (expect 1)"
          test "$rc" -eq 1

      - name: Binding census fixture control — REMOVE arm fires (exit 1)
        run: |
          node cloud/priv/static/__binding_census.mjs --remove-check \
            cloud/priv/static/__binding_census.remove.fixture.js && rc=0 || rc=$?
          echo "rc=$rc (expect 1)"
          test "$rc" -eq 1

      - name: Binding census fixture control — the cross cells stay silent (exit 0)
        run: |
          node cloud/priv/static/__binding_census.mjs --remove-check \
            cloud/priv/static/__binding_census.add.fixture.js && rc=0 || rc=$?
          echo "add fixture under --remove-check: rc=$rc (expect 0)"
          test "$rc" -eq 0
          node cloud/priv/static/__binding_census.mjs --add-check \
            cloud/priv/static/__binding_census.remove.fixture.js && rc=0 || rc=$?
          echo "remove fixture under --add-check: rc=$rc (expect 0)"
          test "$rc" -eq 0

  # ── cssom-parity — the only check here that PARSES the artifact ──────────────
  # Every other CSS gate in this repo asks a question about the FILE: it regexes
  # app.css, or scans its comment nesting, or reads `--x:` declarations out of
  # three token blocks. None of them builds a CSSOM. That is exactly how #4592
  # stayed green for five waves — a lost `/*` opener turned a prose paragraph
  # into CSS, error recovery discarded tokens through the next `{…}` block, and
  # `.modal-root` (a shared modal primitive, 15+ call sites) never reached the
  # browser. Every modal in the console rendered unpositioned under a fixed
  # scrim, in production, while three green gates certified it.
  #
  # SEPARATE JOB, NOT A FOURTH STEP ABOVE (epic decision D17). console-unit pins
  # node-version: 20; this instrument speaks CDP over a bare global WebSocket,
  # stable-by-default only from Node 22, so a fourth step would inherit 20 and
  # fail. Bumping console-unit to 22 instead would silently change the runtime
  # under the __app.test.mjs harness AND __css_check.mjs — a risk-bearing
  # edit to two working gates to buy nothing. A separate job also runs its ~26s
  # in parallel.
  #
  # It takes the SAME job-level `if:` as console-unit (it reads
  # cloud/priv/static/app.css), and it reaches branch protection through
  # `Console gate`, never under its own name.
  cssom-parity:
    name: CSSOM parity (authored CSS vs browser)
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    # ── THE VERDICT CHANNEL (deploy-reliability wave 8) ────────────────────
    # The instrument already distinguishes 2 (REFUSED TO MEASURE) from 1 (a
    # measured defect), and the wrapper below already prints an honest banner
    # for each. But `needs.<job>.result` carries ONE word — `failure` — for
    # both, so the AGGREGATOR, which is the required context a reviewer reads
    # at the merge button, could only ever say "a job failed". A refusal
    # therefore arrived looking exactly like a CSS defect.
    #
    # PROVEN ON LIVE GITHUB (run 31136979488): a job's `outputs:` DO survive
    # `exit 1` and reach `needs.<job>.outputs`, both when the output is written
    # by the same step that exits 1 and when a later step fails. So the verdict
    # rides this channel while the EXIT CODE stays untouched.
    #
    # THIS CHANNEL CAN NEVER GREEN AN UNMEASURED GATE. It is not consulted by
    # anything that computes pass/fail: the job still exits non-zero, its
    # `result` is still `failure`, and console-gate's `bad=1` is set from
    # `result` ALONE. `continue-on-error` is banned (D19) precisely because it
    # would launder `result`; this output changes only the SENTENCE A HUMAN
    # READS.
    outputs:
      verdict: ${{ steps.cssom.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No setup-chrome action (D18). ubuntu-latest already ships Google Chrome
      # (measured: 150.0.7871.114, executable at all four of findChrome()'s Linux
      # candidate paths, full parity run 5.9s). findChrome() honours CHROME first
      # but does NOT read the runner's own CHROME_BIN, so pin it explicitly:
      # a future runner image dropping the binary then exits 2 as a GUARD naming
      # the missing path, instead of silently falling through to a different
      # browser. Both sides go through one normalise(), so a floating Chrome
      # version can only cost sensitivity, never manufacture a false miss.
      #
      # THE WRAPPER PRESERVES THE INSTRUMENT'S EXIT VOCABULARY. cssom-parity.mjs
      # distinguishes 2 (GUARD: it REFUSED to measure — no Chrome, no baseline
      # sidecar, wrong Node) from 1 (a real parity DEFECT). Bare `run:` collapses
      # both into "the job failed", and the first thing a reader does with a red
      # CSS gate is go hunting for a CSS bug that does not exist. Both still exit
      # 1: a refusal is not a pass. `set -uo pipefail` WITHOUT `-e` — `-e` would
      # kill the shell at the `node` line before the case could read `rc`. And
      # NEVER `continue-on-error`: for such a job `needs.<job>.result` reads
      # `success` even when it failed, which would launder the lie straight into
      # `Console gate`.
      - name: CSSOM parity gate
        id: cssom
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          set -uo pipefail
          # The verdict is published BEFORE the exit, in the same step that
          # exits — the shape proven to survive on run 31136979488.
          #
          # `${GITHUB_OUTPUT:-}` and the guard are NOT belt-and-braces:
          # scripts/console-path-escape-check.test.sh extracts this exact step
          # body and executes it under `env -i`, so an unguarded write would
          # kill the step under `set -u` before the case block could classify
          # the exit code — turning a REFUSED banner into a crash. Publishing
          # the verdict may never be able to break the classification it
          # describes.
          verdict() { if [ -n "${GITHUB_OUTPUT:-}" ]; then echo "verdict=$1" >> "$GITHUB_OUTPUT"; fi; return 0; }
          rc=0
          node cloud/priv/static/__preview__/cssom-parity.mjs || rc=$?
          case "$rc" in
            0)
              verdict OK
              echo "CSSOM parity: authored CSS and the browser agree."
              ;;
            2)
              verdict REFUSED
              # THE SAME CORRECTION AS THE AGGREGATE'S REFUSED ARM, APPLIED TO
              # THE ONE PER-INSTRUMENT BANNER THAT STILL DISAGREED WITH IT.
              # This sentence used to read "an ENVIRONMENT fault, not a
              # stylesheet defect. app.css was never parsed … fix the
              # environment". Counted in cssom-parity.mjs rather than
              # remembered, exit 2 has SIX shapes: no global WebSocket (Node
              # < 22), no stylesheet at $CSS, no Chrome/CHROME not executable,
              # a MISSING cssom-heads.baseline sidecar, an UNPARSEABLE one, and
              # a CDP/bring-up failure raised through die() after a bounded
              # retry. Three of those six are committed files under
              # cloud/priv/static/__preview__ — repo faults wearing an
              # "environment" label — and the last one fires AFTER app.css has
              # been read, so "never parsed" was false there too. The sibling
              # tier-floor-render and overflow-guard banners already said
              # "ENVIRONMENT or COVERAGE"; this one now agrees with them and
              # with the aggregate. scripts/console-path-escape-check.test.sh
              # drives this exact step body at rc=2 and both asserts the new
              # cause set and DENIES the two removed claims.
              echo "::error title=CSSOM parity REFUSED::The instrument refused to measure (exit 2). It made NO parity claim about cloud/priv/static/app.css in either direction — a refusal is the absence of a measurement, not a clean bill and not an accusation. WHY it refused is in this job's own log, above: cssom-parity.mjs prints the cause by name. exit 2 covers SIX causes and only one of them is the runner — no global WebSocket (Node 20 instead of 22); no stylesheet at \$CSS; no Chrome binary, or CHROME pointing at a non-executable; a MISSING cloud/priv/static/__preview__/cssom-heads.baseline sidecar; a sidecar carrying no parseable count; or a CDP bring-up that failed after a bounded retry in a fresh profile (every attempt's Chrome stderr is in the log). THREE of those six are committed files in this repo, so do NOT assume the environment before reading the line the instrument printed."
              exit 1
              ;;
            1)
              verdict MEASURED_DEFECT
              # THE DEFECT BANNER NAMES A CAUSE SET, for the same reason the
              # REFUSED banner below it does — and it is the LAST of the three
              # arms to learn it. This copy used to say, unconditionally, "rules
              # the browser dropped or rewrote. See the diff above." Counted in
              # cssom-parity.mjs, exit 1 has THREE shapes and only ONE of them
              # prints a diff: the selector comparison at the bottom of the run.
              # The other two — `Chrome parsed ZERO style rules` (:742) and `N
              # stylesheet(s) were unreadable` (:743) — abort BEFORE any
              # comparison exists, so the banner promised the reader evidence
              # that is not in the log and named a mechanism ("dropped or
              # rewrote") that did not occur.
              #
              # This is NOT a re-litigation of D101, which deliberately draws
              # the refusal line at bring-up and keeps everything after it on
              # exit 1 as a claim about the stylesheet. That line stands. What
              # changes is only that the banner stops describing all three
              # causes as the one that has a diff.
              echo "::error title=CSSOM parity DEFECT::The instrument MEASURED cloud/priv/static/app.css and is making a claim about it (exit 1) — this is not a refusal. WHICH claim is in this job's own log, above, and exit 1 covers THREE causes that do not read alike. (a) A PARITY MISS: authored selectors that never reached the browser's CSSOM — the run prints the per-selector diff, and that diff is the evidence. (b) ZERO style rules parsed: the stylesheet never reached the CSSOM at all, so NO diff exists above and nothing was 'dropped or rewritten' — read the line the instrument printed. (c) UNREADABLE stylesheet(s): cssRules threw while walking them, so the comparison was abandoned as a would-be false green, and again there is no diff. Only (a) has a diff to see, so do NOT go looking for one before reading which cause fired."
              exit 1
              ;;
            *)
              verdict UNINTERPRETABLE
              echo "::error title=CSSOM parity UNINTERPRETABLE::cssom-parity.mjs exited ${rc}, which is outside its vocabulary (0 pass / 1 defect / 2 refusal). Cannot tell, therefore red."
              exit 1
              ;;
          esac

  # ── tier-floor-render — the GEOMETRIC half of the billing-tier floor guard ──
  # #8741 repaired the billing tier grid with a single declaration
  # (`repeat(auto-fit, minmax(230px, 1fr))`) and shipped with NO guard: every
  # command this workflow invoked exited 0 on a 180px mutant, so a tidy-down
  # would have un-fixed a person-facing defect with every check green.
  #
  # The guard is a PAIR, and each half refuses a DIFFERENT mutation. The
  # byte-pin in __app.test.mjs (already run by console-unit, ~55ms, zero
  # workflow cost) refuses the TEXTUAL tidy-down at any value below 230 — but
  # it pins a declaration, so it is blind to a re-cut arriving from anywhere
  # else. THIS job renders the real screen in a real browser and refuses the
  # GEOMETRIC regression. Measured on this corpus: floors 190…230 are
  # byte-identical at 901 (three tracks, 283.5px, zero clips) and a 200px floor
  # passes even the FULL 13-width leg exit 0 — so this half alone is a "<=185"
  # guard, not a floor guard, and the byte-pin alone is a text guard, not a
  # layout guard. Neither subsumes the other; both are needed.
  #
  # ONE CELL, ONE WIDTH — 2.6s clean / 2.9s red including Chrome bring-up. The
  # full render leg is 26 cells x 13 widths and takes MINUTES; that stays a
  # developer instrument (see the comment on the cheap coverage leg above).
  # `--cell` is exact-match SINGLE-NAME on main: a comma list exits 2.
  #
  # SEPARATE JOB, NOT A FOURTH STEP IN console-unit — the same reason as
  # cssom-parity (D17/D183(e)): console-unit pins node 20, which has no global
  # `WebSocket`, and this sweep exits 2 there with
  # `CDP bring-up failed: WebSocket is not defined`. Modelled on cssom-parity
  # exactly: same `needs`/`if`, node 22, an explicit CHROME, and the same 0/1/2
  # wrapper — a REFUSAL (2) is not a layout defect and must not send a reader
  # hunting for a CSS bug that does not exist. Both still exit 1: a refusal is
  # not a pass. Never `continue-on-error` — `needs.<job>.result` reads `success`
  # for such a job even when it failed, laundering the lie into `Console gate`.
  #
  # HONEST SCOPE: `Console gate`, which this job reaches branch protection
  # through, is a REQUIRED context on `main` — a red here BLOCKS the merge, and
  # has done since 2026-08-03. This comment used to say the opposite, having
  # re-enumerated the required set in prose that then rotted, so it does not
  # anymore: `.github/required-checks.json` is the single committed source of
  # truth for what protection enforces, and scripts/required-checks-verify.sh
  # reds when a workflow's prose contradicts that file. Nothing is registered
  # here.
  tier-floor-render:
    name: Billing tier floor (rendered)
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    # See the verdict-channel note on `cssom-parity` — same contract, same
    # fail-closed guarantee: this output NAMES the fault, it never grades it.
    outputs:
      verdict: ${{ steps.tier.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tier floor — render the billing screen at 901px
        id: tier
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          set -uo pipefail
          # Guarded exactly as in `cssom-parity` above, for the same reason.
          verdict() { if [ -n "${GITHUB_OUTPUT:-}" ]; then echo "verdict=$1" >> "$GITHUB_OUTPUT"; fi; return 0; }
          rc=0
          node cloud/priv/static/__preview__/breakpoint-sweep.mjs --render --widths 901 --cell billing-trial || rc=$?
          case "$rc" in
            0)
              verdict OK
              echo "Tier floor: the billing tier grid renders at 901px with no clipped control."
              ;;
            2)
              verdict REFUSED
              echo "::error title=Tier floor render REFUSED::The sweep refused to measure (exit 2) — an ENVIRONMENT or COVERAGE fault, not a layout defect. NO claim is being made about the tier grid. Fix what the log names: the Chrome binary, Node 22 (node 20 has no global WebSocket and this exits 2 there), a squatting server on the sweep's port, or a cell/breakpoint the sweep has no coverage for. A bring-up refusal is retried a bounded number of times in a fresh profile before this fires — every attempt's Chrome stderr is in the log."
              exit 1
              ;;
            1)
              verdict MEASURED_DEFECT
              echo "::error title=Tier floor render DEFECT::A measured defect on the billing tier screen at 901px (exit 1) — most likely the .tier-grid track floor was lowered below ~185px, which re-admits five auto-fit tracks and CLIPS the Free tier's CTA label. See the Q1/Q2/Q3 lines above for the element, its scrollWidth/clientWidth and its text."
              exit 1
              ;;
            *)
              verdict UNINTERPRETABLE
              echo "::error title=Tier floor render UNINTERPRETABLE::breakpoint-sweep.mjs exited ${rc}, which is outside its vocabulary (0 clean / 1 measured defect / 2 refusal). Cannot tell, therefore red."
              exit 1
              ;;
          esac

  # overflow-guard (D208/D209): the browser-geometry guard that FIVE waves of
  # person-facing fixes have shipped their assertions into — and that, until
  # this job existed, no `run:` step in this repository ever invoked. Its
  # 108/108 was a hand-run baseline nothing protected: a regression of the
  # wave-15 fleet lead-column fix would have merged green while the epic's own
  # browser guard certified it.
  #
  # Modelled on `tier-floor-render` above, deliberately byte-for-byte: node 22
  # (node 20 has no global `WebSocket` and CDP bring-up exits 2 there with
  # `WebSocket is not defined`), an explicit CHROME, `actions/checkout@v4` with
  # no `ref:`, and the same 0/1/2/* ladder — a REFUSAL (2) is not a layout
  # defect and must not send a reader hunting for a CSS bug that does not
  # exist. Both still exit 1: a refusal is not a pass. Never
  # `continue-on-error` — `needs.<job>.result` reads `success` for such a job
  # even when it failed, laundering the lie straight into `Console gate`.
  #
  # ONE INVOCATION, NO `--defect` (D208). Chained per-leg invocations were
  # measured on a quiet host at 28.5s against 12.6s for the single run, and
  # produced 3/6 FALSE exit-2 refusals against SERVER_CAP = 8000 with a leaked
  # serve.mjs child. One run pays Chrome + server bring-up once and dodges that
  # class entirely. It also means the guard's `--defect` single-flag bug
  # (`argv.indexOf` reads only the first occurrence) is NOT a precondition for
  # this wiring — it stays an independent filed row.
  #
  # HONEST SCOPE: `Console gate`, the aggregator this job reaches branch
  # protection through, is a REQUIRED context on `main` — a red here BLOCKS the
  # merge, and has done since 2026-08-03. This comment used to say the opposite,
  # having re-enumerated the required set in prose that then rotted, so it does
  # not anymore: `.github/required-checks.json` is the single committed source
  # of truth for what protection enforces, and
  # scripts/required-checks-verify.sh reds when a workflow's prose contradicts
  # that file. Nothing is registered here.
  overflow-guard:
    name: Overflow guard (rendered)
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-latest
    # See the verdict-channel note on `cssom-parity` — same contract, same
    # fail-closed guarantee: this output NAMES the fault, it never grades it.
    outputs:
      verdict: ${{ steps.overflow.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # W18 REVIEW: the leg COUNT is deliberately not in this copy. Slice S1 of
      # this same wave adds a seventh (`W18-overview-card-pill`), and a number
      # baked into a step name is a sentence nothing re-derives — the disease
      # this epic keeps curing. The guard prints its own leg roster on every
      # run; read that, not this line.
      # THE FLOOR'S OWN MUTATION PROOF, BEFORE the legs it gates.
      #
      # It runs the shipped rendered-host floor against committed fixtures in
      # this same browser and asserts SIX directions, of which the first is the
      # one that matters: the pre-fix code path (settle defeated) must still
      # REFUSE a screen that renders perfectly, quoting the computed opacity it
      # judged on. A fix whose proof cannot reproduce the defect is a story
      # about the pixels — and three of the four remedies that suggest
      # themselves here (drop checkOpacity, wait unconditionally, skip the
      # ancestor walk) score perfectly on the legs below while re-opening the
      # hole the floor exists for. Each of those was mutated and lands red on a
      # named direction; see the proof's header.
      #
      # It runs FIRST so that a floor which has silently stopped being able to
      # refuse is reported as itself, rather than as 300 suspiciously clean
      # cells in the legs underneath.
      - name: Rendered-host floor — mutation proof in a real browser
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          set -uo pipefail
          rc=0
          node cloud/priv/static/__preview__/fixtures/ready-host-paint/proof.mjs || rc=$?
          case "$rc" in
            0) echo "Rendered-host floor: the defect reproduces on demand, the settle repairs it, and every hole it exists for still refuses." ;;
            2) echo "::error title=Floor proof REFUSED::The proof REFUSED TO MEASURE (exit 2) — no browser, or a direction whose precondition could not be established (an already-painted host, a selector matching zero nodes, an arming class that starts no animation). The reason is printed above. NO claim is being made about the floor either way, which is why this is red rather than green: a proof that judged nothing must never read as a pass."; exit 1 ;;
            1) echo "::error title=Floor proof FAILED::The rendered-host floor behaved wrongly (exit 1). The failing DIRECTION is named above. If direction 1 failed, the guard can no longer refuse an unpainted host and every green below is worthless; if direction 4, 5 or 6 failed, the settle has been widened into a blanket wait that greens invisible screens."; exit 1 ;;
            *) echo "::error title=Floor proof UNINTERPRETABLE::proof.mjs exited ${rc}, outside its vocabulary (0/1/2). Cannot tell, therefore red."; exit 1 ;;
          esac

      - name: Overflow guard — every defect leg in one browser run
        id: overflow
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          set -uo pipefail
          # Guarded exactly as in `cssom-parity` above, for the same reason.
          verdict() { if [ -n "${GITHUB_OUTPUT:-}" ]; then echo "verdict=$1" >> "$GITHUB_OUTPUT"; fi; return 0; }
          rc=0
          node cloud/priv/static/__preview__/overflow-guard.mjs || rc=$?
          case "$rc" in
            0)
              verdict OK
              echo "Overflow guard: every leg it declared measured clean in a real browser (the roster is printed above)."
              ;;
            2)
              verdict REFUSED
              echo "::error title=Overflow guard REFUSED::The guard refused to measure (exit 2) — an ENVIRONMENT, COVERAGE or INSTRUMENT-INTEGRITY fault, not a layout defect. NO claim is being made about any screen: nothing here says the console is clean and nothing here says it is broken. Fix what the log names: the Chrome binary, Node 22 (node 20 has no global WebSocket and this exits 2 there), a squatting server on the guard's port, a bring-up that outran SERVER_CAP, a defect id the guard has no coverage for, or the guard's own bytes corrupted by a keep-both merge (okLine called with more than one argument — a conflict resolved inside its argument list parses as valid JS while silently swallowing a leg's clean claim; the log names the call). A bring-up refusal is retried a bounded number of times in a fresh profile before this fires — every attempt's Chrome stderr is in the log."
              exit 1
              ;;
            1)
              verdict MEASURED_DEFECT
              echo "::error title=Overflow guard DEFECT::A measured geometry defect in a real browser (exit 1) — an element whose scrollWidth exceeds its clientWidth, a truncated money message, a page scrolling sideways, or a dead rule that lost the cascade. See the ✗ lines above for the leg, the scenario/theme/width cell, the selector and its measured numbers."
              exit 1
              ;;
            *)
              verdict UNINTERPRETABLE
              echo "::error title=Overflow guard UNINTERPRETABLE::overflow-guard.mjs exited ${rc}, which is outside its vocabulary (0 clean / 1 measured defect / 2 refusal). Cannot tell, therefore red."
              exit 1
              ;;
          esac

  console-gate:
    # ── THE AGGREGATOR — the one name that should carry branch protection ──
    #
    # Deliberate shape, every part of it load-bearing:
    #
    #   * NO `strategy.matrix`. The published check-run name is then exactly the
    #     `name:` string below. A matrixed job's name either gains the full
    #     matrix tuple or, if it never STARTED, publishes the literal
    #     uninterpolated `${{ matrix.x }}` — both unusable as a required context
    #     (charter D20). This name is a constant.
    #
    #   * `if: always()`. Without it this job would itself be `skipped` whenever
    #     an upstream failed — publishing a PASSING required context out of a
    #     failed run.
    #
    #   * It ASSERTS on every upstream result instead of echoing them.
    #     `if: always()` buys the right to decide; it does not decide. A probe
    #     aggregator that merely printed `needs.will-fail.result` reported
    #     `success`, and a PR merged through it (charter D19).
    #
    #   * NO job here carries `continue-on-error`. For such a job
    #     `needs.<job>.result` reads `success` EVEN WHEN IT FAILED; including
    #     one would launder the run-level lie straight into the required
    #     context. If a job is worth aggregating it is worth blocking.
    #
    # Allow-set, exhaustively: `success` always; `skipped` ONLY when the
    # dispatcher output that gated that job was literally 'false'. Everything
    # else — `failure`, `cancelled`, an unrecognised value, an empty string —
    # is a FAILURE, including a failure of the dispatcher itself.
    name: Console gate
    if: always()
    needs: [changes, console-unit, cssom-parity, tier-floor-render, overflow-guard, path-escape]
    runs-on: ubuntu-latest
    steps:
      - name: Decide (fail-closed over every upstream result)
        env:
          R_CHANGES: ${{ needs.changes.result }}
          R_UNIT: ${{ needs.console-unit.result }}
          R_CSSOM: ${{ needs.cssom-parity.result }}
          R_TIER: ${{ needs.tier-floor-render.result }}
          R_OVERFLOW: ${{ needs.overflow-guard.result }}
          R_ESCAPE: ${{ needs.path-escape.result }}
          O_CONSOLE: ${{ needs.changes.outputs.console }}
          # ── THE VERDICT CHANNEL (deploy-reliability wave 8) ──────────────
          # Second, INDEPENDENT axis: `result` answers "did it fail", these
          # answer "what KIND of failure". Read ONLY to choose the sentence a
          # human reads; `bad` is computed from `result` alone, so no value or
          # absence of a value here can ever green this context. A job that was
          # skipped or never ran interpolates to the empty string, which the
          # decide() below reports as "no verdict published" — never as OK.
          V_UNIT: ${{ needs.console-unit.outputs.verdict }}
          V_CSSOM: ${{ needs.cssom-parity.outputs.verdict }}
          V_TIER: ${{ needs.tier-floor-render.outputs.verdict }}
          V_OVERFLOW: ${{ needs.overflow-guard.outputs.verdict }}
          # D776: the ratchet is the LAST exit-2-capable job to get a channel.
          V_ESCAPE: ${{ needs.path-escape.outputs.verdict }}
        run: |
          set -euo pipefail

          echo "dispatcher outputs: console='${O_CONSOLE}'"
          echo

          bad=0

          # ── D377 tally: did anything SUBSTANTIVE actually run? ────────────
          # `bad` answers "is anything wrong"; it cannot answer "was anything
          # tested", and until wave 33 nothing did. These two answer it.
          # Only PATH-GATED jobs count: the dispatcher and the ratchet carry the
          # gate value NEVER and run on every head, so they are present in a
          # "nothing ran" run exactly as in a full one and can distinguish
          # nothing.
          dispatched=0
          not_dispatched=""

          # ── D101 wave 8: WHAT KIND of failure, alongside WHETHER ──────────
          # A browser instrument that could not START Chrome and a browser
          # instrument that MEASURED a broken layout both land here as
          # `failure`, and until now this step could only say "a job failed" —
          # so a runner whose Chrome never came up read, at the merge button,
          # exactly like a CSS bug. These two collect the distinction for the
          # closing sentence. They never touch `bad`.
          refusals=""
          measured=""

          # ── D770/D771 — `bad` SAYS THAT something is wrong, never WHICH ───
          # `refusals` and `measured` above name the two verdict-bearing kinds
          # of red. NEITHER is populated on the ordinary paths — a skip whose
          # gate is not 'false', an EMPTY result, an unrecognised one, a
          # failure with no verdict published — and on those the `::error::`
          # (the ONLY line the check-run API carries) named NOTHING at all.
          # This is the set behind `bad`, appended at EVERY `bad=1` site so it
          # can never disagree with the verdict. DERIVED from `${job}` — never
          # a hardcoded name, never a re-print of the step log.
          # Comma-joined, not space-joined: job names contain spaces
          # ("changes (dispatcher)", "path-escape ratchet"), so a space-joined
          # list cannot be read back as a set.
          reds=""

          # decide <job-name> <result> <gate-value> [verdict]
          #   gate-value is the dispatcher output that gated the job, or the
          #   literal string NEVER for jobs that must always run. A skip is
          #   accepted only against a gate-value of exactly 'false'.
          #   verdict is OPTIONAL and ADVISORY: jobs that publish one (the three
          #   browser instruments, and console-unit for its seven exit-2-capable
          #   steps) get their failure NAMED; jobs that do not
          #   pass nothing and are judged exactly as before. It is read on the
          #   failure path ONLY, and cannot reach `bad` from there either.
          decide() {
            local job="$1" result="$2" gate="$3" verdict="${4:-}"
            case "$result" in
              success)
                echo "  ok      ${job}: success"
                ;;
              skipped)
                if [ "$gate" = "false" ]; then
                  echo "  ok      ${job}: skipped — dispatcher said this path set was not touched (gate='false')"
                else
                  echo "  FAIL    ${job}: skipped, but its gate is '${gate}', not 'false'."
                  echo "          A skip here does NOT mean 'not needed'. It means the job never ran —"
                  echo "          most often because an upstream FAILED. Refusing to green a required"
                  echo "          context on it."
                  bad=1
                  reds="${reds:+${reds}, }${job}"
                fi
                ;;
              failure | cancelled)
                echo "  FAIL    ${job}: ${result}"
                # `bad=1` FIRST and unconditionally, so no reading of the
                # verdict below can be mistaken for a place where red is
                # decided. Everything after this line only chooses words.
                bad=1
                reds="${reds:+${reds}, }${job}"
                case "$verdict" in
                  '')
                    : # this job publishes no verdict (or never ran to publish one) — judged on result alone, as before
                    ;;
                  OK)
                    echo "          verdict='OK' but the job FAILED — the instrument said clean and the job"
                    echo "          still died (a later step, a cancellation, a runner fault). Cannot tell,"
                    echo "          therefore red. Read the job log."
                    ;;
                  REFUSED)
                    # WHY THIS NAMES A CAUSE *SET* AND NOT A CAUSE (charter D237,
                    # and D760 for the incident): this arm used to say "the
                    # browser never came up, so NOT ONE rule or element was
                    # measured". That was true of the last refusal its author
                    # saw and false of the next one: on run 31322709682
                    # tier-floor-render parsed 25 preludes, 6 breakpoints and 13
                    # registered views and then refused over a COVERAGE fault in
                    # cloud/priv/static/__preview__ — the console defect this
                    # very sentence denied, while sending the reader to the
                    # runner, the one place the fix was not. exit 2 is ONE code
                    # over MANY causes (cssom-parity.mjs alone has eight message
                    # shapes over ten, and only one of them is bring-up), and
                    # this aggregate measured NONE of them. So it names the kind
                    # of failure — which is all `result` + verdict can support —
                    # and hands the cause back to the instrument that measured it.
                    echo "          verdict=REFUSED — this instrument REFUSED TO MEASURE (exit 2). It made NO"
                    echo "          claim, in either direction, about cloud/priv/static: a refusal is the"
                    echo "          absence of a measurement, NOT a clean bill and NOT an accusation."
                    echo "          WHY it refused is NOT knowable from here. exit 2 is ONE code over MANY"
                    echo "          causes — headless Chrome that never came up after a bounded retry in a"
                    echo "          fresh profile; a missing or unreadable input (e.g. the"
                    echo "          cssom-heads.baseline sidecar, a renamed export, an unparseable route);"
                    echo "          a COVERAGE fault in cloud/priv/static/__preview__ (a breakpoint, screen"
                    echo "          or vocabulary no sweep accounts for); an unrecognised argument or defect"
                    echo "          name; a census under its own floor."
                    echo "          READ THAT JOB'S OWN SUMMARY LINE — the instrument printed the cause by"
                    echo "          name. Do NOT assume the environment: several of those causes are fixed"
                    echo "          in cloud/priv/static and nowhere else."
                    echo "          This context is still RED: a refusal is not a pass."
                    refusals="${refusals} ${job}"
                    ;;
                  MEASURED_DEFECT)
                    echo "          verdict=MEASURED_DEFECT — the browser came up and the instrument measured"
                    echo "          a REAL defect (exit 1). This one IS about the console's own bytes."
                    measured="${measured} ${job}"
                    ;;
                  *)
                    echo "          verdict='${verdict}' — outside the published vocabulary"
                    echo "          (OK / REFUSED / MEASURED_DEFECT). Cannot tell, therefore red."
                    ;;
                esac
                ;;
              '')
                echo "  FAIL    ${job}: EMPTY result — this job is not in the aggregator's needs set,"
                echo "          or the run object is malformed. Cannot tell, therefore red."
                bad=1
                reds="${reds:+${reds}, }${job}"
                ;;
              *)
                echo "  FAIL    ${job}: unrecognised result '${result}'. Cannot tell, therefore red."
                bad=1
                reds="${reds:+${reds}, }${job}"
                ;;
            esac
            # Tally, for the D377 notice at the bottom of this step. NEVER-gated
            # jobs are excluded on purpose (see the declaration above).
            if [ "$gate" != "NEVER" ]; then
              case "$result" in
                success) dispatched=$((dispatched + 1)) ;;
                skipped) not_dispatched="${not_dispatched} ${job}" ;;
              esac
            fi
          }

          # WIRING A JOB IN IS THREE EDITS AND ALL THREE SHIP IN ONE COMMIT
          # (D209): the `needs:` array above, an `R_*` entry in `env:` above,
          # and a `decide` line below. `decide` is invoked BY HAND, once per
          # upstream — there is deliberately NO loop over the needs set, because
          # a loop cannot know each job's gate value. Omitting `needs:` fires
          # the empty-result branch (LOUD); omitting the `env:` entry dies on
          # `set -u` (LOUD); OMITTING THE `decide` LINE IS SILENTLY IGNORED —
          # this gate then greens over a job it never read. So the review
          # instruction is a COUNT, independently re-derived, not a reading:
          # `decide` calls must equal the length of `needs:`. Today: 6 and 6.
          # (The D36 emitter in scripts/console-path-escape-check.test.sh walks
          # that whole chain per job and is mutation-proven in four directions.)
          #
          # The dispatcher itself may never skip: without it there are no gate
          # values, so nothing downstream can be judged. Same for the ratchet,
          # which is deliberately unfiltered.
          decide "changes (dispatcher)"    "${R_CHANGES}" "NEVER"
          # `:-` on the VERDICT arguments ONLY, never on an `R_*`: an unbound
          # R_* must keep dying under `set -u` (that LOUD death is how D209's
          # missing-`env:` wiring mistake is caught). A verdict is advisory, and
          # scripts/console-path-escape-check.test.sh extracts and executes this
          # very step body supplying only the R_*/O_* environment GitHub had
          # before this channel existed — so an unset verdict must mean "none
          # published", not a crash.
          decide "path-escape ratchet"     "${R_ESCAPE}"  "NEVER"          "${V_ESCAPE:-}"
          decide "console-unit"            "${R_UNIT}"    "${O_CONSOLE}"   "${V_UNIT:-}"
          decide "cssom-parity"            "${R_CSSOM}"   "${O_CONSOLE}"   "${V_CSSOM:-}"
          decide "tier-floor-render"       "${R_TIER}"    "${O_CONSOLE}"   "${V_TIER:-}"
          decide "overflow-guard"          "${R_OVERFLOW}"  "${O_CONSOLE}" "${V_OVERFLOW:-}"

          echo
          if [ "$bad" -ne 0 ]; then
            # ONE `exit 1`, reached from every red path — the sentence differs,
            # the verdict never does. `refusals` and `measured` are read AFTER
            # `bad` has already decided; there is deliberately no arm here in
            # which a REFUSED verdict can reach `exit 0`.
            if [ -n "${refusals}" ]; then
              # SAME RULE AS THE REFUSED ARM ABOVE, AND FOR THE SAME MEASURED
              # REASON (D760): this sentence used to promise the reader an
              # ENVIRONMENT fault and a Chrome that never started. It is a
              # promise this step cannot keep — it reads one word, `REFUSED`,
              # and never opens the refusing job's log. Naming the cause SET is
              # the strongest honest claim available here; the cause itself
              # belongs to the instrument that measured it.
              echo "::error title=Console gate RED — an instrument REFUSED TO MEASURE::RED because at least one upstream job is not in the allow-set.%0AREFUSED TO MEASURE (exit 2):${refusals}%0AA refusal is the ABSENCE of a measurement: those instruments made no claim about cloud/priv/static in either direction. It does NOT follow that the environment is at fault. exit 2 is ONE code over MANY causes — headless Chrome that never came up after a bounded retry in a fresh profile; a missing or unreadable input (e.g. the cssom-heads.baseline sidecar); a COVERAGE fault in cloud/priv/static/__preview__ (a breakpoint, screen or vocabulary no sweep accounts for); an unrecognised argument or defect name; a census under its own floor. This aggregate measured none of them and will not guess.%0AREAD THE REFUSING JOB'S OWN SUMMARY LINE — it printed the cause by name, and that cause may well live in the console's own bytes rather than on the runner.%0AMeasured defects (exit 1) in this run:${measured:- none}%0AThis context is RED on purpose: a refusal is not a pass, and only a fix or a re-run can turn it green.%0ANOT IN THE ALLOW-SET: ${reds}"
            else
              # THE ARM #11377 LEFT NAMING NOTHING (D770). This `else` is not a
              # rare corner: it fires on EVERY red where no upstream published
              # a REFUSED verdict — a plain MEASURED_DEFECT run, a skip whose
              # gate is not 'false', an EMPTY result, a failure from a job with
              # no verdict channel at all. `measured` was already collected
              # above and then thrown away on this exact path, so a reader of a
              # real CSS defect got the same contentless sentence as a reader
              # of a malformed `needs:` set. Both facts are named here now.
              echo "::error::Console gate: at least one upstream job is not in the allow-set (see above). This is the required context; it is RED on purpose.%0ANOT IN THE ALLOW-SET: ${reds}%0AMeasured defects (exit 1) in this run:${measured:- none}"
            fi
            exit 1
          fi

          # ── D377/D378 — SAY IT WHERE A PERSON AND AN API CAN READ IT ──────
          # Measured on api-only PR #9529 (head 48d960092): this context read
          # `Console gate | success | ann=0 | summary=null` with ALL FOUR of its
          # substantive jobs skipped — byte-identical to a run where the console
          # harness passed. $GITHUB_STEP_SUMMARY does not reach the check-run
          # API (0 of 32 check-runs returned a non-null summary), and renaming
          # this frozen required context would deadlock main; a bare ::notice::
          # does reach it (probe/elixir-gate-annotation, run 31055317124).
          # ONE notice, never one per job — GitHub caps annotations at 10 per
          # level per step and truncates the rest silently.
          if [ "$dispatched" -eq 0 ]; then
            echo "::notice title=Console gate: green — nothing ran::NOTHING CONSOLE RAN on this head.%0AConsole gate is green because this diff touched none of its declared path sets, NOT because anything was tested.%0ANot dispatched:${not_dispatched}%0AGreen here means NOT APPLICABLE to this diff. Read it as 'no Console job executed', never as 'the Console harness passed'."
          fi
          echo "Console gate: every upstream job either succeeded or was legitimately not dispatched."

  report-main-failure:
    # ── THE RED THAT REACHES A HUMAN ─────────────────────────────────────────
    #
    # `Console gate` went RED on NINE main pushes in the 2026-08-05T19:52Z ..
    # 2026-08-07T05:26Z window — six of them consecutively, on `CSSOM parity`
    # and `Overflow guard` — and told nobody. A post-merge red X is only visible
    # to whoever thinks to open the Actions tab; main was broken for ~46 minutes,
    # self-healed, and no record of it exists anywhere. `gh issue list --state
    # all --search 'CI failure in:title'` returns exactly two issues in the
    # entire repository's history, and neither is one of the nine.
    #
    # This job is the record. Everything about its shape is load-bearing:
    #
    #   * `needs: [console-gate]` — it reports on the AGGREGATOR'S verdict, the
    #     same name branch protection reads, not on any single leaf.
    #
    #   * `if: failure() && …` — `failure()` is true when an ancestor FAILED and
    #     is FALSE for `cancelled`. That is the wanted behaviour, not an
    #     accident: a cancelled main-push run (queue-depth-1 displacement, the
    #     CADENCE class of charter D115) executes zero substantive jobs and has
    #     nothing to report; filing an issue for it would be noise that trains
    #     people to ignore the real ones.
    #
    #   * `github.ref == 'refs/heads/main'` — a failing PR already has a human
    #     attached to it. Only main's post-merge red is ownerless.
    #
    #   * `permissions:` is JOB-LEVEL, and must stay that way. The repository's
    #     `default_workflow_permissions` is "read", so the issue POST 403s
    #     without an explicit `issues: write` — but a WORKFLOW-level block would
    #     silently re-scope the token of every other job in this file. The grant
    #     lives here, on the one job that needs it, and nowhere else.
    #
    # It cannot warn-and-pass: scripts/file-ci-failure-issue.sh exits 1 whenever
    # the alert was not delivered (empty token, non-2xx API, unparseable body).
    # A red here means "main is broken AND nobody was told" — worse than
    # the failure it was trying to report, so it is worth its own red. It never
    # affects `Console gate`, which has already published its verdict by then.
    name: Report main-push failure to a human
    needs: [console-gate]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # the ONLY reason this job carries a permissions block
    steps:
      - uses: actions/checkout@v4

      - name: File (or update) the CI failure issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_FAILURE_KEY: console-harness-main
          CI_FAILURE_DETAIL: |
            The `Console gate` required context is RED on a push to `main`.
            This is POST-MERGE: the breakage is already on the default branch,
            and every PR branched from this tip inherits it.

            Read the aggregator's "Decide (fail-closed over every upstream
            result)" step first — it names which job failed AND, for the browser
            instruments, which KIND of failure it was:

              * a MEASURED defect (exit 1) accuses `cloud/priv/static` — fix the
                CSS/markup, or revert the merge that introduced it;
              * an environment REFUSAL (exit 2) means headless Chrome never
                started after a bounded retry — nothing was measured, so nothing
                is accused; re-run the job.

            This issue is idempotent per key: an ongoing failure appends a
            comment rather than opening a new issue. CLOSE IT once main is green
            again — the next main-push failure opens a fresh one.
        run: bash scripts/file-ci-failure-issue.sh
