# Studio desk-instrument self-tests — the pure `node --test` suites beside
# scripts/studio-desk-measure.mjs and scripts/measurements/check-prediction.mjs.
#
# Why this file exists (task-b7ed25dac17d6229, 2026-09-06): every one of these
# suites was hand-run only — `grep -rn studio-desk .github/workflows` returned
# nothing — so 60+ passing tests read as coverage while no job ever executed
# them. The campaign rule since 10:08Z the same day: a new test file is wired
# in the SAME PR that adds it, and the runner's glob is proven to reach it.
#
# Dep-free by construction: no npm install, no browser, no ssh, no token. The
# instrument resolves Playwright lazily (BP_PLAYWRIGHT_FROM), so importing it
# for its pure exports costs nothing. Every suite here is a pure-function or
# spawn test; the browser-coupled __studio-wide-deletion-diff.test.mjs is
# deliberately NOT in the glob (it is an owner-run check, dated in its header).
#
# ADVISORY, not required: this workflow is paths-filtered, and a paths-filtered
# workflow emits no check run on a non-matching PR, so it can never be made
# required without deadlocking every unrelated PR (docs/ops/merge-gates.md).
name: Studio instrument selftests

on:
  pull_request:
    paths:
      - "scripts/studio-desk-*.mjs"
      - "scripts/measurements/**"
      - "scripts/node-test-floor.mjs"
      - ".github/workflows/studio-instrument-selftests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/studio-desk-*.mjs"
      - "scripts/measurements/**"
      - "scripts/node-test-floor.mjs"
      - ".github/workflows/studio-instrument-selftests.yml"

concurrency:
  # One group per PUSH SHA on main, per REF everywhere else — the shape every
  # main-triggered workflow carries (elixir.yml:72) and the one
  # scripts/main-run-concurrency-check.sh keys on. GitHub keeps ONE
  # not-yet-started run per group, so a shared main group lets each merge evict
  # the pending main run (measured 2026-09-02: 37 of 40 main runs cancelled).
  # The previous stanza keyed PRs on the PR number and main on the sha, which is
  # semantically close but not the canonical expression, and its
  # cancel-in-progress was `github.event_name == 'pull_request'` — the gate
  # accepts only the literal false or the never-cancel-main guard below.
  # (Shell harnesses red on main from #16423 until this landed; task-99bb8ca0d64618b1.)
  group: studio-instrument-selftests-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  selftests:
    name: Studio instrument selftests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: scripts/node-test-floor.mjs imports globSync from node:fs.
          node-version: "22"

      # Through node-test-floor.mjs, never bare `node --test`: a bare run exits 0
      # on a zero-match glob, a silently dropped path, or a file that registers
      # no tests. The floor is a FILE count committed here on purpose so it
      # cannot shrink with the tree — raise it in the PR that adds a suite,
      # lower it only deliberately in the PR that removes one.
      - name: Run the suites through the floor
        run: |
          set -euo pipefail
          node scripts/node-test-floor.mjs --floor 7 \
            'scripts/studio-desk-*.test.mjs' \
            'scripts/measurements/*.test.mjs'
