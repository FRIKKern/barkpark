name: aesthetics-guard

# The never-worse gate, pointed at FILEBASE aesthetics (Cody's Bloat + Aesthetics
# dims — tooling/aesthetics/aesthetics.mjs).
#
# Runs the filebase critic on the PR head AND on the base-branch tip, then diffs the
# STRUCTURAL findings (tooling/aesthetics/compare.mjs). It flags — advisory only —
# when a PR INTRODUCES new root source clutter, a new dead doc, a new removable
# tracked build-output artifact, a new yagni-orphan, or drops Bloat vs the base.
# Pre-existing mess is grandfathered: a PR is never penalized for debt it did not
# create, so a clean PR raises NO alarm.
#
# DETERMINISM / bp: the critic reads task data from `bp task ls` when bp is on
# PATH, else falls back to the snapshot/empty tasks. bp is ABSENT in CI, so the
# TASK signal (junk / unscoped-open tasks) is NOT reliable here. The regression
# check therefore keys ONLY on the STRUCTURAL findings, which are deterministic
# from `git ls-files` + fs — compare.mjs excludes the dead-task signal entirely.
#
# ADVISORY (continue-on-error: true), matching the architecture boundary gate and
# ci.yml's format gate — it reports the regression to the PR summary and emits a
# ::warning:: but NEVER blocks the merge. Flip continue-on-error to false only once
# the signal has proven stable on real PRs.

on:
  push:
    branches: [main]   # establish/refresh the baseline on main
    paths:
      - "tooling/aesthetics/**"
      - ".github/workflows/aesthetics-guard.yml"
  pull_request:
    # No paths filter: ANY PR can introduce root clutter / dead docs / build-output,
    # so the structural guard must see every PR. It is cheap (pure Node, no toolchains).

permissions:
  contents: read

concurrency:
  group: aesthetics-guard-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  aesthetics-guard:
    name: Filebase aesthetics gate (advisory)
    runs-on: ubuntu-latest
    # Advisory — report, don't block. Matches architecture.yml / ci.yml's precedent.
    continue-on-error: true

    steps:
      # PINNED TO THE PR HEAD SHA, not the default merge ref (charter D34).
      # The default pull_request checkout is refs/pull/N/merge — this PR's head
      # already merged with the current base tip — so the "PR head report" below
      # was scoring a tree containing everyone else's landed changes, and this
      # PR got blamed for root clutter, dead docs and build-output it did not
      # introduce. Same defect as reland-check.yml's inflated changed-file set,
      # manifesting through the critic's tree instead of through a diff.
      # The fallback matters: this workflow ALSO runs on push:main, where there
      # is no pull_request payload, and `github.sha` is the pushed commit.
      # `$BASE_SHA` is fetched explicitly by the base step below, so pinning the
      # head does not put the worktree base out of reach. ONE checkout here;
      # nothing else moves.
      - name: Checkout (PR head, full history to reach the base ref)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0   # need history to reach origin/<base> for the worktree diff

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── PR head report ──────────────────────────────────────────────────────
      # bp is absent here → the critic uses its graceful fallback (snapshot/empty
      # tasks). The TASK signal is therefore not trusted; only the STRUCTURAL
      # findings below are diffed.
      - name: Run filebase critic on PR head
        run: |
          node tooling/aesthetics/aesthetics.mjs
          cp tooling/aesthetics/aesthetics-report.json /tmp/head-report.json

      # ── base-branch report ───────────────────────────────────────────────────
      # Resolve the base ref: the PR's base branch on a pull_request, else the
      # previous commit on a push to main. Add a clean worktree at that ref and run
      # the same critic there, so the diff compares like-for-like trees.
      - name: Run filebase critic on the base-branch tip
        id: base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          rm -rf /tmp/base-tree
          git worktree add --detach /tmp/base-tree "$BASE_SHA"
          # Run the critic inside the base worktree; it writes its report next to itself.
          ( cd /tmp/base-tree && node tooling/aesthetics/aesthetics.mjs )
          cp /tmp/base-tree/tooling/aesthetics/aesthetics-report.json /tmp/base-report.json
          git worktree remove --force /tmp/base-tree

      # ── regression diff (structural-only) + step summary ────────────────────
      - name: Compare + post summary
        id: compare
        run: |
          set -euo pipefail
          node tooling/aesthetics/compare.mjs /tmp/base-report.json /tmp/head-report.json | tee /tmp/aesthetics-summary.md
          # Strip the machine line out of the human summary before posting. `|| true`:
          # grep -v exits 1 if it filters out every line, which would abort under
          # `set -o pipefail` — a non-match here is not an error.
          grep -v '^AESTHETICS_GUARD_FLAGGED=' /tmp/aesthetics-summary.md >> "$GITHUB_STEP_SUMMARY" || true
          if grep -q '^AESTHETICS_GUARD_FLAGGED=1' /tmp/aesthetics-summary.md; then
            echo "flagged=1" >> "$GITHUB_OUTPUT"
          else
            echo "flagged=0" >> "$GITHUB_OUTPUT"
          fi

      # ADVISORY surfacing: a ::warning:: annotation (visible on the PR) when the
      # PR introduces new structural mess. This does NOT fail the job — the step
      # exits 0 and the job carries continue-on-error anyway.
      - name: Emit advisory warning (non-blocking)
        if: steps.compare.outputs.flagged == '1'
        run: |
          echo "::warning title=Filebase aesthetics (advisory)::This PR introduces new structural filebase mess (new root clutter / dead doc / removable build-output, or a Bloat drop) vs the base branch. Advisory only — see the job summary. Does NOT block the merge."
