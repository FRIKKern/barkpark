name: ci

# Lighthouse CI against the Next.js demo at web/ (Vercel-deployed).
#
# Phase 8 slice 8.0 originally targeted apps/demo, which is being retired
# by PR #60 (web/scaffold-1) in favour of a standalone web/ Next.js app.
# Task #34 repoints this workflow at web/ and adds a paths filter so the
# job only runs on changes that can plausibly affect Lighthouse scores —
# unrelated API/Studio/docs PRs no longer pay the ~2 minute cost.
#
# Still fail-soft (continue-on-error: true) — scores are runner-noise
# sensitive and lighthouserc.json assertions are `warn`. A follow-up can
# tighten to `error` once baselines stabilise on web/.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "lighthouserc.json"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "lighthouserc.json"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # Cancel superseded PR runs, but NEVER cancel main: fast push cadence
  # otherwise starves the suite (2026-06-10: 19 consecutive main runs
  # cancelled, zero completions all day). Queued main runs collapse to one.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lighthouse:
    name: Lighthouse CI — web/
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect web app presence
        id: detect
        run: |
          if [ -d web ] && [ -f web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip — web/ not present
        if: steps.detect.outputs.present != 'true'
        run: echo "web/ not found — Lighthouse job skipped."

      - name: Install pnpm
        if: steps.detect.outputs.present == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node (pnpm store cached on the lockfile)
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # cache: pnpm needs pnpm on PATH first, hence pnpm/action-setup runs above
          cache: pnpm
          cache-dependency-path: |
            js/pnpm-lock.yaml
            web/pnpm-lock.yaml

      # web's `@barkpark/core` is a file: link whose dist must exist before the
      # Next build can resolve it. Without this the build errors ("Can't resolve
      # '@barkpark/core'") and Lighthouse never runs — it had been silently dead
      # (continue-on-error). Build core first, then install web/ so the link
      # points at the built package.
      - name: Build @barkpark/core (web's linked dependency)
        if: steps.detect.outputs.present == 'true'
        working-directory: js
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @barkpark/core build

      # web's canonical PortableDoc reader is a `file:../js/packages/react` link
      # (document-detail.tsx / paper-editor-doc.tsx), so its dist must exist for
      # the Next build to resolve `@barkpark/react`. Built AFTER core because
      # react's DTS build imports core's declarations.
      - name: Build @barkpark/react (web's linked dependency)
        if: steps.detect.outputs.present == 'true'
        working-directory: js
        run: pnpm --filter @barkpark/react build

      - name: Install web/ deps
        if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build web/
        if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: pnpm run build

      - name: Start web/ (background)
        if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: |
          pnpm run start &
          echo $! > /tmp/web.pid
          # Wait for server to respond on :3000
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
              echo "web server is up"
              exit 0
            fi
            sleep 2
          done
          echo "web server did not start within 120s"
          exit 1

      - name: Run Lighthouse CI
        if: steps.detect.outputs.present == 'true'
        run: pnpm dlx @lhci/cli@latest autorun --config=./lighthouserc.json

      - name: Stop web/
        if: always() && steps.detect.outputs.present == 'true'
        run: |
          if [ -f /tmp/web.pid ]; then
            kill "$(cat /tmp/web.pid)" 2>/dev/null || true
          fi

      - name: Upload Lighthouse artifact
        if: always() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: |
            .lighthouseci/
            lhci_reports/
          if-no-files-found: ignore
          retention-days: 14

  # Real gate (NOT continue-on-error): typecheck + the node --test unit suite +
  # lint for web/. Before this, web/'s 100+ pure-logic tests and its types only
  # ran locally / at Vercel build — a broken test or type error could land on
  # main unnoticed. Node 22 is required: the suite is `node --test` over `.ts`
  # files, which relies on type-stripping (default-on since Node 22.18).
  web-checks:
    name: web/ typecheck + unit tests + lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect web app presence
        id: detect
        run: |
          if [ -d web ] && [ -f web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip — web/ not present
        if: steps.detect.outputs.present != 'true'
        run: echo "web/ not found — web-checks skipped."

      - name: Install pnpm
        if: steps.detect.outputs.present == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node (pnpm store cached on the lockfile)
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # cache: pnpm needs pnpm on PATH first, hence pnpm/action-setup runs above
          cache: pnpm
          cache-dependency-path: |
            js/pnpm-lock.yaml
            web/pnpm-lock.yaml

      # web depends on `@barkpark/core` via a `file:../js/packages/core` link,
      # whose dist must exist for the app to typecheck / for core-importing test
      # modules (e.g. lib/papers.ts) to load. Build it first from the js/
      # workspace, then install web/ so the link resolves to the built package.
      - name: Build @barkpark/core (web's linked dependency)
        if: steps.detect.outputs.present == 'true'
        working-directory: js
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @barkpark/core build

      # web's canonical PortableDoc reader (`@barkpark/react`) is a file: link
      # whose dist must exist for the app to typecheck and for the renderer-import
      # test modules (section-grid-render / component-golden-parity) to load
      # `renderPortableDocument`. Built AFTER core (react's DTS imports core).
      - name: Build @barkpark/react (web's linked dependency)
        if: steps.detect.outputs.present == 'true'
        working-directory: js
        run: pnpm --filter @barkpark/react build

      - name: Install web/ deps
        if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: pnpm run typecheck

      - name: Unit tests
        if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: pnpm run test

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        working-directory: web
        run: pnpm run lint
