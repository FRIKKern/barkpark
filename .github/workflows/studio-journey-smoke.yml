name: studio-journey-smoke

# Browser-level coverage for the Studio create → type → save journey (studio
# space-priority desk, wave 18). The owner reported that the desk buttons looked
# inert and that he could not add things. Wave 17 found three real defects on
# that seam and fixed them; the confirmation was then a hand-driven walk written
# down as prose, and this epic has SIX logged overturns of that shape. So the
# confirmation is a committed instrument, and this is where it runs unattended.
#
# ─────────────────────────────────────────────────────────────────────────────
#  READ THIS BEFORE ADDING THIS WORKFLOW TO ANY REQUIRED-CHECK LIST
# ─────────────────────────────────────────────────────────────────────────────
# NEITHER JOB HERE GATES A MERGE, AND NEITHER CAN BE MADE TO (charter D241):
#
#   1. `tooling/**` is in neither ELIXIR_COMPILE_PATHS nor
#      ELIXIR_TEST_ONLY_PATHS, so a tooling-only PR gets mix-test SKIPPED
#      against a gate value of literally `false`, the aggregator accepts that as
#      legitimate, and the required "Elixir gate" reports GREEN having run
#      nothing. A green on such a PR says nothing about this workflow.
#
#   2. required-checks-generate.sh stage S4 excludes BY NAME every check that
#      comes from a paths-filtered `pull_request` workflow. The self-test job
#      below carries a paths filter, so it is structurally unpromotable.
#
# NOTE for anyone comparing this file with .github/workflows/search-starter-smoke.yml:
# that file's comment calls its paths-filtered check "safe to make a required
# check". THAT SENTENCE IS FALSE and is contradicted twice in-repo by the two
# facts above. It is not repeated here.
#
# What these jobs ARE: a rot alarm and an instrument check. Their OUTPUT is the
# signal; their exit codes gate nothing.
#
# ─────────────────────────────────────────────────────────────────────────────
#  TWO JOBS, TWO DIFFERENT QUESTIONS
# ─────────────────────────────────────────────────────────────────────────────
#   harness-self-test  "is the instrument itself sound?" Offline, zero network,
#     zero credentials, zero npm. Boots headless Chrome against two in-process
#     fixtures and asserts the harness goes green on the healthy one and RED on
#     the rotten one — whose canvas upgrades with a truthy `_editor` and never
#     populates `blocks`, the exact trap that burned three verifiers on this
#     seam. A check whose red has never been demonstrated is not a check.
#
#   live-journey       "can a person add a thing in the deployed Studio right
#     now?" REPORT MODE, scheduled + manually dispatchable, never on a PR. It
#     reaches a live host, so it could never gate a diff even if the two facts
#     above did not already settle it: a deploy outage is not a property of
#     anybody's changes.
#
# ─────────────────────────────────────────────────────────────────────────────
#  2026-09-15 — WHY THE LIVE JOB IS NO LONGER ON THE CRON (task-2c762aa7dfca5bd8)
# ─────────────────────────────────────────────────────────────────────────────
# THE SCHEDULED LANE HAD NEVER SUCCEEDED ONCE. Measured against this workflow's
# own run history on 2026-09-15: `event=schedule`, status=completed, total_count
# 47, received 47, conclusion failure 47, success 0 — every scheduled run from
# 2026-07-30 to 2026-09-14. Every one of them died in `live-journey` at the
# harness's credential GUARD, before walking anything, so the deployed Studio
# journey was UNMEASURED for six weeks while a red was emitted daily.
#
# AND THE SCHEDULED RUN MEASURED NOTHING AT ALL, which is the worse half.
# `harness-self-test` used to carry `if: github.event_name != 'schedule'`, so on
# the cron the self-test was SKIPPED and the live arm GUARD-failed: run
# 34848686219 had jobs total_count=2, one failure and one skipped, and ZERO
# assertions executed. A SKIPPED JOB REPORTS SUCCESS and must never be read as
# coverage.
#
# A NAIVE COUNT OVER THIS WORKFLOW WILL TELL YOU THE OPPOSITE. Over the last 50
# runs of ALL events it reads success=38 — those are `harness-self-test` on push
# and pull_request, which is exactly the arm the cron skipped. THE GREEN RUNS AND
# THE RED RUNS MEASURE DIFFERENT THINGS. Scope every count of this workflow BY
# EVENT or the arm that works will vouch for the arm that does not. The reader
# that does that split for every cron'd workflow in the tree is
# `scripts/scheduled-arm-health.sh`.
#
# THE CAUSE IS A MISSING CREDENTIAL, NOT A BUG. `JOURNEY_TOKEN` comes from
# `secrets.GUERRILLA_ADMIN_TOKEN`, and that secret DOES NOT EXIST on this
# repository (Actions secrets on 2026-09-15, total_count 8:
# BARKPARK_INGEST_TOKEN, BARKPARK_TASK_TOKEN, BREAKGLASS_TOKEN, CP_HOST,
# DEPLOY_SSH_KEY, GUERRILLA_HOST, HETZNER_DNS_TOKEN, NPM_TOKEN). An unset secret
# interpolates to the empty string, so the env pair arrives half-set and the
# harness GUARDs, correctly.
#
# THE GUARD IS NOT THE DEFECT AND MUST NOT BE SOFTENED. `readServer()` in
# tooling/studio-journey/journey.mjs refuses an env pair that is half-set, in
# those words: "This is an ENVIRONMENT or INVOCATION failure. A transport failure
# is never a product fact." Making a missing credential report as a journey
# failure is the one change here that would make things worse.
#
# THE CHOICE MADE, OF THE THREE AVAILABLE, AND WHY. (a) take the live arm off
# the cron until the credential exists; (b) let the live job run on the cron and
# SKIP green with a "not configured" notice; (c) the owner supplies
# GUERRILLA_ADMIN_TOKEN and the journey actually walks.
#
#   (c) IS THE RIGHT ANSWER AND IS NOT A BUILDER'S TO MAKE. Whether an admin
#   token for a live deployment should exist, and with what scope, is an owner
#   decision about credentials. Nothing here creates, rotates or guesses one.
#
#   (b) WAS REJECTED. A daily job that runs, asserts nothing about the deployment
#   and reports SUCCESS is a vacuous green — the same disease as the skipped
#   self-test above, wearing a friendlier colour. This repo has a standing
#   objection to exactly that shape.
#
#   (a) IS WHAT IS IMPLEMENTED. `live-journey` is workflow_dispatch ONLY, so it
#   makes no daily claim it cannot support; the cron now runs `harness-self-test`
#   instead, which asserts 134 things offline and CAN go red. The gap the cron no
#   longer papers over is stated out loud on every scheduled run by the
#   "Deployed-journey coverage" step below, and by scheduled-arm-health.sh.
#
# TO UNDO THIS once GUERRILLA_ADMIN_TOKEN exists: put
# `github.event_name == 'schedule' ||` back at the front of live-journey's `if:`
# and delete the coverage-notice step. One line each, and this block explains
# both.
#
# The strict live run (no --report, exit 1 on any non-PASS LEG A beat) is
# deliberately NOT wired here. That run is the wave-seal evidence, taken by hand
# after a redeploy; scheduling it would red the repo daily for as long as any
# known defect is knowingly in flight, and a gate that cries wolf gets disabled.
#
# Cost reference: the comparable lane (search-starter-smoke live-journey) runs
# 1m07s–2m16s on system Chrome with no npm install. This one is in the same
# range; LEG A's hydration ceiling makes a fully-failing run the slow case.

on:
  # The paths list names EVERY file these jobs execute (charter D26): the
  # harness, the wrapper the jobs actually invoke, and this workflow.
  push:
    branches: [main]
    paths:
      - "tooling/studio-journey/**"
      - "scripts/studio-journey-smoke.sh"
      - ".github/workflows/studio-journey-smoke.yml"
  pull_request:
    paths:
      - "tooling/studio-journey/**"
      - "scripts/studio-journey-smoke.sh"
      - ".github/workflows/studio-journey-smoke.yml"
  schedule:
    # 06:40 UTC daily — twenty minutes after the search-starter lane, so the two
    # browser jobs do not contend for the same runner minute.
    - cron: "40 6 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: "Barkpark base URL to walk (report mode). Needs JOURNEY_TOKEN in secrets."
        required: false
        default: "https://guerrilla.barkpark.cloud"

concurrency:
  group: studio-journey-smoke-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  harness-self-test:
    name: Studio journey — self-test (fixtures, no network)
    # RUNS ON EVERY EVENT, THE CRON INCLUDED. It used to carry
    # `if: github.event_name != 'schedule'`, reasoning that there is no diff to
    # certify at 06:40. That reasoning was sound only while the live job below
    # was measuring something on the cron, and it never was (see the 2026-09-15
    # block in the header). With the self-test skipped and the live arm dying at
    # a GUARD, the scheduled run executed ZERO assertions for six weeks.
    #
    # There is still no diff at 06:40 — but there is a runner image, a Chrome
    # build and a Node build that all move underneath this harness, and the
    # self-test is the only thing in the tree that can say the instrument still
    # works. That is a real daily question, and its answer is a real red.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22: the harness speaks CDP over a bare global WebSocket, stable by
      # default only from 22. On an older build it refuses on the GUARD path
      # (exit 2) rather than reporting an environment failure as a product one.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # No setup-chrome action: ubuntu-latest already ships Google Chrome and
      # findChrome() honours CHROME first. Pinning the path explicitly means a
      # future runner image that drops the binary exits 2 as a GUARD naming what
      # is missing, instead of silently falling through to another browser.
      # The harness prints `SELF-TEST PASS — <N> assertions executed (floor 40)`
      # and refuses to print PASS below that floor: a green produced by a run
      # that compared almost nothing is the exact shape this lane had. N is in
      # the step log and is the answer to "did the scheduled run measure
      # anything?"
      # THE SWEEP PREDICATE, OFFLINE AND WITHOUT A BROWSER
      # (task-d582be9d064f35dc). journey.mjs DELETES documents on a live host,
      # and until this step the only thing asserting the predicate that decides
      # which ones was the browser self-test below — which needs Chrome, takes
      # ninety seconds, and for the whole life of the harness could not
      # reproduce the defect at all, because its fixture never gave a draft a
      # title and the real server does. This runs first and it runs cheap: if it
      # reds, the predicate is wrong and nothing downstream is worth reading.
      # node-test-floor.mjs rather than bare `node --test`, because a zero-match
      # glob is an exit-0 green.
      - name: Sweep predicate (offline, both directions)
        run: node scripts/node-test-floor.mjs --floor 1 tooling/studio-journey/sweep-predicate.test.mjs

      - name: Self-test (healthy fixture green, rotten fixture red)
        env:
          CHROME: /usr/bin/google-chrome
        run: scripts/studio-journey-smoke.sh self-test

      # THE GAP, SAID OUT LOUD, ON EVERY SCHEDULED RUN. Taking the live arm off
      # the cron removes a daily red that measured nothing; it must not also
      # remove the knowledge that the deployed Studio journey is uncovered. This
      # step writes that into the run summary and raises a warning annotation, so
      # the absence has a daily artefact instead of being the quiet default it
      # was for six weeks.
      #
      # It is deliberately NOT a failure: this job's red means "the instrument is
      # broken", and overloading it with "a credential is missing" would make the
      # one signal unreadable. It is deliberately not a `secrets` test either —
      # the `secrets` context is not available in any `if:` expression, and this
      # step makes no claim about the secret's current value, only about the fact
      # that the cron does not walk the deployment.
      - name: Deployed-journey coverage (scheduled runs only)
        if: github.event_name == 'schedule'
        run: |
          {
            echo "### Deployed Studio journey: NOT COVERED BY THIS SCHEDULED RUN"
            echo
            echo "This cron runs \`harness-self-test\` only. The \`live-journey\` job that walks"
            echo "<https://guerrilla.barkpark.cloud> is \`workflow_dispatch\` only, because the"
            echo "credential it needs (\`GUERRILLA_ADMIN_TOKEN\`) does not exist on this repository."
            echo "See the 2026-09-15 block at the top of \`.github/workflows/studio-journey-smoke.yml\`."
            echo
            echo "**What this green does and does not say.** It says the browser harness still"
            echo "behaves as specified against its two offline fixtures. It says NOTHING about the"
            echo "deployed Studio, which has been unmeasured by CI since 2026-07-30."
            echo
            echo "**To close the gap:** the owner adds \`GUERRILLA_ADMIN_TOKEN\`, then the live job"
            echo "goes back on the cron (one line, documented in the header)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Deployed Studio journey is not covered by CI::live-journey is workflow_dispatch only — GUERRILLA_ADMIN_TOKEN does not exist on this repository. The deployed Studio journey has been unmeasured since 2026-07-30. See the workflow header."

  live-journey:
    name: Studio journey — deployed (report mode, gates nothing)
    # DISPATCH ONLY, NOT SCHEDULED — 2026-09-15, task-2c762aa7dfca5bd8. This
    # condition used to read `github.event_name == 'schedule' ||
    # github.event_name == 'workflow_dispatch'` and produced 47 consecutive
    # scheduled failures, none of which walked a single beat, because
    # GUERRILLA_ADMIN_TOKEN does not exist. The full reasoning, the measurement
    # and the one-line undo are in the 2026-09-15 block at the top of this file.
    #
    # Dispatching it by hand still works exactly as before and is the intended
    # route for a post-deploy check — but only from a machine or a repository
    # that actually has the credential, and the GUARD will say so if it does not.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # REPORT MODE. Exit 0 even when LEG A beats fail — read the step's log, not
      # its exit code. `|| true` is NOT used here and must not be added: the
      # harness already separates a product failure (reported and swallowed in
      # this mode) from an ENVIRONMENT failure (exit 2), and `|| true` would
      # erase the second, turning "no credentials" or "Chrome is missing" into a
      # permanent silent green.
      #
      # JOURNEY_TOKEN is an admin token for the target host; there is no
      # ~/.config/barkpark on a runner. Without it the harness exits 2 as a
      # GUARD naming the missing credential — which is the correct outcome, not
      # a product verdict, and is why this step is not allowed to swallow it.
      - name: Deployed journey report
        env:
          CHROME: /usr/bin/google-chrome
          JOURNEY_BASE: ${{ github.event.inputs.base || 'https://guerrilla.barkpark.cloud' }}
          JOURNEY_TOKEN: ${{ secrets.GUERRILLA_ADMIN_TOKEN }}
        run: scripts/studio-journey-smoke.sh report
