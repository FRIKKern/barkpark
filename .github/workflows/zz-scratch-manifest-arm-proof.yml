name: zz scratch manifest arm proof

# THROWAWAY. Exists for exactly two commits, to prove that the pull_request arm
# added in this PR makes a NEW main-push workflow red the PR that adds it.
# Removed in the next commit on this branch. Never merged.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zz-scratch-manifest-arm-proof-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  noop:
    name: zz scratch noop
    runs-on: ubuntu-latest
    steps:
      - run: "true"
