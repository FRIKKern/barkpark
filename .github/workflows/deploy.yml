name: Deploy (production)

# Continuous deployment: a merge to main updates the affected production host.
# Path-filtered so a docs-only commit never rebuilds a server. The deploy scripts
# are build-before-swap + health-check + auto-rollback, so a bad build never takes
# prod down. Runs AFTER merge — CI/merge-gates already vetted the change.
on:
  push:
    branches: [main]
    paths:
      - "cloud/**"
      - "api/**"
      - "internal/**"
      - "cmd/**"
      - "deploy/**"
      # Shipped starter templates: the box builds sites FROM these trees, so a
      # templates-only merge (e.g. a search-starter fix) must roll the box too —
      # without this, sites keep building from a stale template until an
      # unrelated merge deploys (found during the search-template W1 live proof).
      - "templates/**"
      # The Connectors bridge (a persistent Node service on the content
      # instance, behind Caddy's /connectors path route). Without this, merging
      # bridge code would deploy NOTHING.
      - "connectors/**"
      # deploy-filter-exempt: editing THIS workflow deploys nothing by itself —
      # the next real code merge carries it. Marked explicitly so
      # scripts/check-deployyml-filters.sh can tell "deliberately targetless"
      # from "silently dropped".
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # changes job reads the last successful run via the API

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      cp: ${{ steps.f.outputs.cp }}
      instance: ${{ steps.f.outputs.instance }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        name: Detect which targets changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Diff since the last SUCCESSFUL deploy of THIS workflow, not just the
          # previous push. GitHub keeps only one pending run per concurrency
          # group, so under burst merges an intermediate run is cancelled before
          # it deploys. Basing the path filter on `github.event.before` (that
          # run's own range) would then silently drop its paths. Anchoring to the
          # last success means the surviving run always deploys the UNION of every
          # push since — no cancelled range is ever skipped — while still letting
          # a docs-only stretch resolve to "nothing changed".
          base="$(gh run list --workflow=deploy.yml --branch=main --status=success \
                    --limit=1 --json headSha --jq '.[0].headSha' 2>/dev/null || true)"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="${{ github.event.before }}"
          fi
          # Brand-new branch / unknown base: fall back to the immediate parent.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="${{ github.sha }}~1"
          fi
          echo "diff base: $base"
          changed="$(git diff --name-only "$base" "${{ github.sha }}")"
          echo "changed files:"; echo "$changed"
          # internal/ + cmd/ ride the control plane too: bp-provisioner is
          # cross-built from ./cmd/barkpark-provisioner (code under
          # internal/cli/cloud), so an internal-only worker fix must roll the
          # CP or the stale binary keeps provisioning (bit us 2026-07-24: the
          # secrets-chain fix deployed guerrilla but left the CP worker broken).
          if echo "$changed" | grep -qE '^(cloud|deploy|internal|cmd)/'; then echo "cp=true" >> "$GITHUB_OUTPUT"; else echo "cp=false" >> "$GITHUB_OUTPUT"; fi
          # connectors/ rides the content instance: instance-deploy.sh npm-installs
          # it and restarts barkpark-connectors behind the /connectors route.
          # templates/ rides it too (stw9, charter D57a): the box builds sites FROM
          # those trees, and templates/** was listed in on.push.paths while matching
          # NEITHER job regex — so a templates-only merge ran this workflow, deployed
          # NOTHING, and reported GREEN. check-deployyml-filters.sh below is the
          # tripwire that stops that pair of lists drifting again.
          if echo "$changed" | grep -qE '^(api|internal|deploy|connectors|templates)/'; then echo "instance=true" >> "$GITHUB_OUTPUT"; else echo "instance=false" >> "$GITHUB_OUTPUT"; fi
      - name: Assert every on.push.paths entry has a deploy target
        run: bash scripts/check-deployyml-filters.sh
      - name: Assert both smoke tests can fail on a dead or unmoved box
        # --selftest, not the bare form: the bare form only reads the current
        # workflow, so a tripwire that has gone blind still prints OK. The
        # selftest plants negatives on temp copies and requires each to RED, so
        # this step fails when the GUARD stops working, not only when the
        # workflow does. (--selftest had zero callers repo-wide; nineteen
        # sibling scripts already run theirs in CI.)
        run: bash scripts/check-deploy-smoke.sh --selftest

  control-plane:
    needs: changes
    if: needs.changes.outputs.cp == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-build provisioner (linux/amd64)
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o bp-provisioner ./cmd/barkpark-provisioner
      - name: Deploy control plane over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          CP_HOST: ${{ secrets.CP_HOST }}
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/deploy_key
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/known"
          SCP="scp -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/known"
          $SCP deploy/cp-deploy.sh bp-provisioner "root@${CP_HOST}:/tmp/"
          $SSH "root@${CP_HOST}" 'bash /tmp/cp-deploy.sh /tmp/bp-provisioner'
      - name: Smoke test
        # Through Caddy, not a direct port — blue/green means the live slot
        # alternates between :4100 and :4101; the domain always hits it.
        #
        # TWO probes, because the first one alone cannot fail on the failure
        # that happened. `/` is `send_dashboard/1` -> send_file(200,
        # priv/static/index.html) with ZERO Repo access in the path, and 404 was
        # in the accept-list — so this gate certified a box serving nothing but a
        # 404 handler (live proof, harmless: GET /definitely-not-a-route-xyz
        # returns 404, which the old regex accepted). The DB probe below mirrors
        # deploy/cp-deploy.sh:129-141, whose own comment names the incident: the
        # '/' gate "stayed green through a 16h outage where every DB-backed route
        # 500'd". Bad-creds login must answer EXACTLY 401 (a live auth stack over
        # a live pool); 5xx or 000 fails the step. No credential, no auth — the
        # address is deliberately invalid, on the reserved .example TLD.
        # scripts/check-deploy-smoke.sh is the tripwire that stops either
        # invariant regressing.
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://barkpark.cloud/")"
          echo "https://barkpark.cloud/ = $code"
          echo "$code" | grep -qE '^(200|301|302)$'
          dbcode="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
            -X POST -H 'content-type: application/json' \
            -d '{"email":"deploy-smoke-probe@invalid.example","password":"x"}' \
            "https://barkpark.cloud/v1/auth/login" || true)"
          echo "https://barkpark.cloud/v1/auth/login (bad creds) = $dbcode"
          test "$dbcode" = "401"

      - name: Assert the served commit is at-or-after this one
        # ── THE BOX MUST HAVE MOVED ──────────────────────────────────────────
        #
        # Everything above proves the box is ALIVE. Nothing above proves it is
        # NEW. A deploy that never flipped Caddy, or that coalesced and exited
        # 0 without moving, passes every probe above while serving last week's
        # tree — the exact shape this epic exists for.
        #
        # THE RULE IS ANCESTRY, NOT EQUALITY. deploy/cp-deploy.sh:44-58 does
        # `git pull --ff-only origin main` and then exports
        # BARKPARK_GIT_SHA="$(git rev-parse HEAD)" — tip-at-pull-time, never
        # this run's headSha. And docs-only merges (572d51e13, 695a485ce) match
        # none of on.push.paths, so they land on main with NO deploy run at all
        # and ride out on the next unrelated deploy. Live: production serves
        # 572d51e13, which is 10 commits AHEAD of 7f5f10b8d with behind_by 0.
        # An equality assertion would red ten healthy merges and teach everyone
        # to ignore this gate.
        #
        # THE ORACLE IS THE GITHUB COMPARE API, NOT `git merge-base`. This
        # job's `actions/checkout@v4` is depth 1, so the served commit's object
        # is simply absent: `git merge-base --is-ancestor` dies `fatal: Not a
        # valid commit name` with RC=128, and an in-step `git fetch origin main`
        # does not deepen a shallow clone. RC=128 and RC=1 are both non-zero, so
        # the natural `if git merge-base …` form reports a CONFIGURATION failure
        # as "the box is behind". The compare API's failure modes are
        # HTTP-typed, need no checkout, and `contents: read` is already granted
        # at the top of this workflow with `gh` preinstalled on ubuntu-latest.
        #
        # HONEST BOUND: /health's git_sha is System.get_env("BARKPARK_GIT_SHA")
        # (health.ex:62), exported by cp-deploy.sh:58 from the CHECKOUT rather
        # than compiled into the image. So this certifies "the deploy reached
        # the Caddy flip with this tree", NOT "this running binary was built
        # from this sha" — a stale docker build cache would still report it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          URL="https://barkpark.cloud/health"
          # The reader this assertion depends on: dr-w20-s1 / PR #10605 added
          # git_sha to /health. If the key vanishes, say THAT — not "behind".
          READER="dr-w20-s1 / PR #10605 (/health git_sha)"
          # Bounded settle window: Caddy's flip is not instantaneous. The cap is
          # 180s and it EXPIRES INTO A FAILURE — never into a pass. It retries
          # only on unreachable / 5xx / non-JSON / compare-API errors, and NEVER
          # on a clean `behind` or `diverged`: retrying a real regression only
          # delays the red.
          SETTLE_WINDOW_S=180
          body_file="$(mktemp)"
          reason="never attempted"
          deadline=$(( SECONDS + SETTLE_WINDOW_S ))
          attempt=0
          while :; do
            attempt=$(( attempt + 1 ))
            http="$(curl -s -o "$body_file" -w '%{http_code}' --max-time 15 "$URL" || echo 000)"
            if [ "$http" = "000" ] || [ "$http" -ge 500 ] 2>/dev/null; then
              reason="oracle unreachable or 5xx: HTTP $http from $URL"
            elif ! jq -e . "$body_file" >/dev/null 2>&1; then
              reason="$URL answered HTTP $http with a non-JSON body (mid-flip?)"
            elif ! jq -e 'has("git_sha")' "$body_file" >/dev/null 2>&1; then
              # MISSING-KEY ARM, split from the null arm on purpose: this is a
              # broken reader, not a stale box, and it must not read as one.
              echo "::error::$URL answered HTTP $http with NO \`git_sha\` key. This assertion depends on $READER. Nothing was compared — this deploy is UNVERIFIED, not healthy."
              exit 1
            else
              # NULL ARM: `jq -r` would print the four-character string `null`
              # and hand it to the compare API as if it were a sha. `-er` with
              # `// empty` makes null and empty indistinguishable from absent
              # HERE, and the has() arm above already split them.
              served="$(jq -er '.git_sha // empty' "$body_file" || true)"
              if [ -z "$served" ]; then
                echo "::error::$URL returned \`git_sha\` as null/empty. $READER is emitting the key but not a value; refusing to compare a null. UNVERIFIED."
                exit 1
              fi
              status="$(gh api "repos/${{ github.repository }}/compare/${{ github.sha }}...$served" --jq .status 2>&1)" || status="api-error: $status"
              case "$status" in
                api-error*)
                  reason="compare API did not answer ($status)"
                  ;;
                *)
                  if printf '%s' "$status" | grep -qE '^(ahead|identical)$'; then
                    echo "OK: barkpark.cloud serves $served, at-or-after ${{ github.sha }} (compare: $status, attempt $attempt)"
                    exit 0
                  fi
                  echo "::error::THE CONTROL PLANE DID NOT MOVE. barkpark.cloud serves $served; ${{ github.sha }} compares as '$status' against it (expected ahead|identical). The deploy exited 0 over a box that is not running this tree."
                  exit 1
                  ;;
              esac
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::settle window (${SETTLE_WINDOW_S}s, $attempt attempts) expired with no verdict: $reason. Expiring into FAILURE: an unverified deploy is not a successful one."
              exit 1
            fi
            echo "attempt $attempt: $reason — retrying in 10s"
            sleep 10
          done

  instance:
    needs: changes
    if: needs.changes.outputs.instance == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy content instance over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GUERRILLA_HOST: ${{ secrets.GUERRILLA_HOST }}
          # The control plane's egress address, reusing the SAME secret this
          # workflow already SSHes the control plane with — so the address is
          # authored ONCE. instance-deploy.sh writes it as BARKPARK_TRUSTED_PROXIES
          # (only when .env has no line yet, and only if it parses as bare IPs), so
          # the box BELIEVES the caller address the control plane relays on a
          # proxied revoke instead of collapsing every caller onto one rate-limit
          # bucket. Secret unset ⇒ empty ⇒ the script writes a commented
          # placeholder and logs the gap; the deploy is never blocked on it.
          CP_HOST: ${{ secrets.CP_HOST }}
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/deploy_key
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/known"
          SCP="scp -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/known"
          $SCP deploy/instance-deploy.sh "root@${GUERRILLA_HOST}:/tmp/"
          # The remote env assignment is quoted on the REMOTE side too, so a
          # malformed secret can only ever land in the script's validated variable
          # — never split into extra words of the remote command line.
          $SSH "root@${GUERRILLA_HOST}" "BARKPARK_CLOUD_EGRESS_IPS='${CP_HOST}' bash /tmp/instance-deploy.sh"
      - name: Smoke test
        env:
          GUERRILLA_HOST: ${{ secrets.GUERRILLA_HOST }}
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://guerrilla.barkpark.cloud/api/schemas")"
          echo "guerrilla /api/schemas = $code"
          test "$code" = "200"

      - name: Assert the served commit is at-or-after this one
        # Same rule as the control plane, same reasoning (see that step): the
        # 200 above proves the instance is ALIVE, not NEW. instance-deploy.sh
        # has a coalesce branch that exits 0 without moving the box, and a lost
        # Caddy flip leaves the previous slot answering /api/schemas with 200
        # forever. Ancestry, never equality.
        #
        # The instance publishes its sha at GET /status.json as `commit`
        # (unauthenticated, api/lib/barkpark_web/router.ex, shipped in #6422) —
        # a NINE-character short sha, and the compare API accepts that short
        # form verbatim on EITHER side.
        #
        # READ THE ARGUMENT ORDER CAREFULLY — `compare/<base>...<head>` reports
        # the status of HEAD relative to BASE, so this step passes base=this
        # run's sha and head=the served sha, and `ahead` therefore means "the
        # box carries this run's commit plus more". Re-verified live
        # 2026-08-08, with guerrilla serving 2673eb009 while main was at
        # 572d51e13 (a box four commits STALE):
        #   compare/2673eb009...572d51e13   ->  ahead    / 4 / 0   (short sha accepted)
        #   compare/572d51e13...2673eb009   ->  behind   / 0 / 4   (this step's order: RED)
        # The first line is only the short-sha acceptance proof; the SECOND is
        # this step's own call, and on that stale box it correctly fails. Do not
        # mistake the first for a passing verdict.
        #
        # HONEST BOUND: unlike /health's env-injected git_sha, `commit` here is
        # baked at COMPILE time, so it certifies "the running release was built
        # from this tree" — but it cannot distinguish a rebuilt-and-flipped box
        # from one where the flip landed on a slot compiled moments earlier
        # from the same tree. It proves the tree, not the restart.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          URL="https://guerrilla.barkpark.cloud/status.json"
          READER="#6422 (/status.json commit)"
          # Bounded settle window, cap 180s, EXPIRING INTO FAILURE. Retries only
          # on unreachable / 5xx / non-JSON / compare-API errors — never on a
          # clean `behind` or `diverged`.
          SETTLE_WINDOW_S=180
          body_file="$(mktemp)"
          reason="never attempted"
          deadline=$(( SECONDS + SETTLE_WINDOW_S ))
          attempt=0
          while :; do
            attempt=$(( attempt + 1 ))
            http="$(curl -s -o "$body_file" -w '%{http_code}' --max-time 15 "$URL" || echo 000)"
            if [ "$http" = "000" ] || [ "$http" -ge 500 ] 2>/dev/null; then
              reason="oracle unreachable or 5xx: HTTP $http from $URL"
            elif ! jq -e . "$body_file" >/dev/null 2>&1; then
              reason="$URL answered HTTP $http with a non-JSON body (mid-flip?)"
            elif ! jq -e 'has("commit")' "$body_file" >/dev/null 2>&1; then
              # MISSING-KEY ARM, split from the null arm: a broken reader is not
              # a stale box and must not be reported as one.
              echo "::error::$URL answered HTTP $http with NO \`commit\` key. This assertion depends on $READER. Nothing was compared — this deploy is UNVERIFIED, not healthy."
              exit 1
            else
              # NULL ARM: `-er` with `// empty` so the literal string `null`
              # never reaches the compare API as if it were a sha.
              served="$(jq -er '.commit // empty' "$body_file" || true)"
              if [ -z "$served" ]; then
                echo "::error::$URL returned \`commit\` as null/empty. $READER is emitting the key but not a value; refusing to compare a null. UNVERIFIED."
                exit 1
              fi
              status="$(gh api "repos/${{ github.repository }}/compare/${{ github.sha }}...$served" --jq .status 2>&1)" || status="api-error: $status"
              case "$status" in
                api-error*)
                  reason="compare API did not answer ($status)"
                  ;;
                *)
                  if printf '%s' "$status" | grep -qE '^(ahead|identical)$'; then
                    echo "OK: guerrilla serves $served, at-or-after ${{ github.sha }} (compare: $status, attempt $attempt)"
                    exit 0
                  fi
                  echo "::error::THE CONTENT INSTANCE DID NOT MOVE. guerrilla serves $served; ${{ github.sha }} compares as '$status' against it (expected ahead|identical). instance-deploy.sh exited 0 over a box that is not running this tree."
                  exit 1
                  ;;
              esac
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::settle window (${SETTLE_WINDOW_S}s, $attempt attempts) expired with no verdict: $reason. Expiring into FAILURE: an unverified deploy is not a successful one."
              exit 1
            fi
            echo "attempt $attempt: $reason — retrying in 10s"
            sleep 10
          done

  report-deploy-failure:
    # ── THE RED THAT REACHES A HUMAN ─────────────────────────────────────────
    #
    # Continuous deployment to production failed 102 times in a 30-day window
    # and told nobody. 84 of those failures fall inside ONE stretch —
    # 2026-07-21T07:59:48Z .. 2026-07-23T08:46:54Z, 121 runs, 84 failure,
    # 37 cancelled, ZERO success: production CD was dead for 48h47m and the
    # only record of it was a red X on a tab nobody had open. The repository
    # has produced exactly TWO "CI failure" issues in its entire history
    # (#4966, #5658) and neither one is a deploy.
    #
    # This job is the record. Same shape (and same reasoning) as the
    # report-main-failure jobs in cloud.yml / console-harness.yml:
    #
    #   * `needs: [changes, control-plane, instance]` — every job that can fail
    #     in this file. A deploy job that is legitimately not dispatched
    #     (`needs.changes.outputs.* == 'false'`) is SKIPPED, and a skipped
    #     ancestor does not make `failure()` true, so a docs-shaped merge that
    #     deploys nothing reports nothing.
    #
    #   * `failure()` NOT `always()`. `failure()` is FALSE for `cancelled`, and
    #     that is deliberate: 344 of the window's 1,378 runs were cancelled, and
    #     cancellation here is DESIGNED coalescing, not loss — `concurrency` has
    #     `cancel-in-progress: false`, and the `changes` job anchors its diff
    #     base to the last SUCCESSFUL run, so the surviving run deploys the
    #     UNION of every push since. Filing for those is the noise that trains
    #     people to ignore the real ones.
    #
    #   * NO `continue-on-error`, here or anywhere in this file. A job-level
    #     `continue-on-error` still paints a red check but LAUNDERS THE RUN
    #     CONCLUSION into success — and the run conclusion is what
    #     notifications read (breakglass-watch.yml states the rule verbatim).
    #     A reporter that cannot lose is a reporter that never says it lost.
    #
    #   * `permissions:` is JOB-LEVEL and must stay that way. The two deploy
    #     jobs above hold DEPLOY_SSH_KEY and SSH into production as root;
    #     widening the WORKFLOW-level block (`contents: read` + `actions: read`)
    #     to carry `issues: write` would re-scope THEIR tokens too. That is a
    #     security regression, not a style note.
    #
    #   * `CI_FAILURE_KEY: deploy-production` is distinct from every other
    #     caller's key (cloud.yml uses `cloud-main`, console-harness.yml its
    #     own). The script keeps ONE open issue per key — a shared key would
    #     comment a production deploy blackout onto an unrelated gate's issue.
    #
    # scripts/file-ci-failure-issue.sh exits 1 when the alert was NOT delivered
    # (empty token, unreachable API, non-2xx), loudly, with `::error::`. So this
    # job cannot warn-and-pass: a red here means "prod did not deploy AND nobody
    # was told", which is worse than the failure it was reporting and is worth
    # its own red. It runs after both deploy jobs have already published theirs.
    name: Report deploy failure to a human
    needs: [changes, control-plane, instance]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # the ONLY reason this job carries a permissions block
    steps:
      - uses: actions/checkout@v4

      - name: File (or update) the CI failure issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_FAILURE_KEY: deploy-production
          # Which job failed, so the issue body says what to look at without
          # opening the run. `needs.<job>.result` is the job's own conclusion:
          # success / failure / cancelled / skipped.
          CI_FAILURE_DETAIL: |
            **Continuous deployment to production FAILED.** The merged commit is
            on `main` but the affected host was NOT updated — production is
            running older code than the default branch until this is resolved.

            Job results for this run:

            - `changes` (path filter + deploy-target assertion): ${{ needs.changes.result }}
            - `control-plane` (barkpark.cloud, cp-deploy.sh): ${{ needs.control-plane.result }}
            - `instance` (guerrilla, instance-deploy.sh): ${{ needs.instance.result }}

            `skipped` means that target was legitimately not dispatched for this
            diff; `failure` is the one to open. The deploy scripts are
            build-before-swap with a health check and auto-rollback, so a failed
            deploy means prod is STALE, not broken — but the exit code is what
            names the stage. Read the failing job's last step: the deploy scripts
            exit with a distinct non-zero code per stage — for instance-deploy.sh,
            11 = fetch/ref refused, 12 = compile, 13 = migrate, 14 = health check
            after the swap; 255 means SSH itself never landed. Grep the script for
            the code you see rather than guessing from the job name.

            This issue is idempotent per key (`deploy-production`): a continuing
            outage appends a comment rather than opening a new issue. CLOSE IT
            once a deploy succeeds again — the next failure opens a fresh one.
        run: bash scripts/file-ci-failure-issue.sh
