name: Deploy (production)

# Continuous deployment: a merge to main updates the affected production host.
# Path-filtered so a docs-only commit never rebuilds a server. The deploy scripts
# are build-before-swap + health-check + auto-rollback, so a bad build never takes
# prod down. Runs AFTER merge — CI/merge-gates already vetted the change.
on:
  # ── THE MANUAL REPLAY PATH (task-0c3069135d1b4bfd) ─────────────────────────
  #
  # Until this existed, `push` was the ONLY trigger and a strand had no repair
  # that did not involve waiting. Measured 2026-07-19: 10bfdfb40 (5 api/ files,
  # PR #4438) had its deploy cancelled as superseded; the run that survived
  # carried 93fd1e2d8, which does not contain it; and the four commits that
  # followed were docs/tooling which CORRECTLY fail the path filter. So nothing
  # was queued, nothing was red, and the only way to get that api change onto
  # guerrilla was for an unrelated api/ merge to happen along and drag it. That
  # is not a repair, it is a coincidence.
  #
  # Dispatch runs against a REF, so running it on `main` deploys main's tip —
  # the newest relevant commit by construction, with no rerun of an old head and
  # no dependence on which run won a wall-clock race. `targets` exists for the
  # residual case the path diff cannot see: after a strand the last-successful
  # anchor may already cover the missing paths, so `auto` would resolve to
  # "nothing changed" on a box that is genuinely stale. `both` overrides it.
  #
  # It is AUTHENTICATED by construction: workflow_dispatch requires write access
  # on the repository and the two deploy jobs keep `environment: production`, so
  # this adds a trigger, never a permission.
  workflow_dispatch:
    inputs:
      targets:
        description: "Which host(s) to deploy. auto = the usual path diff."
        type: choice
        default: auto
        options:
          - auto
          - cp
          - instance
          - both
      reason:
        description: "Why this manual deploy is needed (recorded in the run log)"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "cloud/**"
      - "api/**"
      - "internal/**"
      - "cmd/**"
      - "deploy/**"
      # Shipped starter templates: the box builds sites FROM these trees, so a
      # templates-only merge (e.g. a search-starter fix) must roll the box too —
      # without this, sites keep building from a stale template until an
      # unrelated merge deploys (found during the search-template W1 live proof).
      - "templates/**"
      # The Connectors bridge (a persistent Node service on the content
      # instance, behind Caddy's /connectors path route). Without this, merging
      # bridge code would deploy NOTHING.
      - "connectors/**"
      # The cloud-sandbox-runner source: instance-deploy.sh (line ~1047)
      # installs the runner FROM scripts/connectors/ onto the content instance.
      # A runner-only merge is byte-identical to prod today ONLY by piggyback on
      # a co-triggering merge — without this line a runner/.mjs-only change lands
      # on main but never reaches guerrilla (charter D275, W35).
      - "scripts/connectors/**"
      # deploy-filter-exempt: editing THIS workflow deploys nothing by itself —
      # the next real code merge carries it. Marked explicitly so
      # scripts/check-deployyml-filters.sh can tell "deliberately targetless"
      # from "silently dropped".
      - ".github/workflows/deploy.yml"

# ── ONE GROUP PER PUSH SHA (task-8e5eae5c71635a5e) ──────────────────────────
#
# WAS: `group: deploy-production` — a single group for every push. GitHub keeps
# exactly ONE not-yet-started run per group, and a new run does not inherit the
# evicted one's place: the survivor is queued FRESH, at the BACK of the runner
# FIFO. So under a merge storm the group does not coalesce deploys, it RESETS
# their queue position on every merge. MEASURED 2026-09-02: 390 runs queued,
# ~1 h to a runner, the last SIX push runs cancelled before starting, and
# guerrilla sat on b8ab70298 for 1.5 h while main had already gained the
# ready-queue index migration. Two hand deploys were the only repair. The
# eviction was DESIGNED as coalescing; what it actually bought, once the wait
# exceeded the merge interval, was starvation — the deploy could not win a race
# it was restarted from the back of.
#
# NOW: each push gets its OWN group, so nothing is ever evicted and the OLDEST
# queued deploy keeps the FIFO position it earned. `cancel-in-progress: false`
# stays — it is the never-cancel choice scripts/never-cancel-main-check.sh
# explicitly permits for deploy/release workflows.
#
# WHAT STOPS TWO RUNS DEPLOYING AT ONCE, now that GitHub no longer does: the
# BOX does, and already did. `deploy/instance-deploy.sh` and
# `deploy/cp-deploy.sh` both open the deploy lock and, on contention, log
# "another deploy holds the lock — queueing (max 30 min)" and `flock -w 1800`.
# The queued run then pulls AFTER taking the lock — "git fetch origin main +
# reset --hard" onto origin/main's TIP — so it deploys the newest commit rather
# than its own, and if the run ahead of it already shipped that tree it exits at
# the coalesce arm: "HEAD … already deployed healthy — nothing to do". Serialised
# and idempotent, without a queue-position reset.
#
# workflow_dispatch keeps a SINGLE group. A dispatch deploys the REF's tip, not
# a fixed sha, so two of them are genuinely interchangeable and coalescing them
# costs nothing.
concurrency:
  group: deploy-production-${{ github.event_name == 'push' && github.sha || 'dispatch' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # changes job reads the last successful run via the API

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      cp: ${{ steps.f.outputs.cp }}
      instance: ${{ steps.f.outputs.instance }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        name: Detect which targets changed
        env:
          GH_TOKEN: ${{ github.token }}
          # Read as SHELL VARIABLES, never interpolated into the script body: a
          # `${{ }}` expansion lands as raw text in the generated shell, so a
          # dispatch input containing shell metacharacters would execute. Empty
          # on a push event, which the `auto` arm below treats as "no override".
          DISPATCH_TARGETS: ${{ inputs.targets }}
          DISPATCH_REASON: ${{ inputs.reason }}
        run: |
          # Diff since the last SUCCESSFUL deploy of THIS workflow, not just the
          # previous push. Every push now gets its own concurrency group (see the
          # stanza above), so a run is no longer evicted before it starts — but it
          # can still be OVERTAKEN: the box resets to origin/main's tip, so the
          # run ahead of us routinely ships commits from later pushes than its
          # own. Basing the path filter on `github.event.before` (this run's own
          # range) would then re-deploy a range someone else already carried, and
          # under the OLD single-group scheme would silently DROP the paths of an
          # evicted run. Anchoring to the last success means a run always deploys
          # the UNION of every push not yet shipped — no range is ever skipped —
          # while still letting a docs-only stretch resolve to "nothing changed".
          base="$(gh run list --workflow=deploy.yml --branch=main --status=success \
                    --limit=1 --json headSha --jq '.[0].headSha' 2>/dev/null || true)"
          # Kept SEPARATELY from $base, because the two fallbacks below replace
          # $base with a plain diff anchor. A parent commit says where to start a
          # diff; it is NOT evidence that anything was ever deployed, and the
          # already-covered test below must never read one as if it were.
          last_deployed=""
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            last_deployed="$base"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="${{ github.event.before }}"
          fi
          # Brand-new branch / unknown base: fall back to the immediate parent.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="${{ github.sha }}~1"
          fi
          echo "diff base: $base"
          # ── ALREADY COVERED — end here, in one short job ────────────────────
          #
          # Per-sha groups mean a merge storm queues N deploy runs instead of
          # one. That is the point (no run loses its FIFO place), and the box
          # already makes the extras harmless — they serialise on the deploy lock
          # and hit instance-deploy.sh's coalesce arm, "HEAD … already deployed
          # healthy — nothing to do". Harmless is not free: each one still takes a
          # runner, an SSH session and the lock for minutes.
          #
          # So answer it here. If the last SUCCESSFUL deploy's head already
          # CONTAINS our sha, the tree we would ship is on the box by ancestry —
          # not by a wall-clock guess. `--is-ancestor <ours> <deployed>` is the
          # same descendancy test scripts/deploy-convergence-check.sh uses to
          # decide supersession, and it is true for the identical sha too.
          # cp=false + instance=false skips both deploy jobs, and record-delivery
          # and convergence require `needs.control-plane.result == 'success' ||
          # needs.instance.result == 'success'` — a skipped leg is neither — so
          # they stay skipped rather than reporting a delivery nobody made.
          #
          # PUSH ONLY. A workflow_dispatch is the DELIBERATE repair named in
          # report-convergence-failure's issue body; talking it out of deploying
          # with the very anchor it was invoked to bypass would remove the only
          # no-wait repair this workflow has. It also must not skip the dispatch
          # override block below, which is what makes `targets: both` mean both.
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$last_deployed" ] &&
             git merge-base --is-ancestor "${{ github.sha }}" "$last_deployed" 2>/dev/null; then
            echo "already covered: ${{ github.sha }} is contained in the last successful deploy's head $last_deployed"
            echo "nothing to deploy — the box already serves a descendant of this commit"
            echo "cp=false" >> "$GITHUB_OUTPUT"
            echo "instance=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # TWO-DOT ON PURPOSE — do not "fix" this to three-dot. This is a
          # push-to-main workflow: $base is the last SUCCESSFUL deploy's head,
          # already an ancestor of github.sha on main, so `base sha` IS the
          # union of every push not yet shipped. A merge-base rewrite here would
          # narrow the range and drop somebody else's un-deployed commits.
          #
          # The PRODUCER, though, carried the same two silent false-greens the
          # wave-10 dispatchers closed, and here they decide whether PRODUCTION
          # ROLLS: `--name-only` quotes a path containing `"`, and rename
          # detection prints only the destination — so a `cloud/` file renamed
          # out classifies cp=false and the control plane silently does not
          # deploy, under a green run. -z + --no-renames + core.quotepath=false.
          # scripts/check-deployyml-filters.sh drives this exact step body
          # against both shapes and reds if this line regresses.
          changed="$(git -c core.quotepath=false diff -z --name-only --no-renames "$base" "${{ github.sha }}" | tr '\0' '\n')"
          echo "changed files:"; echo "$changed"
          # internal/ + cmd/ ride the control plane too: bp-provisioner is
          # cross-built from ./cmd/barkpark-provisioner (code under
          # internal/cli/cloud), so an internal-only worker fix must roll the
          # CP or the stale binary keeps provisioning (bit us 2026-07-24: the
          # secrets-chain fix deployed guerrilla but left the CP worker broken).
          if echo "$changed" | grep -qE '^(cloud|deploy|internal|cmd)/'; then cp=true; else cp=false; fi
          # connectors/ rides the content instance: instance-deploy.sh npm-installs
          # it and restarts barkpark-connectors behind the /connectors route.
          # templates/ rides it too (stw9, charter D57a): the box builds sites FROM
          # those trees, and templates/** was listed in on.push.paths while matching
          # NEITHER job regex — so a templates-only merge ran this workflow, deployed
          # NOTHING, and reported GREEN. check-deployyml-filters.sh below is the
          # tripwire that stops that pair of lists drifting again.
          # scripts/connectors/ rides the content instance too: instance-deploy.sh
          # installs the cloud-sandbox-runner from that tree (charter D275, W35).
          # The prefix is exact — scripts/connectors, not scripts — so a change
          # under scripts/other/ does not falsely flip instance=true.
          # cmd/ rides the content instance TOO — it is the one prefix BOTH jobs
          # must claim. instance-deploy.sh:1071 builds /usr/local/bin/barkpark-agent
          # from ./cmd/barkpark-agent (and the bp CLI from ./cmd/barkpark), and
          # instance-deploy.sh is the ONLY thing that rebuilds that binary. cmd/**
          # is in on.push.paths and matched the cp regex above, so a cmd/-only merge
          # STARTED this workflow, deployed the control plane, ran no instance
          # deploy, and left a stale agent on the content box under a GREEN run.
          # The TARGET arm of check-deployyml-filters.sh pins BOTH halves of this
          # prefix by name (cmd -> instance, cmd -> cp): the forward arm cannot see
          # it, because a path matched by the WRONG job is still a path matched.
          if echo "$changed" | grep -qE '^(api|internal|cmd|deploy|connectors|templates|scripts/connectors)/'; then instance=true; else instance=false; fi
          # THE OVERRIDE, AND ONLY ON A DISPATCH. A push can never reach this —
          # `github.event_name` is the trigger, not an input — so the automatic
          # path is byte-for-byte what it was. `auto` deliberately falls through
          # to the diff above rather than forcing both hosts: a dispatch that
          # only wants the normal behaviour on main's tip must not turn into a
          # full redeploy of two boxes.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            case "${DISPATCH_TARGETS:-auto}" in
              cp)       cp=true;  instance=false ;;
              instance) cp=false; instance=true  ;;
              both)     cp=true;  instance=true  ;;
              auto|"")  : ;;
              *)
                echo "::error::unknown targets input '${DISPATCH_TARGETS}' — refusing rather than guessing which host to deploy"
                exit 1
                ;;
            esac
            printf 'MANUAL REPLAY: targets=%s reason=%s\n' "${DISPATCH_TARGETS:-auto}" "${DISPATCH_REASON:-<none>}"
          fi
          echo "dispatch: cp=$cp instance=$instance"
          echo "cp=$cp" >> "$GITHUB_OUTPUT"
          echo "instance=$instance" >> "$GITHUB_OUTPUT"
      - name: Assert every on.push.paths entry has a deploy target
        run: bash scripts/check-deployyml-filters.sh
      - name: Assert neither deploy target can pass over a box that did not move
        # --selftest FIRST, then the real assertion — the house pattern, and the
        # one doc-gates.yml:460 already uses for this same script. deploy.yml ran
        # only the bare form, so the run that is ABOUT TO DEPLOY took the gate's
        # green on trust while never asking whether the gate could still lose.
        run: |
          bash scripts/check-deploy-smoke.sh --selftest
          bash scripts/check-deploy-smoke.sh

  control-plane:
    needs: changes
    if: needs.changes.outputs.cp == 'true'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      # What the box was serving BEFORE this deploy — read here because it is
      # only readable here. `record-delivery` runs AFTER the swap, where the old
      # sha is gone. Never sourced from the `changes` job's last-successful-run
      # base sha (line ~62): that value LOOKS like the previous sha and diverges
      # from it exactly on a rollback, the one case `previous_sha` exists for.
      previous_sha: ${{ steps.prev.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: prev
        name: Read the sha the control plane is serving BEFORE this deploy
        # ANONYMOUS and read-only: /health is public and returns `git_sha`
        # (BARKPARK_GIT_SHA, read at call time). No credential, no SSH, and it
        # can never fail this deploy — an unreachable box leaves the output
        # empty, which the recorder records as `transition: unknown` rather than
        # inventing a range.
        run: |
          sha=""
          if body="$(curl -s --max-time 15 https://barkpark.cloud/health)"; then
            sha="$(printf '%s' "$body" | jq -r '.git_sha // empty')"
          fi
          echo "control plane was serving: ${sha:-<unknown>}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-build provisioner (linux/amd64)
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o bp-provisioner ./cmd/barkpark-provisioner
      - name: Deploy control plane over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          CP_HOST: ${{ secrets.CP_HOST }}
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/deploy_key
          # ServerAliveInterval=30 x ServerAliveCountMax=90 = a 45-MINUTE tolerance for a
          # silent remote, comfortably over the longest on-box lock wait (30 min, deploy/
          # instance-deploy.sh and cp-deploy.sh; the site engines wait 20). Without the pair
          # the runner's NAT dropped an ssh session that sat idle behind the deploy lock
          # after ~5 min: ssh exited 255 and the run was recorded as a FAILED production
          # deploy for queueing (10 of the last 14 failed main runs, 2026-09-05..06).
          # scripts/deploy-concurrency-check.sh reds if any SSH=/SCP= here loses the pair.
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/known -o ServerAliveInterval=30 -o ServerAliveCountMax=90"
          SCP="scp -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/known -o ServerAliveInterval=30 -o ServerAliveCountMax=90"
          # PER-RUN paths: /tmp/cp-deploy.sh is SHARED, and bash reads a script by
          # byte offset while executing it, so a later run's scp rewrote it under a
          # running deploy (runs 34021843141, 34025907184 died on parse errors).
          # The script also re-execs from a private copy of itself; this closes the
          # same door for the provisioner BINARY, which cannot self-protect.
          R="${GITHUB_RUN_ID}"
          $SCP deploy/cp-deploy.sh "root@${CP_HOST}:/tmp/cp-deploy.$R.sh"
          $SCP bp-provisioner "root@${CP_HOST}:/tmp/bp-provisioner.$R"
          $SSH "root@${CP_HOST}" "bash /tmp/cp-deploy.$R.sh /tmp/bp-provisioner.$R; rc=\$?; rm -f /tmp/cp-deploy.$R.sh /tmp/bp-provisioner.$R; exit \$rc"
      - name: Smoke test
        # Through Caddy, not a direct port — blue/green means the live slot
        # alternates between :4100 and :4101; the domain always hits it.
        #
        # TWO probes, because the first one alone cannot fail on the failure
        # that happened. `/` is `send_dashboard/1` -> send_file(200,
        # priv/static/index.html) with ZERO Repo access in the path, and 404 was
        # in the accept-list — so this gate certified a box serving nothing but a
        # 404 handler (live proof, harmless: GET /definitely-not-a-route-xyz
        # returns 404, which the old regex accepted). The DB probe below mirrors
        # deploy/cp-deploy.sh:129-141, whose own comment names the incident: the
        # '/' gate "stayed green through a 16h outage where every DB-backed route
        # 500'd". Bad-creds login must answer EXACTLY 401 (a live auth stack over
        # a live pool); 5xx or 000 fails the step. No credential, no auth — the
        # address is deliberately invalid, on the reserved .example TLD.
        # scripts/check-deploy-smoke.sh is the tripwire that stops either
        # invariant regressing.
        run: |
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://barkpark.cloud/")"
          echo "https://barkpark.cloud/ = $code"
          echo "$code" | grep -qE '^(200|301|302)$'
          dbcode="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
            -X POST -H 'content-type: application/json' \
            -d '{"email":"deploy-smoke-probe@invalid.example","password":"x"}' \
            "https://barkpark.cloud/v1/auth/login" || true)"
          echo "https://barkpark.cloud/v1/auth/login (bad creds) = $dbcode"
          test "$dbcode" = "401"
      - name: Assert the control plane serves this commit or a descendant
        # THE GATE EVERY STEP ABOVE IS MISSING. The smoke above proves the box is
        # ALIVE; nothing proves it MOVED. A lost Caddy flip onto a still-live old
        # slot, a superseded run, a coalesced no-op deploy — every one of them
        # leaves '/' answering 200 and bad-creds login answering 401 while the box
        # serves the previous commit, and the deploy exits 0. Measured, offline,
        # against a fake box serving a commit 2 behind: both targets' smoke steps
        # exited 0 and nothing ever asked what was being served.
        #
        # ANCESTOR, NOT EQUALITY (charter D359). cp-deploy.sh does
        # `git pull --ff-only origin main` and exports BARKPARK_GIT_SHA from the
        # resulting HEAD — the TIP AT PULL TIME, never this run's headSha. A run
        # fired for one commit routinely delivers a DESCENDANT: docs-only merges
        # match none of this workflow's paths and get no deploy run at all, so
        # production legitimately serves a commit ahead of the one that triggered
        # the run that delivered it. Live: compare 7f5f10b8d...572d51e13 answers
        # `ahead` with ahead_by 10, behind_by 0. An equality gate would red ten
        # healthy merges and teach the reader to ignore this step.
        #
        # THE ORACLE IS THE COMPARE API, NOT `git merge-base` (charter D360). This
        # job's checkout is a bare actions/checkout@v4 (depth 1) and the served
        # commit's object is simply absent — `git merge-base --is-ancestor` dies
        # `fatal: Not a valid commit name`, rc 128, and an `if git merge-base` form
        # then reports a CONFIGURATION failure as "the box is behind". `fetch-depth:
        # 0` is not the fix either: a plain in-step `git fetch origin main` does not
        # deepen a shallow clone. The API needs no checkout at all, its failure
        # modes are HTTP-typed, and `permissions: contents: read` is already granted.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The settle window exists ONLY for transport. It EXPIRES INTO A FAILURE,
          # and it is never spent on a clean verdict: a `behind` or `diverged`
          # answer is retried ZERO times, because retrying a real regression only
          # delays the red.
          SETTLE_CAP_SECONDS=180
          RETRY_SLEEP_SECONDS=10
          deadline=$(( $(date +%s) + SETTLE_CAP_SECONDS ))
          attempt=0
          reason="(no attempt completed)"
          while :; do
            attempt=$((attempt + 1))
            served=""
            body=""
            if ! body="$(curl -sS --max-time 15 https://barkpark.cloud/health 2>&1)"; then
              reason="/health was unreachable: $(printf '%s' "$body" | head -c 200)"
            else
              # `-e` plus `// empty` is the NULL ARM: `jq -r '.git_sha'` prints the
              # four-character string `null` for a null value, and that string would
              # be handed to the oracle as if it were a commit. Here a null or an
              # absent key both yield an EMPTY string and a non-zero jq exit.
              served="$(printf '%s' "$body" | jq -er '.git_sha // empty' 2>/dev/null)" || served=""
              if [ -z "$served" ]; then
                echo "::error title=control plane: /health carries no git_sha::the box answered /health but the git_sha key is absent, null or empty. This step depends on the reader shipped in dr-w20-s1 (#10605); if that reader was removed or renamed, fix the reader — do not weaken this assertion. Body follows."
                printf '%s\n' "$body" | head -c 600
                exit 1
              fi
              case "$served" in
                *[!0-9a-fA-F]*)
                  echo "::error title=control plane: git_sha is not a commit::/health returned git_sha='$served', which is not hexadecimal. A non-sha value (e.g. the string 'unknown') must never be handed to the compare API, where it would surface as an opaque 404."
                  exit 1
                  ;;
              esac
              err="${RUNNER_TEMP:-/tmp}/cp-compare.err"
              if status="$(gh api "repos/${{ github.repository }}/compare/${{ github.sha }}...${served}" --jq .status 2>"$err")"; then
                echo "control plane serves $served; compare ${{ github.sha }}...$served = $status"
                if printf '%s' "$status" | grep -qE '^(ahead|identical)$'; then
                  echo "OK: the merged commit is an ancestor of (or identical to) what the box serves."
                  exit 0
                fi
                echo "::error title=control plane did not move::https://barkpark.cloud/ serves $served, which is '$status' relative to the merged commit ${{ github.sha }}. The deploy reported success over a box that is NOT running this change. Do not re-run to clear this: re-running only re-asks the same question."
                exit 1
              fi
              detail="$(head -c 400 "$err" 2>/dev/null || true)"
              case "$detail" in
                *"rate limit"*|*"secondary rate"*|*"HTTP 50"*|*"502"*|*"503"*|*"504"*|*"timeout"*|*"timed out"*|*"connection"*|*"EOF"*)
                  reason="the compare oracle was unreachable: $detail"
                  ;;
                *)
                  echo "::error title=the compare API refused the comparison::gh api compare ${{ github.sha }}...$served failed for a reason that is not transport. This is a real answer, not a blip: $detail"
                  exit 1
                  ;;
              esac
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error title=served-commit assertion never got an answer::the ${SETTLE_CAP_SECONDS}s settle window expired after $attempt attempt(s) without a verdict. Last reason: $reason. An expired window is a FAILURE — an unanswerable question is not a pass."
              exit 1
            fi
            echo "attempt $attempt: $reason — retrying in ${RETRY_SLEEP_SECONDS}s (cap ${SETTLE_CAP_SECONDS}s)"
            sleep "$RETRY_SLEEP_SECONDS"
          done

  instance:
    needs: changes
    if: needs.changes.outputs.instance == 'true'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      # Same reason as the control plane's: readable only before the swap.
      # `/opt/barkpark/.instance-deploy-last` is instance-deploy.sh's own record
      # of the last HEALTHY deploy, so it is the box's truth rather than CI's.
      previous_sha: ${{ steps.prev.outputs.sha }}
      # What the box is serving AFTER the swap, read from the SAME file — the
      # recorder anchors its `sha` on this and NEVER on `github.sha`. The two
      # differ routinely: instance-deploy.sh pulls origin/main's TIP, so a run
      # triggered by an older head delivers whatever main had reached by the time
      # the box pulled (measured on run 31306459823: head b977b16ad, served
      # a95bc7ca9 — every recorded sha named a commit the box was not serving).
      served_sha: ${{ steps.served.outputs.sha }}
      # The MTIME of that same file, ISO-8601 UTC. instance-deploy.sh writes the
      # file only AFTER its health check and slot flip, so its mtime is the
      # instant this sha began being served — a real flip instant, unlike the
      # control plane's process-derived /health `serving_since`.
      serving_since: ${{ steps.served.outputs.serving_since }}
    steps:
      - uses: actions/checkout@v4
      - id: prev
        name: Read the sha the content instance is serving BEFORE this deploy
        # Over the SSH this job already holds — no new secret, no new hop. An
        # unreachable box or a missing state file leaves the output empty and
        # NEVER fails the deploy: the `if` swallows ssh's rc deliberately, and
        # the recorder then records `transition: unknown` with NULL counts.
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GUERRILLA_HOST: ${{ secrets.GUERRILLA_HOST }}
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/deploy_key
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/known -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=90"
          sha=""
          if out="$($SSH "root@${GUERRILLA_HOST}" 'cat /opt/barkpark/.instance-deploy-last')"; then
            sha="$(printf '%s' "$out" | tr -d '[:space:]')"
          fi
          echo "content instance was serving: ${sha:-<unknown>}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Deploy content instance over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GUERRILLA_HOST: ${{ secrets.GUERRILLA_HOST }}
          # The control plane's egress address, reusing the SAME secret this
          # workflow already SSHes the control plane with — so the address is
          # authored ONCE. instance-deploy.sh writes it as BARKPARK_TRUSTED_PROXIES
          # (only when .env has no line yet, and only if it parses as bare IPs), so
          # the box BELIEVES the caller address the control plane relays on a
          # proxied revoke instead of collapsing every caller onto one rate-limit
          # bucket. Secret unset ⇒ empty ⇒ the script writes a commented
          # placeholder and logs the gap; the deploy is never blocked on it.
          CP_HOST: ${{ secrets.CP_HOST }}
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/deploy_key
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/known -o ServerAliveInterval=30 -o ServerAliveCountMax=90"
          SCP="scp -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/known -o ServerAliveInterval=30 -o ServerAliveCountMax=90"
          # PER-RUN path — same clobber class as the control-plane leg above.
          R="${GITHUB_RUN_ID}"
          $SCP deploy/instance-deploy.sh "root@${GUERRILLA_HOST}:/tmp/instance-deploy.$R.sh"
          # The remote env assignment is quoted on the REMOTE side too, so a
          # malformed secret can only ever land in the script's validated variable
          # — never split into extra words of the remote command line.
          $SSH "root@${GUERRILLA_HOST}" "BARKPARK_CLOUD_EGRESS_IPS='${CP_HOST}' bash /tmp/instance-deploy.$R.sh; rc=\$?; rm -f /tmp/instance-deploy.$R.sh; exit \$rc"
      - name: Smoke test
        # THREE assertions, because the single `test "$code" = "200"` this step
        # used to be covers the dead-pool class and NOTHING else (charter D369,
        # which NARROWS D344 — it does not retract it: that predicate has fired,
        # run 30686555528 caught `guerrilla /api/schemas = 500`).
        #
        # What one 200 could not lose on, and what each new arm closes:
        #
        #   AN EMPTY CATALOG. `/api/schemas` -> LegacyController.schemas/2 ->
        #   Content.list_schemas/2 -> Repo.all(), and legacy_controller.ex's
        #   `json(conn, Enum.map(schemas, ...))` has no emptiness check anywhere
        #   in the chain. Mutation-proved: the old predicate scores 200 and
        #   PASSES against a server answering `[]`. A wiped or wrong-database
        #   box is a live box. So the catalog length is now asserted > 0 (live:
        #   5 entries). jq failing on a non-JSON body fails the step too — a
        #   Caddy error page is not a catalog.
        #
        #   THE ENTIRE AUTHENTICATED STACK. The route pipes through
        #   [:api, LegacyDeprecation] only and is deliberately not token-gated:
        #   it answers 200 with no Authorization header, so no amount of auth
        #   breakage moves it. The bad-creds login probe below is an INDEPENDENT
        #   second oracle over a DIFFERENT pipeline, transplanted byte-identical
        #   from the control-plane smoke and from deploy/cp-deploy.sh:129-141,
        #   whose comment names the 16 h outage the shallow gate slept through.
        #   Live-verified 401 against guerrilla. No credential is introduced —
        #   the address is invalid, on the reserved .example TLD.
        #
        # Still NOT covered here, by design, and named so nobody reads this step
        # as complete: a deploy that exits 0 without moving (instance-deploy.sh
        # coalesces on "already deployed healthy") and a flip lost onto a LIVE
        # sibling slot serving old code. Both are the next step's job — "Assert
        # the content instance serves this commit or a descendant" — not this
        # one's. scripts/check-deploy-smoke.sh is the tripwire on all of it.
        #
        # No `env:` block: GUERRILLA_HOST is the SSH target (an address), never
        # the public origin. Declaring it here and hardcoding the URL below let a
        # secret repointed at one box certify another. The deploy steps above own
        # that secret; this step asserts about the public name, and says so.
        run: |
          code="$(curl -s -o /tmp/instance-schemas.json -w '%{http_code}' --max-time 15 "https://guerrilla.barkpark.cloud/api/schemas")"
          echo "guerrilla /api/schemas = $code"
          test "$code" = "200"
          count="$(jq -e 'if type == "array" then length else error("not a JSON array") end' /tmp/instance-schemas.json)"
          echo "guerrilla /api/schemas catalog entries = $count"
          test "$count" -gt 0
          dbcode="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
            -X POST -H 'content-type: application/json' \
            -d '{"email":"deploy-smoke-probe@invalid.example","password":"x"}' \
            "https://guerrilla.barkpark.cloud/v1/auth/login" || true)"
          echo "https://guerrilla.barkpark.cloud/v1/auth/login (bad creds) = $dbcode"
          test "$dbcode" = "401"
      - name: Assert the content instance serves this commit or a descendant
        # The instance smoke above is `test "$code" = "200"` on /api/schemas. It
        # cannot fail on a lost Caddy flip onto a live sibling slot, nor on
        # instance-deploy.sh's coalesce branch, which exits 0 without moving the
        # box. Same asymmetry the control-plane smoke had before this step, and
        # the same remedy: ask the box what it is serving.
        #
        # The reader already exists and needs no credential: GET /status.json is
        # public (router.ex:1777, pipe_through :api only) and has emitted `commit`
        # since #6422. It is a NINE-character short sha — verified live, and the
        # compare API accepts the short form verbatim:
        #   gh api .../compare/3c7bba49e7...4d35c5ab0 --jq '.status,.ahead_by,.behind_by'
        #   -> behind / 0 / 2
        #
        # ANCESTOR, NOT EQUALITY, for the same reason as the control plane:
        # instance-deploy.sh pulls origin/main's TIP, so a run triggered by an
        # older head delivers whatever main had reached by the time the box pulled.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Same contract as the control-plane assertion: the window is for
          # transport only, it EXPIRES INTO A FAILURE, and a clean `behind` or
          # `diverged` verdict is never retried.
          SETTLE_CAP_SECONDS=180
          RETRY_SLEEP_SECONDS=10
          deadline=$(( $(date +%s) + SETTLE_CAP_SECONDS ))
          attempt=0
          reason="(no attempt completed)"
          while :; do
            attempt=$((attempt + 1))
            served=""
            body=""
            if ! body="$(curl -sS --max-time 15 https://guerrilla.barkpark.cloud/status.json 2>&1)"; then
              reason="/status.json was unreachable: $(printf '%s' "$body" | head -c 200)"
            else
              # NULL ARM, as above: `jq -r '.commit'` would print the literal
              # four-character string `null` and hand it to the oracle.
              served="$(printf '%s' "$body" | jq -er '.commit // empty' 2>/dev/null)" || served=""
              if [ -z "$served" ]; then
                echo "::error title=content instance: /status.json carries no commit::the box answered /status.json but the commit key is absent, null or empty. This step depends on the reader shipped in #6422; if that reader was removed or renamed, fix the reader — do not weaken this assertion. Body follows."
                printf '%s\n' "$body" | head -c 600
                exit 1
              fi
              case "$served" in
                *[!0-9a-fA-F]*)
                  echo "::error title=content instance: commit is not a commit::/status.json returned commit='$served', which is not hexadecimal. Barkpark.BuildInfo degrades to the literal string 'unknown' when it cannot derive a sha at compile time (build_info.ex), and that value must never be handed to the compare API, where it would surface as an opaque 404."
                  exit 1
                  ;;
              esac
              err="${RUNNER_TEMP:-/tmp}/instance-compare.err"
              if status="$(gh api "repos/${{ github.repository }}/compare/${{ github.sha }}...${served}" --jq .status 2>"$err")"; then
                echo "content instance serves $served; compare ${{ github.sha }}...$served = $status"
                if printf '%s' "$status" | grep -qE '^(ahead|identical)$'; then
                  echo "OK: the merged commit is an ancestor of (or identical to) what the box serves."
                  exit 0
                fi
                echo "::error title=content instance did not move::https://guerrilla.barkpark.cloud/ serves $served, which is '$status' relative to the merged commit ${{ github.sha }}. The deploy reported success over a box that is NOT running this change. Do not re-run to clear this: re-running only re-asks the same question."
                exit 1
              fi
              detail="$(head -c 400 "$err" 2>/dev/null || true)"
              case "$detail" in
                *"rate limit"*|*"secondary rate"*|*"HTTP 50"*|*"502"*|*"503"*|*"504"*|*"timeout"*|*"timed out"*|*"connection"*|*"EOF"*)
                  reason="the compare oracle was unreachable: $detail"
                  ;;
                *)
                  echo "::error title=the compare API refused the comparison::gh api compare ${{ github.sha }}...$served failed for a reason that is not transport. This is a real answer, not a blip: $detail"
                  exit 1
                  ;;
              esac
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error title=served-commit assertion never got an answer::the ${SETTLE_CAP_SECONDS}s settle window expired after $attempt attempt(s) without a verdict. Last reason: $reason. An expired window is a FAILURE — an unanswerable question is not a pass."
              exit 1
            fi
            echo "attempt $attempt: $reason — retrying in ${RETRY_SLEEP_SECONDS}s (cap ${SETTLE_CAP_SECONDS}s)"
            sleep "$RETRY_SLEEP_SECONDS"
          done
      - id: served
        name: Read the sha the content instance is serving AFTER this deploy
        # THE BOX ANSWERS FOR WHAT THE BOX SERVES (charter D481/D485). Over the
        # SSH this job already holds — no new secret, no new hop, and read from
        # `/opt/barkpark/.instance-deploy-last`, the same file the `prev` step
        # read before the swap.
        #
        # `stat -c %Y` + `date -u -d @EPOCH` and NOT `stat -c %y`: the epoch form
        # is byte-identical on GNU coreutils and busybox, and the ISO conversion
        # then happens on the runner, whose `date` is known-GNU. Verified against
        # live guerrilla, read-only: the file reads
        # a95bc7ca9747cb3d90a361c4d54eb2c068a24e32, `stat -c %Y` reads 1786268911
        # and `date -u -d @1786268911` reads 2026-08-09T09:48:31Z, which matches
        # `stat -c %y`'s 2026-08-09 09:48:31.442360825 +0000.
        #
        # It can NEVER fail this deploy: the deploy already succeeded above, and
        # an unreadable state file is the RECORDER's verdict to render (empty
        # outputs -> `delivered=false` -> report-recorder-failure), never a
        # fabricated "prod is stale" report from report-deploy-failure.
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GUERRILLA_HOST: ${{ secrets.GUERRILLA_HOST }}
        run: |
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/deploy_key
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/known -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=90"
          sha=""
          serving_since=""
          # Both fields come out KEYED, never as bare positional lines: `cat`
          # of a file with (or without) a trailing newline shifts an unkeyed
          # second line, which would silently swap the sha and the mtime.
          probe='S=/opt/barkpark/.instance-deploy-last
          printf "PD_SHA=%s\n" "$(tr -d "[:space:]" < "$S")"
          printf "PD_MTIME=%s\n" "$(stat -c %Y "$S")"'
          if out="$($SSH "root@${GUERRILLA_HOST}" "$probe")"; then
            sha="$(printf '%s\n' "$out" | sed -n 's/^PD_SHA=//p' | tr -d '[:space:]')"
            mtime="$(printf '%s\n' "$out" | sed -n 's/^PD_MTIME=//p' | tr -d '[:space:]')"
            if [ -n "$mtime" ]; then
              if iso="$(date -u -d "@${mtime}" +%Y-%m-%dT%H:%M:%SZ)"; then
                serving_since="$iso"
              else
                echo "::warning::the state file's mtime (${mtime}) is not a usable epoch — serving_since stays empty"
              fi
            fi
          else
            echo "::warning::could not read /opt/barkpark/.instance-deploy-last after the swap — the recorder will refuse rather than guess"
          fi
          echo "content instance is now serving: ${sha:-<unknown>} since ${serving_since:-<unknown>}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "serving_since=$serving_since" >> "$GITHUB_OUTPUT"

  report-deploy-failure:
    # ── THE RED THAT REACHES A HUMAN ─────────────────────────────────────────
    #
    # Continuous deployment to production failed 102 times in a 30-day window
    # and told nobody. 84 of those failures fall inside ONE stretch —
    # 2026-07-21T07:59:48Z .. 2026-07-23T08:46:54Z, 121 runs, 84 failure,
    # 37 cancelled, ZERO success: production CD was dead for 48h47m and the
    # only record of it was a red X on a tab nobody had open. The repository
    # has produced exactly TWO "CI failure" issues in its entire history
    # (#4966, #5658) and neither one is a deploy.
    #
    # This job is the record. Same shape (and same reasoning) as the
    # report-main-failure jobs in cloud.yml / console-harness.yml:
    #
    #   * `needs: [changes, control-plane, instance]` — every job that can fail
    #     in this file. A deploy job that is legitimately not dispatched
    #     (`needs.changes.outputs.* == 'false'`) is SKIPPED, and a skipped
    #     ancestor does not make `failure()` true, so a docs-shaped merge that
    #     deploys nothing reports nothing.
    #
    #   * `failure()` NOT `always()`. `failure()` is FALSE for `cancelled`, and
    #     that is deliberate: 344 of the window's 1,378 runs were cancelled, and
    #     a cancellation here is never a lost delivery. It is now nearly extinct
    #     as well — since task-8e5eae5c71635a5e each push holds its OWN
    #     concurrency group, so no queued push run is evicted by the next merge;
    #     what remains is a hand-cancel or a superseded dispatch. Either way
    #     nothing is dropped: `cancel-in-progress: false`, the box serialises on
    #     the deploy lock and resets to origin/main's tip, and the `changes` job
    #     anchors its diff base to the last SUCCESSFUL run, so the next run
    #     deploys the UNION of every push not yet shipped. Filing for those is
    #     the noise that trains people to ignore the real ones.
    #
    #   * NO `continue-on-error`, here or anywhere in this file. A job-level
    #     `continue-on-error` still paints a red check but LAUNDERS THE RUN
    #     CONCLUSION into success — and the run conclusion is what
    #     notifications read (breakglass-watch.yml states the rule verbatim).
    #     A reporter that cannot lose is a reporter that never says it lost.
    #
    #   * `permissions:` is JOB-LEVEL and must stay that way. The two deploy
    #     jobs above hold DEPLOY_SSH_KEY and SSH into production as root;
    #     widening the WORKFLOW-level block (`contents: read` + `actions: read`)
    #     to carry `issues: write` would re-scope THEIR tokens too. That is a
    #     security regression, not a style note.
    #
    #   * `CI_FAILURE_KEY: deploy-production` is distinct from every other
    #     caller's key (cloud.yml uses `cloud-main`, console-harness.yml its
    #     own). The script keeps ONE open issue per key — a shared key would
    #     comment a production deploy blackout onto an unrelated gate's issue.
    #
    # scripts/file-ci-failure-issue.sh exits 1 when the alert was NOT delivered
    # (empty token, unreachable API, non-2xx), loudly, with `::error::`. So this
    # job cannot warn-and-pass: a red here means "prod did not deploy AND nobody
    # was told", which is worse than the failure it was reporting and is worth
    # its own red. It runs after both deploy jobs have already published theirs.
    name: Report deploy failure to a human
    needs: [changes, control-plane, instance]
    # THIS ONE STAYS BARE `failure()`, AND IT IS THE EXCEPTION ON PURPOSE
    # (dr-w33-s4, decided at review). Four other alert guards in this repository
    # widened to `failure() || cancelled()` this wave, because on a SCHEDULED
    # workflow a cancelled run is silence wearing a non-red conclusion. Here it
    # is not: the bullet forty lines above already measured it — 344 of 1,378
    # runs cancelled, `concurrency` is `cancel-in-progress: false`, and the
    # `changes` job anchors its diff base to the last SUCCESSFUL run, so the next
    # run deploys the UNION of every push not yet shipped. Since
    # task-8e5eae5c71635a5e a push run is not even EVICTABLE — its concurrency
    # group carries its own sha — so the class shrank to hand-cancels and
    # superseded dispatches. Prod is not left stale by either, and filing on them
    # would bury the `deploy-production` key — this epic's own loudest alarm —
    # under exactly the noise that trains people to ignore it.
    # A cancelled run that DID lose a delivery is caught on its own key by
    # report-recorder-failure below, which names `needs.record-delivery.result ==
    # 'cancelled'` explicitly.
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # the ONLY reason this job carries a permissions block
    steps:
      - uses: actions/checkout@v4

      - name: File (or update) the CI failure issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_FAILURE_KEY: deploy-production
          # Which job failed, so the issue body says what to look at without
          # opening the run. `needs.<job>.result` is the job's own conclusion:
          # success / failure / cancelled / skipped.
          CI_FAILURE_DETAIL: |
            **Continuous deployment to production FAILED.** The merged commit is
            on `main` but the affected host was NOT updated — production is
            running older code than the default branch until this is resolved.

            Job results for this run:

            - `changes` (path filter + deploy-target assertion): ${{ needs.changes.result }}
            - `control-plane` (barkpark.cloud, cp-deploy.sh): ${{ needs.control-plane.result }}
            - `instance` (guerrilla, instance-deploy.sh): ${{ needs.instance.result }}

            `skipped` means that target was legitimately not dispatched for this
            diff; `failure` is the one to open. The deploy scripts are
            build-before-swap with a health check and auto-rollback, so a failed
            deploy means prod is STALE, not broken — but the exit code is what
            names the stage. Read the failing job's last step: the deploy scripts
            exit with a distinct non-zero code per stage — for instance-deploy.sh,
            11 = fetch/ref refused, 12 = compile, 13 = migrate, 14 = health check
            after the swap; 255 means SSH itself never landed. Grep the script for
            the code you see rather than guessing from the job name.

            This issue is idempotent per key (`deploy-production`): a continuing
            outage appends a comment rather than opening a new issue. CLOSE IT
            once a deploy succeeds again — the next failure opens a fresh one.
        run: bash scripts/file-ci-failure-issue.sh

  record-delivery:
    # ── THE CROWN'S WRITER ───────────────────────────────────────────────────
    #
    # `platform_deliveries` has a schema, a writer route, a reader route and a
    # serializer, and until this job NOTHING CALLED THE WRITER. Its one live row
    # was hand-posted by a human 22m47s after its run had ended. This job records
    # what THIS run delivered, from inside the run, one row per sha per target.
    #
    # ZERO NEW CREDENTIALS. `DEPLOY_SSH_KEY` + `CP_HOST` are the repository
    # secrets the control-plane job already SSHes production with; the bearer is
    # `WORKER_TOKEN`, read on the box out of the running control-plane container.
    # The runner never sees it, and `gh secret list` is unchanged by this PR.
    #
    # THE CONTAINER IS DISCOVERED BY IMAGE TAG, NEVER BY NAME. Blue/green renamed
    # it `cloud-control_plane_green-1`, so a name match is a time bomb;
    # `docker ps -q --filter ancestor=cloud-control_plane:latest` is the
    # cp-ops.yml:213-226 precedent. Both the container id AND the token are
    # explicitly checked non-empty — an empty either way is a LOUD refusal, never
    # a silent empty POST.
    #
    # IT EXITS 0 NO MATTER WHAT, AND SAYS SO OUT LOUD. Not politeness: in THIS
    # workflow the run conclusion is load-bearing state. The `changes` job
    # anchors its diff base to the last SUCCESSFUL run of this workflow, so a red
    # recorder freezes that anchor and every later merge unions a wider path set
    # — measured on a real 230-commit freeze, the union touched api/ internal/
    # cloud/ connectors/ deploy/, i.e. BOTH production hosts redeployed on every
    # merge, which is this epic's known outage mechanism. Being IN
    # `report-deploy-failure`'s `needs` is the other wrong branch: that job's body
    # hardcodes "the affected host was NOT updated", which a recorder blip would
    # turn into a fabricated outage report on a deploy that worked. So: read
    # every rc explicitly, exit 0, and put the scream in `report-recorder-failure`
    # below. There is NO `|| true` and NO `|| echo 0` anywhere in this job — a
    # laundered zero is exactly the blindness this epic exists to end.
    name: Record what this run delivered
    needs: [changes, control-plane, instance]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.control-plane.result == 'success' || needs.instance.result == 'success')
    runs-on: ubuntu-latest
    # CONVENTION AND DRIFT-IMMUNITY, NOT A REQUIREMENT: all six GitHub
    # environments hold zero secrets and DEPLOY_SSH_KEY / CP_HOST are REPOSITORY
    # secrets, so this job would resolve them without it. Carried so it matches
    # the two deploy jobs it reports on, and so a future environment-scoped
    # secret does not silently strand the recorder.
    timeout-minutes: 8
    environment: production
    outputs:
      delivered: ${{ steps.post.outputs.delivered }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The range needs the PREVIOUS sha's commit object, which is arbitrarily
          # far back on a rollback or after a long docs-only stretch.
          fetch-depth: 0

      - id: clocks
        name: Measure this run's clocks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Never fails the run (see the job comment): every rc is read, the step
          # ends `exit 0`, and any clock that could not be measured stays the
          # STRING `null` so it lands in the payload as JSON null. A 0 here would
          # read as "the queue was instant" / "the build took no time", which is a
          # confident lie; NULL says "not measured" and is the table's own law.
          set +e
          R="$GITHUB_REPOSITORY"
          QUEUED=null
          SELF=null
          BUILD_CP=null
          BUILD_INSTANCE=null
          # The two jobs that do the DELIVERING, and only those (charter D483).
          # This job and report-deploy-failure were never in the window (the
          # first is still running — no completed_at — and the second only exists
          # on a red), and `changes` is now out too: it is the path filter, not a
          # delivery, and on run 31306459823 its 14s window pulled the shared
          # `queued_seconds` DOWN and pushed the shared build window UP on every
          # row of both targets. `queued_seconds` keeps its shipped definition —
          # min(leg start) - run created — computed over THESE legs.
          LEGS='["control-plane","instance"]'

          run_json="$(gh api "/repos/$R/actions/runs/$GITHUB_RUN_ID")"
          run_rc=$?
          jobs_json="$(gh api "/repos/$R/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100")"
          jobs_rc=$?
          echo "gh api rc: run=$run_rc jobs=$jobs_rc"

          if [ "$run_rc" -eq 0 ] && [ "$jobs_rc" -eq 0 ]; then
            printf '%s' "$run_json" > /tmp/pd-run.json
            printf '%s' "$jobs_json" > /tmp/pd-jobs.json
            created="$(jq -r '.created_at // empty' /tmp/pd-run.json)"
            started="$(jq -r --argjson legs "$LEGS" '[.jobs[] | select(.name as $n | $legs | index($n)) | .started_at] | map(select(. != null)) | sort | first // empty' /tmp/pd-jobs.json)"
            echo "run created_at=${created:-<none>}  first leg started=${started:-<none>}"

            wait_start=""
            wait_end=""
            if [ -n "$created" ] && [ -n "$started" ]; then
              wait_start="$(date -u -d "$created" +%s)"
              wait_end="$(date -u -d "$started" +%s)"
              if [ -n "$wait_start" ] && [ -n "$wait_end" ] && [ "$wait_end" -ge "$wait_start" ]; then
                QUEUED=$((wait_end - wait_start))
              fi
            fi

            # build_seconds is PER TARGET, from THAT target's own job window
            # (charter D483, ratifying D465's "the deploy job's own wall clock,
            # measured entirely inside the job"). There is deliberately no
            # run-level build variable left to stamp on both rows: on run
            # 31306459823 one shared window put 380s on every row of a leg that
            # took 110s — a 3.45x overstatement that no reader could detect,
            # because the two targets agreed. Two targets that agree now can only
            # do so by having actually taken the same time.
            leg_seconds() {
              jq -r --arg n "$1" '[.jobs[]
                | select(.name == $n)
                | select(.started_at != null and .completed_at != null)
                | ((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601))
                | select(. >= 0)] | first // empty' /tmp/pd-jobs.json
            }
            cp_secs="$(leg_seconds control-plane)"
            cp_rc=$?
            if [ "$cp_rc" -eq 0 ] && [ -n "$cp_secs" ]; then BUILD_CP="$cp_secs"; fi
            inst_secs="$(leg_seconds instance)"
            inst_rc=$?
            if [ "$inst_rc" -eq 0 ] && [ -n "$inst_secs" ]; then BUILD_INSTANCE="$inst_secs"; fi
            echo "leg windows: control-plane=${BUILD_CP} instance=${BUILD_INSTANCE} (a skipped leg has no window and stays NULL)"

            # queued_self_seconds — the part of the wait this repository caused
            # ITSELF, by serializing behind its own earlier deploys. Since
            # task-8e5eae5c71635a5e the GitHub-side concurrency group is per push
            # sha (`deploy-production-<sha>`, cancel-in-progress:false), so this
            # wait is now runner-pool contention plus the box-side deploy lock
            # rather than a single group's queue. It is
            # the union of prior deploy.yml job windows overlapped with our wait
            # window, so overlapping siblings are counted once.
            #
            # queued_pickup_seconds and queued_stall_seconds stay NULL, both by
            # ruling and by honesty. D430 defines pickup as the RESIDUAL of a
            # partition whose third term (stall) needs a repo-wide cross-workflow
            # query this job does not make — and a residual of an incomplete
            # partition is not a measurement: on a real sample the gap between a
            # job's created and started was 3s while the residual computed 4s.
            # Writing either as 0 would invent a verdict nobody measured.
            if [ "$QUEUED" != "null" ] && [ "$QUEUED" -gt 0 ]; then
              cands="$(gh api "/repos/$R/actions/workflows/deploy.yml/runs?branch=main&per_page=100" --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | select(.created_at < \"${started}\") | select(.updated_at >= \"${created}\") | .id] | .[0:10] | .[]")"
              cand_rc=$?
              if [ "$cand_rc" -ne 0 ]; then
                echo "::warning::could not list prior deploy runs (rc=$cand_rc) — queued_self_seconds stays NULL"
              else
                : > /tmp/pd-self-jobs.ndjson
                fetch_rc=0
                for cand in $cands; do
                  cand_jobs="$(gh api "/repos/$R/actions/runs/${cand}/jobs?per_page=100" --jq '.jobs[] | {started_at, completed_at}')"
                  if [ $? -ne 0 ]; then
                    fetch_rc=1
                    break
                  fi
                  printf '%s\n' "$cand_jobs" >> /tmp/pd-self-jobs.ndjson
                done
                if [ "$fetch_rc" -ne 0 ]; then
                  echo "::warning::a prior run's job list could not be read — queued_self_seconds stays NULL rather than partial"
                else
                  self="$(jq -s --argjson a "$wait_start" --argjson b "$wait_end" '[ .[] | select(.started_at != null and .completed_at != null) | {s: (.started_at | fromdateiso8601), e: (.completed_at | fromdateiso8601)} ] | map(select(.e > $a and .s < $b)) | map({s: ([.s, $a] | max), e: ([.e, $b] | min)}) | sort_by(.s) | reduce .[] as $i ([]; if (length > 0) and ($i.s <= .[-1].e) then (.[0:-1] + [{s: .[-1].s, e: ([.[-1].e, $i.e] | max)}]) else (. + [$i]) end) | map(.e - .s) | add // 0 | floor' /tmp/pd-self-jobs.ndjson)"
                  self_rc=$?
                  if [ "$self_rc" -eq 0 ] && [ -n "$self" ]; then
                    SELF="$self"
                  else
                    echo "::warning::the self-overlap computation failed (rc=$self_rc) — queued_self_seconds stays NULL"
                  fi
                fi
              fi
            fi
          else
            echo "::warning::the Actions API did not answer — every clock on this row stays NULL (never 0)"
          fi

          echo "clocks: queued=${QUEUED} self=${SELF} build(cp)=${BUILD_CP} build(instance)=${BUILD_INSTANCE} (pickup and stall are NULL by ruling)"
          {
            echo "PD_QUEUED_SECONDS=$QUEUED"
            echo "PD_QUEUED_SELF_SECONDS=$SELF"
            echo "PD_BUILD_SECONDS_CP=$BUILD_CP"
            echo "PD_BUILD_SECONDS_INSTANCE=$BUILD_INSTANCE"
          } >> "$GITHUB_ENV"
          exit 0

      - id: post
        name: Record the delivery from the control plane
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          CP_HOST: ${{ secrets.CP_HOST }}
          CP_RESULT: ${{ needs.control-plane.result }}
          INSTANCE_RESULT: ${{ needs.instance.result }}
          CP_PREVIOUS_SHA: ${{ needs.control-plane.outputs.previous_sha }}
          INSTANCE_PREVIOUS_SHA: ${{ needs.instance.outputs.previous_sha }}
          INSTANCE_SERVED_SHA: ${{ needs.instance.outputs.served_sha }}
          INSTANCE_SERVING_SINCE: ${{ needs.instance.outputs.serving_since }}
        run: |
          # Same law as the clocks step: read every rc, exit 0, and set
          # `delivered=false` so report-recorder-failure below can be the red.
          set +e
          export TZ=UTC
          # WHAT TRIGGERED THIS RUN, WHICH IS NOT WHAT THE BOXES SERVE (D481).
          # Recorded in the log and the job summary, and NEVER as a row's `sha`:
          # both deploy scripts pull origin/main's TIP, so by the time a box
          # deploys, main has typically moved past the head that triggered the
          # run. On run 31306459823 that gap put sha=b977b16ad + transition=
          # rollback on a control plane whose own log said `target=a95bc7ca9 /
          # Already up to date` — a fabricated backwards move on a box that had
          # not moved at all, while a95bc7ca9, the sha BOTH boxes were actually
          # serving, had zero rows in the table.
          DELIVERING_REF_SHA="$GITHUB_SHA"
          RUN_ID="$GITHUB_RUN_ID"
          FIRST_SEEN="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          MAX_RANGE=500
          QUEUED="${PD_QUEUED_SECONDS:-null}"
          SELF="${PD_QUEUED_SELF_SECONDS:-null}"
          BUILD_CP="${PD_BUILD_SECONDS_CP:-null}"
          BUILD_INSTANCE="${PD_BUILD_SECONDS_INSTANCE:-null}"
          # The committer of every commit GitHub's own merge machinery writes.
          # It is what makes the blessed `%cd` producer safe: a merge/squash
          # commit's COMMITTER date IS the instant the PR merged (28/28 sampled
          # shas within 1s), but a commit pushed straight to main carries the
          # author's local commit time, which is not a merge instant at all —
          # and `%cd` cannot say "there was no merge". That case is the NULL arm
          # below; 200/200 commits on main today are GitHub-committed.
          GITHUB_MERGE_COMMITTER="noreply@github.com"
          delivered=true

          echo "delivering_ref_sha (github.sha, the TRIGGER — never a row's sha): ${DELIVERING_REF_SHA}"
          echo "shallow clone: $(git rev-parse --is-shallow-repository)"

          # THE BOX-REPORTED SHA, NORMALISED AND PROVEN PRESENT. Anything that
          # cannot be resolved to a commit in this clone is a REFUSAL, never a
          # row: a row anchored on a sha we cannot describe is exactly the
          # identity-false record this wave exists to end.
          resolve_served() {
            target="$1"
            raw="$(printf '%s' "$2" | tr -d '[:space:]')"
            if [ -z "$raw" ]; then
              echo "::error::${target}: the box did not report what it is serving — no row can be anchored, so ${target} records NOTHING" >&2
              return 1
            fi
            case "$raw" in
              *[!0-9a-f]*)
                echo "::error::${target}: the box reported '${raw}', which is not a hex sha — ${target} records NOTHING" >&2
                return 1
                ;;
            esac
            full="$(git rev-parse --verify --quiet "${raw}^{commit}")"
            if [ $? -ne 0 ] || [ -z "$full" ]; then
              echo "::error::${target}: the box reports it is serving ${raw}, which is not a commit in this clone — ${target} records NOTHING" >&2
              return 1
            fi
            printf '%s' "$full"
            return 0
          }

          # THE CONTROL PLANE'S OWN ANSWER, from the /health read this step
          # already performed. `git_sha` is `BARKPARK_GIT_SHA`, which
          # cp-deploy.sh:58 exports from the very `git rev-parse HEAD` it just
          # checked out — the box's own statement of what it serves, and
          # therefore the cp row's `sha`.
          #
          # THE MISMATCH IS NOW A VERDICT, NOT A NULLED COLUMN (D482). This block
          # used to compare /health's git_sha against $GITHUB_SHA and, on the
          # disagreement, drop `serving_since` and SHIP the row anyway with
          # delivered=true — holding the refutation of its own row in a shell
          # variable and spending it on one column. An unreadable /health now
          # means the cp leg records nothing and `delivered=false`, which is what
          # makes report-recorder-failure fire.
          #
          # `serving_since` keeps its basis said out loud: /health's value is
          # PROCESS-derived (VM start), not the instant the sha began being
          # served — two BEAMs running the same code moved it forward 6.4s, and
          # `serving_since_basis` on that same payload says so. A process-start
          # upper bound is a real datum; it is NOT the flip instant.
          CP_SERVED_SHA=""
          CP_SERVING_SINCE=""
          if [ "$CP_RESULT" = "success" ]; then
            health="$(curl -s --max-time 15 https://barkpark.cloud/health)"
            health_rc=$?
            if [ "$health_rc" -ne 0 ]; then
              echo "::error::/health did not answer (rc=$health_rc) — the control plane cannot say what it is serving, so the cp leg of run ${RUN_ID} records NOTHING"
              delivered=false
            else
              health_sha="$(printf '%s' "$health" | jq -r '.git_sha // empty')"
              CP_SERVED_SHA="$(resolve_served cp "$health_sha")"
              if [ $? -ne 0 ] || [ -z "$CP_SERVED_SHA" ]; then
                CP_SERVED_SHA=""
                delivered=false
              else
                CP_SERVING_SINCE="$(printf '%s' "$health" | jq -r '.serving_since // empty')"
                echo "cp: /health says it is serving ${CP_SERVED_SHA} (trigger was ${DELIVERING_REF_SHA}), serving_since=${CP_SERVING_SINCE:-<absent>} (basis: process start, not the flip instant)"
              fi
            fi
          fi

          # THE CONTENT INSTANCE'S OWN ANSWER, read by the instance job from
          # `/opt/barkpark/.instance-deploy-last` after its swap (D485). The
          # MTIME of that file is `serving_since` for this leg and it IS the flip
          # instant: instance-deploy.sh writes the file only after the health
          # check and the slot flip, and a redeploy of an already-live sha exits
          # early without touching it. NOT ServingMemory, which D465 rejected by
          # name — reading it would MINT the first_seen_at it claims to observe.
          INSTANCE_SERVED=""
          INSTANCE_SINCE=""
          if [ "$INSTANCE_RESULT" = "success" ]; then
            INSTANCE_SERVED="$(resolve_served instance "$INSTANCE_SERVED_SHA")"
            if [ $? -ne 0 ] || [ -z "$INSTANCE_SERVED" ]; then
              INSTANCE_SERVED=""
              delivered=false
            else
              INSTANCE_SINCE="$(printf '%s' "$INSTANCE_SERVING_SINCE" | tr -d '[:space:]')"
              echo "instance: the box says it is serving ${INSTANCE_SERVED} (trigger was ${DELIVERING_REF_SHA}), serving_since=${INSTANCE_SINCE:-<absent>} (basis: mtime of .instance-deploy-last, the flip instant)"
            fi
          fi

          # One target's rows. THE RANGE PRIMITIVE IS THREE-DOT --left-right,
          # rc-checked and never piped: `git rev-list --count OLD..NEW` reads 0 on
          # a real rollback, byte-identical to a no-op, and a pipeline reports the
          # LAST command's status so `… | head` prints `fatal:` and still exits 0.
          # Anything that goes wrong lands on transition=unknown with NULL counts.
          rows_for() {
            target="$1"
            prev="$2"
            serving="$3"
            build="$4"
            out="$5"
            served="$6"
            rangefile="/tmp/pd-range-${target}.txt"
            transition=unknown
            measured=0

            # `%ce` rides along so the merged_at producer can have a NULL arm —
            # see GITHUB_MERGE_COMMITTER above. Neither a sha, an ISO timestamp
            # nor an email can contain a space, so the split stays safe.
            git show -s --format='%H %cd %ce' --date=format-local:%Y-%m-%dT%H:%M:%SZ "$served" > "$rangefile"
            if [ $? -ne 0 ]; then
              echo "::warning::${target}: git could not describe ${served} — no row for this leg"
              printf '[]' > "$out"
              return 1
            fi

            if [ -z "$prev" ]; then
              echo "::warning::${target}: no previous sha was captured before the deploy — transition=unknown, counts NULL"
            else
              git cat-file -e "${prev}^{commit}"
              if [ $? -ne 0 ]; then
                echo "::warning::${target}: previous sha ${prev} is not in this clone — transition=unknown, counts NULL"
              else
                counts="$(git rev-list --count --left-right "${prev}...${served}")"
                if [ $? -ne 0 ]; then
                  echo "::warning::${target}: rev-list --count --left-right ${prev}...${served} failed — transition=unknown, counts NULL"
                else
                  set -- $counts
                  behind="$1"
                  ahead="$2"
                  measured=1
                  if [ "$behind" -eq 0 ] && [ "$ahead" -eq 0 ]; then
                    transition=noop
                  elif [ "$behind" -eq 0 ]; then
                    transition=forward
                  elif [ "$ahead" -eq 0 ]; then
                    transition=rollback
                  else
                    transition=diverged
                  fi
                  echo "${target}: ${prev}...${served} = ${behind} left / ${ahead} right -> ${transition}"
                  # A deploy delivers every sha on the right side of the range,
                  # not just the one the run was triggered for: ~36% of merged
                  # shas have no run of their own and ride a later sha's. Those
                  # rows are what `carried` exists to say, and they are the
                  # deliveries this epic exists to make visible. The range now
                  # ends at the SERVED sha, so every emitted row names a commit
                  # this box demonstrably has — where a range ending at
                  # $GITHUB_SHA could (and on 31306459823 did) emit rows for
                  # commits no box was serving, and omit the one it was.
                  if [ "$ahead" -gt 0 ]; then
                    if [ "$ahead" -gt "$MAX_RANGE" ]; then
                      echo "::warning::${target} delivered ${ahead} commits, above the ${MAX_RANGE}-row cap — the NEWEST ${MAX_RANGE} are recorded and the older ones are NOT"
                    fi
                    git log --max-count="$MAX_RANGE" --format='%H %cd %ce' --date=format-local:%Y-%m-%dT%H:%M:%SZ "${prev}..${served}" > "$rangefile"
                    if [ $? -ne 0 ]; then
                      echo "::warning::${target}: the range enumeration failed after its count succeeded — recording the served sha alone, unmeasured"
                      git show -s --format='%H %cd %ce' --date=format-local:%Y-%m-%dT%H:%M:%SZ "$served" > "$rangefile"
                      transition=unknown
                      measured=0
                    fi
                  fi
                fi
              fi
            fi

            # `carried` is EMITTED ONLY WHEN THE RANGE MEASURED, and then it is
            # computed (`sha != the sha this box serves`), never a literal. The
            # column has no schema default, so an omitted key genuinely reads nil
            # — "nobody measured this" — where a `false` would be a confident
            # wrong answer about whether a sha rode someone else's run. It is
            # compared against the SERVED sha, which is what makes it true: a run
            # whose trigger the box never served would otherwise mark its own
            # served commit `carried: true`.
            #
            # `merged_at` keeps the blessed `%cd` producer and gains its NULL
            # arm: a commit GitHub did not commit did not arrive by a merge, and
            # `null` is the only honest answer for it. `.[2]` is absent (null)
            # when git printed no committer email at all, which lands on the same
            # arm rather than on a fabricated timestamp.
            jq -n \
              --rawfile lines "$rangefile" \
              --arg head "$served" \
              --arg run "$RUN_ID" \
              --arg first_seen "$FIRST_SEEN" \
              --arg target "$target" \
              --arg prev "$prev" \
              --arg transition "$transition" \
              --arg serving "$serving" \
              --arg merge_committer "$GITHUB_MERGE_COMMITTER" \
              --argjson measured "$measured" \
              --argjson queued "$QUEUED" \
              --argjson self "$SELF" \
              --argjson build "$build" \
              '$lines | split("\n") | map(select(length > 0)) | map(split(" ")) | map({sha: .[0], delivering_run_id: $run, first_seen_at: $first_seen, merged_at: (if .[2] == $merge_committer then .[1] else null end), target: $target, queued_seconds: $queued, queued_self_seconds: $self, queued_pickup_seconds: null, queued_stall_seconds: null, build_seconds: $build, transition: $transition} + (if $measured == 1 then {carried: (.[0] != $head)} else {} end) + (if ($prev | length) > 0 then {previous_sha: $prev} else {} end) + (if ($serving | length) > 0 then {serving_since: $serving} else {} end))' > "$out"
            if [ $? -ne 0 ]; then
              echo "::warning::${target}: the row payload could not be built — no row for this leg"
              printf '[]' > "$out"
              return 1
            fi
            return 0
          }

          # ONE ROW SET PER TARGET, EACH GATED ON THE JOB THAT ACTUALLY RAN. A
          # cloud-only merge SKIPS the instance job, and a skipped job delivered
          # nothing: it must produce no instance row.
          printf '[]' > /tmp/pd-rows-cp.json
          printf '[]' > /tmp/pd-rows-instance.json
          if [ "$CP_RESULT" = "success" ] && [ -n "$CP_SERVED_SHA" ]; then
            rows_for cp "$CP_PREVIOUS_SHA" "$CP_SERVING_SINCE" "$BUILD_CP" /tmp/pd-rows-cp.json "$CP_SERVED_SHA"
            if [ $? -ne 0 ]; then delivered=false; fi
          elif [ "$CP_RESULT" = "success" ]; then
            echo "control-plane deployed but could not be anchored — no cp row (delivered=false above)"
          else
            echo "control-plane result=${CP_RESULT} — no cp row"
          fi
          if [ "$INSTANCE_RESULT" = "success" ] && [ -n "$INSTANCE_SERVED" ]; then
            rows_for instance "$INSTANCE_PREVIOUS_SHA" "$INSTANCE_SINCE" "$BUILD_INSTANCE" /tmp/pd-rows-instance.json "$INSTANCE_SERVED"
            if [ $? -ne 0 ]; then delivered=false; fi
          elif [ "$INSTANCE_RESULT" = "success" ]; then
            echo "instance deployed but could not be anchored — no instance row (delivered=false above)"
          else
            echo "instance result=${INSTANCE_RESULT} — no instance row"
          fi

          # THE ROW MUST STILL AGREE WITH THE BOX IT CLAIMS TO DESCRIBE. The
          # anchor above is the box's own answer, so this can only fire if the
          # range or the enumeration substituted a different head — and that is
          # precisely the class of bug that shipped 8 identity-false rows with
          # `delivered=true`. It is a REFUSAL, not a warning: a row nobody can
          # tie back to a box is the silence this epic exists to end.
          agrees_with_box() {
            target="$1"
            served="$2"
            file="$3"
            n="$(jq -r --arg s "$served" '[.[] | select(.sha == $s and (.carried != true))] | length' "$file")"
            if [ $? -ne 0 ] || [ "${n:-0}" -ne 1 ]; then
              echo "::error::${target}: the payload carries ${n:-<unreadable>} row(s) naming the sha the box reports it serves (${served}), expected exactly 1 — run ${RUN_ID} will not record a delivery it cannot tie to the box"
              printf '[]' > "$file"
              return 1
            fi
            return 0
          }
          if [ -n "$CP_SERVED_SHA" ]; then
            agrees_with_box cp "$CP_SERVED_SHA" /tmp/pd-rows-cp.json
            if [ $? -ne 0 ]; then delivered=false; fi
          fi
          if [ -n "$INSTANCE_SERVED" ]; then
            agrees_with_box instance "$INSTANCE_SERVED" /tmp/pd-rows-instance.json
            if [ $? -ne 0 ]; then delivered=false; fi
          fi

          jq -n --slurpfile cp /tmp/pd-rows-cp.json --slurpfile inst /tmp/pd-rows-instance.json '{deliveries: ($cp[0] + $inst[0])}' > /tmp/pd-payload.json
          if [ $? -ne 0 ]; then
            echo "::error::the delivery batch could not be assembled — run ${RUN_ID} recorded NOTHING"
            echo "delivered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count="$(jq -r '.deliveries | length' /tmp/pd-payload.json)"
          echo "rows to record: ${count}"
          jq -c '.deliveries[0] // "no rows"' /tmp/pd-payload.json

          # WHAT THIS RUN IS ABOUT TO CLAIM, ON THE RUN'S OWN PAGE — the trigger
          # sha and the served shas side by side, because their gap is the whole
          # defect this job was rewritten for and a reader should not need the
          # database to see it.
          {
            echo "### Delivery record for run ${RUN_ID}"
            echo
            echo "| | value |"
            echo "|---|---|"
            echo "| delivering_ref_sha (trigger, never a row's \`sha\`) | \`${DELIVERING_REF_SHA}\` |"
            echo "| cp serves | \`${CP_SERVED_SHA:-<not recorded>}\` |"
            echo "| instance serves | \`${INSTANCE_SERVED:-<not recorded>}\` |"
            echo "| build_seconds | cp ${BUILD_CP}, instance ${BUILD_INSTANCE} |"
            echo "| rows | ${count} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${count:-0}" -eq 0 ]; then
            if [ "$delivered" = "true" ]; then
              # Nothing to record is not a failure to record. Say it, stay green.
              echo "::warning::no leg reported success — there is nothing to record for run ${RUN_ID}"
            else
              # A leg DID deploy and produced no row: that is a loss, and the
              # zero-row exit must not launder it back into a green.
              echo "::error::a leg deployed but no row could be anchored to it — run ${RUN_ID} recorded NOTHING"
            fi
            echo "delivered=${delivered}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/deploy_key
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/known -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=90"

          # The POST is issued FROM the control plane, over the SSH this workflow
          # already holds, so the bearer never leaves the box and no new GitHub
          # secret exists. It goes to the PUBLIC edge rather than a localhost
          # port: both slots bind 127.0.0.1 and cp-deploy.sh's localhost probes
          # deliberately target the IDLE one, so a port here would record into the
          # slot that is not serving. The payload arrives on stdin; the remote
          # script exits 0 and reports what happened in PD_* lines this step then
          # branches on.
          REMOTE='set -u
          cat > /tmp/pd-payload.json
          CID="$(docker ps -q --filter ancestor=cloud-control_plane:latest | head -1)"
          if [ -z "$CID" ]; then echo "PD_ERROR=no_control_plane_container"; rm -f /tmp/pd-payload.json; exit 0; fi
          WT="$(docker exec "$CID" printenv WORKER_TOKEN)"
          if [ -z "$WT" ]; then echo "PD_ERROR=empty_worker_token"; rm -f /tmp/pd-payload.json; exit 0; fi
          CODE="$(curl -s -o /tmp/pd-response.json -w "%{http_code}" --max-time 30 -X POST -H "content-type: application/json" -H "authorization: Bearer $WT" --data-binary @/tmp/pd-payload.json https://barkpark.cloud/v1/internal/platform-deliveries)"
          PD_CURL_RC=$?
          echo "PD_CURL_RC=$PD_CURL_RC"
          echo "PD_HTTP=$CODE"
          echo "PD_BODY=$(tr -d "\n" < /tmp/pd-response.json)"
          rm -f /tmp/pd-payload.json /tmp/pd-response.json
          exit 0'

          out="$($SSH "root@${CP_HOST}" "$REMOTE" < /tmp/pd-payload.json)"
          ssh_rc=$?
          printf '%s\n' "$out"

          if [ "$ssh_rc" -ne 0 ]; then
            echo "::error::the recorder could not reach the control plane over SSH (rc=${ssh_rc}) — run ${RUN_ID} delivered ${count} row(s) that were NOT recorded"
            echo "delivered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pd_error="$(printf '%s\n' "$out" | sed -n 's/^PD_ERROR=//p')"
          curl_rc="$(printf '%s\n' "$out" | sed -n 's/^PD_CURL_RC=//p')"
          http="$(printf '%s\n' "$out" | sed -n 's/^PD_HTTP=//p')"
          body="$(printf '%s\n' "$out" | sed -n 's/^PD_BODY=//p')"

          if [ -n "$pd_error" ]; then
            echo "::error::the recorder found no usable seam on the control plane (${pd_error}) — run ${RUN_ID} delivered ${count} row(s) that were NOT recorded"
            delivered=false
          elif [ "${curl_rc:-1}" -ne 0 ]; then
            echo "::error::curl exited ${curl_rc} posting the delivery batch — run ${RUN_ID} recorded NOTHING"
            delivered=false
          elif [ "$http" = "200" ]; then
            received="$(printf '%s' "$body" | jq -r '.received // empty')"
            recorded="$(printf '%s' "$body" | jq -r '.recorded // empty')"
            echo "recorded ${recorded:-?} of ${received:-?} row(s) for run ${RUN_ID}"
            if [ "${received:-0}" -ne "$count" ]; then
              echo "::error::the crown counted ${received:-<none>} rows but ${count} were sent — the batch did not arrive intact"
              delivered=false
            elif [ "${recorded:-0}" -lt "${received:-0}" ]; then
              # Idempotent on (sha, delivering_run_id, target): a retried job
              # re-posts its batch and writes nothing. That is a success, and
              # saying so beats a fake "recorded everything".
              echo "::notice::$(( ${received:-0} - ${recorded:-0} )) row(s) were already recorded for this run — the write is idempotent on sha+run+target"
            fi
          elif [ "$http" = "503" ]; then
            reason="$(printf '%s' "$body" | jq -r '.reason // empty')"
            if [ "$reason" = "platform_deliveries_missing" ]; then
              # THE TYPED REFUSAL, keyed on the reason and never on the status
              # code alone: this control plane has not run the migration yet,
              # which is REAL (the instance job fires on paths that do not
              # require the cloud/** merge carrying it). Retryable, and LOGGED.
              echo "::error::the control plane has no platform_deliveries table yet (reason=platform_deliveries_missing) — run ${RUN_ID} delivered ${count} row(s) and the crown recorded NONE of them"
            else
              echo "::error::the control plane answered 503 with reason=${reason:-<none>} — run ${RUN_ID} recorded NOTHING: ${body}"
            fi
            delivered=false
          else
            # The route is NOT spelled out here, deliberately: the caller-less
            # census (cloud/test/barkpark_cloud/payload_key_set_census_test.exs)
            # scores a route CALLED when its literal path appears on any line of
            # this file, so a log line naming the path would keep the census
            # green with the actual POST deleted — measured by mutation. The one
            # contiguous literal in this job is the curl above, which is the
            # caller.
            echo "::error::the crown's writer route answered HTTP ${http:-<none>} — run ${RUN_ID} recorded NOTHING: ${body}"
            delivered=false
          fi

          echo "delivered=${delivered}" >> "$GITHUB_OUTPUT"
          # ALWAYS 0. The scream is report-recorder-failure's job, not the run
          # conclusion's — see the job comment.
          exit 0

  report-recorder-failure:
    # ── THE RED THE RECORDER IS NOT ALLOWED TO BE ────────────────────────────
    #
    # record-delivery exits 0 by design, so without this job a delivery that was
    # never recorded would be a warning in a log nobody opens — the same silence
    # this epic exists to end, one level up.
    #
    # It is a SEPARATE job for the same reason report-deploy-failure is: the
    # `permissions:` block must stay JOB-LEVEL. The two deploy jobs hold
    # DEPLOY_SSH_KEY and SSH into production as root; widening the WORKFLOW-level
    # block (`contents: read` + `actions: read`) to carry `issues: write` would
    # re-scope THEIR tokens too. That is a security regression, not a style note.
    #
    # `CI_FAILURE_KEY: deploy-recorder` is distinct from report-deploy-failure's
    # `deploy-production`: one open issue per key, and these two are different
    # incidents — "prod is stale" versus "prod is current and we cannot prove
    # it". file-ci-failure-issue.sh exits 1 only when the alert was NOT
    # delivered, so a filed alert leaves this run green and the `changes` job's
    # diff anchor keeps advancing.
    #
    # THE REPORTER MUST ALSO SURVIVE THE RECORDER DYING (added in review, W27).
    # `delivered == 'false'` is the recorder's OWN verdict, and a job that never
    # reached its last step cannot render one: an `actions/checkout` failure, the
    # `timeout-minutes: 8` expiring inside the clocks step's `gh api` loop, or a
    # runner evicted mid-job all end with `outputs.delivered` EMPTY. Without
    # `always()` the default `success()` gate would then skip this job, and the
    # loudest possible recorder failure — the one where the recorder did not run
    # at all — would be the only one that files nothing. So the trigger is the
    # UNION of "the recorder said it lost" and "the recorder did not get to say",
    # and `always()` is what lets a failed dependency be evaluated at all.
    name: Report a delivery that was never recorded
    needs: record-delivery
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      needs.record-delivery.result != 'skipped' &&
      (needs.record-delivery.outputs.delivered == 'false' ||
      needs.record-delivery.result == 'failure' ||
      needs.record-delivery.result == 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # the ONLY reason this job carries a permissions block
    steps:
      - uses: actions/checkout@v4

      - name: File (or update) the CI failure issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_FAILURE_KEY: deploy-recorder
          CI_FAILURE_DETAIL: |
            **The deploy WORKED and the record of it did NOT land.** Production is
            running the merged commit; what is missing is the durable row that
            says so. Nothing about the hosts is stale — do not treat this as an
            outage, and do not redeploy on account of it.

            Read `record-delivery`'s last step in this run: it prints exactly one
            `::error::` naming the reason, and every reason is one of

            - `no_control_plane_container` — no container matched
              `ancestor=cloud-control_plane:latest`; the image tag moved.
            - `empty_worker_token` — the container has no `WORKER_TOKEN` in its
              environment.
            - an SSH rc — the runner could not reach `CP_HOST` at all.
            - `platform_deliveries_missing` — this control plane has not run the
              migration; it lands on an api-only merge and clears on the next
              `cloud/**` deploy.
            - any other HTTP status, quoted with the response body.

            IF `record-delivery` PRINTED NO `::error::` AT ALL, it did not reach
            its last step — it failed, was cancelled, or hit its 8-minute
            timeout, and `outputs.delivered` is empty rather than `false`. This
            job fires on that case too (its `if` is the union), so read the
            recorder job's own conclusion and its LAST step instead. That variant
            also reds the whole run, which freezes the `changes` job's
            last-successful-run diff anchor — the next merge will union a wider
            path set and redeploy more than it needed to.

            The write is idempotent on (sha, delivering_run_id, target), so a
            re-run of the deploy workflow for the same commit is safe and is the
            normal repair. This issue is idempotent per key (`deploy-recorder`):
            a continuing outage appends a comment rather than opening a new
            issue. CLOSE IT once a delivery records again.
        run: bash scripts/file-ci-failure-issue.sh

  convergence:
    # ── DOES THE BOX ACTUALLY SERVE THE NEWEST RELEVANT COMMIT? ──────────────
    #
    # Every other job in this file answers "did the thing I dispatched succeed".
    # None of them answers "is production current", and those are different
    # questions with different answers — which is the whole of
    # task-0c3069135d1b4bfd. On 2026-07-19 every run was green, the ledger said
    # success, and guerrilla was missing an api change that had been on main for
    # hours. Nothing in this workflow could see it, because nothing compared the
    # SERVED commit against main.
    #
    # THREE THINGS MAKE THIS HONEST RATHER THAN NOISY:
    #
    #   1. IT READS WHAT THE BOX SERVES, never `github.sha`. The trigger sha is
    #      what STARTED a run; both deploy scripts pull origin/main's tip, so the
    #      two differ routinely (measured on run 31306459823: head b977b16ad,
    #      served a95bc7ca9). An assertion on the intended commit would certify a
    #      deploy that never happened, which is the defect wearing a gate.
    #
    #   2. ONE SNAPSHOT OF MAIN, TAKEN ONCE, USED FOR BOTH LEGS. This is
    #      task-7a85d1b5f471af8f's lesson borrowed rather than re-learned: that
    #      row is crown-reconcile comparing a newer crown against an older run
    #      list ~95s apart and calling a healthy row WRONG. Re-reading main per
    #      leg would rebuild exactly that tear one axis over.
    #
    #   3. A COMMIT IS ONLY OWED ONCE ITS OWN DEPLOY COULD HAVE FINISHED. The
    #      cutoff is when THIS run's deploy legs started; anything merged after
    #      that is another run's debt, not evidence of a strand. Without it this
    #      job would red on every merge that lands mid-deploy.
    #
    # RELEVANCE IS PER TARGET and is read out of the `changes` job's own filters
    # (`--target cp|instance`), never copied: the control plane does not carry
    # `api/**`, so judging it against the union would file a fabricated outage
    # every time an api-only merge lands.
    #
    # THE CONTROL PLANE IS CHECKED EVEN WHEN ITS LEG SKIPPED, and that is the
    # widening that catches the original incident. `/health` is public and
    # anonymous, so the read costs nothing and needs no credential — and a box
    # that nothing deployed is precisely the box this row is about. The content
    # instance cannot be checked that way (its served sha is read over the SSH
    # the instance job holds), so when that leg did not run this job says
    # UNCHECKED out loud rather than counting silence as green.
    #
    # IT CAN FAIL, AND THAT IS THE POINT (task-103b5cc5ec4a8ccd). Until
    # 2026-09-06 this job printed `converged=false` and exited 0 unconditionally,
    # reporting its verdict through a step OUTPUT instead of its status. On
    # 2026-09-02 the control plane sat 49 commits behind from ~15:22Z and this
    # job — the one instrument built to notice exactly that — was green for seven
    # hours. A human reading deploy logs found it. An instrument that cannot fail
    # cannot inform.
    #
    # THE BOUNDARY THAT KEEPS IT FROM BEING WAIVED, decided in
    # `deploy-convergence-check.sh adjudicate` (read the block above that mode;
    # the harness beside it drives every arm):
    #
    #   not stranded                    -> 0
    #   stranded AND a deploy in flight -> 0, "NOT CONVERGED **YET**"
    #   stranded AND nothing in flight  -> 1, the run goes red
    #
    # The middle row is the whole design. A gate that reds on every ordinary
    # in-flight deploy is waived inside a day, and a waived tripwire has stopped
    # discriminating — so an in-flight deploy DELAYS the red, and can never
    # cancel it: `converged=false` is still emitted on that run, so
    # report-convergence-failure still files, and the next run re-asks with the
    # deploy finished.
    #
    # ON THE FROZEN DIFF ANCHOR, which is why this job used to exit 0 and why
    # that reasoning does not survive the boundary above. `changes` bases its
    # path diff on the last SUCCESSFUL run of this workflow, so a red here does
    # freeze that anchor and widen every later merge's path union until both
    # hosts redeploy. That was a real objection to a NOISY red. Against a red
    # that fires only for "stranded with nothing coming", the widening is the
    # remediation, not the outage: it is what drags the missing commit onto the
    # box. It is self-limiting too — the first run that converges the box is
    # green again and the anchor moves forward with it.
    name: Production serves the newest deploy-relevant main commit
    needs: [changes, control-plane, instance]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.control-plane.result == 'success' || needs.instance.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      converged: ${{ steps.check.outputs.converged }}
      detail: ${{ steps.check.outputs.detail }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The range walks back to whatever the box is serving, which after a
          # strand is arbitrarily far behind. A shallow clone makes every sha
          # unresolvable, and this gate answers that with a refusal, not a pass.
          fetch-depth: 0

      - id: check
        name: Compare what each box serves against one snapshot of main
        env:
          GH_TOKEN: ${{ github.token }}
          CP_RESULT: ${{ needs.control-plane.result }}
          INSTANCE_RESULT: ${{ needs.instance.result }}
          INSTANCE_SERVED_SHA: ${{ needs.instance.outputs.served_sha }}
        run: |
          set +e
          converged=true
          detail=""

          # ── ONE SNAPSHOT OF MAIN ─────────────────────────────────────────
          git fetch --no-tags --quiet origin main
          fetch_rc=$?
          TIP="$(git rev-parse --verify --quiet FETCH_HEAD^{commit})"
          if [ "$fetch_rc" -ne 0 ] || [ -z "$TIP" ]; then
            echo "::warning::could not fetch origin/main — falling back to this run's own sha as the snapshot"
            TIP="$GITHUB_SHA"
          fi
          echo "main snapshot (taken ONCE, used for both legs): $TIP"

          # ── THE OWED CUTOFF: when this run's deploy legs began ────────────
          # Anything merged after that instant belongs to another run. Read from
          # the same two legs record-delivery names (charter D483). If the API
          # does not answer, fall back to a generous grace window and SAY so —
          # never to "everything is owed", which would red on a merge race.
          # OWED_ARGS carries TWO words and is deliberately left unquoted at both
          # call sites below. It is built only from this block — never from a
          # box, an input or a payload — so there is nothing here for a split to
          # smuggle; quoting it would pass "--owed-before X" as a single
          # argument and the parser would refuse it as an unknown flag.
          OWED_ARGS=""
          started="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "control-plane" or .name == "instance") | .started_at] | map(select(. != null)) | sort | first // empty')"
          if [ $? -eq 0 ] && [ -n "$started" ]; then
            OWED_ARGS="--owed-before $started"
            echo "owed cutoff: $started (the first deploy leg's start)"
          else
            OWED_ARGS="--grace-seconds 900"
            echo "::warning::the Actions API did not answer — using a 900s grace window instead of the leg start"
          fi

          # ── THE CONTROL PLANE: always, because /health is public ──────────
          echo "::group::control plane"
          cp_sha=""
          if body="$(curl -s --max-time 15 https://barkpark.cloud/health)"; then
            cp_sha="$(printf '%s' "$body" | jq -r '.git_sha // empty')"
          fi
          if [ -z "$cp_sha" ]; then
            echo "::warning::the control plane did not say what it serves — UNCHECKED, not green"
            detail="${detail}control-plane: UNCHECKED (/health gave no git_sha). "
          else
            bash scripts/deploy-convergence-check.sh converged \
              --label "control plane (barkpark.cloud)" --target cp \
              --served "$cp_sha" --tip "$TIP" $OWED_ARGS
            case $? in
              0) detail="${detail}control-plane: converged. " ;;
              1) converged=false
                 detail="${detail}control-plane: STRANDED (serving ${cp_sha}). " ;;
              *) echo "::warning::the control-plane comparison could not be made — UNCHECKED, not green"
                 detail="${detail}control-plane: UNCHECKED (the comparison refused). " ;;
            esac
          fi
          echo "::endgroup::"

          # ── THE CONTENT INSTANCE: only when its leg reported a served sha ──
          echo "::group::content instance"
          if [ "$INSTANCE_RESULT" != "success" ]; then
            echo "the instance leg did not run in this deploy (result=${INSTANCE_RESULT}) — UNCHECKED."
            echo "Its served sha is readable only over the SSH that job holds, so silence here is"
            echo "an absence of evidence and is reported as one, never as a green."
            detail="${detail}instance: UNCHECKED (leg ${INSTANCE_RESULT}). "
          elif [ -z "$INSTANCE_SERVED_SHA" ]; then
            echo "::warning::the instance leg succeeded but reported no served sha — UNCHECKED, not green"
            detail="${detail}instance: UNCHECKED (no served sha). "
          else
            bash scripts/deploy-convergence-check.sh converged \
              --label "content instance (guerrilla)" --target instance \
              --served "$INSTANCE_SERVED_SHA" --tip "$TIP" $OWED_ARGS
            case $? in
              0) detail="${detail}instance: converged. " ;;
              1) converged=false
                 detail="${detail}instance: STRANDED (serving ${INSTANCE_SERVED_SHA}). " ;;
              *) echo "::warning::the instance comparison could not be made — UNCHECKED, not green"
                 detail="${detail}instance: UNCHECKED (the comparison refused). " ;;
            esac
          fi
          echo "::endgroup::"

          # ── IS ANOTHER DEPLOY STILL COMING? ──────────────────────────────
          # STATUS, never conclusion: the question is "has some run not had its
          # turn yet", which is answered by queued/in_progress and by nothing a
          # finished run concluded. This run is excluded by id — it is itself
          # in_progress, and counting it would suppress every red forever.
          # A lookup that fails is reported as `unknown`, which WITHHOLDS the
          # exit code without withholding the finding: converged=false still
          # goes to the output above, so the issue still files.
          IN_FLIGHT_SOURCE=ok
          flight_file="$RUNNER_TEMP/deploy-runs-in-flight"
          : > "$flight_file"
          for st in queued in_progress; do
            page="$(gh run list --workflow=deploy.yml --branch=main --status="$st" \
                      --limit=50 --json databaseId,headSha,status \
                      --jq '.[] | "\(.databaseId) \(.headSha) \(.status)"')" || {
              IN_FLIGHT_SOURCE=unknown
              echo "::warning::could not list ${st} deploy runs — the exit code will be withheld"
              continue
            }
            printf '%s\n' "$page" >> "$flight_file"
          done
          grep -v -e '^$' -e "^${GITHUB_RUN_ID} " "$flight_file" > "${flight_file}.other" || true
          echo "deploy runs still queued or running (this run excluded):"
          cat "${flight_file}.other"

          # ── THE CONCLUSION ───────────────────────────────────────────────
          # rc CAPTURED ON THE SAME LINE. `run:` is `bash -e`, and the
          # `set +e` above is undone by nothing — but this idiom is the one that
          # survives someone restoring -e, and it is the house form (PR #16314).
          unchecked=false
          case "$detail" in *UNCHECKED*) unchecked=true ;; esac
          verdict_rc=0
          bash scripts/deploy-convergence-check.sh adjudicate \
            --label "production" --stranded "$([ "$converged" = "false" ] && echo true || echo false)" \
            --unchecked "$unchecked" --in-flight-source "$IN_FLIGHT_SOURCE" \
            < "${flight_file}.other" || verdict_rc=$?

          echo "converged=${converged}" >> "$GITHUB_OUTPUT"
          echo "detail=${detail}" >> "$GITHUB_OUTPUT"
          echo "VERDICT: converged=${converged} — ${detail}"
          # rc 2 is HARNESS-UNAVAILABLE — "I could not adjudicate" is not "it is
          # fine", so it reds too, and names itself as a refusal rather than a
          # finding. The scream still lives in report-convergence-failure; what
          # is new is that this job's own status can no longer lie.
          if [ "$verdict_rc" -eq 2 ]; then
            echo "::error::the convergence verdict could not be adjudicated — refusing to conclude green"
            exit 2
          fi
          if [ "$verdict_rc" -ne 0 ]; then
            echo "::error::production is STRANDED and no deploy is in flight to carry the missing commit — ${detail}"
          fi
          exit "$verdict_rc"

  report-convergence-failure:
    # ── THE RED FOR A DEPLOY THAT SUCCEEDED AND DID NOT ARRIVE ───────────────
    #
    # Distinct from BOTH existing reporters, and the distinction is the point:
    #
    #   * `deploy-production` fires when a deploy job FAILED — prod is stale and
    #     the run says so.
    #   * `deploy-recorder`   fires when the deploy worked and the RECORD of it
    #     did not land — prod is fine, the ledger is thin.
    #   * `deploy-convergence` (this one) fires when every job in the run
    #     SUCCEEDED and production is still missing a merged, deploy-relevant
    #     commit. Nothing is red. That is the entire incident.
    #
    # A shared key would comment this onto an unrelated gate's issue, so it gets
    # its own. `permissions:` stays JOB-LEVEL for the same security reason the
    # other two reporters state: the deploy jobs hold DEPLOY_SSH_KEY and SSH into
    # production as root, and widening the workflow-level block to carry
    # `issues: write` would re-scope their tokens too.
    #
    # `always()` and the union trigger, mirroring report-recorder-failure: a
    # convergence job that never reached its last step renders no verdict at all,
    # and the loudest possible failure — the check did not run — must not be the
    # one case that files nothing.
    name: Report production that did not receive a merged change
    needs: convergence
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      needs.convergence.result != 'skipped' &&
      (needs.convergence.outputs.converged == 'false' ||
      needs.convergence.result == 'failure' ||
      needs.convergence.result == 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # the ONLY reason this job carries a permissions block
    steps:
      - uses: actions/checkout@v4

      - name: File (or update) the CI failure issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_FAILURE_KEY: deploy-convergence
          CI_FAILURE_DETAIL: |
            **A deploy-relevant commit is on `main` and is NOT on the box.**
            Production is serving code that predates a merged change, and no
            further path-triggered run is queued to carry it — a docs-only
            stretch after the strand correctly triggers nothing, so this does NOT
            self-heal.

            The `convergence` job now CONCLUDES on this: it exits non-zero when a
            strand has no deploy in flight to explain it, and stays green (while
            still filing this issue) when one is still running. So a red
            `convergence` and this issue are the same finding seen twice — and a
            GREEN run carrying this issue means the strand is real but a deploy
            was still in flight when the check ran. Either way the gap is real.

            Verdict: ${{ needs.convergence.outputs.detail }}

            Read the `convergence` job's log: it names the exact commit each box
            is missing, when that commit merged, and which host's filter made it
            relevant. `UNCHECKED` is not a finding — it means the comparison
            could not be made (an unreadable `/health`, a leg that did not run, a
            shallow clone) and it never counts as converged.

            THE REPAIR, and it needs no unrelated merge to carry it: run
            **Actions -> Deploy (production) -> Run workflow** against `main`,
            with `targets: both` and a reason. Dispatch runs against a REF, so it
            deploys main's tip rather than replaying whichever head won a
            wall-clock race. `auto` is deliberately NOT enough here: after a
            strand the last-successful-run anchor may already cover the missing
            paths, so the path diff can resolve to "nothing changed" on a box
            that is genuinely stale.

            WHY THIS HAPPENS. Deploy order is wall clock, and wall clock is not
            commit ancestry: a run can start later and still carry the older
            commit (a re-run of an old workflow is the pure case). The GitHub
            concurrency group is now per push sha (`deploy-production-<sha>`,
            cancel-in-progress:false), so the old eviction shape is gone — no
            queued push run is replaced by the next merge, and none is sent to
            the back of the runner queue. What remains is ordering: the box
            serialises on the deploy lock and resets to origin/main's tip, so a
            late-starting run normally carries MORE than its own commit, not
            less. `scripts/deploy-convergence-check.sh survivor` decides
            supersession the right way, by descendancy, and its `--selftest`
            reproduces the 2026-07-19 shape.

            This issue is idempotent per key (`deploy-convergence`): a continuing
            gap appends a comment rather than opening a new issue. CLOSE IT once a
            deploy lands the missing commit.
        run: bash scripts/file-ci-failure-issue.sh
