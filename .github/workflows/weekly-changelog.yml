name: weekly-changelog

on:
  schedule:
    # The prior ISO week is complete. Offset from the top of the hour to avoid
    # GitHub's busiest cron window.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      week_start:
        description: "ISO-week Monday (YYYY-MM-DD); blank means the previous week"
        required: false
        type: string
  pull_request:
    paths:
      - ".github/workflows/weekly-changelog.yml"
      - "scripts/weekly-changelog.py"
      - "scripts/weekly-changelog.test.py"
      - "CHANGELOG.md"

concurrency:
  group: weekly-changelog-${{ github.event.inputs.week_start || 'previous' }}
  cancel-in-progress: false

jobs:
  verify:
    name: Weekly changelog generator
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run hermetic generator tests
        run: python3 scripts/weekly-changelog.test.py

  publish:
    name: Publish weekly changelog
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve the completed ISO week
        id: week
        env:
          REQUESTED_WEEK: ${{ github.event.inputs.week_start }}
        run: |
          week="$REQUESTED_WEEK"
          if [ -z "$week" ]; then
            week="$(python3 - <<'PY'
          import datetime as dt
          today = dt.datetime.now(dt.timezone.utc).date()
          this_monday = today - dt.timedelta(days=today.weekday())
          print(this_monday - dt.timedelta(days=7))
          PY
          )"
          fi
          echo "week=$week" >> "$GITHUB_OUTPUT"
      - name: Render weekly notes
        env:
          WEEK: ${{ steps.week.outputs.week }}
        run: |
          python3 scripts/weekly-changelog.py --week "$WEEK" --ref main > "$RUNNER_TEMP/weekly-changelog.md"
          cat "$RUNNER_TEMP/weekly-changelog.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Create or refresh the week's changelog issue
        env:
          GH_TOKEN: ${{ github.token }}
          WEEK: ${{ steps.week.outputs.week }}
        run: |
          title="Weekly changelog · $WEEK"
          gh label create weekly-changelog --description "Automated project-wide weekly changelog" --color 0e8a16 --force
          number="$(gh issue list --state all --search "$title in:title" --limit 100 --json number,title \
            | jq -r --arg title "$title" '.[] | select(.title == $title) | .number' \
            | head -n 1)"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/weekly-changelog.md" --add-label weekly-changelog
          else
            url="$(gh issue create --title "$title" --body-file "$RUNNER_TEMP/weekly-changelog.md" --label weekly-changelog)"
            number="${url##*/}"
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$number" \
            -f state=closed -f state_reason=completed >/dev/null
