name: weekly-changelog

on:
  schedule:
    # The prior ISO week is complete. Offset from the top of the hour to avoid
    # GitHub's busiest cron window.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      week_start:
        description: "ISO-week Monday (YYYY-MM-DD); blank means the previous week"
        required: false
        type: string
  pull_request:
    paths:
      - ".github/workflows/weekly-changelog.yml"
      - "scripts/weekly-changelog.py"
      - "scripts/weekly-changelog.test.py"
      - "CHANGELOG.md"

concurrency:
  group: weekly-changelog-${{ github.event.inputs.week_start || 'previous' }}
  cancel-in-progress: false

jobs:
  verify:
    name: Weekly changelog generator
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run hermetic generator tests
        run: python3 scripts/weekly-changelog.test.py

  publish:
    name: Publish weekly changelog
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve the completed ISO week
        id: week
        env:
          REQUESTED_WEEK: ${{ github.event.inputs.week_start }}
        run: |
          week="$REQUESTED_WEEK"
          if [ -z "$week" ]; then
            week="$(python3 - <<'PY'
          import datetime as dt
          today = dt.datetime.now(dt.timezone.utc).date()
          this_monday = today - dt.timedelta(days=today.weekday())
          print(this_monday - dt.timedelta(days=7))
          PY
          )"
          fi
          echo "week=$week" >> "$GITHUB_OUTPUT"
          echo "tag=weekly-$week" >> "$GITHUB_OUTPUT"
      - name: Render release notes
        id: notes
        env:
          WEEK: ${{ steps.week.outputs.week }}
        run: |
          python3 scripts/weekly-changelog.py --week "$WEEK" --ref main > "$RUNNER_TEMP/weekly-changelog.md"
          head_sha="$(python3 scripts/weekly-changelog.py --week "$WEEK" --ref main --head-only)"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/weekly-changelog.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Create or refresh the week's release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.week.outputs.tag }}
          WEEK: ${{ steps.week.outputs.week }}
          HEAD_SHA: ${{ steps.notes.outputs.head_sha }}
        run: |
          title="Weekly changelog · $WEEK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file "$RUNNER_TEMP/weekly-changelog.md" --prerelease
          else
            gh release create "$TAG" --target "$HEAD_SHA" --title "$title" \
              --notes-file "$RUNNER_TEMP/weekly-changelog.md" --prerelease
          fi
