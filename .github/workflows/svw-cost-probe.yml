name: SVW page cost probe (TEMPORARY)
on:
  push:
    branches: [ 'gates/r20-svw3' ]
permissions:
  contents: read
  pull-requests: read
  checks: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .exp/probe.sh
