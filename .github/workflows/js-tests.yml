name: js-tests

# The js monorepo's test gate. Until 2026-06-11 NOTHING ran the js suite in
# CI — typedoc only builds reference docs, ci.yml is web/lighthouse, and
# release.yml fires on dispatch/tags — so every js/CLAUDE.md claim about CI
# enforcement (bundle budget, no-node-imports) referenced a workflow that
# did not exist, and SDK changes shipped test-verified only locally.
#
# Steps mirror the local gates js/CLAUDE.md documents: install → build →
# test (vitest projects: node, core-workerd, react-browser) → lint →
# typecheck → size (bundle budget) → check-no-node-imports.

on:
  push:
    branches: [main]
    paths:
      - "js/**"
      - ".github/workflows/js-tests.yml"
      # The committed codegen schema fixture + its generated artifact: a change
      # to either must run the drift gate below.
      - "web/lib/barkpark.schema.json"
      - "web/lib/barkpark.types.ts"
      # The engine error-vocabulary fixture: @barkpark/react's sheet emitter is
      # locked to it (packages/react/tests/sheet-error-vocabulary.test.ts), so a
      # vocabulary bump regenerated engine-side must run the js suite HERE —
      # otherwise the react mirror goes stale green and reds later on an
      # unrelated js PR.
      - "web/__tests__/fixtures/engine-errors.json"
      # The Elixir PortableDoc render path + its golden mirror. The JS parity
      # leg (packages/react/tests/PortableDoc.parity.test.tsx) is the ONLY thing
      # that runs the JS renderer against those goldens; an Elixir-side emitter
      # change that regenerates BOTH mirrors touches no js/ path, so without
      # these two entries it passed the Elixir gate and never rendered a single
      # JS block. The mirrors agreeing is not the renderer agreeing.
      - "api/lib/barkpark/portable_doc/**"
      - "api/test/support/fixtures/pd-parity/**"
      - "api/test/support/fixtures/nested-list-carriers.json"
      - "api/test/support/fixtures/code-block-lang-parity.json"
      - "api/test/support/fixtures/code-block-emphasis-parity.json"
      - "api/test/support/fixtures/code-source-aliases.json"
      - "api/test/support/fixtures/inline-block-wrapper.json"
      - "api/test/support/fixtures/section-boundary-rules.json"
      - "api/test/support/fixtures/inline-code-source.json"
      - "api/test/support/fixtures/sdk-capabilities-parity.json"
      # The Elixir filter-op vocabulary. @barkpark/core's query-builder parity
      # suite (packages/core/tests/filter-op-parity.test.ts) reads this fixture
      # DIRECTLY across the tree ('../../../../api/test/fixtures/filter_ops.json')
      # and is the only thing that proves the SDK's operator set matches the
      # engine's. An engine-side vocabulary change regenerates it and touches no
      # js/ path, so without this entry the suite was never DISPATCHED on the one
      # change it exists to catch. MEASURED: appending one op to that fixture
      # makes `vitest run tests/filter-op-parity.test.ts` fail 2 of 7 — the guard
      # works; only its trigger was missing.
      - "api/test/fixtures/filter_ops.json"
      # Two more cross-tree fixtures js/ tests read DIRECTLY (same class as
      # filter_ops.json above): packages/react/tests/table-typed-cols.parity.test.ts
      # reads table-col-types.json; status-manifest-parity.test.ts and
      # taskboard-cancel-lane.test.ts read design/status-manifest.json. Neither
      # matched any entry here, so an engine-side regen never dispatched js-tests.
      - "api/test/support/fixtures/table-col-types.json"
      - "design/status-manifest.json"
      # The Phoenix paper-surface stylesheet. @barkpark/react ships
      # dist/paper-surface.css as a byte-for-byte COPY of it, and
      # packages/react/tests/paper-surface-asset.test.ts is the ONLY guard on
      # that copy. An api-side edit to the stylesheet touches no js/ path, so
      # without this entry the drift guard was never DISPATCHED on the exact
      # change it exists to catch — the stylesheet could drift from the shipped
      # asset and every js PR after it would stay green on the stale copy.
      - "api/assets/paper-surface/**"
  pull_request:
    paths:
      - "js/**"
      - ".github/workflows/js-tests.yml"
      - "web/lib/barkpark.schema.json"
      - "web/lib/barkpark.types.ts"
      # The engine error-vocabulary fixture: @barkpark/react's sheet emitter is
      # locked to it (packages/react/tests/sheet-error-vocabulary.test.ts), so a
      # vocabulary bump regenerated engine-side must run the js suite HERE —
      # otherwise the react mirror goes stale green and reds later on an
      # unrelated js PR.
      - "web/__tests__/fixtures/engine-errors.json"
      # The Elixir PortableDoc render path + its golden mirror. The JS parity
      # leg (packages/react/tests/PortableDoc.parity.test.tsx) is the ONLY thing
      # that runs the JS renderer against those goldens; an Elixir-side emitter
      # change that regenerates BOTH mirrors touches no js/ path, so without
      # these two entries it passed the Elixir gate and never rendered a single
      # JS block. The mirrors agreeing is not the renderer agreeing.
      - "api/lib/barkpark/portable_doc/**"
      - "api/test/support/fixtures/pd-parity/**"
      - "api/test/support/fixtures/nested-list-carriers.json"
      - "api/test/support/fixtures/code-block-lang-parity.json"
      - "api/test/support/fixtures/code-block-emphasis-parity.json"
      - "api/test/support/fixtures/code-source-aliases.json"
      - "api/test/support/fixtures/inline-block-wrapper.json"
      - "api/test/support/fixtures/section-boundary-rules.json"
      - "api/test/support/fixtures/inline-code-source.json"
      - "api/test/support/fixtures/sdk-capabilities-parity.json"
      # The Elixir filter-op vocabulary. @barkpark/core's query-builder parity
      # suite (packages/core/tests/filter-op-parity.test.ts) reads this fixture
      # DIRECTLY across the tree ('../../../../api/test/fixtures/filter_ops.json')
      # and is the only thing that proves the SDK's operator set matches the
      # engine's. An engine-side vocabulary change regenerates it and touches no
      # js/ path, so without this entry the suite was never DISPATCHED on the one
      # change it exists to catch. MEASURED: appending one op to that fixture
      # makes `vitest run tests/filter-op-parity.test.ts` fail 2 of 7 — the guard
      # works; only its trigger was missing.
      - "api/test/fixtures/filter_ops.json"
      # Two more cross-tree fixtures js/ tests read DIRECTLY (same class as
      # filter_ops.json above): packages/react/tests/table-typed-cols.parity.test.ts
      # reads table-col-types.json; status-manifest-parity.test.ts and
      # taskboard-cancel-lane.test.ts read design/status-manifest.json. Neither
      # matched any entry here, so an engine-side regen never dispatched js-tests.
      - "api/test/support/fixtures/table-col-types.json"
      - "design/status-manifest.json"
      # The Phoenix paper-surface stylesheet. @barkpark/react ships
      # dist/paper-surface.css as a byte-for-byte COPY of it, and
      # packages/react/tests/paper-surface-asset.test.ts is the ONLY guard on
      # that copy. An api-side edit to the stylesheet touches no js/ path, so
      # without this entry the drift guard was never DISPATCHED on the exact
      # change it exists to catch — the stylesheet could drift from the shipped
      # asset and every js PR after it would stay green on the stale copy.
      - "api/assets/paper-surface/**"

concurrency:
  group: js-tests-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # Never cancel main (the 2026-06-10 elixir starvation lesson); collapse
  # superseded PR runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Build + test + gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
        with:
          # PRs need the base ref's history so turbo can scope to `...[origin/<base>]`
          # (task-4e377262789d8fd3). main keeps the shallow clone.
          # Quoted on purpose: a bare 0 is FALSY in expressions, so `&& 0 || 1` always gave 1.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node (pnpm store cached on the lockfile)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # cache: pnpm needs pnpm on PATH first, hence the reorder above
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: "The Node pin above satisfies engines.node and the root vitest config can load under it (task-a9c4b827881d71bd)"
        run: node scripts/check-node-floor.mjs --selftest && node scripts/check-node-floor.mjs

      # COVERAGE for the `size` and `test` steps below, in front of both
      # (task-3cd40ebba5ab106a, task-d4c973367c0d1a76). `turbo run <task>`
      # scores a package with NO SCRIPT for that task as a SUCCESS, so
      # "N successful, N total" counts the packages that OPTED IN and says
      # nothing about the workspace. MEASURED on 6744725c58d6657b0e: a 4000-key
      # object appended to packages/nextjs-query/src/index.ts took
      # dist/index.mjs from 291 B to 238114 B and `turbo run size` still
      # printed "14 successful, 14 total", EXIT=0 — nextjs-query declared no
      # `size` script. The same hole swallowed a package with a deliberately
      # failing test file and no `test` script ("20 successful, 20 total").
      # This step derives the package set from pnpm-workspace.yaml and demands
      # a byte ceiling of every published library and a runnable suite of every
      # package that ships test files. No step below can be trusted without it:
      # a green Bundle budget means "the budgeted packages are within budget",
      # and only this step says which packages those are. Runs on the manifests
      # alone, so it is placed before Build and costs seconds.
      - name: "Turbo task coverage selftest (proves the coverage gate can still lose)"
        run: node scripts/check-turbo-task-coverage.mjs --selftest

      - name: "Turbo task coverage (every published package has a byte ceiling; every test-shipping package runs its tests)"
        run: node scripts/check-turbo-task-coverage.mjs

      # COVERAGE for js/scripts/ ITSELF (task-c0bde7ffbabafb07). The step above
      # proves every PACKAGE has a runnable task; this one proves every SCRIPT in
      # js/scripts/ is actually run by something. check-no-node-imports.selftest.sh
      # sat in that directory with no caller at all and rotted to 10 of 13 cases
      # failing, while reading to anyone grepping like a second layer of proof for
      # the edge gate. The two repo censuses that hunt this class
      # (shell-harnesses.yml, posix-vacuous-green-census.yml) are scoped to the
      # ROOT scripts/ and reach nothing under js/. Manifest-and-workflow reading
      # only, so it costs seconds and sits before Build with its sibling.
      #
      # The selftest arm is a POSITIVE CONTROL, not decoration: a coverage guard
      # whose scan enumerates nothing reports no orphans and exits 0. It points
      # the same audit at a fixture tree with a planted orphan of every shape and
      # requires it to NAME each one.
      - name: "Harness wiring selftest (proves the coverage scan can SEE its population)"
        run: node scripts/check-harness-wiring.mjs --selftest

      - name: "Harness wiring (every script under js/scripts is run by a workflow step, or waived with a reason)"
        run: node scripts/check-harness-wiring.mjs

      # The changelog gate's own offline selftest. It was DECLARED in
      # js/package.json as `selftest:changesets` and run by nothing — the second
      # member of the same un-run class, still green today only because nobody had
      # yet changed .changeset/changelog-github-batched.cjs under it. A
      # declaration is not an invocation; this step is the invocation, and
      # check-harness-wiring above reds if it is ever removed again.
      - name: "Changeset changelog selftest (concurrency cap + transport-vs-semantic retry, offline)"
        run: pnpm run selftest:changesets

      - name: Cache turbo task outputs (js/.turbo)
        # turbo 2 replays build/test/lint/typecheck for packages whose inputs did not
        # change; without this cache every PR run started cold. Key on the lockfile +
        # sha, restore the newest prefix match (task-4e377262789d8fd3).
        uses: actions/cache@v4
        with:
          path: js/.turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('js/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('js/pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      # Scope (task-4e377262789d8fd3): on a PR, turbo runs build/test/lint/typecheck/size
      # only for packages whose inputs changed since the base, plus their dependents
      # (`...[origin/<base>]`). Two packages are ALWAYS in scope because later steps
      # read their dist directly: @barkpark/codegen (drift gate) and @barkpark/core
      # (workerd + browser proofs). A PR that touches anything outside js/packages/*
      # (this workflow, turbo.json, the lockfile, tsconfig.base, web fixtures) runs
      # the FULL graph, so a CI or infra change can never scope itself into a
      # vacuous green. main always runs the full graph.
      - name: Decide turbo scope
        id: scope
        run: |
          set -f  # never let the shell glob `...[origin/<base>]`
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "filter=" >> "$GITHUB_OUTPUT"; echo "scope: FULL (push)"; exit 0
          fi
          base="origin/${{ github.base_ref }}"
          changed=$(git -C .. diff --name-only "$base"...HEAD)
          printf '%s\n' "$changed" | sed 's/^/  changed: /'
          if printf '%s\n' "$changed" | grep -vqE '^js/packages/[^/]+/'; then
            echo "filter=" >> "$GITHUB_OUTPUT"; echo "scope: FULL (a file outside js/packages/* changed)"; exit 0
          fi
          f="--filter=...[$base] --filter=@barkpark/codegen --filter=@barkpark/core"
          echo "filter=$f" >> "$GITHUB_OUTPUT"
          echo "scope: SCOPED $f"
          pnpm exec turbo run test $f --dry-run=json | node -e '
            let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);
            const pk=[...new Set(j.tasks.map(t=>t.package))];console.log(`scope: ${pk.length} packages: ${pk.join(" ")}`)})'

      - name: Build
        run: pnpm exec turbo run build ${{ steps.scope.outputs.filter }}

      # Drift gate: the committed generated types MUST equal a fresh regen from
      # the committed schema fixture. Network-free (`--from` reads the fixture —
      # GitHub Actions cannot reach the live API). A schema-fixture change that
      # was not regenerated-and-committed fails the PR here, loudly. Runs AFTER
      # Build so packages/codegen/dist/cli.mjs exists. Deterministic: the
      # generator sorts schemas/fields/unions, so the same fixture → byte-stable
      # output. Paths are repo-root-relative (this job's cwd is `js/`).
      - name: "Codegen drift gate (generated types match the committed schema)"
        run: |
          node packages/codegen/dist/cli.mjs generate \
            --from ../web/lib/barkpark.schema.json \
            --dataset production \
            --output ../web/lib/barkpark.types.ts
          git -C .. diff --exit-code -- web/lib/barkpark.types.ts

      # The @barkpark/media-parity W4 proof runs its vitest suite in BROWSER mode
      # (headless Playwright chromium) — the only runtime where mermaid emits a
      # real SVG and asciinema-player mounts. `pnpm test` (turbo) runs that
      # package's default `test` script, so chromium MUST be installed BEFORE the
      # test step or the browser proof errors out. Without this the media
      # hydration vertical never gates. Cache keyed on the lockfile so a browser
      # is fetched only when a dependency (hence a pinned Playwright) changes.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('js/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # NOTE on emptiness: `vitest run` exits 1 when it finds no test files, so
      # each package's gate reds on an empty suite — EXCEPT in projects mode,
      # where an empty project passes as long as a sibling project has files.
      # @barkpark/nextjs therefore runs its two projects as separate commands
      # (see its package.json `test`), and no config may set passWithNoTests.
      - name: Test
        # `pnpm test -- --coverage` never worked: pnpm hands `--coverage` to turbo
        # itself ("unexpected argument '--coverage'"). The old advisory duplicate
        # had been failing that way silently under continue-on-error, so no
        # coverage artifact ever existed. One blocking run, no coverage flag;
        # real coverage is its own row.
        run: pnpm exec turbo run test ${{ steps.scope.outputs.filter }}

      # REGISTRATION for js/scripts/check-vitest-projects.mjs, added by the PR
      # that creates it. Execution floor for every project js/vitest.config.mts
      # declares: it asks vitest for the declared set, runs them, and reds if
      # any executed ZERO tests. #19085 was one instance — react-browser
      # inherited a setupFiles path above the repo root, printed "Tests no
      # tests" on every run, and nothing here noticed, because the steps above
      # never invoke the root config's projects at all. Runs AFTER Test so the
      # build + browser install are in place. Asserts on COUNTS, never on
      # vitest's exit code — see the emptiness note above: in projects mode an
      # empty project exits 0.
      - name: "Every declared vitest project actually executed (#19085 class)"
        run: node scripts/check-vitest-projects.mjs

      # @barkpark/core advertises edge/worker runtime support, and the two files
      # that look like the proof of that claim were the two that never ran: `pnpm
      # test` uses vitest.config.ts, which EXPLICITLY excludes
      # tests/runtime.workerd.test.ts and tests/runtime.browser.test.ts, and the
      # `test:workerd` / `test:browser` / `test:all` scripts appeared nowhere in
      # .github/**, turbo.json or any Makefile. So the runtime claim was gated by
      # nothing. These two steps are the gate. (The chromium install above already
      # existed for another package's browser proof; test:browser now uses it too
      # instead of it being paid for and half-used.)
      #
      # A SEPARATE trap lives in the `pnpm --filter` shape itself, distinct from
      # the node --test / vitest zero-match modes fixed elsewhere: `pnpm --filter
      # <name> <script>` prints "No projects matched the filters" and EXITS 0
      # when the filter matches zero workspace packages. Measured: filtering on a
      # renamed package name reproduces this exactly — the step goes green having
      # run nothing. A rename of @barkpark/core, or a typo here, would silently
      # delete this exact edge-runtime proof again. Both steps below capture
      # output and grep for that literal message before trusting pnpm's exit code.
      - name: "Test — @barkpark/core under workerd (edge runtime proof)"
        run: |
          set +e
          out="$(pnpm --filter @barkpark/core test:workerd 2>&1)"
          status=$?
          set -e
          echo "$out"
          if echo "$out" | grep -q "No projects matched the filters"; then
            echo "core gate FAILED: pnpm --filter matched ZERO packages — @barkpark/core was renamed, moved, or removed and this step silently ran nothing" >&2
            exit 1
          fi
          exit "$status"

      - name: "Test — @barkpark/core under a real browser"
        run: |
          set +e
          out="$(pnpm --filter @barkpark/core test:browser 2>&1)"
          status=$?
          set -e
          echo "$out"
          if echo "$out" | grep -q "No projects matched the filters"; then
            echo "core gate FAILED: pnpm --filter matched ZERO packages — @barkpark/core was renamed, moved, or removed and this step silently ran nothing" >&2
            exit 1
          fi
          exit "$status"

      - name: Lint
        run: pnpm exec turbo run lint ${{ steps.scope.outputs.filter }}

      - name: "Prettier format (ADVISORY — parity with gofmt + mix-format gates)"
        continue-on-error: true
        run: pnpm exec prettier --check "packages/*/src/**/*.{ts,tsx}"

      - name: Typecheck
        run: pnpm exec turbo run typecheck ${{ steps.scope.outputs.filter }}

      - name: Bundle budget
        run: pnpm exec turbo run size ${{ steps.scope.outputs.filter }}

      # ADVISORY (not blocking) until the ADR-002 conflict is decided:
      # webhook/ and draft-mode/ have imported node:crypto since their Phase 5
      # birth, violating the locked edge contract the script enforces — never
      # caught because no CI ran this script before 2026-06-11. Conforming
      # means porting HMAC to Web Crypto, which makes the exported
      # signDraftModeToken async (breaking); relaxing means an amendment ADR.
      # Tracked in docs/decisions/deferred.md. Same advisory-job precedent as
      # elixir.yml's format job.
      #
      # The ADVISORY posture covers exit 1 — a real ADR-002 violation — ONLY. The
      # guard's exit 3 is a HARNESS failure (a corpus dir vanished, or scanned
      # zero source files) and MUST red: a corpus floor that `continue-on-error`
      # swallows cannot fire, and the vanished-corpus mode is the one that used
      # to print "clean" at exit 0. Hence the explicit status split below instead
      # of `continue-on-error: true` on the step.
      # FAILS THIS JOB (no continue-on-error), and deliberately ahead of the
      # scan below. THIS IS NOT A CLAIM OF MERGE AUTHORITY, and the earlier
      # wording of this comment was: js-tests.yml's `test` job is paths-filtered
      # and is an S4 exclusion in .github/required-checks.json, so it renders no
      # required context and gates no merge on a PR that touches no js/ path.
      # What the placement buys is narrower and real: the scan's own advisory
      # posture means a broken scan is nearly invisible — exit 1 only warns, and
      # the corpus floor is the one thing that reds. --selftest is what proves
      # that floor, and the four import shapes, still bite — it plants its
      # specimens in a throwaway tree, never in the real corpus, so it cannot
      # perturb the scan that follows.
      - name: "Edge gate selftest (proves check-no-node-imports can still lose)"
        run: bash scripts/check-no-node-imports.sh --selftest

      - name: "No node: imports in edge packages (ADVISORY on violations, BLOCKING on an unreadable corpus)"
        run: |
          set +e
          bash scripts/check-no-node-imports.sh
          status=$?
          set -e
          if [ "$status" -eq 3 ]; then
            echo "edge gate FAILED: check-no-node-imports could not read its corpus (exit 3) — it scanned nothing and proved nothing" >&2
            exit 1
          fi
          if [ "$status" -eq 1 ]; then
            echo "::warning::check-no-node-imports found violation(s) — ADVISORY pending the ADR-002 decision (docs/decisions/deferred.md)"
          fi
          exit 0

      # ADVISORY (cqv3-p3): emit REAL line coverage so the codebase-quality
      # tooling (tooling/risk) ingests coverage-final.json instead of the
      # presence proxy. The `json` reporter is configured in each package's
      # vitest.config.ts; turbo's test task already declares coverage/** outputs.
      # Never blocks — coverage is an observability signal, not a merge gate.
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: js-coverage
          path: js/packages/*/coverage/coverage-final.json
          if-no-files-found: ignore

  changesets:
    name: Changeset present (PRs only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node (pnpm store cached on the lockfile)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # cache: pnpm needs pnpm on PATH first, hence the reorder above
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # Exits non-zero when packages/** changed against the base branch
      # without a changeset — the js/CLAUDE.md "CI blocks otherwise" rule,
      # enforced for real since 2026-06-11.
      - name: Changeset status
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
