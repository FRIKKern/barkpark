name: PortableDoc editor release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after the release gates are signed off
        type: boolean
        default: false
      approved_sha256:
        description: SHA-256 of the tarball tested by the app matrix (required for publish)
        type: string

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api/assets/paper-editor
    # The publish job has no checkout, so it takes the tarball name from here.
    outputs:
      version: ${{ steps.release.outputs.version }}
      tarball: ${{ steps.release.outputs.tarball }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.18.0
      - run: npm ci
      # The version is whatever package.json says, but only an alpha of 0.1.0:
      # this package is never 1.0, and it only ever goes out on the alpha tag.
      # pack:check then refuses a version the release record already holds
      # with other bytes (scripts/releases.json).
      - name: Read the release version from package.json
        id: release
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          tag=$(node -p 'require("./package.json").publishConfig?.tag ?? "alpha"')
          [[ "$name" == '@portable-doc/editor' ]] || { echo "::error::package name is $name, not @portable-doc/editor"; exit 1; }
          [[ "$version" =~ ^0\.1\.0-alpha\.[0-9]+$ ]] || { echo "::error::version $version is not 0.1.0-alpha.N"; exit 1; }
          [[ "$tag" == alpha ]] || { echo "::error::publishConfig.tag is $tag, not alpha"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tarball=portable-doc-editor-$version.tgz" >> "$GITHUB_OUTPUT"
      - name: Verify the exact release tarball and dry-run publish
        env:
          TARBALL: ${{ steps.release.outputs.tarball }}
        run: |
          npm run pack:check -- "$RUNNER_TEMP/editor-release"
          cd "$RUNNER_TEMP/editor-release"
          sha256sum "$TARBALL" > SHA256SUMS
          npm publish "$TARBALL" --access public --tag alpha --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: portable-doc-editor
          path: ${{ runner.temp }}/editor-release/
          if-no-files-found: error

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: pack
    runs-on: ubuntu-24.04
    environment: portable-doc-editor-release
    permissions:
      id-token: write
    concurrency: portable-doc-editor-publish
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.18.0
      - uses: actions/download-artifact@v4
        with:
          name: portable-doc-editor
      - name: Verify approved digest and publish with provenance
        env:
          PUBLISH_ENABLED: ${{ vars.PORTABLE_DOC_EDITOR_PUBLISH_ENABLED }}
          APPROVED_SHA256: ${{ inputs.approved_sha256 }}
          TARBALL: ${{ needs.pack.outputs.tarball }}
        run: |
          test "$PUBLISH_ENABLED" = true
          sha256sum --check SHA256SUMS
          printf '%s  %s\n' "$APPROVED_SHA256" "$TARBALL" | sha256sum --check --strict
          npm publish "$TARBALL" --access public --tag alpha --provenance
