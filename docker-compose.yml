services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: barkpark_prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - DATABASE_URL=ecto://postgres:postgres@db/barkpark_prod
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:-$(openssl rand -base64 48)}
      - PHX_HOST=${PHX_HOST:-localhost}
      - PORT=4000
      # Bare passthrough on purpose: only set in the container when set in the
      # invoking shell. NEVER ${BARKPARK_PLUGINS:-} — that expands an unset var
      # to the empty string, which is the plugin KILL SWITCH server-side.
      - BARKPARK_PLUGINS
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
