services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: barkpark_prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    ports:
      - "${PORT:-4000}:4000"
    environment:
      - DATABASE_URL=ecto://postgres:postgres@db/barkpark_prod
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:-$(openssl rand -base64 48)}
      - PHX_HOST=${PHX_HOST:-localhost}
      - PORT=4000
      # Secrets the prod runtime.exs REQUIRES (raises on boot without them). The
      # cloak key encrypts plugin-settings + TOTP secrets; the KEK wraps the
      # envelope DEKs for field-level encryption (core-auth); preview JWT signs
      # draft-preview links. Supplied via the repo-root .env for local staging.
      - BARKPARK_CLOAK_KEY=${BARKPARK_CLOAK_KEY:?set BARKPARK_CLOAK_KEY in .env}
      - BARKPARK_KEK=${BARKPARK_KEK:?set BARKPARK_KEK in .env}
      - PREVIEW_JWT_SECRET=${PREVIEW_JWT_SECRET:?set PREVIEW_JWT_SECRET in .env}
      # Boot-time seed profile: `clean` skips the heavy demo dataset (avoids the
      # codelist-seed memory pressure); `demo` for a populated stage.
      - BARKPARK_SEED_PROFILE=${BARKPARK_SEED_PROFILE:-clean}
      # Bare passthrough on purpose: only set in the container when set in the
      # invoking shell. NEVER ${BARKPARK_PLUGINS:-} — that expands an unset var
      # to the empty string, which is the plugin KILL SWITCH server-side.
      - BARKPARK_PLUGINS
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
