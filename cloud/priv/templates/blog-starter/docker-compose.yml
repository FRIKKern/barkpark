services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barkpark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barkpark}
      POSTGRES_DB: ${POSTGRES_DB:-barkpark_dev}
    ports:
      - "5432:5432"
    volumes:
      - barkpark_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barkpark}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # The published image, built from each server release by
    # .github/workflows/api-image.yml in the barkpark repo. To build from a
    # checkout instead, see docker-compose.override.yml.example.
    image: ghcr.io/barkpark/api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-barkpark}:${POSTGRES_PASSWORD:-barkpark}@postgres:5432/${POSTGRES_DB:-barkpark_dev}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-change-me-to-a-64-char-random-string-for-local-dev-only-not-for-prod}
      PHX_HOST: ${PHX_HOST:-localhost}
      PORT: "4000"
      MIX_ENV: prod
      # The release refuses to boot without these four (config/runtime.exs).
      # Put them in a `.env` beside this file; the README says how to make them.
      BARKPARK_CLOAK_KEY: ${BARKPARK_CLOAK_KEY:?set BARKPARK_CLOAK_KEY in .env — openssl rand -base64 32}
      BARKPARK_KEK: ${BARKPARK_KEK:?set BARKPARK_KEK in .env — openssl rand -base64 32}
      PREVIEW_JWT_SECRET: ${PREVIEW_JWT_SECRET:?set PREVIEW_JWT_SECRET in .env — openssl rand -base64 48}
      BARKPARK_RELEASE_CAPTURE_HMAC_SECRET: ${BARKPARK_RELEASE_CAPTURE_HMAC_SECRET:?set BARKPARK_RELEASE_CAPTURE_HMAC_SECRET in .env — openssl rand -base64 48}
    ports:
      - "4000:4000"

volumes:
  barkpark_pgdata:
