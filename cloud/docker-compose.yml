# Barkpark Cloud control plane — turnkey local/prod compose.
#
# The operator exports their secrets, then runs:
#     docker compose -f cloud/docker-compose.yml --profile blue up -d --build
# The control_plane slot migrates the DB on boot, then serves the JSON API on
# :4100. Front it with Caddy for api.barkpark.cloud TLS (see the go-live runbook,
# Gate 3).
#
# Blue/green: the control plane is defined twice behind compose profiles —
# slot `blue` publishes host :4100, slot `green` :4101; both run the same
# image, and exactly ONE is up at a time. deploy/cp-deploy.sh hot-swaps them
# (boot idle slot → health-gate → flip Caddy's upstream → stop old slot) so a
# deploy never drops barkpark.cloud. Outside that flow just use `blue`
# (COMPOSE_PROFILES=blue in .env makes plain `up -d` do the right thing).
#
# Secrets are passthrough-only: a bare `KEY` under environment imports the value
# from the invoking shell ONLY when it is set there — nothing secret is written
# in this file. Copy .env.example to .env and fill it, OR `export` the vars
# before `up`. NEVER commit a real .env.

x-control-plane: &control_plane
  image: cloud-control_plane:latest
  build: .
  depends_on:
    db:
      condition: service_healthy
  environment:
    # Non-secret default: points at the bundled db service. Override DATABASE_URL
    # in your shell/.env to use an external Postgres. ecto:// scheme per
    # runtime.exs; the userinfo here matches the db service defaults above.
    - DATABASE_URL=${DATABASE_URL:-ecto://barkpark_cloud:barkpark_cloud@db/barkpark_cloud_prod}
    - PORT=4100
    - POOL_SIZE=${POOL_SIZE:-10}
    # ── Secrets — passthrough ONLY (no default). The container raises at boot
    # if these are unset (runtime.exs). Set them in your shell or .env. ──────
    - REGISTRY_ENCRYPTION_KEY
    - STRIPE_SECRET_KEY
    - STRIPE_WEBHOOK_SECRET
    - STRIPE_PRICE_SUPPORTER
    - STRIPE_PRICE_SUPPORT_PLUS
    - WORKER_TOKEN
    # OAuth SSO (#680): OAUTH_STATE_SECRET is a hard boot raise in prod —
    # same passthrough-only rule as the secrets above. Provider client ids
    # are optional (provider disabled when unset).
    - OAUTH_STATE_SECRET
    - OAUTH_BASE_URL=${OAUTH_BASE_URL:-https://barkpark.cloud}
    - GITHUB_OAUTH_CLIENT_ID
    - GITHUB_OAUTH_CLIENT_SECRET
    - GOOGLE_OAUTH_CLIENT_ID
    - GOOGLE_OAUTH_CLIENT_SECRET
    # Trial tier (dwb-13): optional knob, defaults to 14 in runtime.exs.
    - TRIAL_DAYS
    # Zero-paste Vercel handoff (task-4e4a53b101a97051): passthrough-only, both
    # optional — unset means the feature is OFF (503 feature_not_configured) and
    # the SPA keeps the classic clone-URL flow. Set VERCEL_PLATFORM_TOKEN in
    # cloud/.env to activate; VERCEL_TEAM_ID only for a team-scoped token.
    - VERCEL_PLATFORM_TOKEN
    - VERCEL_TEAM_ID
    # Platform-operator allowlist (isu-w5 / GR60): comma-separated emails of
    # REGISTERED accounts. Passthrough-only and optional — unset means `[]`,
    # which fails CLOSED in BOTH directions: /v1/me reports
    # platform_operator:false for everyone (the Operator console link hides and
    # all /v1/operator/* routes 403), and the daily fleet digest stays a logged
    # no-op. Without this bare line compose passes NOTHING (see the rule at the
    # top of this file), so setting it in .env alone would set it on the HOST
    # and leave the CONTAINER blind.
    - PLATFORM_ADMIN_EMAILS
    # Mail (notifications-email): defaults point at the bundled `postfix`
    # sidecar below (self-hosted, no third-party provider). SMTP_USERNAME/
    # PASSWORD are passthrough-only, shared with the postfix service's own
    # env so both sides agree on the submission credential. See
    # cloud/postfix/README.md.
    - SMTP_HOST=${SMTP_HOST:-postfix}
    - SMTP_PORT=${SMTP_PORT:-587}
    - SMTP_USERNAME
    - SMTP_PASSWORD
    - SMTP_VERIFY_PEER=${SMTP_VERIFY_PEER:-false}
    - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-noreply@barkpark.cloud}
    - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Barkpark Cloud}
    # cch-w1-peer-ip-pin: the peers whose X-Forwarded-For may move
    # conn.remote_ip. Caddy runs as a HOST service proxying to localhost:4100,
    # and Docker's hairpin NAT rewrites the source the container sees to the
    # bridge GATEWAY — so in prod the peer is the gateway, never 127.0.0.1, and
    # without this every session recorded 172.18.0.1 (measured: 48 of 49 rows)
    # and the device-auth rate bucket collapsed into one global bucket.
    #
    # The default is the .1 gateway of the subnet PINNED under `networks:` at
    # the bottom of this file — these two values MUST move together. Individual
    # addresses only, never a CIDR range: the `postfix` service below publishes
    # 0.0.0.0:587 to the internet from this same network, so trusting the whole
    # subnet would let it forge any client's IP.
    - TRUSTED_PROXY_PEERS=${TRUSTED_PROXY_PEERS:-172.18.0.1}
    # Serving sha (dr-w20-s1): the commit this slot is running, surfaced by
    # BarkparkCloud.Health.serving/0 on GET /health. Passthrough-only and
    # deliberately WITHOUT a default — absent means git_sha: null, an honest
    # "this box predates the reader", never an invented value. deploy/cp-deploy.sh
    # exports it from the sha it just checked out, AFTER sourcing cloud/.env, so
    # a stale .env value cannot win. Without this bare line compose passes
    # NOTHING (see the rule at the top of this file) and the container reports
    # null forever while looking built.
    - BARKPARK_GIT_SHA
  restart: unless-stopped

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barkpark_cloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barkpark_cloud}
      POSTGRES_DB: ${POSTGRES_DB:-barkpark_cloud_prod}
    volumes:
      - cloud_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barkpark_cloud}"]
      interval: 5s
      timeout: 5s
      retries: 5

  control_plane_blue:
    <<: *control_plane
    profiles: ["blue"]
    ports:
      - "127.0.0.1:${PORT_BLUE:-4100}:4100"

  control_plane_green:
    <<: *control_plane
    profiles: ["green"]
    ports:
      - "127.0.0.1:${PORT_GREEN:-4101}:4100"

  # Self-hosted outbound mail relay (Postfix + OpenDKIM) — see
  # cloud/postfix/README.md for DNS records, TLS cert, and the Hetzner
  # port-25 unblock this needs in prod.
  #
  # Submission (587) is published so the SEPARATE content-instance boxes
  # (guerrilla, prod — not on this compose network) can relay their identity
  # mail (magic-link / password-reset / verify-email) through it, with
  # SMTP_HOST=mail.barkpark.cloud. This is NOT an open relay: postfix's
  # smtpd_relay_restrictions = permit_sasl_authenticated, reject_unauth_
  # destination — a client must present the SASL credential to send, exactly
  # like any public mail-submission service. The control_plane still reaches
  # it in-network as `postfix`.
  postfix:
    build: ./postfix
    ports:
      - "587:587"
    environment:
      - SMTP_USERNAME
      - SMTP_PASSWORD
      - MAIL_HOSTNAME=${MAIL_HOSTNAME:-mail.barkpark.cloud}
      - MAIL_DOMAIN=${MAIL_DOMAIN:-barkpark.cloud}
      - DKIM_SELECTOR=${DKIM_SELECTOR:-mail}
    volumes:
      - postfix_dkim:/etc/opendkim/keys
      - postfix_queue:/var/spool/postfix
      - postfix_tls:/etc/postfix/tls
    restart: unless-stopped

# cch-w1-peer-ip-pin (charter D6). This block did not exist before: the network
# was auto-created and its subnet AUTO-ALLOCATED, landing on 172.18.0.0/16 only
# because a pre-existing default bridge had taken 172.17.0.0/16.
#
# That mattered because the control plane trusts the bridge GATEWAY's
# X-Forwarded-For (see TRUSTED_PROXY_PEERS above): with an allocation-order
# subnet, the very next `docker compose down && up` on a differently-populated
# host silently moves the gateway, and the trust check degrades back into the
# permanent no-op it was — while its tests keep passing. Pinning the subnet is
# what makes the pinned peer a fact instead of a coincidence.
#
# If you change this subnet, change TRUSTED_PROXY_PEERS to match its .1 gateway
# in the SAME commit.
#
# DEPLOY NOTE — READ BEFORE MERGING THIS TO A LIVE BOX. The stack's network
# ALREADY EXISTS on prod, created without an explicit `ipam` block. Compose
# compares the declared network against the live one and refuses `up` with
# "network ... needs to be recreated" when they differ, EVEN IF the subnet value
# is identical, because the live network carries no ipam config to match. That
# aborts deploy/cp-deploy.sh at the slot boot (exit 13) — which is the SAFE
# failure (the active slot keeps serving and git resets), but the deploy will
# not land until an operator recreates the network ONCE:
#
#     docker compose -f cloud/docker-compose.yml --profile blue --profile green down
#     docker compose -f cloud/docker-compose.yml --profile blue up -d
#
# That down/up is the only brief interruption; every subsequent deploy is a
# normal hot-swap again. Verified structurally only — this repo's build hosts
# have no `docker compose` subcommand, so it was never executed against a live
# network.
networks:
  default:
    ipam:
      config:
        - subnet: 172.18.0.0/16

volumes:
  cloud_pgdata:
  postfix_dkim:
  postfix_queue:
  postfix_tls:
