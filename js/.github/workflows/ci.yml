# ############################################################################
# INERT — GitHub Actions NEVER RUNS THIS FILE.
#
# Actions only reads workflows from `.github/workflows/` at the REPOSITORY
# ROOT. Everything under `js/.github/workflows/` is dead configuration: it is
# not in `gh api repos/<owner>/<repo>/actions/workflows` (63 registered
# workflows, none under js/), it produces no check run, and nothing it asserts
# about CI behaviour is true of this repository.
#
# The real js/ gate is `.github/workflows/js-tests.yml` at the repo root.
#
# This header exists because a comment in THIS TREE claiming a "+2% bundle-size
# regression gate" was copied into js/CLAUDE.md and docs/cards/js-sdk.md, where
# it told every agent that a mechanism existed which never had. An inert file
# that describes gate behaviour is a lie with a long reach.
# ############################################################################

name: js-ci
on:
  push:
    branches: [main]
    paths: ['js/**']
  pull_request:
    paths: ['js/**']

concurrency:
  group: js-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: 'grep-test no node: imports on edge surfaces'
        run: bash scripts/check-no-node-imports.sh

  test-node:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test -- --project=core --project=codegen --project=nextjs --project=react

  test-bun:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: bun test packages/core/tests

  test-workerd:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test -- --project=core-workerd

  test-browser:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm build
      - run: pnpm test -- --project=react-browser

  build-and-size:
    needs: [test-node, test-bun, test-workerd, test-browser]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # `pnpm size` enforces the ABSOLUTE per-entry caps in each package's
      # .size-limit.json. It is a bare invocation: no --compare-with, no stored
      # baseline, no percentage. (An earlier comment here claimed a "+2%
      # regression gate"; that mechanism never existed, and the claim was
      # copied from here into js/CLAUDE.md and docs/cards/js-sdk.md.)
      - run: pnpm size

  changeset-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm changeset status --since=origin/main
