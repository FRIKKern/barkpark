<div data-demo-row>
  <span data-demo-label>Chosen, and a placeholder</span>
  <ui-field id="select-role-field" data-slot="field">
    <ui-field-label id="select-role-label" data-slot="field-label" for="select-role-trigger">Role</ui-field-label>
    <ui-select id="select-role" default-value="editor" data-slot="select" data-closed="">
      <ui-select-trigger><button id="select-role-trigger" type="button" data-slot="select-trigger" role="combobox" aria-haspopup="listbox" aria-expanded="false" data-closed="" aria-labelledby="select-role-label"><ui-select-value data-slot="select-value" id="select-role-value">Editor</ui-select-value></button></ui-select-trigger>
      <ui-select-content id="select-role-content" hidden="" data-slot="select-content">
        <ui-select-item id="select-role-viewer" value="viewer" data-slot="select-item" role="option" tabindex="-1" aria-selected="false">Viewer<ui-select-item-indicator hidden="" data-slot="select-item-indicator"></ui-select-item-indicator></ui-select-item>
        <ui-select-item id="select-role-editor" value="editor" data-slot="select-item" role="option" tabindex="-1" aria-selected="true" data-selected="">Editor<ui-select-item-indicator data-slot="select-item-indicator" aria-hidden="true" data-selected=""></ui-select-item-indicator></ui-select-item>
        <ui-select-item id="select-role-owner" value="owner" disabled="" data-slot="select-item" role="option" tabindex="-1" aria-selected="false" aria-disabled="true" data-disabled="">Owner<ui-select-item-indicator hidden="" data-slot="select-item-indicator"></ui-select-item-indicator></ui-select-item>
        <ui-select-item id="select-role-admin" value="admin" data-slot="select-item" role="option" tabindex="-1" aria-selected="false">Admin<ui-select-item-indicator hidden="" data-slot="select-item-indicator"></ui-select-item-indicator></ui-select-item>
      </ui-select-content>
    </ui-select>
  </ui-field>
  <ui-field id="select-status-field" data-slot="field">
    <ui-field-label id="select-status-label" data-slot="field-label" for="select-status-trigger">Status</ui-field-label>
    <ui-select id="select-status" placeholder="Pick a status" data-slot="select" data-closed="">
      <ui-select-trigger><button id="select-status-trigger" type="button" data-slot="select-trigger" role="combobox" aria-haspopup="listbox" aria-expanded="false" data-placeholder="" data-closed="" aria-labelledby="select-status-label"><ui-select-value data-slot="select-value" id="select-status-value" data-placeholder="">Pick a status</ui-select-value></button></ui-select-trigger>
      <ui-select-content id="select-status-content" hidden="" data-slot="select-content">
        <ui-select-item id="select-status-draft" value="draft" data-slot="select-item" role="option" tabindex="-1" aria-selected="false">Draft<ui-select-item-indicator hidden="" data-slot="select-item-indicator"></ui-select-item-indicator></ui-select-item>
        <ui-select-item id="select-status-live" value="live" data-slot="select-item" role="option" tabindex="-1" aria-selected="false">Live<ui-select-item-indicator hidden="" data-slot="select-item-indicator"></ui-select-item-indicator></ui-select-item>
      </ui-select-content>
    </ui-select>
  </ui-field>
</div>
<div data-demo-row>
  <span data-demo-label>Disabled</span>
  <ui-field id="select-team-field" disabled="" data-slot="field" data-disabled="">
    <ui-field-label id="select-team-label" data-slot="field-label" for="select-team-trigger" data-disabled="">Team</ui-field-label>
    <ui-select id="select-team" default-value="design" disabled="" data-slot="select" data-disabled="" data-closed="">
      <ui-select-trigger><button id="select-team-trigger" type="button" data-slot="select-trigger" role="combobox" aria-haspopup="listbox" aria-expanded="false" disabled="" data-closed="" data-disabled="" aria-labelledby="select-team-label"><ui-select-value data-slot="select-value" id="select-team-value">Design</ui-select-value></button></ui-select-trigger>
      <ui-select-content id="select-team-content" hidden="" data-slot="select-content">
        <ui-select-item id="select-team-design" value="design" data-slot="select-item" role="option" tabindex="-1" aria-selected="true" data-selected="">Design<ui-select-item-indicator data-slot="select-item-indicator" aria-hidden="true" data-selected=""></ui-select-item-indicator></ui-select-item>
      </ui-select-content>
    </ui-select>

<div data-demo-row inert>
  <span data-demo-label>Trigger: rest, hover, focus, open</span>
  <button data-slot="select-trigger" role="combobox" aria-haspopup="listbox" aria-expanded="false" type="button" data-closed=""><span data-slot="select-value">Rest</span></button>
  <button data-slot="select-trigger" role="combobox" aria-haspopup="listbox" aria-expanded="false" type="button" data-closed="" data-pin="hover"><span data-slot="select-value">Hover</span></button>
  <button data-slot="select-trigger" role="combobox" aria-haspopup="listbox" aria-expanded="false" type="button" data-closed="" data-pin="focus-visible"><span data-slot="select-value">Focus</span></button>
  <button data-slot="select-trigger" role="combobox" aria-haspopup="listbox" aria-expanded="true" type="button" data-open=""><span data-slot="select-value">Open</span></button>
</div>
<div data-demo-row inert>
  <span data-demo-label>The list: highlighted, chosen, disabled</span>
  <div data-slot="select-content" role="listbox" aria-label="The list">
    <div data-slot="select-item" role="option" aria-selected="false" data-highlighted="">Highlighted<span data-slot="select-item-indicator" hidden=""></span></div>
    <div data-slot="select-item" role="option" aria-selected="true" data-selected="">Chosen<span data-slot="select-item-indicator" aria-hidden="true" data-selected=""></span></div>
    <div data-slot="select-item" role="option" aria-selected="false" aria-disabled="true" data-disabled="">Disabled<span data-slot="select-item-indicator" hidden=""></span></div>
    <div data-slot="select-item" role="option" aria-selected="false">Rest<span data-slot="select-item-indicator" hidden=""></span></div>
  </div>
</div>
