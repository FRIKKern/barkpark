function tick(){
  var now=performance.now();
  var raw=Math.min(0.5,(now-lastTickAt)/1000);
  lastTickAt=now;
  var sc=SCENES[S.i];
  if(!sc||sc.t==='end')return;
  var dt=raw*S.speed;
  if(sc.t==='gate'){
    if(PROPS.attended===false){pick(sc.g,def(sc.g));return;}
    var c=cdn();
    if(c>0){
      var g=S.gateT+dt;
      if(g>=c){pick(sc.g,def(sc.g));return;}
      setState({gateT:g,totalT:S.totalT+dt});
    } else setState({totalT:S.totalT+dt,t:Math.min(600,S.t+dt)});
    return;
  }
  if(sc.t==='strat'){
    var p={totalT:S.totalT+dt,t:Math.min(999,S.t+dt)};
    if(S.stage==='intro'&&S.conv.length===0&&p.t>0.6){
      p.conv=[{who:'sys',text:'CHARTER AND WISH READ · READY FOR INSTRUCTIONS'}];
      p.stage='open';
    }
    if(S.pendMsg&&(S.totalT+dt)>=S.pendAt){
      p.conv=(p.conv||S.conv).concat([S.pendMsg]);
      p.pendMsg=null;p.typing=false;p.stage=S.pendStage;
      if(S.pendStage==='auto')p.autoAt=S.totalT+dt;
    }
    if(S.stage==='auto'&&(S.totalT+dt)-(S.autoAt||0)>7){setState({i:3,t:0,gateT:0,totalT:S.totalT+dt});return;}
    setState(p);return;
  }
  var t=S.t+dt;
  if(sc.auto&&t>=sc.dur)setState({i:S.i+1,t:0,gateT:0,totalT:S.totalT+dt});
  else setState({t:Math.min(999,t),totalT:S.totalT+dt});
}

function stratReply(shown){
  var conv=S.conv.concat([{who:'user',text:'YOU — “'+shown+'”'}]);
  var isQ=/\?\s*$/.test(shown);
  var reply=isQ
    ? 'The deny path is central for HTTP; search index reads bypass it, and a red repro exists. Proposed survey plan below — strike or add while I work.'
    : 'Understood — recorded in the Paper. Proposed survey plan below — strike or add while I work.';
  setState({conv:conv,typing:true,pendMsg:{who:'fable',text:reply},pendAt:S.totalT+1.2,pendStage:'auto',chatVal:''});
}

function chatSubmit(){
  var v=S.chatVal.trim();if(!v)return;
  if(S.stage==='open')stratReply(v);
  else if(S.stage==='auto')setState({added:S.added.concat([v]),chatVal:''});
}

function pick(g,c){
  var opt=null,i;
  for(i=0;i<GATES[g].opts.length;i++)if(GATES[g].opts[i].c===c)opt=GATES[g].opts[i];
  if(!opt)opt=GATES[g].opts[0];
  var tt=Math.round(S.totalT*20);
  var at=Math.floor(tt/60)+':'+String(tt%60).padStart(2,'0');
  var log=S.log.concat([{g:g,choice:opt.label,at:at,note:S.noteVal.trim()}]);
  var p={log:log,t:0,gateT:0,noteVal:''};
  if(g===1){p.i=c==='research'?3:c==='skip'?11:8;if(c==='research')p.round2=true;}
  else if(g===2){p.i=c==='more'?8:11;}
  else if(g===3){p.i=c==='redirect'?5:14;if(c==='trim')p.struck=true;}
  else if(g===4){p.i=c==='fix'?14:c==='park'?22:19;if(c==='park')p.ended='parked';}
  else if(g===5){
    if(c==='fire'){p.i=1;p.waveN=S.waveN+1;p.round2=false;p.struck=false;p.ended=null;p.stage='intro';p.conv=[];p.pendMsg=null;p.typing=false;}
    else{p.i=22;p.ended='closed';}
  }
  setState(p);
}

function skip(){
  var sc=SCENES[S.i];
  if(sc.t==='title'&&S.wish.trim().length<4)return;
  if(sc.t==='gate')pick(sc.g,def(sc.g));
  else if(sc.t==='strat')setState({i:3,t:0,gateT:0});
  else if(sc.t!=='end')setState({i:S.i+1,t:0,gateT:0});
}
function restart(){
  setState({i:0,t:0,gateT:0,totalT:0,log:[],struck:false,round2:false,ended:null,waveN:9,
    qStruck:{},added:[],noteVal:'',stage:'intro',conv:[],pendMsg:null,pendAt:0,pendStage:'',
    typing:false,chatVal:'',wish:'',epicSel:null,autoAt:0});
}

  }).concat(S.added.map(function(q,idx){
    return {n:'··',text:q,col:'#e9edf4',deco:'none',tag:'YOURS',tagCol:'#d9a45c',op:'1',

  }));
  var fleetLine=fleetN()+' SONNETS · ONE PER QUESTION';

  var n=fleetN();

    bd:S.epicSel===ix?'rgba(217,164,92,.5)':'rgba(255,255,255,.08)',
    pick:(function(k,w){return function(){setState({epicSel:k,wish:w});};})(ix,e.w)};});
  var epicSelOn=S.epicSel!=null&&sc.t==='title';

  var holdTypes={title:1,coverage:1,plan:1,review:1,debrief:1};
  var holdBtn=!!holdTypes[sc.t];
  var contLabel=sc.t==='title'?'BEGIN →':'CONTINUE →';

      '<button data-b="replay" class="hovC" style="background:transparent;border:none;cursor:pointer;'+MONO+'font-size:9px;letter-spacing:.3em;color:#566072;margin-top:40px;padding:8px">↺ REPLAY</button>';
    q(inner,'[data-b=replay]').addEventListener('click',restart);
    return function(){};
  }
};

/* ---------- render ---------- */
var rendering=false;
function render(){
  if(rendering)return;
  rendering=true;
  try{
    var v=renderVals();
    whisper.style.display=v.chromeOn?'':'none';
    setTxt(whisper,v.topLine);
    chatBar.style.display=v.chatOn?'':'none';
    if(chatIn.placeholder!==v.chatPh)chatIn.placeholder=v.chatPh;
    if(chatIn.value!==S.chatVal)chatIn.value=S.chatVal;
    holdBar.style.display=v.holdBtn?'':'none';
    setTxt(holdBtnEl,v.contLabel);
    setSty(holdBtnEl,'opacity',v.contO);
    dotsRow.style.display=v.chromeOn?'flex':'none';
    ctrls.style.display=v.chromeOn?'flex':'none';
    setTxt(spdBtn,v.spdLabel);
    if(!dotEls)buildDots(v.nodes);
    v.nodes.forEach(function(nd,ix){
      var sp=dotEls[ix];if(!sp)return;
      setSty(sp,'background',nd.bg);
      if(sp.__anim!==nd.anim){sp.__anim=nd.anim;sp.style.animation=nd.anim;}
    });
    if(builtI!==S.i||!sceneEl){
      builtI=S.i;
      var inner=newScene(v);
      var b=BUILDERS[v.sc.t]||BUILDERS.end;
      sceneUpdate=b(inner,v);
    }
    if(sceneUpdate)sceneUpdate(v);
    if(sceneEl)setSty(sceneEl,'opacity',v.sceneOp);
  } finally {
    rendering=false;
  }
}

/* ---------- keyboard + clock ---------- */
window.addEventListener('keydown',function(e){
  var tag=e.target?e.target.tagName:'';
  if(tag==='INPUT'||tag==='TEXTAREA')return;
  var inStrat=SCENES[S.i]&&SCENES[S.i].t==='strat';
  if(e.key==='ArrowRight')skip();
  if((e.key==='Enter'||e.key===' ')&&!inStrat){if(e.key===' ')e.preventDefault();skip();}
  if(e.key==='ArrowLeft')setState({i:Math.max(0,S.i-1),t:0,gateT:0});
});
setInterval(tick,100);
render();
})();
</script>
