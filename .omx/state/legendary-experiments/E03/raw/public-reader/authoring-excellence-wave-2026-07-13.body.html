/*
 * paper-surface.css — the ONE canonical paper-surface stylesheet
 * (Paper editor parity Stage 2, wave 1 · charter Decision 4).
 *
 * SINGLE SOURCE for the portable paper-surface layer: the `--paper-*` theme
 * tokens, the `--bp-*` typography tokens (Stage-1 single-source, #896), and the
 * `.bp-paper-surface` element rules (h1-h6/p/a/ul/ol/li/code/pre/img). The
 * Studio View + Edit panes and the /papers reader all resolve THESE selectors
 * against THESE tokens — parity by construction, not by hand-matched mirrors.
 *
 * Embedded inline, never fetched over the network (CSP + self-contained
 * standalone exports), through
 * Barkpark.PortableDoc.Render.Stylesheet.css/0 (compile-time @external_resource)
 * by three sinks:
 *   - Studio         barkpark_web/layouts/root.html.heex     (<%= raw(css()) %>)
 *   - /papers reader barkpark_web/layouts/bulldocs.html.heex (bp-theme
 *                    `--paper-*` overrides layer AFTER this source)
 *   - sheet export   plugins/sheets/html.ex                  (standalone <head>)
 *
 * EXTRACTED VERBATIM from root.html.heex (values byte-identical — move only):
 *   --paper-* light/dark theme tokens   (was root.html.heex ~2233-2262)
 *   --paper-* fallback tokens + fonts    (was ~2263-2291)
 *   --bp-* typography tokens             (was ~2293-2327)
 *   .bp-paper-surface element rules      (was ~2363-2406)
 *
 * KEPT in root.html.heex (Studio-shell / NOT portable — Decision 4):
 *   surface CHROME (bg/color/font/size/line-height/tracking, max-width, padding,
 *     media-query padding, .bp-paper-body) — the Studio page shell; the reader
 *     owns its own 820/720px bp-theme shell, so surface chrome is NOT shared.
 *   html[data-editor-focus] interplay, .bp-paper-editor-body typography mirror,
 *     the inline-style de-inline override hacks (a later wave deletes them),
 *     .bp-canvas-* node-view chrome, and the valueref stale-marker /
 *     clickable-cursor affordances (Studio-only; the reader emits valuerefs
 *     as plain text).
 */
/* ── `--paper-*` reading-surface theme tokens are now GENERATED into the marker
   region below (design/tokens.json color.paper.surface → design/emit.mjs; VERBATIM
   capture, ts-w1). What stays hand-authored here: the serif/mono FONT stacks and
   the callout `--bp-tone-*` companions (the latter become the paperCallout token
   family in a later wave). */
html[data-theme="dark"] .bp-paper-surface,
html[data-theme="dark"] .bp-paper-body {
  /* Callout TONE tokens — DARK companions (authored): deepened bg, lifted fg,
     consistent with the cool bp-dark token style above; kept readable-contrast.
     Light values are lifted verbatim from Util.tone_palette/1 (fallback block). */
  --bp-tone-info-bg:    #172032; --bp-tone-info-fg:    #9db8ff;
  --bp-tone-success-bg: #12241c; --bp-tone-success-fg: #5fcf9c;
  --bp-tone-warning-bg: #2a2210; --bp-tone-warning-fg: #e3b661;
  --bp-tone-danger-bg:  #2a1614; --bp-tone-danger-fg:  #f08a80;
  --bp-tone-neutral-bg: #23211e; --bp-tone-neutral-fg: #c9c2b6;
}
/* Fallback fonts + callout companions so a pre-paint no-data-theme load still gets
   the light bp theme. The `--paper-*` colour fallback is in the GENERATED marker
   region below (the html[data-theme] blocks win over it, as before). */
.bp-paper-surface, .bp-paper-body {
  /* Reading serif. Iowan Old Style leads the stack — the macOS system serif the
     ORIGINAL Portable Doc editor renders in — so native reads pixel-match the
     editor where the OS has that face. Source Serif 4 IS self-hosted now
     (@font-face'd variable woff2, Roman + Italic, since #1984 — see
     root.html.heex), so it supplies the same serif everywhere the OS lacks
     Iowan; it is a real font here, not a bare fallback name. The stack ORDER and
     these font values are owned by au-w5-reading-typography (human-gated) — do
     not reorder or retune them here. */
  --paper-font-serif: var(--tok-reading-font, "Iowan Old Style", "Palatino Linotype", Palatino, Charter, Georgia, 'Source Serif 4', serif);
  --paper-font-mono: ui-monospace, Menlo, monospace;
  /* Callout TONE tokens — LIGHT (default). Values lifted VERBATIM from
     Util.tone_palette/1 (util.ex): unknown tone falls back to info there, and
     the `bp-callout--info` modifier is the emitted default here too. Dark
     companions live in the html[data-theme="dark"] block above. */
  --bp-tone-info-bg:    #e9eff7; --bp-tone-info-fg:    #2d5e8f;
  --bp-tone-success-bg: #e7f2ec; --bp-tone-success-fg: #1e6b52;
  --bp-tone-warning-bg: #f7f0df; --bp-tone-warning-fg: #8a6420;
  --bp-tone-danger-bg:  #f7e9e6; --bp-tone-danger-fg:  #a63a2e;
  --bp-tone-neutral-bg: #edf0ee; --bp-tone-neutral-fg: #4a544f;
}

/* ── Paper TYPOGRAPHY tokens (Stage-1 single-source — Goal editor-parity).
   These `--bp-*` reading-scale vars feed BOTH the VIEW (`.bp-paper-surface
   h1/p/li/...`) and EDIT (`.bp-paper-editor-body h1/p/li/...`) rules below.
   Both panes descend from `.bp-paper-surface` (the Edit body lives inside
   `<main class="bp-paper-shell bp-paper-surface">`), so both INHERIT these
   — the two rule sets no longer have to be hand-matched byte-for-byte.
   The NUMBERS themselves are NO LONGER hand-authored here: size/line-height/
   heading-weight VAR-BRIDGE onto the emitted `--tok-reading-*` block (from
   design/tokens.json via design/emit.mjs), declared just below on this same
   `.bp-paper-surface, .bp-paper-body` scope, so the un-fallbacked var()s always
   resolve. tokens.json is now the ONE source; change a reading value THERE and
   `node design/emit.mjs --write` moves View AND Edit together. Only the
   `--bp-*-tracking` letter-spacings stay hand-authored (no `--tok` twin exists).
   Still byte-aligned with the standalone bundle (api/assets/paper-editor/src/
   styles.css `:root`, re-derived by the mirror) and with render.ex
   heading_style/2 INLINE values (h1 1.1/-0.02em, h2 1.2, h3 1.25 — the View
   inline wins, so these mirror it).
   NOTE: the VIEW-only list bottom-margin (`ul,ol { margin:0 0 24px }`) is
   deliberately NOT a token — it belongs to VIEW alone (pulling it into Edit
   re-introduces double-spacing; see styles.css :84). */
.bp-paper-surface, .bp-paper-body {
  --bp-body-size: var(--tok-reading-body-size);
  --bp-body-lh: var(--tok-reading-body-lh);
  --bp-body-tracking: 0.005em;
  --bp-h1-size: var(--tok-reading-h1-size);   --bp-h1-lh: var(--tok-reading-h1-lh);   --bp-h1-tracking: -0.02em;
  --bp-h2-size: var(--tok-reading-h2-size);   --bp-h2-lh: var(--tok-reading-h2-lh);
  --bp-h3-size: var(--tok-reading-h3-size);   --bp-h3-lh: var(--tok-reading-h3-lh);
  --bp-heading-weight: var(--tok-reading-heading-weight);
  --bp-para-margin-top: 12pt;
  --bp-li-gap: 4pt;
  --bp-list-indent: 24px;
  --bp-code-size: 0.92em;
  --bp-code-pad: 0.08em 0.35em;
  --bp-code-radius: 3px;
  --bp-pre-size: 14px;
  --bp-pre-lh: 1.5;
  --bp-pre-pad: 14px 16px;
  --bp-pre-margin: 0 0 22px;
  --bp-pre-radius: 4px;
  /* Code-BLOCK frame tokens (S9 code-interior). DISTINCT from --bp-pre-* (the
     generic 14px <pre>) and --bp-code-* (the inline-code chip): the article code
     block is its own hardcoded terracotta-left-accent frame. These single-source
     the literals Figures.code_block_html/1 + the .bp-canvas-code editor frame both
     paint, so View↔Edit move together. */
  --bp-codeblock-size: 0.9rem;
  --bp-codeblock-lh: 1.5;
  --bp-codeblock-pad: 0.9rem 1.1rem;
  --bp-codeblock-margin: 1.2rem 0;
  --bp-codeblock-radius: 0;
  --bp-codeblock-accent-w: 3px;
  --bp-img-margin: 0 0 22px;
  --bp-img-radius: 3px;
}

/* ── Block typography (ported from paper.css). These apply to BOTH the
   View-mode read-only stream rows and the Edit-mode block list, so a
   paper reads as clean prose in either mode. */
.bp-paper-surface h1, .bp-paper-surface h2, .bp-paper-surface h3,
.bp-paper-surface h4, .bp-paper-surface h5, .bp-paper-surface h6 {
  font-family: var(--paper-font-serif);
  font-weight: var(--bp-heading-weight); color: var(--paper-ink);
}
/* Heading margins are intentionally ZERO. The user controls vertical
   rhythm via block-level spacing (`.bp-paper-edit-block` gap) — baking
   margin into the heading itself fights the block model and makes the
   end result hard to author.

   line-height + letter-spacing values match render.ex `heading_style/2`
   INLINE values (level1: 1.1 / -0.02em, level2: 1.2, level3: 1.25). The
   inline wins on the View pane, so the Edit pane CSS must mirror it to
   keep View ↔ Edit byte-aligned. (Parity audit caught the previous
   1.3 / -0.01em CSS as visible drift against the inline.) */
/* Heading vertical rhythm — TOP-only margins so the flat edit ProseMirror
   (siblings, margins collapse) and the div-wrapped reader (no collapse) land on
   the SAME spacing: with zero bottom margins, additive==collapsed. This single
   source feeds both surfaces; the first heading is clamped to 0 by each surface's
   :first-child rule. */
.bp-paper-surface h1 { font-size: var(--bp-h1-size); line-height: var(--bp-h1-lh);  letter-spacing: var(--bp-h1-tracking); margin: 1.2em 0 0; }
.bp-paper-surface h2 { font-size: var(--bp-h2-size); line-height: var(--bp-h2-lh);  margin: 1.9em 0 0; }
.bp-paper-surface h3 { font-size: var(--bp-h3-size); line-height: var(--bp-h3-lh); margin: 1.5em 0 0; }
.bp-paper-surface p  { margin: var(--bp-para-margin-top) 0 0; hyphens: auto; }
.bp-paper-surface a  {
  color: var(--paper-accent); text-decoration: none;
  border-bottom: 1px solid var(--paper-accent-soft);
}
/* `margin: 0 0 24px` bottom-gap is VIEW-ONLY (Edit omits it — see token block). */
.bp-paper-surface ul, .bp-paper-surface ol { margin: 0 0 24px; padding-left: var(--bp-list-indent); }
.bp-paper-surface li { margin: var(--bp-li-gap) 0 0; }
.bp-paper-surface ul li { list-style: disc; }
.bp-paper-surface ol li { list-style: decimal; }
.bp-paper-surface code {
  font-family: var(--paper-font-mono); font-size: var(--bp-code-size);
  background: var(--paper-bg-deep); padding: var(--bp-code-pad); border-radius: var(--bp-code-radius);
}
.bp-paper-surface pre {
  font-family: var(--paper-font-mono); font-size: var(--bp-pre-size); line-height: var(--bp-pre-lh);
  background: var(--paper-bg-deep); border: 1px solid var(--paper-rule);
  border-radius: var(--bp-pre-radius); padding: var(--bp-pre-pad); margin: var(--bp-pre-margin); overflow-x: auto;
}
.bp-paper-surface img {
  display: block; max-width: 100%; height: auto; margin: var(--bp-img-margin);
  border-radius: var(--bp-img-radius); border: 1px solid var(--paper-rule); background: var(--paper-bg-deep);
}

/* ── Article component classes (Stage 2, wave 2 · charter Decisions 2-4).
   Emitted by Render.Walk in `:article` mode (roles/tones/chrome now carry
   `bp-*` classes instead of inline THEME styles). Every value here is lifted
   VERBATIM from the pre-Stage-2 walk.ex inline declarations, translating the
   article palette's `pal.*` fields to the SAME tokens the palette resolved
   (accent → --paper-accent, muted → --paper-ink-soft, rule → --paper-rule,
   ink → --paper-ink, heading font → --paper-font-serif, code_bg →
   --paper-bg-deep). View and Edit resolve THESE selectors — parity by
   construction. Author DATA (marks, geometry, sheet b/i/bg/al + col widths +
   error mark, hr thickness) stays INLINE on the same element. */

/* Text ROLES (apply_text_role). Author marks (italic/bold/colour) still ride
   inline on the same span; these own only the role typography. */
.bp-paper-surface .bp-role-eyebrow {
  font-family: var(--paper-font-serif); color: var(--paper-accent);
  letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; font-size: 0.78rem;
}
.bp-paper-surface .bp-role-byline {
  border-bottom: 1px solid var(--paper-rule); padding-bottom: 0.6rem; margin: 0 0 1.4rem;
  color: var(--paper-ink-soft); font-family: var(--paper-font-serif); font-size: 0.9rem;
}
.bp-paper-surface .bp-role-ingress {
  color: var(--paper-ink); line-height: 1.5; font-weight: 500; font-size: 1.28rem;
}
.bp-paper-surface .bp-role-pullquote {
  display: block; margin: 1.6rem 0; padding: 0.2rem 0 0.2rem 1.2rem;
  border-left: 3px solid var(--paper-reading-accent); color: var(--paper-ink-soft);
  line-height: 1.5; font-size: 1.2rem;
}

/* Callout TONES. `bp-callout` is the card; `bp-callout--<tone>` resolves the
   tone token pair (light + dark, defined above). */
.bp-paper-surface .bp-callout { padding: 16px; border-left: 4px solid transparent; }
.bp-paper-surface .bp-callout--info    { background: var(--bp-tone-info-bg);    color: var(--bp-tone-info-fg);    border-left-color: var(--bp-tone-info-fg); }
.bp-paper-surface .bp-callout--success { background: var(--bp-tone-success-bg); color: var(--bp-tone-success-fg); border-left-color: var(--bp-tone-success-fg); }
.bp-paper-surface .bp-callout--warning { background: var(--bp-tone-warning-bg); color: var(--bp-tone-warning-fg); border-left-color: var(--bp-tone-warning-fg); }
.bp-paper-surface .bp-callout--danger  { background: var(--bp-tone-danger-bg);  color: var(--bp-tone-danger-fg);  border-left-color: var(--bp-tone-danger-fg); }
.bp-paper-surface .bp-callout--neutral { background: var(--bp-tone-neutral-bg); color: var(--bp-tone-neutral-fg); border-left-color: var(--bp-tone-neutral-fg); }
.bp-paper-surface .bp-callout__summary { cursor: pointer; font-weight: bold; }
.bp-paper-surface .bp-callout__body { margin-top: 8px; }

/* Table CHROME (also the sheet's outer collapse/width). */
.bp-paper-surface .bp-table { border-collapse: collapse; width: 100%; }
.bp-paper-surface .bp-table__th {
  border-bottom: 2px solid var(--paper-rule); padding: 8px 12px; text-align: left;
  text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.78rem;
  color: var(--paper-ink-soft); font-family: var(--paper-font-serif);
}
.bp-paper-surface .bp-table__td {
  border-bottom: 1px solid var(--paper-rule); padding: 8px 12px; vertical-align: top;
}

/* Sheet CHROME (band + cell rules). Author DATA — col width, per-cell
   b/i/bg/al, engine-error red/bold — stays INLINE on the <td> (sheets_parity). */
.bp-paper-surface .bp-sheet__th {
  border-bottom: 2px solid var(--paper-rule); padding: 6px 10px; text-align: left;
  text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.78rem;
  color: var(--paper-ink-soft); font-family: var(--paper-font-serif);
}
.bp-paper-surface .bp-sheet__td {
  border-bottom: 1px solid var(--paper-rule); padding: 6px 10px; vertical-align: top;
  font-family: var(--paper-font-mono); font-size: 0.88rem;
}
.bp-paper-surface .bp-sheet-note { margin: 6px 0 0; font-size: 0.8rem; color: var(--paper-ink-soft); }
/* Whole-string URL cell → accent anchor (the old hardcoded #2563eb was wrong in dark).
   `border-bottom: none` cancels the `.bp-paper-surface a` at-rest link border —
   underline + border would read as a double underline (same reason
   `.bp-button--primary` declares `border: none` below). */
.bp-paper-surface .bp-sheet-link { color: var(--paper-accent); text-decoration: underline; border-bottom: none; }

/* Internal-reference + chip frames. The chip-shaped anchors (`.bp-tag`,
   `.bp-blockref`) cancel the element `a` rule's accent-soft bottom border —
   a chip/micro-ref must own its whole frame; the pre-Stage-2 design had no
   underline affordance on them. `.bp-wikilink` deliberately KEEPS it: a
   wikilink is a real link and shares the prose link's at-rest border. */
.bp-paper-surface .bp-wikilink { color: var(--paper-accent); text-decoration: none; }
.bp-paper-surface .bp-wikilink--unresolved { text-decoration: underline dotted; }
.bp-paper-surface .bp-task-chip { white-space: nowrap; }
.bp-paper-surface .bp-task-chip__badge {
  border: 1px solid var(--paper-accent); border-radius: 10px; padding: 0 6px;
  color: var(--paper-accent); font-size: 0.85em;
}
.bp-paper-surface .bp-tag {
  color: var(--paper-accent); background: var(--paper-bg-deep); padding: 1px 6px;
  border-radius: 3px; font-size: 0.9em; text-decoration: none; border-bottom: none;
}
.bp-paper-surface .bp-embed {
  margin: 1em 0; padding: 0.25em 0 0.25em 1em; border-left: 3px solid var(--paper-accent);
}
.bp-paper-surface .bp-embed--unresolved {
  padding: 0.5em 0.75em; border-left-color: var(--paper-bg-deep);
  color: var(--paper-ink-soft); font-style: italic;
}
.bp-paper-surface .bp-blockref { color: var(--paper-ink-soft); font-size: 0.9em; text-decoration: none; border-bottom: none; }

/* Buttons — `bp-button` is the secondary (outline); `--primary` overrides to
   the accent fill (no border, matching the pre-Stage-2 inline box exactly). */
.bp-paper-surface .bp-button {
  display: inline-block; padding: 10px 20px; border: 2px solid var(--paper-accent);
  color: var(--paper-accent); text-decoration: none; font-weight: bold; border-radius: 0;
}
.bp-paper-surface .bp-button--primary {
  border: none; background: var(--paper-accent); color: #ffffff;
}

/* Divider rule — the default; author thickness overrides via inline border-top-width. */
.bp-paper-surface .bp-hr { border: none; border-top: 1px solid var(--paper-rule); margin: 16px 0; }


/* ═══════════════════════════════════════════════════════════════════════════
   TASK LIST — the Barkpark task design language (bp-task-design-language-spec)
   Shared vocabulary with the `bp tasks` TUI: white ladder + colour-for-meaning.
   ═══════════════════════════════════════════════════════════════════════════ */
/* ── Status palette tokens — ONE source, theme-aware in BOTH directions:
   the OS default (prefers-color-scheme) AND the explicit light/dark toggle
   (html[data-theme] stamped by the viewer, which WINS over the media query).
   Defined at the surface so every task component inherits — no per-block copy,
   nothing drifts, and the toggle actually moves the status colours. ── */
/* BEGIN GENERATED: status-tones (from design/status-manifest.json — do not edit by hand; run scripts/status-manifest-check.sh --write) */
.bp-paper-surface, .bp-paper-body { --st-info: #2563eb; --st-ok: #0d9488; --st-warn: #d97706; --st-danger: #dc2626; }
@media (prefers-color-scheme: dark) {
  .bp-paper-surface, .bp-paper-body { --st-info: #60a5fa; --st-ok: #2dd4bf; --st-warn: #fbbf24; --st-danger: #f87171; }
}
html[data-theme="light"] .bp-paper-surface, html[data-theme="light"] .bp-paper-body { --st-info: #2563eb; --st-ok: #0d9488; --st-warn: #d97706; --st-danger: #dc2626; }
html[data-theme="dark"] .bp-paper-surface, html[data-theme="dark"] .bp-paper-body { --st-info: #60a5fa; --st-ok: #2dd4bf; --st-warn: #fbbf24; --st-danger: #f87171; }
/* END GENERATED: status-tones */

/* BEGIN GENERATED: tokens (design/tokens.json — regenerate: node design/emit.mjs --write; do not hand-edit) */
/* ── `--paper-*` reading-surface theme tokens (color.paper.surface — relocated
   from the hand region into this GENERATED block; Barkpark aesthetic-unification:
   cool near-white ground, evergreen accent, replacing the legacy warm parchment).
   Scoped to .bp-paper-surface; the html[data-theme] blocks win over the light
   fallback so a pre-paint no-data-theme load still gets the light bp theme. */
html[data-theme="light"] .bp-paper-surface,
html[data-theme="light"] .bp-paper-body {
  --paper-bg: #f6faf9;
  --paper-bg-deep: #eaf1ee;
  --paper-ink: #15211d;
  --paper-ink-soft: #55635e;
  --paper-ink-faint: #82918b;
  --paper-rule: rgba(21, 33, 29, 0.09);
  --paper-edit-hover: rgba(21, 33, 29, 0.08);
  --paper-accent: #1e5347;
  --paper-accent-soft: rgba(30, 83, 71, 0.10);
  --paper-chrome-bg: #f6faf9;
  --paper-chrome-border: rgba(21, 33, 29, 0.12);

/* ── task detail — the "open a task and SEE it" card ── */
.bp-paper-surface .bp-tdetail {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  border: 1px solid var(--paper-chrome-border); border-radius: 12px; padding: 1.1rem 1.2rem; margin: 1.6rem 0;
}
.bp-paper-surface .bp-tdetail__title { font-family: var(--paper-font-serif); font-weight: 700; font-size: 1.15rem; color: var(--paper-ink); }
.bp-paper-surface .bp-tdetail__meta { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.55rem; font-family: var(--paper-font-mono); font-size: 0.8rem; color: var(--paper-ink-soft); }
.bp-paper-surface .bp-tdetail__stamp { font-family: var(--paper-font-mono); font-size: 0.72rem; color: var(--paper-ink-faint); margin-top: 0.4rem; }
.bp-paper-surface .bp-tdetail__timeline { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; margin-top: 0.8rem; padding: 0.6rem 0; border-top: 1px solid var(--paper-rule); border-bottom: 1px solid var(--paper-rule); font-size: 0.76rem; color: var(--paper-ink-soft); }
.bp-paper-surface .bp-tl__seg { display: inline-flex; align-items: center; gap: 0.3rem; }
.bp-paper-surface .bp-tl__arr { color: var(--paper-ink-faint); }
.bp-paper-surface .bp-tdetail__desc { font-size: 0.9rem; color: var(--paper-ink); line-height: 1.55; margin-top: 0.9rem; }
.bp-paper-surface .bp-tdetail__lbl { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--paper-ink-faint); font-weight: 700; margin: 1rem 0 0.45rem; }
.bp-paper-surface .bp-crit { display: flex; align-items: flex-start; gap: 0.5rem; font-size: 0.84rem; color: var(--paper-ink); }
.bp-paper-surface .bp-crit--met .bp-crit__t { color: var(--paper-ink-soft); }
.bp-paper-surface .bp-crit__t { flex: 1; min-width: 0; }
.bp-paper-surface .bp-crit__ev { padding-left: 1.85rem; color: var(--paper-ink-faint); font-size: 0.76rem; margin: 0.1rem 0 0.3rem; }
.bp-paper-surface .bp-tdetail__deps { font-family: var(--paper-font-mono); font-size: 0.8rem; color: var(--paper-ink-soft); }
.bp-paper-surface .bp-tdetail__rail { display: flex; flex-direction: column; gap: 0.25rem; }
.bp-paper-surface .bp-rail__r { display: flex; align-items: center; gap: 0.5rem; font-size: 0.82rem; color: var(--paper-ink); }
.bp-paper-surface .bp-rail__paper { font-family: var(--paper-font-mono); font-size: 0.76rem; color: var(--paper-accent); }
.bp-paper-surface .bp-rail__more { font-size: 0.72rem; color: var(--paper-ink-faint); padding-left: 0.3rem; }
.bp-paper-surface .bp-tdetail__labels { font-family: var(--paper-font-mono); font-size: 0.72rem; color: var(--paper-ink-faint); margin-top: 0.9rem; }

/* ── task board (kanban) ── */
.bp-paper-surface .bp-board {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 1.6rem 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
.bp-paper-surface .bp-board__col { background: var(--paper-bg-deep); border-radius: 10px; padding: 10px; border-top: 3px solid var(--paper-ink-faint); }
.bp-paper-surface .bp-board__col--ready { border-top-color: var(--paper-ink); }
.bp-paper-surface .bp-board__col--progress { border-top-color: var(--st-info); }
.bp-paper-surface .bp-board__col--blocked { border-top-color: var(--st-warn); }
.bp-paper-surface .bp-board__col--done { border-top-color: var(--st-ok); }
.bp-paper-surface .bp-board__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.bp-paper-surface .bp-board__label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; color: var(--paper-ink-soft); }
.bp-paper-surface .bp-board__count { font-family: var(--paper-font-mono); font-size: 0.72rem; color: var(--paper-ink-faint); background: var(--paper-bg); border-radius: 999px; padding: 0 7px; }
.bp-paper-surface .bp-board__cards { display: flex; flex-direction: column; gap: 7px; }
.bp-paper-surface .bp-bcard { display: flex; align-items: flex-start; gap: 0.4rem; background: var(--paper-bg); border: 1px solid var(--paper-chrome-border); border-radius: 7px; padding: 8px 10px; }
.bp-paper-surface .bp-bcard__t { flex: 1; min-width: 0; font-size: 0.8rem; color: var(--paper-ink); line-height: 1.35; }
.bp-paper-surface .bp-bcard__m { display: flex; gap: 8px; align-items: center; margin-top: 4px; }

/* ── roadmap (author-dated phase/task bars) ── */
.bp-paper-surface .bp-roadmap {
  border: 1px solid var(--paper-chrome-border); border-radius: 12px; padding: 14px 16px; margin: 1.6rem 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-x: auto;
}
.bp-paper-surface .bp-rm__scale { display: flex; margin-left: 34%; border-bottom: 1px solid var(--paper-rule); padding-bottom: 5px; margin-bottom: 8px; }
.bp-paper-surface .bp-rm__scale span { flex: 1; font-family: var(--paper-font-mono); font-size: 0.66rem; color: var(--paper-ink-faint); }
.bp-paper-surface .bp-rm__lanes { display: flex; flex-direction: column; gap: 6px; }
.bp-paper-surface .bp-rm__lane { display: flex; align-items: center; gap: 10px; }
.bp-paper-surface .bp-rm__lane--phase .bp-rm__lbl { font-weight: 700; color: var(--paper-ink); }
.bp-paper-surface .bp-rm__lane--phase .bp-rm__bar { opacity: 0.32; height: 8px; top: 8px; }
.bp-paper-surface .bp-rm__lbl { width: 34%; flex: none; font-size: 0.78rem; color: var(--paper-ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 10px; }
.bp-paper-surface .bp-rm__track { position: relative; flex: 1; height: 22px; background: var(--paper-bg-deep); border-radius: 5px; }
.bp-paper-surface .bp-rm__bar { position: absolute; top: 5px; height: 12px; border-radius: 4px; min-width: 3px; }
.bp-paper-surface .bp-rm__bar--open { background: var(--paper-ink); opacity: 0.35; }
.bp-paper-surface .bp-rm__bar--ready { background: var(--paper-ink); opacity: 0.55; }
.bp-paper-surface .bp-rm__bar--progress { background: var(--st-info); }
.bp-paper-surface .bp-rm__bar--blocked { background: var(--st-warn); }
.bp-paper-surface .bp-rm__bar--done { background: var(--st-ok); }
.bp-paper-surface .bp-rm__bar--cancel { background: var(--paper-ink-faint); }
.bp-paper-surface .bp-rm__today { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--st-danger); opacity: 0.6; }

/* ── status legend — the shared vocabulary key ── */
.bp-paper-surface .bp-legend {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  border: 1px solid var(--paper-chrome-border); border-radius: 10px; overflow: hidden; margin: 1.4rem 0;
}
.bp-paper-surface .bp-legend__r { display: flex; align-items: center; gap: 0.7rem; padding: 0.5rem 0.9rem; border-top: 1px solid var(--paper-rule); font-size: 0.82rem; }
.bp-paper-surface .bp-legend__r:first-child { border-top: none; }
.bp-paper-surface .bp-legend__n { font-family: var(--paper-font-mono); font-size: 0.74rem; font-weight: 600; color: var(--paper-ink); width: 6.5rem; flex: none; }
.bp-paper-surface .bp-legend__d { color: var(--paper-ink-soft); }

/* ── notes: annotated label-chip list (the "what upgraded" column) ── */
.bp-paper-surface .bp-notes { display: flex; flex-direction: column; gap: 0.9rem; margin: 1.4rem 0; }
.bp-paper-surface .bp-note { display: grid; grid-template-columns: 5.5rem 1fr; gap: 0.9rem; align-items: baseline; }
.bp-paper-surface .bp-note__k { font-family: var(--paper-font-mono); font-size: 0.68rem; font-weight: 700; text-transform: lowercase; letter-spacing: 0.02em; color: var(--paper-accent); background: color-mix(in srgb, var(--paper-accent) 12%, transparent); border-radius: 5px; padding: 2px 7px; text-align: center; }
.bp-paper-surface .bp-note__d { font-size: 0.92rem; color: var(--paper-ink-soft); line-height: 1.55; }
.bp-paper-surface .bp-note__d b { color: var(--paper-ink); font-weight: 600; }
@media (max-width: 520px) { .bp-paper-surface .bp-note { grid-template-columns: 1fr; gap: 0.3rem; } .bp-paper-surface .bp-note__k { justify-self: start; } }

/* ── terminal chrome — the bp tasks board look ── */
.bp-paper-surface .bp-term {
  background: var(--paper-bg-deep); border: 1px solid var(--paper-chrome-border); border-radius: 12px; overflow: hidden; margin: 1.6rem 0;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 18px 44px -24px rgba(0,0,0,0.28);
}
.bp-paper-surface .bp-term__bar { display: flex; align-items: center; gap: 0.7rem; padding: 0.6rem 0.9rem; border-bottom: 1px solid var(--paper-rule); background: color-mix(in srgb, var(--paper-ink) 4%, transparent); }
.bp-paper-surface .bp-term__dots { display: inline-flex; gap: 6px; }
.bp-paper-surface .bp-term__dots i { width: 11px; height: 11px; border-radius: 50%; background: var(--paper-ink-faint); opacity: 0.55; }
.bp-paper-surface .bp-term__dots i:nth-child(1) { background: #ef4444; opacity: 0.85; }
.bp-paper-surface .bp-term__dots i:nth-child(2) { background: #f59e0b; opacity: 0.85; }
.bp-paper-surface .bp-term__dots i:nth-child(3) { background: #22c55e; opacity: 0.85; }
.bp-paper-surface .bp-term__title { font-family: var(--paper-font-mono); font-size: 0.76rem; color: var(--paper-ink-soft); }
.bp-paper-surface .bp-term__live { margin-left: auto; font-family: var(--paper-font-mono); font-size: 0.72rem; color: var(--st-ok); display: inline-flex; align-items: center; gap: 5px; }
.bp-paper-surface .bp-term__live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--st-ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--st-ok) 22%, transparent); }
.bp-paper-surface .bp-term__body { padding: 0.5rem 0.4rem; }
.bp-paper-surface .bp-term__body .bp-tasks { margin: 0; }
.bp-paper-surface .bp-term__foot { padding: 0.55rem 0.95rem; border-top: 1px solid var(--paper-rule); font-family: var(--paper-font-mono); font-size: 0.7rem; color: var(--paper-ink-faint); }

/* ── columns — responsive multi-column layout ── */
.bp-paper-surface .bp-cols { display: grid; grid-template-columns: repeat(var(--bp-cols, 2), minmax(0, 1fr)); gap: 1.6rem; margin: 1.4rem 0; align-items: start; }
@media (max-width: 720px) { .bp-paper-surface .bp-cols { grid-template-columns: 1fr; } }
.bp-paper-surface .bp-cols__c { min-width: 0; }
.bp-paper-surface .bp-cols__c > :first-child { margin-top: 0; }

/* ── section grid — the step-2 layout engine (mode:grid). Shared class so the
   reader AND the canvas node-view paint the SAME grid (parity by construction).
   `--bp-tracks` is a structural column count; `--bp-grid-gap` is a token VAR
   (never px — D2). Keep BYTE-IDENTICAL with the styles.css + root.html.heex
   mirrors (the .bp-cols trio precedent). */
.bp-paper-surface .bp-section__grid { display: grid; grid-template-columns: repeat(var(--bp-tracks, 2), minmax(0, 1fr)); gap: var(--bp-grid-gap, 1.6rem); }
@media (max-width: 720px) { .bp-paper-surface .bp-section__grid { grid-template-columns: 1fr; } }
.bp-paper-surface .bp-section__cell { min-width: 0; }
.bp-paper-surface .bp-section__cell > :first-child { margin-top: 0; }

/* ── cards: titled rule/feature card grid ── */
.bp-paper-surface .bp-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin: 1.4rem 0; }
.bp-paper-surface .bp-card { background: var(--paper-bg-deep); border: 1px solid var(--paper-chrome-border); border-radius: 10px; padding: 13px 15px; border-top: 3px solid var(--paper-chrome-border); }
.bp-paper-surface .bp-card--info { border-top-color: var(--st-info); }
.bp-paper-surface .bp-card--ok { border-top-color: var(--st-ok); }
.bp-paper-surface .bp-card--warn { border-top-color: var(--st-warn); }
.bp-paper-surface .bp-card--danger { border-top-color: var(--st-danger); }
/* bp-card__t/__d stay: the LEGACY `cards` fleet grid (components.ex cards_html/1)
 * still emits them. The card WIDGET's model-A slot-chrome rules (__media/__action,
 * STEP 4) are GONE (S10, parity2-bug-card-slot-chrome): model B recurses slots to
 * bare semantics (h2 / p / img / a.bp-button) — no reader element carried them. */
.bp-paper-surface .bp-card__t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 0.9rem; color: var(--paper-ink); }
.bp-paper-surface .bp-card__d { font-size: 0.85rem; color: var(--paper-ink-soft); line-height: 1.5; margin-top: 6px; }
/* STEP 4 canvas edit hook — a light hover-revealed control row; chrome only (bp-canvas-*). */
.bp-paper-surface .bp-canvas-card { position: relative; }
.bp-paper-surface .bp-canvas-card__controls { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; opacity: 0; transition: opacity 0.12s ease; }
.bp-paper-surface .bp-canvas-card:hover .bp-canvas-card__controls, .bp-paper-surface .bp-canvas-card:focus-within .bp-canvas-card__controls { opacity: 1; }
.bp-paper-surface .bp-canvas-card__input { flex: 1 1 120px; min-width: 0; font-size: 0.75rem; padding: 3px 6px; border: 1px solid var(--paper-chrome-border); border-radius: 6px; background: var(--paper-bg); color: var(--paper-ink); }

/* stage WIDGET canvas node-view (DESIGN 1 — the editable pipeline-node twin). The
 * stage does NOT emit the reader `.bp-pnode` cell class (it stays gate-forbidden to
 * protect the legacy pipeline), so its cell look is hand-mirrored here from the
 * `.bp-pnode*` rules above — keep BYTE-ALIGNED. Studio mounts the canvas inside
 * `.bp-paper-surface`, so this scope paints it. The reader never emits bp-canvas-stage,
 * so these rules are inert on the reader surface. */
.bp-paper-surface .bp-canvas-stage { display: flex; flex-direction: column; min-width: 130px; background: var(--paper-bg-deep); border: 1px solid var(--paper-chrome-border); border-radius: 10px; padding: 11px 13px; }
.bp-paper-surface .bp-canvas-stage--src { border-color: var(--paper-accent); }
.bp-paper-surface .bp-canvas-stage__k, .bp-paper-surface .bp-canvas-stage__t, .bp-paper-surface .bp-canvas-stage__d, .bp-paper-surface .bp-canvas-stage__f { border: 0; background: transparent; width: 100%; padding: 0; outline: none; color: inherit; }
.bp-paper-surface .bp-canvas-stage__k { font-family: var(--paper-font-mono); font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--paper-accent); }
.bp-paper-surface .bp-canvas-stage__t { font-weight: 600; font-size: 0.88rem; color: var(--paper-ink); margin-top: 4px; }
.bp-paper-surface .bp-canvas-stage__d { font-size: 0.78rem; color: var(--paper-ink-soft); margin-top: 5px; line-height: 1.45; }
.bp-paper-surface .bp-canvas-stage__f { font-family: var(--paper-font-mono); font-size: 0.66rem; color: var(--paper-ink-faint); margin-top: 8px; word-break: break-word; }
.bp-paper-surface .bp-canvas-stage__src-toggle { display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; font-family: var(--paper-font-mono); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--paper-ink-faint); cursor: pointer; }

/* ── pipeline: source → emit → gate flow ── */
.bp-paper-surface .bp-pipe-scroll { overflow-x: auto; margin: 1.4rem 0; }
.bp-paper-surface .bp-pipe { display: flex; align-items: stretch; gap: 8px; min-width: min-content; }
.bp-paper-surface .bp-pnode { flex: 1 1 0; min-width: 130px; background: var(--paper-bg-deep); border: 1px solid var(--paper-chrome-border); border-radius: 10px; padding: 11px 13px; }
.bp-paper-surface .bp-pnode--src { border-color: var(--paper-accent); }
.bp-paper-surface .bp-pnode__k { font-family: var(--paper-font-mono); font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--paper-accent); }
.bp-paper-surface .bp-pnode__t { font-weight: 600; font-size: 0.88rem; color: var(--paper-ink); margin-top: 4px; }
.bp-paper-surface .bp-pnode__d { font-size: 0.78rem; color: var(--paper-ink-soft); margin-top: 5px; line-height: 1.45; }
.bp-paper-surface .bp-pnode__f { font-family: var(--paper-font-mono); font-size: 0.66rem; color: var(--paper-ink-faint); margin-top: 8px; word-break: break-word; }
.bp-paper-surface .bp-pnode__src { font-family: var(--paper-font-mono); font-size: 0.64rem; color: var(--paper-accent); margin-top: 8px; word-break: break-word; }
.bp-paper-surface .bp-pipe__arr { display: flex; align-items: center; color: var(--paper-ink-faint); font-size: 1.1rem; flex: none; }

/* ── data-viz slate: stat / stats / heatmap / chart (gui-premium w1) ──
   Browser twins of the pdrender creative slate. All color resolves through the
   paper tokens; intensity/series index only ever drive a custom property or an
   indexed class — author data never carries color. */
.bp-paper-surface .bp-dataviz--empty { margin: 1.4rem 0; padding: 10px 13px; border: 1px dashed var(--paper-chrome-border); border-radius: 10px; color: var(--paper-ink-faint); font-family: var(--paper-font-mono); font-size: 0.72rem; }

.bp-paper-surface .bp-stat { display: inline-flex; flex-direction: column; gap: 4px; min-width: 130px; background: var(--paper-bg-deep); border: 1px solid var(--paper-chrome-border); border-radius: 10px; padding: 13px 15px; margin: 1.4rem 0; vertical-align: top; }
.bp-paper-surface .bp-stat__v { font-family: var(--paper-font-mono); font-variant-numeric: tabular-nums; font-size: 1.7rem; font-weight: 650; line-height: 1.1; color: var(--paper-ink); letter-spacing: -0.01em; }
.bp-paper-surface .bp-stat__l { font-size: 0.72rem; color: var(--paper-ink-soft); letter-spacing: 0.01em; }
.bp-paper-surface .bp-stat__bar { height: 6px; border-radius: 3px; background: var(--paper-rule); overflow: hidden; margin-bottom: 4px; }
.bp-paper-surface .bp-stat__bar i { display: block; height: 100%; border-radius: 3px; background: var(--paper-accent); }
.bp-paper-surface .bp-stat__spark { width: 100%; height: 26px; margin-top: 4px; }
.bp-paper-surface .bp-stat__spark polyline { fill: none; stroke: var(--paper-accent); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }

.bp-paper-surface .bp-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 1.4rem 0; }
.bp-paper-surface .bp-stats .bp-stat { margin: 0; min-width: 0; display: flex; }

.bp-paper-surface .bp-heat { margin: 1.4rem 0; background: var(--paper-bg-deep); border: 1px solid var(--paper-chrome-border); border-radius: 10px; padding: 13px 15px; display: inline-block; }
.bp-paper-surface .bp-heat__grid { display: grid; gap: 4px; align-items: center; }
.bp-paper-surface .bp-heat__c { aspect-ratio: 1; min-height: 10px; border-radius: 3px; background: color-mix(in srgb, var(--paper-accent) calc(var(--i, 0) * 88%), var(--paper-rule)); }
.bp-paper-surface .bp-heat__rl, .bp-paper-surface .bp-heat__cl { font-family: var(--paper-font-mono); font-size: 0.64rem; color: var(--paper-ink-soft); }
.bp-paper-surface .bp-heat__rl { padding-right: 8px; text-align: right; }
.bp-paper-surface .bp-heat__cl { text-align: center; }
.bp-paper-surface .bp-heat__legend { display: flex; align-items: center; gap: 4px; margin-top: 10px; font-family: var(--paper-font-mono); font-size: 0.64rem; color: var(--paper-ink-faint); }
.bp-paper-surface .bp-heat__legend .bp-heat__c { width: 10px; flex: none; }

.bp-paper-surface .bp-chart { margin: 1.4rem 0; background: var(--paper-bg-deep); border: 1px solid var(--paper-chrome-border); border-radius: 10px; padding: 13px 15px; }
.bp-paper-surface .bp-chart__t { font-size: 0.78rem; font-weight: 600; color: var(--paper-ink); margin-bottom: 8px; }
.bp-paper-surface .bp-chart svg { display: block; width: 100%; height: auto; }
.bp-paper-surface .bp-chart__grid { stroke: var(--paper-rule); stroke-width: 1; vector-effect: non-scaling-stroke; }
.bp-paper-surface .bp-chart__axis { stroke: var(--paper-ink-faint); stroke-width: 1; vector-effect: non-scaling-stroke; }
.bp-paper-surface .bp-chart__tick { fill: var(--paper-ink-faint); font-family: var(--paper-font-mono); font-size: 11px; }
.bp-paper-surface .bp-chart__s { fill: none; stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.bp-paper-surface .bp-chart__b { stroke: none; opacity: 0.85; }
.bp-paper-surface .bp-chart__s0 { stroke: var(--paper-accent); }
.bp-paper-surface .bp-chart__s1 { stroke: var(--bp-tone-info-fg, #3b82f6); }
.bp-paper-surface .bp-chart__s2 { stroke: var(--bp-tone-warning-fg, #b45309); }
.bp-paper-surface .bp-chart__s3 { stroke: var(--bp-tone-danger-fg, #b91c1c); }
.bp-paper-surface rect.bp-chart__s0 { fill: var(--paper-accent); }
.bp-paper-surface rect.bp-chart__s1 { fill: var(--bp-tone-info-fg, #3b82f6); }
.bp-paper-surface rect.bp-chart__s2 { fill: var(--bp-tone-warning-fg, #b45309); }
.bp-paper-surface rect.bp-chart__s3 { fill: var(--bp-tone-danger-fg, #b91c1c); }
.bp-paper-surface .bp-chart__legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; }
.bp-paper-surface .bp-chart__key { display: inline-flex; align-items: center; gap: 6px; font-family: var(--paper-font-mono); font-size: 0.66rem; color: var(--paper-ink-soft); }
.bp-paper-surface .bp-chart__swatch { width: 14px; height: 3px; border-radius: 2px; background: currentColor; }
.bp-paper-surface .bp-chart__key .bp-chart__s0 { background: var(--paper-accent); }
.bp-paper-surface .bp-chart__key .bp-chart__s1 { background: var(--bp-tone-info-fg, #3b82f6); }
.bp-paper-surface .bp-chart__key .bp-chart__s2 { background: var(--bp-tone-warning-fg, #b45309); }
.bp-paper-surface .bp-chart__key .bp-chart__s3 { background: var(--bp-tone-danger-fg, #b91c1c); }

/* ── data-viz slate 2: calendar heatmap, quantile dual-encode, matrix Σ,
   stat denominators (gui-premium w5) ──
   Quantile bin classes bp-heat__c--b0..b3 (zero/gap = --z) carry TWO channels,
   the web read of the TUI shade ladder ░▒▓█: the color step (color-mix over
   the accent — the same idiom as the legacy `--i` ramp, stepped at 22/44/66/88%)
   AND a non-color channel — a growing ink inner marker on shade cells, the

.bp-paper-surface .bp-heat__ml { font-family: var(--paper-font-mono); font-size: 0.64rem; line-height: 1.2; color: var(--paper-ink-soft); white-space: nowrap; overflow: visible; min-width: 0; }

.bp-paper-surface .bp-heat__c--z,
.bp-paper-surface .bp-heat__c--b0,
.bp-paper-surface .bp-heat__c--b1,
.bp-paper-surface .bp-heat__c--b2,
.bp-paper-surface .bp-heat__c--b3 { position: relative; }
.bp-paper-surface .bp-heat__c--z { background: var(--paper-rule); }
.bp-paper-surface .bp-heat__c--z::after { content: ""; position: absolute; top: 50%; left: 50%; width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px; border-radius: 50%; background: var(--paper-ink-faint); }
.bp-paper-surface .bp-heat__c--b0 { background: color-mix(in srgb, var(--paper-accent) 22%, var(--paper-rule)); }
.bp-paper-surface .bp-heat__c--b1 { background: color-mix(in srgb, var(--paper-accent) 44%, var(--paper-rule)); }
.bp-paper-surface .bp-heat__c--b2 { background: color-mix(in srgb, var(--paper-accent) 66%, var(--paper-rule)); }
.bp-paper-surface .bp-heat__c--b3 { background: color-mix(in srgb, var(--paper-accent) 88%, var(--paper-rule)); }
.bp-paper-surface .bp-heat__c--b0::after,
.bp-paper-surface .bp-heat__c--b1::after,
.bp-paper-surface .bp-heat__c--b2::after,
.bp-paper-surface .bp-heat__c--b3::after { content: ""; position: absolute; border-radius: 1px; background: color-mix(in srgb, var(--paper-ink) 42%, transparent); }

.bp-paper-surface .bp-heat__c--b1::after { inset: 33%; }
.bp-paper-surface .bp-heat__c--b2::after { inset: 24%; }
.bp-paper-surface .bp-heat__c--b3::after { inset: 15%; }

   an underline strip so ink text keeps full contrast on every theme. These come
   AFTER the marker rules so the strip geometry wins at equal specificity. */
.bp-paper-surface .bp-heat__c--v { aspect-ratio: auto; min-height: 0; padding: 3px 7px 6px; font-family: var(--paper-font-mono); font-variant-numeric: tabular-nums; font-style: normal; font-size: 0.7rem; line-height: 1.3; text-align: right; color: var(--paper-ink); background: transparent; border-radius: 4px; }
.bp-paper-surface .bp-heat__c--v::after { content: ""; position: absolute; inset: auto 15% 0; top: auto; width: auto; height: 3px; margin: 0; border-radius: 2px; }
.bp-paper-surface .bp-heat__c--v.bp-heat__c--z { color: var(--paper-ink-faint); }
.bp-paper-surface .bp-heat__c--v.bp-heat__c--z::after { background: var(--paper-rule); }
.bp-paper-surface .bp-heat__c--v.bp-heat__c--b0::after { background: color-mix(in srgb, var(--paper-accent) 22%, var(--paper-rule)); }
.bp-paper-surface .bp-heat__c--v.bp-heat__c--b1::after { background: color-mix(in srgb, var(--paper-accent) 44%, var(--paper-rule)); }

.bp-paper-surface .bp-heat__c--v.bp-heat__c--b3::after { background: color-mix(in srgb, var(--paper-accent) 88%, var(--paper-rule)); }

/* Σ marginals: dim mono sums, the grand total emphasized. */
.bp-paper-surface .bp-heat__sum { font-family: var(--paper-font-mono); font-variant-numeric: tabular-nums; font-size: 0.7rem; line-height: 1.3; color: var(--paper-ink-soft); text-align: right; padding: 3px 7px 6px; }
.bp-paper-surface .bp-heat__sum--grand { font-weight: 650; color: var(--paper-ink); }
.bp-paper-surface .bp-heat__cl--sum { text-align: right; padding-right: 7px; }

/* ── form / questionnaire: the premium read (gui-premium w2) ──
   forms.ex emits <fieldset class="bp-form-question bp-form-q--<type>"> cards
   with classed option rows (article mode). The stylesheet owns ALL geometry:
   numbered question cards, custom evergreen control faces (appearance:none),
   the scale + yes/no as segmented rows. Everything resolves through the paper
   tokens, so both schemes hold. */
.bp-paper-surface .bp-form { display: flex; flex-direction: column; gap: 12px; margin: 2rem 0; counter-reset: bpq; }
.bp-paper-surface .bp-form-grill::before,
.bp-paper-surface .bp-form-questionnaire::before { content: "Grill"; font-family: var(--paper-font-mono); font-size: 0.66rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--paper-accent); }
.bp-paper-surface .bp-form-questionnaire::before { content: "Questionnaire"; }

.bp-paper-surface .bp-form-question { counter-increment: bpq; margin: 0; padding: 15px 17px 17px; background: var(--paper-bg-deep); border: 1px solid var(--paper-chrome-border); border-radius: 12px; }
.bp-paper-surface .bp-form-question > legend { float: left; width: 100%; padding: 0; margin: 0; font-size: 1.02rem; font-weight: 650; line-height: 1.35; color: var(--paper-ink); }
.bp-paper-surface .bp-form-question > legend::before { content: counter(bpq, decimal-leading-zero); display: block; margin-bottom: 5px; font-family: var(--paper-font-mono); font-size: 0.62rem; font-weight: 500; letter-spacing: 0.09em; color: var(--paper-accent); }
.bp-paper-surface .bp-form-note { clear: both; font-style: italic; font-size: 0.88rem; color: var(--paper-ink-soft); margin: 0.35rem 0 0; line-height: 1.5; }
.bp-paper-surface .bp-form-opts { clear: both; display: flex; flex-direction: column; gap: 6px; padding-top: 12px; }

/* option rows — the whole row is the control */
.bp-paper-surface .bp-form-opt { display: flex; align-items: center; gap: 10px; margin: 0; padding: 9px 12px; border: 1px solid var(--paper-chrome-border); border-radius: 9px; cursor: pointer; transition: border-color 0.12s ease, background 0.12s ease; }
.bp-paper-surface .bp-form-opt:hover { border-color: var(--paper-accent); background: var(--paper-accent-soft); }
.bp-paper-surface .bp-form-opt:has(input:checked) { border-color: var(--paper-accent); background: var(--paper-accent-soft); }
.bp-paper-surface .bp-form-opt > span { font-size: 0.92rem; color: var(--paper-ink); }
.bp-paper-surface .bp-form-opt > input { appearance: none; -webkit-appearance: none; width: 16px; height: 16px; margin: 0; flex: none; border: 1.5px solid var(--paper-ink-faint); background: transparent; cursor: pointer; transition: border-color 0.12s ease, background 0.12s ease, box-shadow 0.12s ease; }
.bp-paper-surface .bp-form-opt > input[type="radio"] { border-radius: 50%; }
.bp-paper-surface .bp-form-opt > input[type="checkbox"] { border-radius: 4px; }
.bp-paper-surface .bp-form-opt > input[type="radio"]:checked { border-color: var(--paper-accent); background: var(--paper-accent); box-shadow: inset 0 0 0 3px var(--paper-bg-deep); }
.bp-paper-surface .bp-form-opt > input[type="checkbox"]:checked { border-color: var(--paper-accent); background: var(--paper-accent); }
.bp-paper-surface .bp-form-opt > input:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--paper-accent-soft); }

/* the scale + yes/no read as segmented rows; the plain lists stay stacked */
.bp-paper-surface .bp-form-q--scale .bp-form-opts,
.bp-paper-surface .bp-form-q--yesno .bp-form-opts { flex-direction: row; }
.bp-paper-surface .bp-form-q--scale .bp-form-opt,
.bp-paper-surface .bp-form-q--yesno .bp-form-opt { flex: 1 1 0; justify-content: center; padding: 10px 0; }
.bp-paper-surface .bp-form-q--scale .bp-form-opt > input,
.bp-paper-surface .bp-form-q--yesno .bp-form-opt > input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.bp-paper-surface .bp-form-q--scale .bp-form-opt > span { font-family: var(--paper-font-mono); font-variant-numeric: tabular-nums; }
.bp-paper-surface .bp-form-q--single .bp-form-opts,
.bp-paper-surface .bp-form-q--multi .bp-form-opts { flex-direction: column; }

.bp-paper-surface .bp-form-q--text textarea,
.bp-paper-surface .bp-form textarea { display: block; width: 100%; box-sizing: border-box; min-height: 5rem; padding: 10px 12px; font: inherit; font-size: 0.92rem; line-height: 1.5; color: var(--paper-ink); background: var(--paper-bg); border: 1px solid var(--paper-chrome-border); border-radius: 9px; resize: vertical; }

/* ── field blocks: the aligned definition list (gui-premium w2) ──
   The browser twin of the TUI's aligned field rows (#1497): a fixed-clamp dim

   rules between adjacent rows, value affordances (swatch / preview / sub-rows)
   in the value column. */
.bp-paper-surface .bp-field { display: grid; grid-template-columns: clamp(7rem, 24%, 11rem) minmax(0, 1fr); column-gap: 1.1rem; align-items: baseline; margin: 0; padding: 0.36rem 0; }

.bp-paper-surface .bp-field__mono { font-family: var(--paper-font-mono); font-size: 0.84em; }
.bp-paper-surface .bp-field__none { color: var(--paper-ink-faint); }

@media (max-width: 560px) { .bp-paper-surface .bp-field { grid-template-columns: 1fr; row-gap: 2px; } }

    .bp-view-toggle {

    .bp-view-toggle--email { bottom: 62px; }

    body:not(:has(.bp-paper-article)) .bp-view-toggle { display: none; }

    body.bp-tui .bp-view-toggle {

    /* toggle look in Email mode — the pill sits on the inbox ground */
    body.bp-email .bp-view-toggle--email { bottom: 20px; }
    body.bp-email .bp-view-toggle--email .bp-vt-dot { box-shadow: 0 0 6px #2f7d5b; }

    /* ── the REAL TUI render (the actual Go pdrender, compiled to WASM) ──────
       In TUI mode we HIDE the reader article and show a real TERMINAL WINDOW:
       a title bar (traffic lights + slug), and a fixed-width content column
       holding the EXACT pdrender output (ANSI→HTML by the wasm). The column is a
       stable N-column monospace grid (`--bp-cols`, default 100) — it never
       reflows to the viewport, so the render is the same width regardless of
       screen size, exactly like a terminal. This is the same renderer
       `bp paper view` runs; not a CSS imitation. */
    body.bp-tui { background: #05070a; }
    body.bp-tui .bp-paper-shell.bp-paper-article { display: none; }
    #bp-terminal { display: none; }
    body.bp-tui #bp-terminal {
      display: block;
      /* SAME max width as the reader column (.bp-paper-shell.bp-paper-article's
         max-width: 720px) — Reader view and TUI view occupy the identical
         measure, so toggling never reflows the page. 720px happens to fit a
         classic 80-column terminal exactly at this 14px monospace, so the wasm
         renders at a FIXED 80 cols (TUI_COLS below must stay in lockstep). On a
         narrower screen the box shrinks like the reader; the 80-col grid does
         NOT reflow — .bp-term-scroll scrolls horizontally inside the window. */
      width: min(720px, calc(100vw - 32px));
      margin: 26px auto 60px;
      background: #0b0e13;
      border: 1px solid #232a35;
      border-radius: 10px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.6), 0 0 0 1px #05070a;
      overflow: hidden;
    }
    #bp-terminal .bp-term-bar {
      display: flex; align-items: center; gap: 8px;
      height: 34px; padding: 0 13px;
      background: linear-gradient(#1a2029, #141922);
      border-bottom: 1px solid #232a35;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 12px; color: #6b7685;
    }
    #bp-terminal .bp-term-dots { display: inline-flex; gap: 7px; }
    #bp-terminal .bp-term-dots i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
    #bp-terminal .bp-term-dots i:nth-child(1) { background: #ff5f56; }
    #bp-terminal .bp-term-dots i:nth-child(2) { background: #ffbd2e; }
    #bp-terminal .bp-term-dots i:nth-child(3) { background: #27c93f; }
    #bp-terminal .bp-term-title { flex: 1; text-align: center; letter-spacing: 0.02em; }
    #bp-terminal .bp-term-title b { color: #aab6c4; font-weight: 600; }
    #bp-terminal .bp-term-scroll { overflow-x: auto; overflow-y: hidden; }
    #bp-terminal .bp-term-body { padding: 16px 20px 26px; width: max-content; min-width: 100%; }
    #bp-terminal .bp-term-body::before {
      content: "$ bp paper view " attr(data-slug);
      display: block; color: #5fcf9c; font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 14px; margin-bottom: 12px; opacity: 0.85;
    }
    #bp-terminal .bp-tui-pre {
      font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
      font-size: 14px; line-height: 1.5; color: #c8d3cc; white-space: pre; margin: 0;
      -webkit-font-smoothing: antialiased;
    }
    #bp-terminal .bp-tui-loading { color: #6b7972; font-family: ui-monospace, Menlo, monospace; font-size: 14px; padding: 4px 0; }
    /* ── Email view: the paper as a RECEIVED MAIL ────────────────────────────
       In Email mode we HIDE the reader article and show a MAIL CLIENT WINDOW:
       title bar, message toolbar, sender header (avatar / from / to me /
